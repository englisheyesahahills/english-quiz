<title>중등부 모의고사 OMR</title>

<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--pink:#fbe9ee;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--ok:#1f8a4c;--okbg:#e3f6ea;--no:#c0392b;--nobg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--bur:#e0708c;--pink:#3a1f29;--okbg:#14301f;--nobg:#3a1714;--ok:#5fd18f;--no:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55}
button,input{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
header .w{max-width:720px;margin:0 auto;padding:11px 16px;display:flex;gap:10px;align-items:center}
.brand{font-family:"Do Hyeon",sans-serif;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 12px;font-size:14px;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:28px;margin:4px 0}
h2{font-size:16px;margin:20px 0 8px;color:var(--bur)}
.eye{color:var(--bur);font-weight:700;font-size:13px}.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
input[type=text]{width:100%;color:var(--ink);background:var(--card);border:1.5px solid #c9cedb;border-radius:10px;padding:9px 11px}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer;font-size:16px}
.btn.bur{background:var(--bur)}.btn:disabled{opacity:.5}
.ver{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;color:var(--ink)}
.ver b{display:block}.ver span{font-size:13px;color:var(--muted)}
.ver.done{border-color:var(--ok)}
.omr{background:var(--card);border:1.5px solid var(--bur);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--pink)}
.row:last-child{border-bottom:0}
.row .n{width:34px;font-weight:700;color:var(--bur);text-align:center;flex:none}
.row .ar{font-size:11px;color:var(--muted);width:62px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bub{width:38px;height:38px;border-radius:50%;border:2px solid var(--bur);background:transparent;color:var(--bur);font-weight:700;cursor:pointer;flex:none}
.bub.on{background:var(--bur);color:#fff}
.bub.right{background:var(--ok);border-color:var(--ok);color:#fff}
.bub.wrong{background:var(--no);border-color:var(--no);color:#fff}
.sa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.sa label{font-weight:700;color:var(--navy);font-size:14px}
@media (prefers-color-scheme:dark){.sa label{color:#9fb4ff}}
.sa.ok{border-color:var(--ok)}.sa.no{border-color:var(--no)}
.fb{font-size:13px;margin-top:6px;border-radius:8px;padding:6px 9px;display:none}
.sa.ok .fb{display:block;background:var(--okbg)}.sa.no .fb{display:block;background:var(--nobg)}
.prog{font-size:13px;color:var(--muted);text-align:center;margin:6px 0}
.bar{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(transparent,var(--bg) 35%)}
.score{text-align:center;font-family:"Do Hyeon",sans-serif;font-size:44px;color:var(--bur);line-height:1.1}
.wl{font-size:14px}.wl div{padding:6px 0;border-bottom:1px dashed var(--line)}
.err{color:var(--no);font-size:14px;text-align:center;margin-top:8px}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
</style>
</head>

const SAVE_URL="https://script.google.com/macros/s/AKfycbw0SDzVf8dPrc-pX0A2g9-R3NY9z2JCZJZuvFGDlVUhRHwFNsQvRMs_2pioyOvUPgLfvA/exec";
const ORDER=[["1학년",["m1yun_saha","m1yun_dangri","m1lee_dongju"]],["2학년",["m2lee_dongju","m2yun_saha"]]];
const $=s=>document.querySelector(s),app=$("#app"),C="①②③④⑤";
const LS={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let U=LS.get("mockomr_user"),cur=null;
const SK=()=>"mockomr_"+(U?U.key:"x");
let ST=LS.get(SK())||{};
const save=()=>LS.set(SK(),ST);
const norm=s=>" "+String(s).toLowerCase().replace(/[’‘`]/g,"'")
 .replace(/\bi'm\b/g,"i am").replace(/\bit's\b/g,"it is").replace(/\bthat's\b/g,"that is").replace(/\bthere's\b/g,"there is").replace(/\b(\w+)n't\b/g,(m,a)=>a==="can"?"cannot":a==="won"?"will not":a+" not")
 .replace(/\bi've\b/g,"i have").replace(/\bwe've\b/g,"we have").replace(/\bi'll\b/g,"i will").replace(/\bhe's\b/g,"he is").replace(/\bshe's\b/g,"she is").replace(/\blet's\b/g,"let us")
 .replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()+" ";
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("stella78:"+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24)}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return "h"+(h>>>0).toString(16)}}
function loginView(msg){$("#lo").style.display="none";$("#back").style.display="none";
 app.innerHTML=`<span class="eye">MOCK EXAM · OMR</span><h1>중등부 모의고사 OMR</h1><p class="muted">STELLA 중등 학습관리 <b>로그인 코드</b>로 들어가세요. 객관식은 마킹, 서술형은 시험지에 쓴 답을 그대로 입력하면 바로 채점돼요.</p>
 <div class="card"><input type="text" id="code" maxlength="12" autocomplete="off" autocapitalize="off" placeholder="로그인 코드" style="font-size:20px;text-align:center;letter-spacing:2px"><div style="height:10px"></div><button class="btn" id="go">입장하기</button><div class="err" id="er">${msg?esc(msg):""}</div></div>
 <div class="ft">제작: 스텔라원장 · 잉글리시아이 스텔라</div>`;
 $("#go").onclick=doLogin;$("#code").onkeydown=e=>{if(e.key==="Enter")doLogin()}}
async function loginFetch(code){if(code.startsWith("이름:"))return {data:{name:code.slice(3).trim(),role:"student"}};let last;for(let i=0;i<3;i++){try{const r=await fetch(LOGIN_URL,{method:"POST",body:JSON.stringify({fn:"login",args:[code]})});if(!r.ok)throw new Error("NET "+r.status);const t=await r.text();try{return JSON.parse(t)}catch(x){throw new Error("NET 응답 오류")}}catch(e){last=e;await new Promise(s=>setTimeout(s,900*(i+1)))}}throw new Error(/^NET/.test(last&&last.message)?last.message:"NET "+(last&&last.message||""))}
function loginFail(e){const net=/^NET|Failed to fetch|NetworkError|Load failed/.test(e.message);const er=document.getElementById("er");if(!net){er.textContent=e.message;return}
 er.innerHTML=`학원 로그인 서버에 연결되지 않아요. <span style="opacity:.7">(${String(e.message).replace(/^NET\s*/,"").slice(0,40)})</span><br>잠시 후 다시 시도하거나, 아래에 <b>이름</b>을 넣고 바로 시작하세요.<div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="fbn" placeholder="내 이름" maxlength="10" style="flex:1;min-width:0"><button class="btn" id="fbg" style="width:auto;padding:8px 14px">이름으로 시작</button></div>`;
 const g=()=>{const n=document.getElementById("fbn").value.trim();if(!n)return;document.getElementById("code").value="이름:"+n;doLogin()};document.getElementById("fbg").onclick=g;document.getElementById("fbn").onkeydown=e=>{if(e.key==="Enter")g()}}
async function doLogin(){const code=$("#code").value.trim();if(!code)return;const b=$("#go");b.disabled=true;b.textContent="확인 중…";$("#er").textContent="";
 try{const o=await loginFetch(code);if(o.error)throw new Error(o.error);const d=o.data||{};
  if(d.role==="parent")throw new Error("학부모 코드로는 들어갈 수 없어요. 학생 코드를 입력하세요.");
  U={name:d.name||"학생",key:await sha(code)};LS.set("mockomr_user",U);ST=LS.get(SK())||{};start()}
 catch(e){b.disabled=false;b.textContent="입장하기";loginFail(e)}}
$("#lo").onclick=()=>{U=null;LS.set("mockomr_user",null);loginView()};
$("#back").onclick=()=>home();
function home(){$("#lo").style.display="";$("#back").style.display="none";
 app.innerHTML=`<span class="eye">MOCK EXAM · OMR</span><h1>시험 선택</h1><p class="muted">👋 <b>${esc(U.name)}</b> 학생, 오늘 본 모의고사를 고르세요.</p>
 ${ORDER.map(([g,ids])=>`<h2>${g}</h2>`+ids.map(id=>{const k=KEYS[id],s=ST[id];return `<button class="ver ${s&&s.done?"done":""}" data-id="${id}"><b>${esc(k.title)}</b><span>${esc(k.sub)} · ${s&&s.done?`✓ 제출 완료 ${s.score}점`:s?"작성 중":"객관식 20 · 서술형 10"}</span></button>`}).join("")).join("")}
 <div class="ft">제작: 스텔라원장 · 잉글리시아이 스텔라</div>`;
 app.querySelectorAll(".ver").forEach(b=>b.onclick=()=>exam(b.dataset.id));window.scrollTo(0,0)}
function exam(id){cur=id;const K=KEYS[id];const s=ST[id]=ST[id]||{mc:{},sa:{},t0:Date.now()};save();
 $("#back").style.display="";
 const done=!!s.done;
 app.innerHTML=`<span class="eye">${esc(K.sub)}</span><h1 style="font-size:24px">${esc(K.title)}</h1>
 <h2>객관식 (1~20) · 각 2.5점</h2><div class="prog" id="pg"></div>
 <div class="omr">${K.mc.map((q,i)=>`<div class="row" id="r${i}"><span class="n">${i+1}</span><span class="ar">${esc(q.ar)}</span>${[0,1,2,3,4].map(k=>`<button class="bub" data-i="${i}" data-k="${k}">${k+1}</button>`).join("")}</div>`).join("")}</div>
 <h2>서술형 (1~10) · 각 5점</h2><p class="muted" style="margin-top:0">시험지에 쓴 답을 그대로 입력하세요. (문장 전체)</p>
 ${K.sa.map((q,i)=>`<div class="sa" id="s${i}"><label>서술형 ${i+1} <span class="muted" style="font-weight:400;font-size:12px">${esc(q.ar)}</span></label><input type="text" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="답을 입력하세요" value="${esc(s.sa[i]||"")}"><div class="fb"></div></div>`).join("")}
 <div id="res"></div>
 <div class="bar">${done?`<button class="btn" id="retry">다시 풀기 (기록 지우기)</button>`:`<button class="btn bur" id="sub">제출하고 채점하기</button>`}</div>`;
 const paint=()=>{K.mc.forEach((q,i)=>{document.querySelectorAll(`#r${i} .bub`).forEach(b=>{const k=+b.dataset.k;b.className="bub";if(done){if(k===q.a)b.classList.add("right");else if(s.mc[i]===k)b.classList.add("wrong")}else if(s.mc[i]===k)b.classList.add("on")})});
  $("#pg").textContent=done?"":`마킹 ${Object.keys(s.mc).length} / 20 · 서술형 ${Object.values(s.sa).filter(x=>x&&x.trim()).length} / 10 (답을 바꾸려면 다른 번호를 누르세요)`};
 if(!done){app.querySelectorAll(".bub").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=+b.dataset.k;if(s.mc[i]===k)delete s.mc[i];else s.mc[i]=k;save();paint()});
  app.querySelectorAll(".sa input").forEach(x=>x.oninput=()=>{s.sa[x.dataset.i]=x.value;save();paint()});
  $("#sub").onclick=()=>{const m=20-Object.keys(s.mc).length,e=10-Object.values(s.sa).filter(x=>x&&x.trim()).length;
   if((m||e)&&!confirm(`아직 비어 있는 문항이 있어요. (객관식 ${m}개, 서술형 ${e}개)\n그래도 제출할까요?`))return;grade(id)}}
 else{app.querySelectorAll(".sa input").forEach(x=>x.disabled=true);showResult(id);$("#retry").onclick=()=>{if(confirm("이 시험 기록을 지우고 다시 풀까요?")){delete ST[id];save();exam(id)}}}
 paint();window.scrollTo(0,0)}
function saOk(q,v){if(!v||!v.trim())return false;const n=norm(v);return q.a.some(a=>norm(a)===n)}
function grade(id){const K=KEYS[id],s=ST[id];
 const mcW=[],saW=[];let mc=0,sa=0;
 K.mc.forEach((q,i)=>{if(s.mc[i]===q.a)mc++;else mcW.push(i+1)});
 K.sa.forEach((q,i)=>{if(saOk(q,s.sa[i]))sa++;else saW.push(i+1)});
 s.done=true;s.mcScore=mc;s.saScore=sa;s.score=Math.round((mc*2.5+sa*5)*10)/10;s.mcW=mcW;s.saW=saW;save();
 const body={name:U.name,unit:"중등부 모의고사",day:0,title:`${K.title} (${K.sub})`,cat:"모의고사",attempt:"첫 응시",score:mc+sa,total:30,
  wrongNums:[...mcW.map(n=>n+"번"),...saW.map(n=>"서술형"+n)].join(", ")||"없음",
  wrongDetail:(`점수 ${s.score}/100 · 객관식 ${mc}/20 · 서술형 ${sa}/10 | `+[...mcW.map(n=>`${n}번(${K.mc[n-1].ar}): ${s.mc[n-1]!=null?C[s.mc[n-1]]:"무응답"}→${C[K.mc[n-1].a]}`),...saW.map(n=>`서술형${n}(${K.sa[n-1].ar}): ${s.sa[n-1]||"무응답"}`)].join(" / ")).slice(0,1900),
  minutes:Math.max(1,Math.round((Date.now()-s.t0)/60000)),timestamp:new Date().toISOString()};
 try{fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),mode:"no-cors"}).catch(()=>{})}catch(e){}
 exam(id)}
function showResult(id){const K=KEYS[id],s=ST[id];
 K.sa.forEach((q,i)=>{const el=$("#s"+i);const ok=saOk(q,s.sa[i]);el.classList.add(ok?"ok":"no");el.querySelector(".fb").innerHTML=(ok?"⭕ 정답":"❌ 모범 답안: ")+(ok?"":`<b>${esc(q.a[0])}</b>`)+(q.e&&!ok?`<br><span class="muted">${esc(q.e)}</span>`:"")});
 $("#res").innerHTML=`<div class="card"><div class="score">${s.score}점</div><p class="muted" style="text-align:center;margin:4px 0 8px">객관식 ${s.mcScore}/20 · 서술형 ${s.saScore}/10 · 결과가 선생님께 전송됐어요</p>
 ${s.mcW.length?`<h2 style="margin-top:6px">객관식 틀린 문제</h2><div class="wl">${s.mcW.map(n=>{const q=K.mc[n-1];return `<div><b>${n}번</b> <span class="muted">${esc(q.ar)}</span> · 내 답 ${s.mc[n-1]!=null?C[s.mc[n-1]]:"무응답"} → 정답 <b>${C[q.a]}</b>${q.e?`<br><span class="muted">💡 ${esc(q.e)}</span>`:""}</div>`}).join("")}</div>`:`<p style="text-align:center">🎉 객관식 만점!</p>`}
 <p class="muted" style="font-size:12px">※ 서술형은 자동 채점이에요. 뜻이 같은 다른 표현은 선생님이 다시 확인해 주세요.</p></div>`}
const QEX=new URLSearchParams(location.search).get("exam");
function start(){if(QEX&&KEYS[QEX])exam(QEX);else home()}
if(U)start();else loginView();
</script>
