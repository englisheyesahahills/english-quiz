<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMR 시험 — 잉글리시아이 스텔라 영어학원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f0f4f8;min-height:100vh;}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px;}
.spinner{width:48px;height:48px;border:4px solid #e0e0e0;border-top-color:#1a5c3a;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#exam-select{display:none;max-width:520px;margin:0 auto;padding:24px 16px;}
.select-header{text-align:center;margin-bottom:28px;}
.select-header .logo{font-size:11px;color:#9ca3af;letter-spacing:1px;margin-bottom:8px;}
.select-header h1{font-size:22px;font-weight:900;color:#1a5c3a;}
.exam-card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:12px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.exam-card:hover{border-color:#1a5c3a;}
.exam-card h3{font-size:16px;font-weight:700;color:#111;margin-bottom:4px;}
.exam-card .meta{font-size:12px;color:#6b7280;display:flex;gap:12px;}
#exam-screen{display:none;max-width:600px;margin:0 auto;padding:16px;}
.exam-top{background:linear-gradient(135deg,#1a5c3a,#2d8a5a);border-radius:16px;padding:18px 20px;margin-bottom:16px;color:#fff;}
.exam-top .exam-title{font-size:16px;font-weight:700;margin-bottom:8px;}
.exam-top .exam-info{display:flex;justify-content:space-between;font-size:13px;opacity:0.85;}
.timer{font-size:18px;font-weight:900;color:#ffd700;}
#student-form{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
#student-form h3{font-size:14px;font-weight:700;color:#1a5c3a;margin-bottom:12px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:12px;color:#6b7280;margin-bottom:4px;}
.form-group input,.form-group select{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;}
.form-group input:focus,.form-group select:focus{border-color:#1a5c3a;}
#answer-sheet{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
#answer-sheet h3{font-size:14px;font-weight:700;color:#1a5c3a;margin-bottom:8px;}
.progress-bar{background:#e5e7eb;border-radius:10px;height:6px;margin-bottom:14px;}
.progress-fill{background:#1a5c3a;height:6px;border-radius:10px;transition:width 0.3s;}
.progress-text{font-size:11px;color:#6b7280;text-align:right;margin-top:4px;margin-bottom:10px;}
.omr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
.omr-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;background:#f9fafb;}
.omr-row.answered{background:#f0faf4;}
.q-num{font-size:12px;font-weight:700;color:#374151;width:22px;text-align:right;flex-shrink:0;}
.bubbles{display:flex;gap:4px;}
.bubble{width:26px;height:26px;border-radius:50%;border:2px solid #d1d5db;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#6b7280;cursor:pointer;transition:all 0.12s;}
.bubble:hover{border-color:#1a5c3a;color:#1a5c3a;}
.bubble.selected{background:#1a5c3a;border-color:#1a5c3a;color:#fff;}
.submit-btn{width:100%;padding:14px;background:#1a5c3a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-bottom:20px;}
.submit-btn:disabled{background:#9ca3af;}
#result-screen{display:none;max-width:480px;margin:0 auto;padding:24px 16px;}
.result-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.1);}
.result-header{padding:28px 24px;text-align:center;}
.result-header.pass{background:linear-gradient(135deg,#1a5c3a,#2d8a5a);}
.result-header.fail{background:linear-gradient(135deg,#991b1b,#dc2626);}
.result-emoji{font-size:52px;margin-bottom:8px;}
.result-score{font-size:48px;font-weight:900;color:#fff;}
.result-pct{font-size:16px;color:rgba(255,255,255,0.8);margin-top:4px;}
.result-body{padding:20px 24px;}
.result-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px;}
.result-row .label{color:#6b7280;}
.result-row .value{font-weight:600;}
.result-msg{background:#f0faf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;margin-top:14px;font-size:13px;color:#166534;text-align:center;line-height:1.6;}
.result-msg.fail-msg{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
.wrong-list{margin-top:14px;}
.wrong-title{font-size:13px;font-weight:700;color:#374151;margin-bottom:8px;}
.wrong-item{display:flex;gap:8px;font-size:13px;padding:6px 10px;background:#fef2f2;border-radius:6px;margin-bottom:4px;}
.wrong-item .wq{color:#dc2626;font-weight:700;width:60px;}
.saving-msg{text-align:center;font-size:12px;color:#6b7280;margin-top:8px;}
.retry-btn{width:100%;padding:12px;background:#f3f4f6;color:#374151;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:14px;}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:15px;color:#6b7280;">시험 정보를 불러오는 중...</div>
</div>

<div id="exam-select">
  <div class="select-header">
    <div class="logo">ENGLISHEYE STELLA 영어학원</div>
    <h1>📋 시험 선택</h1>
    <p style="font-size:13px;color:#6b7280;margin-top:4px;">응시할 시험을 선택해 주세요</p>
  </div>
  <div id="exam-list"></div>
</div>

<div id="exam-screen">
  <div class="exam-top">
    <div class="exam-title" id="exam-title-display"></div>
    <div class="exam-info">
      <span id="exam-meta"></span>
      <span class="timer" id="timer-display">--:--</span>
    </div>
  </div>
  <div id="student-form">
    <h3>👤 학생 정보 입력</h3>
    <div class="form-row">
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="student-name" placeholder="이름 입력">
      </div>
      <div class="form-group">
        <label>반</label>
        <select id="student-class">
          <option value="">반 선택</option>
          <option value="A">A반</option>
          <option value="B">B반</option>
          <option value="C">C반</option>
          <option value="D">D반</option>
        </select>
      </div>
    </div>
  </div>
  <div id="answer-sheet">
    <h3>📝 답안 마킹</h3>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <div class="progress-text" id="progress-text">0 / 0 문제 완료</div>
    <div class="omr-grid" id="omr-grid"></div>
  </div>
  <button class="submit-btn" id="submit-btn" onclick="submitExam()">제출하기</button>
</div>

<div id="result-screen">
  <div class="result-card">
    <div class="result-header" id="result-header">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-score" id="result-score">-/-</div>
      <div class="result-pct" id="result-pct"></div>
    </div>
    <div class="result-body">
      <div class="result-row"><span class="label">이름</span><span class="value" id="res-name">-</span></div>
      <div class="result-row"><span class="label">반</span><span class="value" id="res-class">-</span></div>
      <div class="result-row"><span class="label">시험명</span><span class="value" id="res-exam">-</span></div>
      <div class="result-row"><span class="label">정답</span><span class="value" id="res-correct">-</span></div>
      <div class="result-row"><span class="label">오답</span><span class="value" id="res-wrong">-</span></div>
      <div id="result-msg-box"></div>
      <div class="wrong-list" id="wrong-list"></div>
      <div class="saving-msg" id="saving-msg"></div>
      <button class="retry-btn" onclick="location.reload()">🔄 처음으로</button>
    </div>
  </div>
</div>

<script>
// ── 설정 ──
const WORKER_URL = 'https://stella-omr.sodcowhrqkf1.workers.dev';

// ── 내장 시험 데이터 (노션 정답키 변경시 업데이트 요청) ──
const EXAMS = {
  '토셀평가 스타터5회': {
    name:'토셀평가 스타터5회', total:40, choices:4, time:40,
    key:[1,2,2,3,2,1,3,2,3,3,1,3,1,2,2,2,1,3,1,3,2,1,1,2,3,1,3,1,1,1,1,2,4,4,3,2,2,4,1,2]
  },
  '토셀평가 베이직5회': {
    name:'토셀평가 베이직5회', total:60, choices:4, time:60,
    key:[3,1,1,1,4,4,3,4,1,2,1,3,4,2,2,3,1,4,4,1,2,4,2,2,3,1,1,3,2,3,2,1,2,3,3,4,3,1,4,1,3,1,3,2,1,4,3,2,3,4,4,1,3,4,2,3,3,1,4,2]
  },
  '월말평가5문제': {
    name:'월말평가5문제', total:5, choices:4, time:40,
    key:[2,3,3,3,1]
  }
};

let currentExam = null;
let answers = [];
let timerInterval = null;
let submitLock = false;

// ── 초기화 ──
function init() {
  const params = new URLSearchParams(location.search);
  const examParam = decodeURIComponent(params.get('exam') || '');
  document.getElementById('loading').style.display = 'none';

  if (examParam && EXAMS[examParam]) {
    startExam(EXAMS[examParam]);
    return;
  }

  document.getElementById('exam-select').style.display = 'block';
  const list = document.getElementById('exam-list');
  Object.values(EXAMS).forEach(exam => {
    const card = document.createElement('div');
    card.className = 'exam-card';
    card.innerHTML = `<h3>${exam.name}</h3><div class="meta"><span>📝 ${exam.total}문항</span><span>⏱️ ${exam.time}분</span><span>🔢 ${exam.choices}지선다</span></div>`;
    card.onclick = () => startExam(exam);
    list.appendChild(card);
  });
}

function startExam(exam) {
  currentExam = exam;
  answers = new Array(exam.total).fill(0);
  document.getElementById('exam-select').style.display = 'none';
  document.getElementById('exam-screen').style.display = 'block';
  document.getElementById('exam-title-display').textContent = exam.name;
  document.getElementById('exam-meta').textContent = `총 ${exam.total}문항 · ${exam.choices}지선다`;
  document.getElementById('progress-text').textContent = `0 / ${exam.total} 문제 완료`;
  buildOMR(exam.total, exam.choices);
  startTimer(exam.time);
}

function buildOMR(total, choices) {
  const grid = document.getElementById('omr-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= total; i++) {
    const row = document.createElement('div');
    row.className = 'omr-row';
    row.id = 'row' + i;
    let html = `<span class="q-num">${i}</span><div class="bubbles">`;
    for (let c = 1; c <= choices; c++) {
      html += `<div class="bubble" id="b${i}_${c}" onclick="selectAnswer(${i},${c})">${c}</div>`;
    }
    html += '</div>';
    row.innerHTML = html;
    grid.appendChild(row);
  }
}

function selectAnswer(q, choice) {
  answers[q-1] = choice;
  for (let c = 1; c <= currentExam.choices; c++) {
    const b = document.getElementById(`b${q}_${c}`);
    if (b) b.classList.toggle('selected', c === choice);
  }
  document.getElementById('row'+q).classList.add('answered');
  const answered = answers.filter(a => a > 0).length;
  document.getElementById('progress-fill').style.width = Math.round(answered/currentExam.total*100)+'%';
  document.getElementById('progress-text').textContent = `${answered} / ${currentExam.total} 문제 완료`;
}

function startTimer(minutes) {
  let timeLeft = minutes * 60;
  const display = document.getElementById('timer-display');
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
    const s = String(timeLeft%60).padStart(2,'0');
    display.textContent = `${m}:${s}`;
    if (timeLeft <= 60) display.style.color = '#ff4444';
    if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(); }
  }, 1000);
}

function submitExam() {
  if (submitLock) return;
  clearInterval(timerInterval);
  const name = document.getElementById('student-name').value.trim();
  const cls = document.getElementById('student-class').value;
  if (!name) { alert('이름을 입력해 주세요!'); return; }
  if (!cls) { alert('반을 선택해 주세요!'); return; }
  const unanswered = answers.filter(a => a === 0).length;
  if (unanswered > 0 && !confirm(`${unanswered}문제를 마킹하지 않았어요. 제출할까요?`)) return;

  submitLock = true;
  document.getElementById('submit-btn').disabled = true;

  const key = currentExam.key;
  let correct = 0;
  const wrongList = [];
  answers.forEach((ans, i) => {
    if (ans === key[i]) correct++;
    else wrongList.push({q:i+1, myAns:ans, correct:key[i]});
  });
  const total = currentExam.total;
  const pct = Math.round(correct/total*100);
  const pass = pct >= 50;

  showResult(name, cls, correct, total, pct, pass, wrongList);
  saveResult(name, cls, correct, total, pct, key);
}

function showResult(name, cls, correct, total, pct, pass, wrongList) {
  document.getElementById('exam-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  const header = document.getElementById('result-header');
  header.className = `result-header ${pass?'pass':'fail'}`;
  document.getElementById('result-emoji').textContent = pass ? '🎉' : '😅';
  document.getElementById('result-score').textContent = `${correct} / ${total}`;
  document.getElementById('result-pct').textContent = `정답률 ${pct}%`;
  document.getElementById('res-name').textContent = name;
  document.getElementById('res-class').textContent = cls+'반';
  document.getElementById('res-exam').textContent = currentExam.name;
  document.getElementById('res-correct').textContent = correct+'개';
  document.getElementById('res-wrong').textContent = (total-correct)+'개';
  document.getElementById('result-msg-box').innerHTML = pass
    ? `<div class="result-msg">🎊 합격! 정말 잘했어요!</div>`
    : `<div class="result-msg fail-msg">📚 조금 더 연습이 필요해요!</div>`;
  if (wrongList.length > 0) {
    const wl = document.getElementById('wrong-list');
    wl.innerHTML = `<div class="wrong-title">❌ 틀린 문제 (${wrongList.length}개)</div>`;
    wrongList.forEach(w => {
      const item = document.createElement('div');
      item.className = 'wrong-item';
      item.innerHTML = `<span class="wq">${w.q}번</span><span>내 답: ${w.myAns||'미기재'} → 정답: ${w.correct}</span>`;
      wl.appendChild(item);
    });
  }
}

async function saveResult(name, cls, correct, total, pct, key) {
  document.getElementById('saving-msg').textContent = '⏳ 노션에 저장 중...';
  try {
    const params = new URLSearchParams({
      action: 'save',
      studentName: name,
      studentClass: cls,
      examName: currentExam.name,
      score: String(correct),
      total: String(total),
      answers: JSON.stringify(answers),
      answerKey: JSON.stringify(key),
      submittedAt: new Date().toISOString()
    });
    const res = await fetch(WORKER_URL + '?' + params.toString());
    const data = await res.json();
    if (data.status === 'ok') {
      document.getElementById('saving-msg').textContent = '✅ 노션에 저장되었습니다!';
    } else {
      document.getElementById('saving-msg').textContent = '⚠️ 오류: ' + (data.message || '저장 실패');
    }
  } catch(e) {
    document.getElementById('saving-msg').textContent = '⚠️ 저장 실패 (결과는 정상)';
  }
}

// 시작!
init();
</script>
</body>
</html>
