<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>STELLA 중등 학습관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#14213E;--navy2:#22335c;--bur:#90394A;--gold:#C9A227;--bg:#F4F2EE;--card:#fff;--ink:#1d2433;--sub:#6b7280;--line:#e6e2da;
--ok:#1f8a5b;--okbg:#e5f4ec;--info:#2c5fb3;--infobg:#e7eefb;--warn:#b86a12;--warnbg:#fdf0dc;--bad:#b3263e;--badbg:#fbe6ea;--mute:#8a8f99;--mutebg:#eef0f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 80px}
header.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
header.top .in{max-width:1040px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:.06em;font-size:15px}.brand b{color:var(--gold)}
.who{margin-left:auto;font-size:13px;opacity:.85;text-align:right}
.lo{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
nav.tabs{background:var(--navy2);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .in{max-width:1040px;margin:0 auto;padding:0 8px;display:flex}
nav.tabs button{background:none;border:0;color:#c9d0e0;padding:11px 12px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;flex:none}
nav.tabs button.on{color:#fff;border-bottom-color:var(--gold);font-weight:700}
h2{font-size:18px;margin:22px 0 10px}h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:10px}
.k4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-size:24px;font-weight:800;color:var(--navy)}.kpi .l{font-size:13px;color:var(--sub);font-weight:600}
.basis{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.35}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-info{background:var(--infobg);color:var(--info)}.c-warn{background:var(--warnbg);color:var(--warn)}
.c-bad{background:var(--badbg);color:var(--bad)}.c-mute{background:var(--mutebg);color:var(--mute)}.c-navy{background:var(--navy);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.bur{background:var(--bur)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid #d6d1c6;border-radius:9px;padding:8px 10px;background:#fff;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:4px}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.seg{display:inline-flex;border:1px solid #d6d1c6;border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:13px;cursor:pointer;border-right:1px solid #eee}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.seg.c button.on[data-v="결석"],.seg.c button.on[data-v="미완료"],.seg.c button.on[data-v="주의"]{background:var(--bad)}
.seg.c button.on[data-v="지각"],.seg.c button.on[data-v="일부"]{background:var(--warn)}
.flag{border-left:4px solid var(--bur)}
.flag.r1{border-left-color:var(--gold)}.flag.r2{border-left-color:var(--warn)}.flag.r3{border-left-color:var(--bad)}
ul.rs{margin:6px 0 0;padding-left:18px}ul.rs li{margin:2px 0}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--sub);font-weight:700;font-size:12px;border-bottom:1px solid var(--line);padding:6px}
table.t td{border-bottom:1px solid #f0ede7;padding:7px 6px;vertical-align:top}
.tscroll{overflow-x:auto}
.task{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.task .ar{font-size:12px;font-weight:800;color:var(--bur);letter-spacing:.03em}
.task .tt{font-weight:700;font-size:15.5px}
.form{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:none}
.form.open{display:block}
.steps{background:#faf8f3;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
.steps label{display:flex;gap:8px;align-items:center;margin:3px 0}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.dot{border-radius:10px;padding:6px 0;font-size:12px;background:#fff;border:1px solid var(--line)}
.dot b{display:block;font-size:13px}
.dot.full{background:var(--okbg);border-color:#bfe3cf}.dot.part{background:var(--warnbg);border-color:#f2d7a9}.dot.miss{background:var(--badbg);border-color:#f0c2cb}.dot.today{outline:2px solid var(--navy)}
.ring{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--navy);flex:none}
.bar{height:8px;background:#eee;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--navy)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:24px}
.login h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
.big{font-size:20px;letter-spacing:.15em;text-transform:uppercase;text-align:center;padding:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--bad)}
.loading{padding:40px 0;text-align:center;color:var(--sub)}
.empty{color:var(--mute);font-size:13.5px;padding:6px 0}
.pill-list span{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin:3px 4px 0 0;font-size:13px}
.stu{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.stu .nm{font-weight:800}
.mini{font-size:12px;color:var(--sub)}
.demo{background:var(--gold);color:var(--navy);text-align:center;font-size:12.5px;font-weight:700;padding:5px}
@media print{header.top,nav.tabs,.noprint,.demo{display:none!important}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<!--PREVIEW_INJECT-->
<div id="app"></div>
<script>
/* ================= 통신 ================= */
/* ▼ GitHub Pages에 올릴 때: 따옴표 안에 Apps Script 웹앱 주소(/exec로 끝남)를 넣으세요 */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzOBbdz92h9WjwxTAmOsyQL4DMsk9qiVTKVzzQIOjtojJBxkCTZ-36c6cQCjcP3CUo_/exec';
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const CAN_REC = !IS_GAS && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const S = { token: null, role: null, name: null, tab: null };
function gas(fn, ...args) {
  return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
}
async function raw(fn, ...args) {
  let r;
  if (IS_GAS) r = await gas(fn, ...args);
  else if (window.MOCK) r = await window.MOCK[fn](...args);
  else if (GAS_URL) {
    const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ fn, args }) });
    if (!res.ok) throw new Error('서버 연결 실패 (' + res.status + ')');
    r = await res.text();
  } else throw new Error('웹앱 주소(GAS_URL)가 설정되지 않았습니다. 학원에 알려 주세요.');
  const o = JSON.parse(r);
  if (o.error === 'SESSION') { logout('접속 시간이 지나 다시 로그인해 주세요.'); throw new Error('SESSION'); }
  if (o.error) throw new Error(o.error);
  return o.data;
}
const call = (action, p) => raw('api', S.token, action, p || {});
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

/* ================= 유틸 ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pctTxt = v => v === null || v === undefined ? '<span class="muted">데이터 없음</span>' : v + '%';
function toast(msg, err) { const d = document.createElement('div'); d.className = 'toast' + (err ? ' err' : ''); d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), err ? 4200 : 2600); }
function fail(e) { if (e && e.message === 'SESSION') return; toast(e && e.message ? e.message : String(e), true); }
const STATUS_CLS = { '최종통과': 'c-ok', '검토완료': 'c-ok', '통과': 'c-ok', '재시험통과': 'c-ok', '검토전': 'c-info', '수정필요': 'c-warn', '재시험필요': 'c-warn', '재시험대기': 'c-warn', '미제출': 'c-bad', '예정': 'c-mute' };
const STATUS_TXT = { '검토전': '제출·검토 전', '검토완료': '검토 완료', '최종통과': '최종 통과', '수정필요': '수정 필요', '재시험필요': '재시험 필요', '미제출': '미제출', '예정': '예정', '통과': '통과', '재시험대기': '재시험 대기', '재시험통과': '재시험 통과' };
const chip = s => `<span class="chip ${STATUS_CLS[s] || 'c-mute'}">${esc(STATUS_TXT[s] || s || '-')}</span>`;
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addD(s, n) { const p = s.split('-'); const d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function monday(s) { const p = s.split('-'); const d = new Date(+p[0], +p[1] - 1, +p[2]); return addD(s, -((d.getDay() + 6) % 7)); }
const DOWS = ['월', '화', '수', '목', '금', '토', '일'];
function dowK(s) { const p = s.split('-'); return '일월화수목금토'[new Date(+p[0], +p[1] - 1, +p[2]).getDay()]; }
function seg(name, opts, val, cls) { return `<div class="seg ${cls || ''}" data-name="${name}">${opts.map(o => `<button type="button" data-v="${esc(o)}" class="${o === val ? 'on' : ''}">${esc(o)}</button>`).join('')}</div>`; }
document.addEventListener('click', e => {
  const b = e.target.closest('.seg button'); if (!b) return;
  const on = b.classList.contains('on'); $$('button', b.parentNode).forEach(x => x.classList.remove('on')); if (!on) b.classList.add('on');
});
const segVal = (root, name) => { const b = $(`.seg[data-name="${name}"] button.on`, root); return b ? b.dataset.v : ''; };
function ring(p) { const v = p === null || p === undefined ? 0 : p; return `<div class="ring" style="background:conic-gradient(var(--navy) ${v * 3.6}deg,#e9e6df 0)"><div style="width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center">${p === null || p === undefined ? '<span style="font-size:11px;color:var(--mute)">데이터<br>없음</span>' : Math.round(p) + '%'}</div></div>`; }
const loading = () => `<div class="loading">불러오는 중…</div>`;

/* ================= 레이아웃 ================= */
const TABS = {
  director: [['dash', '대시보드'], ['weekly', '주간 보고서'], ['card', '학생별 관리표'], ['today', '오늘 할 일'], ['record', '수업·자습 기록'], ['test', '테스트 입력'], ['assign', '과제 배정'], ['comment', '주간 코멘트']],
  teacher: [['today', '오늘 할 일'], ['record', '수업·자습 기록'], ['test', '테스트 입력'], ['assign', '과제 배정'], ['comment', '주간 코멘트'], ['card', '학생별 관리표']],
  student: [['home', '오늘 공부'], ['myweek', '이번 주']],
  parent: [['report', '주간 학습 보고서']]
};
const ROLE_TXT = { director: '원장', teacher: '선생님', student: '학생', parent: '학부모' };
function shell() {
  const tabs = TABS[S.role];
  document.getElementById('app').innerHTML = `
  <header class="top"><div class="in"><div class="brand">STELLA <b>MIDDLE</b></div>
  <div class="who">${esc(S.name)}<br><span style="font-size:11px">${ROLE_TXT[S.role]}</span></div>
  <button class="lo" onclick="logout()">로그아웃</button></div></header>
  ${tabs.length > 1 ? `<nav class="tabs"><div class="in">${tabs.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join('')}</div></nav>` : ''}
  <main class="wrap" id="main"></main>`;
  $$('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.t));
  go(S.tab && tabs.some(t => t[0] === S.tab) ? S.tab : tabs[0][0]);
}
function go(t) {
  S.tab = t; store.set('stella_tab', t);
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const m = $('#main'); m.innerHTML = loading(); window.scrollTo(0, 0);
  const f = VIEWS[t]; f(m).catch(fail);
}
function logout(msg) { ['stella_token', 'stella_role', 'stella_name', 'stella_tab'].forEach(store.del); Object.assign(S, { token: null, role: null, name: null, tab: null }); loginView(); if (msg) toast(msg, true); }

function loginView() {
  document.getElementById('app').innerHTML = `
  <div class="login"><div class="card">
   <div class="brand" style="color:var(--bur);margin-bottom:10px">STELLA <b style="color:var(--gold)">MIDDLE</b></div>
   <h1>중등부 학습관리</h1>
   <p class="muted" style="margin:0 0 16px">매일 공부하고, 반드시 확인하고, 부족한 부분은 보완하고, 결과를 기록합니다.</p>
   <label class="f">로그인 코드</label>
   <input type="text" id="code" class="big" maxlength="10" autocomplete="off" placeholder="코드 입력">
   <button class="btn" style="width:100%;margin-top:12px" id="go">입장하기</button>
   <p class="muted" style="margin:14px 0 0;font-size:12px">학생·학부모 코드는 학원에서 개별로 안내드립니다. 학부모 코드로는 자녀의 기록만 볼 수 있습니다.</p>
   ${window.DEMO_CODES ? `<div style="margin-top:16px;border-top:1px dashed var(--line);padding-top:12px"><div class="mini" style="margin-bottom:6px">미리보기용 데모 코드</div><div class="row">${window.DEMO_CODES.map(c => `<button class="btn ghost sm" onclick="document.getElementById('code').value='${c[1]}';doLogin()">${c[0]}</button>`).join('')}</div></div>` : ''}
  </div></div>`;
  $('#go').onclick = doLogin; $('#code').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}
async function doLogin() {
  const code = $('#code').value.trim(); if (!code) return;
  $('#go').disabled = true;
  try {
    const d = await raw('login', code);
    Object.assign(S, d, { tab: null });
    store.set('stella_token', d.token); store.set('stella_role', d.role); store.set('stella_name', d.name);
    shell();
  } catch (e) { fail(e); $('#go').disabled = false; }
}

/* ================= 학생 ================= */
const VIEWS = {};
const START = {};
VIEWS.home = async m => {
  const d = await call('studentHome');
  const w = d.week;
  m.innerHTML = `
  <h2>${esc(d.name)}의 오늘 공부 <span class="muted" style="font-weight:500">${d.today.slice(5)}</span></h2>
  <div class="card row" style="gap:14px">${ring(w.rate)}<div class="sp"><div style="font-weight:800">이번 주 달성률</div>
    <div class="muted">이번 주 과제 ${w.total}개 · 오늘까지 ${w.due}개 중 확인 완료 ${w.done}개</div>
    <div class="basis">달성률은 선생님 확인(또는 단어 만점)까지 끝난 과제 기준이에요. 공부 시간이 아니라 결과로 계산해요.</div></div></div>
  ${d.retests.length ? `<div class="card flag r2"><h3>재시험 안내</h3>${d.retests.map(r => `<div style="margin:6px 0"><b>${esc(r.영역)} ${esc(r.범위)}</b> <span class="muted">첫 점수 ${esc(r.첫점수)} → 통과 ${esc(r.통과점수)}점</span>${r.틀린항목 ? `<div class="pill-list">${String(r.틀린항목).split(',').map(x => `<span>${esc(x.trim())}</span>`).join('')}</div>` : ''}</div>`).join('')}<div class="basis">틀린 항목을 다시 외우고 다음 등원 때 재시험을 봐요.</div></div>` : ''}
  <h2>오늘 할 일 (${d.todays.length})</h2>
  ${d.todays.length ? d.todays.map(taskCard).join('') : '<div class="card empty">오늘 배정된 과제가 없어요. 아래 누적 오답 단어를 복습해 보세요!</div>'}
  ${d.upcoming.length ? `<h2>이번 주 남은 과제 (${d.upcoming.length})</h2><div class="basis" style="margin:-6px 0 8px">미리 해도 돼요. 미리 제출하면 그날 과제가 이미 완료로 표시돼요.</div>${d.upcoming.map(taskCard).join('')}` : ''}
  ${d.back.length ? `<h2>밀린 과제 · 다시 할 과제 (${d.back.length})</h2>${d.back.map(taskCard).join('')}` : ''}
  ${d.wrongs.length ? `<h2>오답 고치기 (${d.wrongs.length})</h2>${d.wrongs.map(w => `<div class="task" data-w="${esc(w.오답ID)}"><div class="ar">${esc(w.영역)} · ${esc(w.원인)}</div><div class="tt">${esc(w.문항)}</div><div class="mini">${esc(w.날짜)} ${esc(w.출처)}</div>
     <div class="row" style="margin-top:8px"><input type="text" placeholder="고친 답 + 왜 틀렸는지 한 줄" class="sp"><button class="btn sm" onclick="fixW(this)">고쳤어요</button></div></div>`).join('')}` : ''}
  <h2>누적 오답 단어 <span class="muted" style="font-weight:500">최근 30일</span></h2>

  if (!result) return toast('판정을 선택해 주세요.', true);
  b.disabled = true;
  try { await call('reviewSubmission', { id: box.dataset.rv, result, feedback: $('[name=fb]', box).value, cause: $('[name=cause]', box).value, items: $('[name=items]', box).value }); toast('저장했습니다'); go(S.tab); } catch (e) { fail(e); b.disabled = false; }
}
async function bulkOK() { const ids = $$('.qk:checked').map(x => x.value); if (!ids.length) return; try { await call('bulkReview', { ids }); toast(ids.length + '건 검토 완료'); go(S.tab); } catch (e) { fail(e); } }
async function saveRT(b) {
  const box = b.closest('[data-rt]'); b.disabled = true;
  try { const r = await call('recordRetest', { id: box.dataset.rt, score: $('input', box).value }); toast(r.passed ? '재시험 통과! 최종 점수 기록됨' : '미통과 — 재시험 ' + r.tries + '회째. 보완 후 다시'); go(S.tab); } catch (e) { fail(e); b.disabled = false; }
}
async function doneHand(id, b) { b.disabled = true; try { await call('resolveHandover', { id }); toast('인계 확인 완료'); go(S.tab); } catch (e) { fail(e); b.disabled = false; } }

/* ================= 교사: 수업·자습 기록 ================= */
VIEWS.record = async m => {
  const th = S.th || (S.th = await call('teacherHome'));
  const date = S.recDate || todayStr(), kind = S.recKind === '화목자습' ? '자습' : (S.recKind || '정규'), cls = S.recCls || th.classes[0] || '전체';
  m.innerHTML = `<h2>수업·자습 기록</h2>
  <div class="card fg"><div><label class="f">날짜</label><input type="date" id="rd" value="${date}"></div>
   <div><label class="f">구분</label><select id="rk">${['정규', '자습', '일요집중'].map(k => `<option ${k === kind ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
   <div><label class="f">반</label><select id="rc">${['전체', ...th.classes].map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div></div>
  <div id="rbody">${loading()}</div>`;
  const reload = () => { S.recDate = $('#rd').value; S.recKind = $('#rk').value; S.recCls = $('#rc').value; go('record'); };
  ['#rd', '#rk', '#rc'].forEach(s => $(s).onchange = reload);
  const res = await call('classSheet', { cls, date, kind, all: !!S.recAll }), rows = res.rows;
  const self = kind !== '정규';
  $('#rbody').innerHTML = `
   ${kind === '정규' ? `<div class="card row" style="padding:10px 12px"><span class="mini sp">${res.day}요일 정규수업 학생만 표시${res.hidden ? ` · 오늘 수업 없는 학생 ${res.hidden}명 숨김` : ''} (학생 시트 ‘수업요일’ 기준)</span><label class="mini" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="recAll" ${S.recAll ? 'checked' : ''}>전체 보기</label></div>` : ''}
   <div class="row" style="margin-bottom:8px"><button class="btn ghost sm" id="allIn">전원 출석</button><span class="mini sp">값을 누르면 선택, 다시 누르면 해제. 학생 옆 빨간 숫자 = 최근 7일 미제출 과제.</span></div>
   ${rows.map(r => `<div class="stu" data-sid="${esc(r.학생ID)}"><div class="row"><span class="nm">${esc(r.이름)}</span><span class="mini">${esc(r.수업요일)}</span>${r.미제출 ? `<span class="chip c-bad">미제출 ${r.미제출}</span>` : ''}${r.수정필요 ? `<span class="chip c-warn">다시 할 것 ${r.수정필요}</span>` : ''}${r.저장됨 ? '<span class="chip c-ok">저장됨</span>' : ''}</div>
    <div class="row" style="margin-top:6px;gap:6px">${seg('출결', ['출석', '지각', '결석'], r.출결, 'c')}${self ? seg('학습완료', ['완료', '미완료'], r.학습완료, 'c') : seg('숙제확인', ['완료', '일부', '미완료'], r.숙제확인, 'c')}${seg('태도', ['좋음', '보통', '주의'], r.태도, 'c')}</div>
    <div class="fg" style="margin-top:6px"><input type="text" name="특이사항" value="${esc(r.특이사항)}" placeholder="특이사항"><input type="text" name="다음확인" value="${esc(r.다음확인)}" placeholder="다음 수업에서 확인할 것 → 자동 인계"></div></div>`).join('') || '<div class="card empty">학생 없음</div>'}
   <button class="btn bur" style="width:100%;margin-top:6px" id="saveRec">저장하기</button>
   <div class="basis">${self ? '자습: 출석과 실제 학습 완료를 따로 기록합니다.' : '정규수업: 숙제 확인은 시스템 제출 기록과 별도로, 교재·노트 실물 확인 결과를 적습니다.'} ‘다음 확인’에 적은 내용은 다른 선생님의 ‘오늘 할 일 › 인계 사항’에 자동으로 뜹니다.</div>`;
  if ($('#recAll')) $('#recAll').onchange = () => { S.recAll = $('#recAll').checked; go('record'); };
  $('#allIn').onclick = () => $$('.seg[data-name="출결"]').forEach(s => { $$('button', s).forEach(b => b.classList.toggle('on', b.dataset.v === '출석')); });
  $('#saveRec').onclick = async () => {
    const data = $$('[data-sid]').map(box => ({ 학생ID: box.dataset.sid, 출결: segVal(box, '출결'), 숙제확인: segVal(box, '숙제확인'), 학습완료: segVal(box, '학습완료'), 태도: segVal(box, '태도'), 특이사항: $('[name=특이사항]', box).value, 다음확인: $('[name=다음확인]', box).value }));
    try { const r = await call('saveClassRecords', { date, kind, rows: data }); toast(r.saved + '명 저장'); go('record'); } catch (e) { fail(e); }
  };
};

/* ================= 교사: 테스트 입력 ================= */
VIEWS.test = async m => {
  const th = S.th || (S.th = await call('teacherHome'));
  const cls = S.tCls || th.classes[0] || '전체';
  const opts = S.opts || (S.opts = await call('studentOptions'));
  const studs = opts.filter(o => cls === '전체' || o.반 === cls);
  m.innerHTML = `<h2>테스트 결과 입력</h2>
  <div class="card"><div class="fg">
   <div><label class="f">날짜</label><input type="date" id="td" value="${todayStr()}"></div>
   <div><label class="f">반</label><select id="tc">${['전체', ...th.classes].map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
   <div><label class="f">영역</label><select id="ta">${th.areas.filter(a => a !== '오답정리').map(a => `<option>${a}</option>`).join('')}</select></div>
   <div><label class="f">범위</label><input type="text" id="tr" placeholder="예: DAY 05 / L3 본문"></div>
   <div><label class="f">만점(문항 수)</label><input type="number" id="tm" inputmode="numeric"></div>
   <div><label class="f">통과 점수</label><input type="number" id="tp" placeholder="자동" inputmode="numeric"></div></div>
   <div class="basis">통과 점수를 비우면 설정값 적용 (단어 100%, 그 외 80%). 서술형은 문법·어순·철자·필수조건 기준표로 채점한 점수를 넣어 주세요.</div></div>
  ${studs.map(s => `<div class="stu" data-ts="${esc(s.학생ID)}"><div class="row"><span class="nm" style="min-width:64px">${esc(s.이름)}</span><input type="number" name="sc" placeholder="점수" style="max-width:96px" inputmode="numeric"><input type="text" name="wr" placeholder="틀린 단어/문항 (쉼표)" class="sp"></div>
   <div class="row" style="margin-top:6px;gap:4px">${th.causes.map(c => `<label class="mini" style="display:inline-flex;gap:3px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:2px 6px"><input type="checkbox" value="${esc(c)}">${esc(c)}</label>`).join('')}</div></div>`).join('')}
  <button class="btn bur" style="width:100%" id="saveT">저장 (미통과자는 자동으로 재시험 대기)</button>
  <h2>오답 원인 기록 (숙제·수업 중 발견)</h2>
  <div class="card"><div class="fg"><select id="ws">${opts.map(o => `<option value="${esc(o.학생ID)}">${esc(o.반)} · ${esc(o.이름)}</option>`).join('')}</select>
   <select id="wa">${th.areas.map(a => `<option>${a}</option>`).join('')}</select><select id="wc">${th.causes.map(c => `<option>${esc(c)}</option>`).join('')}</select><input type="text" id="wsrc" placeholder="출처 (예: 워크북 p.32)"></div>
   <textarea id="wq" style="margin-top:8px" placeholder="오답 문항 (한 줄에 하나)"></textarea><button class="btn sm" style="margin-top:8px" id="saveW">오답 기록</button>
   <div class="basis">기록된 오답은 학생 화면 ‘오답 고치기’에 나타나고, 같은 원인이 반복되면 대시보드에 자동 표시됩니다.</div></div>`;
  $('#tc').onchange = () => { S.tCls = $('#tc').value; go('test'); };
  $('#saveT').onclick = async () => {
    const rows = $$('[data-ts]').map(b => ({ 학생ID: b.dataset.ts, 점수: $('[name=sc]', b).value, 틀린항목: $('[name=wr]', b).value, 원인: $$('input[type=checkbox]:checked', b).map(x => x.value) })).filter(r => r.점수 !== '');
    if (!rows.length) return toast('점수를 입력한 학생이 없습니다.', true);
    try { const r = await call('saveTests', { 날짜: $('#td').value, 영역: $('#ta').value, 범위: $('#tr').value, 만점: $('#tm').value, 통과점수: $('#tp').value, rows }); toast(r.saved + '명 저장 · 재시험 대상 ' + r.failed + '명'); S.th = null; go('test'); } catch (e) { fail(e); }
  };
  $('#saveW').onclick = async () => { try { const r = await call('addWrongs', { 학생ID: $('#ws').value, 영역: $('#wa').value, 원인: $('#wc').value, 출처: $('#wsrc').value, 문항: $('#wq').value }); toast(r.saved + '개 오답 기록'); $('#wq').value = ''; } catch (e) { fail(e); } };
};

/* ================= 교사: 과제 배정 ================= */
VIEWS.assign = async m => {
  const th = S.th || (S.th = await call('teacherHome'));
  const tpl = await call('weekTemplate'), opts = S.opts || (S.opts = await call('studentOptions'));
  const ws = S.aWs || monday(todayStr());
  const evOpts = ['단어테스트', '사진', '작성', '음성'];
  m.innerHTML = `<h2>주간 숙제 일괄 배정</h2>
  <div class="card"><div class="fg"><div><label class="f">반</label><select id="ac">${th.classes.map(c => `<option>${esc(c)}</option>`).join('')}<option>전체</option></select></div>
   <div><label class="f">주 시작(월)</label><input type="date" id="aw" value="${ws}"></div>
   <div><label class="f">제외할 학생 (선택)</label><select id="ax" multiple style="height:70px">${opts.map(o => `<option value="${esc(o.학생ID)}">${esc(o.반)} · ${esc(o.이름)}</option>`).join('')}</select></div></div>
   <div class="basis">기본 계획표(시트 ‘주간기본계획’)를 불러왔습니다. <b>체크된 과제가 모두 만들어집니다.</b> 범위·단어 수는 선택이에요(단어 수를 비우면 학생이 전체 문항 수를 직접 입력). 오늘 이전 날짜는 자동으로 빠집니다.</div></div>
  ${DOWS.map((dw, i) => { const rows = tpl.filter(t => t.요일 === dw); if (!rows.length) return ''; return `<div class="card"><h3>${dw}요일</h3>${rows.map(t => `<div class="row tplr" data-day="${i}" data-area="${esc(t.영역)}" data-ev="${esc(t.증거유형)}" style="margin:6px 0"><input type="checkbox" checked><span class="chip c-navy">${esc(t.영역)}</span><input type="text" name="title" value="${esc(t.제목)}" class="sp" style="min-width:140px"><input type="text" name="range" placeholder="범위 (예: DAY 05)" style="max-width:170px">${t.증거유형 === '단어테스트' ? '<input type="number" name="max" placeholder="단어 수" style="max-width:90px" inputmode="numeric">' : ''}</div>`).join('')}</div>`; }).join('')}
  <button class="btn bur" style="width:100%" id="mkWeek">이번 주 과제 만들기</button>

  <h2>개별 과제 (보충·학생별 추가)</h2>
  <div class="card"><div class="fg">
   <div><label class="f">날짜</label><input type="date" id="id1" value="${todayStr()}"></div>
   <div><label class="f">대상</label><select id="id2"><optgroup label="반">${th.classes.map(c => `<option value="반:${esc(c)}">${esc(c)} 전체</option>`).join('')}</optgroup><optgroup label="학생">${opts.map(o => `<option value="학생:${esc(o.학생ID)}">${esc(o.반)} · ${esc(o.이름)}</option>`).join('')}</optgroup></select></div>
   <div><label class="f">영역</label><select id="id3">${th.areas.map(a => `<option>${a}</option>`).join('')}</select></div>
   <div><label class="f">제출 증거</label><select id="id4">${evOpts.map(e => `<option>${e}</option>`).join('')}</select></div>
   <div><label class="f">제목</label><input type="text" id="id5" placeholder="예: 과거 부정문 보완 10문항"></div>
   <div><label class="f">범위</label><input type="text" id="id6"></div>
   <div><label class="f">만점/단어 수</label><input type="number" id="id7" inputmode="numeric"></div></div>
   <button class="btn sm" style="margin-top:10px" id="mkOne">과제 추가</button></div>`;
  $('#id3').onchange = () => { $('#id4').value = th.evidence[$('#id3').value] || '사진'; };
  $('#id3').onchange();
  $('#aw').onchange = () => { S.aWs = monday($('#aw').value); go('assign'); };
  $('#mkWeek').onclick = async () => {
    const cls = $('#ac').value, ex = [...$('#ax').selectedOptions].map(o => o.value).join(',');
    const today = todayStr(); let past = 0;
    const list = $$('.tplr').filter(r => { if (!$('input[type=checkbox]', r).checked) return false; if (addD(ws, +r.dataset.day) < today) { past++; return false; } return true; }).map(r => ({
      날짜: addD(ws, +r.dataset.day), 대상반: cls, 제외학생ID: ex, 영역: r.dataset.area, 제목: $('[name=title]', r).value, 범위: $('[name=range]', r).value, 증거유형: r.dataset.ev, 만점: $('[name=max]', r) ? $('[name=max]', r).value : '' }));
    if (!list.length) return toast(past ? '오늘 이후 날짜의 체크된 과제가 없습니다.' : '체크된 과제가 없습니다.', true);
    if (!confirm(cls + ' · ' + list.length + '개 과제를 만들까요?' + (past ? '\n(지난 날짜 ' + past + '개는 제외)' : ''))) return;
    try { const r = await call('createTasks', { list }); toast(r.saved + '개 과제 생성' + (past ? ' · 지난 날짜 ' + past + '개 제외' : '')); go('assign'); } catch (e) { fail(e); }
  };
  $('#mkOne').onclick = async () => {
    const tg = $('#id2').value.split(':');
    try { const r = await call('createTasks', { list: [{ 날짜: $('#id1').value, 대상반: tg[0] === '반' ? tg[1] : '', 대상학생ID: tg[0] === '학생' ? tg[1] : '', 영역: $('#id3').value, 증거유형: $('#id4').value, 제목: $('#id5').value, 범위: $('#id6').value, 만점: $('#id7').value }] }); toast(r.saved ? '과제 추가 완료' : '제목을 입력해 주세요', !r.saved); } catch (e) { fail(e); }
  };
};

/* ================= 교사: 주간 코멘트 ================= */
VIEWS.comment = async m => {
  const th = S.th || (S.th = await call('teacherHome'));
  const cls = S.cCls || th.classes[0] || '전체', ws = S.cWs || monday(todayStr());
  const rows = await call('weeklyCommentSheet', { cls, ws });
  m.innerHTML = `<h2>주간 학부모 보고 코멘트</h2>
  <div class="card fg"><div><label class="f">반</label><select id="cc">${['전체', ...th.classes].map(c => `<option ${c === cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
   <div><label class="f">주 시작(월)</label><input type="date" id="cw" value="${ws}"></div></div>
  <div class="basis" style="margin:-4px 0 10px">여기 쓴 내용이 학부모 화면 ‘개선된 부분 / 다음 주 집중 관리 목표’에 그대로 표시됩니다. 비워 두면 ‘미입력’으로 보입니다.</div>
  ${rows.map(r => `<div class="stu" data-cs="${esc(r.학생ID)}"><div class="row"><span class="nm">${esc(r.이름)}</span><span class="mini">달성률 ${r.rate === null ? '데이터 없음' : r.rate + '%'} · 미완료 ${r.open}</span>${r.작성됨 ? '<span class="chip c-ok">작성됨</span>' : '<span class="chip c-mute">미작성</span>'}</div>
   ${r.auto.length ? `<div class="mini">자동 감지: ${esc(r.auto.join(' / '))}</div>` : ''}
   <textarea name="g" placeholder="개선된 부분 (구체적으로)" style="margin-top:6px;min-height:52px">${esc(r.개선점)}</textarea>
   <textarea name="n" placeholder="다음 주 집중 관리 목표" style="margin-top:6px;min-height:52px">${esc(r.다음주목표)}</textarea>
   <button class="btn sm" style="margin-top:6px" onclick="saveCm(this)">저장</button></div>`).join('')}`;
  $('#cc').onchange = () => { S.cCls = $('#cc').value; go('comment'); };
  $('#cw').onchange = () => { S.cWs = monday($('#cw').value); go('comment'); };
};
async function saveCm(b) {
  const box = b.closest('[data-cs]'); b.disabled = true;
  try { await call('saveWeeklyComment', { 학생ID: box.dataset.cs, 주시작일: S.cWs || monday(todayStr()), 개선점: $('[name=g]', box).value, 다음주목표: $('[name=n]', box).value }); toast('저장'); const c = $('.chip', box); c.className = 'chip c-ok'; c.textContent = '작성됨'; } catch (e) { fail(e); }
  b.disabled = false;
}

/* ================= 시작 ================= */
(function init() {
  const t = store.get('stella_token');
  if (t) { Object.assign(S, { token: t, role: store.get('stella_role'), name: store.get('stella_name'), tab: store.get('stella_tab') }); shell(); }
  else loginView();
})();
</script>
