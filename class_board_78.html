<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판서 수업 보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--gold:#c98a12;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--soft:#eef0f6;--hl:#fff1b8;--key:#8a2240;--fs:1;
--display:"Do Hyeon","Noto Sans KR",sans-serif;--body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--hl:#5a4a12;--key:#ff9fb6;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px}
.brand{font-family:var(--display);font-size:22px;margin-right:6px;white-space:nowrap}
select{font:inherit;font-size:15px;padding:5px 8px;border-radius:8px;border:0;background:#fff;color:#1b2133}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.seg button{background:transparent;border:0;color:#fff;padding:5px 14px;border-radius:8px;font-size:15px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.sp{flex:1}
.tg{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;font-size:14px;white-space:nowrap}
.tg.on{background:var(--gold);border-color:var(--gold);color:#1b2133;font-weight:700}
#stage{flex:1;position:relative;overflow:hidden}
#scroll{position:absolute;inset:0;overflow:auto;padding:22px 28px 90px}
#slide{max-width:1180px;margin:0 auto;font-size:calc(22px*var(--fs))}
.ttl{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ttl .tag{background:var(--bur);color:#fff;font-size:.62em;padding:3px 10px;border-radius:6px;font-weight:700}
.ttl h1{font-family:var(--display);font-weight:400;font-size:1.55em;margin:0;line-height:1.2}
.ttl .cnt{color:var(--muted);font-size:.65em}
.ctx{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ctx div{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:8px 12px;font-size:.72em}
.ctx b{display:block;color:var(--bur);font-size:.85em}
.keys{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.75em}
.keys .k{display:flex;gap:10px;margin:3px 0}.keys .k b{color:var(--key)}
.map{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.map span{background:var(--soft);border:1px dashed var(--muted);border-radius:20px;padding:3px 12px;font-size:.66em}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;transition:opacity .2s,box-shadow .2s}
.ln .sp{flex:none;font-weight:900;color:#fff;background:var(--navy);border-radius:8px;min-width:2em;text-align:center;padding:0 6px;font-size:.8em;line-height:1.9}
.ln .sp.b{background:var(--bur)}
.ln .no{color:var(--muted);font-weight:700;font-size:.8em;min-width:1.6em;line-height:1.9}
.en{line-height:1.55;font-weight:500}
.en .sl{color:var(--gold);font-weight:900;margin:0 .15em}
.en .kx{color:var(--key);font-weight:700;border-bottom:2px solid currentColor}
.en .kx.hid{color:transparent;background:var(--soft);border-bottom:2px dashed var(--muted);border-radius:4px;cursor:pointer}
.gm{background:var(--hl);border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--gold)}
.ko{color:var(--muted);font-size:.72em;margin-top:2px}
.kw{color:var(--navy);font-size:.62em;margin-top:2px;opacity:.8}
.say{background:none;border:0;font-size:.9em;opacity:.5;padding:0 4px}
.ln:hover .say{opacity:1}
.dim .ln{opacity:.28}.dim .ln.focus{opacity:1;box-shadow:0 0 0 3px var(--gold)}
body.noko .ko,body.noko .kw{display:none}
body.nosl .sl{display:none}
/* grammar */
.gp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.gp div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--bur);border-radius:10px;padding:10px 14px;font-size:.72em;line-height:1.5}
.gp div b{color:var(--bur)}
h2{font-size:.85em;margin:18px 0 8px;color:var(--navy)}
:root[data-theme="dark"] h2{color:#9fb4ff}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:6px 0;font-size:.85em;cursor:pointer}
.ex small{color:var(--muted);font-size:.65em;display:block}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.q .qq{font-weight:700;line-height:1.5;margin-bottom:10px}
.q .op{display:block;width:100%;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:10px;padding:7px 12px;margin:5px 0;color:var(--ink);font-size:.85em}
.q .op.ok{border-color:#1f8a4c;background:#e3f6ea;color:#14532d}
.q .op.no{border-color:#c0392b;background:#fbe7e5;color:#7f1d1d}
.ans{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--hl);font-size:.8em;display:none}
.ans.show{display:block}
.rv{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:6px 16px;margin-top:6px;font-size:.75em}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;pointer-events:none}
#nav>*{pointer-events:auto}
.nb{background:var(--navy);color:#fff;border:0;border-radius:50%;width:52px;height:52px;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.dots{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:30px}
.dots button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;padding:0}
.dots button.on{background:var(--bur);border-color:var(--bur);color:#fff;font-weight:700}
/* pen */
#cv{position:absolute;inset:0;z-index:4;pointer-events:none;touch-action:none}
body.pen #cv{pointer-events:auto;cursor:crosshair}
#pbar{position:absolute;right:14px;top:14px;z-index:6;display:none;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
body.pen #pbar{display:flex}
#pbar button{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:18px;padding:0}
#pbar button.on{border-color:var(--ink)}
.ft{position:absolute;left:14px;bottom:8px;font-size:11px;color:var(--muted);z-index:1}
@media (max-width:760px){#scroll{padding:14px 14px 90px}.ctx,.gp{grid-template-columns:1fr}.brand{font-size:18px}}
</style>
</head>
<body>
<header>
 <div class="brand">🧑‍🏫 판서 수업 보드</div>
 <select id="book"></select>
 <div class="seg" id="lesSeg"></div>
 <div class="seg" id="tabSeg"></div>

</div>
<script>
const BOOKS=[{"id":"m1yun","name":"중1 동아(윤정미)","les":[{"l":"L7","title":"Find Your Dream","dlg":[{"t":"Watch and Check 1 · Minsu","who":"소녀와 민수","what":"민수의 장래 희망(스포츠 기자)","why":"모든 종류의 스포츠에 관심이 있어서","key":[["What do you want to be in the future?","너는 장래에 무엇이 되고 싶니? (장래 희망 묻기)"],["I'm interested in ~.","나는 ~에 관심이 있어. (관심 말하기)"]],"lines":[["G","[[What do you want to be]] / in the future, / Minsu?","민수야, 너는 장래에 무엇이 되고 싶니?"],["B","I [[want to be]] / a sports reporter.","나는 스포츠 기자가 되고 싶어."],["G","Oh, really? / Do you watch / [[a lot of]] sports games?","오, 정말? 너는 스포츠 경기를 많이 보니?"],["B","Yes, I do. / [[I'm interested in]] / all kinds of sports.","응, 그래. 나는 모든 종류의 스포츠에 관심이 있어."]]},{"t":"Watch and Check 2 · David","who":"소녀와 David","what":"David의 장래 희망(세계적으로 유명한 요리사)","why":"이탈리아 음식에 관심이 있어서","key":[["Are you interested in ~?","너는 ~에 관심이 있니? (관심 묻기)"],["They look delicious.","look + 형용사: ~해 보이다"]],"lines":[["G","David, / what are you making?","David, 너는 무엇을 만들고 있니?"],["B","I'm making / pizza and pasta.","나는 피자와 파스타를 만들고 있어."],["G","They [[look delicious]]. / [[Are you interested in]] / Italian food?","그것들은 맛있어 보여. 너는 이탈리아 음식에 관심이 있니?"],["B","Yes, I am. / I want to be / a [[world-famous chef]] / in the future!","응, 그래. 나는 장래에 세계적으로 유명한 요리사가 되고 싶어!"]]},{"t":"Watch and Check 3 · Hojin","who":"소녀와 호진","what":"호진의 장래 희망(작곡가)","why":"노래 쓰는 것에 정말 관심이 있어서","key":[["Do you want to be ~?","너는 ~이 되고 싶니?"],["I'm interested in -ing.","나는 ~하는 것에 관심이 있어. (in + 동명사)"]],"lines":[["G","What's this music, / Hojin? / It's [[awesome]].","호진아, 이 음악은 뭐니? 굉장하다."],["B","I'm [[writing a song]] / with this computer program.","나는 이 컴퓨터 프로그램으로 노래를 쓰고 있어."],["G","You're very good. / [[Do you want to be]] / a songwriter?","너 정말 잘한다. 너는 작곡가가 되고 싶니?"],["B","Yes, / I'm really interested / [[in writing]] songs.","응, 나는 노래를 쓰는 것에 정말 관심이 있어."]]},{"t":"Watch and Check 4 · Jacob","who":"소녀와 Jacob","what":"Jacob의 장래 희망(패션 디자이너)","why":"옷 만드는 것을 매우 좋아해서","key":[["I love to make ~.","나는 ~을 만드는 것을 매우 좋아해. (love + to부정사)"],["I'll make clothes for you someday.","언젠가 너를 위해 옷을 만들어 줄게."]],"lines":[["G","[[Are you interested in]] fashion, / Jacob?","Jacob, 너는 패션에 관심이 있니?"],["B","Yes, / I [[love to make]] clothes.","응, 나는 옷 만드는 것을 매우 좋아해."],["G","Really? / That's so cool!","정말? 정말 멋지다!"],["B","Thanks. / I want to be / a fashion designer. / I'll make clothes / for you / [[someday]].","고마워. 나는 패션 디자이너가 되고 싶어. 언젠가 너를 위해 옷을 만들어 줄게."]]},{"t":"Watch, Answer, and Talk · Jiho & Lucy","who":"Lucy와 지호","what":"지호는 조종사, Lucy는 비행기 엔지니어가 되고 싶다","why":"지호는 비행기 조종하기에, Lucy는 비행기 만들기에 관심이 있어서","key":[["Why don't we ~?","우리 ~하는 게 어때? (제안)"],["How about you?","너는 어때?"],["That sounds cool!","그거 멋지다! (sound + 형용사)"]],"lines":[["G","Jiho, / [[why don't we]] try this? / We can fly / an airplane!","지호야, 우리 이거 해 보는 게 어때? 우리는 비행기를 조종할 수 있어!"],["B","Sure. / It [[looks like fun]]!","좋아. 재미있어 보인다!"],["G","Do you want to be / a pilot / in the future?","너는 장래에 조종사가 되고 싶니?"],["B","Yes, / I'm interested / in [[flying airplanes]]. / [[How about you]], Lucy?","응, 나는 비행기 조종하는 것에 관심이 있어. 너는 어때, Lucy?"],["G","I'm interested / in making airplanes, / not flying. / I want to be / an [[airplane engineer]].","나는 비행기를 조종하는 게 아니라 만드는 것에 관심이 있어. 나는 비행기 엔지니어가 되고 싶어."],["B","That [[sounds cool]]!","그거 멋지다!"],["G","Thank you. / I want to make / an airplane / someday!","고마워. 나는 언젠가 비행기를 만들고 싶어!"],["B","Let's fly / this airplane, / and then / we can [[try making]] / an airplane, too.","이 비행기를 조종해 보고, 그다음에 비행기 만들기도 해 보자."],["G","Good idea.","좋은 생각이야."]]}],"par":[{"t":"① Jim (감독) & Anna (야외 촬영 관리자)","map":["Jim Brown – director of Happy Days","movie about friendship: Tom & dog Max","a lot of people – work hard – to create","Anna – found beach – location manager","job: find perfect places for shooting","not easy – love job – travel, challenges"],"s":[["Hi, I'm Jim Brown, / the director of <i>Happy Days</i>.","안녕하세요, 나는 'Happy Days'의 감독 Jim Brown이에요.","Jim Brown, director, Happy Days"],["It's a movie / about the friendship / between Tom  people around"],["So, / I use hand signals / to calm him.","그래서 나는 그를 진정시키기 위해 수신호를 사용해요.","hand signals, calm"],["Who am I?","나는 누구일까요?","Who"],["I'm an animal wrangler.","나는 동물 조련사예요.","animal wrangler"]]},{"t":"④ Emma (영화 편집자)","map":["Emma – film editor","work begins – after shooting is over","to create a better story – change order of scenes / delete some","storytelling skills – important – read a lot"],"s":[["My name is Emma, / and I'm a film editor.","내 이름은 Emma이고, 나는 영화 편집자예요.","Emma, film editor"],["My work begins / after the shooting / is over.","내 일은 촬영이 끝난 후에 시작돼요.","work begins, after, shooting, over"],["To create a better story, / I can change / the order of scenes / or delete some of them.","더 좋은 이야기를 만들기 위해, 나는 장면의 순서를 바꾸거나 그중 일부를 삭제할 수 있어요.","better story, change, order, delete"],["Storytelling skills / are important / for my job, / so I read a lot.","스토리텔링 기술이 내 일에 중요해서, 나는 책을 많이 읽어요.","storytelling skills, important, read"]]},{"t":"⑤ Chris (폴리 아티스트)","map":["Chris – Foley artist","create sound effects – studio","when recording on location – not easy","listen carefully – sound of waves","rice + plastic container","Doesn't it sound real?"],"s":[["I'm Chris, / and I'm a Foley artist.","나는 Chris이고, 폴리 아티스트예요.","Chris, Foley artist"],["I create sound effects / in my studio / when recording on location / is not easy.","나는 야외 촬영지에서 녹음하는 것이 쉽지 않을 때 내 작업실에서 음향 효과를 만들어요.","sound effects, studio, recording, not easy"],["Listen carefully.","잘 들어 보세요.","Listen"],["Do you hear / the sound of waves?","파도 소리가 들리나요?","hear, waves"],["I made that sound / with rice / and a plastic container.","나는 쌀과 플라스틱 통으로 그 소리를 만들었어요.","made, rice, plastic container"],["Doesn't it / sound real?","진짜처럼 들리지 않나요?","sound real"]]}],"gram":{"title":"to부정사","points":["부사적 용법(목적): to + 동사원형 = ~하기 위해 (= in order to)","부사적 용법(감정의 원인): glad/happy/sad/sorry + to부정사 = ~해서","명사적 용법: want/hope/plan/decide + to부정사 (~하는 것을) / My job is to find ~ (보어)","동명사: enjoy/finish/be interested in + -ing ],["Jiho","Cool! / We made / little snow ducks.","멋지다! 우리는 작은 눈오리들을 만들었어."],["Kate","Really? / I [[want to make]] / snow ducks, too.","정말? 나도 눈오리를 만들고 싶어."],["Jiho","[[Why don't we]] / make them now?","우리 지금 그것들을 만드는 게 어때?"],["Kate","Sure. / Let's go!","좋아. 가자!"]]}],"par":[{"t":"① 단어는 어떻게 의미를 가질까?","map":["Nick Allen – fifth grade","asked teacher – how words get meanings","why dog means a dog – not a book","Mrs. Granger: people give meanings to words","everyone agreed on the meaning","Nick: \"I didn't agree.\""],"s":[["Nick Allen / was in the fifth grade.","Nick Allen은 5학년이었다.","Nick Allen, fifth grade"],["One day / in English class, / he asked his teacher, / \"How do words / get their meanings?","어느 날 영어 수업 시간에, 그는 선생님께 여쭤보았다. \"단어는 어떻게 의미를 갖게 되나요?","English class, asked, words, meanings"],["Why does the word <i>dog</i> / mean a dog?","왜 '개'라는 단어는 개를 의미하나요?","Why, dog, mean"],["Why can't it / mean a book?\"","왜 그것이 책을 의미할 수는 없나요?\"","Why can't, book"],["Mrs. Granger answered, / \"People give meanings / to words.\"","Granger 선생님은 \"사람들이 단어에 의미를 부여한단다.\"라고 대답했다.","People, give meanings, words"],["Nick asked, / \"How?\"","Nick은 \"어떻게요?\"라고 물었다.","How"],["Mrs. Granger said, / \"You, me, and everyone / in the country / agreed on the meaning.\"","Granger 선생님은 \"너, 나, 그리고 이 나라의 모든 사람이 그 의미에 동의했단다.\"라고 말했다.","everyone, country, agreed on"],["Nick thought, / \"Really? / I didn't agree.\"","Nick은 생각했다. \"정말? 나는 동의하지 않았는데.\"","Really, didn't agree"]]},{"t":"② 펜의 새 이름 frindle","map":["way home – saw a pen – picked it up","had an idea","\"your new name is frindle\"","next day – told his friends","end of the week – all classmates using it","\"Can I borrow your frindle?\""],"s":[["On the way home, / Nick saw a pen / on the street.","집에 오는 길에, Nick은 길에서 펜 하나를 보았다.","way home, pen, street"],["He picked up the pen.","그는 그 펜을 주웠다.","picked up"],["He had an idea.","그에게 생각이 하나 떠올랐다.","idea"],["\"From today, / your new name / is <i>frindle</i>.\"","\"오늘부터 너의 새 이름은 frindle이야.\"","From today, new name, frindle"],["The next day, / he told his friends / about his new word.","다음 날, 그는 친구들에게 그의 새 단어에 대해 말했다.","next day, told, new word"],["By the end of the week, / all his classmates / were using it.","그 주말쯤에는, 그의 반 친구들 모두가 그 단어를 쓰고 있었다.","end of the week, classmates, using"],["\"Can I borrow / your frindle?\"","\"네 frindle 좀 빌려도 돼?\"","borrow"],["\"I think that / your red frindle / is pretty.\"","\"나는 네 빨간 frindle이 예쁘다고 생각해.\"","think that, red, pretty"]]},{"t":"③ 선생님의 편지","map":["after class – Mrs. Granger called Nick","\"not a real word – stop using it\"","Nick: \"too late – everyone is using it\"","took out a letter – wrote for you","not give it today","will send you this letter some day"],"s":[["One day after class, / Mrs. Granger called Nick.","어느 날 수업이 끝난 후, Granger 선생님이 Nick을 불렀다.","after class, called"],["She said, / \"<i>Frindle</i> is not / a real word.","그녀는 말했다. \"frindle은 진짜 단어가 아니야.","not, real word"],["You and your classmates / should stop using it.\"","너와 네 반 친구들은 그것을 그만 써야 해.\"","should, stop using"],["Nick said, / \"I know that / you're not happy.","Nick은 말했다. \"선생님이 기분이 좋지 않으신 거 알아요.","know that, not happy"],["I'm really sorry, / but it's too late.","정말 죄송하지만, 너무 늦었어요.","sorry, too late"],["Everyone is using it / now.\"","이제 모두가 그것을 쓰고 있어요.\"","Everyone, using"],["Mrs. Granger / took out a letter.","Granger 선생님은 편지 한 통을 꺼냈다.","took out, letter"],["She said, / \"I wrote this letter / for you.","그녀는 말했다. \"나는 너를 위해 이 편지를 썼단다.","wrote, letter, for you"],["But / I'm not going to give it / to you today.","하지만 오늘 너에게 주지는 않을 거야.","not going to, give, today"],["I will send you / this letter / some day.\"","언젠가 이 편지를 너에게 보내 줄게.\"","send, letter, some day"]]},{"t":"④ 전국으로 퍼진 frindle","map":["next morning – told the class","\"Stop using frindle!\"","more and more students used it","students in other schools","soon – whole country"],"s":[["The next morning, / Mrs. Granger told the class, / \"Stop using <i>frindle</i>!","다음 날 아침, Granger 선생님은 반 학생들에게 말했다. \"frindle 쓰는 것을 멈추렴!","next morning, told, Stop using"],["<i>Frindle</i> is not / a real word.\"","frindle은 진짜 단어가 아니야.\"","not, real word"],["But / more and more students / used it.","하지만 점점 더 많은 학생들이 그것을 썼다.","more and more, used"],["Students / in other schools / started using it.","다른 학교 학생들도 그것을 쓰기 시작했다.","other schools, started using"],["Soon, / students / in the whole country / were using it.","곧, 전국의 학생들이 그것을 쓰고 있었다.","Soon, whole country, using"]]},{"t":"⑤ 21살에 받은 소포","map":["time passed – graduated – forgot frindle","turned 21 – package from Mrs. Granger","pen, letter, dictionary","note: \"See page 541.\"","couldn't believe his eyes – found frindle!"],"s":[["Time passed / and Nick graduated.","시간이 흘러 Nick은 졸업했다.","Time passed, graduated"],["He forgot / about <i>frindle</i>.","그는 frindle에 대해 잊었다.","forgot"],["When he turned 21, / he received a package / from Mrs. Granger.","21살이 되었을 때, 그는 Granger 선생님에게서 소포를 받았다.","turned 21, received, package"],["It had a pen, / a letter, / and a dictionary.","그 안에는 펜 하나, 편지 한 통, 그리고 사전 한 권이 있었다.","pen, letter, dictionary"],["There was a note / on the dictionary.","사전 위에 쪽지가 하나 있었다.","note, dictionary"],["\"See page 541.\"","\"541쪽을 보렴.\"","See, page 541"],["Nick couldn't believe / his eyes.","Nick은 자신의 눈을 믿을 수 없었다.","couldn't believe, eyes"],["On that page, / he found / the word <i>frindle</i>!","그 페이지에서 그는 frindle이라는 단어를 발견했다!","that page, found, frindle"]]},{"t":"⑥ 선생님의 진심","map":["Congratulations! – real word now","on your side – from the beginning","every good story needs a bad guy","I played that role","I hope that you understand"],"s":[["Dear Nick,","Nick에게,","Dear"],["Congratulations! / <i>Frindle</i> is now / a real word.","축하해! frindle은 이제 진짜 단어란다.","Congratulations, now, real word"],["I was on your side / from the beginning.","나는 처음부터 네 편이었어.","on your side, beginning"],["But / every good story / needs a \"bad guy.\"","하지만 모든 좋은 이야기에는 '나쁜 사람'이 필요하지.","every good story, needs, bad guy"],["I played / that role.","내가 그 역할을 했단다.","played, role"],["I hope that / you understand...","네가 이해해 주길 바란다…","hope that, understand"]]}],"gram":{"title":"수여동사 · 접속사 that","points":["4형식: 주어 + 수여동사 + 간목 + 직목 (I will send you this letter.)","3형식: give/send/tell/write/show + to / make/buy + for","접속사 that: think/know/hope/believe + (that) + 주어 + 동사 (생략 가능)","지시사 that(저, 그)은 생략 불가","조건 영작: 4형식/3형식 지정, 단어 수 맞추기","직접목적어가 대명사 → 반드시 3형식 (give it to you)","that절: 주어 + 동사를 빠뜨리지 않기","본문 문장을 나의 상황으로 변형하기"],"q":[{"t":"mc","q":"다음 문장을 3형식으로 바르게 바꾼 것은?<br><br>I will send you this letter.","o":["I will send this letter for you.","I will send this letter you.","I will send to you this letter.","I will send you to this letter.","I will send this letter to you."],"a":4,"e":"send → to"},{"t":"mc","q":"밑줄 친 that을 생략할 수 있는 것은?","o":["<u>That</u> is my pen.","I played <u>that</u> role.","I know <u>that</u> you're not happy.","On <u>that</u> page, he found it.","Look at <u>that</u> snowman."],"a":2,"e":"목적어절 접속사"},{"t":"mc","q":"빈칸에 들어갈 수 <b>없는</b> 동사는?<br><br>I ______ that frindle is a real word.","o":["think","know","want","hope","believe"],"a":2,"e":"want는 that절 ×"},{"t":"mc","q":"어법상 <b>틀린</b> 문장은?","o":["I'm not going to give you it today.","I wrote my grandma a Christmas card.","She bought a sweater for me.","My mom made us a chocolate cake.","He told his friends the new word."],"a":0,"e":"give it to you"},{"t":"mc","q":"that이 들어갈 위치로 알맞은 곳은?<br><br>I (①) hope (②) you (③) understand (④) my (⑤) letter.","o":["①","②","③","④","⑤"],"a":1,"e":"hope + that + 주어 + 동사"},{"t":"mc","q":"어법상 알맞은 문장의 개수는?<br><br>ⓐ I think that it's a great idea.<br>ⓑ He bought a guitar to his son.<br>ⓒ We know the news is true.<br>ⓓ Mrs. Granger sent Nick a package.<br>ⓔ I believe that he honest.","o":["1개","2개","3개","4개","5개"],"a":2,"e":"ⓑ for / ⓔ he is → ⓐⓒⓓ 3개"},{"t":"sa","q":"다음 문장을 4형식으로 바꾸시오.<br>My aunt sent a sweater to me.","a":["My aunt sent me a sweater."],"e":"send + 간목 + 직목"},{"t":"sa","q":"두 문장을 that을 사용하여 한 문장으로 쓰시오. spicy]] food.","나는 떡볶이가 훨씬 더 좋아. 나는 매운 음식을 좋아해."],["B","Then, let's [[order]] tteokbokki. / It [[looks delicious]].","그럼 떡볶이를 주문하자. 맛있어 보여."],["G","OK. I'm so hungry!","좋아. 나 너무 배고파!"]]},{"t":"Watch and Check 3 · Souvenir","who":"소녀와 소년","what":"티셔츠와 모자 중 기념품 고르기","why":"티셔츠에 축제의 멋진 그림이 있어서","key":[["Which do you like better, A or B?","A와 B 중 어느 것을 더 좋아하니?"],["Why?","왜? (이유 묻기)"]],"lines":[["G","Let's get a [[souvenir]].","기념품을 사자."],["B","[[Which do you like better]], the T-shirt or the cap?","너는 티셔츠와 모자 중 어느 것이 더 좋아?"],["G","I like the T-shirt better.","나는 티셔츠가 더 좋아."],["B","Why?","왜?"],["G","[[There is]] a nice picture of the festival / [[on it]].","그 위에 축제의 멋진 그림이 있잖아."]]},{"t":"Watch and Check 4 · Flowers","who":"소녀와 소년","what":"빨간 꽃과 노란 꽃 중 어느 것이 더 좋은지","why":"노란색이 소녀가 가장 좋아하는 색이라서","key":[["Why do you like them more?","왜 그것들을 더 좋아하니?"]],"lines":[["G","Look! There are [[lots of]] pretty flowers here.","봐! 여기 예쁜 꽃들이 많아."],["B","Which do you / like more, / the red flowers or the yellow flowers?","빨간 꽃과 노란 꽃 중 어느 것이 더 좋아?"],["G","I like the yellow flowers more.","나는 노란 꽃이 더 좋아."],["B","[[Why do you like them more]]?","왜 그것들이 더 좋아?"],["G","Well, yellow is my [[favorite color]].","음, 노란색은 내가 가장 좋아하는 색이야."]]},{"t":"Watch, Answer, and Role-play · Fireworks","who":"Emma와 지한","what":"불꽃놀이 전까지 함께 할 일 정하기","why":"지한이 보트 타기가 더 재미있을 것 같다고 해서","key":[["What a surprise!","이게 웬일이야! (뜻밖의 만남)"],["Which do you like more?","어느 것을 더 좋아하니?"]],"lines":[["Emma","Hi, Jihan. / [[What a surprise]]!","안녕, 지한아. 이게 웬일이야!"],["Jihan","Hey, Emma. / Are you here / to see the [[fireworks]], / too?","안녕, Emma. 너도 불꽃놀이 보러 왔니?"],["Emma","Yes. I hear China, / Italy, and the USA are [[participating]] this year.","응. 올해는 중국, 이탈리아, 미국이 참가한대."],["Jihan","Don't [[forget]] Korea.","한국도 잊지 마."],["Emma","Of course, / Korea, too. / So, the fireworks start / at 7 p.m. / Right?","물론 한국도. 그래서 불꽃놀이는 오후 7시에 시작하지, 맞지?"],["Jihan","Yeah. Let's do something together / [[until then]].","응. 그때까지 같이 뭔가 하자."],["Emma","I guess we can ride bikes or [[go for a boat ride]]. / Which do you / like more?","자전거를 타거나 보트를 탈 수 있을 것 같아. 너는 어느 것이 더 좋아?"],["Jihan","Going for a boat ride. / I think it'll be [[more fun]].","보트 타기. 그게 더 재미있을 것 같아."],["Emma","Then, let's go / for a boat ride.","그럼 보트 타러 가자."]]}],"par":[{"t":"① Fallas Festival in Valencia, Spain","map":["Valencia – celebrate coming of spring","March 15 to 19","parades & fireworks","stars: fallas – giant wooden statues","burned on the last day","goodbye to old things – hello to a new start"],"s":[["People in Valencia celebrate the coming of spring / with the Fallas festival.","발렌시아 사람들은 Fallas 축제로 봄이 오는 것을 축하한다.","People, Valencia, celebrate, coming, spring"],["This festival takes place / from March 15 / to 19.","이 축제는 3월 15일부터 19일까지 열린다.","festival, takes, place, from, March"],["During the festival, / people enjoy parades / and fireworks.","축제 동안 사람들은 퍼레이드와 불꽃놀이를 즐긴다.","festival, people, enjoy, parades, fireworks"],["The stars of the festival are fallas, / giant wooden statues.","축제의 주인공은 거대한 나무 조각상인 fallas이다.","stars, festival, fallas, giant, wooden"],["You can find hundreds of them all over the city.","도시 곳곳에서 수백 개의 fallas를 볼 수 있다.","find, hundreds, over, city"],["Surprisingly, the fallas are burned / on the last day of the festival.","놀랍게도, fallas는 축제의 마지막 날에 불태워진다.","Surprisingly, fallas, burned, last, day"],["Burning them symbolizes saying goodbye / to old things / and hello to a new start.","그것들을 태우는 것은 오래된 것들에 작별을 고하고 새로운 시작을 맞이하는 것을 상징한다.","Burning, symbolizes, saying, goodbye, old"]]},{"t":"② Midsummer Festival in Sweden","map":["winter – long and dark → welcome summer","longest day of the year – special festival","Friday evening between June 19 and 25 – ends on Sunday","decorate a tall pole – flowers & leaves","traditional dances","sun hardly sets – all night long"],"s":[["Winter in Sweden is long / and dark, / so the people there especially welcome summer.","스웨덴의 겨울은 길고 어두워서, 그곳 사람들은 여름을 특히 반긴다.","Winter, Sweden, long, dark, people"],["To celebrate the longest day of the year, / they have a special festival.","일 년 중 가장 긴 날을 기념하기 위해, 그들은 특별한 축제를 연다.","celebrate, longest, day, year, special"],["They call it the Midsummer festival.","그들은 그것을 하지 축제라고 부른다.","call, Midsummer, festival"],["The festival starts / on the Friday evening between June 19 / and 25 and ends / on the Sunday.","축제는 6월 19일과 25일 사이의 금요일 저녁에 시작해서 일요일에 끝난다.","festival, starts, Friday, evening, between"],["During the festival, / people decorate a tall pole / with flowers and green leaves / and enjoy traditional dances around it.","축제 동안 사람들은 키 큰 기둥을 꽃과 초록 잎으로 장식하고 그 주위에서 전통 춤을 즐긴다.","festival, people, decorate, tall, pole"],["Because the sun hardly sets / at this time of year / in Sweden, / people can enjoy the festival all night long.","스웨덴에서는 이맘때 해가 거의 지지 않기 때문에, 사람들은 밤새도록 축제를 즐길 수 있다.","Because, sun, hardly, sets, time"]]},{"t":"③ Day of the Dead in Mexico","map":["dead people come back home – once a year","the Day of the Dead","festival – November 1 and 2","important to remember dead people","altars at home – parties in cemeteries","dress up like skeletons – big parades"],"s":[["Many Mexicans believe / that once a year dead people come back home / to meet their family / and friends.","많은 멕시코 사람들은 일 년에 한 번 죽은 사람들이 가족과 친구들을 만나러 집으로 돌아온다고 믿는다.","Many, Mexicans, believe, once, year"],["They call this day the Day of the Dead.","그들은 이날을 '죽은 자들의 날'이라고 부른다.","call, day, Dead"],["To welcome dead people, / Mexicans hold a festival / on November 1 / and 2.","죽은 사람들을 환영하기 위해, 멕시코 사람들은 11월 1일과 2일에 축제를 연다.","welcome, dead, people, Mexicans, hold"],["They believe it is important / to remember dead people.","그들은 죽은 사람들을 기억하는 것이 중요하다고 믿는다.","believe, important, remember, dead, people"],["So, people set up altars / in their homes / and have big parties / in cemeteries.","그래서 사람들은 집에 제단을 차리고 묘지에서 큰 파티를 연다.","people, set, altars, homes, big"],["In some areas, / people dress up / like skeletons and hold big parades.","어떤 지역에서는 사람들이 해골처럼 분장하고 큰 퍼레이드를 연다.","areas, people, dress, like, skeletons"]]},{"t":"④ Fur Rondy Festival in Alaska","map":["end of February – Fur Rondy","one of the biggest winter festivals","winter sports & Alaskan traditional games","Running of the Reindeer","fun costumes – run faster than reindeer","not really possible – doesn't matter – having fun"],"s":[["At the end of February, / people in Alaska hold the Fur Rondy festival, / one of the biggest winter festivals / in the world.","2월 말에 알래스카 사람들은 세계에서 가장 큰 겨울 축제 중 하나인 Fur Rondy 축제를 연다.","end, February, people, Alaska, hold"],["During this festival, / visitors can enjoy various winter sports / and Alaskan traditional games.","이 축제 동안 방문객들은 다양한 겨울 스포츠와 알래스카 전통 놀이를 즐길 수 있다.","festival, visitors, enjoy, various, winter"],["They can also enjoy many special events such as the Running of the Reindeer.","그들은 또한 '순록 달리기' 같은 많은 특별 행사도 즐길 수 있다.","enjoy, many, special, events, such"],["People who participate / in this race wear fun costumes / and try to run faster / than reindeer.","이 경주에 참가하는 사람들은 재미있는 의상을 입고 순록보다 더 빨리 달리려고 한다.","People, participate, race, wear, fun"],["Is it possible / to do so?","그렇게 하는 것이 가능할까?","possible"],["Not really, / but it doesn't matter.","그렇지는 않지만, 그건 중요하지 않다.","really, matter"],["Everyone is just having fun!","모두가 그저 즐거운 시간을 보내고 있다!","Everyone, having, fun"]]}],"gram":{"title":"가주어 it · call A B","points":["가주어 it: To 동사원형 ~ is 형용사. → It is 형용사 + to 동사원형 ~. ('그것' 해석 ×)","It is important to remember dead people. (진주어 = to remember ~)","call + 목적어 + 목적격보어(명사): A를 B라고 부르다 (as, to 쓰지 않음)","5형식(A = B) vs 4형식(~에게 …을) 구별","To부정사 주어 ↔ It ~ to 전환","It is + 형용사 + (for 사람) + to부정사 (의미상 주어)","call / name / make + 목적어 + 명사 보어","본문 축제 문장을 내 학교·지역 축제로 변형하기"],"q":[{"t":"mc","q":"밑줄 친 It의 쓰임이 나머지와 <b>다른</b> 것은?","o":["<u>It</u> is important to remember dead people.","<u>It</u> is fun to ride a boat.","<u>It</u> is 7 p.m. now.","<u>It</u> is not easy to keep secrets.","<u>It</u> is possible to run faster than reindeer."],"a":2  Break a Leg (유래)","map":["sounds like a bad thing – means Good luck","German actors – United States – early 20th century","wishing bad luck → go away","still used today","wish performers good luck before a show"],"s":[["Although \"Break a leg!\" / may sound like a bad thing, / it actually means \"Good luck!\"","\"다리를 부러뜨려!\"는 나쁜 말처럼 들릴 수도 있지만, 실제로는 \"행운을 빌어!\"라는 뜻이다.","Although, Break, leg, may, sound"],["German actors who came / to the United States / in the early 20th century first used this phrase.","20세기 초에 미국에 온 독일 배우들이 이 어구를 처음 사용했다.","German, actors, came, United, States"],["By wishing each other bad luck, / they believed that it would go away.","서로에게 불운을 빌어 줌으로써, 그들은 불운이 사라질 거라고 믿었다.","wishing, each, other, bad, luck"],["This expression is still used today.","이 표현은 오늘날에도 여전히 사용된다.","expression, still, used, today"],["\"Break a leg\" is a phrase / that people say / to wish performers good luck / before a show.","'Break a leg'는 사람들이 공연 전에 공연자에게 행운을 빌어 주기 위해 하는 어구이다.","Break, leg, phrase, people, say"]]},{"t":"③ Spill the Beans (상황)","map":["Tommy & Lisa – surprise party for Hana","Tommy – not good at keeping secrets","Lisa: \"Don't spill the beans.\"","promise not to tell Hana","kept his promise – big success","Hana completely surprised"],"s":[["Tommy and Lisa were preparing a surprise party / for Hana.","Tommy와 Lisa는 하나를 위한 깜짝 파티를 준비하고 있었다.","Tommy, Lisa, preparing, surprise, party"],["But Tommy was not good / at keeping secrets.","하지만 Tommy는 비밀을 잘 지키지 못했다.","Tommy, good, keeping, secrets"],["So, Lisa told him, / \"Don't spill the beans.\"","그래서 Lisa는 그에게 \"콩을 쏟지 마.\"라고 말했다.","Lisa, told, spill, beans"],["Tommy said, / \"Don't worry. / I promise not / to tell Hana.\"","Tommy는 \"걱정 마. 하나에게 말하지 않겠다고 약속할게.\"라고 말했다.","Tommy, worry, promise, tell, Hana"],["Tommy kept his promise / and the surprise party was a big success.","Tommy는 약속을 지켰고 깜짝 파티는 대성공이었다.","Tommy, kept, promise, surprise, party"],["Hana was completely surprised.","하나는 완전히 놀랐다.","Hana, completely, surprised"]]},{"t":"④ Spill the Beans (유래)","map":["meaning – reveal a secret","ancient Greek way of voting","white or black bean – big jar","voting completed – beans spilled – reveal results","new meaning"],"s":[["What does the phrase \"spill the beans\" mean?","'spill the beans'라는 어구는 무슨 뜻일까?","phrase, spill, beans, mean"],["It means to reveal a secret.","그것은 비밀을 누설한다는 뜻이다.","means, reveal, secret"],["Where does this phrase come / from?","이 어구는 어디에서 왔을까?","Where, phrase, come, from"],["It comes from an ancient Greek way of voting.","그것은 고대 그리스의 투표 방식에서 왔다.","comes, from, ancient, Greek, way"],["When Greeks voted, / they put a white or black bean / in a big jar.","그리스 사람들은 투표할 때 큰 항아리에 흰 콩이나 검은 콩을 넣었다.","When, Greeks, voted, put, white"],["When the voting was completed, / the beans were spilled / to reveal the results.","투표가 끝나면, 결과를 공개하기 위해 콩을 쏟았다.","When, voting, completed, beans, spilled"],["From then, / people began to use this phrase / with a new meaning.","그때부터 사람들은 이 어구를 새로운 의미로 쓰기 시작했다.","From, people, began, use, phrase"]]},{"t":"⑤ Take a Rain Check (상황)","map":["Sarah – movie with Emily","\"Do you want to see a movie with me today?\"","\"I have to take a rain check.\"","go to grandmother's house","\"Let's do it another time.\"","a little disappointed – understood"],"s":[["Sarah wanted to see a movie / with her best friend, / Emily.","Sarah는 가장 친한 친구 Emily와 영화를 보고 싶었다.","Sarah, wanted, see, movie, best"],["So, she asked Emily, / \"Do you want / to see a movie / with me today?\"","그래서 그녀는 Emily에게 \"오늘 나랑 영화 볼래?\"라고 물었다.","asked, Emily, want, see, movie"],["Emily replied, / \"I'm sorry, / but I have / to take a rain check.\"","Emily는 \"미안하지만, 다음으로 미뤄야겠어.\"라고 대답했다.","Emily, replied, sorry, take, rain"],["\"I have to go / to my grandmother's house today.\"","\"오늘 할머니 댁에 가야 하거든.\"","grandmother's, house, today"],["\"That's okay. / Let's do it another time,\" / said Sarah.","\"괜찮아. 다음에 하자.\"라고 Sarah가 말했다.","okay, another, time, Sarah"],["Although Sarah was a little disappointed, / she understood Emily's situation.","Sarah는 조금 실망했지만, Emily의 상황을 이해했다.","Although, Sarah, little, disappointed, understood"]]},{"t":"⑥ Take a Rain Check (유래)","map":["refuse an offer politely – do it later","baseball game – 1880s","ticket for a future game – canceled because of rain","other sporting events","over time – widely used"],"s":[["What does \"take a rain check\" mean?","'take a rain check'는 무슨 뜻일까?","take, rain, check, mean"],["It means to refuse an offer politely / but wish to do it later.","그것은 제안을 정중하게 거절하지만 나중에 하고 싶다는 뜻이다.","means, refuse, offer, politely, wish"],["The phrase \"rain check\" was first used / at a baseball game / in the 1880s.","'rain check'라는 어구는 1880년대에 야구 경기에서 처음 사용되었다.","phrase, rain, check, first, used"],["A rain check was a ticket / that people got / for a future game / when a baseball game was canceled / because of rain.","rain check는 야구 경기가 비 때문에 취소되었을 때 사람들이 다음 경기를 위해 받은 표였다.","rain, check, ticket, people, got"],["Later, rain checks were given / at other sporting events.","나중에, rain check는 다른 스포츠 행사에서도 주어졌다.","Later, rain, checks, given, other"],["Over time, / \"take a rain check\" has been widely used / to say that you can't do something now / and want to do it later.","시간이 지나면서, 'take a rain check'는 지금은 무언가를 할 수 없고 나중에 하고 싶다고 말할 때 널리 쓰이게 되었다.","Over, time, take, rain, check"]]}],"gram":{"title":"관계대명사 · although","points":["목적격 관계대명사: 사람 who(m)/that, 사물 which/that + 주어 + 동사 (목적어 없음)","관계사절 안에 목적어를 다시 쓰지 않음 (the ticket which people got <s>it</s>)","목적격은 생략 가능 / 주격(that keeps ~)은 생략 불가","although + 주어 + 동사 (비록 ~이지만) – but과 함께 쓰지 않음","조건 영작: 관계대명사 지정(which/who/that) 또는 생략","두 문장 결합 시 공통 명사 확인 → 뒤 문장 목적어 삭제","although ↔ but 전환 (의미 같게)","본문 문장을 나의 경험으로 변형하기"],"q":[{"t":"mc","q":"빈칸에 들어갈 말로 알맞은 것은?<br><br>A rain check was a ticket ______ people got for a future game.","o":["who","whom","which","what","whose"],"a":2,"e":"사물 선행사 + 목적격 → which/that"},{"t":"mc","q":"밑줄 친 관계대명사를 생략할 수 있는 것은?","o":["This is the phrase <u rmances.","신나는 콘서트와 공연도 즐길 수 있어요.","enjoy, exciting, concerts, performances"],["Do you like / to dance? / I can teach you how / to dance like me.","춤추는 것을 좋아하나요? 저처럼 춤추는 방법을 가르쳐 드릴 수 있어요.","like, dance, teach"]]},{"t":"③ 터보건 슬라이드","map":["many interesting activities","toboggan slide – built in 1884 – 200 meters long","toboggan = long narrow sled","like speed – get on","so fast that – roller coaster","amazing views of Quebec","castle on the left – icy river on the right"],"s":[["There are also / so many interesting activities you can do / at the carnival.","카니발에서 할 수 있는 흥미로운 활동도 정말 많아요.","many, interesting, activities, carnival"],["The toboggan slide was built / in 1884 and is 200 meters long.","터보건 슬라이드는 1884년에 만들어졌고 길이가 200미터예요.","toboggan, slide, built, 1884, 200"],["A toboggan is a long narrow sled.","터보건은 길고 좁은 썰매예요.","toboggan, long, narrow, sled"],["If you like speed, / get on the toboggan.","속도를 좋아한다면, 터보건을 타 보세요.","like, speed, get, toboggan"],["It is so fast / that you will feel / like you are / on a roller coaster.","그것은 너무 빨라서 롤러코스터를 타고 있는 것처럼 느껴질 거예요.","fast, feel, like, roller, coaster"],["While you're sliding down, / you can enjoy amazing views of Quebec.","미끄러져 내려가는 동안, 퀘벡의 놀라운 경치를 즐길 수 있어요.","While, sliding, down, enjoy, amazing"],["You can see a huge famous castle / on your left.","왼쪽에는 거대하고 유명한 성이 보여요.","see, huge, famous, castle, left"],["On your right, / you can see a beautiful icy river.","오른쪽에는 아름다운 얼어붙은 강이 보여요.","right, see, beautiful, icy, river"]]},{"t":"④ 얼음 카누 경주","map":["large crowd along the river – Ice Canoe Race","best part – shouldn't miss it","icy river – about three kilometers","teams of five – men and women","stuck in the ice – push the canoe","in the water again – finish line","so exciting that – forget about the cold"],"s":[["If you see a large crowd along the river, / it's time to watch the Ice Canoe Race.","강을 따라 많은 사람들이 모여 있다면, 얼음 카누 경주를 볼 시간이에요.","see, large, crowd, along, river"],["This race is one of the best parts of the c  // collect text; build map of char->node offset
 const walker=document.createTreeWalker(tmp,NodeFilter.SHOW_TEXT);const nodes=[];let txt="",n;
 while(n=walker.nextNode()){if(n.parentNode.classList&&n.parentNode.classList.contains("sl"))continue;nodes.push([n,txt.length]);txt+=n.nodeValue}
 const ranges=[];rx.forEach(r=>{r.lastIndex=0;let m;while(m=r.exec(txt)){let s=m.index,e=s+m[0].length;while(e>s&&/\s/.test(txt[e-1]))e--;while(s<e&&/\s/.test(txt[s]))s++;if(e>s)ranges.push([s,e]);if(!m[0].length)r.lastIndex++}});
 if(!ranges.length)return html;
 ranges.sort((a,b)=>a[0]-b[0]);const mg=[];ranges.forEach(r=>{const l=mg[mg.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else mg.push(r.slice())});
 // wrap from end
 for(let k=nodes.length-1;k>=0;k--){const [node,off]=nodes[k];const len=node.nodeValue.length;
  const segs=mg.filter(r=>r[0]<off+len&&r[1]>off).map(r=>[Math.max(r[0],off)-off,Math.min(r[1],off+len)-off]);
  if(!segs.length)continue;const frag=document.createDocumentFragment();let p=0;const v=node.nodeValue;
  segs.forEach(([a,b])=>{if(a>p)frag.appendChild(document.createTextNode(v.slice(p,a)));const sp=document.createElement("span");sp.className="gm";sp.textContent=v.slice(a,b);frag.appendChild(sp);p=b});
  if(p<len)frag.appendChild(document.createTextNode(v.slice(p)));node.parentNode.replaceChild(frag,node)}
 return tmp.innerHTML}
function enHTML(s){let h=s.replace(/\[\[(.+?)\]\]/g,(m,k)=>`\u0001${k}\u0002`);
 h=h.replace(/&(?![a-z#]+;)/g,"&amp;");
 h=h.replace(/\s*\/\s*/g,` <span class="sl">/</span> `);
 h=h.replace(/\u0001(.+?)\u0002/g,(m,k)=>`<span class="kx${st.bl?" hid":""}">${k}</span>`);
 return gmMark(h)}
function say(t,rate){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=rate||.9;const v=speechSynthesis.getVoices().find(v=>/en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function render(){
 const b=B();if(!b.les.find(l=>l.l===st.les))st.les=b.les[0].l;
 if(st.tab==="dlg"&&!L().dlg.length)st.tab="par";
 const it=items();if(st.i>=it.length)st.i=it.length-1;if(st.i<0)st.i=0;
 $("#book").value=st.book;
 $("#lesSeg").innerHTML=b.les.map(l=>`<button data-l="${l.l}" class="${l.l===st.les?"on":""}" title="${esc(l.title)}">${l.l}</button>`).join("");
 $("#tabSeg").innerHTML=[["dlg","💬 대화문"],["par","📖 본문"],["gram","✏️ 문법"]].map(([k,n])=>`<button data-t="${k}" class="${k===st.tab?"on":""}" ${k==="dlg"&&!L().dlg.length?"disabled title='이 단원은 대화문이 없어요'":""}>${n}</button>`).join("");
 document.body.classList.toggle("noko",!st.ko);document.body.classList.toggle("nosl",!st.sl);
 [["#tKo","ko"],["#tSl","sl"],["#tBl","bl"],["#tGm","gm"]].forEach(([id,k])=>$(id).classList.toggle("on",!!st[k]));
 document.documentElement.style.setProperty("--fs",st.fs);
 if(st.th)document.documentElement.dataset.theme=st.th;else delete document.documentElement.dataset.theme;
 const S=$("#slide");S.className="";
 if(st.tab==="dlg"){const d=it[st.i];
  S.innerHTML=`<div class="ttl"><span class="tag">${st.les} 대화문</span><h1>${esc(d.t)}</h1><span class="cnt">${st.i+1} / ${it.length}</span></div>
  <div class="ctx"><div><b>👥 누가</b>${esc(d.who)}</div><div><b>💡 무엇을</b>${esc(d.what)}</div><div><b>❓ 왜</b>${esc(d.why)}</div></div>
  ${d.key&&d.key.length?`<div class="keys">${d.key.map(k=>`<div class="k"><b>${esc(k[0])}</b><span>${esc(k[1])}</span></div>`).join("")}</div>`:""}
  <div class="lines">${d.lines.map((l,j)=>`<div class="ln" data-j="${j}"><span class="sp ${/^(B|M|Boy|Man)/.test(l[0])||j%2?"b":""}">${esc(l[0])}</span><div><div class="en">${enHTML(l[1])}</div><div class="ko">${esc(l[2])}</div></div><button class="say" title="듣기">🔊</button></div>`).join("")}</div>`;
 }else if(st.tab==="par"){const p=it[st.i];
  S.innerHTML=`<div class="ttl"><span class="tag">${st.les} 본문</span><h1>${p.t}</h1><span class="cnt">${st.i+1} / ${it.length}</span></div>
  ${p.map&&p.map.length?`<div class="map">${p.map.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`:""}
  <div class="lines">${p.s.map((s,j)=>`<div class="ln" data-j="${j}"><span class="no">${j+1}</span><div><div class="en">${enHTML(s[0])}</div><div class="ko">${esc(s[1])}</div>${s[2]?`<div class="kw">🔑 ${esc(s[2])}</div>`:""}</div><button class="say" title="듣기">🔊</button></div>`).join("")}</div>`;
 }else renderGram(S);
 S.querySelectorAll(".ln").forEach(el=>el.onclick=e=>{
  if(e.target.classList.contains("kx")&&e.target.classList.contains("hid")){e.target.classList.remove("hid");return}
  const t=plain(el.querySelector(".en").textContent.replace(/\//g," "));
  if(e.target.classList.contains("say")){say(t);return}
  const was=el.classList.contains("focus");S.querySelectorAll(".ln").forEach(x=>x.classList.remove("focus"));
  if(was){S.classList.remove("dim")}else{el.classList.add("focus");S.classList.add("dim");say(t)}});
 const n=it.length;$("#dots").innerHTML=st.tab==="gram"?"":Array.from({length:n},(_,k)=>`<button data-k="${k}" class="${k===st.i?"on":""}">${k+1}</button>`).join("");
 $("#prev").style.visibility=$("#next").style.visibility=st.tab==="gram"?"hidden":"visible";
 $("#dots").style.display=st.tab==="gram"?"none":"flex";
 $("#scroll").scrollTop=0;sv();loadInk();}
function renderGram(S){const l=L(),g=l.gram;
 const rx=(GRX[st.book]||{})[st.les]||[];
 const pool=[];l.dlg.forEach(d=>d.lines.forEach(x=>pool.push([x[1],x[2],"대화문 · "+d.t])));l.par.forEach(p=>p.s.forEach(x=>pool.push([x[0],x[1],"본문 · "+p.t.replace(/<[^>]+>/g,"")])));
 const hits=pool.filter(p=>{const t=plain(p[0]);return rx.some(r=>{r.lastIndex=0;return r.test(t)})}).slice(0,14);
 const keepGm=st.gm;st.gm=true;
 const exH=hits.map(h=>`<div class="ex" data-say="${esc(plain(h[0]))}"><span>${gmMark(esc(plain(h[0])))}</span><small>${esc(h[1])} · ${esc(h[2])}</small></div>`).join("");
 st.gm=keepGm;
 S.innerHTML=`<div class="ttl"><span class="tag">${st.les} 문법</span><h1>${esc(g.title)}</h1><span class="cnt">${esc(l.title)}</span></div>
 <h2>① 핵심 개념</h2><div class="gp">${g.points.map(p=>{const i=p.indexOf(":");return `<div>${i>0?`<b>${esc(p.slice(0,i))}</b><br>${esc(p.slice(i+1))}`:esc(p)}</div>`}).join("")}</div>
 <h2>② 교과서 속 예문 <span style="font-weight:400;color:var(--muted);font-size:.8em">— 클릭하면 듣기</span></h2>${exH||'<p class="ko">예문 없음</p>'}
 <h2>③ 함께 풀기 <span style="font-weight:400;color:var(--muted);font-size:.8em">(${g.q.length}문항)</span></h2>
 <div class="q" id="gq"></div>
 <div style="display:flex;gap:8px;justify-content:center;margin-top:10px"><button class="nb" id="qp" style="width:44px;height:44px;font-size:18px">◀</button><div class="dots" id="qd"></div><button class="nb" id="qn" style="width:44px;height:44px;font-size:18px">▶</button></div>`;
 S.querySelectorAll(".ex").forEach(e=>e.onclick=()=>say(e.dataset.say));
 let qi=st.qi||0;
 const drawQ=()=>{qi=Math.max(0,Math.min(g.q.length-1,qi));st.qi=qi;sv();const q=g.q[qi];const C="①②③④⑤";
  const ex=String(q.e||"").replace(/^[①②③④⑤]\s*/,"");
  const ansTxt=q.t==="mc"?`정답 ${C[q.a]} ${q.o[q.a]}`:`정답: ${(Array.isArray(q.a)?q.a:[q.a]).map(esc).join("<br>또는 ")}`;
  $("#gq").innerHTML=`<div class="qq">Q${qi+1}. ${q.q}</div>${q.t==="mc"?q.o.map((o,k)=>`<button class="op" data-k="${k}">${C[k]} ${o}</button>`).join(""):`<div class="ko" style="font-size:.75em">✍️ 칠판에 직접 써 보세요 (펜 기능)</div>`}
  <button class="rv">정답 보기</button><div class="ans"><b>${ansTxt}</b>${ex?`<br>💡 ${ex}`:""}</div>`;
  $("#gq").querySelectorAll(".op").forEach(o=>o.onclick=()=>{const k=+o.dataset.k;o.classList.add(k===q.a?"ok":"no");if(k===q.a){$("#gq .ans").classList.add("show")}});
  $("#gq .rv").onclick=()=>{$("#gq .ans").classList.toggle("show");if(q.t==="mc")$("#gq").querySelectorAll(".op")[q.a].classList.add("ok")};
  $("#qd").innerHTML=g.q.map((_,k)=>`<button class="${k===qi?"on":""}">${k+1}</button>`).join("");
  $("#qd").querySelectorAll("button").forEach((b,k)=>b.onclick=()=>{qi=k;drawQ()});redraw();};
 $("#qp").onclick=()=>{qi--;drawQ()};$("#qn").onclick=()=>{qi++;drawQ()};drawQ();}
/* ---- controls ---- */
$("#book").innerHTML=BOOKS.map(b=>`<option value="${b.id}">${b.name}</option>`).join("");
$("#book").onchange=e=>{st.book=e.target.value;st.i=0;st.qi=0;render()};
$("#lesSeg").onclick=e=>{const b=e.target.closest("[data-l]");if(b){st.les=b.dataset.l;st.i=0;st.qi=0;render()}};
$("#tabSeg").onclick=e=>{const b=e.target.closest("[data-t]");if(b&&!b.disabled){st.tab=b.dataset.t;st.i=0;render()}};
$("#dots").onclick=e=>{const b=e.target.closest("[data-k]");if(b){st.i=+b.dataset.k;render()}};

$("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
const tog=k=>{st[k]=!st[k];render()};
$("#tKo").onclick=()=>tog("ko");$("#tSl").onclick=()=>tog("sl");$("#tBl").onclick=()=>tog("bl");$("#tGm").onclick=()=>tog("gm");
$("#fUp").onclick=()=>{st.fs=Math.min(2,+(st.fs+.1).toFixed(1));render()};$("#fDn").onclick=()=>{st.fs=Math.max(.7,+(st.fs-.1).toFixed(1));render()};

$("#tFs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;
 if(e.key==="ArrowRight"||e.key==="PageDown")go(1);else if(e.key==="ArrowLeft"||e.key==="PageUp")go(-1);
 else if(e.key==="k")tog("ko");else if(e.key==="s")tog("sl");else if(e.key==="b")tog("bl");else if(e.key==="g")tog("gm");else if(e.key==="p")$("#tPen").click();
 else if(e.key==="Escape"){$("#slide").classList.remove("dim");$("#slide").querySelectorAll(".focus").forEach(x=>x.classList.remove("focus"))}});
/* ---- pen ---- */
const cv=$("#cv"),cx=cv.getContext("2d");let pen={c:"#e11d48"},ink={},drawing=null;
const inkKey=()=>`${st.book}|${st.les}|${st.tab}|${st.tab==="gram"?st.qi||0:st.i}`;
function fit(){const r=$("#stage").getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;cv.style.width=r.width+"px";cv.style.height=r.height+"px";redraw()}
function redraw(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,cv.width,cv.height);const sc=$("#scroll").scrollTop;
 (ink[inkKey()]||[]).forEach(s=>{cx.globalCompositeOperation=s.c==="er"?"destination-out":"source-over";cx.strokeStyle=s.c==="hl"?"rgba(253,224,71,.45)":s.c;cx.lineWidth=s.c==="hl"?22:s.c==="er"?30:4;cx.lineCap=cx.lineJoin="round";cx.beginPath();s.p.forEach((p,k)=>k?cx.lineTo(p[0],p[1]-sc):cx.moveTo(p[0],p[1]-sc));cx.stroke()});cx.globalCompositeOperation="source-over"}
function loadInk(){redraw()}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();drawing={c:pen.c,p:[[e.clientX-r.left,e.clientY-r.top+$("#scroll").scrollTop]]};(ink[inkKey()]=ink[inkKey()]||[]).push(drawing);cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drawing)return;const r=cv.getBoundingClientRect();drawing.p.push([e.clientX-r.left,e.clientY-r.top+$("#scroll").scrollTop]);redraw()});
["pointerup","pointercancel"].forEach(t=>cv.addEventListener(t,()=>drawing=null));
