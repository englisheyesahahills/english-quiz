:root{

.ib.star{font-size:16px;padding:4px 9px;line-height:1}
.ib.star.on{color:var(--gold);border-color:var(--gold)}
.ib.done{color:var(--par);border-color:var(--par)}
.empty{color:var(--mute);text-align:center;padding:30px 0;margin:0}

.editbar{display:flex;gap:6px;position:relative;z-index:2}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

async function copy(text, btn){

function isNew(d){ if(!d) return false; const t=Date.parse(d); return !isNaN(t) && (Date.now()-t) < 14*864e5; }
function cats(){ const s=new Set(links().map(l=>l.cat)); return [...CAT_ORDER.filter(c=>s.has(c)), ...[...s].filter(c=>!CAT_ORDER.includes(c))]; }

function cardHTML(l){
  const u = full(l.url);
  return `<article class="card">
    <a class="main" href="${esc(u)}" target="_blank" rel="noopener" aria-label="${esc(l.title)} 열기"></a>
    <div class="top"><span class="ico">${esc(l.icon||'🔗')}</span><h3>${esc(l.title)}</h3></div>
    <p class="d">${esc(l.desc)}</p>
    <div class="meta"><span class="tag ${esc(l.who)}">${esc(l.who)}</span>${isNew(l.added)?'<span class="tag new">NEW</span>':''}
      ${editing
        ? `<span class="editbar acts"><button class="ib" data-act="up" data-id="${esc(l.id)}" aria-label="앞으로">↑</button><button class="ib" data-act="down" data-id="${esc(l.id)}" aria-label="뒤로">↓</button><button class="ib" data-act="edit" data-id="${esc(l.id)}">수정</button><button class="ib" data-act="del" data-id="${esc(l.id)}">삭제</button></span>`
        : `<span class="acts"><button class="ib" data-act="copy" data-id="${esc(l.id)}">링크 복사</button><button class="ib star${favs.has(l.id)?' on':''}" data-act="fav" data-id="${esc(l.id)}" aria-label="즐겨찾기" aria-pressed="${favs.has(l.id)}">★</button></span>`}
    </div></article>`;
}
function formHTML(l){
  const c = cats();
  return `<form class="form" id="lf">
    <label>제목<input id="f-title" required value="${esc(l.title||'')}" placeholder="예: Bricks 60-1 수업 보드"></label>
    <label>파일 이름 또는 주소<input id="f-url" required value="${esc(l.url||'')}" placeholder="예: bricks61-board.html"></label>
    <label class="full">설명<input id="f-desc" value="${esc(l.desc||'')}" placeholder="한 줄 설명"></label>
    <label>분류<input id="f-cat" list="catlist" required value="${esc(l.cat||c[0]||'')}"><datalist id="catlist">${c.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
    <label>누가 쓰나요<select id="f-who">${WHO.map(w=>`<option${(l.who||'학생')===w?' selected':''}>${w}</option>`).join('')}</select></label>
    <label>아이콘 (이모지 1개)<input id="f-icon" value="${esc(l.icon||'🔗')}" maxlength="4"></label>
    <div class="row"><button class="btn gold" type="submit">${l.id?'수정 저장':'추가'}</button><button class="btn line" type="button" data-act="cancelForm">닫기</button></div>
  </form>`;
}

function render(){
  document.body.classList.toggle('edit', editing);
  $('editBtn').classList.toggle('on', editing);
  $('editBtn').textContent = editing ? '관리 끝내기' : '링크 관리';
  const all = links(), cs = cats();
  const counts = Object.fromEntries(cs.map(c=>[c, all.filter(l=>l.cat===c).length]));
  const favCount = all.filter(l=>favs.has(l.id)).length;
  $('chips').innerHTML = [`<button class="chip${cat==='all'?' on':''}" data-cat="all">전체<span class="n">${all.length}</span></button>`,
    favCount?`<button class="chip${cat==='fav'?' on':''}" data-cat="fav">★ 즐겨찾기<span class="n">${favCount}</span></button>`:'',
    ...cs.map(c=>`<button class="chip${cat===c?' on':''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${counts[c]}</span></button>`)].join('');

  const term = q.trim().toLowerCase();
  const match = l => !term || [l.title,l.desc,l.cat,l.who,l.url].join(' ').toLowerCase().includes(term);
  let html = '';
  if(draft) html += `<div class="notice"><p><b>이 브라우저에만 저장된 변경사항이 있어요.</b> 모든 선생님께 반영하려면 ‘코드 복사’ 후 GitHub의 teacher-hub.html 파일에서 <code>LINKS-START</code>와 <code>LINKS-END</code> 사이를 붙여넣으세요.</p><div class="row"><button class="btn gold" data-act="export">코드 복사</button><button class="btn warn" data-act="discard">원래대로</button></div></div>`;
  if(editing) html += formFor ? formHTML(formFor) : `<div><button class="btn" data-act="add">+ 새 링크 추가</button></div>`;

  const groups = [];
  if(cat==='all' && !term && favCount && !editing) groups.push(['★ 즐겨찾기', all.filter(l=>favs.has(l.id))]);
  const showCats = cat==='all' ? cs : cat==='fav' ? [] : [cat];
  if(cat==='fav') groups.push(['★ 즐겨찾기', all.filter(l=>favs.has(l.id)&&match(l))]);
  showCats.forEach(c=>groups.push([c, all.filter(l=>l.cat===c && match(l))]));
  const shown = groups.filter(([,ls])=>ls.length);
  html += shown.length ? shown.map(([name,ls])=>`<section><h2><span class="bar"></span>${esc(name)}<span class="cnt">${ls.length}개</span></h2><div class="grid">${ls.map(cardHTML).join('')}</div></section>`).join('')
                       : `<p class="empty">‘${esc(q)}’에 맞는 링크가 없어요.</p>`;
  $('list').innerHTML = html;
}

function commit(list){ draft = list; put('hubDraft', list); render(); }
function exportCode(){
  const body = links().map(l=>'  '+JSON.stringify({id:l.id,cat:l.cat,title:l.title,desc:l.desc,url:l.url,who:l.who,icon:l.icon,added:l.added||''})).join(',\n');
  return `const LINKS = [\n${body}\n];`;
}

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.cat){ cat=b.dataset.cat; render(); return; }
  if(b.id==='editBtn'){ editing=!editing; formFor=null; render(); return; }
  const id=b.dataset.id, list=links().slice(), i=list.findIndex(l=>l.id===id);
  switch(b.dataset.act){
    case 'copy': copy(full(list[i].url), b); break;
    case 'fav': favs.has(id)?favs.delete(id):favs.add(id); put('hubFavs',[...favs]); render(); break;
    case 'add': formFor={}; render(); $('f-title')?.focus(); break;
    case 'edit': formFor=list[i]; render(); $('f-title')?.focus(); break;
    case 'cancelForm': formFor=null; render(); break;
    case 'up': if(i>0){ [list[i-1],list[i]]=[list[i],list[i-1]]; commit(list); } break;
    case 'down': if(i<list.length-1){ [list[i+1],list[i]]=[list[i],list[i+1]]; commit(list); } break;
    case 'del':
      if(b.dataset.armed){ list.splice(i,1); commit(list); toast('삭제했어요'); }
      else { b.dataset.armed='1'; b.textContent='한 번 더'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='삭제'; } },2500); }
      break;
    case 'export': copy(exportCode()); toast('코드를 복사했어요 — GitHub 파일에 붙여넣으세요'); break;
    case 'discard':
      if(b.dataset.armed){ draft=null; put('hubDraft',null); render(); toast('원래 목록으로 돌렸어요'); }
      else { b.dataset.armed='1'; b.textContent='한 번 더 누르면 되돌려요'; }
      break;
  }
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='lf') return; e.preventDefault();
  const v = id => $(id).value.trim();
  const item = { id: formFor.id || ('l'+Date.now().toString(36)), cat:v('f-cat'), title:v('f-title'), desc:v('f-desc'), url:v('f-url'), who:v('f-who'), icon:v('f-icon')||'🔗', added: formFor.added || new Date().toISOString().slice(0,10) };
  const list = links().slice(); const i = list.findIndex(l=>l.id===item.id);
  if(i>-1) list[i]=item; else list.unshift(item);
  formFor=null; commit(list); toast(i>-1?'수정했어요':'추가했어요');
});
$('q').addEventListener('input', e=>{ q=e.target.value; render(); });
document.addEventListener('keydown', e=>{ if(e.key==='/' && !/input|textarea|select/i.test(document.activeElement.tagName)){ e.preventDefault(); $('q').focus(); } });
render();
</script>

</body></html>
