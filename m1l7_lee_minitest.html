<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Great Artists Mini Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column (max 680px) — sticky navy header band, day grid on home, one question card at a time */
:root{
  --navy:#1d2b4f; --burgundy:#8a2240; --gold:#c98a12;
  --bg:#f4f5f9; --card:#ffffff; --ink:#1b2133; --muted:#5c6478; --line:#dfe2ea;
  --soft:#eef0f6; --ok:#1d7a4a; --ok-bg:#e5f4ec; --bad:#b3263a; --bad-bg:#fbe9ec;
  --hdr:#1d2b4f; --hdr-ink:#ffffff; --chip:#ffffff; --chip-line:#c9cedb; --sel:#1d2b4f; --sel-ink:#ffffff;
  --display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --card:#1b2030; --ink:#e8eaf1; --muted:#a3a9ba; --line:#2d3346; --soft:#232a3d;
  --burgundy:#e0708c; --gold:#e8b04a; --ok:#5fcf8f; --ok-bg:#163527; --bad:#ff8094; --bad-bg:#3a1a22;
  --hdr:#0d1426; --hdr-ink:#ffffff; --chip:#232a3d; --chip-line:#3a4258; --sel:#8fa3d9; --sel-ink:#0d1426; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --card:#1b2030; --ink:#e8eaf1; --muted:#a3a9ba; --line:#2d3346; --soft:#232a3d;
  --burgundy:#e0708c; --gold:#e8b04a; --ok:#5fcf8f; --ok-bg:#163527; --bad:#ff8094; --bad-bg:#3a1a22;
  --hdr:#0d1426; --hdr-ink:#ffffff; --chip:#232a3d; --chip-line:#3a4258; --sel:#8fa3d9; --sel-ink:#0d1426; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-size:12px;opacity:.75;margin-left:6px;letter-spacing:0}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.bar{height:4px;background:rgba(255,255,255,.15)}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
main{padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.hero{display:grid;gap:6px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--burgundy);font-weight:700}
.hero h1{font-size:32px;line-height:1.2;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:14px}
.namebox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:18px}
.namebox label{font-size:14px;color:var(--muted);white-space:nowrap}
.namebox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);font-weight:700;outline:none}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.c-대화문{color:#2f6fb0}.tag.c-본문{color:#3c8a5a}.tag.c-문법{color:var(--burgundy)}.tag.c-통합{color:#8a5a12}.tag.c-서술형{color:#6a3fa0}.tag.c-실전{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{display:grid;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.day:hover,.day:focus-visible{border-color:var(--sel);outline:none}
.day .n{font-family:var(--display);font-size:20px;display:flex;justify-content:space-between;align-items:center}
.day .n em{font-style:normal;font-family:var(--body);font-size:13px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.day .t{font-size:13px;color:var(--muted);line-height:1.4}
.day.done{border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.qhead b{color:var(--ink);font-family:var(--display);font-size:18px;font-weight:400}
.type{font-size:12px;font-weight:700;color:var(--burgundy);border:1px solid currentColor;border-radius:6px;padding:1px 6px}
details.pass{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px}
details.pass summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
details.pass .ptxt{margin-top:8px;line-height:1.75;overflow-wrap:anywhere}
.qtext{font-size:17px;font-weight:500;margin-bottom:16px;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--chip);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;line-height:1.5}
.opt .num{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--chip-line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--sel)}.opt.sel .num{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.inp{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--chip-line);border-radius:10px;background:var(--chip);color:var(--ink)}
.inp:focus{outline:2px solid var(--sel);outline-offset:1px}
.built{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1.5px dashed var(--chip-line);border-radius:10px;margin-bottom:10px;align-content:flex-start}
.built:empty::before{content:"아래 단어를 순서대로 눌러 문장을 완성하세요";color:var(--muted);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.w{font:inherit;font-size:15px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--chip-line);background:var(--chip);color:var(--ink);cursor:pointer}
.w.used{opacity:.25;pointer-events:none}
.built .w{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:16px;padding:12px 18px;border-radius:10px;border:0;background:var(--navy);color:#fff;cursor:pointer;flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
.btn.accent{background:var(--burgundy)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.w:focus-visible,.opt:focus-visible,.hbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb{margin-top:16px;border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb .ans{font-weight:700}
.score{display:grid;gap:4px;text-align:center;padding:24px 18px}
.score .big{font-family:var(--display);font-size:64px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
:root:not([data-theme="light"]) .score .big{color:var(--ink)}
.score .meta{color:var(--muted);font-size:14px}
.review{display:grid;gap:8px;margin-top:16px}
.ri{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.ri .mk{font-weight:700;font-size:16px}.ri.ok .mk{color:var(--ok)}.ri.no .mk{color:var(--bad)}
.ri div{min-width:0;overflow-wrap:anywhere}
.ri .q{color:var(--muted)}
.sec{margin-top:24px;display:grid;gap:10px}
.sec h2{font-size:22px}
.point{background:var(--soft);border-radius:10px;padding:12px 16px}
.point ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.wsi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);display:grid;gap:8px}
.wsi .lines{border-bottom:1px solid var(--line);height:28px}
.wsi button{justify-self:start;font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 10px;cursor:pointer}
.wsi .a{color:var(--burgundy);font-weight:500;font-size:15px}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding-block:8px 24px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>

DAYS.push({d:20,cat:"문법",title:"문법 통합 (비교급·재귀대명사·감각동사)",

DAYS.push({d:22,cat:"통합",title:"본문 고난도 ① (문장 삽입·순서)",
point:["문장 삽입: So(결과), But(대조), They(앞 명사) 등이 단서","Van Gogh: 상황 → 문제(모델 비용) → 해결(자화상) / Kahlo: 시련 → 다짐 → 자화상"],

{t:"mc",q:"글의 흐름으로 보아 주어진 문장이 들어가기에 가장 알맞은 곳은?<br><br>He thought, “I don't have money for a model. What can I do?”<br><br>Vincent van Gogh was a Dutch artist. (①) He was not famous in his lifetime. (②) When he was 33, he moved to Paris. (③) He wanted to paint people, but models were too expensive. (④) So, Van Gogh started to paint himself. (⑤)",o:["①","②","③","④","⑤"],a:3,e:"모델이 비쌈 → 돈이 없다 생각 → 그래서 자신을 그림"},
{t:"mc",q:"주어진 문장 다음에 이어질 글의 순서로 알맞은 것은?<br><br>Frida Kahlo was a Mexican artist.<br>(A) When she was 18, she was in a terrible bus accident.<br>(B) When she was six years old, she was very sick.<br>(C) So, Kahlo started to paint herself.",o:["(A)-(B)-(C)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(B)-(A)","(A)-(C)-(B)"],a:1,e:"6세 → 18세 → 그래서"},
{t:"mc",q:"글의 흐름과 관계 <b>없는</b> 문장은?<br><br>Vincent van Gogh was a Dutch artist. ① He was not famous in his lifetime. ② When he was 33, he moved to Paris. ③ Paris is famous for the Eiffel Tower. ④ He wanted to paint people, but models were too expensive. ⑤ So, Van Gogh started to paint himself.",o:["①","②","③","④","⑤"],a:2,e:"에펠탑 정보는 무관"},

<script>
(function(){
const $=s=>document.querySelector(s), app=$("#app");
const KEY=CONF.key;
/* ▼ 노션 자동저장: Apps Script 웹앱 배포 URL을 아래 따옴표 안에 붙여넣으세요 ▼ */
const SAVE_URL="https://script.google.com/macros/s/AKfycbw0SDzVf8dPrc-pX0A2g9-R3NY9z2JCZJZuvFGDlVUhRHwFNsQvRMs_2pioyOvUPgLfvA/exec";
const UNIT=CONF.unit;
const QKEY=CONF.key+"_queue";
let store={name:"",best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s) store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const saveOn=()=>/^https:\/\/script\.google\.com\//.test(SAVE_URL);
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return []}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function post(payload){
  const r=await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  const j=await r.json(); if(!j.ok) throw new Error(j.msg||"save failed"); return j;}
async function flushQ(){ if(!saveOn())return; let q=getQ(); if(!q.length)return; const left=[];
  for(const p of q){try{await post(p)}catch(e){left.push(p)}} setQ(left);}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=s=>s.replace(/\[\[(.+?)\]\]/g,"<u>$1</u>").replace(/\n/g,"<br>");
const CIRC=["①","②","③","④","⑤"];
const TYPE={mc:"객관식",sa:"서술형",or:"배열"};
function norm(s){s=String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[“”]/g,'"');
  const m={"isn't":"is not","don't":"do not","doesn't":"does not","it's":"it is","i'm":"i am","it'll":"it will","aren't":"are not","can't":"cannot","won't":"will not","what's":"what is","they're":"they are"};
  for(const k in m)s=s.split(k).join(m[k]);
  return s.replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const fixedOpts=o=>o.every(x=>/^(\(|[①-⑤]|\d개)/.test(x));

let S=null; // session
$("#subb").textContent=CONF.sub;
function setBar(p){$("#bar").style.width=(p*100)+"%"}
$("#homeBtn").onclick=home;

function home(){
  S=null; $("#homeBtn").hidden=true; setBar(0); window.scrollTo(0,0);
  const doneN=Object.keys(store.best).length;
  const avg=doneN?Math.round(Object.values(store.best).reduce((a,b)=>a+b,0)/doneN*10):0;
  const cats=[...new Set(DAYS.map(d=>d.cat))];
  app.innerHTML=`
  <div class="hero"><span class="eyebrow">${CONF.eyebrow}</span>
  <h1>30일 미니테스트</h1>
  <p>하루 10문항 · ${CONF.flow} 순서로 진행합니다. 풀고 나면 같은 DAY의 연계 워크시트를 확인하세요.</p></div>
  <div class="namebox"><label for="nm">이름</label><input id="nm" placeholder="이름을 입력하세요" value="${esc(store.name)}" maxlength="20"></div>
  <div class="stats"><span>완료 <b>${doneN}</b>/30일</span><span>평균 <b>${avg}</b>점</span></div>
  <div class="legend">${cats.map(c=>`<span class="tag c-${c}">${c}</span>`).join("")}</div>
  <div class="grid">${DAYS.map(d=>{const b=store.best[d.d];return `<button class="day ${b!=null?"done":""}" data-d="${d.d}">
    <span class="n">DAY ${String(d.d).padStart(2,"0")}${b!=null?`<em>${b}/10</em>`:""}</span>
    <span class="tag c-${d.cat}" style="justify-self:start">${d.cat}</span>
    <span class="t">${esc(d.title)}</span></button>`}).join("")}</div>`;
  $("#nm").oninput=e=>{store.name=e.target.value.trim();save()};
  app.querySelectorAll(".day").forEach(b=>b.onclick=()=>start(+b.dataset.d));
}

function start(d,only){
  if(!store.name){const nm=$("#nm"); if(nm){nm.focus();nm.placeholder="먼저 이름을 입력하세요!";nm.parentNode.style.borderColor="var(--bad)";} return;}
  const day=DAYS[d-1];
  const idxs=only||day.q.map((_,i)=>i);
  S={day,list:idxs.map(i=>prep(day.q[i],i)),i:0,res:[],retry:!!only,t0:Date.now()};
  $("#homeBtn").hidden=false; showQ();
}
function prep(q,orig){
  const o={...q,orig};
  if(q.t==="mc"){const ord=q.o.map((_,i)=>i);o.ord=fixedOpts(q.o)?ord:shuffle(ord);}
  if(q.t==="or"){o.pool=shuffle(q.w.map((w,i)=>({w,i})));}
  return o;
}
function showQ(){
  window.scrollTo(0,0);
  const q=S.list[S.i], n=S.list.length;
  setBar(S.i/n);
  const pass=q.p?`<details class="pass" open><summary>지문 보기 / 접기</summary><div class="ptxt">${fmt(PASS[q.p])}</div></details>`:"";
  let body="";
  if(q.t==="mc") body=`<div class="opts">${q.ord.map((k,pos)=>`<button class="opt" data-k="${k}"><span class="num">${pos+1}</span><span>${fmt(q.o[k])}</span></button>`).join("")}</div>`;
  if(q.t==="sa") body=`<input class="inp" id="sa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력하세요">`;
  if(q.t==="or") body=`<div class="built" id="built"></div><div class="pool" id="pool">${q.pool.map((p,k)=>`<button class="w" data-k="${k}">${esc(p.w)}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="card">
   <div class="qhead"><b>DAY ${S.day.d}${S.retry?" · 오답 재도전":""}</b><span><span class="type">${TYPE[q.t]}</span> &nbsp;${S.i+1} / ${n}</span></div>
   ${pass}<div class="qtext">${S.i+1}. ${fmt(q.q)}</div>${body}
   <div id="fbx"></div>
   <div class="actions">${q.t==="or"?`<button class="btn ghost" id="reset">다시 배열</button>`:""}<button class="btn" id="go" disabled>정답 확인</button></div></div>`;
  const go=$("#go"); let pick=null, built=[];
  if(q.t==="mc") app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");pick=+b.dataset.k;go.disabled=false});
  if(q.t==="sa"){const inp=$("#sa");inp.oninput=()=>go.disabled=!inp.value.trim();inp.onkeydown=e=>{if(e.key==="Enter"&&!go.disabled)go.click()};setTimeout(()=>inp.focus({preventScroll:true}),50)}
  if(q.t==="or"){
    const draw=()=>{$("#built").innerHTML=built.map((k,j)=>`<button class="w" data-j="${j}">${esc(q.pool[k].w)}</button>`).join("");
      app.querySelectorAll("#pool .w").forEach(b=>b.classList.toggle("used",built.includes(+b.dataset.k)));
      app.querySelectorAll("#built .w").forEach(b=>b.onclick=()=>{if(S.locked)return;built.splice(+b.dataset.j,1);draw()});
      go.disabled=!built.length;};
    app.querySelectorAll("#pool .w").forEach(b=>b.onclick=()=>{if(S.locked)return;built.push(+b.dataset.k);draw()});
    $("#reset").onclick=()=>{if(S.locked)return;built=[];draw()};
  }
  S.locked=false;
  go.onclick=()=>{
    if(S.locked){next();return}
    let ok,user,right;
    if(q.t==="mc"){ok=pick===q.a;user=CIRC[q.ord.indexOf(pick)]+" "+q.o[pick];right=CIRC[q.ord.indexOf(q.a)]+" "+q.o[q.a];
      app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const k=+b.dataset.k;if(k===q.a)b.classList.add("right");else if(k===pick)b.classList.add("wrong")});}
    if(q.t==="sa"){const v=$("#sa").value;user=v;ok=q.a.some(a=>norm(a)===norm(v));right=q.a[0];$("#sa").disabled=true;}
    if(q.t==="or"){user=built.map(k=>q.pool[k].w).join(" ");ok=norm(user)===norm(q.a);right=cap(q.a)+".";
      app.querySelectorAll(".w").forEach(b=>b.disabled=true);const r=$("#reset");if(r)r.disabled=true;}
    S.res.push({orig:q.orig,ok,user,right,q});
    S.locked=true;
    $("#fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"정답입니다!":"아쉬워요. 다시 확인해 봅시다."}</strong>${ok&&q.t==="mc"?"":`<div>정답: <span class="ans">${fmt(String(right).replace(/<br>/g," "))}</span></div>`}<div>${fmt(q.e)}</div></div>`;
    go.textContent=S.i+1<S.list.length?"다음 문제":"결과 보기";
    $("#fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
  };
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function next(){S.i++; if(S.i<S.list.length)showQ(); else result();}

function result(){
  setBar(1); window.scrollTo(0,0);
  const d=S.day, sc=S.res.filter(r=>r.ok).length, n=S.res.length;
  if(!S.retry){const prev=store.best[d.d]; if(prev==null||sc>prev){store.best[d.d]=sc;save();}}
  const wrong=S.res.filter(r=>!r.ok).map(r=>r.orig);
  const now=new Date(), ts=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const msg=sc===n?"완벽해요! 내신 실전에서도 이 정확도를 유지하세요.":sc>=8?"아주 좋아요. 틀린 문제의 해설을 꼭 다시 읽어 보세요.":sc>=6?"기본은 잡혔어요. 오답 재도전으로 약점을 채워 봅시다.":"오늘 개념을 워크시트로 다시 정리한 뒤 재도전해 봅시다.";
  app.innerHTML=`<div class="card score">
     <span class="eyebrow">DAY ${d.d} · ${esc(d.title)}${S.retry?" · 오답 재도전":""}</span>
     <div class="big">${sc}<span style="font-size:28px">/${n}</span></div>
     <div class="meta">${esc(store.name||"이름 미입력")} · ${ts}</div>
     <p style="margin:6px 0 0">${msg}</p>
     <p class="note" style="margin:0" id="sv">${saveOn()?"결과를 선생님께 저장하는 중…":"이 화면을 캡처해서 선생님께 보내 주세요."}</p></div>
   <div class="actions">${wrong.length?`<button class="btn accent" id="rt">오답만 다시 풀기 (${wrong.length})</button>`:""}<button class="btn" id="ws">연계 워크시트</button></div>
   <div class="actions" style="margin-top:8px"><button class="btn ghost" id="again">처음부터 다시</button><button class="btn ghost" id="hm">DAY 목록</button></div>
   <div class="sec"><h2>문항별 확인</h2><div class="review">${S.res.map((r,i)=>`<div class="ri ${r.ok?"ok":"no"}"><span class="mk">${r.ok?"O":"X"}</span><div><div class="q">${i+1}. ${fmt(r.q.q.split("<br>")[0])}</div>${r.ok?"":`<div>내 답: ${esc(String(r.user).replace(/<br>/g," "))}</div><div style="color:var(--ok);font-weight:700">정답: ${fmt(String(r.right).replace(/<br>/g," "))}</div>`}</div></div>`).join("")}</div></div>`;
  if(wrong.length)$("#rt").onclick=()=>start(d.d,wrong);
  if(saveOn()) send(buildPayload(d,sc,n,now));
  $("#ws").onclick=()=>worksheet(d.d);
  $("#again").onclick=()=>start(d.d);
  $("#hm").onclick=home;
}

const strip=s=>String(s).replace(/<br>/g," ").replace(/<[^>]+>/g,"").replace(/\[\[|\]\]/g,"").replace(/\s+/g," ").trim();
function buildPayload(d,sc,n,now){
  const wr=S.res.map((r,i)=>({r,i})).filter(x=>!x.r.ok);
  const p=v=>String(v).padStart(2,"0");
  const ts=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}:00+09:00`;
  return {type:"minitest",name:store.name,unit:UNIT,day:d.d,title:d.title,cat:d.cat,
    attempt:S.retry?"오답 재도전":"첫 응시",score:sc,total:n,
    wrongNums:wr.length?wr.map(x=>(x.r.orig+1)+"번").join(", "):"없음",
    wrongDetail:wr.map(x=>`${x.r.orig+1}번(${TYPE[x.r.q.t]}) 내 답: ${strip(x.r.user)||"-"} → 정답: ${strip(x.r.right)}`).join("\n").slice(0,1900),
    minutes:Math.max(1,Math.round((Date.now()-S.t0)/60000)),timestamp:ts};
}
async function send(payload){
  const el=$("#sv");
  const show=(t,c)=>{const x=$("#sv"); if(x){x.innerHTML=t; x.style.color=c||"";}};
  try{await post(payload); show("✓ 선생님 노션에 결과가 저장되었습니다.","var(--ok)"); flushQ();}
  catch(e){const q=getQ(); q.push(payload); setQ(q);
    show(`저장에 실패했어요(인터넷 확인). <button id="resend" class="w" style="font-size:13px;padding:2px 10px">다시 저장</button><br>다음에 앱을 열면 자동으로 다시 보내요.`,"var(--bad)");
    const b=$("#resend"); if(b) b.onclick=async()=>{show("다시 저장하는 중…"); try{await flushQ(); if(getQ().length) throw 0; show("✓ 선생님 노션에 결과가 저장되었습니다.","var(--ok)");}catch(_){show("아직 저장되지 않았어요. 잠시 후 다시 시도하세요.","var(--bad)")}};}
}
function worksheet(dn){
  const d=DAYS[dn-1]; setBar(0); window.scrollTo(0,0); $("#homeBtn").hidden=false;
  app.innerHTML=`<div class="hero"><span class="eyebrow">DAY ${d.d} 연계 워크시트 · ${d.cat}</span><h1 style="font-size:26px">${esc(d.title)}</h1>
  <p>개념을 다시 정리하고, 노트에 직접 써 본 뒤 정답을 확인하세요.</p></div>
  <div class="sec" style="margin-top:0"><h2>핵심 개념</h2><div class="point"><ul>${d.point.map(p=>`<li>${p}</li>`).join("")}</ul></div></div>
  <div class="sec"><h2>연습 문제</h2>${d.ws.map((w,i)=>`<div class="wsi"><div><b>${i+1}.</b> ${fmt(w.q)}</div><div class="lines"></div><button data-i="${i}">정답 보기</button><div class="a" hidden id="wa${i}">${fmt(esc(w.a))}</div></div>`).join("")}</div>
  <div class="actions"><button class="btn" id="tq">DAY ${d.d} 테스트 풀기</button><button class="btn ghost" id="hm">DAY 목록</button></div>`;
  app.querySelectorAll(".wsi button").forEach(b=>b.onclick=()=>{const a=$("#wa"+b.dataset.i);a.hidden=!a.hidden;b.textContent=a.hidden?"정답 보기":"정답 숨기기"});
  $("#tq").onclick=()=>start(d.d); $("#hm").onclick=home;
}
home();
flushQ();
})();
</script>

</body>
</html>
