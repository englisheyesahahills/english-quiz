<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8과 대화문·본문 암기 → 바로 테스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--gold:#c98a12;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--soft:#eef0f6;--ok:#1f8a4c;--okbg:#e3f6ea;--no:#c0392b;--nobg:#fbe7e5;--mid:#b7791f;--midbg:#fdf3e1}
@media (prefers-color-scheme:dark){:root{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--bur:#e0708c;--okbg:#14301f;--ok:#5fd18f;--nobg:#3a1714;--no:#ff8a7a;--midbg:#3a2e14;--mid:#f0b54d;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input{font:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
header .w{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center}
.brand{font-family:"Do Hyeon",sans-serif;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:14px 14px 90px}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:27px;margin:2px 0 4px;line-height:1.2}
h2{font-size:16px;margin:18px 0 8px;color:var(--bur)}
.eye{font-size:12px;font-weight:700;color:var(--bur);letter-spacing:.5px}
.muted{color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer;width:100%;font-size:16px}
.btn.bur{background:var(--bur)}.btn.gh{background:var(--soft);color:var(--ink)}.btn:disabled{opacity:.45}
input[type=text]{width:100%;color:var(--ink);background:var(--card);border:1.5px solid #c9cedb;border-radius:12px;padding:11px 13px}
.err{color:var(--no);font-size:14px;margin-top:8px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bk{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;cursor:pointer;text-align:left}
.bk b{display:block;font-size:16px}.bk span{font-size:12.5px;color:var(--muted)}
.bk.on{border-color:var(--bur);background:var(--nobg)}
@media (prefers-color-scheme:dark){.bk.on{background:#3a1a26}}
.pt{display:flex;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;margin:7px 0;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.pt:hover{border-color:var(--bur)}
.pt .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:"Do Hyeon",sans-serif;font-size:17px;background:var(--soft);flex:none}
.pt .tt{flex:1;min-width:0}.pt .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pt .tt span{font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.g{background:var(--okbg);color:var(--ok)}.y{background:var(--midbg);color:var(--mid)}.r{background:var(--nobg);color:var(--no)}.n{background:var(--soft);color:var(--muted)}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 2px}.prog i{display:block;height:100%;background:var(--bur);transition:width .3s}
.steps{display:flex;gap:4px;margin:8px 0}.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:5px 2px;border-radius:8px;background:var(--soft);color:var(--muted)}
.steps span.on{background:var(--navy);color:#fff}.steps span.dn{background:var(--okbg);color:var(--ok)}
.ko{font-size:19px;font-weight:700;line-height:1.45}
.sp{display:inline-block;font-size:12px;font-weight:700;background:var(--bur);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.en{font-size:19px;line-height:1.5;margin-top:8px;color:var(--navy);font-weight:500}
@media (prefers-color-scheme:dark){.en{color:#9fb4ff}}
.ans{min-height:64px;border:2px dashed #c9cedb;border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin:12px 0}
.pool{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:6px 0 12px}
.tl{border:1.5px solid #b9c0d2;background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:17px;cursor:pointer;font-weight:500;box-shadow:0 2px 0 #d5d9e3}
.tl.ch{background:#eef3ff;border-color:#9fb1e6}
@media (prefers-color-scheme:dark){.tl{box-shadow:none}.tl.ch{background:#24305a}}
.ans .tl{background:var(--soft);box-shadow:none}
.shake{animation:sh .35s}@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fb{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.no{background:var(--nobg);color:var(--no)}
.fb .c{color:var(--ink);display:block;margin-top:3px;font-weight:500}
.row{display:flex;gap:8px}.row>*{flex:1}
.ic-b{border:0;background:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);font-size:15px}
.big{font-family:"Do Hyeon",sans-serif;font-size:56px;text-align:center;color:var(--bur);line-height:1.1}
.bars div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px}.bars b{width:150px;flex:none;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .bb{flex:1;height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.bars .bb i{display:block;height:100%}
.pdf{display:block;text-align:center;border:1.5px dashed var(--bur);color:var(--bur);border-radius:12px;padding:10px;font-weight:700;text-decoration:none;margin:8px 0}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
</style>
</head>
<body>
<header><div class="w"><div class="brand" id="br">🧠 8과 암기 → 바로 테스트</div><button class="hb" id="hm" style="display:none">홈</button><button class="hb" id="lo" style="display:none">로그아웃</button></div></header>
<main id="app"></main>
<script>
const DATA=[{"id":"m1yun","label":"중1 동아(윤정미)","l8":"Be Smart Online","parts":[{"id":"D1","type":"대화문","title":"Watch and Check 1 · Movie","s":[{"sp":"G","en":"This movie looks really fun. What do you think?","ch":["This movie","looks really fun.","What do you think?"],"ko":"이 영화 정말 재미있어 보여. 너는 어떻게 생각해?"},{"sp":"B","en":"I don't agree. I think it looks a little boring.","ch":["I don't agree.","I think","it looks a little boring."],"ko":"나는 동의하지 않아. 내 생각엔 조금 지루해 보여."},{"sp":"G","en":"But look at these actors. They are all famous.","ch":["But","look at these actors.","They are all famous."],"ko":"하지만 이 배우들을 봐. 그들은 모두 유명해."},{"sp":"B","en":"All right. Let's watch it.","ch":["All right.","Let's watch it."],"ko":"알겠어. 그거 보자."}]},{"id":"D2","type":"대화문","title":"Watch and Check 2 · Pasta","s":[{"sp":"B","en":"What do you think about this pasta?","ch":["What do you think about","this pasta?"],"ko":"너는 이 파스타에 대해 어떻게 생각하니?"},{"sp":"G","en":"I think it's pretty good.","ch":["I think","it's pretty good."],"ko":"나는 꽤 맛있다고 생각해."},{"sp":"B","en":"I don't think so. I think it's too salty.","ch":["I don't think so.","I think","it's too salty."],"ko":"나는 그렇게 생각하지 않아. 너무 짜다고 생각해."},{"sp":"G","en":"Really? It's OK for me.","ch":["Really?","It's OK for me."],"ko":"정말? 나는 괜찮은데."}]},{"id":"D3","type":"대화문","title":"Watch and Check 3 · New Phone","s":[{"sp":"G","en":"My phone is not working. I need to get a new one.","ch":["My phone","is not working.","I need to get a new one."],"ko":"내 휴대폰이 작동하지 않아. 나는 새것을 사야 해."},{"sp":"B","en":"Look! Here are the new models. What do you think about this one?","ch":["Look!","Here are the new models.","What do you think","about this one?"],"ko":"봐! 여기 새 모델들이 있어. 이 모델에 대해 어떻게 생각해?"},{"sp":"G","en":"Wow, I like it. It's very light.","ch":["Wow,","I like it.","It's very light."],"ko":"와, 마음에 들어. 아주 가벼워."},{"sp":"B","en":"I agree. It's lighter than mine.","ch":["I agree.","It's lighter than mine."],"ko":"동의해. 그건 내 것보다 더 가벼워."}]},{"id":"D4","type":"대화문","title":"Watch and Check 4 · Cleaning Robot","s":[{"sp":"G","en":"What do you think about cleaning robots? There's one over there.","ch":["What do you think","about cleaning robots?","There's one over there."],"ko":"너는 청소 로봇에 대해 어떻게 생각해? 저기 하나 있어."},{"sp":"B","en":"I think they are very helpful. I really need one at home.","ch":["I think","they are very helpful.","I really need one","at home."],"ko":"나는 그것들이 아주 도움이 된다고 생각해. 나는 집에 하나 정말 필요해."},{"sp":"G","en":"Me, too. I don't like to clean my room.","ch":["Me, too.","I don't like","to clean my room."],"ko":"나도 그래. 나는 내 방 청소하는 걸 좋아하지 않아."},{"sp":"B","en":"Who does? Cleaning robots are perfect for people like us.","ch":["Who does?","Cleaning robots","are perfect for","people like us."],"ko":"누가 좋아하겠어? 청소 로봇은 우리 같은 사람들에게 딱이야."}]},{"id":"D5","type":"대화문","title":"Watch, Answer, and Talk · E-book","s":[{"sp":"B","en":"What do you think about this book, Yuna?","ch":["What do you think","about this book,","Yuna?"],"ko":"유나야, 너는 이 책에 대해 어떻게 생각해?"},{"sp":"G","en":"<i>A History of Black Holes< i>? I think it'll be difficult.","ch":["<i>A History of Black Holes<","i>?","I think","it'll be difficult."],"ko":"'블랙홀의 역사'? 나는 어려울 것 같아."},{"sp":"B","en":"I don't agree. I think it'll be very interesting.","ch":["I don't agree.","I think","it'll be very interesting."],"ko":"나는 동의하지 않아. 나는 매우 흥미로울 것 같아."},{"sp":"G","en":"Hmm ... I didn't know you were interested in black holes. So, are you going to buy the book, Alex?","ch":["Hmm ...","I didn't know","you were interested in black holes.","So,","are you going to buy the book,","Alex?"],"ko":"음… 네가 블랙홀에 관심 있는 줄 몰랐어. 그래서 그 책을 살 거니, Alex?"},{"sp":"B","en":"I'd love to, but it's too thick and heavy.","ch":["I'd love to,","but it's too thick","and heavy."],"ko":"정말 사고 싶지만, 너무 두껍고 무거워."},{"sp":"G","en":"Why don't you buy the e-book then? You can read it on your phone.","ch":["Why don't you buy","the e-book then?","You can read it","on your phone."],"ko":"그럼 전자책을 사는 게 어때? 휴대폰으로 읽을 수 있어."},{"sp":"B","en":"That's a good idea!","ch":["That's a good idea!"],"ko":"좋은 생각이야!"},{"sp":"G","en":"And it's also cheaper than the paper book.","ch":["And","it's also cheaper than","the paper book."],"ko":"그리고 그것은 종이책보다 더 싸기도 해."},{"sp":"B","en":"Really? Then, I'll buy the e-book.","ch":["Really?","Then,","I'll buy the e-book."],"ko":"정말? 그럼 전자책을 살게."}]},{"id":"R1","type":"본문","title":"① 더 많은 '좋아요'를 원한 Goldilocks","s":[{"en":"There was a little girl with golden hair in a small town.","ch":["There was a little girl","with golden hair","in a small town."],"ko":"작은 마을에 금발 머리의 어린 소녀가 있었다."},{"en":"Her name was Goldilocks.","ch":["Her name was Goldilocks."],"ko":"그녀의 이름은 Goldilocks였다."},{"en":"She liked to share photos on social media.","ch":["She liked to share photos","on social media."],"ko":"그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다."},{"en":"At first, she posted everyday things, but people didn't give her many likes.","ch":["At first,","she posted everyday things,","but people didn't give her","many likes."],"ko":"처음에 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 '좋아요'를 많이 주지 않았다."},{"en":"\"What should I do to get more likes?\" she thought.","ch":["\"What should I do","to get more likes?\"","she thought."],"ko":"\"더 많은 '좋아요'를 받으려면 어떻게 해야 하지?\" 그녀는 생각했다."},{"en":"\"I know! I should post funny pictures.\"","ch":["\"I know!","I should post","funny pictures.\""],"ko":"\"알았다! 웃긴 사진을 올려야겠어.\""},{"en":"Now, her posts were getting a lot of likes, and Goldilocks was happy.","ch":["Now,","her posts were getting","a lot of likes,","and Goldilocks was happy."],"ko":"이제 그녀의 게시물은 '좋아요'를 많이 받고 있었고, Goldilocks는 행복했다."},{"en":"Her followers, however, soon got bored.","ch":["Her followers,","however,","soon got bored."],"ko":"하지만 그녀의 팔로워들은 곧 지루해졌다."},{"en":"So, she decided to post more shocking pictures.","ch":["So,","she decided to post","more shocking pictures."],"ko":"그래서 그녀는 더 충격적인 사진을 올리기로 결심했다."}]},{"id":"R2","type":"본문","title":"② 숲속 오두막","s":[{"en":"One day, she was taking a walk in the forest and found a cottage.","ch":["One day,","she was taking a walk","in the forest","and found a cottage."],"ko":"어느 날, 그녀는 숲에서 산책을 하다가 오두막을 발견했다."},{"en":"She knocked on the door, but there was no answer.","ch":["She knocked on the door,","but there was no answer."],"ko":"그녀는 문을 두드렸지만, 대답이 없었다."},{"en":"It was getting dark, and it started to rain.","ch":["It was getting dark,","and it started to rain."],"ko":"날이 어두워지고 있었고, 비가 내리기 시작했다."},{"en":"She opened the door and walked inside.","ch":["She opened the door","and walked inside."],"ko":"그녀는 문을 열고 안으로 걸어 들어갔다."},{"en":"There were three bowls of soup on a table.","ch":["There were three bowls of soup","on a table."],"ko":"식탁 위에 수프 세 그릇이 있었다."},{"en":"She ate the smallest one and took selfies with a smile.","ch":["She ate the smallest one","and took selfies","with a smile."],"ko":"그녀는 가장 작은 것을 먹고 미소를 지으며 셀카를 찍었다."},{"en":"There were also three chairs.","ch":["There were also three chairs."],"ko":"의자도 세 개 있었다."},{"en":"She jumped on the smallest one again and again.","ch":["She jumped on the smallest one","again and again."],"ko":"그녀는 가장 작은 의자 위에서 계속 뛰었다."},{"en":"It broke, but she didn't care.","ch":["It broke,","but she didn't care."],"ko":"그것은 부서졌지만, 그녀는 신경 쓰지 않았다."},{"en":"\"It's so fun!\" shouted Goldilocks.","ch":["\"It's so fun!\"","shouted Goldilocks."],"ko":"\"정말 재미있어!\" Goldilocks가 외쳤다."}]},{"id":"R3","type":"본문","title":"③ 곰 가족의 귀가","s":[{"en":"She took selfies again and posted all the selfies on social media.","ch":["She took selfies again","and posted all the selfies","on social media."],"ko":"그녀는 다시 셀카를 찍었고 모든 셀카를 소셜 미디어에 올렸다."},{"en":"Then, she went upstairs and found three beds.","ch":["Then,","she went upstairs","and found three beds."],"ko":"그러고 나서 그녀는 위층으로 가서 침대 세 개를 발견했다."},{"en":"She felt tired and fell asleep in the smallest bed.","ch":["She felt tired","and fell asleep","in the smallest bed."],"ko":"그녀는 피곤해서 가장 작은 침대에서 잠이 들었다."},{"en":"About an hour later, three bears came home.","ch":["About an hour later,","three bears came home."],"ko":"약 한 시간 후, 곰 세 마리가 집에 왔다."},{"en":"\"Someone ate my soup and broke my chair!\" cried Baby Bear.","ch":["\"Someone ate my soup","and broke my chair!\"","cried Baby Bear."],"ko":"\"누가 내 수프를 먹고 내 의자를 부쉈어요!\" 아기 곰이 소리쳤다."},{"en":"They went upstairs and saw Goldilocks.","ch":["They went upstairs","and saw Goldilocks."],"ko":"그들은 위층으로 가서 Goldilocks를 보았다."},{"en":"Mother Bear found a phone next to Goldilocks.","ch":["Mother Bear found a phone","next to Goldilocks."],"ko":"엄마 곰이 Goldilocks 옆에서 휴대폰을 발견했다."},{"en":"\"This is terrible! Look at all these posts of our home,\" shouted Mother Bear angrily.","ch":["\"This is terrible!","Look at all these posts","of our home,\"","shouted Mother Bear angrily."],"ko":"\"끔찍해! 우리 집에 관한 이 게시물들을 좀 봐.\" 엄마 곰이 화가 나서 소리쳤다."},{"en":"Goldilocks jumped up in surprise.","ch":["Goldilocks jumped up","in surprise."],"ko":"Goldilocks는 깜짝 놀라 벌떡 일어났다."}]},{"id":"R4","type":"본문","title":"④ 사과와 약속","s":[{"en":"\"You broke into our house and posted these pictures without our permission.","ch":["\"You broke into our house","and posted these pictures","without our permission."],"ko":"\"너는 우리 집에 침입해서 우리 허락 없이 이 사진들을 올렸어."},{"en":"Don't you know these things are wrong?\" said Father Bear.","ch":["Don't you know","these things are wrong?\"","said Father Bear."],"ko":"이런 일들이 잘못이라는 걸 모르니?\" 아빠 곰이 말했다."},{"en":"\"Please forgive me.","ch":["\"Please forgive me."],"ko":"\"용서해 주세요."},{"en":"I'm so sorry, and I'll clean your house every day until the end of the summer,\" said Goldilocks.","ch":["I'm so sorry,","and I'll clean your house","every day","until the end of the summer,\"","said Goldilocks."],"ko":"정말 죄송해요, 그리고 여름이 끝날 때까지 매일 여러분의 집을 청소할게요.\" Goldilocks가 말했다."}]},{"id":"R5","type":"본문","title":"⑤ 영원히 남는 게시물","s":[{"en":"All summer long, Goldilocks worked hard.","ch":["All summer long,","Goldilocks worked hard."],"ko":"여름 내내, Goldilocks는 열심히 일했다."},{"en":"On the last day, Goldilocks said to Father Bear, \"I deleted all my posts of your co here's only a little mud on my shoes.”","ch":["“There's only a little","mud on my shoes.”"],"ko":"\"제 신발에 진흙이 조금 묻었을 뿐이에요.\""},{"en":"Travis stared at Eckels for a long time without saying anything.","ch":["Travis stared at Eckels","for a long time","without saying anything."],"ko":"Travis는 아무 말 없이 오랫동안 Eckels를 응시했다."},{"en":"“Let's go home,” said Travis finally.","ch":["“Let's go home,”","said Travis finally."],"ko":"\"집으로 돌아갑시다.\" 마침내 Travis가 말했다."},{"en":"The machine stopped. They all returned to the present safely.","ch":["The machine stopped.","They all returned to","the present safely."],"ko":"기계가 멈췄다. 그들은 모두 무사히 현재로 돌아왔다."},{"en":"“Is everything okay here?” asked Travis.","ch":["“Is everything okay here?”","asked Travis."],"ko":"\"여기는 모든 게 괜찮나요?\" Travis가 물었다."},{"en":"“Fine. Welcome home!” said Mr. Parker.","ch":["“Fine. Welcome home!”","said Mr. Parker."],"ko":"\"괜찮아요. 돌아온 걸 환영해요!\" Parker 씨가 말했다."}]},{"id":"R6","type":"본문","title":"⑥ 작은 나비 한 마리","s":[{"en":"Eckels looked around the room carefully.","ch":["Eckels looked around","the room carefully."],"ko":"Eckels는 방을 주의 깊게 둘러보았다."},{"en":"Everything looked the same, except the big sign on the wall.","ch":["Everything looked the same,","except the big sign","on the wall."],"ko":"벽에 걸린 큰 간판을 제외하고 모든 것이 똑같아 보였다."},{"en":"The sign now said, “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.”","ch":["The sign now said,","“NAIM ANY YEER","EN THE PAST.","WEE TAEK YU THAIR.”"],"ko":"간판에는 이제 \"NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.\"라고 쓰여 있었다."},{"en":"Eckels was confused.","ch":["Eckels was confused."],"ko":"Eckels는 혼란스러웠다."},{"en":"Then, he saw the TV.","ch":["Then, he saw the TV."],"ko":"그때, 그는 TV를 보았다."},{"en":"The new president was on the news, but it was not Mr. Keith.","ch":["The new president was","on the news,","but it was","not Mr. Keith."],"ko":"새 대통령이 뉴스에 나오고 있었는데, 그는 Keith 씨가 아니었다."},{"en":"“What's going on?” He got more confused.","ch":["“What's going on?”","He got more confused."],"ko":"\"무슨 일이지?\" atch and Write · Strawberry Picking","s":[{"sp":"G","en":"These strawberries are really delicious. Have you ever picked fresh strawberries, Giho?","ch":["These strawberries are really delicious.","Have you ever","picked fresh strawberries,","Giho?"],"ko":"이 딸기들 정말 맛있다. 기호야, 신선한 딸기를 따 본 적 있어?"},{"sp":"B","en":"Yes, I have. I picked these strawberries myself.","ch":["Yes, I have.","I picked these strawberries myself."],"ko":"응, 따 봤어. 이 딸기들은 내가 직접 땄어."},{"sp":"G","en":"Really? Where did you pick them?","ch":["Really? Where did","you pick them?"],"ko":"정말? 어디서 땄어?"},{"sp":"B","en":"I participated in a strawberry picking event at a farm last week.","ch":["I participated in a","strawberry picking event at","a farm last week."],"ko":"지난주에 한 농장의 딸기 따기 행사에 참가했어."},{"sp":"G","en":"That sounds really interesting. Can you tell me more about the event?","ch":["That sounds really interesting.","Can you tell me","more about the event?"],"ko":"정말 흥미롭다. 그 행사에 대해 더 말해 줄래?"},{"sp":"B","en":"Of course. You can eat all the strawberries you pick at the farm.","ch":["Of course.","You can eat all","the strawberries you pick","at the farm."],"ko":"물론이지. 농장에서 딴 딸기는 모두 먹을 수 있어."},{"sp":"G","en":"How many strawberries did you eat?","ch":["How many strawberries","did you eat?"],"ko":"딸기를 몇 개나 먹었어?"},{"sp":"B","en":"I don't know exactly, but I was so full.","ch":["I don't know exactly,","but I was so full."],"ko":"정확히는 모르겠지만, 정말 배불렀어."},{"sp":"G","en":"Sounds like you had a great time. Are you going to go there again?","ch":["Sounds like you had","a great time.","Are you going to","go there again?"],"ko":"즐거운 시간을 보낸 것 같네. 거기 또 갈 거야?"},{"sp":"B","en":"Yes. Next month. I'm looking forward to picking those fresh strawberries again.","ch":["Yes. Next month.","I'm looking forward","to picking those","fresh strawberries again."],"ko":"응. 다음 달에. 그 신선한 딸기들을 다시 따는 게 기대돼."}]},{"id":"D5","type":"대화문","title":"Watch a Video · Hanyangdoseong","s":[{"sp":"Lucy","en":"My friend Emily is visiting Seoul this wee m a big snowman.","ch":["I am a big snowman."],"ko":"저는 커다란 눈사람이에요."},{"en":"As you can see, I'm wearing a big red hat and a special belt.","ch":["As you can see,","I'm wearing a big","red hat and a","special belt."],"ko":"보시다시피, 저는 큰 빨간 모자를 쓰고 특별한 벨트를 매고 있어요."},{"en":"Do you want to take home an unforgettable memory from the carnival?","ch":["Do you want to","take home an unforgettable","memory from the carnival?"],"ko":"카니발에서 잊지 못할 추억을 가져가고 싶나요?"},{"en":"Follow me, and I'll show you what to do here.","ch":["Follow me,","and I'll show you","what to do here."],"ko":"저를 따라오세요, 여기서 무엇을 해야 할지 보여 드릴게요."},{"en":"Bonhomme means “good man” in French.","ch":["Bonhomme means “good man”","in French."],"ko":"Bonhomme은 프랑스어로 '좋은 사람'이라는 뜻이다."},{"en":"The Quebec Winter Carnival is usually held for 10 days between January and February in Quebec, Canada.","ch":["The Quebec Winter Carnival","is usually held for","10 days between January","and February in Quebec,","Canada."],"ko":"퀘벡 윈터 카니발은 보통 캐나다 퀘벡에서 1월과 2월 사이에 10일 동안 열린다."}]},{"id":"R2","type":"본문","title":"② Bonhomme의 얼음 궁전","s":[{"en":"This is my ice palace.","ch":["This is my ice palace."],"ko":"이것은 제 얼음 궁전이에요."},{"en":"Every year, a new ice palace is built for the carnival.","ch":["Every year,","a new ice","palace is built","for the carnival."],"ko":"매년 카니발을 위해 새 얼음 궁전이 지어져요."},{"en":"So, I have a new home each year!","ch":["So, I have a","new home each year!"],"ko":"그래서 저는 매년 새집이 생겨요!"},{"en":"Because the palace is made of ice and snow, it shines beautifully during the day.","ch":["Because the palace","is made of","ice and snow,","it shines beautifully","during the day."],"ko":"궁전은 얼음과 눈으로 만들어져서, 낮 동안 아름답게 빛나요."},{"en":"At night, it is even more beautiful with many lights.","ch":["At night,","it is even more","beautiful with many lights."],"ko":"밤에는 많은 조명 덕분에 훨씬 더 아름다워요."},{"en":"Take a look at my fantastic ice garden.","ch":["Take a look at","my fantastic ice garden."],"ko":"저의 환상적인 얼음 정원을 보세요."},{"en":"You can see amazing  const mode=k===1?"chunk":k===2?"word":"mix";
 drill(p.s.map((x,i)=>i),mode,()=>{markDone(k);setP({step:k+1});if(k<3)nextStep(k+1);else{setP({train:true});sendTrain();readyTest()}})}
function nextStep(k){app.innerHTML=`<span class="eye">${esc(cur.p.title)}</span>${stepsBar(k)}<div class="card" style="text-align:center"><div style="font-size:44px">👏</div><p><b>${k}단계 통과!</b><br><span class="muted">다음: ${STEPN[k]}</span></p><button class="btn" id="nx">${k+1}단계 시작</button><div style="height:8px"></div><button class="btn gh" id="nt">훈련은 여기까지 → 바로 테스트</button></div>`;$("#nx").onclick=()=>train(k);$("#nt").onclick=()=>{for(let j=k;j<4;j++)markSkip(j);setP({train:true});sendTrain();test(cur.p.s.map((x,i)=>({x,pid:cur.p.id,i})),"part")};window.scrollTo(0,0)}
function readyTest(){app.innerHTML=`<span class="eye">${esc(cur.p.title)}</span>${stepsBar(4)}<div class="card" style="text-align:center"><div style="font-size:44px">🔥</div><p><b>훈련 4단계 완료!</b><br><span class="muted">잊어버리기 전에 바로 테스트해요. 한 번에 맞혀야 점수가 돼요.</span></p><button class="btn bur" id="nx">바로 테스트</button></div>`;
 $("#nx").onclick=()=>test(cur.p.s.map((x,i)=>({x,pid:cur.p.id,i})),"part");window.scrollTo(0,0)}
/* 1단계: 보고 듣기 */
function look(i){const {p}=cur;const x=p.s[i];
 app.innerHTML=`<span class="eye">${esc(p.title)}</span>${stepsBar(0)}<div class="prog"><i style="width:${(i)/p.s.length*100}%"></i></div><div class="muted" style="display:flex;justify-content:space-between;gap:8px"><span>${i+1} / ${p.s.length} · 한글을 보고 영어를 소리 내어 따라 읽으세요</span><a href="#" id="skp" style="color:var(--bur);font-weight:700;white-space:nowrap">단계 건너뛰기 ⏭</a></div>
 <div class="card"><div class="ko">${x.sp?`<span class="sp">${esc(x.sp)}</span>`:""}${esc(x.ko)}</div><div class="en">${x.ch.map(esc).join(' <span style="color:var(--bur)">/</span> ')}</div>
 <div class="row" style="margin-top:12px"><button class="ic-b" id="s1">🔊 듣기</button><button class="ic-b" id="s2">🐢 천천히</button></div></div>
 <div class="bar"><div class="in">${i>0?`<button class="btn gh" id="pv" style="flex:.5">이전</button>`:""}<button class="btn" id="nx">${i<p.s.length-1?"다음 문장":"1단계 끝"}</button></div></div>`;
 $("#s1").onclick=()=>say(x.en);$("#s2").onclick=()=>say(x.en,.7);say(x.en);$("#skp").onclick=e=>{e.preventDefault();try{speechSynthesis.cancel()}catch(x){}markSkip(0);setP({step:1});nextStep(1)};
 if($("#pv"))$("#pv").onclick=()=>look(i-1);
 $("#nx").onclick=()=>{if(i<p.s.length-1)look(i+1);else{markDone(0);setP({step:1});nextStep(1)}};window.scrollTo(0,0)}
/* 2~4단계: 배열 드릴 (틀리면 뒤로 다시) */
function piecesOf(x,mode){if(mode==="chunk")return x.ch.length>=2?x.ch:tok(x.en);return tok(x.en)}
function nextBtn(fn){const r=document.querySelector(".card .row");if(r)r.style.display="none";const f=$("#fb");if(!f)return fn();
 f.insertAdjacentHTML("afterend",`<button class="btn" id="go2" style="margin-top:6px">다음 ▶</button>`);const g=$("#go2");g.focus();g.onclick=fn;
 g.insertAdjacentHTML("afterend",`<button class="ic-b" id="rp" style="width:100%;margin-top:6px">🔊 다시 듣기</button>`);const fb=f.querySelector(".c");$("#rp").onclick=()=>say(fb?fb.textContent:"")}
function drill(order,mode,done0){const {p}=cur;let Q=shuf(order),total=order.length,ok=new Set(),passed=0,skipped=false;const k0=mode==="chunk"?1:mode==="word"?2:3;const done=()=>{if(skipped){markSkip(k0);setP({step:k0+1});if(k0<3)nextStep(k0+1);else{setP({train:true});sendTrain();readyTest()}}else done0()};
 const show=()=>{if(!Q.length)return done();const i=Q[0],x=p.s[i];const target=piecesOf(x,mode);
  let extra=[];if(mode==="mix"){const mine=new Set(tok(x.en).map(w=>w.toLowerCase()));extra=shuf([...new Set(p.s.flatMap(y=>tok(y.en)))].filter(w=>!mine.has(w.toLowerCase()))).slice(0,3)}
  const pool=shuf([...target.map((t,k)=>({t,k})),...extra.map(t=>({t,k:-1}))]);let picked=[];
  app.innerHTML=`<span class="eye">${esc(p.title)}</span>${stepsBar(mode==="chunk"?1:mode==="word"?2:3)}<div class="prog"><i style="width:${ok.size/total*100}%"></i></div><div class="muted" style="display:flex;justify-content:space-between;gap:8px"><span>맞힌 문장 ${ok.size} / ${total}${mode==="mix"?" · 필요 없는 단어 3개 섞임":""}</span><a href="#" id="skp" style="color:var(--bur);font-weight:700;white-space:nowrap">단계 건너뛰기 ⏭</a></div>
  <div class="card"><div class="ko">${x.sp?`<span class="sp">${esc(x.sp)}</span>`:""}${esc(x.ko)}</div><div class="ans" id="an"></div><div class="pool" id="po"></div><div id="fb"></div>
  <div class="row"><button class="ic-b" id="un">↩ 빼기</button><button class="ic-b" id="hi">💡 힌트</button><button class="ic-b" id="ps">넘기기 ⏭</button></div></div>`;
  $("#skp").onclick=e=>{e.preventDefault();Q=[];skipped=true;done()};
  $("#ps").onclick=()=>{Q.shift();passed++;setP({passed:(pst(cur.b,cur.p).passed||0)+1});$("#fb").innerHTML=`<div class="fb" style="background:var(--soft)">⏭ 넘겼어요 <span class="c">${esc(x.en)}</span></div>`;say(x.en);$("#po").innerHTML="";nextBtn(show)};
  const paint=()=>{$("#an").innerHTML=picked.map((o,j)=>`<button class="tl ${mode==="chunk"?"ch":""}" data-j="${j}">${esc(o.t)}</button>`).join("");
   $("#po").innerHTML=pool.map((o,j)=>picked.includes(o)?"":`<button class="tl ${mode==="chunk"?"ch":""}" data-q="${j}">${esc(o.t)}</button>`).join("");
   $("#an").querySelectorAll("[data-j]").forEach(e=>e.onclick=()=>{picked.splice(+e.dataset.j,1);paint()});
   $("#po").querySelectorAll("[data-q]").forEach(e=>e.onclick=()=>{picked.push(pool[+e.dataset.q]);paint();check()})};
  const check=()=>{if(picked.length<target.length)return;const got=picked.map(o=>o.t).join(" "),want=target.join(" ");
   if(got===want){if(!ok.has(i)){ok.add(i)}Q.shift();$("#fb").innerHTML=`<div class="fb ok">⭕ 좋아요! <span class="c">${esc(x.en)}</span></div>`;say(x.en);$("#po").innerHTML="";nextBtn(show)}
   else{$("#an").classList.add("shake");setTimeout(()=>$("#an")&&$("#an").classList.remove("shake"),400);
    $("#fb").innerHTML=`<div class="fb no">❌ 순서가 달라요. 이 문장은 조금 뒤에 다시 나와요.<span class="c">${esc(x.en)}</span></div>`;say(x.en);
    Q.shift();Q.splice(Math.min(Q.length,2),0,i);$("#po").innerHTML="";nextBtn(show)}};
  $("#un").onclick=()=>{picked.pop();paint()};
  $("#hi").onclick=()=>{const n=Math.max(1,Math.ceil(target.length/3));$("#fb").innerHTML=`<div class="fb" style="background:var(--soft)">💡 ${esc(target.slice(0,n).join(" "))} …</div>`};
  paint();window.scrollTo(0,0)};
 show()}
/* ---------- 테스트 (한 번에 맞혀야 정답) ---------- */
function test(items,kind){const b=BK();let i=0,R=[];const t0=Date.now();$("#hm").style.display="";
 const show=()=>{if(i>=items.length)return result();const it=items[i],x=it.x;const p=b.parts.find(q=>q.id===it.pid);
  const target=tok(x.en);const mine=new Set(target.map(w=>w.toLowerCase()));
  const extra=shuf([...new Set(p.s.flatMap(y=>tok(y.en)))].filter(w=>!mine.has(w.toLowerCase()))).slice(0,target.length>8?4:3);
  const pool=shuf([...target.map(t=>({t})),...extra.map(t=>({t,x:1}))]);let picked=[];
  app.innerHTML=`<span class="eye">${kind==="final"?"8과 종합 테스트":esc(p.title)+" · 테스트"}</span>${kind==="part"?stepsBar(4):""}<div class="prog"><i style="width:${i/items.length*100}%"></i></div><div class="muted">${i+1} / ${items.length}${kind==="final"?` · ${p.type} ${esc(p.title)}`:""} · 한 번에 맞혀야 정답</div>
  <div class="card"><div class="ko">${x.sp?`<span class="sp">${esc(x.sp)}</span>`:""}${esc(x.ko)}</div><div class="ans" id="an"></div><div class="pool" id="po"></div><div id="fb"></div>
  <div class="row"><button class="ic-b" id="un">↩ 하나 빼기</button><button class="btn" id="sb" style="padding:9px">제출</button></div></div>`;
  const paint=()=>{$("#an").innerHTML=picked.map((o,j)=>`<button class="tl" data-j="${j}">${esc(o.t)}</button>`).join("");
   $("#po").innerHTML=pool.map((o,j)=>picked.includes(o)?"":`<button class="tl" data-q="${j}">${esc(o.t)}</button>`).join("");
   $("#an").querySelectorAll("[data-j]").forEach(e=>e.onclick=()=>{picked.splice(+e.dataset.j,1);paint()});
   $("#po").querySelectorAll("[data-q]").forEach(e=>e.onclick=()=>{picked.push(pool[+e.dataset.q]);paint()});
   $("#sb").disabled=!picked.length};
  $("#un").onclick=()=>{picked.pop();paint()};
  $("#sb").onclick=()=>{const okk=picked.map(o=>o.t).join(" ")===target.join(" ");R.push({pid:it.pid,i:it.i,ok:okk});
   $("#po").innerHTML="";$("#un").remove();$("#sb").remove();
   $("#fb").innerHTML=okk?`<div class="fb ok">⭕ 정답!</div>`:`<div class="fb no">❌ 정답: <span class="c">${esc(x.en)}</span></div>`;say(x.en);
   $("#fb").insertAdjacentHTML("afterend",`<button class="btn" id="nx" style="margin-top:6px">${i<items.length-1?"다음":"결과 보기"}</button>`);$("#nx").onclick=()=>{i++;show()}};
  paint();window.scrollTo(0,0)};
 const result=()=>{const sc=R.filter(r=>r.ok).length,tn=R.length;
  const byP={};R.forEach(r=>{const o=byP[r.pid]=byP[r.pid]||{ok:0,n:0,w:[]};o.n++;if(r.ok)o.ok++;else o.w.push(r.i+1)});
  if(kind==="part"){setP({test:sc,tn,at:Date.now()})}else{ST.final=ST.final||{};ST.final[b.id]={sc,tn,at:Date.now()};
   Object.entries(byP).forEach(([pid,o])=>{const k=b.id+":"+pid;ST.p=ST.p||{};ST.p[k]=Object.assign(ST.p[k]||{},{fin:o.ok+"/"+o.n})})}
  save();
  const pname=pid=>{const p=b.parts.find(q=>q.id===pid);return `${pid} ${p.title}`};
  const body={name:U.name,unit:`${b.label} L8`,day:8,title:kind==="final"?"8과 종합 테스트 (대화문·본문)":`${cur.p.type} ${cur.p.id} · ${cur.p.title}`,cat:CAT,attempt:kind==="final"?"종합":"파트",score:sc,total:tn,
   wrongNums:Object.entries(byP).filter(([k,o])=>o.w.length).map(([k,o])=>`${k}-${o.w.join("·")}`).join(", ")||"없음",
   wrongDetail:(`[PARTS] `+Object.entries(byP).map(([k,o])=>`${k}=${o.ok}/${o.n}`).join("|")+` [BOOK:${b.id}] | `+R.filter(r=>!r.ok).map(r=>{const p=b.parts.find(q=>q.id===r.pid);return `${r.pid}-${r.i+1}: ${p.s[r.i].en}`}).join(" / ")).slice(0,1900),
   minutes:Math.max(1,Math.round((Date.now()-t0)/60000)),timestamp:new Date().toISOString()};
  try{fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),mode:"no-cors"}).catch(()=>{})}catch(e){}
  const pc=sc/tn;
  app.innerHTML=`<span class="eye">${kind==="final"?"8과 종합 테스트":esc(cur.p.title)} · 결과</span><div class="card"><div class="big">${sc} / ${tn}</div><p class="muted" style="text-align:center;margin:4px 0 10px">${pc>=.9?"🎉 완벽에 가까워요!":pc>=.7?"👍 거의 다 왔어요. 틀린 문장만 다시 훈련해요.":"💪 훈련 단계를 한 번 더 하고 다시 테스트해요."} · 결과가 선생님께 전송됐어요</p>
  ${kind==="final"?`<h2>파트별 점수</h2><div class="bars">${b.parts.filter(p=>byP[p.id]).map(p=>{const o=byP[p.id],q=o.ok/o.n;return `<div><b>${p.id} ${esc(p.title)}</b><span class="bb"><i style="width:${q*100}%;background:var(--${q>=.9?"ok":q>=.6?"mid":"no"})"></i></span><span>${o.ok}/${o.n}</span></div>`}).join("")}</div>`:""}
  ${R.some(r=>!r.ok)?`<h2>다시 볼 문장</h2>${R.filter(r=>!r.ok).map(r=>{const x=b.parts.find(q=>q.id===r.pid).s[r.i];return `<div style="margin:8px 0;font-size:14.5px"><span class="muted">${r.pid}</span> ${esc(x.ko)}<br><b>${esc(x.en)}</b></div>`}).join("")}`:""}</div>
  <div class="row">${kind==="part"?`<button class="btn gh" id="again">다시 훈련</button>`:""}<button class="btn" id="hm2">홈으로</button></div>`;
  $("#hm2").onclick=home;if($("#again"))$("#again").onclick=()=>{setP({step:0,train:false,sentTrain:false,done:[],skip:[],t0:Date.now()});train(1)};window.scrollTo(0,0)};
 show()}
function finalTest(){const b=BK();cur={b,p:null};const items=b.parts.flatMap(p=>shuf(p.s.map((x,i)=>({x,pid:p.id,i}))).slice(0,3));test(items,"final")}
if(U){ST=LS.get(SK())||{};home()}else loginView();
</script>
</body>
