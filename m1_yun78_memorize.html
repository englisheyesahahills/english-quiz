<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L7·L8 암기 트레이닝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--navy:#1d2b4f;--burgundy:#8a2240;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--soft:#eef0f6;--ok:#1d7a4a;--ok-bg:#e5f4ec;--bad:#b3263a;--bad-bg:#fbe9ec;--hdr:#1d2b4f;--chip:#fff;--chip-line:#c9cedb;
--display:"Do Hyeon","Noto Sans KR",sans-serif;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--burgundy:#e0708c;--ok:#5fcf8f;--ok-bg:#163527;--bad:#ff8094;--bad-bg:#3a1a22;--hdr:#0d1426;--chip:#232a3d;--chip-line:#3a4258;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--burgundy:#e0708c;--ok:#5fcf8f;--ok-bg:#163527;--bad:#ff8094;--bad-bg:#3a1a22;--hdr:#0d1426;--chip:#232a3d;--chip-line:#3a4258;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-size:12px;opacity:.75;margin-left:6px}
.hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
main{padding:18px 0 60px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 6px;line-height:1.2}
h2{font-size:17px;margin:20px 0 8px}
.eye{color:var(--burgundy);font-weight:700;font-size:13px;letter-spacing:.5px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.nm{display:flex;gap:8px;align-items:center}.nm input{flex:1}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--chip-line);border-radius:10px;padding:9px 11px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.it{display:grid;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.it b{font-size:15px}.it .st{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 4px}
.steps button{flex:0 0 auto;font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--chip-line);background:var(--chip);color:var(--ink);cursor:pointer}
.steps button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.steps button.done::after{content:" ✓";color:var(--ok)}
.steps button.on.done::after{color:#9fe0bb}
.ln{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.sp{flex:0 0 auto;min-width:22px;font-weight:700;color:var(--burgundy)}
.tx{flex:1;min-width:0}
.ko{color:var(--muted);font-size:14px}
.sl{color:var(--burgundy);font-weight:700;margin:0 2px}
.say{flex:0 0 auto;border:1px solid var(--chip-line);background:var(--chip);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:15px;color:var(--ink)}
.bin{display:inline-block;width:auto;min-width:70px;padding:2px 6px;border-radius:6px;font-size:15px;margin:2px 0}
.bin.ok{border-color:var(--ok);background:var(--ok-bg)}.bin.no{border-color:var(--bad);background:var(--bad-bg)}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.3px;color:var(--muted);word-break:break-word}
.res{font-size:14px;margin-top:4px}.res .w{color:var(--bad);text-decoration:line-through}.res .m{color:var(--bad);font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.btn{font:inherit;font-weight:700;font-size:16px;padding:11px 16px;border-radius:10px;border:0;background:var(--navy);color:#fff;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1}
.kb{border:1.5px solid var(--burgundy);border-radius:10px;padding:10px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--chip-line);background:var(--soft);border-radius:999px;padding:2px 10px;font-size:14px}
.cnt{font-size:22px;letter-spacing:4px}
.bar{height:4px;background:rgba(255,255,255,.2)}.bar i{display:block;height:100%;background:#c98a12;width:0}
.score{font-family:var(--display);font-size:42px}
.hide{display:none}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--burgundy);margin-left:6px;vertical-align:middle}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">L7·L8 암기 트레이닝<small id="subb"></small></div><button class="hb hide" id="hm">목록</button></div><div class="bar"><i id="bar"></i></div></header>
<main class="wrap" id="app"></main>
<script>
const MEM={"key":"m1yun78_mem_v1","unit":"중1 동아(윤정미)","title":"L7·L8 대화문·본문 암기 트레이닝","LS":[{"l":"L7","title":"Find Your Dream"},{"l":"L8","title":"Be Smart Online"}],"DLG":[{"id":"Y7D1","title":"L7 · Watch and Check 1 · Minsu","who":"소녀와 민수","what":"민수의 장래 희망(스포츠 기자)","why":"모든 종류의 스포츠에 관심이 있어서","key":[["What do you want to be in the future?","너는 장래에 무엇이 되고 싶니? (장래 희망 묻기)"],["I'm interested in ~.","나는 ~에 관심이 있어. (관심 말하기)"]],"lines":[["G","[[What do you want to be]] / in the future, / Minsu?","민수야, 너는 장래에 무엇이 되고 싶니?"],["B","I [[want to be]] / a sports reporter.","나는 스포츠 기자가 되고 싶어."],["G","Oh, really? / Do you watch / [[a lot of]] sports games?","오, 정말? 너는 스포츠 경기를 많이 보니?"],["B","Yes, I do. / [[I'm interested in]] / all kinds of sports.","응, 그래. 나는 모든 종류의 스포츠에 관심이 있어."]],"frame":["A: What do you want to be in the future?","B: I want to be ____________.","A: Oh, really? Do you ____________?","B: Yes, I do. I'm interested in ____________."],"les":"L7","lt":"Find Your Dream"},{"id":"Y7D2","title":"L7 · Watch and Check 2 · David","who":"소녀와 David","what":"David의 장래 희망(세계적으로 유명한 요리사)","why":"이탈리아 음식에 관심이 있어서","key":[["Are you interested in ~?","너는 ~에 관심이 있니? (관심 묻기)"],["They look delicious.","look + 형용사: ~해 보이다"]],"lines":[["G","David, / what are you making?","David, 너는 무엇을 만들고 있니?"],["B","I'm making / pizza and pasta.","나는 피자와 파스타를 만들고 있어."],["G","They [[look delicious]]. / [[Are you interested in]] / Italian food?","그것들은 맛있어 보여. 너는 이탈리아 음식에 관심이 있니?"],["B","Yes, I am. / I want to be / a [[world-famous chef]] / in the future!","응, 그래. 나는 장래에 세계적으로 유명한 요리사가 되고 싶어!"]],"frame":["A: What are you making?","B: I'm making ____________.","A: They look ____________. Are you interested in ____________?","B: Yes, I am. I want to be ____________ in the future!"],"les":"L7","lt":"Find Your Dream"},{"id":"Y7D3","title":"L7 · Watch and Check 3 · Hojin","who":"소녀와 호진","what":"호진의 장래 희망(작곡가)","why":"노래 쓰는 것에 정말 관심이 있어서","key":[["Do you want to be ~?","너는 ~이 되고 싶니?"],["I'm interested in -ing.","나는 ~하는 것에 관심이 있어. (in + 동명사)"]],"lines":[["G","What's this music, / Hojin? / It's [[awesome]].","호진아, 이 음악은 뭐니? 굉장하다."],["B","I'm [[writing a song]] / with this computer program.","나는 이 컴퓨터 프로그램으로 노래를 쓰고 있어."],["G","You're very good. / [[Do you want to be]] / a songwriter?","너 정말 잘한다. 너는 작곡가가 되고 싶니?"],["B","Yes, / I'm really interested / [[in writing]] songs.","응, 나는 노래를 쓰는 것에 정말 관심이 있어."]],"frame":["A: What's this ____________? It's awesome.","B: I'm ____________.","A: You're very good. Do you want to be ____________?","B: Yes, I'm really interested in ____________."],"les":"L7","lt":"Find Your Dream"},{"id":"Y7D4","title":"L7 · Watch and Check 4 · Jacob","who":"소녀와 Jacob","what":"Jacob의 장래 희망(패션 디자이너)","why":"옷 만드는 것을 매우 좋아해서","key":[["I love to make ~.","나는 ~을 만드는 것을 매우 좋아해. (love + to부정사)"],["I'll make clothes for you someday.","언젠가 너를 위해 옷을 만들어 줄게."]],"lines":[["G","[[Are you interested in]] fashion, / Jacob?","Jacob, 너는 패션에 관심이 있니?"],["B","Yes, / I [[love to make]] clothes.","응, 나는 옷 만드는 것을 매우 좋아해."],["G","Really? / That's so cool!","정말? 정말 멋지다!"],["B","Thanks. / I want to be / a fashion designer. / I'll make clothes / for you / [[someday]].","고마워. 나는 패션 디자이너가 되고 싶어. 언젠가 너를 위해 옷을 만들어 줄게."]],"frame":["A: Are you interested in ____________?","B: Yes, I love to ____________.","A: Really? That's so cool!","B: Thanks. I want to be ____________."],"les":"L7","lt":"Find Your Dream"},{"id":"Y7DC","title":"L7 · Watch, Answer, and Talk · Jiho & Lucy","who":"Lucy와 지호","what":"지호는 조종사, Lucy는 비행기 엔지니어가 되고 싶다","why":"지호는 비행기 조종하기에, Lucy는 비행기 만들기에 관심이 있어서","key":[["Why don't we ~?","우리 ~하는 게 어때? (제안)"],["How about you?","너는 어때?"],["That sounds cool!","그거 멋지다! (sound + 형용사)"]],"lines":[["G","Jiho, / [[why don't we]] try this? / We can fly / an airplane!","지호야, 우리 이거 해 보는 게 어때? 우리는 비행기를 조종할 수 있어!"],["B","Sure. / It [[looks like fun]]!","좋아. 재미있어 보인다!"],["G","Do you want to be / a pilot / in the future?","너는 장래에 조종사가 되고 싶니?"],["B","Yes, / I'm interested / in [[flying airplanes]]. / [[How about you]], Lucy?","응, 나는 비행기 조종하는 것에 관심이 있어. 너는 어때, Lucy?"],["G","I'm interested / in making airplanes, / not flying. / I want to be / an [[airplane engineer]].","나는 비행기를 조종하는 게 아니라 만드는 것에 관심이 있어. 나는 비행기 엔지니어가 되고 싶어."],["B","That [[sounds cool]]!","그거 멋지다!"],["G","Thank you. / I want to make / an airplane / someday!","고마워. 나는 언젠가 비행기를 만들고 싶어!"],["B","Let's fly / this airplane, / and then / we can [[try making]] / an airplane, too.","이 비행기를 조종해 보고, 그다음에 비행기 만들기도 해 보자."],["G","Good idea.","좋은 생각이야."]],"frame":["A: Why don't we try ____________?","B: Sure. It looks like fun!","A: Do you want to be ____________ in the future?","B: Yes, I'm interested in ____________. How about you?","A: I'm interested in ____________."],"les":"L7","lt":"Find Your Dream"},{"id":"Y8D1","title":"L8 · Watch and Check 1 · Movie","who":"소녀와 소년","what":"영화가 재미있어 보이는지에 대한 의견","why":"소년은 지루해 보인다고 했지만, 배우들이 유명해서 보기로 함","key":[["What do you think?","너는 어떻게 생각하니? (의견 묻기)"],["I don't agree.","나는 동의하지 않아. (비동의)"]],"lines":[["G","This movie / [[looks really fun]]. / [[What do you think]]?","이 영화 정말 재미있어 보여. 너는 어떻게 생각해?"],["B","[[I don't agree]]. / I think / it looks a little boring.","나는 동의하지 않아. 내 생각엔 조금 지루해 보여."],["G","But / look at these actors. / They are all famous.","하지만 이 배우들을 봐. 그들은 모두 유명해."],["B","All right. / Let's watch it.","알겠어. 그거 보자."]],"frame":["A: This ____________ looks really fun. What do you think?","B: I don't agree. I think it looks ____________.","A: But look at ____________.","B: All right. Let's ____________."],"les":"L8","lt":"Be Smart Online"},{"id":"Y8D2","title":"L8 · Watch and Check 2 · Pasta","who":"소년과 소녀","what":"파스타 맛에 대한 의견","why":"소녀는 꽤 맛있다고, 소년은 너무 짜다고 생각함","key":[["What do you think about ~?","~에 대해 어떻게 생각하니?"],["I don't think so.","나는 그렇게 생각하지 않아. (비동의)"]],"lines":[["B","[[What do you think about]] / this pasta?","너는 이 파스타에 대해 어떻게 생각하니?"],["G","I think / it's [[pretty good]].","나는 꽤 맛있다고 생각해."],["B","[[I don't think so]]. / I think / it's [[too salty]].","나는 그렇게 생각하지 않아. 너무 짜다고 생각해."],["G","Really? / It's OK for me.","정말? 나는 괜찮은데."]],"frame":["A: What do you think about ____________?","B: I think it's ____________.","A: I don't think so. I think it's too ____________.","B: Really? It's OK for me."],"les":"L8","lt":"Be Smart Online"},{"id":"Y8D3","title":"L8 · Watch and Check 3 · New Phone","who":"소녀와 소년","what":"새 휴대폰 모델에 대한 의견","why":"아주 가벼워서 둘 다 마음에 들어 함","key":[["I agree.","동의해. (동의)"],["It's lighter than mine.","그건 내 것보다 더 가벼워. (비교급 + than)"]],"lines":[["G","My phone / is not working. / I [[need to get]] a new one.","내 휴대폰이 작동하지 않아. 나는 새것을 사야 해."],["B","Look! / [[Here are]] the new models. / What do you think / about this one?","봐! 여기 새 모델들이 있어. 이 모델에 대해 어떻게 생각해?"],["G","Wow, / I like it. / It's very light.","와, 마음에 들어. 아주 가벼워."],["B","[[I agree]]. / It's [[lighter than mine]].","동의해. 그건 내 것보다 더 가벼워."]],"frame":["A: My ____________ is not working. I need to get a new one.","B: Look! What do you think about this one?","A: I like it. It's very ____________.","B: I agree. It's ____________ than mine."],"les":"L8","lt":"Be Smart Online"},{"id":"Y8D4","title":"L8 · Watch and Check 4 · Cleaning Robot","who":"소녀와 소년","what":"청소 로봇에 대한 의견","why":"둘 다 방 청소를 싫어해서 청소 로봇이 도움이 된다고 생각함","key":[["Me, too.","나도 그래. (동의)"],["Who does?","누가 그러겠어? (아무도 안 좋아해)"]],"lines":[["G","What do you think / about cleaning robots? / [[There's one]] over there.","너는 청소 로봇에 대해 어떻게 생각해? 저기 하나 있어."],["B","I think / they are [[very helpful]]. / I really need one / at home.","나는 그것들이 아주 도움이 된다고 생각해. 나는 집에 하나 정말 필요해."],["G","[[Me, too]]. / I don't like / to clean my room.","나도 그래. 나는 내 방 청소하는 걸 좋아하지 않아."],["B","[[Who does]]? / Cleaning robots / are [[perfect for]] / people like us.","누가 좋아하겠어? 청소 로봇은 우리 같은 사람들에게 딱이야."]],"frame":["A: What do you think about ____________?","B: I think they are very ____________.","A: Me, too. I don't like to ____________.","B: Who does?"],"les":"L8","lt":"Be Smart Online"},{"id":"Y8DC","title":"L8 · Watch, Answer, and Talk · E-book","who":"Alex와 유나","what":"블랙홀 책을 살지, 전자책을 살지","why":"종이책은 두껍고 무거운데, 전자책은 휴대폰으로 읽을 수 있고 더 싸서","key":[["I'd love to, but ~.","정말 그러고 싶지만 ~."],["Why don't you ~?","~하는 게 어때? (제안)"]],"lines":[["B","What do you think / about this book, / Yuna?","유나야, 너는 이 책에 대해 어떻게 생각해?"],["G","<i>A History of Black Holes</i>? / I think / it'll be difficult.","'블랙홀의 역사'? 나는 어려울 것 같아."],["B","[[I don't agree]]. / I think / it'll be very interesting.","나는 동의하지 않아. 나는 매우 흥미로울 것 같아."],["G","Hmm ... / I didn't know / you were [[interested in]] black holes. / So, / are you going to buy the book, / Alex?","음… 네가 블랙홀에 관심 있는 줄 몰랐어. 그래서 그 책을 살 거니, Alex?"],["B","[[I'd love to]], / but it's too thick / and heavy.","정말 사고 싶지만, 너무 두껍고 무거워."],["G","[[Why don't you]] buy / the e-book then? / You can read it / on your phone.","그럼 전자책을 사는 게 어때? 휴대폰으로 읽을 수 있어."],["B","That's a good idea!","좋은 생각이야!"],["G","And / it's also [[cheaper than]] / the paper book.","그리고 그것은 종이책보다 더 싸기도 해."],["B","Really? / Then, / I'll buy the e-book.","정말? 그럼 전자책을 살게."]],"frame":["A: What do you think about ____________?","B: I think it'll be ____________.","A: I don't agree. I think it'll be ____________.","B: Why don't you ____________?"],"les":"L8","lt":"Be Smart Online"}],"PAR":[{"id":"Y7M1","title":"L7 ① Jim (감독) & Anna (야외 촬영 관리자)","map":["Jim Brown – director of Happy Days","movie about friendship: Tom & dog Max","a lot of people – work hard – to create","Anna – found beach – location manager","job: find perfect places for shooting","not easy – love job – travel, challenges"],"s":[["Hi, I'm Jim Brown, / the director of <i>Happy Days</i>.","안녕하세요, 나는 'Happy Days'의 감독 Jim Brown이에요.","Jim Brown, director, Happy Days"],["It's a movie / about the friendship / between Tom and his dog Max.","그것은 Tom과 그의 개 Max 사이의 우정에 관한 영화예요.","movie, friendship, Tom, dog Max"],["A lot of people / are working hard / to create this movie.","많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있어요.","people, working hard, create"],["Do you want to  MEM.PAR.filter(p=>p.les===L.l).forEach((p,i)=>ITEMS.push({k:"P",les:L.l,n:i+1,id:p.id,title:"본문 "+p.title,lines:p.s.map(s=>({sp:"",en:s[0],ko:s[1],kw:s[2]})),p}));});
$("#subb").textContent=MEM.unit;
const STEPS={D:["① 이해·듣기","② 핵심 빈칸","③ 첫 글자","④ 역할 연습","⑤ 백지 쓰기","⑥ 녹음"],P:["① 스토리맵·듣기","② 내용어만","③ 첫 글자","④ 키워드만","⑤ 백지 쓰기","⑥ 다시 말하기"]};
function bar(p){$("#bar").style.width=(p*100)+"%"}
function home(){speechSynthesis&&speechSynthesis.cancel();stopRec();bar(0);$("#hm").classList.add("hide");window.scrollTo(0,0);
 const card=it=>{const d=st.done[it.id]||{};return `<button class="it" data-id="${it.id}"><b>${it.les} ${it.k==="D"?"대화문 "+it.n:"본문 "+it.n}</b><span>${esc(it.k==="D"?it.title:tt(it.p.title))}</span><div class="dots">${STEPS[it.k].map((_,i)=>`<i class="${d["s"+i]?"on":""}"></i>`).join("")}</div><span class="st">${d.best!=null?`백지 최고 ${d.best}/${it.lines.length}`:"아직 백지 테스트 전"}</span></button>`};
 app.innerHTML=`<span class="eye">${esc(MEM.unit)} · L7 · L8</span><h1>대화문·본문 암기 트레이닝</h1>
 <p class="muted">이해 → 소리 → 조금씩 지우기 → 백지로 쓰기. 단계를 순서대로 하면 자연스럽게 외워져요. 백지 쓰기 결과는 선생님 노션에 저장됩니다.</p>
 <div class="card nm"><span class="muted">이름</span><input id="nm" placeholder="이름을 입력하세요" value="${esc(st.name)}"></div>
 ${MEM.LS.map(L=>`<h2 style="margin-top:26px;font-size:20px">${L.l} · ${esc(L.title)}</h2><h2>대화문</h2><div class="grid">${ITEMS.filter(i=>i.les===L.l&&i.k==="D").map(card).join("")}</div><h2>본문</h2><div class="grid">${ITEMS.filter(i=>i.les===L.l&&i.k==="P").map(card).join("")}</div>`).join("")}
 <div class="card muted" style="font-size:14px"><b>반복 계획</b> Day 1: ①② · Day 2: ③④ · Day 3: ⑤⑥ · Day 4·7: 백지 쓰기 다시</div>
 <div class="ft">제작: 스텔라원장 · 잉글리시아이 스텔라</div>`;
 $("#nm").oninput=e=>{st.name=e.target.value.trim();sv()};
 app.querySelectorAll(".it").forEach(b=>b.onclick=()=>{if(!st.name){$("#nm").focus();$("#nm").placeholder="먼저 이름을 입력하세요!";return}open(b.dataset.id,0)});
 flushQ();
}
let CUR=null;
function mark(i){(st.done[CUR.id]=st.done[CUR.id]||{})["s"+i]=1;sv()}
function open(id,step){CUR=ITEMS.find(x=>x.id===id);CUR.t0=CUR.t0||Date.now();show(step)}
function show(step){speechSynthesis&&speechSynthesis.cancel();stopRec();window.scrollTo(0,0);$("#hm").classList.remove("hide");
 const it=CUR,S=STEPS[it.k],d=st.done[it.id]||{};bar((step+1)/S.length);
 let h=`<span class="eye">${it.les} · ${it.k==="D"?"대화문 "+it.n:"본문 "+it.n}</span><h1 style="font-size:24px">${esc(it.k==="D"?it.title:tt(it.p.title))}</h1>
 <div class="steps">${S.map((s,i)=>`<button data-s="${i}" class="${i===step?"on":""} ${d["s"+i]?"done":""}">${s}</button>`).join("")}</div><div id="body"></div>
 <div class="row">${step>0?`<button class="btn ghost" id="prev">← 이전</button>`:""}${step<S.length-1?`<button class="btn" id="next">다음 단계 →</button>`:`<button class="btn" id="fin">목록으로</button>`}</div>`;
 app.innerHTML=h;
 app.querySelectorAll(".steps button").forEach(b=>b.onclick=()=>show(+b.dataset.s));
 if($("#prev"))$("#prev").onclick=()=>show(step-1);
 if($("#next"))$("#next").onclick=()=>{mark(step);show(step+1)};
 if($("#fin"))$("#fin").onclick=()=>{mark(step);home()};
 const B=$("#body");
 (it.k==="D"?[s1D,s2D,s3,s4D,s5,s6]:[s1P,s2P,s3,s4P,s5,s6P])[step](B,it);
}
const sayBtn=t=>`<button class="say" data-t="${esc(plain(t))}" aria-label="듣기">🔊</button>`;
function wireSay(B){B.querySelectorAll(".say").forEach(b=>b.onclick=()=>speak(b.dataset.t))}
function counter(B,label){let c=0;B.insertAdjacentHTML("beforeend",`<div class="card" style="text-align:center"><div class="muted">${label}</div><div class="cnt" id="cnt">○○○</div><div class="row"><button class="btn ghost" id="all">🔊 전체 듣기</button><button class="btn" id="rd">한 번 읽었어요</button></div></div>`);
 $("#rd").onclick=()=>{c=Math.min(3,c+1);$("#cnt").textContent="●".repeat(c)+"○".repeat(3-c)};
 $("#all").onclick=async()=>{for(const l of CUR.lines){await speak(l.en)}}}
function s1D(B,it){const d=it.d;
 B.innerHTML=`<div class="card"><b>이해 질문</b> <span class="muted">(생각해 보고 눌러서 확인)</span>
 ${[["누가?",d.who],["무엇?",d.what],["왜?",d.why]].map(q=>`<div class="ln"><span class="sp" style="flex-basis:48px">${q[0]}</span><div class="tx"><button class="say rv" style="font-size:13px">정답 보기</button><span class="hide">${esc(q[1])}</span></div></div>`).join("")}</div>
 <div class="kb"><b>핵심 표현</b><br>${d.key.map(k=>`• <b>${esc(k[0])}</b> – ${esc(k[1])}`).join("<br>")}</div>
 <div class="card">${it.lines.map(l=>`<div class="ln"><span class="sp">${l.sp}</span><div class="tx">${chunk(l.en)}<div class="ko">${esc(l.ko)}</div></div>${sayBtn(l.en)}</div>`).join("")}</div>`;
 B.querySelectorAll(".rv").forEach(b=>b.onclick=()=>{b.classList.add("hide");b.nextElementSibling.classList.remove("hide")});
 wireSay(B);counter(B,"/ 에서 끊어 소리 내어 3번 읽기");}
function s1P(B,it){
 B.innerHTML=`<div class="card"><b>스토리맵</b> <span class="muted">흐름을 먼저 머리에 넣어요</span><div class="chips" style="margin-top:6px">${it.p.map.map(m=>`<span>${esc(m)}</span>`).join("")}</div></div>
 <div class="card">${it.lines.map((l,i)=>`<div class="ln"><span class="sp">${i+1}</span><div class="tx">${chunk(l.en)}<div class="ko">${esc(l.ko)}</div></div>${sayBtn(l.en)}</div>`).join("")}</div>`;
 wireSay(B);counter(B,"/ 에서 끊어 소리 내어 3번 읽기");}
// inline blank stage
function blanks(B,it,mk){
 const rows=it.lines.map((l,li)=>{let parts=mk(l.en);return `<div class="ln"><span class="sp">${l.sp||li+1}</span><div class="tx">${parts}<div class="ko">${esc(l.ko)}</div></div></div>`});
 B.innerHTML=`<div class="card">${rows.join("")}</div><div class="row"><button class="btn" id="ck">채점하기</button><button class="btn ghost" id="sh">정답 보기</button></div><div id="msg" class="res"></div>`;
 $("#ck").onclick=()=>{let ok=0,all=0;B.querySelectorAll(".bin").forEach(x=>{all++;const g=norm(x.value)===norm(x.dataset.a);x.classList.toggle("ok",g);x.classList.toggle("no",!g);if(g)ok++});$("#msg").innerHTML=`<b class="${ok===all?"ok":"bad"}">${ok} / ${all} 정답</b>${ok===all?" 🎉 다음 단계로!":" – 틀린 칸을 고쳐 다시 채점해요."}`};
 $("#sh").onclick=()=>B.querySelectorAll(".bin").forEach(x=>{if(norm(x.value)!==norm(x.dataset.a)){x.value=x.dataset.a;x.classList.add("no")}});}
const inp=a=>`<input class="bin" data-a="${esc(a)}" style="width:${Math.max(70,a.length*10+24)}px" autocomplete="off" autocapitalize="off" spellcheck="false">`;
function s2D(B,it){blanks(B,it,en=>en.replace(/ \/ /g," ").replace(/\[\[(.+?)\]\]/g,(m,x)=>inp(x)))}
function s2P(B,it){blanks(B,it,en=>words(en).map(w=>{const m=w.match(/^([^A-Za-z]*)([A-Za-z'’\-]+)(.*)$/);return m&&FW.has(m[2].toLowerCase())?m[1]+inp(m[2])+m[3]:esc(w)}).join(" "))}
// typing stage
function typing(B,it,hintF,title,saveIt){
 B.innerHTML=`<p class="muted">${title}</p>${it.lines.map((l,i)=>`<div class="card" style="padding:12px"><div><span class="sp">${l.sp||i+1}</span> ${hintF(l,i)}</div><textarea rows="2" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰세요"></textarea><div class="res" id="r${i}"></div></div>`).join("")}
 <div class="row"><button class="btn" id="ck">${saveIt?"제출하고 채점하기":"채점하기"}</button></div><div id="sum"></div>`;
 $("#ck").onclick=()=>{let ok=0;const wrong=[];
  B.querySelectorAll("textarea").forEach(t=>{const i=+t.dataset.i,l=it.lines[i],a=norm(t.value),b=norm(plain(l.en));const g=a===b;if(g)ok++;else wrong.push({i,u:t.value.trim(),a:plain(l.en)});
   $("#r"+i).innerHTML=g?`<span class="ok">✓ 정확해요</span>`:diff(a,b,plain(l.en))});
  const n=it.lines.length;$("#sum").innerHTML=`<div class="card" style="text-align:center"><div class="score ${ok===n?"ok":""}">${ok} / ${n}</div><div class="muted">${ok===n?"완벽해요! 백지로 쓸 수 있어요 🎉":"빨간 부분을 보고 다시 써 보세요."}</div><div id="svm" class="muted"></div></div>`;
  if(saveIt)send(payload(it,ok,n,wrong));};}
function diff(a,b,orig){const A=a.split(" "),Bw=b.split(" ");let out=[];const m=Math.max(A.length,Bw.length);for(let i=0;i<m;i++){if(A[i]===Bw[i])out.push(esc(Bw[i]));else out.push(`<span class="m">${esc(Bw[i]||"")}</span>`)}return `<span class="bad">✗</span> 정답: ${esc(orig)}<br><span class="muted">틀린 위치: </span>${out.join(" ")}`}
const s3=(B,it)=>typing(B,it,l=>`<span class="hint">${esc(firstL(l.en))}</span>`,"첫 글자만 보고 문장 전체를 쓰세요.");
function s4P(B,it){typing(B,it,l=>`<span class="hint">[ ${esc(l.kw)} ]</span>`,"키워드만 보고 문장 전체를 쓰세요.")}
function s5(B,it){typing(B,it,l=>`<span class="ko" style="font-size:15px">${esc(l.ko)}</span>`,"우리말만 보고 영어로 쓰세요. 제출하면 선생님 노션에 점수가 저장돼요.",true)}
// role play
function s4D(B,it){const sps=[...new Set(it.lines.map(l=>l.sp))];
 B.innerHTML=`<div class="card"><b>역할 연습</b><p class="muted" style="margin:4px 0">내가 맡을 역할을 고르세요. 상대 대사는 앱이 읽어 주고, 내 차례에는 우리말만 보고 영어로 말해요.</p><div class="row">${sps.map(s=>`<button class="btn ghost rl" data-s="${s}">내가 ${s}</button>`).join("")}</div></div><div id="rp"></div>`;
 B.querySelectorAll(".rl").forEach(b=>b.onclick=()=>role(b.dataset.s));
 function role(me){let i=0;const rp=$("#rp");
  const step=async()=>{if(i>=it.lines.length){rp.innerHTML=`<div class="card" style="text-align:center"><b class="ok">끝! 🎉</b><p class="muted">역할을 바꿔 한 번 더 해 보세요.</p></div>`;return}
   const l=it.lines[i];
   if(l.sp!==me){rp.innerHTML=`<div class="card"><div class="ln"><span class="sp">${l.sp}</span><div class="tx">${esc(plain(l.en))}</div></div><p class="muted">🔊 상대 대사 듣는 중…</p></div>`;await speak(l.en);i++;step()}
   else{rp.innerHTML=`<div class="card"><div class="ln"><span class="sp">${l.sp}</span><div class="tx"><div class="ko" style="font-size:16px">${esc(l.ko)}</div><div id="ans" class="hide">${esc(plain(l.en))}</div></div></div><p class="muted">내 차례! 영어로 소리 내어 말한 뒤 확인하세요.</p><div class="row"><button class="btn ghost" id="sa">정답 확인</button><button class="btn" id="nx">다음</button></div></div>`;
    $("#sa").onclick=()=>{$("#ans").classList.remove("hide");speak(l.en)};$("#nx").onclick=()=>{i++;step()}}};
  step()}}
// recording
let rec=null,chunks=[],stream=null;
function stopRec(){try{if(rec&&rec.state!=="inactive")rec.stop()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}rec=null}
function recorder(B,label){
 B.insertAdjacentHTML("beforeend",`<div class="card" style="text-align:center"><b>🎤 ${label}</b><p class="muted" style="margin:4px 0">녹음 후 들어 보고, 원어민 발음과 비교해 보세요.</p><div class="row"><button class="btn" id="rb">● 녹음 시작</button></div><audio id="au" controls class="hide" style="width:100%;margin-top:10px"></audio><div id="rm" class="muted"></div></div>`);
 $("#rb").onclick=async()=>{if(rec){stopRec();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){$("#rm").textContent="이 브라우저에서는 녹음이 지원되지 않아요. 크롬이나 사파리 최신 버전을 사용하세요.";return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$("#rm").textContent="마이크 권한을 허용해 주세요.";return}
  chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=$("#au");if(!a)return;a.src=URL.createObjectURL(new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"}));a.classList.remove("hide");$("#rb").textContent="● 다시 녹음";try{stream.getTracks().forEach(t=>t.stop())}catch(e){}rec=null};
  rec.start();$("#rb").textContent="■ 녹음 멈추기";$("#rm").textContent="녹음 중… 끝나면 멈추기를 누르세요."}}
function s6(B,it){B.innerHTML=`<div class="card">${it.lines.map(l=>`<div class="ln"><span class="sp">${l.sp}</span><div class="tx ko" style="font-size:15px">${esc(l.ko)}</div>${sayBtn(l.en)}</div>`).join("")}</div>`;wireSay(B);recorder(B,"우리말만 보고 대화 전체 말하기")}
function s6P(B,it){B.innerHTML=`<div class="card"><b>스토리맵만 보고 다시 말하기</b><div class="chips" style="margin-top:6px">${it.p.map.map(m=>`<span>${esc(m)}</span>`).join("")}</div></div><div class="card"><button class="btn ghost" id="sw" style="width:100%">원문 보기 / 숨기기</button><div id="org" class="hide">${it.lines.map((l,i)=>`<div class="ln"><span class="sp">${i+1}</span><div class="tx">${esc(plain(l.en))}</div>${sayBtn(l.en)}</div>`).join("")}</div></div>`;
 $("#sw").onclick=()=>$("#org").classList.toggle("hide");wireSay(B);recorder(B,"키워드만 보고 본문 다시 말하기")}
// save
const saveOn=()=>/^https:\/\/script\.google\.com\//.test(SAVE_URL);
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return[]}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function post(p){const r=await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});const j=await r.json();if(!j.ok)throw new Error(j.msg||"fail");return j}
async function flushQ(){if(!saveOn())return;const q=getQ();if(!q.length)return;const left=[];for(const p of q){try{await post(p)}catch(e){left.push(p)}}setQ(left)}
function payload(it,ok,n,wrong){const d=st.done[it.id]=st.done[it.id]||{};const first=d.best==null;d.best=Math.max(d.best||0,ok);d.tries=(d.tries||0)+1;sv();
 const now=new Date(),p=v=>String(v).padStart(2,"0");
 return{type:"memorize",name:st.name,unit:MEM.unit+" "+it.les+" 암기",day:it.k==="D"?it.n:it.n+MEM.DLG.filter(d=>d.les===it.les).length,title:(it.k==="D"?"대화문 ":"본문 ")+it.n+" · "+(it.k==="D"?it.title:tt(it.p.title)),cat:it.k==="D"?"대화문 암기":"본문 암기",
  attempt:first?"백지 1회차":"백지 "+d.tries+"회차",score:ok,total:n,wrongNums:wrong.length?wrong.map(w=>(w.i+1)+"번").join(", "):"없음",
  wrongDetail:wrong.map(w=>`${w.i+1}번 내 답: ${w.u||"-"} → 정답: ${w.a}`).join("\n").slice(0,1900),minutes:Math.max(1,Math.round((Date.now()-(it.t0||Date.now()))/60000)),
  timestamp:`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}:00+09:00`}}
async function send(pl){const m=t=>{const x=$("#svm");if(x)x.innerHTML=t};if(!saveOn())return;m("저장 중…");
 try{await post(pl);m('<span class="ok">✓ 선생님 노션에 저장되었습니다.</span>');flushQ()}catch(e){const q=getQ();q.push(pl);setQ(q);m('<span class="bad">저장 실패(인터넷 확인). 다음에 앱을 열면 자동으로 다시 보내요.</span>')}}
$("#hm").onclick=home;home();
</script>
</body>
</html>
