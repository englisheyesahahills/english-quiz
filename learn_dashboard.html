<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중등부 학습 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--gold:#c98a12;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--soft:#eef0f6;--ok:#1f8a4c;--okbg:#e3f6ea;--mid:#b7791f;--midbg:#fdf3e1;--no:#c0392b;--nobg:#fbe7e5}
@media (prefers-color-scheme:dark){:root{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--bur:#e0708c;--okbg:#14301f;--ok:#5fd18f;--midbg:#3a2e14;--mid:#f0b54d;--nobg:#3a1714;--no:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select{font:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
header .w{max-width:1000px;margin:0 auto;padding:11px 16px;display:flex;gap:10px;align-items:center}
.brand{font-family:"Do Hyeon",sans-serif;font-size:21px;flex:1}
.hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer}
main{max-width:1000px;margin:0 auto;padding:14px 16px 60px}
h1{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:28px;margin:4px 0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
input[type=text],input[type=password],select{color:var(--ink);background:var(--card);border:1.5px solid #c9cedb;border-radius:10px;padding:8px 11px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--navy);color:#fff;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:500}
.chip.on{background:var(--bur);border-color:var(--bur);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;border-bottom:2px solid var(--line)}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 14px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--navy);border-color:var(--bur)}
@media (prefers-color-scheme:dark){.tab.on{color:#fff}}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-family:"Do Hyeon",sans-serif;font-weight:400;color:var(--navy)}
@media (prefers-color-scheme:dark){.kpi b{color:#fff}}
.kpi span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.st{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink)}
.st:hover{border-color:var(--bur)}
.st b{font-size:17px}.st .m{font-size:12px;color:var(--muted);margin-top:2px}
.pb{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:8px 0 4px}.pb i{display:block;height:100%}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.g{background:var(--okbg);color:var(--ok)}.y{background:var(--midbg);color:var(--mid)}.r{background:var(--nobg);color:var(--no)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;border-bottom:1.5px solid var(--line);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
details summary{cursor:pointer;color:var(--bur);font-size:12px}
details div{font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin-top:4px}
h2{font-size:16px;margin:16px 0 6px}
.unit{font-size:12px;color:var(--bur);font-weight:700}
.err{color:var(--no);font-size:14px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:30px}
.gr{display:grid;grid-template-columns:34px 1fr;gap:4px 10px;border-bottom:1px solid var(--line);padding:10px 0}
.gr .no{font-family:"Do Hyeon",sans-serif;font-size:20px;color:var(--bur)}
.ans{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:14px;margin:3px 0}
.mdl{font-size:13px;color:var(--ok)}
.pts{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.pts button{width:38px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.pts button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pts button.on.z{background:var(--no);border-color:var(--no)}
.tot{position:sticky;bottom:0;background:var(--card);border:1.5px solid var(--bur);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tot b{font-family:"Do Hyeon",sans-serif;font-weight:400;font-size:26px;color:var(--bur)}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
@media (max-width:640px){.kpi{grid-template-columns:repeat(2,1fr)}.hide-m{display:none}}
</style>
</head>

 else if(UI.tab==="day"){dayTab(v,R)}
 else if(UI.tab==="parts"){partsTab(v,R)}
 else if(UI.tab==="grade"){const L={};R.forEach(r=>{if(!r.mock)return;const k=r.name+"|"+r.title;if(!L[k]||L[k].t<r.t)L[k]=r});

  v.innerHTML=A.length?`<p class="muted">학생 화면에는 <b>객관식 점수만</b> 보여요. 서술형은 여기서 선생님이 점수를 넣으면 총점(100점)이 만들어져요. · 채점 대기 <b>${wait}</b>명</p>
   <div class="bar"><button class="chip" id="cpall">🔗 채점 결과 링크 전체 복사 (카톡용)</button><span class="muted">📄 = 채점된 시험지(⭕╱ 표시) · 서술형 채점 전이면 객관식만 보여요</span></div><div class="tw"><table><tr><th>제출</th><th>학생</th><th>시험</th><th class="n">점수</th><th></th></tr>
   ${A.map((r,i)=>`<tr><td class="n">${fmt(r.t)}</td><td><b>${esc(r.name)}</b></td><td>${esc(r.mock.K.title)}<br><span class="muted">${esc(r.mock.K.sub)}</span></td><td class="n"><span class="pill ${r.mock.pts?cls(pct(r)):"y"}">${sc(r)}</span></td><td style="white-space:nowrap"><a class="chip" href="${revLink(r)}" target="_blank" style="text-decoration:none">📄</a> <button class="chip" data-cp="${i}">🔗</button> <button class="btn" data-g="${i}" style="padding:6px 12px;font-size:13px;${r.mock.pts?"background:var(--muted)":""}">${r.mock.pts?"수정":"채점하기"}</button></td></tr>`).join("")}</table></div>`:`<p class="empty">이 기간에 제출된 모의고사가 없어요.</p>`;
  v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>gradeView(A[+b.dataset.g]));
  v.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{const r=A[+b.dataset.cp];copyTxt(`[${r.name}] ${r.mock.K.title} 채점 결과\n${revLink(r)}`,b)});
  const ca=$("#cpall");if(ca)ca.onclick=()=>copyTxt(A.map(r=>`[${r.name}] ${r.mock.K.title} 채점 결과\n${revLink(r)}`).join("\n\n"),ca)}
 else if(UI.tab==="wrong"){const by={};R.forEach(r=>{if(!r.wrong||r.wrong==="없음")return;r.wrong.split(/,\s*/).forEach(w=>{w=w.trim();if(!w)return;const k=r.unit+"|"+r.title+"|"+w;(by[k]=by[k]||{n:0,who:new Set()});by[k].n++;by[k].who.add(r.name)})});
  const L=Object.entries(by).sort((a,b)=>b[1].who.size-a[1].who.size||b[1].n-a[1].n).slice(0,40);
  v.innerHTML=L.length?`<p class="muted">여러 학생이 틀린 문항 순서예요. 수업에서 다시 짚어 줄 문제를 고르세요.</p><div class="tw"><table><tr><th>#</th><th>교재·단원 / 주제</th><th>문항</th><th class="n">틀린 학생</th><th class="hide-m">학생</th></tr>
   ${L.map(([k,o],i)=>{const [u,t,w]=k.split("|");return `<tr><td>${i+1}</td><td><span class="unit">${esc(u)}</span><br>${esc(t)}</td><td><b>${esc(w)}</b></td><td class="n">${o.who.size}명</td><td class="hide-m muted">${esc([...o.who].join(", "))}</td></tr>`}).join("")}</table></div>`:`<p class="empty">틀린 문항 기록이 없어요. 🎉</p>`}
 else{v.innerHTML=`<div class="bar"><button class="chip" id="csv">⬇️ CSV 내려받기</button><span class="muted">${R.length}건</span></div><div class="tw"><table><tr><th>시각</th><th>학생</th><th>교재·단원 / 주제</th><th class="n">점수</th><th class="hide-m">오답</th></tr>
  ${R.slice(0,500).map(r=>`<tr><td class="n">${fmt(r.t)}</td><td><b>${esc(r.name)}</b></td><td><span class="unit">${esc(r.unit)}</span><br>${esc(r.title)} <span class="muted">${esc(r.attempt)}</span></td><td class="n"><span class="pill ${cls(pct(r))}">${sc(r)}</span></td><td class="hide-m">${esc(r.wrong)}</td></tr>`).join("")}</table></div>`;
  $("#csv").onclick=()=>{const h=["시각","학생","교재/단원","DAY","주제","영역","응시 구분","점수","문항수","오답 문항","오답 상세","소요(분)"];
   const q=s=>`"${String(s).replace(/"/g,'""')}"`;const csv="﻿"+[h,...R.map(r=>[new Date(r.t).toLocaleString("ko-KR"),r.name,r.unit,r.day,r.title,r.cat,r.attempt,r.score,r.total,r.wrong,r.detail,r.min])].map(a=>a.map(q).join(",")).join("\n");
   const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="중등부_학습기록.csv";a.click()}}}
function stuDetail(v,A){const avg=A.length?A.reduce((s,r)=>s+pct(r),0)/A.length:0;const by={};A.forEach(r=>(by[r.unit]=by[r.unit]||[]).push(r));
 v.innerHTML=`<div class="bar"><button class="chip" id="bk">← 학생 목록</button></div>
 <div class="card"><h1 style="font-size:26px">${esc(UI.stu)}</h1><div class="muted">완료 ${A.length}세트 · 평균 정답률 <span class="pill ${cls(avg)}">${Math.round(avg*100)}%</span> · 70% 미만 ${A.filter(r=>pct(r)<.7).length}개 · 총 ${A.reduce((s,r)=>s+r.min,0)}분</div></div>
 ${Object.entries(by).map(([u,a])=>`<h2>${esc(u)} <span class="muted">(${a.length}세트)</span></h2><div class="tw"><table><tr><th>시각</th><th>주제</th><th class="n">점수</th><th>틀린 문항</th></tr>
 ${a.map(r=>`<tr><td class="n">${fmt(r.t)}</td><td>${esc(r.title)}<br><span class="muted">${esc(r.cat)} · ${esc(r.attempt)} · ${r.min}분</span></td><td class="n"><span class="pill ${cls(pct(r))}">${sc(r)}</span>${r.mock?`<br><button class="chip" data-gr="${r.t}" style="margin-top:4px;font-size:12px">✍️ 서술형 ${r.mock.pts?"수정":"채점"}</button> <a class="chip" href="${revLink(r)}" target="_blank" style="text-decoration:none;font-size:12px">📄 시험지</a>`:""}</td><td>${r.wrong&&r.wrong!=="없음"?esc(r.wrong):'<span class="pill g">없음</span>'}${r.detail&&r.wrong!=="없음"?`<details><summary>학생 답 보기</summary><div>${esc(r.detail)}</div></details>`:""}</td></tr>`).join("")}</table></div>`).join("")}`;
 v.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>gradeView(A.find(r=>r.t===+b.dataset.gr)));
 $("#bk").onclick=()=>{UI.stu=null;renderView(filtered())}}
function gradeView(r){const v=$("#v"),M=r.mock,K=M.K;
 const P=M.pts?M.pts.slice():M.ans.map((a,i)=>/^✓/.test(a)?5:saOk(K.sa[i],a)?5:0);
 v.innerHTML=`<div class="bar"><button class="chip" id="gb">← 목록으로</button></div>
 <div class="card"><h1 style="font-size:24px">${esc(r.name)} · 서술형 채점</h1><div class="muted">${esc(K.title)} (${esc(K.sub)}) · 제출 ${fmt(r.t)}${M.gt?` · 마지막 채점 ${fmt(M.gt)}`:""}</div>
 <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">객관식 <b id="mcs"></b><span class="muted">틀린 번호</span><input type="text" id="mcw" value="${esc(M.mcW.map(w=>parseInt(w)).join(", "))}" placeholder="예: 13 (다 맞으면 비움)" style="width:170px">${M.fixed?'<span class="pill y">선생님 수정됨</span>':""}<button class="chip" id="mcsave">객관식만 저장</button></div>
 <div class="muted" style="font-size:12px">OMR 입력 실수가 있으면 실제 틀린 번호를 쉼표로 넣으세요.</div>
 <p class="muted" style="margin:6px 0 0">${M.pts?"저장된 점수예요. 고칠 문항만 바꾸고 저장하세요.":"자동 판정으로 미리 채워 두었어요(참고용). 시험지를 보고 문항별 점수(0~5)를 확인·수정한 뒤 저장하세요."}</p></div>
 <div class="card">${K.sa.map((q,i)=>`<div class="gr"><div class="no">${i+1}</div><div><span class="muted">${esc(q.ar)}</span>
  <div class="ans">학생 답: <b>${esc(M.ans[i])}</b></div>
  <div class="mdl">모범 답안: ${esc(q.a[0])}</div>${q.a.length>1?`<details><summary>정답 인정 예시 ${q.a.length}개</summary><div>${q.a.map(esc).join("\n")}</div></details>`:""}
  <div class="pts" data-i="${i}">${[5,4,3,2,1,0].map(p=>`<button data-p="${p}" class="${p===0?"z":""}">${p}</button>`).join("")}</div></div></div>`).join("")}
 <div class="tot"><span>총점</span><b id="tt"></b><span class="muted" id="tb"></span><span style="flex:1"></span><button class="btn" id="gs" style="background:var(--bur)">저장</button></div>
 <div class="err" id="gm"></div></div>`;
 let MCW=M.mcW.map(w=>parseInt(w));const MC=()=>20-MCW.length;
 const paint=()=>{$("#mcs").textContent=`${MC()}/20 → ${MC()*2.5}점`;v.querySelectorAll(".pts").forEach(d=>{const i=+d.dataset.i;d.querySelectorAll("button").forEach(b=>b.classList.toggle("on",+b.dataset.p===P[i]))});
  const s=P.reduce((a,b)=>a+b,0);$("#tt").textContent=`${Math.round((MC()*2.5+s)*10)/10} / 100`;$("#tb").textContent=`객관식 ${MC()*2.5} + 서술형 ${s}/50`};
 $("#mcw").oninput=e=>{MCW=[...new Set(e.target.value.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=20))].sort((a,b)=>a-b);paint()};
 v.querySelectorAll(".pts button").forEach(b=>b.onclick=()=>{P[+b.parentNode.dataset.i]=+b.dataset.p;paint()});paint();
 $("#gb").onclick=()=>{renderView(filtered());window.scrollTo(0,0)};
 const send=async(withSA)=>{const b=withSA?$("#gs"):$("#mcsave");b.disabled=true;const bt=b.textContent;b.textContent="저장 중…";const s=P.reduce((a,c)=>a+c,0),mc=MC(),tot=Math.round((mc*2.5+s)*10)/10;
  const mw=MCW.map(n=>n+"번").join(", ")||"없음";
  const body={name:r.name,unit:"중등부 모의고사",day:0,title:r.title,cat:"모의고사 서술형",attempt:withSA?"선생님 채점":"객관식 수정",score:withSA?s:mc,total:withSA?50:20,
   wrongNums:withSA?(P.map((p,i)=>p<5?"서술형"+(i+1):"").filter(Boolean).join(", ")||"없음"):mw,
   wrongDetail:`[GRADE:${M.id}] `+(withSA?`총점 ${tot}/100 · `:"")+`객관식 ${mc}/20(${mc*2.5}점)`+(withSA?` · 서술형 ${s}/50`:"")+` | mcw=${mw} | `+(withSA?`pts=${P.join(",")}`:M.pts?`pts=${M.pts.join(",")}`:"pts=-"),minutes:0,timestamp:new Date().toISOString()};
  try{await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),mode:"no-cors"});
   GR.push({t:Date.now(),name:r.name,title:r.title,detail:body.wrongDetail});prepMock();$("#gm").style.color="var(--ok)";$("#gm").textContent=withSA?`✅ 저장됐어요 · 총점 ${tot}점`:`✅ 객관식 ${mc}/20 으로 수정됐어요`;
   setTimeout(()=>{renderView(filtered());window.scrollTo(0,0)},800)}
  catch(e){b.disabled=false;b.textContent=bt;$("#gm").textContent="저장하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요."}};
 $("#gs").onclick=()=>send(true);$("#mcsave").onclick=()=>send(false);
 window.scrollTo(0,0)}
