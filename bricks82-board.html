<title>Bricks 80-2 Class Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&family=Nunito:wght@600;700;800&family=Nanum+Gothic:wght@700;800&display=swap">
<style>
/* Layout: one-screen interactive-whiteboard board. Top bar = unit + timer + team scores; step rail colored by lesson phase; one big stage; prev/next at the bottom. Single bright classroom look on purpose. */
:root{
  --bg:#FFF8EC; --ink:#1F2A44; --soft:#4A5568; --mute:#6B7280; --card:#FFFDF9; --line:#E7DCC8;
  --orange:#FF7A2F; --orange-ink:#B9480F; --peach:#FFE7D6; --blue:#2F6FD6; --sky:#E8F0FC;
  --green:#1E8A57; --mint:#DDF3E7; --bad:#C93A3A; --rose:#FBE1E1; --navy2:#2A3758;
  --t1:#FF7A2F; --t2:#2F6FD6; --t3:#1E8A57; --t4:#7B4FCC;
  --display:'Fredoka','Jua',Arial,sans-serif;
  --body:'Nunito','Nanum Gothic',Arial,sans-serif;
  --kr:'Jua','Nanum Gothic',Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1900px;margin:0 auto}
/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--orange-ink)}
.unitpick select{font-family:var(--display);font-weight:600;font-size:clamp(22px,2vw,32px);border:3px solid var(--ink);border-radius:14px;background:var(--card);padding:6px 12px;max-width:100%}
.timer{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:16px;padding:6px 8px 6px 16px}
.timer .td{font-family:var(--display);font-weight:600;font-size:clamp(28px,2.6vw,42px);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:center}
.timer button{border:none;border-radius:10px;padding:8px 12px;background:var(--navy2);color:var(--bg);font-weight:800;font-size:16px}
.timer button.go{background:var(--orange);color:var(--ink)}
.timer.done{animation:blink 1s steps(2) 4;background:var(--bad)}
@keyframes blink{50%{background:var(--orange)}}
.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 620px;min-width:0}
.team{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 6px 6px 12px;border-radius:14px;background:var(--card);border:3px solid var(--tc);min-width:0;overflow:hidden}
.team .ti{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.team .tn{font-weight:800;font-size:15px;color:var(--tc);white-space:nowrap}
.team .ts{font-family:var(--display);font-weight:700;font-size:clamp(28px,2.4vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.team .tb{display:flex;flex-direction:column;gap:4px;flex:none}
.team .tb button{width:44px;height:34px;border-radius:10px;border:2px solid var(--tc);background:var(--bg);color:var(--tc);font-weight:800;font-size:22px;line-height:1;padding:0}
.team .tb button.plus{background:var(--tc);color:#FFFDF9}
.t1{--tc:var(--t1)}.t2{--tc:var(--t2)}.t3{--tc:var(--t3)}.t4{--tc:var(--t4)}
.bump .ts{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.5)}}
/* step rail */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.step{flex:1;min-width:92px;border:none;border-radius:12px;padding:8px 6px;background:var(--card);border-bottom:5px solid var(--pc);display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.15}
.step .sn{font-family:var(--display);font-weight:700;font-size:20px;color:var(--pc2)}
.step .sk{font-family:var(--kr);font-size:15px;white-space:nowrap}
.step.on{background:var(--pc);color:var(--pt)}
.step.on .sn{color:var(--pt)}
.ph0{--pc:var(--orange);--pc2:var(--orange-ink);--pt:var(--ink)}
.ph1{--pc:var(--blue);--pc2:var(--blue);--pt:#FFFDF9}
.ph2{--pc:var(--green);--pc2:var(--green);--pt:#FFFDF9}
.ph3{--pc:var(--ink);--pc2:var(--ink);--pt:#FFFDF9}
/* stage */
main{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.shead{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.pill{font-weight:800;font-size:17px;letter-spacing:.04em;padding:6px 16px;border-radius:999px;background:var(--pc);color:var(--pt);white-space:nowrap}
.shead h2{font-family:var(--display);font-weight:600;font-size:clamp(32px,3.4vw,56px);line-height:1.05;margin:0}
.shead .sko{font-family:var(--kr);font-size:clamp(20px,1.7vw,28px);color:var(--soft)}
.tip{margin:0;font-size:clamp(16px,1.2vw,20px);color:var(--soft);background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:8px 14px}
.tip b{color:var(--orange-ink)}
.body{flex:1;min-height:0;display:flex;gap:16px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.grow{flex:1}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:clamp(16px,1.8vw,28px)}
.dark{background:var(--ink);color:var(--bg);border-radius:24px;padding:clamp(16px,1.8vw,28px)}
.btn{border:none;border-radius:14px;padding:12px 20px;background:var(--orange);color:var(--ink);font-family:var(--kr);font-size:clamp(18px,1.5vw,24px)}
.btn.blue{background:var(--blue);color:#FFFDF9}
.btn.ghost{background:transparent;border:3px solid currentColor}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.big{font-family:var(--display);font-weight:600}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',var(--display);line-height:1}
/* hello */
.chant{display:flex;flex-direction:column;gap:10px}
.chant p{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(26px,2.8vw,46px)}
.chant .who{display:inline-block;width:1.6em;font-weight:700}
.chant .T{color:var(--blue)}.chant .S{color:var(--orange-ink)}
.chant .act{font-family:var(--kr);font-size:.55em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:none;border-radius:999px;background:var(--peach);padding:10px 20px;font-family:var(--display);font-weight:600;font-size:clamp(20px,1.8vw,30px);display:flex;align-items:center;gap:8px}
/* riddle */
.rgrid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.rcard{position:relative;border-radius:22px;border:4px dashed var(--orange);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;min-height:130px}
.rcard .num{font-family:var(--display);font-weight:700;font-size:clamp(48px,5vw,92px);line-height:1;color:var(--orange)}
.rcard.done{border-style:solid;border-color:var(--line);background:var(--sky)}
.rcard.done .emo{font-size:clamp(40px,4vw,70px)}
.rcard.done .w{font-family:var(--display);font-weight:600;font-size:clamp(20px,1.9vw,32px);text-align:center}
.rcard .ok{position:absolute;top:8px;right:10px;font-weight:800;font-size:13px;color:var(--green);background:var(--mint);padding:3px 8px;border-radius:999px}
.rd{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.board{display:flex;flex-direction:column;gap:12px}
.bh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.bh .tag{font-weight:800;font-size:16px;padding:5px 14px;border-radius:999px;background:var(--orange);color:var(--ink)}
.worth{font-family:var(--kr);font-size:clamp(18px,1.5vw,26px);color:#FFD1B3}
.worth b{font-family:var(--display);font-size:1.4em;color:#FFB27A}
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;flex:1}
.clue{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:var(--navy2);animation:pop .35s ease}
.clue.locked{background:transparent;border:2px dashed #46557A;animation:none}
.clue .cn{font-weight:800;font-size:14px;letter-spacing:.08em;color:#FFB27A;white-space:nowrap}
.clue .ct{font-family:var(--display);font-weight:500;font-size:clamp(22px,2.2vw,38px);line-height:1.2;flex:1;min-width:0}
.clue.locked .ct{color:#8A96B4}
.say{border:2px solid #5A6A90;background:transparent;color:var(--bg);border-radius:10px;padding:6px 12px;font-weight:800;font-size:15px;white-space:nowrap}
@keyframes pop{from{transform:translateY(8px);opacity:.3}}
.dark .btn.ghost{color:var(--bg)}
.reveal{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:200px;text-align:center}
.reveal .mys{font-family:var(--display);font-size:clamp(90px,9vw,160px);color:var(--line);line-height:1}
.reveal .emo{font-size:clamp(80px,8vw,140px)}
.reveal .aw{font-family:var(--display);font-weight:700;font-size:clamp(40px,4.4vw,76px);line-height:1.05;margin:0}
.reveal .ak{font-family:var(--kr);font-size:clamp(20px,1.7vw,28px);color:var(--soft);margin:0}
.award{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.award button{border-radius:14px;border:3px solid var(--tc);background:var(--card);padding:10px;font-weight:800;font-size:19px;color:var(--tc)}
.award button[disabled]{opacity:.35;cursor:default}
.award .none{grid-column:span 2;border-color:var(--line);color:var(--soft);font-size:16px}
/* picture walk */
.cover{display:flex;flex-direction:column;gap:12px;justify-content:center}
.cover .un{font-weight:800;letter-spacing:.1em;color:#FFB27A;font-size:18px}
.cover h3{font-family:var(--display);font-weight:600;font-size:clamp(40px,4.6vw,80px);line-height:1.05;margin:0}
.scatter{display:flex;flex-wrap:wrap;gap:14px 22px;font-size:clamp(44px,4.4vw,76px)}
.frames{display:flex;flex-direction:column;gap:12px;justify-content:center}
.frame{border:none;text-align:left;border-radius:18px;padding:16px 22px;font-family:var(--display);font-weight:500;font-size:clamp(24px,2.4vw,40px);background:var(--peach)}
.frame.up{background:var(--sky)}
/* freeze */
.fwords{display:flex;flex-wrap:wrap;gap:14px}
.fw{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--blue);border-radius:20px;padding:12px 24px 12px 16px}
.fw .emo{font-size:clamp(40px,4vw,70px)}
.fw .w{font-family:var(--display);font-weight:600;font-size:clamp(32px,3.4vw,60px)}
.fw .cnt{font-family:var(--kr);font-size:20px;color:var(--orange-ink);margin-left:6px}
.script{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
.script.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;align-content:start}
.sline{display:flex;align-items:center;gap:12px;border:none;text-align:left;width:100%;border-radius:14px;padding:10px 14px;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-weight:500;font-size:clamp(22px,2.1vw,36px);line-height:1.2}
.sline .no{font-family:var(--body);font-weight:800;font-size:15px;color:var(--mute);min-width:1.6em}
.sline.cur{background:#FFF1C9;border-color:var(--orange)}
.sline .tm{margin-left:auto;font-family:var(--body);font-weight:800;font-size:14px;color:#FFFDF9;background:var(--tc);border-radius:999px;padding:4px 10px;white-space:nowrap}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--navy2)}
.dots i.on{background:var(--orange)}
.listen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.listen .emo{font-size:clamp(90px,9vw,160px)}
.listen p{margin:0;font-family:var(--kr);font-size:clamp(22px,2vw,32px)}
/* read */
.voice{font-family:var(--display);font-weight:700;font-size:clamp(40px,4vw,70px);color:var(--orange-ink)}
/* act */
.hot{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hot li{display:flex;align-items:center;gap:12px;background:var(--navy2);border-radius:16px;padding:14px 18px}
.hot .q{font-family:var(--display);font-weight:500;font-size:clamp(24px,2.3vw,40px);flex:1;min-width:0}
.cast{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.4vw,40px);line-height:1.3;margin:0}
/* builder */
.btop{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.turn{border-radius:999px;border:3px solid var(--tc);background:var(--tc);color:#FFFDF9;padding:6px 18px;font-family:var(--kr);font-size:clamp(20px,1.7vw,28px)}
.turn small{font-family:var(--body);font-weight:800;font-size:13px;opacity:.85;margin-left:6px}
.clock{margin-left:auto;font-family:var(--display);font-weight:600;font-size:clamp(28px,2.6vw,44px);font-variant-numeric:tabular-nums}
.lane{min-height:clamp(100px,10vw,150px);border-radius:24px;border:4px dashed var(--blue);background:var(--sky);display:flex;flex-wrap:wrap;align-content:center;gap:10px;padding:14px}
.lane .ph{font-family:var(--kr);font-size:clamp(20px,1.7vw,26px);color:var(--blue);margin:auto}
.lane.win{border-style:solid;border-color:var(--green);background:var(--mint);animation:win .6s ease}
@keyframes win{30%{transform:scale(1.02)}}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:4px;min-height:80px;align-content:flex-start}
.tile{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.8vw,50px);line-height:1;padding:.35em .55em;border-radius:16px;background:var(--card);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.lane .tile{box-shadow:none;border-color:var(--blue)}
.tile.ok{border-color:var(--green);background:var(--mint);color:var(--green)}
.tile.no{border-color:var(--bad);background:var(--rose);color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ko{font-family:var(--kr);font-size:clamp(20px,1.7vw,28px);color:var(--orange-ink);text-align:center;margin:0;min-height:1.3em}
.fb{font-family:var(--kr);font-size:clamp(22px,2vw,34px);text-align:center;margin:0;min-height:1.3em}
.fb.good{color:var(--green)}.fb.bad{color:var(--bad)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ctrl .btn.ghost{color:var(--ink)}
/* book */
.ox{display:flex;gap:16px;flex:1}
.ox div{flex:1;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px}
.ox .o{background:var(--blue);color:#FFFDF9}.ox .x{background:var(--ink);color:#FFB27A}
.ox b{font-family:var(--display);font-size:clamp(90px,10vw,180px);line-height:1}
.ox span{font-family:var(--kr);font-size:clamp(22px,2vw,34px);color:#FFFDF9}
.bign{font-family:var(--display);font-weight:600;font-size:clamp(60px,6vw,110px);line-height:1;color:var(--green)}
.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;font-size:clamp(20px,1.7vw,28px)}
/* chain */
.chain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ccard{position:relative;border:3px solid var(--ink);border-radius:20px;background:var(--card);padding:18px 20px 18px 74px;text-align:left;font-family:var(--display);font-weight:500;font-size:clamp(22px,2.1vw,36px);line-height:1.2;min-height:90px;box-shadow:0 5px 0 var(--ink)}
.ccard .badge{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:24px}
.ccard.sel .badge{border:none;background:var(--orange);color:var(--ink)}
.ccard.ok{border-color:var(--green);background:var(--mint);box-shadow:0 5px 0 var(--green)}
.ccard.no{border-color:var(--bad);background:var(--rose);box-shadow:0 5px 0 var(--bad)}
.ccard .lab{display:block;font-family:var(--body);font-weight:800;font-size:15px;letter-spacing:.08em;color:var(--orange-ink);margin-bottom:4px}
/* star */
.bars{display:flex;flex-direction:column;gap:12px;justify-content:center}
.barrow{display:flex;align-items:center;gap:12px}
.barrow .bn{width:7.5em;font-weight:800;font-size:clamp(18px,1.5vw,24px);color:var(--tc);white-space:nowrap}
.barrow .bt{flex:1;height:clamp(40px,4vw,64px);background:var(--sky);border-radius:14px;overflow:hidden}
.barrow .bf{height:100%;background:var(--tc);border-radius:14px;transition:width .6s ease;min-width:6px}
.barrow .bv{width:3.5em;font-family:var(--display);font-weight:700;font-size:clamp(28px,2.6vw,44px);text-align:right;font-variant-numeric:tabular-nums}
.crown{font-family:var(--kr);font-size:clamp(24px,2.2vw,36px);color:var(--orange-ink);margin:0}
.hw{background:var(--peach);border:3px dashed var(--orange);border-radius:20px;padding:16px 22px}
.hw b{display:block;font-size:15px;letter-spacing:.1em;color:var(--orange-ink)}
.hw p{margin:4px 0 0;font-family:var(--kr);font-size:clamp(22px,1.9vw,30px)}
/* exit */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.three .card{display:flex;flex-direction:column;gap:6px}
.three .n{font-family:var(--display);font-weight:700;font-size:clamp(70px,7vw,120px);line-height:1}
.three .l{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.4vw,40px)}
.three .d{font-family:var(--kr);font-size:clamp(18px,1.5vw,24px);color:var(--soft)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.bank span{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:600;font-size:clamp(18px,1.6vw,26px)}
/* footer */
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--mute);font-size:14px}
.navbtn{border:3px solid var(--ink);background:var(--card);border-radius:14px;padding:8px 22px;font-family:var(--kr);font-size:clamp(18px,1.5vw,24px)}
.navbtn.next{background:var(--ink);color:var(--bg)}
.foot .mid{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.foot .mid button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;color:var(--soft)}
.foot .mid button.arm{border-color:var(--bad);color:var(--bad)}
@media (max-width:1000px){
  .teams{grid-template-columns:repeat(2,minmax(0,1fr));flex-basis:100%}
  .rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rd,.body{grid-template-columns:minmax(0,1fr);flex-direction:column}
  .chain,.three,.script.two{grid-template-columns:minmax(0,1fr)}
  .ox{flex-direction:column}
  .clock{margin-left:0}
}
@media (max-width:560px){.rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.foot>span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="eyebrow">BRICKS READING 80 · LEVEL 2 · 전자칠판 수업</span>
      <label class="unitpick"><span class="sr">유닛 선택</span><select id="unitSel"></select></label>
    </div>

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function speak(text, onend, rate){
  try{
    if(!('speechSynthesis' in window)){ onend && onend(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g,' blank '));
    u.lang='en-US'; u.rate = rate || .85;
    if(onend){ u.onend = onend; u.onerror = onend; }
    speechSynthesis.speak(u);
  }catch(e){ onend && onend(); }
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }
function wordRe(w){
  const parts = w.toLowerCase().split(/\s+/);
  const f = parts[0];
  const alts = [reEsc(f)+'(?:s|es|ed|d|ing)?'];
  if(/y$/.test(f)) alts.push(reEsc(f.slice(0,-1))+'ies');
  if(/f$/.test(f)) alts.push(reEsc(f.slice(0,-1))+'ves');
  if(/e$/.test(f)) alts.push(reEsc(f.slice(0,-1))+'ing');
  const rest = parts.slice(1).map(p=>'\\s+'+reEsc(p)+'(?:s|es)?').join('');
  return new RegExp('(^|[^A-Za-z])((?:'+alts.join('|')+')'+rest+')(?![A-Za-z])','i');
}
function blank(sentence, w){
  const re = wordRe(w);
  return re.test(sentence) ? sentence.replace(re, (m,a)=>a+'___') : null;
}
function cluesFor(u, wd){
  const c = [wd.def];
  const ex = wd.ex && blank(wd.ex, wd.w);
  if(ex) c.push(ex);
  for(const s of u.script){ const b = blank(s, wd.w); if(b && b!==ex){ c.push(b); break; } }
  if(c.length < 3) c.push(`It starts with “${wd.w[0]}”. It has ${wd.w.replace(/[\s-]/g,'').length} letters.`);
  return c.slice(0,3);
}
function countIn(script, f){
  const re = new RegExp('(^|[^A-Za-z])'+reEsc(f)+'(?:s|es)?(?![A-Za-z])','gi');
  let n=0; script.forEach(s=>{ const m = s.match(re); if(m) n+=m.length; }); return n;
}
function picFor(u, f){
  const fl = f.toLowerCase();
  const hit = u.words.find(w => { const b=w.w.toLowerCase(); return fl===b || fl.startsWith(b.replace(/y$/,'')) || b.startsWith(fl); });
  return hit ? hit.pic : '❄️';
}

/* ---------- timer ---------- */
const T = { left:0, total:0, run:false, id:null };
function setTimer(min){ clearInterval(T.id); T.run=false; T.total=T.left=Math.round(min*60); drawTimer(); }
function drawTimer(){
  const m=Math.floor(T.left/60), s=T.left%60;
  $('tDisp').textContent = m+':'+String(s).padStart(2,'0');
  $('tGo').textContent = T.run ? '멈춤' : (T.left===0 ? '시작' : (T.left<T.total?'계속':'시작'));
}
function beep(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [0,.25,.5].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.2); o.start(a.currentTime+t); o.stop(a.currentTime+t+.2); }); }catch(e){} }
function toggleTimer(){
  if(T.run){ T.run=false; clearInterval(T.id); drawTimer(); return; }
  if(T.left<=0) T.left=T.total;
  T.run=true; $('timer').classList.remove('done');
  T.id=setInterval(()=>{ T.left--; if(T.left<=0){ T.left=0; T.run=false; clearInterval(T.id); $('timer').classList.add('done'); beep(); } drawTimer(); },1000);
  drawTimer();
}

  return `<div class="body">
    <div class="card col grow bars">${TEAMS.map((n,i)=>`<div class="barrow t${i+1}"><span class="bn">${n}${scores[i]===top&&top>0?' <span class="emo">👑</span>':''}</span><span class="bt"><span class="bf" style="display:block;width:${scores[i]/max*100}%"></span></span><span class="bv">${scores[i]}</span></div>`).join('')}
      <p class="crown">${win.length?`${win.join(', ')} 우승! 다 같이 “We did it!”`:'점수판에 점수를 넣어 주세요'}</p></div>
    <div class="col" style="width:min(520px,100%)">
      <div class="dark" style="display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center"><span class="emo" style="font-size:90px">⭐</span><p class="cast" style="color:#FFB27A">Today’s Star</p><p style="margin:0;font-family:var(--kr);font-size:22px;color:#C9D1E0">크게 읽은 친구 · 용감하게 나온 친구 · 친구를 도와준 친구</p></div>
      <div class="hw"><b>HOMEWORK</b><p>Unit ${u.n} 본문 3번 소리 내 읽기 · 단어 ${u.words.length}개 2번씩 쓰기</p></div>
    </div></div>`;
};

V.exit = u => `<div class="col grow">
  <div class="three">
    <div class="card"><span class="n" style="color:var(--orange)">3</span><span class="l">words</span><span class="d">오늘 배운 단어 3개</span></div>
    <div class="card"><span class="n" style="color:var(--blue)">2</span><span class="l">sentences</span><span class="d">기억나는 문장 2개 (책 보고 OK)</span></div>
    <div class="dark" style="display:flex;flex-direction:column;gap:6px"><span class="n" style="color:#FFB27A;font-family:var(--display);font-weight:700;font-size:clamp(70px,7vw,120px);line-height:1">1</span><span class="l" style="font-family:var(--display);font-weight:600;font-size:clamp(26px,2.4vw,40px)">feeling</span><span class="d" style="font-family:var(--kr);color:#C9D1E0;font-size:clamp(18px,1.5vw,24px)">I liked ___. / 궁금한 점</span></div>
  </div>
  <p class="tip">오늘의 단어 — 철자가 기억 안 나면 여기를 보고 써요</p>
  <div class="bank">${u.words.map(w=>`<span><span class="emo">${w.pic}</span>${esc(w.w)}</span>`).join('')}</div></div>`;

function render(){
  const u = UNITS[U], s = STEPS[S];
  $('stage').innerHTML = head(s) + V[s.id](u);
  renderSteps();
  $('prev').disabled = S===0; $('next').disabled = S===STEPS.length-1;
  $('next').textContent = S===STEPS.length-1 ? '끝!' : '다음 →';
}
function goStep(i){ stopSpeak(); F.playing=false; S=Math.min(Math.max(i,0),STEPS.length-1); store('b82s',S); setTimer(STEPS[S].min); render(); }

/* ---------- builder ---------- */
function setupSentence(){
  clearInterval(B.tick); B.tick=null;
  if(!B.list.length) return;
  const toks = B.list[B.i].split(' ').map((t,k)=>({t,id:k}));
  let sh = shuffle(toks), g=0; while(toks.length>1 && sh.every((x,k)=>x.t===toks[k].t) && g++<20) sh=shuffle(toks);
  Object.assign(B,{pool:sh,placed:[],marks:null,t0:null,elapsed:0,solved:false,fb:'',fbc:''});
}
function startClock(){ if(B.t0||B.solved) return; B.t0=performance.now(); B.tick=setInterval(()=>{ B.elapsed=(performance.now()-B.t0)/1000; const c=$('clock'); if(c) c.textContent=B.elapsed.toFixed(1)+'s'; },100); }
function checkSentence(){
  const ans = B.list[B.i].split(' ');
  if(B.placed.length<ans.length){ B.fb='단어를 모두 놓아 주세요'; B.fbc='bad'; return; }
  B.marks = B.placed.map((x,k)=>x.t===ans[k]);
  if(B.marks.every(Boolean)){
    B.solved=true; clearInterval(B.tick); B.tick=null;
    const p = B.elapsed<20?3:B.elapsed<40?2:1; addScore(B.team,p);
    B.fb=`정답! ${TEAMS[B.team]} +${p}점 (${B.elapsed.toFixed(1)}초)`; B.fbc='good'; speak(B.list[B.i]);
  } else { B.fb='빨간 단어를 눌러 빼고 다시 놓아 보세요'; B.fbc='bad'; }
}
/* ---------- chain ---------- */
function setupChain(){
  const u=UNITS[U]; const ks=(u.key||[]).filter(i=>u.script[i]).slice(0,4);
  let cards = ks.map((i,r)=>({s:u.script[i],rank:r})), sh=shuffle(cards), g=0;
  while(sh.length>1 && sh.every((c,k)=>c.rank===k) && g++<20) sh=shuffle(cards);
  C = {cards:sh, order:[], checked:false, fb:'', fbc:''};
}
/* ---------- freeze playback ---------- */
function playFrom(i){
  const u=UNITS[U];
  if(!F.playing || i>=u.script.length){ F.playing=false; render(); return; }
  F.idx=i; render();
  speak(u.script[i], ()=>{ if(F.playing) setTimeout(()=>playFrom(i+1), 450); }, .8);
}

/* ---------- events ---------- */
let armed=false, armT=null;
$('unitSel').addEventListener('change', e=>{ stopSpeak(); U=+e.target.value; store('b82u',U); resetUnitState(); render(); });
$('tGo').addEventListener('click', toggleTimer);
$('tReset').addEventListener('click', ()=>{ $('timer').classList.remove('done'); setTimer(STEPS[S].min); });
$('prev').addEventListener('click', ()=>goStep(S-1));
$('next').addEventListener('click', ()=>goStep(S+1));
$('resetScores').addEventListener('click', e=>{
  const b=e.currentTarget;
  if(!armed){ armed=true; b.classList.add('arm'); b.textContent='한 번 더 누르면 0점'; clearTimeout(armT); armT=setTimeout(()=>{armed=false;b.classList.remove('arm');b.textContent='점수 초기화';},3000); return; }
  armed=false; b.classList.remove('arm'); b.textContent='점수 초기화'; scores=[0,0,0,0]; store('b82scores',scores); renderTeams(); if(STEPS[S].id==='star') render();
});
document.addEventListener('keydown', e=>{
  if(e.target.closest('select')) return;
  if(e.key==='ArrowRight') goStep(S+1); else if(e.key==='ArrowLeft') goStep(S-1);
});
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.step!=null){ goStep(+b.dataset.step); return; }
  const a=b.dataset.act; if(!a) return;
  const u=UNITS[U];
  switch(a){
    case 'score': addScore(+b.dataset.t, +b.dataset.d); break;
    case 'sayText': speak(b.dataset.text); break;
    case 'goStep': goStep(+b.dataset.s); break;
    case 'open': { const i=+b.dataset.i; R.cur=i; R.shown=R.done.has(i)?3:1; R.revealed=R.awarded=R.done.has(i); render(); if(!R.done.has(i)) speak(cluesFor(u,u.words[i])[0]); break; }
    case 'nextClue': R.shown++; render(); speak(cluesFor(u,u.words[R.cur])[R.shown-1]); break;
    case 'sayClue': speak(cluesFor(u,u.words[R.cur])[+b.dataset.c]); break;
    case 'reveal': R.revealed=true; render(); speak(u.words[R.cur].w); break;
    case 'back': R.cur=null; render(); break;
    case 'award': if(!R.awarded){ addScore(+b.dataset.t, Math.max(1,4-R.shown)); R.awarded=R.revealed=true; R.done.add(R.cur); render(); speak(u.words[R.cur].w); } break;
    case 'nobody': R.awarded=R.revealed=true; R.done.add(R.cur); render(); speak(u.words[R.cur].w); break;
    case 'round': F.round=+b.dataset.r; F.idx=-1; F.playing=false; stopSpeak(); render(); break;
    case 'playScript': F.playing=true; playFrom(F.idx>=0&&F.idx<u.script.length-1?F.idx+1:0); break;
    case 'stopScript': F.playing=false; stopSpeak(); render(); break;
    case 'count': F.showCount=!F.showCount; render(); break;
    case 'sayLine': F.idx=+b.dataset.i; render(); speak(u.script[F.idx]); break;
    case 'readLine': RD.cur=+b.dataset.i; render(); speak(u.script[RD.cur], null, .75); break;
    case 'voice': { let v; do{ v=VOICES[Math.floor(Math.random()*VOICES.length)]; }while(v===RD.voice); RD.voice=v; render(); break; }
    case 'relay': RD.relay=!RD.relay; render(); break;
    case 'sayHot': speak(u.hot[+b.dataset.i]); break;
    case 'place': if(B.solved) break; startClock(); B.placed.push(B.pool.splice(+b.dataset.k,1)[0]); B.marks=null; B.fb=''; render(); break;
    case 'unplace': if(B.solved) break; B.pool.push(B.placed.splice(+b.dataset.k,1)[0]); B.marks=null; B.fb=''; render(); break;
    case 'check': if(!B.solved){ checkSentence(); render(); } break;
    case 'hintFirst': B.fb='첫 단어: '+B.list[B.i].split(' ')[0]; B.fbc=''; render(); break;
    case 'listenS': speak(B.list[B.i]); break;
    case 'reshuffle': setupSentence(); render(); break;
    case 'turn': B.team=(B.team+1)%4; render(); break;
    case 'nextS': B.i=(B.i+1)%B.list.length; B.team=(B.team+1)%4; setupSentence(); render(); break;
    case 't7': setTimer(7); toggleTimer(); break;
    case 't3': setTimer(3); toggleTimer(); break;
    case 'pick': { if(C.checked) break; const k=+b.dataset.k, p=C.order.indexOf(k); if(p>-1) C.order.splice(p,1); else if(C.order.length<C.cards.length) C.order.push(k); C.fb=''; render(); break; }
    case 'checkChain': {
      if(C.order.length<C.cards.length){ C.fb='카드 4장을 모두 눌러 주세요'; C.fbc='bad'; render(); break; }
      C.checked=true; const ok=C.order.every((k,i)=>C.cards[k].rank===i);
      C.fb= ok?'정답! 이야기 순서가 딱 맞아요':'빨간 카드는 순서가 달라요 — 정답 순서를 확인해요'; C.fbc= ok?'good':'bad';
      render(); break; }
    case 'sayChain': { const seq=C.cards.slice().sort((x,y)=>x.rank-y.rank); let i=0; const nx=()=>{ if(i<seq.length) speak(seq[i++].s, ()=>setTimeout(nx,350)); }; nx(); break; }
    case 'reChain': setupChain(); render(); break;
  }
});

renderUnits(); renderTeams(); resetUnitState(); setTimer(STEPS[S].min); render();
</script>
