  .word-list { display: flex; flex-direction: column; gap: 8px; }
  .word-item {

    align-items: center;

    border: none;
    border-radius: 8px;
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #2563EB;
    flex-shrink: 0;
  }

    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-bottom: 14px;
    font-size: 14px;

    text-align: center;
    font-size: 12.5px;
    margin-top: 14px;
    color: #8A8A93;
    min-height: 16px;
    padding: 0 10px;

  .footer {

    margin-top: 20px;
    color: #8A8A93;
    font-size: 11px;
  }

</div>

};

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcSlSX8vsLlUu7q9u4MivsXRljUyPdAnq8Jsab-2UVnF34BAlSnBnpC8yBuwGpHtx3/exec";

function getParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

let currentLevel = parseInt(getParam('level')) || 1;
if (!LEVELS[currentLevel]) currentLevel = 1;

let studiedItems = new Set();
let lastMethod = "개별클릭";

const levelSelect = document.getElementById('levelSelect');
Object.keys(LEVELS).forEach(k => {
  const opt = document.createElement('option');
  opt.value = k;
  opt.textContent = `LEVEL ${k} · ${LEVELS[k].name}`;
  if (parseInt(k) === currentLevel) opt.selected = true;
  levelSelect.appendChild(opt);
});

function speak(text, onEnd) {
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    if (onEnd) utter.onend = onEnd;
    window.speechSynthesis.speak(utter);
  }, 60);
}

function getName() {
  return document.getElementById('nameInput').value.trim();
}

let saveTimer = null;
function scheduleAutoSave() {
  const statusEl = document.getElementById('saveStatus');
  if (!getName()) {
    statusEl.textContent = '⚠️ 이름을 입력하면 학습 기록이 자동으로 저장돼요';
    statusEl.style.color = '#DC2626';
    return;
  }
  statusEl.textContent = '저장 중...';
  statusEl.style.color = '#8A8A93';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => autoSave('progress'), 900);
}

function autoSave(reason) {
  const statusEl = document.getElementById('saveStatus');
  const name = getName();

  if (studiedItems.size === 0) return;

  if (!name) {
    statusEl.textContent = '⚠️ 이름을 입력해야 학습 기록이 저장돼요';
    statusEl.style.color = '#DC2626';
    return;
  }

  const level = LEVELS[currentLevel];
  const payload = {
    name: name,
    level: currentLevel,
    studied: studiedItems.size,
    total: level.items.length,
    completed: studiedItems.size >= level.items.length,
    method: lastMethod,
    timestamp: new Date().toISOString()
  };

  if (reason === 'unload' && navigator.sendBeacon) {
    const blob = new Blob([JSON.stringify(payload)], { type: 'text/plain' });
    navigator.sendBeacon(APPS_SCRIPT_URL, blob);
    return;
  }

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).then(() => {
    statusEl.textContent = `✅ ${name}님 LEVEL ${currentLevel} 자동저장됨 (${studiedItems.size}/${level.items.length}표현)`;
    statusEl.style.color = '#16A34A';
  }).catch(() => {
    statusEl.textContent = '⚠️ 저장에 실패했어요. 인터넷 연결을 확인해주세요';
    statusEl.style.color = '#DC2626';
  });
}

function render() {
  const level = LEVELS[currentLevel];
  document.getElementById('levelPill').textContent = `LEVEL ${currentLevel} · ${level.name}`;
  document.getElementById('levelPill').style.setProperty('--accent', level.color);
  document.documentElement.style.setProperty('--accent', level.color);

  studiedItems = new Set();
  document.getElementById('saveStatus').textContent = '표현을 누르면 학습 기록이 자동으로 저장돼요';
  document.getElementById('saveStatus').style.color = '#8A8A93';

  const list = document.getElementById('wordList');
  list.innerHTML = '';
  level.items.forEach((it, i) => {
    const item = document.createElement('div');
    item.className = 'word-item';
    item.id = 'word-' + i;
    item.innerHTML = `
      <div class="word-main">
        <div><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="word-text">${it.p}</span></div>
        <div class="word-meaning">${it.m}</div>
      </div>
      <button class="play-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12c0-1.77-.77-3.29-2-4.24v8.48c1.23-.95 2-2.47 2-4.24z" opacity="0.9"/><path d="M14.5 4.5v2.09c2.89 1.04 5 3.77 5 7.01s-2.11 5.97-5 7.01v2.09c4-1.09 7-4.75 7-9.1s-3-8.01-7-9.1z" opacity="0.75"/></svg></button>
    `;
    item.onclick = () => {
      document.querySelectorAll('.word-item').forEach(e => e.classList.remove('active'));
      item.classList.add('active');
      studiedItems.add(i);
      lastMethod = "개별클릭";
      speak(it.p);
      scheduleAutoSave();
    };
    list.appendChild(item);
  });
}

levelSelect.onchange = (e) => {
  autoSave('level-change');
  currentLevel = parseInt(e.target.value);
  render();
};

document.getElementById('playAllBtn').onclick = () => {
  const level = LEVELS[currentLevel];
  let i = 0;
  lastMethod = "전체듣기";
  document.querySelectorAll('.word-item').forEach(el => el.classList.remove('active'));
  function next() {
    if (i >= level.items.length) {
      autoSave('complete');
      return;
    }
    const el = document.getElementById('word-' + i);
    document.querySelectorAll('.word-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    el.scrollIntoView({behavior:'smooth', block:'center'});
    studiedItems.add(i);
    speak(level.items[i].p, () => { i++; setTimeout(next, 200); });
  }
  next();
};

window.addEventListener('beforeunload', () => autoSave('unload'));

render();
</script>
