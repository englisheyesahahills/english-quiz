<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader's Bank Level 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one 1600×900 classroom-board stage scaled to fit; a control rail below it. Ink-on-paper reading lab, S/V/O/C colors carry grammar meaning. */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132E2A; --muted:#5A6F6A; --line:#CFDCD7; --soft:#E2EAE7;
  --accent:#E39B2E; --accent-ink:#6E4300; --accent-soft:#FBEBD2;
  --s:#2563C9; --v:#D23C33; --o:#17905F; --c:#8646C9;
  --tA:#E4572E; --tB:#2E86AB; --tC:#3E9D4F; --tD:#9B5DE5;
  --good:#17905F; --bad:#D23C33;
  --rail:#132E2A; --rail-fg:#EEF3F1;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-read:"Atkinson Hyperlegible", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-ko:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1917; --card:#16241F; --ink:#E4EEEA; --muted:#93A9A2; --line:#284540; --soft:#1C2E29;
  --accent:#F0B356; --accent-ink:#FFD99A; --accent-soft:#3A2C14;
  --s:#6EA2FF; --v:#FF7A70; --o:#4FD39C; --c:#C08CFF;
  --good:#4FD39C; --bad:#FF7A70; --rail:#08110F; --rail-fg:#E4EEEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1917; --card:#16241F; --ink:#E4EEEA; --muted:#93A9A2; --line:#284540; --soft:#1C2E29;
  --accent:#F0B356; --accent-ink:#FFD99A; --accent-soft:#3A2C14;
  --s:#6EA2FF; --v:#FF7A70; --o:#4FD39C; --c:#C08CFF;
  --good:#4FD39C; --bad:#FF7A70; --rail:#08110F; --rail-fg:#E4EEEA; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ko);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#viewport{flex:1;position:relative;min-height:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:var(--card);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slide{position:absolute;inset:0;padding:56px 72px 60px;display:flex;flex-direction:column;gap:22px}

/* rail */
#rail{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap;justify-content:center}
.rb{background:var(--rail);color:var(--rail-fg);border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.rb.on{background:var(--accent);color:#1d1300}
#unitSel{appearance:none;-webkit-appearance:none;padding-right:14px;font-weight:700}
#counter{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:64px;text-align:center}

/* header in slide */
.top{display:flex;align-items:center;gap:16px;min-height:44px;padding-right:420px}
.sec{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.min{font-size:16px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:5px 14px;font-variant-numeric:tabular-nums}
.comeup{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.1em;color:#fff;background:var(--v);padding:6px 14px;border-radius:6px;transform:rotate(-2deg)}
.team-tag{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.1em;color:#fff;background:var(--s);padding:6px 14px;border-radius:6px;transform:rotate(1.5deg)}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:54px;font-weight:800;line-height:1.05}
h2 small{display:block;font-family:var(--f-ko);font-size:24px;font-weight:500;color:var(--muted);margin-top:8px;letter-spacing:0}
.body{flex:1;min-height:0;display:flex;gap:36px}

/* scoreboard (inside stage, top-right) */
#score{position:absolute;top:18px;right:20px;display:flex;gap:8px;z-index:20}
.tm{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 6px 5px 12px}
.tm b{font-family:var(--f-display);font-size:16px}
.tm .pt{font-family:var(--f-display);font-weight:800;font-size:28px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.tm button{width:30px;height:30px;border-radius:7px;border:0;background:var(--soft);font-size:18px;font-weight:700;line-height:1}
.tm .dot{width:12px;height:12px;border-radius:50%}
.tm.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.12)}}

/* overlays inside stage */
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--paper) 88%,transparent);z-index:40;display:flex;align-items:center;justify-content:center}
.ov-card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:40px 56px;display:flex;flex-direction:column;align-items:center;gap:22px;min-width:640px}
.ov-x{position:absolute;top:22px;right:26px;border:0;background:var(--soft);border-radius:10px;padding:10px 16px;font-size:18px}
#tDigits{font-family:var(--f-display);font-weight:800;font-size:220px;line-height:1;font-variant-numeric:tabular-nums}
#tDigits.urgent{color:var(--v)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 18px;font-size:20px;font-weight:700}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.big-btn{border:0;background:var(--accent);color:#1d1300;border-radius:12px;padding:14px 28px;font-size:22px;font-weight:700}
.ghost{border:2px solid var(--line);background:transparent;border-radius:12px;padding:12px 24px;font-size:20px;font-weight:700}
#pickOut{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1}

/* notes drawer */
#notes{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--card);padding:22px 72px 26px;font-size:21px;line-height:1.6;max-height:330px;overflow:auto}
#notes h4{margin:0 0 6px;font-size:15px;letter-spacing:.12em;color:var(--accent);font-family:var(--f-display)}
#notes p{margin:0 0 6px}

/* title slide */
.title-slide{justify-content:space-between}
.ttl-book{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ttl-main{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.03em}
.ttl-main span{color:var(--accent)}
.ttl-units{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ttl-units b{font-size:20px;margin-right:6px}
.ttl-list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ttl-item{border-top:4px solid var(--ink);padding-top:14px}
.ttl-item .n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent-ink)}
.ttl-item .k{font-size:30px;font-weight:700;margin-top:4px}
.ttl-item .e{font-family:var(--f-read);font-size:20px;color:var(--muted)}
.credit{font-size:17px;color:var(--muted)}

/* plan */
.timeline{display:flex;gap:6px;align-items:stretch;height:150px}
.tl{border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background:var(--soft);min-width:0}
.tl .m{font-family:var(--f-display);font-weight:800;font-size:28px}
.tl .l{font-size:17px;font-weight:700;line-height:1.3}
.tl.game{background:var(--accent-soft)}
.teamset{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;font-size:22px;line-height:1.5}
.rules div{border-left:5px solid var(--accent);padding-left:16px}
.rules b{display:block;font-size:24px}

/* riddle */
.clues{display:flex;flex-direction:column;gap:14px;flex:1}
.clue{font-family:var(--f-read);font-size:44px;font-weight:700;padding:16px 26px;border-radius:12px;background:var(--soft);display:flex;gap:20px;align-items:center}
.clue .pts{font-family:var(--f-display);font-size:20px;background:var(--ink);color:var(--card);border-radius:99px;padding:4px 14px;white-space:nowrap}
.clue.hide{color:transparent;background:repeating-linear-gradient(-45deg,var(--soft),var(--soft) 14px,var(--paper) 14px,var(--paper) 28px)}
.clue.hide .pts{opacity:.5}
.answer{font-family:var(--f-display);font-weight:800;font-size:72px;color:var(--o)}

/* vocab */
.tabs{display:flex;gap:10px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 20px;font-size:20px;font-weight:700}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;flex:1;align-content:start;overflow:auto}
.vc{height:86px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.vc .en{font-family:var(--f-read);font-weight:700;font-size:26px;line-height:1.1}
.vc .ko{font-size:18px;font-weight:500;color:var(--muted);line-height:1.25}
.vc.flip{background:var(--accent-soft);border-color:var(--accent)}
.vc.flip .ko{color:var(--accent-ink);font-weight:700}

.speed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.speed .q{font-size:88px;font-weight:700;text-align:center;line-height:1.15}
.speed .a{font-family:var(--f-read);font-weight:700;font-size:110px;color:var(--o);min-height:130px}
.speed .from{font-size:20px;color:var(--muted)}

/* passage */
.pwrap{display:grid;grid-template-columns:1fr 420px;gap:34px;flex:1;min-height:0}
.ptext{overflow:auto;padding-right:10px;font-family:var(--f-read);line-height:2.15}
.ptext .ln{display:block;color:var(--muted);font-weight:700}
.sn{border-radius:8px;padding:2px 4px;cursor:pointer;transition:background .15s}
.sn:hover{background:var(--soft)}
.sn.sel{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.ko-line{display:block;font-family:var(--f-ko);font-size:.62em;line-height:1.5;color:var(--accent-ink);margin:-4px 0 10px 4px}
.sl{display:none;font-style:normal;color:var(--accent);font-weight:700;padding:0 .15em}
.mode-chunk .sl,.mode-sv .sl{display:inline}
.mode-sv [class^="t-"]{position:relative;font-weight:700;border-bottom:3px solid currentColor}
.mode-sv .t-s{color:var(--s)} .mode-sv .t-v{color:var(--v)} .mode-sv .t-o{color:var(--o)} .mode-sv .t-c{color:var(--c)}
.mode-sv [class^="t-"]::after{content:attr(data-l);position:absolute;left:0;top:-1.05em;font-family:var(--f-display);font-size:.42em;font-weight:800;line-height:1;letter-spacing:.04em}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:6px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:8px;padding:12px 4px;font-size:19px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:17px;font-weight:700}
.tools button.on{border-color:var(--accent);background:var(--accent-soft)}
.tip{flex:1;border-radius:14px;background:var(--soft);padding:20px 22px;font-size:22px;line-height:1.55;overflow:auto}
.tip h5{margin:0 0 8px;font-size:15px;letter-spacing:.12em;color:var(--muted);font-family:var(--f-display)}
.tip .en{font-family:var(--f-read);font-weight:700;font-size:23px;margin-bottom:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:16px;font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.task{border:2px dashed var(--accent);border-radius:12px;padding:12px 16px;font-size:19px;line-height:1.45}
.task b{color:var(--accent-ink)}

/* grammar */
.gwrap{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;flex:1;min-height:0}
.formula{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.25;padding:22px 28px;border-radius:14px;background:var(--ink);color:var(--card)}
.formula em{font-style:normal;color:var(--accent)}
.gcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.ex{font-family:var(--f-read);font-size:29px;line-height:1.45;padding:8px 0;border-bottom:1px solid var(--line)}
.ex .k{display:block;font-family:var(--f-ko);font-size:19px;color:var(--muted)}
.ex mark{background:none;color:var(--v);font-weight:700;border-bottom:3px solid var(--v)}
.gnote{font-size:21px;line-height:1.55;background:var(--soft);border-radius:12px;padding:16px 20px}
.fix{border:2px solid var(--line);border-radius:14px;padding:14px 20px;cursor:pointer;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:6px;width:100%}
.fix .w{font-family:var(--f-read);font-size:29px;font-weight:700;text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.fix .r{font-family:var(--f-read);font-size:29px;font-weight:700;color:var(--good);display:none}
.fix .why{font-size:18px;color:var(--muted);display:none}
.fix.show .r,.fix.show .why{display:block}
.fix.show .w{opacity:.45}
.fix .hint{font-size:16px;color:var(--muted)}

/* hunter */
.hunt{flex:1;display:flex;flex-direction:column;gap:26px;justify-content:center}
.hs{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--f-read);font-size:52px;font-weight:700}
.tok{border:3px solid transparent;background:var(--soft);border-radius:12px;padding:6px 16px}
.tok.pick{border-color:var(--accent);background:var(--accent-soft)}
.tok.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card));color:var(--good)}
.tok.miss{border-color:var(--good);border-style:dashed}
.tok.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.hctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verdict{font-size:26px;font-weight:700}

/* flip cards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1}
.fc{border-radius:16px;border:3px solid var(--ink);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;padding:12px;text-align:center}
.fc .no{position:absolute;top:10px;left:14px;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted)}
.fc .p{font-family:var(--f-read);font-weight:700;font-size:52px;line-height:1.15}
.fc .pa{font-family:var(--f-read);font-weight:700;font-size:52px;color:var(--v);display:none;line-height:1.15}
.fc .kind{font-size:17px;color:var(--muted);display:none}
.fgrid.small .p{font-size:32px}
.fgrid.small .pa{font-size:40px}
.fc.open{background:var(--accent-soft);border-color:var(--accent)}
.fc.open .p{font-size:26px;color:var(--muted)}
.fc.open .pa,.fc.open .kind{display:block}

/* role play */
.roles{display:flex;gap:14px}
.role{border-radius:12px;padding:10px 18px;font-size:22px;font-weight:700;color:#fff}
.script{flex:1;display:flex;flex-direction:column;gap:12px;font-family:var(--f-read);font-size:36px;line-height:1.35;overflow:auto}
.script div{padding:6px 18px;border-left:8px solid;border-radius:4px;background:var(--soft)}
.script small{font-family:var(--f-ko);font-size:18px;font-weight:700;display:inline-block;min-width:150px;margin-right:12px;color:var(--muted)}

/* ox */
.oxw{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px}
.oxq{font-family:var(--f-read);font-size:60px;font-weight:700;line-height:1.25}
.oxa{display:flex;align-items:center;gap:26px;min-height:150px}
.oxa .mk{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1}
.oxa .why{font-size:26px;color:var(--muted);line-height:1.45}

/* scramble */
.scr{flex:1;display:flex;flex-direction:column;gap:24px;justify-content:center}
.slot{min-height:110px;border:3px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-read);font-size:42px;font-weight:700}
.slot.ok{border-color:var(--good);border-style:solid;background:color-mix(in srgb,var(--good) 12%,var(--card))}
.slot.bad{border-color:var(--bad);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--f-read);font-size:42px;font-weight:700}
.pool .tok[disabled]{opacity:.2}
.scr .ko{font-size:28px;font-weight:500;color:var(--muted)}

/* battle */
.bwrap{flex:1;display:grid;grid-template-columns:240px 1fr;gap:30px;min-height:0}
.qnav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.qnav button{height:64px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:800;font-size:26px}
.qnav button.done{background:var(--soft);color:var(--muted)}
.qnav button.cur{background:var(--ink);color:var(--card);border-color:var(--ink)}
.qbox{display:flex;flex-direction:column;gap:24px;justify-content:center;min-width:0}
.qtype{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.1em;color:var(--accent-ink)}
.qtext{font-size:50px;font-weight:700;line-height:1.3}
.qtext .en{font-family:var(--f-read)}
.qans{font-family:var(--f-read);font-size:50px;font-weight:700;color:var(--good);min-height:70px}
.qans small{display:block;font-family:var(--f-ko);font-size:22px;color:var(--muted);font-weight:500}
.award{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:20px;font-weight:700}
.award button{border:0;color:#fff;border-radius:10px;padding:10px 18px;font-size:20px;font-weight:700}

/* exit */
.exits{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.exit{border-radius:16px;border:3px solid var(--ink);padding:26px;display:flex;flex-direction:column;gap:14px}
.exit .g{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent-ink);letter-spacing:.06em}
.exit .f{font-family:var(--f-read);font-weight:700;font-size:42px;line-height:1.2}
.exit .k{font-size:21px;color:var(--muted);line-height:1.5}
.podium{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.pod .bar{width:120px;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-family:var(--f-display);font-size:30px;padding-top:6px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<div id="app">
  <div id="viewport"><div id="stage"></div></div>
  <div id="rail">
    <select class="rb" id="unitSel" aria-label="유닛 선택"></select>
    <button class="rb" id="bPrev" aria-label="이전 슬라이드">◀ 이전</button>
    <span id="counter">1 / 17</span>
    <button class="rb" id="bNext" aria-label="다음 슬라이드">다음 ▶</button>
    <button class="rb" id="bScore">점수판</button>

    {en:"Truly, / <s>it</s> <v>is</v> <c>a plant chameleon</c>!", ko:"정말로 그것은 식물 카멜레온이다!", tip:"Truly = 정말로. 색을 바꾸는 카멜레온에 비유."}

  {no:"05", ko:"용돈을 올려 받은 비결", en:"How Laura Got More Allowance",
   task:"<b>Find</b> Laura가 부모님의 마음을 바꾸기 위해 한 일 2가지",
   note:["문제(용돈 부족) → 시도(부탁) → 실패 → 아이디어(집안일) → 성공의 흐름으로 정리하세요.","ask A for B / come up with / to change (목적) / decide to / be glad to를 짚어 주세요."],
   lines:[
    {en:"<s>Laura</s> <v>got</v> <o>ten dollars</o> / a week / from her parents.", ko:"Laura는 그녀의 부모님으로부터 일주일마다 10달러를 받았다.", tip:"get-got = 받다. a week = 일주일마다."},
    {en:"But / <s>she</s> <v>needed</v> <o>more money</o>.", ko:"하지만 그녀는 더 많은 돈이 필요했다.", tip:"more money = 더 많은 돈 (much의 비교급 more)."},
    {en:"<s>She</s> <v>wanted</v> <o>to buy her favorite things</o>.", ko:"그녀는 자신이 좋아하는 물건들을 사기를 원했다.", tip:"want to + 동사원형 = ~하기를 원하다."},
    {en:"<s>Laura</s> <v>asked</v> <o>her parents</o> / for a bigger allowance.", ko:"Laura는 그녀의 부모님께 더 많은 용돈을 부탁했다.", tip:"ask A for B = A에게 B를 부탁하다. bigger = big의 비교급 (g를 한 번 더!)."},
    {en:"But / <s>they</s> <v>said</v> <o>no</o>.", ko:"하지만 그들은 안 된다고 말했다.", tip:"say-said. say no = 안 된다고 말하다."},
    {en:"<s>Laura</s> <v>came up with</v> <o>an idea</o> / to change their minds.", ko:"Laura는 그들의 마음을 바꾸기 위해서 아이디어를 떠올렸다.", tip:"come up with = ~을 생각해 내다 (came). to change = 바꾸기 위해서."},
    {en:"<s>She</s> <v>washed</v> <o>their cars</o> / every morning.", ko:"그녀는 매일 아침 그들의 자동차를 세차했다.", tip:"every morning = 매일 아침. wash-washed."},
    {en:"<s>She</s> also <v>did</v> <o>the dishes</o>.", ko:"그녀는 설거지도 했다.", tip:"do the dishes = 설거지하다. do-did."},
    {en:"Amazingly, / <s>this plan</s> <v>worked</v>!", ko:"놀랍게도 이 계획은 효과가 있었다!", tip:"work = 효과가 있다 (‘일하다’ 아님!)."},
    {en:"<s>Her parents</s> <v>decided</v> <o>to raise her allowance</o>.", ko:"그녀의 부모님은 그녀의 용돈을 올리기로 결정했다.", tip:"decide to + 동사원형 = ~하기로 결정하다. raise = 올리다."},
    {en:"Now / <s>she</s> <v>is</v> <c>glad</c> / to get fifteen dollars a week.", ko:"이제 그녀는 일주일마다 15달러를 받아서 기쁘다.", tip:"be glad to + 동사원형 = ~해서 기쁘다 (감정의 이유)."}
   ]},
  {no:"06", ko:"상상 그 이상의 게임 세상", en:"Games Beyond Your Imagination",
   task:"<b>Compare</b> 과거의 게임 vs 오늘날의 게임",
   note:["In the past ↔ Today 대조 구조. 칠판에 두 칸 표를 만들어 채우게 하세요.","could not ~ at all / make them more fun / let you be ~를 짚어 주세요. 학생들이 아는 게임(Roblox, Minecraft)으로 이야기 나누기."],
   lines:[
    {en:"<s>Computer games</s> <v>are changing</v> / every day.", ko:"컴퓨터 게임은 매일 변화하고 있다.", tip:"be + 동사-ing = ~하고 있다 (현재진행)."},
    {en:"In the past, / <s>computer games</s> <v>were</v> <c>simple</c>.", ko:"과거에는 컴퓨터 게임이 단순했다.", tip:"In the past = 과거에. 복수 주어의 과거 → were."},
    {en:"<s>They</s> <v>had</v> <o>fixed rules or stories</o>.", ko:"그것들은 정해진 규칙이나 스토리가 있었다.", tip:"fixed = 고정된, 정해진 (rules를 꾸밈)."},
    {en:"<s>You</s> <v>could not change</v> <o>them</o> / at all.", ko:"당신은 그것들을 전혀 바꿀 수 없었다.", tip:"could = can의 과거. not ~ at all = 전혀 ~아닌."},
    {en:"Today, / <s>things</s> <v>are</v> <c>different</c>.", ko:"오늘날, 상황이 다르다.", tip:"things = 상황, 사정. different = 다른."},
    {en:"<s>Players</s> <v>can change</v> <o>different parts of the games</o>.", ko:"플레이어들은 게임의 다양한 부분들을 바꿀 수 있다.", tip:"different parts = 다양한 부분들."},
    {en:"<s>They</s> <v>can change</v> <o>the rules</o> / to make them more fun.", ko:"그들은 그것들을 더 재미있게 만들기 위해서 규칙들을 바꿀 수 있다.", tip:"to make = 만들기 위해서. make + 목적어 + 형용사 = ~을 …하게 만들다. more fun = 더 재미있는."},
    {en:"In Roblox, for example, / <s>you</s> <v>can become</v> <c>a superhero or anyone you like</c>.", ko:"예를 들면, Roblox에서 당신은 슈퍼히어로 혹은 당신이 좋아하는 누구든지 될 수 있다.", tip:"for example = 예를 들면. become + 명사 = ~이 되다. anyone you like = 당신이 좋아하는 누구든지."},
    {en:"In addition, / in Minecraft, / <s>you</s> <v>can build</v> <o>big cities</o>.", ko:"게다가, Minecraft에서 당신은 큰 도시들을 건설할 수 있다.", tip:"In addition = 게다가. city → cities."},
    {en:"<s>You</s> <v>can</v> also <v>visit</v> <o>new worlds</o>.", ko:"당신은 새로운 세계를 방문할 수도 있다.", tip:"also는 조동사 can 뒤에."},
    {en:"In short, / <s>games today</s> <v>let</v> <o>you</o> <c>be anyone</c> / and <c>go anywhere</c>.", ko:"요약하면, 오늘날의 게임은 당신이 누구든 될 수 있게 하고 어디든 갈 수 있게 한다.", tip:"In short = 요약하면. let + 목적어 + 동사원형 = ~가 …하게 하다. anyone = 누구든, anywhere = 어디든."}
   ]}
 ],
 riddle:{clues:["I am a plant.","I come from Argentina and Chile.","I can change my color and leaf shape.","People call me a plant chameleon."], answer:"Boquila! 보키야"},
 grammar:[
  {title:"to부정사: ~하기 위해서", sub:"목적을 나타내는 to + 동사원형", formula:"문장 + <em>to + 동사원형</em> (~하기 위해서)",
   ex:[["It changes its color <mark>to look</mark> like other plants.","다른 식물처럼 보이기 위해서"],["It also changes its leaf shape <mark>to hide</mark> from animals.","동물로부터 숨기 위해서"],["Laura came up with an idea <mark>to change</mark> their minds.","마음을 바꾸기 위해서"]],
   note:"‘왜?’에 대한 대답 → to + 동사원형<br>Why does it change its color? → <b>To look</b> like other plants.",
   fix:[["It changes its color to looks like plants.","It changes its color to look like plants.","to + 동사원형"],["It changes it’s color.","It changes its color.","its = 그것의 / it’s = it is"],["She did the dishes for change their minds.","She did the dishes to change their minds.","목적 → to부정사"]]},
  {title:"동사 + to부정사 · ask A for B", sub:"~하기를 원하다 / ~하기로 결정하다", formula:"want · decide · need + <em>to 동사원형</em> | ask A <em>for</em> B",
   ex:[["She <mark>wanted to buy</mark> her favorite things.","사기를 원했다"],["Her parents <mark>decided to raise</mark> her allowance.","올리기로 결정했다"],["Laura <mark>asked</mark> her parents <mark>for</mark> a bigger allowance.","부모님께 더 많은 용돈을 부탁했다"]],
   note:"<b>be glad to</b> + 동사원형 = ~해서 기쁘다 → She is glad to get fifteen dollars.<br><b>come up with</b> = ~을 생각해 내다 · <b>do the dishes</b> = 설거지하다",
   fix:[["Her parents decided raise her allowance.","Her parents decided to raise her allowance.","decide to"],["Laura asked her parents to a bigger allowance.","Laura asked her parents for a bigger allowance.","ask A for B"],["She is glad to gets fifteen dollars.","She is glad to get fifteen dollars.","to + 동사원형"]]},
  {title:"make + O + 형용사 · let + O + 동사원형", sub:"~을 …하게 만들다 / ~가 …하게 하다", formula:"make + O + <em>형용사</em> | let · help + O + <em>동사원형</em>",
   ex:[["They can change the rules to <mark>make</mark> them <mark>more fun</mark>.","더 재미있게 만들다"],["Games today <mark>let</mark> you <mark>be</mark> anyone and <mark>go</mark> anywhere.","누구든 되게, 어디든 가게 해 준다"],["Its skills <mark>help</mark> it <mark>survive</mark>.","생존하도록 돕는다"]],
   note:"<b>not ~ at all</b> = 전혀 ~아닌 → You could not change them at all.<br><b>could</b> = can의 과거",
   fix:[["Games let you to be anyone.","Games let you be anyone.","let + O + 동사원형"],["They make the game more funly.","They make the game more fun.","make + O + 형용사"],["In the past, games are simple.","In the past, games were simple.","과거 → were"]]}
 ],

 passages:[
  {no:"07", ko:"파자마 파티", en:"Slumber Parties",

   note:["slumber party = 친구 집에서 자고 가는 파자마 파티. 학생들의 경험을 물어보며 시작하세요.","love -ing / invite + 사람 + to 동사원형 / a good way to ~ / lie-fall asleep을 짚어 주세요."],
   lines:[
    {en:"<s>Sarah</s> <v>loves</v> <o>having slumber parties</o>.", ko:"Sarah는 파자마 파티를 매우 좋아한다.", tip:"love + 동사-ing = ~하는 것을 매우 좋아하다. have a party = 파티를 하다."},
    {en:"<s>She</s> often <v>invites</v> <o>her friends</o> <c>to sleep over</c> / at her house.", ko:"그녀는 종종 그녀의 친구들을 집에서 자고 가라고 초대한다.", tip:"invite + 사람 + to 동사원형 = ~에게 …하라고 초대하다. often은 일반동사 앞."},
    {en:"<s>This</s> <v>is</v> <c>a good way / to spend time with her friends</c>.", ko:"이것은 그녀의 친구들과 시간을 보내는 좋은 방법이다.", tip:"a good way to + 동사원형 = ~하는 좋은 방법 (to부정사가 명사 way를 꾸밈). spend time = 시간을 보내다."},
    {en:"<s>They</s> <v>do</v> <o>a lot of fun things</o>.", ko:"그들은 재미있는 일을 많이 한다.", tip:"a lot of = 많은."},

    {en:"<s>They</s> <v>sing</v> <o>songs</o> / and <v>watch</v> <o>scary movies</o>.", ko:"그들은 노래를 부르고 무서운 영화를 본다.", tip:"동사 2개(sing, watch)가 and로 연결."},
    {en:"<s>They</s> also <v>eat</v> <o>delicious ice cream</o> / and <v>tell</v> <o>funny stories</o>.", ko:"그들은 맛있는 아이스크림도 먹고 재미있는 이야기도 한다.", tip:"tell a story = 이야기를 하다. funny = 재미있는, 웃긴."},

   note:["질문(Why do they do so?) → 이유 3가지(당분·미네랄·소화) 구조. 번호 붙이며 찾기.","like to eat / help muscles work / easy to digest / the best snack to give를 짚어 주세요."],
   lines:[

    {en:"Why <v>do</v> <s>they</s> <v>do</v> so?", ko:"그들은 왜 그렇게 할까?", tip:"의문사 + do + 주어 + 동사원형? do so = 그렇게 하다 (바나나를 먹다)."},
    {en:"<s>Bananas</s> <v>have</v> <o>a lot of natural sugars</o>.", ko:"바나나는 천연 당분을 많이 가지고 있다.", tip:"natural = 천연의, 자연의."},
    {en:"<s>These sugars</s> <v>give</v> <o>them</o> <o>quick energy</o>.", ko:"이러한 당분은 그들에게 빠른 에너지를 준다.", tip:"give + 사람 + 물건 = ~에게 …을 주다 (4형식)."},

 grammar:[
  {title:"동명사 vs to부정사 (목적어)", sub:"~하는 것을", formula:"love · enjoy + <em>-ing</em> | like · want · pretend + <em>to 동사원형</em>",

  {title:"think (that) + 주어 + 동사 · make + O + 형용사", sub:"~라고 생각하다 / ~을 …하게 만들다", formula:"think (<em>that</em>) 주어 + 동사 | make + O + <em>형용사</em>",
   ex:[["Those players <mark>think</mark> the ball <mark>will go</mark> backward.","공이 뒤로 갈 거라고 생각한다"],["These tricks <mark>make</mark> the game <mark>exciting</mark>.","경기를 흥미진진하게 만든다"],["This is <mark>a smart way to avoid</mark> a defender.","수비수를 피하는 똑똑한 방법"]],

   lines:[

  {no:"11", ko:"AI 기술의 어두운 면", en:"The Dark Side of AI",
   task:"<b>Think</b> AI의 좋은 면과 나쁜 면 나눠 보기",
   note:["AI의 거짓 영상(딥페이크) 문제. 실제 사례를 짧게 이야기해 주세요.","can + 동사원형 / This is not a problem / If ~, it can ~ / should + 동사원형을 짚어 주세요."],
   lines:[
    {en:"<s>AI</s> <v>is</v> <c>a useful technology</c>.", ko:"AI는 유용한 기술이다.", tip:"useful = 쓸모 있는, 유용한. a + useful (발음이 ‘유’라서 an ✗)."},
    {en:"<s>It</s> <v>can do</v> <o>many good things</o>.", ko:"그것은 많은 좋은 것들을 할 수 있다.", tip:"can + 동사원형."},
    {en:"But / <s>it</s> also <v>has</v> <o>some bad sides</o>.", ko:"하지만 그것은 몇몇 나쁜 면들도 가지고 있다.", tip:"bad side = 나쁜 면. 3인칭 단수 it → has."},
    {en:"For example, / <s>AI</s> <v>can lie</v>.", ko:"예를 들면, AI는 거짓말을 할 수 있다.", tip:"lie = 거짓말하다 (‘눕다’와 철자가 같아요!)."},
    {en:"<s>It</s> <v>can change</v> <o>faces and voices</o> / in videos.", ko:"그것은 동영상 속 얼굴과 목소리를 바꿀 수 있다.", tip:"in videos = 동영상 속의."},
    {en:"<s>This</s> <v>is not</v> <c>a problem</c> / in movies.", ko:"이것은 영화 속에서는 문제가 되지 않는다.", tip:"be동사 부정: is not (isn’t)."},
    {en:"But / <s>it</s> <v>can tell</v> <o>fake stories</o> / to people online.", ko:"하지만 그것은 온라인에서 사람들에게 가짜 이야기를 말할 수 있다.", tip:"tell A to B = B에게 A를 말하다. fake = 가짜의."},
    {en:"<s>This</s> <v>can be</v> <c>a big problem</c>.", ko:"이것은 큰 문제가 될 수 있다.", tip:"can be = ~일 수 있다 (be동사 원형)."},
    {en:"If someone shares a fake video, / <s>it</s> <v>can cause</v> <o>trouble</o>.", ko:"만약 누군가가 가짜 동영상을 공유하면, 그것은 문제를 일으킬 수 있다.", tip:"If + 주어 + 동사 = 만약 ~하면. someone은 단수 → shares. cause = 일으키다."},
    {en:"<s>AI</s> <v>is</v> <c>very helpful</c>.", ko:"AI는 매우 유용하다.", tip:"helpful = 도움이 되는."},
    {en:"But / <s>we</s> <v>should use</v> <o>it</o> / in the right way.", ko:"하지만 우리는 그것을 올바른 방법으로 사용해야 한다.", tip:"should + 동사원형 = ~해야 한다. in the right way = 올바른 방법으로."}
   ]},

    {en:"And / there <v>was</v> <s>a dead bird</s> / on the floor.", ko:"그리고 바닥에는 죽은 새 한 마리가 있었다.", tip:"There was + 단수 = ~이 있었다. dead = 죽은."},

  {title:"비교급 -er / more ~ than", sub:"~보다 더 …한", formula:"형용사<em>-er</em> + than | <em>more</em> + 긴 형용사 + <em>than</em>",

 passages:[
  {no:"25", ko:"누가 아메리카 대륙을 발견했다고?", en:"Who Discovered America?",

   lines:[
    {en:"<s>It</s><v>’s</v> <c>world history class</c>.", ko:"세계사 수업 시간이다.", tip:"It’s = It is. 시간·상황을 말할 때 It."},

 grammar:[
  {title:"ask + 사람 + to부정사", sub:"~에게 …하라고 요청하다", formula:"ask · want + <em>사람</em> + <em>to 동사원형</em>",
   ex:[["The teacher <mark>asks</mark> the students <mark>to find</mark> certain countries.","찾으라고 요청한다"],["He <mark>asked</mark> his team <mark>to think</mark> of a name for it.","생각해 보라고 요청했다"],["People <mark>want</mark> their cars <mark>to be</mark> safe.","안전하기를 원한다"]],
   note:"ask + 사람 + 질문 = ~에게 묻다 → he asks Jack, “Who discovered America?”<br><b>Who</b>가 주어 → Who <b>discovered</b> America? (Who did discover ✗)",
   fix:[["He asked his team think of a name.","He asked his team to think of a name.","ask + 사람 + to"],["Who did discovered America?","Who discovered America?","Who가 주어 → 바로 동사"],["The teacher asks the students find countries.","The teacher asks the students to find countries.","ask + 사람 + to"]]},
  {title:"name + O + 이름 · by vs until", sub:"~을 …라고 이름 짓다 / ~까지", formula:"name + <em>목적어</em> + <em>이름</em> | <em>by</em> + 시간 (마감)",
   ex:[["So Jobs <mark>named</mark> the company <mark>Apple</mark>.","회사를 Apple이라고 이름 지었다"],["Find a name <mark>by</mark> five o’clock.","5시까지 (마감)"],["No one came up with an idea <mark>by</mark> the deadline.","마감 시간까지"]],

   fix:[["No one didn’t come up with an idea.","No one came up with an idea.","no one + 긍정 동사"],["Jobs named Apple the company.","Jobs named the company Apple.","name + 대상 + 이름"],["If you won’t, it’ll be Apple.","If you don’t, it’ll be Apple.","If절은 현재형"]]},
  {title:"미래 will / won’t · when to", sub:"~할 것이다 / 언제 ~해야 할지", formula:"<em>will · won’t</em> + 동사원형 | <em>when to</em> + 동사원형",
   ex:[["Cars in the future <mark>will be</mark> very smart.","똑똑할 것이다"],["They <mark>won’t need</mark> a driver.","필요하지 않을 것이다"],["The cars will know <mark>when to go</mark> and stop.","언제 가야 할지"]],

   fix:[["Cars will are very smart.","Cars will be very smart.","will + be"],["They won’t needs a driver.","They won’t need a driver.","won’t + 동사원형"],["This will help them to avoiding accidents.","This will help them avoid accidents.","help + O + 동사원형"]]}

 passages:[

 },
 speed(el){
  const pool=[];Object.entries(U.words).forEach(([no,ws])=>ws.forEach(w=>pool.push([...w,no])));

 passage(el,sl){

      tip.innerHTML=`<h5>구문 포인트 · 문장 ${i+1}</h5><div class="en">${esc(plain(p.lines[i].en))}</div>${p.lines[i].tip}`;}

 },

 hunt(el,sl){
  const H=sl.act.items;let k=0;const hs=el.querySelector("#hs"),V=el.querySelector("#hV");
  const load=()=>{const h=H[k];hs.innerHTML=h.w.map((w,i)=>`<button class="tok" data-i="${i}">${w}</button>`).join("");V.textContent="";
    el.querySelector("#hN").textContent=`${k+1} / ${H.length}`;

  el.querySelector("#hCheck").onclick=()=>{const h=H[k];let wrong=0,miss=0;
    hs.querySelectorAll(".tok").forEach(t=>{const i=+t.dataset.i,isV=h.v.includes(i),p=t.classList.contains("pick");
      t.classList.remove("pick");if(isV&&p)t.classList.add("ok");else if(isV){t.classList.add("miss");miss++}else if(p){t.classList.add("no");wrong++}});
    V.style.color=(wrong||miss)?"var(--bad)":"var(--good)";

 role(el){const sc=el.querySelector(".script");let fs=36;while(sc.scrollHeight>sc.clientHeight+2&&fs>18){fs--;sc.style.fontSize=fs+"px";if(fs<30)sc.style.gap="6px"}},
 flip(el){el.querySelectorAll(".fc").forEach(c=>c.onclick=()=>c.classList.toggle("open"))},
 ox(el,sl){

  el.querySelector("#oxReveal").onclick=()=>{const x=X[k];el.querySelector("#oxA").innerHTML=`<span class="mk" style="color:${x[1]==="O"?"var(--good)":"var(--bad)"}">${x[1]}</span><span class="why">근거 문장<br><b style="color:var(--ink);font-family:var(--f-read)">${esc(x[2])}</b></span>`};
  el.querySelector("#oxNext").onclick=()=>{k=(k+1)%X.length;load()};
  load();
 },
 scramble(el,sl){
  const SC=sl.act.items;let k=0,picked=[],words=[];const slot=el.querySelector("#scSlot"),pool=el.querySelector("#scPool"),V=el.querySelector("#scV");

 battle(el){

/* ========== SCOREBOARD ========== */
function renderScore(){
  let box=document.getElementById("score");
  if(!box){box=document.createElement("div");box.id="score";stage.appendChild(box)}
  box.hidden=!S.scoreOn;
  box.innerHTML=S.teams.slice(0,S.count).map((t,i)=>`<div class="tm" id="tm${i}" style="border-color:${TEAM_COLORS[i]}"><span class="dot" style="background:${TEAM_COLORS[i]}"></span><b contenteditable="true" spellcheck="false" data-nm="${i}">${esc(t.n)}</b><span class="pt">${t.s}</span><button data-d="${i}" aria-label="${esc(t.n)} 점수 빼기">−</button><button data-u="${i}" aria-label="${esc(t.n)} 점수 더하기">+</button></div>`).join("");
  box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>addScore(+b.dataset.u,1));
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>addScore(+b.dataset.d,-1));
  box.querySelectorAll("[data-nm]").forEach(b=>{b.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.blur()}e.stopPropagation()};
    b.onblur=()=>{S.teams[+b.dataset.nm].n=b.textContent.trim().slice(0,12)||`Team ${"ABCD"[+b.dataset.nm]}`;save();renderScore()}});
  document.getElementById("bScore").classList.toggle("on",S.scoreOn);
}
function addScore(i,d){S.teams[i].s=Math.max(0,S.teams[i].s+d);save();renderScore();const el=document.getElementById("tm"+i);if(el&&d>0)el.classList.add("bump");
  if(SLIDES[S.i].type==="exit")go(S.i);}

/* ========== TIMER ========== */
let tInt=null;
function openTimer(sec,autostart){
  closeOv();const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML=`<button class="ov-x" id="ovx">닫기 ✕</button><div class="ov-card"><div id="tDigits">0:00</div>
   <div class="row">${[30,60,90,120,180].map(s=>`<button class="chip" data-s="${s}">${s<60?s+"초":s/60+"분"}</button>`).join("")}</div>
   <div class="row"><button class="big-btn" id="tGo">시작</button><button class="ghost" id="tStop">일시정지</button></div></div>`;
  stage.appendChild(ov);let left=sec||60,run=false;const D=ov.querySelector("#tDigits");
  const paint=()=>{D.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;D.classList.toggle("urgent",left<=5)};
  const stop=()=>{clearInterval(tInt);tInt=null;run=false};
  const start=()=>{if(run||left<=0)return;run=true;tInt=setInterval(()=>{left--;paint();if(left<=0){stop();beep()}},1000)};
  ov.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{stop();left=+b.dataset.s;paint()});
  ov.querySelector("#tGo").onclick=start;ov.querySelector("#tStop").onclick=stop;ov.querySelector("#ovx").onclick=closeOv;
  paint();if(autostart)start();
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}

/* ========== RANDOM PICKER ========== */
let classSize=12;
function openPick(){
  closeOv();const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML=`<button class="ov-x" id="ovx">닫기 ✕</button><div class="ov-card"><div id="pickOut">?</div><div id="pickSub" style="font-size:22px;color:var(--muted)">팀 또는 번호를 뽑아요</div>
   <div class="row"><button class="big-btn" id="pkTeam">팀 뽑기</button><button class="big-btn" id="pkNum">번호 뽑기</button></div>
   <div class="row" style="align-items:center;font-size:20px"><span>학생 수</span><button class="chip" id="cMinus">−</button><b id="cSize" style="font-size:28px;min-width:44px;text-align:center">${classSize}</b><button class="chip" id="cPlus">+</button></div></div>`;
  stage.appendChild(ov);const out=ov.querySelector("#pickOut"),sub=ov.querySelector("#pickSub");
  const roll=(list,colorFn)=>{let n=0;const it=setInterval(()=>{const r=Math.floor(Math.random()*list.length);out.textContent=list[r];out.style.color=colorFn?colorFn(r):"";if(++n>14)clearInterval(it)},70)};
  ov.querySelector("#pkTeam").onclick=()=>{sub.textContent="이번 차례 팀";roll(S.teams.slice(0,S.count).map(t=>t.n),r=>TEAM_COLORS[r])};
  ov.querySelector("#pkNum").onclick=()=>{sub.textContent="나와 주세요!";roll(Array.from({length:classSize},(_,i)=>i+1+"번"))};
  ov.querySelector("#cMinus").onclick=()=>{classSize=Math.max(2,classSize-1);ov.querySelector("#cSize").textContent=classSize};
  ov.querySelector("#cPlus").onclick=()=>{classSize=Math.min(40,classSize+1);ov.querySelector("#cSize").textContent=classSize};
  ov.querySelector("#ovx").onclick=closeOv;
}
function closeOv(){const o=document.getElementById("ov");if(o)o.remove();clearInterval(tInt);tInt=null}

/* ========== NOTES ========== */
function renderNotes(){
  let n=document.getElementById("notes");
  if(!S.notes){if(n)n.remove();document.getElementById("bNotes").classList.remove("on");return}
  if(!n){n=document.createElement("div");n.id="notes";stage.appendChild(n)}
  const sl=SLIDES[S.i];n.innerHTML=`<h4>강사 노트 · Unit ${U.no} · ${esc(sl.sec)} ${sl.min?"· "+sl.min:""}</h4>`+sl.note.map(x=>`<p>${esc(x)}</p>`).join("");
  document.getElementById("bNotes").classList.add("on");
}

/* ========== NAV ========== */
const sel=document.getElementById("unitSel");
sel.innerHTML=UNITS.map((x,i)=>`<option value="${i}">Unit ${x.no}</option>`).join("");
sel.onchange=()=>setUnit(+sel.value,0);
function setUnit(u,i){S.u=u;U=UNITS[u];SLIDES=buildSlides(U);sel.value=u;save();go(i)}
function go(i){
  S.i=Math.max(0,Math.min(SLIDES.length-1,i));const sl=SLIDES[S.i];
  closeOv();
  stage.innerHTML=R[sl.type](sl);
  const el=stage.querySelector(".slide");if(INIT[sl.type])INIT[sl.type](el,sl);
  renderScore();renderNotes();
  document.getElementById("counter").textContent=`${S.i+1} / ${SLIDES.length}`;
  try{history.replaceState(null,"",`#u${U.no.replace(/^0/,"")}-s${S.i+1}`)}catch(e){}
}
function fit(){const vp=document.getElementById("viewport");const s=Math.min(vp.clientWidth/1600,vp.clientHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);
document.getElementById("bPrev").onclick=()=>go(S.i-1);
document.getElementById("bNext").onclick=()=>go(S.i+1);
document.getElementById("bScore").onclick=()=>{S.scoreOn=!S.scoreOn;renderScore()};
document.getElementById("bTimer").onclick=()=>openTimer(60,false);
document.getElementById("bPick").onclick=openPick;
document.getElementById("bNotes").onclick=()=>{S.notes=!S.notes;renderNotes()};
document.getElementById("bFull").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener("keydown",e=>{
  if(e.target.isContentEditable||e.target.tagName==="SELECT")return;
  if(["ArrowRight","PageDown"].includes(e.key)){go(S.i+1);e.preventDefault()}
  else if(["ArrowLeft","PageUp"].includes(e.key)){go(S.i-1);e.preventDefault()}
  else if(e.key==="n"||e.key==="N"){S.notes=!S.notes;renderNotes()}
  else if(e.key==="Escape")closeOv();
});
const hm=location.hash.match(/^#u(\d+)-s(\d+)$/), hs1=location.hash.match(/^#s(\d+)$/);
if(hm){const ui=UNITS.findIndex(x=>+x.no===+hm[1]);setUnit(ui<0?S.u:ui,+hm[2]-1)}
else setUnit(S.u,hs1?+hs1[1]-1:0);
fit();
</script>
</body></html>
