<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L7·L8 암기 트레이닝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--navy:#1d2b4f;--burgundy:#8a2240;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--soft:#eef0f6;--ok:#1d7a4a;--ok-bg:#e5f4ec;--bad:#b3263a;--bad-bg:#fbe9ec;--hdr:#1d2b4f;--chip:#fff;--chip-line:#c9cedb;
--display:"Do Hyeon","Noto Sans KR",sans-serif;--body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--burgundy:#e0708c;--ok:#5fcf8f;--ok-bg:#163527;--bad:#ff8094;--bad-bg:#3a1a22;--hdr:#0d1426;--chip:#232a3d;--chip-line:#3a4258;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--burgundy:#e0708c;--ok:#5fcf8f;--ok-bg:#163527;--bad:#ff8094;--bad-bg:#3a1a22;--hdr:#0d1426;--chip:#232a3d;--chip-line:#3a4258;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-size:12px;opacity:.75;margin-left:6px}
.hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
main{padding:18px 0 60px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 6px;line-height:1.2}
h2{font-size:17px;margin:20px 0 8px}
.eye{color:var(--burgundy);font-weight:700;font-size:13px;letter-spacing:.5px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.nm{display:flex;gap:8px;align-items:center}.nm input{flex:1}
input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--chip-line);border-radius:10px;padding:9px 11px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.it{display:grid;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.it b{font-size:15px}.it .st{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;margin-top:2px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:6px 0 4px}
.steps button{flex:0 0 auto;font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--chip-line);background:var(--chip);color:var(--ink);cursor:pointer}
.steps button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.steps button.done::after{content:" ✓";color:var(--ok)}
.steps button.on.done::after{color:#9fe0bb}
.ln{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.sp{flex:0 0 auto;min-width:22px;font-weight:700;color:var(--burgundy)}
.tx{flex:1;min-width:0}
.ko{color:var(--muted);font-size:14px}
.sl{color:var(--burgundy);font-weight:700;margin:0 2px}
.say{flex:0 0 auto;border:1px solid var(--chip-line);background:var(--chip);border-radius:8px;padding:2px 8px;cursor:pointer;font-size:15px;color:var(--ink)}
.bin{display:inline-block;width:auto;min-width:70px;padding:2px 6px;border-radius:6px;font-size:15px;margin:2px 0}
.bin.ok{border-color:var(--ok);background:var(--ok-bg)}.bin.no{border-color:var(--bad);background:var(--bad-bg)}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.3px;color:var(--muted);word-break:break-word}
.res{font-size:14px;margin-top:4px}.res .w{color:var(--bad);text-decoration:line-through}.res .m{color:var(--bad);font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.btn{font:inherit;font-weight:700;font-size:16px;padding:11px 16px;border-radius:10px;border:0;background:var(--navy);color:#fff;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row .btn{flex:1}
.kb{border:1.5px solid var(--burgundy);border-radius:10px;padding:10px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--chip-line);background:var(--soft);border-radius:999px;padding:2px 10px;font-size:14px}
.cnt{font-size:22px;letter-spacing:4px}
.bar{height:4px;background:rgba(255,255,255,.2)}.bar i{display:block;height:100%;background:#c98a12;width:0}
.score{font-family:var(--display);font-size:42px}
.hide{display:none}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--burgundy);margin-left:6px;vertical-align:middle}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand">L7·L8 암기 트레이닝<small id="subb"></small></div><button class="hb hide" id="hm">목록</button></div><div class="bar"><i id="bar"></i></div></header>
<main class="wrap" id="app"></main>
<script>
const MEM={"key":"m2lee78_mem_v1","unit":"중2 동아(이병민)","title":"L7·L8 대화문·본문 암기 트레이닝","LS":[{"l":"L7","title":"Wonders in Words"},{"l":"L8","title":"Festival Fun"}],"DLG":[{"id":"L7D1","title":"L7 · Listen and Match 1 · Smart Farm","who":"소녀와 소년","what":"지하철역 안의 스마트 농장","why":"최신 기술로 채소를 기르는 곳이라 신기해서","key":[["What did you say?","뭐라고 했니? (반복 요청)"],["Can you tell me more about it?","그것에 대해 더 말해 줄래?"]],"lines":[["G","Look! There's a smart farm / in this [[subway station]].","봐! 이 지하철역에 스마트 농장이 있어."],["B","[[What did you say]]?","뭐라고 했어?"],["G","[[I said]], \"There's a smart farm here.\"","\"여기 스마트 농장이 있어.\"라고 말했어."],["B","A smart farm? / [[Can you tell me more about it]]?","스마트 농장? 그것에 대해 더 말해 줄래?"],["G","A smart farm uses the [[latest technology]] / to grow vegetables.","스마트 농장은 채소를 기르기 위해 최신 기술을 사용해."]],"frame":["A: Look! There's ____________.","B: What did you say?","A: I said, \"____________.\"","B: Can you tell me more about it?"],"les":"L7"},{"id":"L7D2","title":"L7 · Listen and Match 2 · Earworm","who":"소녀와 소년","what":"머릿속에 계속 맴도는 노래(귀벌레)","why":"대부분의 귀벌레는 기억하기 매우 쉬워서","key":[["I didn't get that.","못 알아들었어."],["keep -ing","계속 ~하다"]],"lines":[["G","This song [[keeps playing]] / in my head.","이 노래가 머릿속에서 계속 맴돌아."],["B","Oh, you have an [[earworm]].","아, 너 귀벌레가 생겼구나."],["G","[[I didn't get that]]. What did you say?","못 알아들었어. 뭐라고 했어?"],["B","\"An earworm.\" / It's a song / that keeps [[repeating]] / in your mind.","\"귀벌레.\" 그건 머릿속에서 계속 반복되는 노래야."],["G","That's interesting. / Can you tell me more / about it?","흥미롭다. 그것에 대해 더 말해 줄래?"],["B","Most earworms are very [[easy to remember]].","대부분의 귀벌레는 기억하기 매우 쉬워."]],"frame":["A: This song keeps ____________.","B: Oh, you have ____________.","A: I didn't get that. What did you say?","B: \"____________.\" It's ____________."],"les":"L7"},{"id":"L7D3","title":"L7 · Listen and Match 3 · Mukbang","who":"소년과 소녀","what":"스트레스 받을 때 보는 먹방","why":"진행자가 음식을 많이 먹으며 시청자와 소통하는 쇼라서","key":[["When I feel stressed, ~","스트레스를 받을 때, ~"],["a type of ~","일종의 ~"]],"lines":[["B","When I [[feel stressed]], / I usually watch mukbang.","나는 스트레스를 받을 때, 보통 먹방을 봐."],["G","What did you say? / Watch what?","뭐라고 했어? 뭘 본다고?"],["B","I said \"mukbang.\" / It's [[a type of]] eating show.","\"먹방\"이라고 했어. 그건 일종의 먹는 쇼야."],["G","Oh, that sounds interesting. / Can you tell me more / about it?","아, 그거 흥미롭다. 그것에 대해 더 말해 줄래?"],["B","The [[host]] eats a lot of food / and [[communicates with]] the viewers / on the show.","진행자가 쇼에서 음식을 많이 먹으면서 시청자들과 소통해."]],"frame":["A: When I feel stressed, I usually ____________.","B: What did you say?","A: I said \"____________.\" It's ____________.","B: Can you tell me more about it?"],"les":"L7"},{"id":"L7D4","title":"L7 · Watch and Write · Zipper","who":"소녀와 소년","what":"최초의 지퍼는 신발에 쓰였다는 사실","why":"한 남자가 신발을 빨리 신으려고 지퍼를 만들어서","key":[["Did you know that ~?","~라는 걸 알았니?"],["What a great idea!","정말 좋은 생각이다!"]],"lines":[["G","[[Did you know that]] the first zipper [[was used]] / on a shoe?","최초의 지퍼가 신발에 사용되었다는 걸 알았니?"],["B","What did you say?","뭐라고 했어?"],["G","I said, / \"The first zipper was used / on a shoe.\"","\"최초의 지퍼는 신발에 사용되었어.\"라고 말했어."],["B","That's interesting. / Can you tell me more / about it?","흥미롭다. 그것에 대해 더 말해 줄래?"],["G","Sure. A man wanted / to [[put on]] his shoes quickly, / so he made zippers / for them.","물론이지. 한 남자가 신발을 빨리 신고 싶어서, 신발에 지퍼를 만들었어."],["B","Wow! [[What a great idea]]!","와! 정말 좋은 생각이다!"],["G","Yeah. Now, / we use zippers / on many things / [[like]] jackets and bags.","응. 지금은 재킷과 가방 같은 많은 것들에 지퍼를 써."]],"frame":["A: Did you know that ____________?","B: What did you say?","A: I said, \"____________.\"","B: That's interesting. Can you tell me more about it?"],"les":"L7"},{"id":"L7D5","title":"L7 · Watch a Video · Public Art","who":"Jake와 하나","what":"공공 미술 조각품","why":"공원이나 거리 같은 공공장소에 있는 모두를 위한 예술이라서","key":[["It's a great example of ~.","그건 ~의 훌륭한 예야."],["Let's take a photo in front of ~.","~ 앞에서 사진 찍자."]],"lines":[["Jake","Wow! Look at the big [[sculpture]] over there.","와! 저기 큰 조각품 좀 봐."],["Hana","It's beautiful. / The word \"love\" is / in big red [[letters]].","아름답다. '사랑'이라는 단어가 크고 빨간 글자로 되어 있어."],["Jake","It's a great [[example of]] public art.","그건 공공 미술의 훌륭한 예야."],["Hana","What did you say?","뭐라고 했어?"],["Jake","I said \"public art.\" / It's art [[for everyone]].","\"공공 미술\"이라고 했어. 그건 모두를 위한 예술이야."],["Hana","I like that idea. / Can you tell me more / about it?","그 생각 좋다. 그것에 대해 더 말해 줄래?"],["Jake","Sure. It's art / in [[public spaces]] like parks / and streets.","물론이지. 그건 공원이나 거리 같은 공공장소에 있는 예술이야."],["Hana","Oh, I saw [[a piece of]] public art / when I visited Jeju-do.","아, 나 제주도에 갔을 때 공공 미술 작품을 하나 봤어."],["Jake","Yeah, they're [[everywhere]]. / Let's [[take a photo]] in front of the sculpture.","응, 그것들은 어디에나 있어. 조각품 앞에서 사진 찍자."],["Hana","Sounds good.","좋아."]],"frame":["A: Look at ____________ over there.","B: It's ____________.","A: It's a great example of ____________.","B: What did you say?"],"les":"L7"},{"id":"L8D1","title":"L8 · Listen and Match 1 · Ice Fishing","who":"Alex와 소녀","what":"얼음낚시 경험과 계획","why":"Alex의 가족이 이번 겨울에 얼음낚시를 갈 계획이라서","key":[["Have you ever tried ~?","~을 해 본 적 있니? (경험 묻기)"],["I'm looking forward to -ing.","나는 ~하기를 기대하고 있어."]],"lines":[["B","[[Have you ever tried]] ice fishing?","너는 얼음낚시를 해 본 적 있니?"],["G","Yes, [[I have]], / Alex. I went / to an ice festival last winter / and tried ice fishing there.","응, 해 봤어, Alex. 지난겨울에 얼음 축제에 가서 거기서 얼음낚시를 해 봤어."],["B","That's great! / My family is [[planning to]] go ice fishing this winter.","멋지다! 우리 가족은 이번 겨울에 얼음낚시를 갈 계획이야."],["G","Oh, you're going / to love it. / It's really exciting.","오, 정말 좋아할 거야. 정말 신나."],["B","Yeah. [[I'm looking forward to]] fishing / on the icy river.","응. 얼어붙은 강에서 낚시하는 게 기대돼."]],"frame":["A: Have you ever tried ____________?","B: Yes, I have. I ____________.","A: My family is planning to ____________.","B: I'm looking forward to ____________."],"les":"L8"},{"id":"L8D2","title":"L8 · Listen and Match 2 · Marshmallows","who":"소년과 Reena","what":"캠핑에서 마시멜로 굽기","why":"구우면 아주 부드럽고 달콤해져서","key":[["Have you ever ~?","~해 본 적 있니?"],["No, I haven't, but I want to try.","아니, 안 해 봤지만 해 보고 싶어."]],"lines":[["B","Reena, do you have any plans this weekend?","Reena, 이번 주말에 계획 있어?"],["G","Yes, I'm [[going camping]] / with my family.","응, 가족이랑 캠핑 가."],["B","That sounds fun! / Have you ever [[roasted marshmallows]] / while camping?","재미있겠다! 캠핑하면서 마시멜로를 구워 본 적 있어?"],["G","No, [[I haven't]], / but I want / to try.","아니, 안 해 봤지만 해 보고 싶어."],["B","When you roast marshmallows, / they become so [[soft and sweet]].","마시멜로를 구우면, 아주 부드럽고 달콤해져."],["G","Oh, that sounds delicious. / I'm really [[looking forward to tasting]] them.","오, 맛있겠다. 그것들을 맛보는 게 정말 기대돼."]],"frame":["A: Do you have any plans this weekend?","B: Yes, I'm ____________.","A: Have you ever ____________?","B: No, I haven't, but I want to try."],"les":"L8"},{"id":"L8D3","title":"L8 · Listen and Match 3 · Mud Festival","who":"James와 소녀","what":"보령 머드 축제","why":"James가 다음 머드 축제에 갈 예정이라서","key":[["Have you ever been to ~?","~에 가 본 적 있니?"],["I hope you have a fantastic time!","즐거운 시간 보내길 바라!"]],"lines":[["B","[[Have you ever been to]] Boryeong?","보령에 가 본 적 있니?"],["G","Yes, I have, / James. I went there last summer / for the [[mud festival]].","응, 가 봤어, James. 지난여름에 머드 축제 때문에 거기 갔어."],["B","Oh, really? / I'm going to the next mud festival. / What activities did you enjoy?","오, 정말? 나는 다음 머드 축제에 갈 거야. 어떤 활동을 즐겼어?"],["G","I [[rode the mud slide]] and played / in the mud pool.","머드 슬라이드를 타고 머드 풀에서 놀았어."],["B","Sounds exciting! / I'm looking forward / to [[trying out]] all the muddy activities.","신나겠다! 진흙 활동을 모두 해 보는 게 기대돼."],["G","Yeah, I hope you [[have a fantastic time]]!","응, 정말 즐거운 시간 보내길 바라!"]],"frame":["A: Have you ever been to ____________?","B: Yes, I have. I went there ____________.","A: What activities did you enjoy?","B: I ____________."],"les":"L8"},{"id":"L8D4","title":"L8 · Watch and Write · Strawberry Picking","who":"소녀와 기호","what":"농장 딸기 따기 행사","why":"딴 딸기를 모두 먹을 수 있어서 다음 달에 또 가기로 함","key":[["Can you tell me more about ~?","~에 대해 더 말해 줄래?"],["Sounds like you had a great time.","즐거운 시간을 보낸 것 같네."]],"lines":[["G","These strawberries are really delicious. / [[Have you ever picked]] fresh strawberries, / Giho?","이 딸기들 정말 맛있다. 기호야, 신선한 딸기를 따 본 적 있어?"],["B","Yes, I have. / I picked these strawberries [[myself]].","응, 따 봤어. 이 딸기들은 내가 직접 땄어."],["G","Really? Where did you pick them?","정말? 어디서 땄어?"],["B","I [[participated in]] a strawberry picking event / at a farm last week.","지난주에 한 농장의 딸기 따기 행사에 참가했어."],["G","That sounds really interesting. / Can you tell me more / about the event?","정말 흥미롭다. 그 행사에 대해 더 말해 줄래?"],["B","Of course. / You can eat [[all the strawberries you pick]] / at the farm.","물론이지. 농장에서 딴 딸기는 모두 먹을 수 있어."],["G","How many strawberries did you eat?","딸기를 몇 개나 먹었어?"],["B","I don't know exactly, / but I was / [[so full]].","정확히는 모르겠지만, 정말 배불렀어."],["G","[[Sounds like you had a great time]]. Are you going / to go there again?","즐거운 시간을 보낸 것 같네. 거기 또 갈 거야?"],["B","Yes. Next month. / I'm looking forward / to picking those fresh strawberries again.","응. 다음 달에. 그 신선한 딸기들을 다시 따는 게 기대돼."]],"frame":["A: Have you ever ____________?","B: Yes, I have. I ____________.","A: Can you tell me more about it?","B: Of course. ____________."],"les":"L8"},{"id":"L8D5","title":"L8 · Watch a Video · Hanyangdoseong","who":"Lucy와 기호","what":"친구 Emily와 갈 만한 곳 - 한양도성","why":"성곽을 따라 걸으며 경치를 즐기고 스탬프 투어도 할 수 있어서","key":[["Where can I take her?","그녀를 어디로 데려갈 수 있을까?"],["I hope you have a great time at ~.","~에서 즐거운 시간 보내길 바라."]],"lines":[["Lucy","My friend Emily is visiting Seoul this weekend. / [[Where can I take her]]?","내 친구 Emily가 이번 주말에 서울에 와. 어디로 데려가면 좋을까?"],["Giho","Well, Lucy, / have you ever visited Hanyangdoseong / before?","음, Lucy, 한양도성에 가 본 적 있어?"],["Lucy","No, I haven't. / What's that?","아니, 안 가 봤어. 그게 뭐야?"],["Giho","It's an [[ancient wall]] surrounding Seoul.","서울을 둘러싸고 있는 옛 성곽이야."],["Lucy","That sounds interesting. / What can we do there?","흥미롭다. 거기서 뭘 할 수 있어?"],["Giho","You can [[walk along]] the wall / and enjoy the beautiful view. / You can also participate / in a [[stamp tour]].","성곽을 따라 걸으며 아름다운 경치를 즐길 수 있어. 스탬프 투어에도 참여할 수 있어."],["Lucy","That's perfect. / Emily likes walking. / And she'll love the stamp tour.","딱이다. Emily는 걷는 걸 좋아해. 그리고 스탬프 투어도 정말 좋아할 거야."],["Giho","I hope you have a great time / at Hanyangdoseong.","한양도성에서 즐거운 시간 보내길 바라."],["Lucy","Thanks. I'm really looking forward / to [[walking around]] the city / with Emily.","고마워. Emily와 도시를 걸어 다니는 게 정말 기대돼."]],"frame":["A: My friend is visiting ____________. Where can I take her?","B: Have you ever visited ____________?","A: No, I haven't. What can we do there?","B: You can ____________."],"les":"L8"}],"PAR":[{"id":"L7M1","title":"L7 ① Break a Leg (상황)","map":["day of the school play","Lily practiced for weeks","curtains about to go up – nervous","friend: \"Break a leg!\"","\"Thanks. I will!\"","performed successfully"],"s":[["It was the day of the school play.","학교 연극 날이었다.","day, school, play"],["Lily practiced for the play / for weeks.","Lily는 몇 주 동안 연극을 연습했다.","Lily, practiced, play, weeks"],["The curtains were / about to go up, / and she felt very nervous.","막이 막 오르려 했고, 그녀는 매우 긴장했다.","curtains, about, felt, nervous"],["Her friend smiled / and said, / \"Break a leg!\"","그녀의 친구가 미소 지으며 \"다리를 부러뜨려!\"라고 말했다.","friend, smiled, Break, leg"],["Lily said, / \"Thanks. I will!\"","Lily는 \"고마워. 그럴게!\"라고 말했다.","Lily, Thanks"],["She got on the stage / and performed successfully.","그녀는 무대에 올라 성공적으로 공연했다.","got, stage, performed, successfully"]],"les":"L7"},{"id":"L7M2","title":"L7 ② Break a Leg (유래)","map":["sounds like a bad thing – means Good luck","German actors – United States – early 20th century","wishing bad luck → go away","still used today","wish performers good luck before a show"],"s":[["Although \"Break a leg!\" / may sound like a bad thing, / it actually means \"Good luck!\"","\"다리를 부러뜨려!\"는 나쁜 말처럼 들릴 수도 있지만, 실제로는 \"행운을 빌어!\"라는 뜻이다.","Although, Break, leg, may, sound"],["German actors who came / to the United States / in the early 20th century first used this phrase.","20세기 초에 미국에 온 독일 배우들이 이 어구를 처음 사용했다.","German, actors, came, United, States"],["By wishing each other bad luck, / they believed that it would go away.","서로에게 불운을 빌어 줌으로써, 그들은 불운이 사라질 거라고 믿었다.","wishing, each, other, bad, luck"],["This expression is still used today.","이 표현은 오늘날에도 여전히 사용된다.","expression, still, used, today"],["\"Break a leg\" is a phrase / that people say / to wish performers good luck / before a show.","'Break a leg'는 사람들이 공연 전에 공연자에게 행운을 빌어 주기 위해 하는 어구이다.","Break, leg, phrase, people, say"]],"les":"L7"},{"id":"L7M3","title":"L7 ③ Spill the Beans (상황)","map":["Tommy & Lisa – surprise party for Hana","Tommy – not good at keeping secrets","Lisa: \"Don't spill the beans.\"","promise not to tell Hana","kept his promise – big success","Hana completely surprised"],"s":[["Tommy and Lisa were preparing a surprise party / for Hana.","Tommy와 Lisa는 하나를 위한 깜짝 파티를 준비하고 있었다.","Tommy, Lisa, preparing, surprise, party"],["But Tommy was not good / at keeping secrets.","하지만 Tommy는 비밀을 잘 지키지 못했다.","Tommy, good, keeping, secrets"],["So, Lisa told him, / \"Don't spill the beans.\"","그래서 Lisa는 그에게 \"콩을 쏟지 마.\"라고 말했다.","Lisa, told, spill, beans"],["Tommy said, / \"Don't worry. / I promise not / to tell Hana.\"","Tommy는 \"걱정 마. 하나에게 말하지 않겠다고 약속할게.\"라고 말했다.","Tommy, worry, promise, tell, Hana"],["Tommy kept his promise / and the surprise party was a big success.","Tommy는 약속을 지켰고 깜짝 파티는 대성공이었다.","Tommy, kept, promise, surprise, party"],["Hana was completely surprised.","하나는 완전히 놀랐다.","Hana, completely, surprised"]],"les":"L7"},{"id":"L7M4","title":"L7 ④ Spill the Beans (유래)","map":["meaning – reveal a secret","ancient Greek way of voting","white or black bean – big jar","voting completed – beans spilled – reveal results","new meaning"],"s":[["What does the phrase \"spill the beans\" mean?","'spill the beans'라는 어구는 무슨 뜻일까?","phrase, spill, beans, mean"],["It means to reveal a secret.","그것은 비밀을 누설한다는 뜻이다.","means, reveal, secret"],["Where does this phrase come / from?","이 어구는 어디에서 왔을까?","Where, phrase, come, from"],["It comes from an ancient Greek way of voting.","그것은 고대 그리스의 투표 방식에서 왔다.","comes, from, ancient, Greek, way"],["When Greeks voted, / they put a white or black bean / in a big jar.","그리스 사람들은 투표할 때 큰 항아리에 흰 콩이나 검은 콩을 넣었다.","When, Greeks, voted, put, white"],["When the voting was completed, / the beans were spilled / to reveal the results.","투표가 끝나면, 결과를 공개하기 위해 콩을 쏟았다.","When, voting, completed, beans, spilled"],["From then, / people began to use this phrase / with a new meaning.","그때부터 사람들은 이 어구를 새로운 의미로 쓰기 시작했다.","From, people, began, use, phrase"]],"les":"L7"},{"id":"L7M5","title":"L7 ⑤ Take a Rain Check (상황)","map":["Sarah – movie with Emily","\"Do you want to see a movie with me today?\"","\"I have to take a rain check.\"","go to grandmother's house","\"Let's do it another time.\"","a little disappointed – understood"],"s":[["Sarah wanted to see a movie / with her best friend, / Emily.","Sarah는 가장 친한 친구 Emily와 영화를 보고 싶었다.","Sarah, wanted, see, movie, best"],["So, she asked Emily, / \"Do you want / to see a movie / with me today?\"","그래서 그녀는 Emily에게 \"오늘 나랑 영화 볼래?\"라고 물었다.","asked, Emily, want, see, movie"],["Emily replied, / \"I'm sorry, / but I have / to take a rain check.\"","Emily는 \"미안하지만, 다음으로 미뤄야겠어.\"라고 대답했다.","Emily, replied, sorry, take, rain"],["\"I have to go / to my grandmother's house today.\"","\"오늘 할머니 댁에 가야 하거든.\"","grandmother's, house, today"],["\"That's okay. / Let's do it another time,\" / said Sarah.","\"괜찮아. 다음에 하자.\"라고 Sarah가 말했다.","okay, another, time, Sarah"],["Although Sarah was a little disappointed, / she understood Emily's situation.","Sarah는 조금 실망했지만, Emily의 상황을 이해했다.","Although, Sarah, little, disappointed, understood"]],"les":"L7"},{"id":"L7M6","title":"L7 ⑥ Take a Rain Check (유래)","map":["refuse an offer politely – do it later","baseball game – 1880s","ticket for a future game – canceled because of rain","other sporting events","over time – widely used"],"s":[["What does \"take a rain check\" mean?","'take a rain check'는 무슨 뜻일까?","take, rain, check, mean"],["It means to refuse an offer politely / but wish to do it later.","그것은 제안을 정중하게 거절하지만 나중에 하고 싶다는 뜻이다.","means, refuse, offer, politely, wish"],["The phrase \"rain check\" was first used / at a baseball game / in the 1880s.","'rain check'라는 어구는 1880년대에 야구 경기에서 처음 사용되었다.","phrase, rain, check, first, used"],["A rain check was a ticket / that people got / for a future game / when a baseball game was canceled / because of rain.","rain check는 야구 경기가 비 때문에 취소되었을 때 사람들이 다음 경기를 위해 받은 표였다.","rain, check, ticket, people, got"],["Later, rain checks were given / at other sporting events.","나중에, rain check는 다른 스포츠 행사에서도 주어졌다.","Later, rain, checks, given, other"],["Over time, / \"take a rain check\" has been widely used / to say that you can't do something now / and want to do it later.","시간이 지나면서, 'take a rain check'는 지금은 무언가를 할 수 없고 나중에 하고 싶다고 말할 때 널리 쓰이게 되었다.","Over, time, take, rain, check"]],"les":"L7"},{"id":"L8M1","title":"L8 ① Bonhomme 소개","map":["Welcome – Quebec Winter Carnival","Bonhomme – mascot – big snowman","big red hat – special belt","unforgettable memory","follow me – what to do here","Bonhomme = good man (French)","10 days – January–February – Quebec, Canada"],"s":[["Hello! Welcome to the Quebec Winter Carnival.","안녕하세요! 퀘벡 윈터 카니발에 오신 것을 환영합니다.","Hello, Welcome, Quebec, Winter, Carnival"],["I am Bonhomme, / the mascot of the carnival.","저는 카니발의 마스코트인 Bonhomme이에요.","Bonhomme, mascot, carnival"],["I am a big snowman.","저는 커다란 눈사람이에요.","big, snowman"],["As you can see, / I'm wearing a big red hat / and a special belt.","보시다시피, 저는 큰 빨간 모자를 쓰고 특별한 벨트를 매고 있어요.","see, wearing, big, red, hat"],["Do you want / to take home an unforgettable memory / from the carnival?","카니발에서 잊지 못할 추억을 가져가고 싶나요?","want, take, home, unforgettable, memory"],["Follow me, / and I'll show you what / to do here.","저를 따라오세요, 여기서 무엇을 해야 할지 보여 드릴게요.","Follow, show"],["Bonhomme means “good man” / in French.","Bonhomme은 프랑스어로 '좋은 사람'이라는 뜻이다.","Bonhomme, means, good, man, French"],["The Quebec Winter Carnival is usually held / for 10 days between January / and February in Quebec, / Canada.","퀘벡 윈터 카니발은 보통 캐나다 퀘벡에서 1월과 2월 사이에 10일 동안 열린다.","Quebec, Winter, Carnival, usually, held"]],"les":"L8"},{"id":"L8M2","title":"L8 ② Bonhomme의 얼음 궁전","map":["my ice palace – new one every year","made of ice and snow – shines during the day","at night – more beautiful – lights","ice garden – sculptures of trees, flowers, animals","concerts & performances","teach you how to dance"],"s":[["This is my ice palace.","이것은 제 얼음 궁전이에요.","ice, palace"],["Every year, / a new ice palace is built / for the carnival.","매년 카니발을 위해 새 얼음 궁전이 지어져요.","Every, year, new, ice, palace"],["So, I have a new home each year!","그래서 저는 매년 새집이 생겨요!","new, home, each, year"],["Because the palace is made of ice / and snow, / it shines beautifully / during the day.","궁전은 얼음과 눈으로 만들어져서, 낮 동안 아름답게 빛나요.","Because, palace, made, ice, snow"],["At night, / it is even more beautiful / with many lights.","밤에는 많은 조명 덕분에 훨씬 더 아름다워요.","night, even, more, beautiful, many"],["Take a look / at my fantastic ice garden.","저의 환상적인 얼음 정원을 보세요.","Take, look, fantastic, ice, garden"],["You can see amazing ice sculptures of trees, / flowers, and animals here.","여기서 나무, 꽃, 동물 모양의 놀라운 얼음 조각들을 볼 수 있어요.","see, amazing, ice, sculptures, trees"],["You can also enjoy exciting concerts / and performances.","신나는 콘서트와 공연도 즐길 수 있어요.","enjoy, exciting, concerts, performances"],["Do you like / to dance? / I can teach you how / to dance like me.","춤추는 것을 좋아하나요? 저처럼 춤추는 방법을 가르쳐 드릴 수 있어요.","like, dance, teach"]],"les":"L8"},{"id":"L8M3","title":"L8 ③ 터보건 슬라이드","map":["many interesting activities","toboggan slide – built in 1884 – 200 meters long","toboggan = long narrow sled","like speed – get on","so fast that – roller coaster","amazing views of Quebec","castle on the left – icy river on the right"],"s":[["There are also / so many interesting activities you can do / at the carnival.","카니발에서 할 수 있는 흥미로운 활동도 정말 많아요.","many, interesting, activities, carnival"],["The toboggan slide was built / in 1884 and is 200 meters long.","터보건 슬라이드는 1884년에 만들어졌고 길이가 200미터예요.","toboggan, slide, built, 1884, 200"],["A toboggan is a long narrow sled.","터보건은 길고 좁은 썰매예요.","toboggan, long, narrow, sled"],["If you like speed, / get on the toboggan.","속도를 좋아한다면, 터보건을 타 보세요.","like, speed, get, toboggan"],["It is so fast / that you will feel / like you are / on a roller coaster.","그것은 너무 빨라서 롤러코스터를 타고 있는 것처럼 느껴질 거예요.","fast, feel, like, roller, coaster"],["While you're sliding down, / you can enjoy amazing views of Quebec.","미끄러져 내려가는 동안, 퀘벡의 놀라운 경치를 즐길 수 있어요.","While, sliding, down, enjoy, amazing"],["You can see a huge famous castle / on your left.","왼쪽에는 거대하고 유명한 성이 보여요.","see, huge, famous, castle, left"],["On your right, / you can see a beautiful icy river.","오른쪽에는 아름다운 얼어붙은 강이 보여요.","right, see, beautiful, icy, river"]],"les":"L8"},{"id":"L8M4","title":"L8 ④ 얼음 카누 경주","map":["large crowd along the river – Ice Canoe Race","best part – shouldn't miss it","icy river – about three kilometers","teams of five – men and women","stuck in the ice – push the canoe","in the water again – finish line","so exciting that – forget about the cold"],"s":[["If you see a large crowd along the river, / it's time to watch the Ice Canoe Race.","강을 따라 많은 사람들이 모여 있다면, 얼음 카누 경주를 볼 시간이에요.","see, large, crowd, along, river"],["This race is one of the best parts of the carnival, / and you shouldn't miss it.","이 경주는 카니발의 가장 좋은 부분 중 하나이니, 놓치면 안 돼요.","race, best, parts, carnival, shouldn't"],["Canoe teams have / to race through the icy river / for about three kilometers.","카누 팀들은 얼어붙은 강을 약 3킬로미터 동안 가로질러 경주해야 해요.","Canoe, teams, race, through, icy"],["Teams are usually made up of five members, / and both men / and women can join the team.","팀은 e me / at the carnival. / Oh, don't forget / to check our website / for more information. / Bye!","카니발에 와서 저를 만나길 바라요. 아, 더 많은 정보를 위해 웹사이트를 확인하는 것 잊지 마세요. 안녕!","hope, come, see, carnival, forget"]],"les":"L8"}]};

 const rows=it.lines.map((l,li)=>{let parts=mk(l.en);return `<div class="ln"><span class="sp">${l.sp||li+1}</span><div class="tx">${parts}<div class="ko">${esc(l.ko)}</div></div></div>`});
 B.innerHTML=`<div class="card">${rows.join("")}</div><div class="row"><button class="btn" id="ck">채점하기</button><button class="btn ghost" id="sh">정답 보기</button></div><div id="msg" class="res"></div>`;
 $("#ck").onclick=()=>{let ok=0,all=0;B.querySelectorAll(".bin").forEach(x=>{all++;const g=norm(x.value)===norm(x.dataset.a);x.classList.toggle("ok",g);x.classList.toggle("no",!g);if(g)ok++});$("#msg").innerHTML=`<b class="${ok===all?"ok":"bad"}">${ok} / ${all} 정답</b>${ok===all?" 🎉 다음 단계로!":" – 틀린 칸을 고쳐 다시 채점해요."}`};
 $("#sh").onclick=()=>B.querySelectorAll(".bin").forEach(x=>{if(norm(x.value)!==norm(x.dataset.a)){x.value=x.dataset.a;x.classList.add("no")}});}
const inp=a=>`<input class="bin" data-a="${esc(a)}" style="width:${Math.max(70,a.length*10+24)}px" autocomplete="off" autocapitalize="off" spellcheck="false">`;
function s2D(B,it){blanks(B,it,en=>en.replace(/ \/ /g," ").replace(/\[\[(.+?)\]\]/g,(m,x)=>inp(x)))}
function s2P(B,it){blanks(B,it,en=>words(en).map(w=>{const m=w.match(/^([^A-Za-z]*)([A-Za-z'’\-]+)(.*)$/);return m&&FW.has(m[2].toLowerCase())?m[1]+inp(m[2])+m[3]:esc(w)}).join(" "))}
// typing stage
function typing(B,it,hintF,title,saveIt){
 B.innerHTML=`<p class="muted">${title}</p>${it.lines.map((l,i)=>`<div class="card" style="padding:12px"><div><span class="sp">${l.sp||i+1}</span> ${hintF(l,i)}</div><textarea rows="2" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 쓰세요"></textarea><div class="res" id="r${i}"></div></div>`).join("")}
 <div class="row"><button class="btn" id="ck">${saveIt?"제출하고 채점하기":"채점하기"}</button></div><div id="sum"></div>`;
 $("#ck").onclick=()=>{let ok=0;const wrong=[];
  B.querySelectorAll("textarea").forEach(t=>{const i=+t.dataset.i,l=it.lines[i],a=norm(t.value),b=norm(plain(l.en));const g=a===b;if(g)ok++;else wrong.push({i,u:t.value.trim(),a:plain(l.en)});
   $("#r"+i).innerHTML=g?`<span class="ok">✓ 정확해요</span>`:diff(a,b,plain(l.en))});
  const n=it.lines.length;$("#sum").innerHTML=`<div class="card" style="text-align:center"><div class="score ${ok===n?"ok":""}">${ok} / ${n}</div><div class="muted">${ok===n?"완벽해요! 백지로 쓸 수 있어요 🎉":"빨간 부분을 보고 다시 써 보세요."}</div><div id="svm" class="muted"></div></div>`;
  if(saveIt)send(payload(it,ok,n,wrong));};}
function diff(a,b,orig){const A=a.split(" "),Bw=b.split(" ");let out=[];const m=Math.max(A.length,Bw.length);for(let i=0;i<m;i++){if(A[i]===Bw[i])out.push(esc(Bw[i]));else out.push(`<span class="m">${esc(Bw[i]||"")}</span>`)}return `<span class="bad">✗</span> 정답: ${esc(orig)}<br><span class="muted">틀린 위치: </span>${out.join(" ")}`}
const s3=(B,it)=>typing(B,it,l=>`<span class="hint">${esc(firstL(l.en))}</span>`,"첫 글자만 보고 문장 전체를 쓰세요.");
function s4P(B,it){typing(B,it,l=>`<span class="hint">[ ${esc(l.kw)} ]</span>`,"키워드만 보고 문장 전체를 쓰세요.")}
function s5(B,it){typing(B,it,l=>`<span class="ko" style="font-size:15px">${esc(l.ko)}</span>`,"우리말만 보고 영어로 쓰세요. 제출하면 선생님 노션에 점수가 저장돼요.",true)}
// role play
function s4D(B,it){const sps=[...new Set(it.lines.map(l=>l.sp))];
 B.innerHTML=`<div class="card"><b>역할 연습</b><p class="muted" style="margin:4px 0">내가 맡을 역할을 고르세요. 상대 대사는 앱이 읽어 주고, 내 차례에는 우리말만 보고 영어로 말해요.</p><div class="row">${sps.map(s=>`<button class="btn ghost rl" data-s="${s}">내가 ${s}</button>`).join("")}</div></div><div id="rp"></div>`;
 B.querySelectorAll(".rl").forEach(b=>b.onclick=()=>role(b.dataset.s));
 function role(me){let i=0;const rp=$("#rp");
  const step=async()=>{if(i>=it.lines.length){rp.innerHTML=`<div class="card" style="text-align:center"><b class="ok">끝! 🎉</b><p class="muted">역할을 바꿔 한 번 더 해 보세요.</p></div>`;return}
   const l=it.lines[i];
   if(l.sp!==me){rp.innerHTML=`<div class="card"><div class="ln"><span class="sp">${l.sp}</span><div class="tx">${esc(plain(l.en))}</div></div><p class="muted">🔊 상대 대사 듣는 중…</p></div>`;await speak(l.en);i++;step()}
   else{rp.innerHTML=`<div class="card"><div class="ln"><span class="sp">${l.sp}</span><div class="tx"><div class="ko" style="font-size:16px">${esc(l.ko)}</div><div id="ans" class="hide">${esc(plain(l.en))}</div></div></div><p class="muted">내 차례! 영어로 소리 내어 말한 뒤 확인하세요.</p><div class="row"><button class="btn ghost" id="sa">정답 확인</button><button class="btn" id="nx">다음</button></div></div>`;
    $("#sa").onclick=()=>{$("#ans").classList.remove("hide");speak(l.en)};$("#nx").onclick=()=>{i++;step()}}};
  step()}}
// recording
let rec=null,chunks=[],stream=null;
function stopRec(){try{if(rec&&rec.state!=="inactive")rec.stop()}catch(e){}try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}rec=null}
function recorder(B,label){
 B.insertAdjacentHTML("beforeend",`<div class="card" style="text-align:center"><b>🎤 ${label}</b><p class="muted" style="margin:4px 0">녹음 후 들어 보고, 원어민 발음과 비교해 보세요.</p><div class="row"><button class="btn" id="rb">● 녹음 시작</button></div><audio id="au" controls class="hide" style="width:100%;margin-top:10px"></audio><div id="rm" class="muted"></div></div>`);
 $("#rb").onclick=async()=>{if(rec){stopRec();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){$("#rm").textContent="이 브라우저에서는 녹음이 지원되지 않아요. 크롬이나 사파리 최신 버전을 사용하세요.";return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$("#rm").textContent="마이크 권한을 허용해 주세요.";return}
  chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=$("#au");if(!a)return;a.src=URL.createObjectURL(new Blob(chunks,{type:chunks[0]?chunks[0].type:"audio/webm"}));a.classList.remove("hide");$("#rb").textContent="● 다시 녹음";try{stream.getTracks().forEach(t=>t.stop())}catch(e){}rec=null};
  rec.start();$("#rb").textContent="■ 녹음 멈추기";$("#rm").textContent="녹음 중… 끝나면 멈추기를 누르세요."}}
function s6(B,it){B.innerHTML=`<div class="card">${it.lines.map(l=>`<div class="ln"><span class="sp">${l.sp}</span><div class="tx ko" style="font-size:15px">${esc(l.ko)}</div>${sayBtn(l.en)}</div>`).join("")}</div>`;wireSay(B);recorder(B,"우리말만 보고 대화 전체 말하기")}
function s6P(B,it){B.innerHTML=`<div class="card"><b>스토리맵만 보고 다시 말하기</b><div class="chips" style="margin-top:6px">${it.p.map.map(m=>`<span>${esc(m)}</span>`).join("")}</div></div><div class="card"><button class="btn ghost" id="sw" style="width:100%">원문 보기 / 숨기기</button><div id="org" class="hide">${it.lines.map((l,i)=>`<div class="ln"><span class="sp">${i+1}</span><div class="tx">${esc(plain(l.en))}</div>${sayBtn(l.en)}</div>`).join("")}</div></div>`;
 $("#sw").onclick=()=>$("#org").classList.toggle("hide");wireSay(B);recorder(B,"키워드만 보고 본문 다시 말하기")}
// save
const saveOn=()=>/^https:\/\/script\.google\.com\//.test(SAVE_URL);
function getQ(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return[]}}
function setQ(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function post(p){const r=await fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});const j=await r.json();if(!j.ok)throw new Error(j.msg||"fail");return j}
async function flushQ(){if(!saveOn())return;const q=getQ();if(!q.length)return;const left=[];for(const p of q){try{await post(p)}catch(e){left.push(p)}}setQ(left)}
function payload(it,ok,n,wrong){const d=st.done[it.id]=st.done[it.id]||{};const first=d.best==null;d.best=Math.max(d.best||0,ok);d.tries=(d.tries||0)+1;sv();
 const now=new Date(),p=v=>String(v).padStart(2,"0");
 return{type:"memorize",name:st.name,unit:MEM.unit+" "+it.les+" 암기",day:it.k==="D"?it.n:it.n+MEM.DLG.filter(d=>d.les===it.les).length,title:(it.k==="D"?"대화문 ":"본문 ")+it.n+" · "+(it.k==="D"?it.title:tt(it.p.title)),cat:it.k==="D"?"대화문 암기":"본문 암기",
  attempt:first?"백지 1회차":"백지 "+d.tries+"회차",score:ok,total:n,wrongNums:wrong.length?wrong.map(w=>(w.i+1)+"번").join(", "):"없음",
  wrongDetail:wrong.map(w=>`${w.i+1}번 내 답: ${w.u||"-"} → 정답: ${w.a}`).join("\n").slice(0,1900),minutes:Math.max(1,Math.round((Date.now()-(it.t0||Date.now()))/60000)),
  timestamp:`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}:00+09:00`}}
async function send(pl){const m=t=>{const x=$("#svm");if(x)x.innerHTML=t};if(!saveOn())return;m("저장 중…");
 try{await post(pl);m('<span class="ok">✓ 선생님 노션에 저장되었습니다.</span>');flushQ()}catch(e){const q=getQ();q.push(pl);setQ(q);m('<span class="bad">저장 실패(인터넷 확인). 다음에 앱을 열면 자동으로 다시 보내요.</span>')}}
$("#hm").onclick=home;home();
</script>
</body>
