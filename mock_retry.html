.mode:hover{border-color:var(--bur)}.mode .ic{font-size:30px}.mode b{font-size:17px;display:block}.mode span{font-size:13px;color:var(--muted)}
.ex{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;margin:6px 0;cursor:pointer;color:var(--ink)}

.op.on{border-color:var(--navy);background:#eef2fb}.op.ok{border-color:var(--ok);background:var(--okbg)}.op.no{border-color:var(--no);background:var(--nobg)}

<script>
const RD={"PASS":{"p0":"<b>[Watch and Check 2]</b>\nG: David, what are you making?\nB: I'm making pizza and pasta.\nG: They look delicious. [[Are you interested in Italian food?]]\nB: Yes, I am. I want to be a world-famous chef in the future!","p1":"<b>[Watch and Check 2]</b>\nB: [[What do you think about this pasta?]]\nG: I think it's pretty good.\nB: I don't think so. I think it's too salty.\nG: Really? It's OK for me.","p2":"<b>Let's Make a Movie! ② Peter</b>\nI'm Peter, the director of photography for this movie. I'm in charge of all the cameras. Today, Tom and Max are going to play together with a ball on the beach. [[To capture]] their happy moments, I'm going to use drones.","p3":"<b>Let's Make a Movie! ④ Emma</b>\nMy name is Emma, and I'm a film editor. My work begins after the shooting is over. [[To create]] a better story, I can change the order of scenes or delete some of them. Storytelling skills are important for my job, so I read a lot.","p4":"<b>Goldilocks Learns Her Lesson ②</b>\nOne day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. [[It]] was getting dark, and it started to rain. She opened the door and walked inside.\nThere were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn't care.\n“It's so fun!” shouted Goldilocks.","p5":"<b>Goldilocks Learns Her Lesson ④</b>\n“You [[broke into]] our house and posted these pictures without our permission. Don't you know these things are wrong?” said Father Bear.\n“Please forgive me. I'm so sorry, and I'll clean your house every day until the end of the summer,” said Goldilocks.","p6":"<b>[Watch and Check 1]</b>\nG: [[What do you want to be in the future]], Minsu?\nB: I want to be a sports reporter.\nG: Oh, really? Do you watch a lot of sports games?\nB: Yes, I do. I'm interested in all kinds of sports.","p7":"<b>[Watch, Answer, and Talk]</b>\nG: Jiho, [[why don't we try this]]? We can fly an airplane!\nB: Sure. It looks like fun!\nG: Do you want to be a pilot in the future?\nB: Yes, I'm interested in flying airplanes. How about you, Lucy?\nG: I'm interested in making airplanes, not flying. I want to be an airplane engineer.\nB: That sounds cool!\nG: Thank you. I want to make an airplane someday!\nB: Let's fly this airplane, and then we can try making an airplane, too.\nG: Good idea.","p8":"<b>Let's Make a Movie! ③ Jennifer</b>\nI'm Jennifer. I trained and took care of Max for a long time. Max is a great actor, but he sometimes gets too excited when a lot of people are around. So, I use hand signals [[to calm]] him. Who am I? I'm an animal wrangler.","p9":"<b>Goldilocks Learns Her Lesson ⑤</b>\nAll summer long, Goldilocks worked hard. On the last day, Goldilocks said to Father Bear, “I deleted all my posts of your cottage, so please don't worry.”\n“You still don't understand. Other people already shared them on social media. Your posts will [[live on]] forever,” said Father Bear.\n“Oh, I didn't think about that,” said Goldilocks. “From now on, I'll think twice before I press POST.”","p10":"Hi, I'm Jim Brown, the director of Happy Days. It's a movie about the friendship between Tom and his dog Max. A lot of people are working hard to create this movie. Do you want to meet some of them? I'm Anna, and I found this beautiful beach. I'm a location manager, and my job is to find perfect places for shooting. Of course, it is not easy, but I love my job. I like to travel and enjoy challenges.\n\nI'm Peter, the director of photography for this movie. I'm in charge of all the cameras. Today, Tom and Max are going to play together with a ball on the beach. To capture their happy moments, I'm going to use drones.\n\nI'm Jennifer. I trained and took care of Max for a long time. Max is a great actor, but he sometimes gets too excited when a lot of people are around. So, I use hand signals to calm him. Who am I? I'm an animal wrangler.\n\nMy name is Emma, and I'm a film editor. My work begins after the shooting is over. To create a better story, I can change the order of scenes or delete some of them. Storytelling skills are important for my job, so I read a lot.\n\nI'm Chris, and I'm a Foley artist. I create sound effects in my studio when recording on location is not easy. Listen carefully. Do you hear the sound of waves? I made that sound with rice and a plastic container. Doesn't it sound real?","p11":"<b>[Topic 1 · Listen and Number 3]</b>\nG: What do you think about the magic show?\nB: I think it's amazing.\nG: I feel the same. I think magic is so cool.","p12":"<b>[Topic 2 · Different Looks]</b>\nJiho: Look at this picture. What do you think about it, Yena?\nYena: I like it. I think the duck is cute.\nJiho: What about you, Andy?\nAndy: I feel the same. The duck's eye is big.\nJiho: Kate, what do you think?\nKate: I like it, too, but I don't see a duck. I only see a rabbit.\nAndy: Oh, now I can see the rabbit, too!\nYena: That's interesting! We can see different things in the same picture.","p13":"<b>[Topic 1 · Listen and Write 3]</b>\nG: Inho, did you have a good weekend?\nB: Yes. I went ice skating with my friends. [[How about you?]]\nG: I took a snowboarding lesson. It was really fun.","p14":"<b>Faces of Great Artists ① Introduction</b>\nWho is your favorite artist? What does she or he look like? Some artists painted self-portraits. Why did they paint [[themselves]]? Let's find out.","p15":"<b>Faces of Great Artists ③ Frida Kahlo</b>\nFrida Kahlo was a Mexican artist. When she was six years old, she was very sick. Her right leg became [[weaker than]] her left leg. But she thought, “I will get well. I will help sick people like me.” When she was 18, she was in a terrible bus accident. She stayed in the hospital for a long time. Kahlo said to herself, “I look weak. But I am stronger than anyone.” So, Kahlo started to paint herself. She painted 55 self-portraits in her lifetime. Look at her paintings. Does she look strong?","p16":"<b>Frindle ②</b>\nOn the way home, Nick saw a pen on the street. He [[picked up]] the pen. He had an idea.\n“From today, your new name is <i>frindle</i>.”\nThe next day, he told his friends about his new word. By the end of the week, all his classmates were using it.\n“Can I borrow your frindle?”\n“I think [[that]] your red frindle is pretty.”","p17":"<b>Frindle ③</b>\nOne day after class, Mrs. Granger called Nick. She said, “<i>Frindle</i> is not a real word. You and your classmates should stop using it.” Nick said, “I know that you're not happy. I'm really sorry, but it's too late. Everyone is using it now.” Mrs. Granger [[took out]] a letter. She said, “I wrote this letter for you. But I'm not going to give it to you today. [[I will send you this letter]] some day.”","p18":"<b>Frindle ④</b>\nThe next morning, Mrs. Granger told the class, “Stop using <i>frindle</i>! <i>Frindle</i> is not a real word.” But [[more and more]] students used it. Students in other schools started using it. Soon, students in the whole country were using it.","p19":"<b>[Topic 2 · Winter Activities]</b>\nKate: [[It]] snowed all day yesterday, Jiho.\nJiho: Yeah, Kate. The snow covered everything.\nKate: It was beautiful. Did you go outside?\nJiho: Of course. I had a snowball fight with my friends.\nKate: Sounds exciting. I made a snowman with my brother.\nJiho: Cool! We made little snow ducks.\nKate: Really? I want to make snow ducks, too.\nJiho: [[Why don't we make them now?]]\nKate: Sure. Let's go!","p20":"<b>Faces of Great Artists ② Vincent van Gogh</b>\nVincent van Gogh was a Dutch artist. He was not famous in his lifetime. When he was 33, he moved to Paris. He wanted to paint people, but models were too expensive. He thought, “I don't have money for a model. What can I do?” So, Van Gogh started to paint himself. He painted 36 self-portraits. They are all different. Look at these two paintings. One is [[brighter than]] the other. Which one do you like?","p21":"<b>[Topic 1 · Listen and Match 3]</b>\nB: When I feel stressed, I usually watch mukbang.\nG: What did you say? Watch what?\nB: I said \"mukbang.\" It's a type of eating show.\nG: Oh, that sounds interesting. [[Can you tell me more about it?]]\nB: The host eats a lot of food and communicates with the viewers on the show.","p22":"<b>[Topic 1 · Listen and Match 2]</b>\nB: Reena, do you have any plans this weekend?\nG: Yes, I'm going camping with my family.\nB: That sounds fun! Have you ever roasted marshmallows while camping?\nG: No, I haven't, but I want to try.\nB: When you roast marshmallows, they become so soft and sweet.\nG: Oh, that sounds delicious. [[I'm really looking forward to tasting them.]]","p23":"<b>Take a Rain Check</b>\nSarah wanted to see a movie with her best friend, Emily. So, she asked Emily, \"Do you want to see a movie with me today?\" Emily replied, \"I'm sorry, but I have to take a rain check. I have to go to my grandmother's house today.\" \"That's okay. Let's do it another time,\" said Sarah. Although Sarah was a little disappointed, she understood Emily's situation. What does \"take a rain check\" mean? It means to refuse an offer politely but wish to do it later. The phrase \"rain check\" was first used at a baseball game in the 1880s. A rain check was a ticket that people got for a future game when a baseball game was canceled because of rain. Later, rain checks were given at other sporting events. Over time, \"take a rain check\" has been widely used to say that you can't do something now and want to do it later.","p24":"<b>Break a Leg</b>\nIt was the day of the school play. Lily practiced for the play for weeks. The curtains were about to go up, and she felt very nervous. Her friend smiled and said, \"Break a leg!\" Lily said, \"Thanks. I will!\" She got on the stage and performed successfully. Although \"Break a leg!\" may sound like a bad thing, it actually means \"Good luck!\" German actors who came to the United States in the early 20th century first used this phrase. By wishing each other bad luck, they believed that it would go away. This expression is still used today. \"Break a leg\" is a phrase that people say to wish performers good luck before a show.","p25":"<b>Toboggan Slide</b>\nThere are also so many interesting activities you can do at the carnival. The toboggan slide was built in 1884 and is 200 meters long. A toboggan is a long narrow sled. If you like speed, get on the toboggan. It is [[so fast that]] you will feel like you are on a roller coaster. While you're sliding down, you can enjoy amazing views of Quebec. You can see a huge famous castle on your left. On your right, you can see a beautiful icy river.","p26":"<b>Ice Canoe Race</b>\nIf you see a large crowd along the river, it's time to watch the Ice Canoe Race. This race is one of the best parts of the carnival, and you shouldn't miss it. Canoe teams have to race through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team. Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to get to the water. Phew! They are in the water again. I hope they can make it to the finish line. The race is [[so exciting that]] you will forget about the cold.","p27":"<b>[Topic 1 · Watch and Write]</b>\nG: Did you know that the first zipper was used on a shoe?\nB: What did you say?\nG: I said, \"The first zipper was used on a shoe.\"\nB: That's interesting. Can you tell me more about it?\nG: Sure. A man wanted to put on his shoes quickly, so he made zippers for [[them]].\nB: Wow! What a great idea!\nG: Yeah. Now, we use zippers on many things like jackets and bags.","p28":"<b>[Topic 2 · Watch a Video]</b>\nLucy: My friend Emily is visiting Seoul this weekend. Where can I take her?\nGiho: Well, Lucy, have you ever visited Hanyangdoseong before?\nLucy: No, I haven't. What's that?\nGiho: It's an ancient wall surrounding Seoul.\nLucy: That sounds interesting. What can we do there?\nGiho: You can walk along the wall and enjoy the beautiful view. You can also participate in a stamp tour.\nLucy: That's perfect. Emily likes walking. And she'll love the stamp tour.\nGiho: I hope you have a great time at Hanyangdoseong.\nLucy: Thanks. I'm really looking forward to walking around the city with Emily.","p29":"<b>[Listen Up]</b>\nM: Welcome to the ABC World Food Festival! Every year, we invite great chefs from around the world. This year, we invited Mr. Kumar, a world-famous Indian chef. Do you like Indian food? Then, don't miss his cooking class. You can also get his recipe book for free.","p30":"<b>A Butterfly That Changed the Future ③</b>\nSlowly, everyone got out of the time machine. The jungle was covered in fog. It was very quiet.\n“I'm so excited,” said Eckels.\n“Be careful. Some of the dinosaurs are hungry,” said Travis. “Just stay calm. I don't want you to do anything foolish.”\n“Don't worry. I'm not a fool,” said Eckels.\nThey all began to walk on the path.\nAfter some time, Travis whispered, “Look over there. There is a T. rex.”\nOne hundred meters away, a T. rex slowly appeared.\n“It,” whispered Eckels. “It ...”\n“Sh!”\n“It ... is huge. [[I've never seen]] such a huge thing. I'm so scared,” said Eckels.\n“Sh ... quiet!” Travis said angrily. “You don't want it to see you.”","p31":"<b>Day of the Dead Festival in Mexico</b>\nMany Mexicans believe that once a year dead people come back home to meet their family and friends. They call this day the Day of the Dead. To welcome dead people, Mexicans hold a festival on November 1 and 2. They believe it is important to remember dead people. So, people set up altars in their homes and have big parties in cemeteries. In some areas, people dress up like skeletons and hold big parades.","p32":"<b>Fallas Festival in Valencia, Spain</b>\nPeople in Valencia celebrate the coming of spring with the Fallas festival. This festival takes place from March 15 to 19. During the festival, people enjoy parades and fireworks. The stars of the festival are fallas, giant wooden statues. You can find hundreds of them all over the city. Surprisingly, the fallas are burned on the last day of the festival. Burning them symbolizes saying goodbye to old things and hello to a new start.","p33":"<b>A Butterfly That Changed the Future ②</b>\n“This is Travis, your travel guide,” he continued. “To stay safe, you must follow his instructions.”\nInside the time machine, there were two other travelers. Eckels sat down and closed his eyes. He felt the machine moving under his feet. After only a few minutes, the machine stopped.\n“[[We've just arrived]] in the jungle of 60 million years ago,” Travis explained. “Do you see the path over there? You must not leave it at any time. Do not touch anything. You might kill something by accident. A little change here can cause something unthinkable in the future.”","p34":"<b>A Butterfly That Changed the Future ⑥</b>\nEckels looked around the room carefully. Everything looked the same, except the big sign on the wall. The sign now said, “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.” Eckels was confused.\nThen, he saw the TV. The new president was on the news, but it was not Mr. Keith. “What's going on?” He got more confused.\nHe sat down and looked closely at the mud on his shoes.\n“No, it can't be,” said Eckels. “It's all because of this little thing?” He was shocked. In the mud on his right shoe, he found a small dead butterfly.","p35":"<b>[Watch, Answer, and Role-play]</b>\nEmma: Hi, Jihan. What a surprise!\nJihan: Hey, Emma. Are you here to see the fireworks, too?\nEmma: Yes. I hear China, Italy, and the USA are participating this year.\nJihan: Don't forget Korea.\nEmma: Of course, Korea, too. So, the fireworks start at 7 p.m. Right?\nJihan: Yeah. Let's do something together until then.\nEmma: I guess we can ride bikes or go for a boat ride. Which do you like more?\nJihan: Going for a boat ride. I think it'll be more fun.\nEmma: Then, let's go for a boat ride.","p36":"<b>[Watch and Check 3]</b>\nG: What's this music, Hojin? It's [[awesome]].\nB: I'm writing a song with this computer program.\nG: You're very good. Do you want to be a songwriter?\nB: Yes, I'm really interested in writing songs.","p37":"<b>[Watch and Check 3]</b>\nG: My phone is not working. I need to get a new one.\nB: Look! Here are the new models. What do you think about this one?\nG: Wow, I like it. It's very light.\nB: [[I agree.]] It's lighter than mine.","p38":"<b>[Watch and Check 4]</b>\nG: Are you interested in fashion, Jacob?\nB: Yes, I love to make clothes.\nG: Really? [[That's so cool!]]\nB: Thanks. I want to be a fashion designer. I'll make clothes for you someday.","p39":"<b>Goldilocks Learns Her Lesson ③</b>\nShe took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and [[fell asleep]] in the smallest bed.\nAbout an hour later, three bears came home.\n“Someone ate my soup and broke my chair!” cried Baby Bear.\nThey went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.\n“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.\nGoldilocks jumped up in surprise.","p40":"<b>[Topic 1 · Watch and Correct]</b>\nB: Suji, what did you do last weekend?\nG: I went to a volleyball game.\nB: Which teams played?\nG: The Spikers played the Flyers.\nB: Which team did you [[cheer for]]?\nG: The Spikers. They're my favorite team.\nB: I see. How was the game?\nG: It was really exciting. The Spikers won. How was your weekend, Eddie?\nB: Great. I rode my bike in the park.\nG: [[Sounds good.]]","p41":"<b>Faces of Great Artists ④ Conclusion</b>\nVan Gogh and Kahlo painted themselves for different reasons. But their paintings have [[one thing in common]]. They touch the hearts of many people.","p42":"<b>[Topic 2 · Watch a Video]</b>\nJake: Wow! Look at the big sculpture over there.\nHana: It's beautiful. The word \"love\" is in big red letters.\nJake: It's a great example of public art.\nHana: What did you say?\nJake: I said \"public art.\" It's art for everyone.\nHana: I like that idea. Can you tell me more about it?\nJake: Sure. It's art in public spaces like parks and streets.\nHana: Oh, I saw a piece of public art when I visited Jeju-do.\nJake: Yeah, they're everywhere. Let's take a photo in front of the sculpture.\nHana: Sounds good.","p43":"<b>[Topic 1 · Listen and Match 3]</b>\nB: Have you ever been to Boryeong?\nG: Yes, I have, James. I went there last summer for the mud festival.\nB: Oh, really? I'm going to the next mud festival. What activities did you enjoy?\nG: I rode the mud slide and played in the mud pool.\nB: Sounds exciting! I'm looking forward to trying out all the muddy activities.\nG: Yeah, I hope you have a fantastic time!","p44":"<b>Spill the Beans</b>\nTommy and Lisa were preparing a surprise party for Hana. But Tommy was not good at keeping secrets. So, Lisa told him, \"Don't spill the beans.\" Tommy said, \"Don't worry. I promise not to tell Hana.\" Tommy kept his promise and the surprise party was a big success. Hana was completely surprised. What does the phrase \"spill the beans\" mean? It means to reveal a secret. Where does this phrase come from? It comes from an ancient Greek way of voting. When Greeks voted, they put a white or black bean in a big jar. When the voting was completed, the beans were spilled to reveal the results. From then, people began to use this phrase with a new meaning.","p45":"<b>[Topic 1 · Watch and Write]</b>\nG: These strawberries are really delicious. Have you ever picked fresh strawberries, Giho?\nB: Yes, I have. I picked these strawberries [[myself]].\nG: Really? Where did you pick them?\nB: I participated in a strawberry picking event at a farm last week.\nG: That sounds really interesting. Can you tell me more about the event?\nB: Of course. You can eat all the strawberries you pick at the farm.\nG: How many strawberries did you eat?\nB: I don't know exactly, but I was so full.\nG: Sounds like you had a great time. Are you going to go there again?\nB: Yes. Next month. I'm looking forward to picking those fresh strawberries again.","p46":"<b>[Watch and Check 2]</b>\nB: They have tteokbokki and gimbap here. Which of the two do you like better?\nG: I like tteokbokki [[much]] better. I like spicy food.\nB: Then, let's order tteokbokki. It looks delicious.\nG: OK. I'm so hungry!","p47":"<b>Fur Rondy Festival in Alaska, USA</b>\nAt the end of February, people in Alaska hold the Fur Rondy festival, one of the biggest winter festivals in the world. During this festival, visitors can enjoy various winter sports and Alaskan traditional games. They can also enjoy many special events such as the Running of the Reindeer. People who participate in this race wear fun costumes and try to run faster than reindeer. Is it possible to do so? Not really, but it doesn't matter. Everyone is just having fun!","p48":"<b>[Watch and Check 4]</b>\nG: What do you think about cleaning robots? There's one over there.\nB: I think they are very helpful. I really need one at home.\nG: [[Me, too.]] I don't like to clean my room.\nB: Who does? Cleaning robots are perfect for people like us.","p49":"<b>[Topic 1 · Listen and Write 1·2]</b>\n1. G: Jack, [[what did you do on Saturday?]]\n   B: I read the book <i>Charlotte's Web</i>.\n   G: How was it?\n   B: It was great. The story was very touching.\n2. B: Hana, what did you do last weekend?\n   G: I watched a movie with my sister.\n   B: [[How was the movie?]]\n   G: It was very sad. We cried a lot.","p50":"<b>Frindle ①</b>\nNick Allen was in the fifth grade. One day in English class, he asked his teacher, “How do words get their meanings? Why does the word <i>dog</i> mean a dog? Why can't it mean a book?” Mrs. Granger answered, “People [[give meanings to words]].” Nick asked, “How?” Mrs. Granger said, “You, me, and everyone in the country [[agreed on]] the meaning.” Nick thought, “Really? I didn't agree.”","p51":"<b>[Topic 1 · Listen and Match 1]</b>\nB: [[Have you ever tried ice fishing?]]\nG: Yes, I have, Alex. I went to an ice festival last winter and tried ice fishing there.\nB: That's great! My family is planning to go ice fishing this winter.\nG: Oh, you're going to love it. It's really exciting.\nB: Yeah. I'm looking forward to fishing on the icy river.","p52":"<b>Delicious Treats</b>\nAfter all these exciting activities, I'm really hungry. There are many delicious treats to eat at the carnival. How about a cup of hot chocolate? It's always the perfect drink in cold weather. You also have to try maple taffy. It's made in a special way here. Let's learn [[how to make]] it. Pour hot maple syrup on the snow. Then place a stick on the syrup and quickly roll it around. Now, you have delicious maple taffy!\nI hope you come and see me at the carnival. Oh, don't forget to check our website for more information. Bye!","p53":"<b>A Butterfly That Changed the Future ⑤</b>\nTravis and the other travelers returned safely to the machine and found Eckels inside.\n“You put all of us in danger,” said Travis to Eckels in an angry voice. “You left the path.”\n“I'm sorry, but I didn't kill anything,” said Eckels. “There's only a little mud on my shoes.”\nTravis stared at Eckels for a long time without saying anything.\n“Let's go home,” said Travis finally.\nThe machine stopped. They all returned to the present safely.\n“Is everything okay here?” asked Travis.\n“Fine. Welcome home!” said Mr. Parker.","p54":"<b>A Butterfly That Changed the Future ④</b>\n“I can't breathe,” said Eckels. “Get me out of here!”\n“Don't panic, Eckels,” said Travis. “Turn around, and walk quietly back to the machine.”\nEckels turned around and started to run. He was [[so terrified that]] he left the path by accident.\n“Eckels!” shouted Travis. “Don't leave the path!”\nThe T. rex heard Travis and turned its head toward him and the other travelers. There was a moment of silence. Then, it suddenly started to run toward them with a loud roar.\n“Run, everybody! Run!” shouted Travis.","p55":"<b>A Butterfly That Changed the Future ①</b>\nEckels walked into the office of Time Travel. The big sign on the wall said, “NAME ANY YEAR IN THE PAST. WE TAKE YOU THERE.” There was a TV on the wall, and Mr. Keith, the new president, was on the news.\n“How can we help you?” said Mr. Parker, the founder of Time Travel.\n“[[I've always wanted]] to see a dinosaur. Is it possible?” asked Eckels.\n“Sure,” said Mr. Parker. “We can take you back to the jungle of 60 million years ago.”\n“Great,” said Eckels. “Can you take me there now?”\n“You're lucky. There's a time machine that leaves in 10 minutes,” said Mr. Parker."},"EX":{"m1yun_saha":{"title":"중1 동아(윤정미) 7·8과 모의고사","sub":"사하중 학습지 포함","orig":[{"area":"대화문","q":"대화의 내용과 일치하지 <b>않는</b> 것은?","e":"피자와 파스타를 만들고 있다.","p":"p0","t":"mc","o":["David is making pizza and pasta.","The girl thinks the food looks delicious.","David is interested in Italian food.","David wants to be a world-famous chef.","David is eating hamburgers."],"a":4},{"area":"대화문","q":"밑줄 친 문장에 대한 대답으로 알맞은 것은?","e":"Are you ~? → Yes, I am.","p":"p0","t":"mc","o":["Yes, I do.","Yes, I am.","No, I don't.","Yes, I can.","No, it isn't."],"a":1},{"area":"대화문","q":"대화의 내용과 일치하지 <b>않는</b> 것은?","e":"소년은 I don't think so.로 동의하지 않는다.","p":"p1","t":"mc","o":["They are talking about pasta.","The girl thinks the pasta is pretty good.","The boy thinks the pasta is too salty.","The pasta is OK for the girl.","The boy agrees with the girl."],"a":4},{"area":"대화문","q":"'pretty good'의 pretty와 같은 의미로 쓰인 것은?","e":"pretty = 꽤 (부사)","p":"p1","t":"mc","o":["She is a pretty girl.","What a pretty dress!","The test was pretty hard.","The flowers are pretty.","She has a pretty smile."],"a":2},{"area":"본문","q":"글의 내용과 일치하지 <b>않는</b> 것은?","e":"Tom과 Max가 함께 논다.","p":"p2","t"
