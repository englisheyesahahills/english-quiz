   task:"<b>Debate</b> 네 나라의 주장을 정리하고, 누가 보물을 가져야 할지 팀별로 정하기",
   note:["콜롬비아·볼리비아/페루·스페인·미국 4개 팀으로 나눠 주장을 읽게 하면 토론 활동이 돼요.","수동태 과거 was attacked by, belong to, so(그래서)를 짚어 주세요."],
   lines:[
    {en:"Back in 1708, / there <v>was</v> <s>a big Spanish ship</s>.", ko:"1708년에, 큰 스페인 배 한 척이 있었다.", tip:"back in + 연도 = (과거) ~년에."},
    {en:"<s>Its name</s> <v>was</v> <c>San Jose</c>.", ko:"그 배의 이름은 산호세였다.", tip:"Its = 그것의 (it’s = it is와 구분!)."},
    {en:"<s>It</s> <v>was going</v> to Spain / with lots of treasure / from Bolivia and Peru.", ko:"그 배는 볼리비아와 페루에서 온 많은 보물을 싣고 스페인으로 가고 있었다.", tip:"과거진행형. lots of = 많은. treasure = 보물."},
    {en:"But / <s>the ship</s> <v>was attacked</v> / by British ships.", ko:"하지만 그 배는 영국 배들에게 공격을 받았다.", tip:"was + 과거분사 + by ~ = ~에 의해 …당했다 (과거 수동태)."},
    {en:"<s>It</s> <v>sank</v> / near Colombia.", ko:"그 배는 콜롬비아 근처에서 가라앉았다.", tip:"sink-sank-sunk = 가라앉다."},
    {en:"<s>People</s> <v>forgot</v> about <o>San Jose</o> / for a long time.", ko:"사람들은 오랫동안 산호세에 대해 잊었다.", tip:"forget-forgot-forgotten."},
    {en:"Then, / <s>someone</s> <v>found</v> <o>it</o> / after about 300 years.", ko:"그러다, 약 300년 후에 누군가가 그것을 찾았다.", tip:"find-found-found."},
    {en:"Now, / <s>many countries</s> <v>want</v> <o>the treasure</o>.", ko:"이제, 많은 나라들이 그 보물을 원한다.", tip:"many + 복수 명사."},
    {en:"<s>Colombia</s> <v>says</v>, / “The ship is in our waters, / so it is ours.”", ko:"콜롬비아는 말한다. “그 배는 우리 영해에 있으니, 그것은 우리 것이다.”", tip:"waters = 영해 (복수형). ours = 우리의 것."},
    {en:"<s>Bolivia and Peru</s> <v>say</v>, / “The treasure came from our lands, / so we should get it back.”", ko:"볼리비아와 페루는 말한다. “보물은 우리 땅에서 나왔으니, 우리가 그것을 되찾아야 한다.”", tip:"주어 둘 → say. get A back = A를 되찾다. should = ~해야 한다."},
    {en:"<s>Spain</s> <v>says</v>, / “The ship was Spanish, / so it belongs to us.”", ko:"스페인은 말한다. “그 배는 스페인 배였으니, 그것은 우리 것이다.”", tip:"belong to ~ = ~에 속하다, ~의 것이다."},
    {en:"<s>The USA</s> <v>says</v>, / “We helped find it, / so we should get some, too.”", ko:"미국은 말한다. “우리가 그것을 찾는 것을 도왔으니, 우리도 일부를 받아야 한다.”", tip:"help + 동사원형 = ~하는 것을 돕다. some = 일부."},
    {en:"<s>The ship</s> <v>has</v> <o>over 200 tons of gold and jewels</o>.", ko:"그 배에는 200톤이 넘는 금과 보석이 있다.", tip:"over = ~ 이상. jewel = 보석."},
    {en:"<s>Countries</s> <v>are</v> still <v>fighting</v> about <o>it</o>.", ko:"나라들은 아직도 그것을 두고 싸우고 있다.", tip:"현재진행형. still = 아직도."},
    {en:"Who <v>will get</v> <o>the treasure</o>?", ko:"누가 보물을 가지게 될까?", tip:"Who가 주어 → Who will get ~?"},
    {en:"Which side <v>are</v> <s>you</s> on?", ko:"당신은 어느 편인가?", tip:"be on one’s side = ~의 편이다. Which side are you on? = 너는 누구 편이야?"}
   ]}

   fix:[["Humans have been here since 4 hours.","Humans have been here for 4 hours.","기간 → for"],["a 46-years-old person","a 46-year-old person","하이픈 연결 → 단수"],["Technology helped people grew.","Technology helped people grow.","help + O + 동사원형"]]},
  {title:"too ~ to · not A but B", sub:"너무 ~해서 …할 수 없다 / A가 아니라 B", formula:"<em>too</em> + 형용사 + <em>to</em> 동사원형 | <em>not</em> A <em>but</em> B",
   ex:[["They get <mark>too tired to do</mark> anything else.","너무 지쳐서 아무것도 못 한다"],["It is <mark>not</mark> a real song by a swan, <mark>but</mark> an artist’s final greatest work.","A가 아니라 B"],["<mark>According to</mark> an old story, swans sing only once.","~에 따르면"]],

   fix:[["They are too tired doing anything.","They are too tired to do anything.","too ~ to + 동사원형"],["When they finish to sing, ~","When they finish singing, ~","finish + -ing"],["not a real song and an artist’s work","not a real song but an artist’s work","not A but B"]]},
  {title:"과거 수동태 · belong to", sub:"~에 의해 …되었다 / ~의 것이다", formula:"was/were + <em>과거분사</em> (+ by ~)",

   note:"능동: British ships <b>attacked</b> the ship. → 수동: The ship <b>was attacked</b> by British ships.<br>소유대명사: ours / yours / theirs",
   fix:[["The ship attacked by British ships.","The ship was attacked by British ships.","수동태는 be동사 필수"],["It belongs to ours.","It belongs to us.","to 뒤는 목적격"],["The ship sinked near Colombia.","The ship sank near Colombia.","sink-sank-sunk"]]}

{no:"08",
 passages:[
  {no:"22", ko:"눈물 어린 진주 이야기", en:"How a Pearl Is Made",
   task:"<b>Order</b> 진주가 만들어지는 과정 4단계로 정리하기",
   note:["질문: \"How is a pearl made?\" → sand gets in → hurts → covers with layers → after years, a pearl.","재귀대명사 itself, keep -ing, to one’s surprise, to부정사 목적(To protect itself)을 짚어 주세요."],
   lines:[
    {en:"One day, / <s>a man</s> <v>was eating</v> <o>oysters</o> / at a restaurant in New York City.", ko:"어느 날, 한 남자가 뉴욕시의 한 식당에서 굴을 먹고 있었다.", tip:"과거진행형 was + -ing. oyster = 굴."},
    {en:"While chewing, / <s>he</s> <v>felt</v> <o>something hard</o> / in his mouth.", ko:"씹는 동안, 그는 입안에서 딱딱한 무언가를 느꼈다.", tip:"While chewing = While he was chewing. something + 형용사 = ~한 무언가."},
    {en:"<s>He</s> <v>thought</v> / <o>he broke a tooth</o>.", ko:"그는 이가 부러졌다고 생각했다.", tip:"think-thought. break-broke. tooth(단수) ↔ teeth(복수)."},
    {en:"But / to his surprise, / <s>it</s> <v>was</v> <c>a pearl</c>!", ko:"하지만 놀랍게도, 그것은 진주였다!", tip:"to one’s surprise = ~가 놀랍게도."},
    {en:"<s>Pearls</s> <v>are</v> <c>shiny jewels / that grow inside oysters</c>.", ko:"진주는 굴 안에서 자라는 반짝이는 보석이다.", tip:"jewels that grow ~ = ~에서 자라는 보석 (주격 관계대명사 that). shiny = 반짝이는."},
    {en:"But / how <v>are</v> <s>they</s> <v>made</v>?", ko:"하지만 그것들은 어떻게 만들어질까?", tip:"수동태 의문문: how + be + 주어 + 과거분사?"},
    {en:"Sometimes, / <s>a tiny grain of sand</s> <v>gets</v> into <o>the oyster</o>.", ko:"때때로, 아주 작은 모래 한 알이 굴 속으로 들어간다.", tip:"a grain of sand = 모래 한 알. get into = ~ 안으로 들어가다."},
    {en:"<s>It</s> <v>hurts</v> <o>the oyster</o>.", ko:"그것은 굴을 아프게 한다.", tip:"hurt = 아프게 하다."},
    {en:"To protect itself, / <s>the oyster</s> <v>covers</v> <o>the sand</o> / with a smooth layer.", ko:"자신을 보호하기 위해, 굴은 모래를 매끄러운 층으로 덮는다.", tip:"To + 동사원형 = ~하기 위해 (문장 맨 앞). itself = 그 자신 (재귀대명사). cover A with B = A를 B로 덮다."},
    {en:"<s>It</s> <v>keeps</v> <o>adding more layers</o> / over time.", ko:"그것은 시간이 지나면서 계속 더 많은 층을 더한다.", tip:"keep + -ing = 계속 ~하다. over time = 시간이 지나면서."},
    {en:"After a few years, / <s>these layers</s> <v>become</v> <c>a pearl</c>.", ko:"몇 년 후, 이 층들이 진주가 된다.", tip:"become + 명사 = ~가 되다. a few years = 몇 년."},
    {en:"<s>The man</s> <v>may be</v> <c>glad</c> / to find a pearl, / but <s>he</s> <v>may not know</v> / <o>how hard the oyster worked / to make the pearl</o>.", ko:"그 남자는 진주를 발견해서 기쁠지 모르지만, 굴이 진주를 만들기 위해 얼마나 열심히 일했는지는 모를지도 모른다.", tip:"glad to ~ = ~해서 기쁜 (감정의 원인). how hard + 주어 + 동사 = 얼마나 열심히 ~했는지 (간접의문문)."}
   ]},
  {no:"23", ko:"가라앉는 땅, 떠오르는 도시", en:"A Floating City",
   task:"<b>Find</b> 떠다니는 도시의 좋은 점 3가지 찾기",
   note:["질문: \"Why is the sea level rising?\" → because of global warming. \"How many people could live there?\" → about 10,000.","would / could(상상·가능), because of + 명사, come up with를 짚어 주세요."],
   lines:[
    {en:"<s>The sea level</s> <v>is</v> rapidly <v>rising</v> / because of global warming.", ko:"해수면이 지구 온난화 때문에 빠르게 상승하고 있다.", tip:"because of + 명사(구) = ~ 때문에. because + 주어 + 동사와 구분!"},
    {en:"If it keeps rising, / <s>many places in the world</s> <v>may sink</v>.", ko:"만약 그것이 계속 상승한다면, 세계의 많은 곳이 가라앉을지도 모른다.", tip:"keep + -ing = 계속 ~하다. may = ~할지도 모른다."},
    {en:"<s>A company / named Oceanix</s> <v>came up with</v> <o>a good idea</o> / to solve this problem.", ko:"오셔닉스라는 이름의 회사가 이 문제를 해결하기 위한 좋은 아이디어를 생각해 냈다.", tip:"come up with = (아이디어를) 생각해 내다. to solve = 해결하기 위한 (명사 수식)."},
    {en:"<s>The idea</s> <v>was</v> <c>to build a floating city / on the ocean</c>.", ko:"그 아이디어는 바다 위에 떠다니는 도시를 짓는 것이었다.", tip:"to build = 짓는 것 (보어). floating = 떠다니는."},
    {en:"<s>The city</s> <v>would have</v> <o>six man-made islands</o>.", ko:"그 도시는 여섯 개의 인공 섬을 가지게 될 것이다.", tip:"would = (아이디어 속 상상) ~일 것이다. man-made = 인공의."},
    {en:"About 10,000 <s>people</s> <v>could live</v> there.", ko:"약 만 명의 사람들이 그곳에 살 수 있을 것이다.", tip:"could = ~할 수 있을 것이다 (가능성)."},
    {en:"<s>People</s> <v>wouldn’t need to worry</v> about <o>food</o>.", ko:"사람들은 음식에 대해 걱정할 필요가 없을 것이다.", tip:"wouldn’t = would not. need to + 동사원형."},
    {en:"<s>They</s> <v>could grow</v> <o>crops</o> / on the islands.", ko:"그들은 섬에서 농작물을 기를 수 있을 것이다.", tip:"grow crops = 농작물을 재배하다."},
    {en:"<s>The city</s> <v>could</v> also <v>move</v> / to different places / each season.", ko:"그 도시는 또한 계절마다 다른 장소로 이동할 수 있을 것이다.", tip:"each season = 계절마다. also는 조동사 뒤."},
    {en:"In summer, / <s>it</s> <v>could move</v> / to a cooler place.", ko:"여름에는, 그것은 더 시원한 곳으로 이동할 수 있다.", tip:"cooler = cool의 비교급."},
    {en:"In winter, / <s>it</s> <v>could go</v> / to a warmer place.", ko:"겨울에는, 그것은 더 따뜻한 곳으로 갈 수 있다.", tip:"warmer = warm의 비교급."},
    {en:"<v>Will</v> <s>this city</s> <v>be</v> <c>the solution / to rising sea levels</c>?", ko:"이 도시가 상승하는 해수면에 대한 해결책이 될까?", tip:"the solution to ~ = ~에 대한 해결책. rising = 상승하는."},
    {en:"<s>No one</s> <v>knows</v> / for sure.", ko:"아무도 확실히는 모른다.", tip:"for sure = 확실히."},
    {en:"But / <s>we</s> <v>should act</v> now / —before it’s too late.", ko:"하지만 우리는 지금 행동해야 한다—너무 늦기 전에.", tip:"should = ~해야 한다. before it’s too late = 너무 늦기 전에."}
   ]},
  {no:"24", ko:"패트리샤 무어의 변장은 무죄", en:"Patricia Moore’s Experiment",
   task:"<b>Find</b> 노인들이 겪은 어려움 2가지와 패트리샤가 만든 디자인 2가지",
   note:["유니버설 디자인 이야기. 우리 주변의 ‘모두를 위한 디자인’ 예를 찾아보게 하세요 (자동문, 낮은 버스 등).","although(비록 ~지만), 형용사 + to부정사(easy to open), it was hard to ~(가주어)를 짚어 주세요."],
   lines:[
    {en:"There <v>was</v> <s>an American designer / named Patricia Moore</s>.", ko:"패트리샤 무어라는 이름의 미국인 디자이너가 있었다.", tip:"named ~ = ~라는 이름의."},
    {en:"One day, / <s>she</s> <v>had</v> <o>a fun idea</o>: / <s>She</s> <v>decided</v> <o>to act like an old woman</o>.", ko:"어느 날, 그녀에게 재미있는 생각이 떠올랐다. 그녀는 할머니처럼 행동하기로 결심했다.", tip:"decide to + 동사원형 = ~하기로 결심하다. 콜론(:) 뒤는 앞 내용의 설명."},
    {en:"Although she was only 26, / <s>she</s> <v>dressed up</v> / like an 80-year-old grandma!", ko:"비록 그녀는 겨우 26살이었지만, 80살 할머니처럼 변장했다!", tip:"Although + 주어 + 동사 = 비록 ~이지만. dress up = 변장하다. an 80-year-old (80은 모음 발음 → an)."},
    {en:"For three years, / <s>Patricia</s> <v>went</v> to many places / to see <o>what the world was like / for older people</o>.", ko:"3년 동안, 패트리샤는 나이 든 사람들에게 세상이 어떤지 보기 위해 많은 곳을 다녔다.", tip:"to see = 보기 위해. what A is like = A가 어떤지."},
    {en:"During her journey, / <s>she</s> <v>found</v> / <o>that many things were hard for them</o>.", ko:"그녀의 여정 동안, 그녀는 많은 것들이 그들에게 힘들다는 것을 알게 되었다.", tip:"during + 명사 = ~ 동안. find that ~ = ~라는 것을 알게 되다."},
    {en:"Sometimes / <s>it</s> <v>was</v> <c>difficult</c> / <s>to open doors</s>.", ko:"때로는 문을 여는 것이 어려웠다.", tip:"가주어 It, 진주어 to open doors."},
    {en:"Other times, / <s>it</s> <v>was</v> <c>hard</c> / <s>to pull a cart in stores</s>.", ko:"또 다른 때에는, 가게에서 카트를 끄는 것이 힘들었다.", tip:"Sometimes ~ Other times ~ = 때로는 ~ 또 다른 때에는 ~."},
    {en:"<s>Patricia</s> <v>wrote</v> <o>everything</o> down / in her diary.", ko:"패트리샤는 모든 것을 일기에 적었다.", tip:"write down = 적어 두다. write-wrote-written."},
    {en:"Then, / <s>Patricia</s> <v>had</v> <o>a great idea / to help</o>.", ko:"그러고 나서, 패트리샤는 도울 수 있는 좋은 아이디어를 떠올렸다.", tip:"an idea to help = 도울 아이디어 (to부정사가 명사 수식)."},
    {en:"<s>She</s> <v>designed</v> <o>jars / that were easy to open</o>.", ko:"그녀는 열기 쉬운 병을 디자인했다.", tip:"jars that were ~ (관계대명사). easy to open = 열기 쉬운 (형용사 + to부정사)."},
    {en:"<s>She</s> <v>made</v> <o>chairs / that were easy to sit in</o>.", ko:"그녀는 앉기 쉬운 의자를 만들었다.", tip:"easy to sit in — sit in a chair이므로 in까지!"},
    {en:"<s>Patricia’s ideas</s> <v>were</v> <c>great</c>!", ko:"패트리샤의 아이디어는 훌륭했다!", tip:"’s = ~의. 복수 주어 → were."},
    {en:"Now, / <s>people</s> <v>understand</v> / <o>that good design is not just about looking pretty</o>.", ko:"이제, 사람들은 좋은 디자인이 단지 예쁘게 보이는 것에 관한 것만은 아니라는 것을 이해한다.", tip:"not just about -ing = 단지 ~하는 것에 관한 것이 아닌."},
    {en:"<s>It</s> <v>is</v> also <c>about making life easier / for everyone</c>.", ko:"그것은 또한 모든 사람의 삶을 더 쉽게 만드는 것에 관한 것이다.", tip:"about + 동명사. make + O + 비교급(easier)."}
   ]}

  {title:"would · could · because of", sub:"~일 것이다 / ~할 수 있을 것이다 / ~ 때문에", formula:"<em>would / could</em> + 동사원형 | <em>because of</em> + 명사",
   ex:[["The city <mark>would have</mark> six man-made islands.","상상 속 계획"],["About 10,000 people <mark>could live</mark> there.","가능성"],["The sea level is rising <mark>because of</mark> global warming.","because of + 명사"]],

  {title:"although · 형용사 + to부정사", sub:"비록 ~지만 / ~하기에 …한", formula:"<em>Although</em> + 주어 + 동사 | <em>easy/hard</em> + to 동사원형",
   ex:[["<mark>Although</mark> she was only 26, she dressed up like an 80-year-old grandma!","비록 ~였지만"],["She designed jars that were <mark>easy to open</mark>.","열기 쉬운"],["<mark>It</mark> was hard <mark>to pull</mark> a cart in stores.","가주어 It"]],

{no:"09",
 passages:[
  {no:"25", ko:"낯선 개와 안전하게 인사하기", en:"How to Greet a Dog",
   task:"<b>Act</b> 낯선 개에게 인사하는 올바른 방법 3단계를 몸으로 표현하기",
   note:["질문: \"Why shouldn’t you smile at a strange dog?\" → Dogs show their teeth when they are ready to attack.","let + 목적어 + 동사원형, avoid + -ing, see A as B를 짚어 주세요."],
   lines:[
    {en:"How <v>do</v> <s>you</s> usually <v>greet</v> <o>a stranger</o>?", ko:"당신은 보통 낯선 사람에게 어떻게 인사하나요?", tip:"usually = 보통. greet = ~에게 인사하다. stranger = 낯선 사람."},
    {en:"<s>You</s> probably <v>make</v> <o>eye contact</o> / and <v>smile</v> / to show that you are friendly.", ko:"당신은 아마 친절하다는 것을 보여 주기 위해 눈을 마주치고 미소를 지을 것이다.", tip:"make eye contact = 눈을 마주치다. to show = 보여 주기 위해 (목적)."},
    {en:"<s>This</s> <v>works</v> fine / for people, / but not for dogs.", ko:"이것은 사람에게는 효과가 있지만, 개에게는 그렇지 않다.", tip:"work fine = 효과가 있다, 잘 통하다."},
    {en:"If you stare at a strange dog / or smile at it, / <s>the dog</s> <v>may think</v> / <o>you want to fight</o>.", ko:"만약 당신이 낯선 개를 빤히 보거나 그 개에게 미소를 지으면, 그 개는 당신이 싸우고 싶어 한다고 생각할지도 모른다.", tip:"stare at = 빤히 보다. may = ~할지도 모른다."},
    {en:"<s>Dogs</s> <v>show</v> <o>their teeth</o> / when they are ready to attack.", ko:"개는 공격할 준비가 되었을 때 이빨을 드러낸다.", tip:"be ready to + 동사원형 = ~할 준비가 되다. teeth = tooth의 복수."},
    {en:"<s>They</s> <v>may see</v> <o>eye contact</o> / as a threat.", ko:"그들은 눈 맞춤을 위협으로 볼 수도 있다.", tip:"see A as B = A를 B로 보다. threat = 위협."},
    {en:"So, / what <v>is</v> <s>the right way / to greet unfamiliar dogs</s>?", ko:"그렇다면, 낯선 개에게 인사하는 올바른 방법은 무엇일까?", tip:"the right way to + 동사원형 = ~하는 올바른 방법. unfamiliar = 낯선."},
    {en:"First, / <v>do not reach</v> <o>your hand</o> / toward them.", ko:"첫째, 그들을 향해 손을 뻗지 마라.", tip:"Do not + 동사원형 (부정 명령문). reach = 뻗다. toward = ~을 향해."},
    {en:"Instead, / <v>let</v> <o>them</o> <c>come to you</c>.", ko:"대신, 그들이 당신에게 오게 하라.", tip:"let + 목적어 + 동사원형 = ~가 …하게 하다 (사역동사)."},
    {en:"Second, / <v>avoid</v> <o>touching their head or face</o> / because many dogs don’t like it.", ko:"둘째, 많은 개들이 싫어하기 때문에 그들의 머리나 얼굴을 만지는 것을 피하라.", tip:"avoid + -ing = ~하는 것을 피하다 (to ✕)."},
    {en:"<s>You</s> <v>can touch</v> <o>their side or shoulder</o> / if their owner says it’s okay.", ko:"주인이 괜찮다고 하면 그들의 옆구리나 어깨를 만져도 된다.", tip:"can = ~해도 된다 (허락). owner = 주인."},
    {en:"Finally, / <v>stay</v> <c>calm</c> / and <v>move</v> slowly / around them.", ko:"마지막으로, 침착함을 유지하고 그들 주위에서 천천히 움직여라.", tip:"stay + 형용사 = ~한 상태를 유지하다. slow → slowly."},
    {en:"This way, / <s>the dog</s> <v>will feel</v> <c>safe</c> / and <v>trust</v> <o>you</o>.", ko:"이렇게 하면, 그 개는 안전하다고 느끼고 당신을 믿을 것이다.", tip:"feel + 형용사. will 뒤에 동사원형 두 개(feel, trust)."}
   ]},
  {no:"26", ko:"빙하를 추모합니다", en:"A Funeral for a Glacier",
   task:"<b>Cause & Effect</b> 빙하가 녹으면 일어나는 일 3가지 연결하기",
   note:["질문: \"Why do people hold a glacier funeral?\" → to say goodbye and to learn about global warming.","get + 비교급(getting warmer, gets higher), remind + O + to부정사, help + O + 동사원형을 짚어 주세요."],
   lines:[
    {en:"<s>A glacier</s> <v>is</v> <c>a big piece of ice / that moves very slowly</c>.", ko:"빙하는 매우 천천히 움직이는 큰 얼음덩어리이다.", tip:"a piece of ice = 얼음 한 조각. that = 주격 관계대명사."},
    {en:"<s>You</s> <v>can find</v> <o>glaciers</o> / on snowy mountains / or near the North and South Poles.", ko:"빙하는 눈 덮인 산이나 북극과 남극 근처에서 찾을 수 있다.", tip:"snowy = 눈 덮인. the North/South Pole = 북극/남극."},
    {en:"But now, / <s>many glaciers</s> <v>are melting</v>.", ko:"하지만 지금, 많은 빙하가 녹고 있다.", tip:"현재진행형. melt = 녹다."},
    {en:"<s>This</s> <v>is</v> / <c>because the Earth is getting warmer</c>.", ko:"이것은 지구가 점점 더 따뜻해지고 있기 때문이다.", tip:"This is because ~ = 이것은 ~ 때문이다. get + 비교급 = 점점 ~해지다."},
    {en:"When glaciers melt, / <s>the water</s> <v>goes</v> / into the ocean.", ko:"빙하가 녹으면, 그 물은 바다로 들어간다.", tip:"go into ~ = ~ 안으로 들어가다."},
    {en:"Then, / <s>the sea level</s> <v>gets</v> <c>higher</c>.", ko:"그러면, 해수면이 더 높아진다.", tip:"get + 비교급. sea level = 해수면."},
    {en:"<s>Some cities near the ocean</s> <v>might go</v> underwater.", ko:"바다 근처의 몇몇 도시들은 물에 잠길지도 모른다.", tip:"might = ~할지도 모른다. go underwater = 물에 잠기다."},
    {en:"<s>Animals like polar bears</s> <v>are losing</v> <o>their homes</o>.", ko:"북극곰 같은 동물들은 그들의 집을 잃고 있다.", tip:"like + 명사 = ~ 같은. lose = 잃다."},
    {en:"<s>Sea animals</s> <v>swim</v> far away / to find cold water.", ko:"바다 동물들은 차가운 물을 찾기 위해 멀리 헤엄쳐 간다.", tip:"to find = 찾기 위해 (목적)."},
    {en:"<s>People</s> <v>are</v> <c>sad</c> / about the melting ice.", ko:"사람들은 녹고 있는 얼음에 대해 슬퍼한다.", tip:"melting ice = 녹고 있는 얼음 (현재분사)."},
    {en:"So, / <s>they</s> <v>hold</v> <o>a “glacier funeral.”</o>", ko:"그래서, 그들은 ‘빙하 장례식’을 치른다.", tip:"hold = (행사를) 치르다, 개최하다. funeral = 장례식."},
    {en:"<s>This</s> <v>is</v> <c>a special event / to say goodbye to a glacier</c>.", ko:"이것은 빙하에게 작별 인사를 하기 위한 특별한 행사이다.", tip:"an event to + 동사원형 = ~하기 위한 행사 (to부정사가 명사 수식)."},

 passages:[
  {no:"28", ko:"신발 한 짝을 던졌다고?", en:"Gandhi’s Other Shoe",

    {en:"Unfortunately, / <s>one of his shoes</s> <v>slipped off</v> / and <v>fell off</v> <o>the train</o>.", ko:"불행히도, 그의 신발 한 짝이 벗겨져서 기차 밖으로 떨어졌다.", tip:"one of + 복수 명사 → 단수 취급. slip off = 벗겨지다. fall off = 떨어지다."},
    {en:"Since the train had just started moving, / <s>he</s> <v>could not get</v> <o>it</o> back.", ko:"기차가 막 움직이기 시작했기 때문에, 그는 그것을 되찾을 수 없었다.", tip:"Since = ~이기 때문에. had just started = 과거완료 (그보다 직전에). get A back = 되찾다."},
    {en:"But / <s>the man</s> <v>didn’t seem</v> <c>upset</c>.", ko:"하지만 그 남자는 속상해 보이지 않았다.", tip:"seem + 형용사 = ~해 보이다. upset = 속상한."},
    {en:"Instead, / <s>he</s> calmly <v>took off</v> <o>his other shoe</o> / and <v>threw</v> <o>it</o> / close to the first shoe.", ko:"대신, 그는 침착하게 다른 한 짝을 벗어서 첫 번째 신발 가까이에 던졌다.", tip:"take off = 벗다 ↔ put on. throw-threw-thrown. close to ~ = ~ 가까이에."},
    {en:"<s>His friend</s> <v>asked</v>, / “Why did you do that?”", ko:"그의 친구가 물었다. “왜 그렇게 했어?”", tip:"Why did you + 동사원형?"},

    {en:"Now / <s>someone</s> <v>can find</v> <o>both shoes</o> / and <v>wear</v> <o>them</o>.”", ko:"이제 누군가가 신발 두 짝을 다 찾아서 신을 수 있잖아.”", tip:"both + 복수 명사 = 둘 다. wear = 신다, 입다."},
    {en:"<s>The man</s> <v>was</v> <c>Mahatma Gandhi, the great Indian leader</c>.", ko:"그 남자는 위대한 인도의 지도자, 마하트마 간디였다.", tip:"Mahatma Gandhi = the great Indian leader (동격)."},

    {en:"<s>He</s> <v>thought</v> / <o>that even a small act of kindness / could change someone’s life</o>.", ko:"그는 작은 친절한 행동조차도 누군가의 삶을 바꿀 수 있다고 생각했다.", tip:"an act of kindness = 친절한 행동. even = ~조차도."},
    {en:"What small act of kindness / <v>can</v> <s>you</s> <v>do</v> / today?", ko:"당신은 오늘 어떤 작은 친절을 베풀 수 있나요?", tip:"What + 명사 + can you do? = 어떤 ~을 할 수 있나요?"},

   ]},

try{const raw=localStorage.getItem("rb_lv4");if(raw){const o=JSON.parse(raw);if(o&&o.teams)S={...S,teams:o.teams,count:o.count||3,u:Math.min(UNITS.length-1,o.u||0)};}}catch(e){}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LBL={s:"S",v:"V",o:"O",c:"C"};
function markup(en){
  return en.replace(/<(s|v|o|c)>(.*?)<\/\1>/g,(m,t,x)=>`<span class="t-${t}" data-l="${LBL[t]}">${x}</span>`)
           .replace(/ \/ /g,' <i class="sl">/</i> ');
}
const plain=en=>en.replace(/<[^>]+>/g,"").replace(/ \/ /g," ");
function head(sl,title){
  const tag=sl.comeup?'<span class="comeup">COME UP!</span>':(sl.team?'<span class="team-tag">TEAM GAME</span>':'');
  return `<div class="top"><span class="sec">${esc(sl.sec)}</span>${sl.min?`<span class="min">${sl.min}</span>`:""}${tag}</div>${title?`<h2>${title}</h2>`:""}`;
}
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};

/* ========== INITS ========== */
const INIT={
 title(el){el.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>setUnit(+b.dataset.unit,0))},
 plan(el){
  el.querySelectorAll("[data-cnt]").forEach(b=>b.onclick=()=>{S.count=+b.dataset.cnt;save();renderScore();go(S.i)});
  el.querySelector("#resetScore").onclick=()=>{S.teams.forEach(t=>t.s=0);save();renderScore()};
 },
 riddle(el){
  let k=0;const cl=el.querySelectorAll(".clue");
  el.querySelector("#nextClue").onclick=()=>{if(k<cl.length){cl[k].classList.remove("hide");k++}};
  el.querySelector("#showAns").onclick=()=>{cl.forEach(c=>c.classList.remove("hide"));k=cl.length;el.querySelector("#ans").hidden=false};
 },
 vocab(el){
  const grid=el.querySelector("#vgrid");let all=false;
  const show=no=>{grid.innerHTML=(U.words[no]||[]).map(w=>`<button class="vc ${all?"flip":""}"><span class="en">${w[0]}</span><span class="ko" ${all?"":"hidden"}>${w[1]}</span></button>`).join("");
    grid.querySelectorAll(".vc").forEach(c=>c.onclick=()=>{const k=c.querySelector(".ko");k.hidden=!k.hidden;c.classList.toggle("flip",!k.hidden)});};
  el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{el.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("on"));b.classList.add("on");show(b.dataset.tab)});
  el.querySelector("#flipAll").onclick=e=>{all=!all;e.currentTarget.classList.toggle("on",all);show(el.querySelector("[data-tab].on").dataset.tab)};
  show(U.passages[0].no);
 },
 speed(el){
  const pool=[];Object.entries(U.words).forEach(([no,ws])=>ws.forEach(w=>pool.push([...w,no])));
  const order=shuffle(pool.map((_,i)=>i));let k=-1,cur=null;
  el.querySelector("#spNext").onclick=()=>{k=(k+1)%order.length;cur=pool[order[k]];
    el.querySelector("#spQ").textContent=cur[1];el.querySelector("#spA").textContent="";el.querySelector("#spFrom").textContent=`지문 ${cur[2]} · ${k+1}번째`;};
  el.querySelector("#spReveal").onclick=()=>{if(cur)el.querySelector("#spA").textContent=cur[0]};
 },
 passage(el,sl){
  const pt=el.querySelector("#ptext"),p=U.passages[sl.p],tip=el.querySelector("#tip");let koAll=false;
  el.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{el.querySelectorAll("[data-m]").forEach(x=>x.classList.remove("on"));b.classList.add("on");pt.className="ptext mode-"+b.dataset.m});
  pt.querySelectorAll(".sn").forEach(s=>s.onclick=()=>{
    const i=+s.dataset.i,k=pt.querySelector(`[data-k="${i}"]`),was=s.classList.contains("sel");
    pt.querySelectorAll(".sn").forEach(x=>x.classList.remove("sel"));
    if(!koAll)pt.querySelectorAll(".ko-line").forEach(x=>x.hidden=true);
    if(!was){s.classList.add("sel");k.hidden=false;
      tip.innerHTML=`<h5>구문 포인트 · 문장 ${i+1}</h5><div class="en">${esc(plain(p.lines[i].en))}</div>${p.lines[i].tip}`;}
  });
  const kb=el.querySelector("#koAll");
  kb.onclick=()=>{koAll=!koAll;kb.classList.toggle("on",koAll);pt.querySelectorAll(".ko-line").forEach(x=>x.hidden=!koAll)};
  let fs=parseInt(pt.style.fontSize);
  while(pt.scrollHeight>pt.clientHeight+2&&fs>20){fs--;pt.style.fontSize=fs+"px"}
  el.querySelector("#fsUp").onclick=()=>{fs=Math.min(48,fs+2);pt.style.fontSize=fs+"px"};
  el.querySelector("#fsDown").onclick=()=>{fs=Math.max(18,fs-2);pt.style.fontSize=fs+"px"};
 },
 grammar(el){el.querySelectorAll(".fix").forEach(f=>f.onclick=()=>{f.classList.toggle("show");f.querySelector(".hint").hidden=f.classList.contains("show")})},
 hunt(el,sl){
  const H=sl.act.items;let k=0;const hs=el.querySelector("#hs"),V=el.querySelector("#hV");
  const load=()=>{const h=H[k];hs.innerHTML=h.w.map((w,i)=>`<button class="tok" data-i="${i}">${w}</button>`).join("");V.textContent="";
    el.querySelector("#hN").textContent=`${k+1} / ${H.length}`;
    hs.querySelectorAll(".tok").forEach(t=>t.onclick=()=>t.classList.toggle("pick"));};
  el.querySelector("#hCheck").onclick=()=>{const h=H[k];let wrong=0,miss=0;
    hs.querySelectorAll(".tok").forEach(t=>{const i=+t.dataset.i,isV=h.v.includes(i),p=t.classList.contains("pick");
      t.classList.remove("pick");if(isV&&p)t.classList.add("ok");else if(isV){t.classList.add("miss");miss++}else if(p){t.classList.add("no");wrong++}});
    V.style.color=(wrong||miss)?"var(--bad)":"var(--good)";
    V.textContent=wrong?"아쉬워요! 정답이 아닌 단어를 골랐어요 (0점)":miss?"점선 단어도 정답이에요 (+1)":"Perfect! (+2)";};
  el.querySelector("#hNext").onclick=()=>{k=(k+1)%H.length;load()};
  load();
 },
 role(el){const sc=el.querySelector(".script");let fs=36;while(sc.scrollHeight>sc.clientHeight+2&&fs>18){fs--;sc.style.fontSize=fs+"px";if(fs<30)sc.style.gap="6px"}},
 flip(el){el.querySelectorAll(".fc").forEach(c=>c.onclick=()=>c.classList.toggle("open"))},
 ox(el,sl){
  const X=sl.act.items;let k=0;
  const load=()=>{el.querySelector("#oxN").textContent=`Q${k+1} / ${X.length}`;el.querySelector("#oxQ").textContent=X[k][0];el.querySelector("#oxA").innerHTML=""};
  el.querySelector("#oxReveal").onclick=()=>{const x=X[k];el.querySelector("#oxA").innerHTML=`<span class="mk" style="color:${x[1]==="O"?"var(--good)":"var(--bad)"}">${x[1]}</span><span class="why">근거 문장<br><b style="color:var(--ink);font-family:var(--f-read)">${esc(x[2])}</b></span>`};
  el.querySelector("#oxNext").onclick=()=>{k=(k+1)%X.length;load()};
  load();
 },
 scramble(el,sl){
  const SC=sl.act.items;let k=0,picked=[],words=[];const slot=el.querySelector("#scSlot"),pool=el.querySelector("#scPool"),V=el.querySelector("#scV");
  const draw=()=>{slot.className="slot";slot.innerHTML=picked.map(i=>`<span class="tok">${words[i]}</span>`).join("");
    pool.querySelectorAll(".tok").forEach(t=>t.disabled=picked.includes(+t.dataset.i));};
  const load=()=>{const it=SC[k];words=it[0].split(" ");picked=[];V.textContent="";
    el.querySelector("#scKo").textContent=it[1];el.querySelector("#scN").textContent=`${k+1} / ${SC.length}`;
    let ord;do{ord=shuffle(words.map((_,i)=>i))}while(ord.every((v,i)=>v===i)&&words.length>1);
    pool.innerHTML=ord.map(i=>`<button class="tok" data-i="${i}">${words[i]}</button>`).join("");
    pool.querySelectorAll(".tok").forEach(t=>t.onclick=()=>{picked.push(+t.dataset.i);draw()});draw();};
  el.querySelector("#scUndo").onclick=()=>{picked.pop();draw();V.textContent=""};
  el.querySelector("#scCheck").onclick=()=>{const ok=picked.map(i=>words[i]).join(" ")===SC[k][0];
    slot.classList.add(ok?"ok":"bad");V.style.color=ok?"var(--good)":"var(--bad)";V.textContent=ok?"정답! (+2)":"다시 해 볼까요?"};
  el.querySelector("#scNext").onclick=()=>{k=(k+1)%SC.length;load()};
  el.querySelector("#scT").onclick=()=>openTimer(30,true);
  load();
 },
 battle(el){
  const B=U.battle,nav=el.querySelectorAll("[data-q]");let cur=-1;
  const pick=i=>{cur=i;const b=B[i];nav.forEach(x=>x.classList.remove("cur"));nav[i].classList.add("cur","done");
    el.querySelector("#qT").textContent=`Q${i===B.length-1?"★":i+1} · ${b.t} · ${b.p}점`;
    el.querySelector("#qQ").innerHTML=b.q;el.querySelector("#qA").innerHTML="";
    el.querySelector("#qAward").innerHTML=`<span>정답 팀:</span>`+S.teams.slice(0,S.count).map((t,j)=>`<button data-aw="${j}" style="background:${TEAM_COLORS[j]}">${esc(t.n)} +${b.p}</button>`).join("");
    el.querySelectorAll("[data-aw]").forEach(a=>a.onclick=()=>{addScore(+a.dataset.aw,b.p);a.disabled=true;a.style.opacity=.4});};
  nav.forEach(n=>n.onclick=()=>pick(+n.dataset.q));
  el.querySelector("#qReveal").onclick=()=>{if(cur<0)return;const b=B[cur];el.querySelector("#qA").innerHTML=`${esc(b.a)}<small>${b.k}</small>`};
 }
};

/* ========== SCOREBOARD ========== */
function renderScore(){
  let box=document.getElementById("score");
  if(!box){box=document.createElement("div");box.id="score";stage.appendChild(box)}
  box.hidden=!S.scoreOn;
  box.innerHTML=S.teams.slice(0,S.count).map((t,i)=>`<div class="tm" id="tm${i}" style="border-color:${TEAM_COLORS[i]}"><span class="dot" style="background:${TEAM_COLORS[i]}"></span><b contenteditable="true" spellcheck="false" data-nm="${i}">${esc(t.n)}</b><span class="pt">${t.s}</span><button data-d="${i}" aria-label="${esc(t.n)} 점수 빼기">−</button><button data-u="${i}" aria-label="${esc(t.n)} 점수 더하기">+</button></div>`).join("");
  box.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>addScore(+b.dataset.u,1));
  box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>addScore(+b.dataset.d,-1));
  box.querySelectorAll("[data-nm]").forEach(b=>{b.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();b.blur()}e.stopPropagation()};
    b.onblur=()=>{S.teams[+b.dataset.nm].n=b.textContent.trim().slice(0,12)||`Team ${"ABCD"[+b.dataset.nm]}`;save();renderScore()}});
  document.getElementById("bScore").classList.toggle("on",S.scoreOn);
}
function addScore(i,d){S.teams[i].s=Math.max(0,S.teams[i].s+d);save();renderScore();const el=document.getElementById("tm"+i);if(el&&d>0)el.classList.add("bump");
  if(SLIDES[S.i].type==="exit")go(S.i);}

/* ========== TIMER ========== */
let tInt=null;
function openTimer(sec,autostart){
  closeOv();const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML=`<button class="ov-x" id="ovx">닫기 ✕</button><div class="ov-card"><div id="tDigits">0:00</div>
   <div class="row">${[30,60,90,120,180].map(s=>`<button class="chip" data-s="${s}">${s<60?s+"초":s/60+"분"}</button>`).join("")}</div>
   <div class="row"><button class="big-btn" id="tGo">시작</button><button class="ghost" id="tStop">일시정지</button></div></div>`;
  stage.appendChild(ov);let left=sec||60,run=false;const D=ov.querySelector("#tDigits");
  const paint=()=>{D.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;D.classList.toggle("urgent",left<=5)};
  const stop=()=>{clearInterval(tInt);tInt=null;run=false};
  const start=()=>{if(run||left<=0)return;run=true;tInt=setInterval(()=>{left--;paint();if(left<=0){stop();beep()}},1000)};
  ov.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{stop();left=+b.dataset.s;paint()});
  ov.querySelector("#tGo").onclick=start;ov.querySelector("#tStop").onclick=stop;ov.querySelector("#ovx").onclick=closeOv;
  paint();if(autostart)start();
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}

/* ========== RANDOM PICKER ========== */
let classSize=12;
function openPick(){
  closeOv();const ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML=`<button class="ov-x" id="ovx">닫기 ✕</button><div class="ov-card"><div id="pickOut">?</div><div id="pickSub" style="font-size:22px;color:var(--muted)">팀 또는 번호를 뽑아요</div>
   <div class="row"><button class="big-btn" id="pkTeam">팀 뽑기</button><button class="big-btn" id="pkNum">번호 뽑기</button></div>
   <div class="row" style="align-items:center;font-size:20px"><span>학생 수</span><button class="chip" id="cMinus">−</button><b id="cSize" style="font-size:28px;min-width:44px;text-align:center">${classSize}</b><button class="chip" id="cPlus">+</button></div></div>`;
  stage.appendChild(ov);const out=ov.querySelector("#pickOut"),sub=ov.querySelector("#pickSub");
  const roll=(list,colorFn)=>{let n=0;const it=setInterval(()=>{const r=Math.floor(Math.random()*list.length);out.textContent=list[r];out.style.color=colorFn?colorFn(r):"";if(++n>14)clearInterval(it)},70)};
  ov.querySelector("#pkTeam").onclick=()=>{sub.textContent="이번 차례 팀";roll(S.teams.slice(0,S.count).map(t=>t.n),r=>TEAM_COLORS[r])};
  ov.querySelector("#pkNum").onclick=()=>{sub.textContent="나와 주세요!";roll(Array.from({length:classSize},(_,i)=>i+1+"번"))};
  ov.querySelector("#cMinus").onclick=()=>{classSize=Math.max(2,classSize-1);ov.querySelector("#cSize").textContent=classSize};
  ov.querySelector("#cPlus").onclick=()=>{classSize=Math.min(40,classSize+1);ov.querySelector("#cSize").textContent=classSize};
  ov.querySelector("#ovx").onclick=closeOv;
}
function closeOv(){const o=document.getElementById("ov");if(o)o.remove();clearInterval(tInt);tInt=null}

/* ========== NOTES ========== */
function renderNotes(){
  let n=document.getElementById("notes");
  if(!S.notes){if(n)n.remove();document.getElementById("bNotes").classList.remove("on");return}
  if(!n){n=document.createElement("div");n.id="notes";stage.appendChild(n)}
  const sl=SLIDES[S.i];n.innerHTML=`<h4>강사 노트 · Unit ${U.no} · ${esc(sl.sec)} ${sl.min?"· "+sl.min:""}</h4>`+sl.note.map(x=>`<p>${esc(x)}</p>`).join("");
  document.getElementById("bNotes").classList.add("on");
}

/* ========== NAV ========== */
const sel=document.getElementById("unitSel");
sel.innerHTML=UNITS.map((x,i)=>`<option value="${i}">Unit ${x.no}</option>`).join("");
sel.onchange=()=>setUnit(+sel.value,0);
function setUnit(u,i){S.u=u;U=UNITS[u];SLIDES=buildSlides(U);sel.value=u;save();go(i)}
function go(i){
  S.i=Math.max(0,Math.min(SLIDES.length-1,i));const sl=SLIDES[S.i];
  closeOv();
  stage.innerHTML=R[sl.type](sl);
  const el=stage.querySelector(".slide");if(INIT[sl.type])INIT[sl.type](el,sl);
  renderScore();renderNotes();
  document.getElementById("counter").textContent=`${S.i+1} / ${SLIDES.length}`;
  try{history.replaceState(null,"",`#u${U.no.replace(/^0/,"")}-s${S.i+1}`)}catch(e){}
}
function fit(){const vp=document.getElementById("viewport");const s=Math.min(vp.clientWidth/1600,vp.clientHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener("resize",fit);
document.getElementById("bPrev").onclick=()=>go(S.i-1);
document.getElementById("bNext").onclick=()=>go(S.i+1);
document.getElementById("bScore").onclick=()=>{S.scoreOn=!S.scoreOn;renderScore()};
document.getElementById("bTimer").onclick=()=>openTimer(60,false);
document.getElementById("bPick").onclick=openPick;
document.getElementById("bNotes").onclick=()=>{S.notes=!S.notes;renderNotes()};
document.getElementById("bFull").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
addEventListener("keydown",e=>{
  if(e.target.isContentEditable||e.target.tagName==="SELECT")return;
  if(["ArrowRight","PageDown"].includes(e.key)){go(S.i+1);e.preventDefault()}
  else if(["ArrowLeft","PageUp"].includes(e.key)){go(S.i-1);e.preventDefault()}
  else if(e.key==="n"||e.key==="N"){S.notes=!S.notes;renderNotes()}
  else if(e.key==="Escape")closeOv();
});
const hm=location.hash.match(/^#u(\d+)-s(\d+)$/), hs1=location.hash.match(/^#s(\d+)$/);
if(hm){const ui=UNITS.findIndex(x=>+x.no===+hm[1]);setUnit(ui<0?S.u:ui,+hm[2]-1)}
else setUnit(S.u,hs1?+hs1[1]-1:0);
fit();
</script>

</body>
