<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader's Bank Level 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one 1600×900 classroom-board stage scaled to fit; a control rail below it. Ink-on-paper reading lab, S/V/O/C colors carry grammar meaning. */
:root{
  --paper:#EEF3F1; --card:#FFFFFF; --ink:#132E2A; --muted:#5A6F6A; --line:#CFDCD7; --soft:#E2EAE7;
  --accent:#E39B2E; --accent-ink:#6E4300; --accent-soft:#FBEBD2;
  --s:#2563C9; --v:#D23C33; --o:#17905F; --c:#8646C9;
  --tA:#E4572E; --tB:#2E86AB; --tC:#3E9D4F; --tD:#9B5DE5;
  --good:#17905F; --bad:#D23C33;
  --rail:#132E2A; --rail-fg:#EEF3F1;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-read:"Atkinson Hyperlegible", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-ko:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1917; --card:#16241F; --ink:#E4EEEA; --muted:#93A9A2; --line:#284540; --soft:#1C2E29;
  --accent:#F0B356; --accent-ink:#FFD99A; --accent-soft:#3A2C14;
  --s:#6EA2FF; --v:#FF7A70; --o:#4FD39C; --c:#C08CFF;
  --good:#4FD39C; --bad:#FF7A70; --rail:#08110F; --rail-fg:#E4EEEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1917; --card:#16241F; --ink:#E4EEEA; --muted:#93A9A2; --line:#284540; --soft:#1C2E29;
  --accent:#F0B356; --accent-ink:#FFD99A; --accent-soft:#3A2C14;
  --s:#6EA2FF; --v:#FF7A70; --o:#4FD39C; --c:#C08CFF;
  --good:#4FD39C; --bad:#FF7A70; --rail:#08110F; --rail-fg:#E4EEEA; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ko);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#viewport{flex:1;position:relative;min-height:0}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center center;background:var(--card);
  border:1px solid var(--line);border-radius:10px;overflow:hidden}
.slide{position:absolute;inset:0;padding:56px 72px 60px;display:flex;flex-direction:column;gap:22px}

/* rail */
#rail{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding-block:8px;flex-wrap:wrap;justify-content:center}
.rb{background:var(--rail);color:var(--rail-fg);border:0;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.rb.on{background:var(--accent);color:#1d1300}
#unitSel{appearance:none;-webkit-appearance:none;padding-right:14px;font-weight:700}
#counter{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:64px;text-align:center}

/* header in slide */
.top{display:flex;align-items:center;gap:16px;min-height:44px;padding-right:420px}
.sec{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.min{font-size:16px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:99px;padding:5px 14px;font-variant-numeric:tabular-nums}
.comeup{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.1em;color:#fff;background:var(--v);padding:6px 14px;border-radius:6px;transform:rotate(-2deg)}
.team-tag{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.1em;color:#fff;background:var(--s);padding:6px 14px;border-radius:6px;transform:rotate(1.5deg)}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:54px;font-weight:800;line-height:1.05}
h2 small{display:block;font-family:var(--f-ko);font-size:24px;font-weight:500;color:var(--muted);margin-top:8px;letter-spacing:0}
.body{flex:1;min-height:0;display:flex;gap:36px}

/* scoreboard (inside stage, top-right) */
#score{position:absolute;top:18px;right:20px;display:flex;gap:8px;z-index:20}
.tm{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:5px 6px 5px 12px}
.tm b{font-family:var(--f-display);font-size:16px}
.tm .pt{font-family:var(--f-display);font-weight:800;font-size:28px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.tm button{width:30px;height:30px;border-radius:7px;border:0;background:var(--soft);font-size:18px;font-weight:700;line-height:1}
.tm .dot{width:12px;height:12px;border-radius:50%}
.tm.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.12)}}

/* overlays inside stage */
.ov{position:absolute;inset:0;background:color-mix(in srgb,var(--paper) 88%,transparent);z-index:40;display:flex;align-items:center;justify-content:center}
.ov-card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:40px 56px;display:flex;flex-direction:column;align-items:center;gap:22px;min-width:640px}
.ov-x{position:absolute;top:22px;right:26px;border:0;background:var(--soft);border-radius:10px;padding:10px 16px;font-size:18px}
#tDigits{font-family:var(--f-display);font-weight:800;font-size:220px;line-height:1;font-variant-numeric:tabular-nums}
#tDigits.urgent{color:var(--v)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 18px;font-size:20px;font-weight:700}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.big-btn{border:0;background:var(--accent);color:#1d1300;border-radius:12px;padding:14px 28px;font-size:22px;font-weight:700}
.ghost{border:2px solid var(--line);background:transparent;border-radius:12px;padding:12px 24px;font-size:20px;font-weight:700}
#pickOut{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1}

/* notes drawer */
#notes{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--card);padding:22px 72px 26px;font-size:21px;line-height:1.6;max-height:330px;overflow:auto}
#notes h4{margin:0 0 6px;font-size:15px;letter-spacing:.12em;color:var(--accent);font-family:var(--f-display)}
#notes p{margin:0 0 6px}

/* title slide */
.title-slide{justify-content:space-between}
.ttl-book{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ttl-main{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.03em}
.ttl-main span{color:var(--accent)}
.ttl-units{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ttl-units b{font-size:20px;margin-right:6px}
.ttl-list{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ttl-item{border-top:4px solid var(--ink);padding-top:14px}
.ttl-item .n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent-ink)}
.ttl-item .k{font-size:30px;font-weight:700;margin-top:4px}
.ttl-item .e{font-family:var(--f-read);font-size:20px;color:var(--muted)}
.credit{font-size:17px;color:var(--muted)}

/* plan */
.timeline{display:flex;gap:6px;align-items:stretch;height:150px}
.tl{border-radius:10px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;background:var(--soft);min-width:0}
.tl .m{font-family:var(--f-display);font-weight:800;font-size:28px}
.tl .l{font-size:17px;font-weight:700;line-height:1.3}
.tl.game{background:var(--accent-soft)}
.teamset{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;font-size:22px;line-height:1.5}
.rules div{border-left:5px solid var(--accent);padding-left:16px}
.rules b{display:block;font-size:24px}

/* riddle */
.clues{display:flex;flex-direction:column;gap:14px;flex:1}
.clue{font-family:var(--f-read);font-size:44px;font-weight:700;padding:16px 26px;border-radius:12px;background:var(--soft);display:flex;gap:20px;align-items:center}
.clue .pts{font-family:var(--f-display);font-size:20px;background:var(--ink);color:var(--card);border-radius:99px;padding:4px 14px;white-space:nowrap}
.clue.hide{color:transparent;background:repeating-linear-gradient(-45deg,var(--soft),var(--soft) 14px,var(--paper) 14px,var(--paper) 28px)}
.clue.hide .pts{opacity:.5}
.answer{font-family:var(--f-display);font-weight:800;font-size:72px;color:var(--o)}

/* vocab */
.tabs{display:flex;gap:10px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 20px;font-size:20px;font-weight:700}
.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.vgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;flex:1;align-content:start;overflow:auto}
.vc{height:86px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center}
.vc .en{font-family:var(--f-read);font-weight:700;font-size:26px;line-height:1.1}
.vc .ko{font-size:18px;font-weight:500;color:var(--muted);line-height:1.25}
.vc.flip{background:var(--accent-soft);border-color:var(--accent)}
.vc.flip .ko{color:var(--accent-ink);font-weight:700}

.speed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.speed .q{font-size:88px;font-weight:700;text-align:center;line-height:1.15}
.speed .a{font-family:var(--f-read);font-weight:700;font-size:110px;color:var(--o);min-height:130px}
.speed .from{font-size:20px;color:var(--muted)}

/* passage */
.pwrap{display:grid;grid-template-columns:1fr 420px;gap:34px;flex:1;min-height:0}
.ptext{overflow:auto;padding-right:10px;font-family:var(--f-read);line-height:2.15}
.ptext .ln{display:block;color:var(--muted);font-weight:700}
.sn{border-radius:8px;padding:2px 4px;cursor:pointer;transition:background .15s}
.sn:hover{background:var(--soft)}
.sn.sel{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.ko-line{display:block;font-family:var(--f-ko);font-size:.62em;line-height:1.5;color:var(--accent-ink);margin:-4px 0 10px 4px}
.sl{display:none;font-style:normal;color:var(--accent);font-weight:700;padding:0 .15em}
.mode-chunk .sl,.mode-sv .sl{display:inline}
.mode-sv [class^="t-"]{position:relative;font-weight:700;border-bottom:3px solid currentColor}
.mode-sv .t-s{color:var(--s)} .mode-sv .t-v{color:var(--v)} .mode-sv .t-o{color:var(--o)} .mode-sv .t-c{color:var(--c)}
.mode-sv [class^="t-"]::after{content:attr(data-l);position:absolute;left:0;top:-1.05em;font-family:var(--f-display);font-size:.42em;font-weight:800;line-height:1;letter-spacing:.04em}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--soft);padding:6px;border-radius:12px}
.seg button{border:0;background:transparent;border-radius:8px;padding:12px 4px;font-size:19px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;font-size:17px;font-weight:700}
.tools button.on{border-color:var(--accent);background:var(--accent-soft)}
.tip{flex:1;border-radius:14px;background:var(--soft);padding:20px 22px;font-size:22px;line-height:1.55;overflow:auto}
.tip h5{margin:0 0 8px;font-size:15px;letter-spacing:.12em;color:var(--muted);font-family:var(--f-display)}
.tip .en{font-family:var(--f-read);font-weight:700;font-size:23px;margin-bottom:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:16px;font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.task{border:2px dashed var(--accent);border-radius:12px;padding:12px 16px;font-size:19px;line-height:1.45}
.task b{color:var(--accent-ink)}

/* grammar */
.gwrap{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;flex:1;min-height:0}
.formula{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.25;padding:22px 28px;border-radius:14px;background:var(--ink);color:var(--card)}
.formula em{font-style:normal;color:var(--accent)}
.gcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.ex{font-family:var(--f-read);font-size:29px;line-height:1.45;padding:8px 0;border-bottom:1px solid var(--line)}
.ex .k{display:block;font-family:var(--f-ko);font-size:19px;color:var(--muted)}
.ex mark{background:none;color:var(--v);font-weight:700;border-bottom:3px solid var(--v)}
.gnote{font-size:21px;line-height:1.55;background:var(--soft);border-radius:12px;padding:16px 20px}
.fix{border:2px solid var(--line);border-radius:14px;padding:14px 20px;cursor:pointer;text-align:left;background:var(--card);display:flex;flex-direction:column;gap:6px;width:100%}
.fix .w{font-family:var(--f-read);font-size:29px;font-weight:700;text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:3px}
.fix .r{font-family:var(--f-read);font-size:29px;font-weight:700;color:var(--good);display:none}
.fix .why{font-size:18px;color:var(--muted);display:none}
.fix.show .r,.fix.show .why{display:block}
.fix.show .w{opacity:.45}
.fix .hint{font-size:16px;color:var(--muted)}

/* hunter */
.hunt{flex:1;display:flex;flex-direction:column;gap:26px;justify-content:center}
.hs{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--f-read);font-size:52px;font-weight:700}
.tok{border:3px solid transparent;background:var(--soft);border-radius:12px;padding:6px 16px}
.tok.pick{border-color:var(--accent);background:var(--accent-soft)}
.tok.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card));color:var(--good)}
.tok.miss{border-color:var(--good);border-style:dashed}
.tok.no{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.hctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verdict{font-size:26px;font-weight:700}

/* flip cards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1}
.fc{border-radius:16px;border:3px solid var(--ink);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;padding:12px;text-align:center}
.fc .no{position:absolute;top:10px;left:14px;font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted)}
.fc .p{font-family:var(--f-read);font-weight:700;font-size:52px;line-height:1.15}
.fc .pa{font-family:var(--f-read);font-weight:700;font-size:52px;color:var(--v);display:none;line-height:1.15}
.fc .kind{font-size:17px;color:var(--muted);display:none}
.fgrid.small .p{font-size:32px}
.fgrid.small .pa{font-size:40px}
.fc.open{background:var(--accent-soft);border-color:var(--accent)}
.fc.open .p{font-size:26px;color:var(--muted)}
.fc.open .pa,.fc.open .kind{display:block}

/* role play */
.roles{display:flex;gap:14px}
.role{border-radius:12px;padding:10px 18px;font-size:22px;font-weight:700;color:#fff}
.script{flex:1;display:flex;flex-direction:column;gap:12px;font-family:var(--f-read);font-size:36px;line-height:1.35;overflow:auto}
.script div{padding:6px 18px;border-left:8px solid;border-radius:4px;background:var(--soft)}
.script small{font-family:var(--f-ko);font-size:18px;font-weight:700;display:inline-block;min-width:150px;margin-right:12px;color:var(--muted)}

/* ox */
.oxw{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px}
.oxq{font-family:var(--f-read);font-size:60px;font-weight:700;line-height:1.25}
.oxa{display:flex;align-items:center;gap:26px;min-height:150px}
.oxa .mk{font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1}
.oxa .why{font-size:26px;color:var(--muted);line-height:1.45}

/* scramble */
.scr{flex:1;display:flex;flex-direction:column;gap:24px;justify-content:center}
.slot{min-height:110px;border:3px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-read);font-size:42px;font-weight:700}
.slot.ok{border-color:var(--good);border-style:solid;background:color-mix(in srgb,var(--good) 12%,var(--card))}
.slot.bad{border-color:var(--bad);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--f-read);font-size:42px;font-weight:700}
.pool .tok[disabled]{opacity:.2}
.scr .ko{font-size:28px;font-weight:500;color:var(--muted)}

/* battle */
.bwrap{flex:1;display:grid;grid-template-columns:240px 1fr;gap:30px;min-height:0}
.qnav{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
.qnav button{height:64px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--f-display);font-weight:800;font-size:26px}
.qnav button.done{background:var(--soft);color:var(--muted)}
.qnav button.cur{background:var(--ink);color:var(--card);border-color:var(--ink)}
.qbox{display:flex;flex-direction:column;gap:24px;justify-content:center;min-width:0}
.qtype{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.1em;color:var(--accent-ink)}
.qtext{font-size:50px;font-weight:700;line-height:1.3}
.qtext .en{font-family:var(--f-read)}
.qans{font-family:var(--f-read);font-size:50px;font-weight:700;color:var(--good);min-height:70px}
.qans small{display:block;font-family:var(--f-ko);font-size:22px;color:var(--muted);font-weight:500}
.award{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:20px;font-weight:700}
.award button{border:0;color:#fff;border-radius:10px;padding:10px 18px;font-size:20px;font-weight:700}

/* exit */
.exits{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.exit{border-radius:16px;border:3px solid var(--ink);padding:26px;display:flex;flex-direction:column;gap:14px}
.exit .g{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent-ink);letter-spacing:.06em}
.exit .f{font-family:var(--f-read);font-weight:700;font-size:42px;line-height:1.2}
.exit .k{font-size:21px;color:var(--muted);line-height:1.5}
.podium{display:flex;gap:16px;align-items:flex-end;justify-content:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}
.pod .bar{width:120px;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;color:#fff;font-family:var(--f-display);font-size:30px;padding-top:6px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app">
  <div id="viewport"><div id="stage"></div></div>
  <div id="rail">
    <select class="rb" id="unitSel" aria-label="유닛 선택"></select>
    <button class="rb" id="bPrev" aria-label="이전 슬라이드">◀ 이전</button>
    <span id="counter">1 / 17</span>
    <button class="rb" id="bNext" aria-label="다음 슬라이드">다음 ▶</button>
    <button class="rb" id="bScore">점수판</button>
    <button class="rb" id="bTimer">타이머</button>
    <button class="rb" id="bPick">랜덤 뽑기</button>

{no:"01",
 passages:[
  {no:"01", ko:"나답게 친절해지기", en:"Be Kind, Be You",
   head:"Hello, Ms. Wise,", foot:"— Ms. Wise",
   task:"<b>Find</b> Ms. Wise가 준 조언 3가지를 찾아 번호 붙이기",
   note:["고민 편지(Unhappy Nice) → 답장(Ms. Wise) 구조. 고민이 무엇인지 한 문장으로 먼저 말하게 하세요.","동명사 주어 Trying ~ stresses / make + 목적어 + 형용사(make everyone happy)를 구문분석 모드에서 S·O·C 색으로 보여 주세요."],
   lines:[
    {en:"<s>I</s> <v>feel</v> / <o>like I need to make everyone happy / all the time</o>.", ko:"저는 항상 모든 사람을 행복하게 만들어야 한다고 느껴요.", tip:"feel like + 주어 + 동사 = ~라고 느끼다. make everyone happy = 모두를 행복하게 만들다 (make + 목적어 + 형용사)."},
    {en:"So / <s>I</s> always <v>try</v> <o>to be nice to others</o>.", ko:"그래서 저는 항상 다른 사람들에게 친절하려고 노력해요.", tip:"try to + 동사원형 = ~하려고 노력하다. be nice to ~ = ~에게 친절하다. always는 일반동사 앞."},
    {en:"<s>The problem</s> <v>is</v> / <c>that it’s just too much pressure</c>.", ko:"문제는 그것이 그냥 너무 큰 부담이라는 거예요.", tip:"The problem is that + 주어 + 동사 = 문제는 ~라는 것이다. that절 전체가 보어(C)."},
    {en:"<s>Trying to be a nice person all the time</s> really <v>stresses</v> <o>me</o> out.", ko:"항상 좋은 사람이 되려고 노력하는 것은 정말 저를 스트레스 받게 해요.", tip:"동명사(Trying ~) 주어는 단수 취급 → stresses. stress A out = A를 스트레스 받게 하다."},
    {en:"(— Unhappy Nice) / Dear Unhappy Nice,", ko:"(고민 많은 착한이 올림) / 고민 많은 착한이에게,", tip:"편지 형식: 보내는 사람 서명 → Dear + 받는 사람 = 답장 시작."},
    {en:"<s>It</s><v>’s</v> <c>great</c> / <s>that you want to be kind</s>.", ko:"당신이 친절하고 싶어 하는 것은 멋진 일이에요.", tip:"가주어 It, 진주어 that절. It’s great that ~ = ~라는 것은 멋지다."},
    {en:"But / <v>don’t worry</v> too much / about pleasing others.", ko:"하지만 다른 사람들을 기쁘게 하는 것에 대해 너무 많이 걱정하지 마세요.", tip:"Don’t + 동사원형 = 부정 명령문. 전치사 about 뒤에는 동명사 pleasing."},
    {en:"<s>You</s> <v>cannot make</v> <o>EVERYONE</o> <c>happy</c>.", ko:"당신은 모든 사람을 행복하게 만들 수는 없어요.", tip:"make + 목적어(O) + 형용사(C). 대문자 EVERYONE은 강조."},
    {en:"Instead, / <v>focus</v> on <o>yourself</o> / and <o>what makes YOU happy</o>.", ko:"대신에, 당신 자신과 무엇이 당신을 행복하게 만드는지에 집중하세요.", tip:"focus on ~ = ~에 집중하다. what makes you happy = 당신을 행복하게 하는 것 (what = ~하는 것)."},
    {en:"When you do, / <s>life</s> <v>begins</v> <o>to feel lighter</o>.", ko:"그렇게 하면, 삶은 더 가볍게 느껴지기 시작해요.", tip:"do = focus on yourself (대동사). begin to + 동사원형. lighter = light(가벼운)의 비교급."},
    {en:"If you still want to be kind to others, / <v>choose</v> <o>to be kind to the people / who truly matter to you</o>.", ko:"만약 여전히 다른 사람들에게 친절하고 싶다면, 당신에게 정말 중요한 사람들에게 친절하기를 선택하세요.", tip:"choose to + 동사원형. the people who ~ = ~하는 사람들 (주격 관계대명사 who). matter = 중요하다."},
    {en:"<v>Spend</v> <o>time</o> / with people / who like you / just as you are.", ko:"있는 그대로의 당신을 좋아하는 사람들과 시간을 보내세요.", tip:"spend time with ~ = ~와 시간을 보내다. just as you are = 있는 그대로의 당신."},
    {en:"But / <v>remember</v> / <o>that the most important thing is to love yourself</o>.", ko:"하지만 가장 중요한 것은 당신 자신을 사랑하는 것이라는 걸 기억하세요.", tip:"remember that ~ = ~라는 것을 기억하다. to love yourself = 자신을 사랑하는 것 (to부정사가 보어)."}
   ]},
  {no:"02", ko:"게임 속 언어 폭력, AI가 막는다!", en:"ToxMod: The Game Guard",

   note:["질문: \"What does ToxMod do?\" \"Is ‘Shoot!’ always bad?\" → 실수로 말하면 괜찮고, 일부러 말하면 신고될 수 있다.","수동태 can be reported / is used를 구문분석 모드에서 짚어 주세요. be + 과거분사 = ~되다."],
   lines:[
    {en:"There <v>is</v> <s>a cool AI tool / called ToxMod</s>.", ko:"ToxMod라고 불리는 멋진 AI 도구가 있다.", tip:"There is + 단수 주어. called ToxMod = ToxMod라고 불리는 (과거분사가 뒤에서 명사 수식)."},
    {en:"<s>It</s> <v>listens</v> / when people talk.", ko:"그것은 사람들이 말할 때 듣는다.", tip:"when + 주어 + 동사 = ~할 때. It = ToxMod."},
    {en:"If someone says mean words, / <s>it</s> <v>notices</v> <o>them</o> / right away.", ko:"만약 누군가가 못된 말을 하면, 그것은 그 말들을 즉시 알아차린다.", tip:"If ~ = 만약 ~라면. mean = 못된. them = mean words. right away = 즉시."},
    {en:"<s>It</s> <v>saves</v> <o>the words</o> / and <v>tells</v> <o>the game managers</o>.", ko:"그것은 그 말들을 저장하고 게임 관리자들에게 알린다.", tip:"동사 두 개(saves, tells)가 and로 연결. 주어 It이 3인칭 단수라서 -s."},
    {en:"In the past, / <s>players</s> <v>had to report</v> <o>mean people</o>.", ko:"과거에는, 플레이어들이 못된 사람들을 신고해야 했다.", tip:"had to + 동사원형 = ~해야 했다 (have to의 과거)."},
    {en:"Now, / <s>ToxMod</s> <v>can catch</v> <o>them</o> / without help.", ko:"이제, ToxMod는 도움 없이 그들을 잡아낼 수 있다.", tip:"can + 동사원형. without help = 도움 없이, 스스로."},
    {en:"<s>It</s> <v>checks</v> / <o>if the words are really bad</o>.", ko:"그것은 그 말들이 정말 나쁜지를 확인한다.", tip:"여기서 if = ~인지 (아닌지). check if ~ = ~인지 확인하다. ‘만약’이 아니에요!"},
    {en:"<s>It</s> <v>looks</v> at <o>the whole conversation</o>, / not just one word.", ko:"그것은 단지 한 단어가 아니라 대화 전체를 본다.", tip:"look at ~ = ~을 보다. A, not just B = 단지 B가 아니라 A."},
    {en:"So / if you say “Shoot!” in a game / by mistake, / <s>it</s><v>’s</v> <c>okay</c>.", ko:"그래서 만약 당신이 게임에서 실수로 “Shoot!”이라고 말하면, 그것은 괜찮다.", tip:"by mistake = 실수로. Shoot!은 ‘이런!’ 정도의 감탄사."},
    {en:"However, / if you say it on purpose, / <s>you</s> <v>can be reported</v>.", ko:"하지만, 만약 당신이 일부러 그것을 말하면, 당신은 신고될 수 있다.", tip:"can be + 과거분사 = ~될 수 있다 (조동사 수동태). on purpose = 일부러 ↔ by mistake."},
    {en:"<s>ToxMod</s> <v>finds</v> <o>words / that are too rude or harmful</o>.", ko:"ToxMod는 너무 무례하거나 해로운 말들을 찾아낸다.", tip:"words that are ~ = ~한 말들 (주격 관계대명사 that). rude = 무례한, harmful = 해로운."},
    {en:"<s>It</s> <v>helps</v> <o>stop people from saying hurtful things</o>.", ko:"그것은 사람들이 상처 주는 말을 하는 것을 막도록 돕는다.", tip:"help + 동사원형. stop A from -ing = A가 ~하는 것을 막다."},
    {en:"<s>This AI tool</s> <v>is</v> now <v>used</v> / in many online games.", ko:"이 AI 도구는 이제 많은 온라인 게임에서 사용된다.", tip:"is used = 사용된다 (be + 과거분사 = 수동태). now는 be동사와 과거분사 사이."},
    {en:"<s>Some games</s> / in Korea and other countries / <v>use</v> <o>it</o>, too.", ko:"한국과 다른 나라들의 몇몇 게임들도 그것을 사용한다.", tip:"주어 Some games가 복수 → use. in Korea ~ countries는 주어를 꾸미는 말."},
    {en:"<s>It</s> <v>keeps</v> <o>games</o> <c>fun, kind, and safe</c> / for everyone!", ko:"그것은 게임을 모두에게 재미있고, 친절하고, 안전하게 유지해 준다!", tip:"keep + 목적어 + 형용사 = ~을 …하게 유지하다. 형용사 3개가 보어(C)."}
   ]},
  {no:"03", ko:"프로크루스테스의 침대", en:"The Bed of Procrustes",
   task:"<b>Think</b> 테세우스는 어떻게 프로크루스테스를 이겼을까요?",

    {en:"<s>He</s> <v>had</v> <o>a small inn / where travelers could rest / for the night</o>.", ko:"그는 여행자들이 밤에 쉴 수 있는 작은 여관을 가지고 있었다.", tip:"an inn where ~ = ~하는 여관 (장소를 꾸미는 관계부사 where)."},

    {en:"<s>He</s> <v>was</v> <c>a robber / who wanted to steal from his guests</c>.", ko:"그는 그의 손님들에게서 훔치기를 원하는 강도였다.", tip:"a robber who ~ = ~하는 강도 (주격 관계대명사 who). steal from ~ = ~에게서 훔치다."},
    {en:"<s>He</s> <v>told</v> <o>guests</o> / <o>they could sleep in a “special” bed</o>.", ko:"그는 손님들에게 그들이 ‘특별한’ 침대에서 잘 수 있다고 말했다.", tip:"tell + 사람 + (that) 주어 + 동사 = ~에게 …라고 말하다. that 생략."},
    {en:"But / if someone was too tall, / <s>he</s> <v>cut off</v> <o>their legs</o>.", ko:"하지만 만약 누군가가 너무 키가 크면, 그는 그들의 다리를 잘라 버렸다.", tip:"too + 형용사 = 너무 ~한. cut off = 잘라내다 (cut-cut-cut)."},
    {en:"If they were too short, / <s>he</s> <v>stretched</v> <o>them</o>.", ko:"만약 그들이 너무 키가 작으면, 그는 그들을 잡아 늘였다.", tip:"stretch = 잡아 늘이다. 앞 문장과 대조되는 패턴."},
    {en:"<s>No one</s> ever <v>left</v> <o>his inn</o> again.", ko:"아무도 다시는 그의 여관을 떠나지 못했다.", tip:"No one = 아무도 ~ 않다 (부정어가 주어). leave-left-left."},
    {en:"One day, / <s>a brave hero / named Theseus</s> <v>arrived</v>.", ko:"어느 날, 테세우스라는 이름의 용감한 영웅이 도착했다.", tip:"named Theseus가 a brave hero를 꾸며요. 주어가 길어도 동사는 arrived 하나."},

    {en:"“<v>Let</v> <o>me</o> <c>see</c> / if your special bed fits me,” / <s>Theseus</s> <v>said</v>.", ko:"“당신의 특별한 침대가 나에게 맞는지 내가 한번 보죠.” 테세우스가 말했다.", tip:"Let me + 동사원형 = 내가 ~할게요. if = ~인지. fit = ~에 꼭 맞다."},

    {en:"<s>Theseus</s> <v>treated</v> <o>him</o> / the same way / he treated others.", ko:"테세우스는 그가 다른 사람들을 대했던 것과 똑같은 방식으로 그를 대했다.", tip:"the same way (that) 주어 + 동사 = ~가 …한 것과 똑같은 방식으로. treat = 대하다."},

/* ---------------- UNIT 02 ---------------- */
{no:"02",
 passages:[
  {no:"04", ko:"별들도 약육강식", en:"Stars Are Hunters",
   task:"<b>Find</b> 비교급(-er)과 최상급(-est)을 모두 찾아 동그라미",
   note:["질문: \"What does the big star take from the small star?\" → gas.","비교급 stronger / weaker / smaller / brighter and hotter, 최상급 the strongest를 짚어 주세요. get + 비교급 = 점점 ~해지다."],
   lines:[
    {en:"<s>The sky</s> <v>looks</v> <c>calm</c>, / but <s>something exciting</s> <v>is happening</v> / far away.", ko:"하늘은 고요해 보이지만, 멀리서 흥미진진한 무언가가 일어나고 있다.", tip:"look + 형용사 = ~해 보이다. something + 형용사 (형용사가 뒤에서 꾸밈). 현재진행형 is happening."},
    {en:"In space, / <s>big stars</s> <v>are</v> <c>like hunters</c>.", ko:"우주에서, 큰 별들은 사냥꾼과 같다.", tip:"be like + 명사 = ~와 같다."},
    {en:"<s>They</s> slowly <v>take</v> <o>energy</o> / from smaller stars.", ko:"그들은 더 작은 별들로부터 천천히 에너지를 빼앗는다.", tip:"take A from B = B에게서 A를 빼앗다. smaller = small의 비교급."},
    {en:"<s>It</s><v>’s</v> <c>like a game of survival</c>.", ko:"그것은 생존 게임과 같다.", tip:"a game of survival = 생존 게임. survive(살아남다) → survival(생존)."},
    {en:"When two stars are close together, / <s>the stronger star</s> <v>reaches out</v> / and <v>takes</v> <o>gas</o> / from the weaker star.", ko:"두 별이 서로 가까이 있을 때, 더 강한 별이 뻗어 나가서 더 약한 별에게서 가스를 빼앗는다.", tip:"the + 비교급 + 명사 = (둘 중) 더 ~한 쪽. reach out = 뻗어 나가다."},
    {en:"<s>The big star</s> <v>pulls</v> <o>gas</o> / from the small star.", ko:"큰 별은 작은 별로부터 가스를 끌어당긴다.", tip:"pull A from B = B에게서 A를 끌어당기다."},
    {en:"When it does, / <s>the small one</s> slowly <v>gets</v> <c>smaller</c>.", ko:"그렇게 하면, 작은 별은 천천히 더 작아진다.", tip:"does = pulls gas (대동사). one = star. get + 비교급 = 점점 ~해지다."},
    {en:"Sometimes / <s>the big star</s> <v>eats</v> <o>it</o> all up!", ko:"때때로 큰 별은 그것을 다 먹어 치운다!", tip:"eat up = 다 먹다. 대명사 it은 eat과 up 사이에 와요."},
    {en:"<s>This</s> <v>can make</v> <o>the big star</o> <c>brighter and hotter</c>.", ko:"이것은 큰 별을 더 밝고 더 뜨겁게 만들 수 있다.", tip:"make + 목적어 + 형용사(비교급). bright → brighter, hot → hotter (자음 하나 더!)."},
    {en:"<s>Scientists</s> <v>say</v> / <o>that it’s like watching a fire / burn everything in its way</o>.", ko:"과학자들은 그것이 불이 그 길목에 있는 모든 것을 태우는 것을 보는 것과 같다고 말한다.", tip:"like + 동명사(watching). watch + 목적어 + 동사원형 = ~가 …하는 것을 보다. in its way = 길목에 있는."},
    {en:"In space, / <s>one star</s> <v>is</v> <c>the strongest</c>, / and <s>the other ones</s> <v>can’t fight back</v>.", ko:"우주에서, 한 별이 가장 강하고, 나머지 별들은 반격할 수 없다.", tip:"the + 최상급(-est) = 가장 ~한. fight back = 반격하다. the other ones = 나머지 것들."},
    {en:"Above us, / there <v>is</v> <s>a quiet jungle / where only the strongest stars can survive</s>.", ko:"우리 위에는, 오직 가장 강한 별들만이 살아남을 수 있는 조용한 정글이 있다.", tip:"a jungle where ~ = ~하는 정글 (관계부사 where). 우주를 ‘조용한 정글’에 비유했어요."}
   ]},
  {no:"05", ko:"재주 만렙 거미", en:"Spiders on the Move",
   task:"<b>Order</b> 거미가 멀리 여행하는 순서 정리하기 (First → Then → …)",
   note:["질문: \"How do spiders cross water?\" \"Why do spiders eat their old webs?\" → to reuse the silk.","to부정사 목적(~하기 위해): to catch / to go / to cross / to reuse 를 모두 찾아보게 하세요."],
   lines:[
    {en:"<s>Spiders</s> <v>use</v> <o>their silk</o> / to catch food.", ko:"거미는 먹이를 잡기 위해 그들의 실을 사용한다.", tip:"to + 동사원형 = ~하기 위해 (목적). silk = (거미의) 실."},
    {en:"<v>Did</v> <s>you</s> <v>know</v> / <o>they can also use it / to go to new places</o>?", ko:"그들이 새로운 장소에 가기 위해 그것을 사용할 수도 있다는 것을 알고 있었나요?", tip:"Did you know (that) ~? = ~라는 걸 알았나요? to go = 가기 위해."},
    {en:"<s>Some spiders</s> <v>use</v> <o>their silk</o> / to cross over water.", ko:"어떤 거미들은 물을 건너기 위해 그들의 실을 사용한다.", tip:"Some ~ / Other ~ = 어떤 것들은 ~ / 다른 것들은 ~ (뒤 문단과 짝)."},
    {en:"<s>They</s> <v>do</v> <o>this</o> / by casting a thread / across the water.", ko:"그들은 물 건너편으로 실을 던져서 이것을 한다.", tip:"by + 동사-ing = ~함으로써. cast = 던지다."},
    {en:"<s>The thread</s> <v>can be</v> <c>very long</c>, / like a bridge for them.", ko:"그 실은 그들을 위한 다리처럼 매우 길 수 있다.", tip:"can be + 형용사. like a bridge = 다리처럼."},
    {en:"Then, / <s>the spiders</s> <v>crawl</v> / across it / to the other side.", ko:"그런 다음, 거미들은 그것을 가로질러 반대편으로 기어간다.", tip:"crawl = 기어가다. across = ~을 가로질러. the other side = 반대편."},
    {en:"<s>They</s> <v>move</v> / like circus performers!", ko:"그들은 서커스 곡예사들처럼 움직인다!", tip:"like + 명사 = ~처럼."},
    {en:"<s>Other spiders</s> <v>can</v> even <v>travel</v> / to faraway places / with their webs.", ko:"다른 거미들은 심지어 그들의 거미줄로 멀리 떨어진 곳까지 여행할 수 있다.", tip:"even = 심지어. faraway = 멀리 떨어진. web = 거미줄."},
    {en:"First, / <s>they</s> <v>climb up</v> <o>a tall tree</o>.", ko:"먼저, 그들은 높은 나무 위로 올라간다.", tip:"순서 표현 First → Then → When. climb up = 위로 올라가다."},
    {en:"Then, / <s>they</s> <v>let out</v> <o>their silk</o>.", ko:"그런 다음, 그들은 실을 내뿜는다.", tip:"let out = 내뿜다, 내보내다."},
    {en:"<s>They</s> <v>wait</v> / for the wind / to lift them up.", ko:"그들은 바람이 그들을 들어 올리기를 기다린다.", tip:"wait for A to + 동사원형 = A가 ~하기를 기다리다. lift up = 들어 올리다."},
    {en:"When they are in the air, / <s>it</s> <v>feels</v> / <c>like they are on a balloon</c>.", ko:"그들이 공중에 있을 때, 그것은 마치 풍선 위에 있는 것처럼 느껴진다.", tip:"feel like + 주어 + 동사 = ~처럼 느껴지다. in the air = 공중에."},
    {en:"But / <s>they</s> <v>don’t throw away</v> <o>their old homes</o>.", ko:"하지만 그들은 그들의 옛집을 버리지 않는다.", tip:"throw away = 버리다. old homes = 예전 거미줄."},
    {en:"Before they move, / <s>they</s> <v>eat</v> <o>their old webs</o> / to reuse the silk / for new ones.", ko:"이동하기 전에, 그들은 새 거미줄을 위해 실을 재사용하려고 옛 거미줄을 먹는다.", tip:"to reuse = 재사용하기 위해 (목적). new ones = new webs."}
   ]},
  {no:"06", ko:"불길한 꿈의 끝", en:"The Thirteen Steps",
   task:"<b>Find</b> 꿈과 현실이 똑같았던 것 2가지 찾기",
   note:["질문: \"What was the same in the dream and in real life?\" → 13 steps, the woman’s face.","was going to(~할 예정이었다), There had been(과거완료)를 짚어 주세요. 비행기를 내린 뒤 사고가 ‘이미’ 일어났어요."],
   lines:[
    {en:"<s>Mr. Hunter</s> <v>climbed up</v> <o>the stairs</o>.", ko:"헌터 씨는 계단을 올라갔다.", tip:"climb up = 오르다. stairs = 계단 (보통 복수)."},
    {en:"At the top, / <s>a woman</s> <v>was smiling</v> / at him.", ko:"맨 위에서, 한 여자가 그를 보고 웃고 있었다.", tip:"과거진행형 was + -ing. smile at ~ = ~을 보고 웃다."},
    {en:"<s>She</s> <v>looked</v> <c>very scary</c>.", ko:"그녀는 매우 무서워 보였다.", tip:"look + 형용사 = ~해 보이다. scary = 무서운."},
    {en:"Oh, no! / <s>She</s> <v>was</v> <c>a ghost</c>.", ko:"오, 이런! 그녀는 유령이었다.", tip:"ghost = 유령."},
    {en:"<s>Mr. Hunter</s> <v>screamed</v> / and <v>woke up</v> / from his dream.", ko:"헌터 씨는 비명을 지르며 꿈에서 깨어났다.", tip:"scream = 비명을 지르다. wake up-woke up = 깨어나다."},
    {en:"The next morning, / <s>Mr. Hunter</s> <v>went</v> / to the airport.", ko:"다음 날 아침, 헌터 씨는 공항으로 갔다.", tip:"go → went (불규칙)."},
    {en:"<s>He</s> <v>was going</v> / to New York.", ko:"그는 뉴욕에 갈 예정이었다.", tip:"과거진행형으로 ‘예정’을 나타내요. = He was going to go to New York."},
    {en:"As he walked up the stairs / to board the airplane, / <s>he</s> <v>counted</v> <o>the steps</o>.", ko:"비행기에 타기 위해 계단을 걸어 올라가면서, 그는 계단 수를 세었다.", tip:"As = ~하면서 (동시에). to board = 타기 위해 (목적). count = 세다."},
    {en:"“One, two, three... thirteen. / <s>That</s><v>’s</v> <c>strange</c>.", ko:"“하나, 둘, 셋… 열셋. 이상하네.", tip:"strange = 이상한."},
    {en:"There <v>are</v> <s>thirteen steps</s>, / just like in my dream.”", ko:"내 꿈에서처럼 계단이 13개야.”", tip:"There are + 복수 명사. just like ~ = 꼭 ~처럼."},
    {en:"On the airplane, / <s>a flight attendant</s> <v>smiled</v> at him / and <v>said</v>, / “Come with me, Mr. Hunter.”", ko:"비행기에서, 한 승무원이 그를 보고 웃으며 말했다. “저와 함께 가시죠, 헌터 씨.”", tip:"flight attendant = 승무원. Come with me = 명령문."},
    {en:"<s>He</s> <v>looked</v> at <o>her</o> / and <v>realized</v> with horror / <o>that she looked just like the ghost / from his dream</o>.", ko:"그는 그녀를 보고, 그녀가 꿈속의 그 유령과 똑같아 보인다는 것을 공포에 질려 깨달았다.", tip:"realize that ~ = ~라는 것을 깨닫다. with horror = 공포에 질려. look like + 명사 = ~처럼 보이다."},
    {en:"<s>He</s> <v>screamed</v> / and quickly <v>got off</v> <o>the plane</o>.", ko:"그는 비명을 지르고 재빨리 비행기에서 내렸다.", tip:"get off = (탈것에서) 내리다 ↔ get on. get-got-got."},
    {en:"That night, / <s>he</s> <v>heard</v> <o>the news</o>.", ko:"그날 밤, 그는 뉴스를 들었다.", tip:"hear-heard-heard."},
    {en:"There <v>had been</v> <s>a plane crash</s>.", ko:"비행기 추락 사고가 있었던 것이다.", tip:"had + 과거분사 = 과거완료. 뉴스를 들은 시점(과거)보다 사고가 먼저 일어났어요."},
    {en:"<s>The reporter</s> <v>said</v>, / “<s>Everyone / on the flight to New York</s> <v>died</v>.”", ko:"기자가 말했다. “뉴욕행 항공편에 탄 모든 사람이 사망했습니다.”", tip:"Everyone은 단수 취급. on the flight to New York이 Everyone을 꾸며요."}
   ]}
 ],
 riddle:{clues:["We are very hot and bright.","You can see us at night.","Big ones take gas from small ones.","Only the strongest of us can survive."], answer:"Stars! 별"},
 grammar:[
  {title:"비교급 · 최상급", sub:"더 ~한 / 가장 ~한", formula:"형용사<em>-er</em> (than) | the + 형용사<em>-est</em> | get + <em>비교급</em>",
   ex:[["The <mark>stronger</mark> star takes gas from the <mark>weaker</mark> star.","the + 비교급 = 둘 중 더 ~한"],["This can make the big star <mark>brighter and hotter</mark>.","hot → hotter (자음 하나 더)"],["Only <mark>the strongest</mark> stars can survive.","the + 최상급 = 가장 ~한"]],
   note:"<b>get + 비교급</b> = 점점 ~해지다 → The small one slowly <b>gets smaller</b>.<br>불규칙: good-better-best / bad-worse-worst",
   fix:[["The big star gets more small.","The small star gets smaller.","1음절 형용사 → -er"],["It makes the star hoter.","It makes the star hotter.","단모음+단자음 → 자음 하나 더"],["One star is the most strong.","One star is the strongest.","1음절 → -est"]]},
  {title:"to부정사 (목적)", sub:"~하기 위해", formula:"동사 ~ + <em>to + 동사원형</em>",
   ex:[["Spiders use their silk <mark>to catch</mark> food.","먹이를 잡기 위해"],["Some spiders use their silk <mark>to cross</mark> over water.","물을 건너기 위해"],["They eat their old webs <mark>to reuse</mark> the silk.","실을 재사용하기 위해"]],
   note:"<b>by + 동사-ing</b> = ~함으로써 → by casting a thread<br><b>wait for A to + 동사원형</b> = A가 ~하기를 기다리다",
   fix:[["They use silk to catching food.","They use silk to catch food.","to 뒤는 동사원형"],["They do this by cast a thread.","They do this by casting a thread.","by 뒤는 동명사"],["They wait for the wind lift them.","They wait for the wind to lift them.","wait for A to + 동사원형"]]},
  {title:"과거진행 · 과거완료", sub:"~하고 있었다 / (그보다 먼저) ~했었다", formula:"was/were + <em>-ing</em> | <em>had + 과거분사</em>",
   ex:[["A woman <mark>was smiling</mark> at him.","과거진행"],["He <mark>was going</mark> to New York.","과거진행 = 예정"],["There <mark>had been</mark> a plane crash.","뉴스를 듣기 전에 이미 일어난 일"]],
   note:"시간 순서: 사고 발생(had been) → 그날 밤 뉴스를 들음(heard)<br><b>As</b> + 주어 + 동사 = ~하면서 / <b>realize that</b> ~ = ~임을 깨닫다",
   fix:[["A woman were smiling at him.","A woman was smiling at him.","단수 주어 → was"],["There has been a crash. (그날 밤 들은 뉴스)","There had been a crash.","과거보다 더 이전 → had p.p."],["He got of the plane.","He got off the plane.","get off = 내리다"]]}
 ],

/* ---------------- UNIT 03 ---------------- */
{no:"03",
 passages:[
  {no:"07", ko:"반짝반짝 심해의 불빛 함정", en:"The Viperfish’s Light Trap",
   task:"<b>Think</b> 바이퍼피시는 왜 빛을 낼까요? 이유를 한 문장으로!",
   note:["질문: \"How does the viperfish catch food?\" → It uses light to attract tiny fish.","시간 접속사 When / Once(일단 ~하면)를 짚어 주세요. 소유격 the viperfish’s mouth도 확인."],
   lines:[
    {en:"There <v>is</v> <s>a cool fish / that lives in the deep sea</s>.", ko:"깊은 바다에 사는 멋진 물고기가 있다.", tip:"a fish that lives ~ = ~에 사는 물고기 (주격 관계대명사 that)."},
    {en:"<s>It</s> <v>is called</v> <c>a viperfish</c>.", ko:"그것은 바이퍼피시라고 불린다.", tip:"be called + 이름 = ~라고 불리다 (수동태)."},
    {en:"<s>This fish</s> <v>has</v> <o>a special way / of catching food</o>.", ko:"이 물고기는 먹이를 잡는 특별한 방법을 가지고 있다.", tip:"a way of -ing = ~하는 방법. of 뒤에 동명사."},
    {en:"<s>It</s> <v>uses</v> <o>light</o> / to attract tiny fish.", ko:"그것은 아주 작은 물고기들을 유인하기 위해 빛을 사용한다.", tip:"to attract = 유인하기 위해 (목적). tiny = 아주 작은."},
    {en:"<s>Many parts of its face</s> <v>can glow</v> brightly / like stars.", ko:"그것의 얼굴의 많은 부분이 별처럼 밝게 빛날 수 있다.", tip:"주어는 Many parts (of its face는 꾸밈). glow = 은은히 빛나다. bright → brightly."},
    {en:"When it opens its mouth, / <s>it</s> <v>looks</v> <c>like a Christmas tree</c>!", ko:"그것이 입을 벌리면, 그것은 크리스마스트리처럼 보인다!", tip:"look like + 명사 = ~처럼 보이다."},
    {en:"When little fish see the bright, pretty lights, / <s>they</s> <v>swim</v> closer / to the viperfish’s mouth.", ko:"작은 물고기들이 밝고 예쁜 빛을 보면, 그들은 바이퍼피시의 입 쪽으로 더 가까이 헤엄쳐 간다.", tip:"closer = close(가까이)의 비교급. viperfish’s = 바이퍼피시의 (소유격)."},
    {en:"Once they are inside, / <s>the viperfish</s> quickly <v>shuts</v> <o>its mouth</o> / and <v>swallows</v> <o>them</o>.", ko:"일단 그들이 안으로 들어오면, 바이퍼피시는 재빨리 입을 닫고 그들을 삼킨다.", tip:"Once + 주어 + 동사 = 일단 ~하면. shut = 닫다, swallow = 삼키다."},
    {en:"For the little fish, / <s>the fun with the lights</s> <v>is</v> <c>over</c>.", ko:"작은 물고기들에게, 빛과 함께하는 즐거움은 끝났다.", tip:"be over = 끝나다. 주어 the fun (with the lights는 꾸밈)."},
    {en:"But for the viperfish, / <s>it</s><v>’s</v> <c>time for a delicious meal</c>!", ko:"하지만 바이퍼피시에게는, 맛있는 식사 시간이다!", tip:"It’s time for + 명사 = ~할 시간이다."}
   ]},
  {no:"08", ko:"주식 시장에는 동물들이 산다", en:"Animals in the Stock Market",
   task:"<b>Match</b> 황소 · 곰 · 고양이가 각각 어떤 시장을 뜻하는지 연결",
   note:["bull market(상승장) / bear market(하락장) / Dead Cat Bounce(일시적 반등). 그림을 그려 설명하면 이해가 빨라요.","간접의문문 what will happen next / which animal is leading the market 어순(의문사 + 주어 + 동사)을 짚어 주세요."],
   lines:[
    {en:"<s>The stock market</s> <v>is</v> <c>like a jungle / with many animals</c>.", ko:"주식 시장은 많은 동물들이 있는 정글과 같다.", tip:"be like ~ = ~와 같다. with many animals = 많은 동물들이 있는."},
    {en:"When the market goes up, / <s>it</s> <v>is called</v> <c>a bull market</c>.", ko:"시장이 올라가면, 그것은 황소 시장(상승장)이라고 불린다.", tip:"go up = 올라가다. be called ~ = ~라고 불리다."},
    {en:"<s>It</s> <v>is</v> <c>like a bull running fast</c>!", ko:"그것은 빠르게 달리는 황소와 같다!", tip:"a bull running fast = 빠르게 달리는 황소 (현재분사가 뒤에서 꾸밈)."},
    {en:"<s>Everyone</s> <v>feels</v> <c>happy and excited</c>.", ko:"모든 사람이 행복하고 신이 난다.", tip:"feel + 형용사. Everyone은 단수 → feels."},
    {en:"When the market goes down, / <s>it</s> <v>is called</v> <c>a bear market</c>.", ko:"시장이 내려가면, 그것은 곰 시장(하락장)이라고 불린다.", tip:"go down = 내려가다. 앞 문장과 대조."},
    {en:"<s>It</s> <v>is</v> <c>like a bear / putting its paw down</c>.", ko:"그것은 발을 내려놓는 곰과 같다.", tip:"putting its paw down = 발을 내리는 (현재분사 수식). paw = 동물의 발."},
    {en:"Sometimes, / <s>the market</s> <v>changes</v> very fast.", ko:"때때로, 시장은 매우 빠르게 변한다.", tip:"Sometimes = 때때로."},
    {en:"<s>We</s> <v>don’t know</v> / <o>what will happen next</o>.", ko:"우리는 다음에 무슨 일이 일어날지 모른다.", tip:"간접의문문: what(주어 역할) + will happen. ‘무엇이 일어날지’."},
    {en:"<s>This tricky time</s> <v>is called</v> <c>a Dead Cat Bounce</c>.", ko:"이 까다로운 시기는 ‘죽은 고양이의 반등’이라고 불린다.", tip:"tricky = 까다로운. bounce = 튀어 오름, 반등."},
    {en:"If a stock drops and then jumps up a little / but falls again, / <s>it</s> <v>is</v> <c>like a cat / making one last jump / before falling down</c>.", ko:"만약 주식이 떨어진 다음 조금 뛰어올랐다가 다시 떨어지면, 그것은 떨어지기 전에 마지막으로 한 번 뛰어오르는 고양이와 같다.", tip:"동사 drops / jumps / falls 세 개가 주어 a stock에 연결. before + 동명사(falling)."},
    {en:"So, / when you want to invest in stocks, / <v>find out</v> / <o>which animal is leading the market</o>.", ko:"그러니, 주식에 투자하고 싶을 때는, 어떤 동물이 시장을 이끌고 있는지 알아내라.", tip:"명령문 find out ~. 간접의문문: which animal(주어) + is leading. invest in = ~에 투자하다."},
    {en:"If you know that, / <s>you</s> <v>will be able to make</v> <o>smart choices</o>.", ko:"그것을 안다면, 당신은 현명한 선택을 할 수 있을 것이다.", tip:"will be able to + 동사원형 = ~할 수 있을 것이다 (will can ✕)."}
   ]},
  {no:"09", ko:"행운일까, 불운일까?", en:"Good Luck or Bad Luck?",
   task:"<b>Track</b> 이웃들의 말과 노인의 대답을 표로 정리하기",
   note:["새옹지마(塞翁之馬) 이야기. 마지막에 \"좋은 일이 나쁜 일이 되고, 나쁜 일이 좋은 일이 될 수 있다\"는 교훈을 정리해 주세요.","감탄문 What bad luck! / How lucky!, 대동사 Maybe it will, maybe it won’t를 짚어 주세요."],
   lines:[
    {en:"There once <v>was</v> <s>a wise old man</s>.", ko:"옛날에 한 현명한 노인이 있었다.", tip:"once = 옛날에, 한때. There was + 단수 명사."},
    {en:"<s>Many people</s> <v>came</v> to him / for advice.", ko:"많은 사람들이 조언을 얻으러 그에게 왔다.", tip:"for advice = 조언을 얻기 위해. advice(명사) ↔ advise(동사)."},
    {en:"One day, / <s>the king</s> <v>visited</v> <o>the village</o> / to honor the old man’s wisdom.", ko:"어느 날, 왕이 노인의 지혜에 경의를 표하기 위해 그 마을을 방문했다.", tip:"to honor = 경의를 표하기 위해 (목적). wise(현명한) → wisdom(지혜)."},
    {en:"As a present, / <s>the king</s> <v>gave</v> <o>a horse</o> / to the old man’s son.", ko:"선물로, 왕은 노인의 아들에게 말 한 마리를 주었다.", tip:"give A to B = B에게 A를 주다. as a present = 선물로."},
    {en:"<s>The neighbors</s> <v>said</v>, / “<s>That horse</s> <v>will bring</v> <o>good luck</o>.”", ko:"이웃들이 말했다. “저 말이 행운을 가져다줄 거예요.”", tip:"will + 동사원형 = ~할 것이다. bring good luck = 행운을 가져오다."},
    {en:"<s>The old man</s> <v>thought</v> / for a moment / and <v>said</v>, / “Maybe it will, / maybe it won’t.”", ko:"노인은 잠시 생각하더니 말했다. “그럴 수도 있고, 아닐 수도 있지요.”", tip:"it will (bring good luck) / it won’t (bring good luck) — 반복되는 말 생략. for a moment = 잠깐."},
    {en:"The next day, / <s>the son</s> <v>rode</v> <o>the horse</o> / to the field.", ko:"다음 날, 아들은 말을 타고 들판으로 갔다.", tip:"ride-rode-ridden. field = 들판."},
    {en:"Unfortunately, / <s>he</s> <v>fell off</v> / and <v>broke</v> <o>his leg</o>.", ko:"불행하게도, 그는 떨어져서 다리가 부러졌다.", tip:"fall off = 떨어지다 (fell). break one’s leg = 다리가 부러지다 (broke)."},
    {en:"“What bad luck!” / <s>the neighbors</s> <v>said</v>.", ko:"“정말 불운하군요!” 이웃들이 말했다.", tip:"What + (a/an) + 형용사 + 명사! = 정말 ~하구나! (감탄문)"},
    {en:"But / <s>the old man</s> simply <v>replied</v>, / “Maybe it is, / maybe it isn’t.”", ko:"하지만 노인은 간단히 대답했다. “그럴 수도 있고, 아닐 수도 있지요.”", tip:"it is (bad luck) / it isn’t (bad luck) 생략. reply = 대답하다."},
    {en:"After a while, / <s>a war</s> <v>broke out</v>.", ko:"얼마 후, 전쟁이 일어났다.", tip:"break out = (전쟁 등이) 발발하다. after a while = 얼마 후에."},
    {en:"<s>Soldiers</s> <v>came</v> to the village / and <v>took</v> <o>all the young men</o> / to fight.", ko:"군인들이 마을로 와서 싸우게 하려고 젊은 남자들을 모두 데려갔다.", tip:"take-took-taken. to fight = 싸우기 위해 (목적)."},
    {en:"But / <s>they</s> <v>left</v> <o>the old man’s son</o> behind / because he couldn’t walk.", ko:"하지만 그들은 노인의 아들은 걸을 수 없었기 때문에 남겨 두었다.", tip:"leave A behind = A를 남겨 두다. because + 주어 + 동사 = ~ 때문에."},
    {en:"<s>The neighbors</s> then <v>said</v>, / “How lucky!”", ko:"그러자 이웃들이 말했다. “정말 운이 좋군요!”", tip:"How + 형용사! = 정말 ~하구나! (감탄문). 불운이 행운으로 바뀌었어요."}
   ]}
 ],
 riddle:{clues:["I live in the deep sea.","Many parts of my face can glow.","I look like a Christmas tree when I open my mouth.","I swallow tiny fish!"], answer:"A viperfish! 바이퍼피시"},
 grammar:[
  {title:"시간 접속사 when · once", sub:"~할 때 / 일단 ~하면", formula:"<em>When / Once</em> + 주어 + 동사, 주어 + 동사",
   ex:[["<mark>When</mark> it opens its mouth, it looks like a Christmas tree!","~할 때"],["<mark>Once</mark> they are inside, the viperfish shuts its mouth.","일단 ~하면"],["It uses light <mark>to attract</mark> tiny fish.","to부정사 목적"]],
   note:"<b>a way of -ing</b> = ~하는 방법 → a special way of <b>catching</b> food<br><b>It’s time for + 명사</b> = ~할 시간이다",
   fix:[["When it will open its mouth, ~","When it opens its mouth, ~","시간 접속사절은 현재로 미래 표현"],["a special way of catch food","a special way of catching food","of 뒤는 동명사"],["It looks a Christmas tree.","It looks like a Christmas tree.","look like + 명사"]]},
  {title:"간접의문문", sub:"의문사 + 주어 + 동사", formula:"동사 + <em>의문사 + 주어 + 동사</em>",

{no:"04",
 passages:[
  {no:"10", ko:"미스터리 삼각형, 버뮤다 삼각 지대", en:"The Bermuda Triangle",
   task:"<b>Draw</b> 지문을 듣고 버뮤다 삼각 지대를 칠판에 그려 보기 (Bermuda → Florida → Puerto Rico)",
   note:["질문: \"What happens in the Bermuda Triangle?\" → airplanes and ships disappear / compasses stop working.","현재완료 have disappeared(지금까지 ~해 왔다)를 so far와 함께 짚어 주세요."],
   lines:[
    {en:"There <v>is</v> <s>a scary place</s> / in the Atlantic Ocean.", ko:"대서양에 무서운 장소가 있다.", tip:"There is + 단수 명사. the Atlantic Ocean = 대서양."},
    {en:"<s>Many strange things</s> <v>happen</v> there.", ko:"그곳에서는 많은 이상한 일들이 일어난다.", tip:"happen = 일어나다 (목적어 없음). 주어 복수 → happen."},
    {en:"So far, / <s>many airplanes and ships</s> <v>have disappeared</v>.", ko:"지금까지, 많은 비행기와 배들이 사라졌다.", tip:"have + 과거분사 = 현재완료. so far(지금까지)와 함께 자주 써요. disappear ↔ appear."},
    {en:"Where <v>is</v> <s>this strange place</s>?", ko:"이 이상한 장소는 어디일까?", tip:"의문사 Where + be동사 + 주어?"},
    {en:"<s>It</s> <v>is called</v> <c>the Bermuda Triangle</c>.", ko:"그것은 버뮤다 삼각 지대라고 불린다.", tip:"be called ~ = ~라고 불리다. triangle = 삼각형."},
    {en:"If you draw a line / from Bermuda to Florida, / and then to Puerto Rico, / and back to Bermuda, / <s>you</s> <v>make</v> <o>a triangle</o>.", ko:"버뮤다에서 플로리다로, 그다음 푸에르토리코로, 그리고 다시 버뮤다로 선을 그리면, 삼각형이 만들어진다.", tip:"from A to B = A부터 B까지. If절이 길어도 주절은 you make a triangle."},
    {en:"<s>Some sailors</s> <v>get</v> <c>scared</c> / in the Bermuda Triangle.", ko:"어떤 선원들은 버뮤다 삼각 지대에서 겁을 먹는다.", tip:"get + 형용사 = ~해지다. scared = 겁먹은 (scary = 무서운)."},
    {en:"<s>Their compasses</s> <v>stop</v> <o>working</o>, / so <s>they</s> <v>can’t find</v> <o>their way</o>.", ko:"그들의 나침반이 작동을 멈춰서, 그들은 길을 찾을 수 없다.", tip:"stop + -ing = ~하는 것을 멈추다. work = 작동하다. so = 그래서."},
    {en:"<s>They</s> <v>get lost</v>!", ko:"그들은 길을 잃는다!", tip:"get lost = 길을 잃다."},
    {en:"<s>Some people</s> <v>say</v> / <o>they see a big, spinning pool of water</o>.", ko:"어떤 사람들은 크고 빙빙 도는 물웅덩이를 본다고 말한다.", tip:"say (that) ~. spinning = 빙빙 도는 (현재분사가 명사 앞에서 꾸밈)."},
    {en:"<s>It</s> <v>looks</v> <c>like a monster</c>!", ko:"그것은 괴물처럼 보인다!", tip:"look like + 명사."},
    {en:"<s>It</s> <v>pulls</v> <o>everything</o> / into the water.", ko:"그것은 모든 것을 물속으로 끌어당긴다.", tip:"pull A into B = A를 B 안으로 끌어당기다. everything은 단수."},
    {en:"<s>No one</s> <v>knows</v> <o>why</o>.", ko:"아무도 이유를 모른다.", tip:"No one + 단수 동사(knows) = 아무도 ~ 않다."},
    {en:"<s>It</s> <v>is</v> still <c>a big mystery</c>.", ko:"그것은 여전히 큰 미스터리이다.", tip:"still = 여전히. be동사 뒤에 위치."}
   ]},
  {no:"11", ko:"천사가 찾은 가장 아름다운 것", en:"The Most Beautiful Thing",
   task:"<b>Find</b> 가브리엘이 고른 세 가지와, 끝까지 변하지 않은 것 찾기",
   note:["질문: \"What did Gabriel choose?\" → a rose, a baby’s smile, a mother’s love. \"What remained the same?\" → a mother’s love.","It took + 사람 + 시간 + to ~ (…하는 데 시간이 걸렸다), no longer A but B를 짚어 주세요."],
   lines:[
    {en:"One day, / <s>God</s> <v>sent</v> <o>the angel Gabriel</o> / to Earth.", ko:"어느 날, 하나님은 천사 가브리엘을 지구로 보냈다.", tip:"send-sent-sent. the angel Gabriel = 천사 가브리엘 (동격)."},
    {en:"<s>God</s> <v>gave</v> <o>him</o> <o>an important task</o>.", ko:"하나님은 그에게 중요한 임무를 주었다.", tip:"give + 사람 + 사물 = ~에게 …을 주다 (4형식)."},
    {en:"<s>It</s> <v>was</v> <c>to find the most beautiful thing / on Earth</c>.", ko:"그것은 지구에서 가장 아름다운 것을 찾는 것이었다.", tip:"to find ~ = 찾는 것 (to부정사가 보어). the most + 형용사 = 가장 ~한."},
    {en:"<s>Gabriel</s> <v>searched</v> everywhere.", ko:"가브리엘은 모든 곳을 찾아다녔다.", tip:"search = 찾다. everywhere = 모든 곳에서."},
    {en:"In the end, / <s>he</s> <v>chose</v> <o>three things</o>.", ko:"결국, 그는 세 가지를 골랐다.", tip:"in the end = 결국. choose-chose-chosen."},
    {en:"<s>The first</s> <v>was</v> <c>a rose</c>, / <s>the second</s> <v>was</v> <c>a baby’s smile</c>, / and <s>the third</s> <v>was</v> <c>a mother’s love</c>.", ko:"첫 번째는 장미였고, 두 번째는 아기의 미소였으며, 세 번째는 엄마의 사랑이었다.", tip:"the first / the second / the third = 첫째 / 둘째 / 셋째. ’s = ~의."},
    {en:"<s>It</s> <v>took</v> <o>Gabriel</o> <o>a long time</o> / to return to Heaven.", ko:"가브리엘이 천국으로 돌아가는 데 오랜 시간이 걸렸다.", tip:"It takes + 사람 + 시간 + to 동사원형 = ~가 …하는 데 (시간이) 걸리다."},
    {en:"By the time he arrived, / <s>the flower</s> <v>had</v> already <v>died</v>.", ko:"그가 도착했을 때쯤, 꽃은 이미 죽어 있었다.", tip:"by the time ~ = ~할 때쯤. had died = 과거완료 (도착 전에 이미)."},
    {en:"<s>The baby</s> <v>was</v> no longer <c>a baby</c> / but <c>a young man</c>.", ko:"아기는 더 이상 아기가 아니라 청년이었다.", tip:"no longer A but B = 더 이상 A가 아니라 B인."},
    {en:"But / <s>a mother’s love</s> <v>remained</v> <c>the same</c>.", ko:"하지만 엄마의 사랑은 똑같이 남아 있었다.", tip:"remain + 형용사/명사 = ~한 상태로 남다. the same = 똑같은."},
    {en:"<s>It</s> <v>was</v> still <c>beautiful and true</c>, / just like before.", ko:"그것은 꼭 예전처럼 여전히 아름답고 진실했다.", tip:"just like before = 꼭 예전처럼. true = 진정한."},
    {en:"<s>A mother’s true love</s> <v>is</v> always <c>beautiful</c>.", ko:"엄마의 진정한 사랑은 언제나 아름답다.", tip:"always는 be동사 뒤."},
    {en:"Even <s>time</s> <v>cannot change</v> <o>it</o>.", ko:"시간조차도 그것을 바꿀 수 없다.", tip:"Even + 명사 = ~조차도. it = a mother’s true love."}
   ]},
  {no:"12", ko:"돼지에 관한 오해", en:"Pigs Are Clean!",
   task:"<b>Check</b> 돼지가 깨끗한 동물인 이유 2가지 찾기",
   note:["질문: \"Why do pigs roll in the mud?\" → They can’t sweat, so they roll in the mud to cool off.","동명사 being dirty / for sleeping / about being clean, one ~ another ~ the other를 짚어 주세요."],
   lines:[
    {en:"<s>Many people</s> <v>think</v> / <o>pigs are dirty and not smart</o>.", ko:"많은 사람들은 돼지가 더럽고 똑똑하지 않다고 생각한다.", tip:"think (that) + 주어 + 동사."},
    {en:"Sometimes / when your room is messy, / <s>your mom</s> <v>might say</v>, / “Your room looks like a pigsty!”", ko:"때때로 네 방이 지저분할 때, 엄마는 “네 방은 돼지우리 같구나!”라고 말할지도 모른다.", tip:"might + 동사원형 = ~할지도 모른다. pigsty = 돼지우리."},
    {en:"But / <s>that</s><v>’s</v> not <c>true</c>!", ko:"하지만 그것은 사실이 아니다!", tip:"that = 돼지가 더럽다는 생각."},
    {en:"<s>Pigs</s> <v>don’t like</v> <o>being dirty</o>.", ko:"돼지는 더러워지는 것을 좋아하지 않는다.", tip:"like + 동명사(being) = ~하는 것을 좋아하다."},
    {en:"<s>They</s> <v>are</v> actually <c>very clean animals</c>.", ko:"그들은 사실 매우 깨끗한 동물이다.", tip:"actually = 실제로, 사실은."},
    {en:"<v>Did</v> <s>you</s> <v>know</v> / <o>pigs are smart about being clean</o>?", ko:"돼지가 깨끗하게 지내는 것에 대해 똑똑하다는 것을 알았나요?", tip:"about + 동명사(being clean)."},
    {en:"<s>They</s> <v>make</v> <o>their homes</o> / in three parts.", ko:"그들은 집을 세 부분으로 나누어 만든다.", tip:"in three parts = 세 부분으로."},
    {en:"<s>One part</s> <v>is</v> for sleeping, / <s>another</s> <v>is</v> for eating, / and <s>the other</s> <v>is</v> for going to the bathroom.", ko:"한 부분은 잠자기 위한 곳이고, 또 하나는 먹기 위한 곳이며, 나머지 하나는 화장실에 가기 위한 곳이다.", tip:"셋 중: one(하나) / another(또 하나) / the other(나머지 하나). for + 동명사."},
    {en:"<s>Pigs</s> <v>don’t go</v> pee or poo / near where they eat or sleep.", ko:"돼지는 그들이 먹거나 자는 곳 근처에서 소변이나 대변을 보지 않는다.", tip:"near where ~ = ~하는 곳 근처에서."},
    {en:"So, / why <v>do</v> <s>people</s> <v>think</v> / <o>pigs are dirty</o>?", ko:"그렇다면, 왜 사람들은 돼지가 더럽다고 생각할까?", tip:"Why do + 주어 + 동사원형 ~?"},
    {en:"<s>It</s><v>’s</v> / <c>because they like to roll in the mud</c>.", ko:"그것은 그들이 진흙에서 뒹구는 것을 좋아하기 때문이다.", tip:"It’s because ~ = 그것은 ~ 때문이다. like to + 동사원형 = like + -ing."},
    {en:"<s>Pigs</s> <v>can’t sweat</v> / like we do.", ko:"돼지는 우리처럼 땀을 흘릴 수 없다.", tip:"like we do = 우리가 그러는 것처럼 (do = sweat)."},
    {en:"So / when they get too hot, / <s>they</s> <v>roll</v> in the mud / to cool off.", ko:"그래서 너무 더워지면, 그들은 몸을 식히기 위해 진흙에서 뒹군다.", tip:"get + 형용사 = ~해지다. to cool off = 식히기 위해 (목적)."},
    {en:"Next time / someone says something bad about pigs, / <s>you</s> <v>can tell</v> <o>them</o> <o>the truth</o>!", ko:"다음에 누군가가 돼지에 대해 나쁜 말을 하면, 너는 그들에게 진실을 말해 줄 수 있다!", tip:"Next time + 주어 + 동사 = 다음에 ~할 때. tell + 사람 + 사물 (4형식)."},
    {en:"<s>You</s> <v>can be</v> <c>a pig defender</c>!", ko:"너는 돼지 옹호자가 될 수 있다!", tip:"defender = 옹호자, 지키는 사람 (defend + -er)."}
   ]}
 ],
 riddle:{clues:["I am a place in the Atlantic Ocean.","Many airplanes and ships have disappeared here.","Compasses stop working here.","I have three sides!"], answer:"The Bermuda Triangle! 버뮤다 삼각 지대"},
 grammar:[
  {title:"현재완료 (have + 과거분사)", sub:"(지금까지) ~해 왔다 / ~했다", formula:"주어 + <em>have/has + 과거분사</em>",
   ex:[["So far, many airplanes and ships <mark>have disappeared</mark>.","지금까지 사라졌다 (경험·결과)"],["Their compasses <mark>stop working</mark>.","stop + -ing = ~하는 것을 멈추다"],["Some sailors <mark>get scared</mark>.","get + 형용사 = ~해지다"]],
   note:"현재완료와 자주 쓰는 말: <b>so far, already, ever, never, for, since</b><br>과거 시점(yesterday, in 2010)과는 함께 쓰지 않아요.",
   fix:[["Many ships has disappeared.","Many ships have disappeared.","복수 주어 → have"],["Many ships have disappear.","Many ships have disappeared.","have + 과거분사"],["Ships have disappeared yesterday.","Ships disappeared yesterday.","과거 시점 → 과거시제"]]},
  {title:"It takes + 사람 + 시간 + to ~", sub:"~가 …하는 데 (시간이) 걸리다", formula:"It <em>took</em> + 사람 + 시간 + <em>to 동사원형</em>",
   ex:[["<mark>It took</mark> Gabriel a long time <mark>to return</mark> to Heaven.","돌아가는 데 오랜 시간이 걸렸다"],["The baby was <mark>no longer</mark> a baby <mark>but</mark> a young man.","no longer A but B"],["By the time he arrived, the flower <mark>had</mark> already <mark>died</mark>.","과거완료"]],
   note:"현재: It <b>takes</b> me 10 minutes <b>to walk</b> to school.<br><b>give + 사람 + 사물</b> = God gave him an important task.",
   fix:[["It took Gabriel a long time return.","It took Gabriel a long time to return.","to + 동사원형"],["It took a long time to Gabriel return.","It took Gabriel a long time to return.","It took + 사람 + 시간 + to ~"],["God gave an important task him.","God gave him an important task.","사람 → 사물 순서 (아니면 to him)"]]},
  {title:"동명사 · one / another / the other", sub:"~하는 것 / 하나, 또 하나, 나머지 하나", formula:"like·about·for + <em>동사-ing</em> | <em>one ~ another ~ the other</em>",
   ex:[["Pigs don’t like <mark>being</mark> dirty.","like의 목적어"],["Pigs are smart about <mark>being</mark> clean.","전치사 뒤 동명사"],["<mark>One</mark> part is for sleeping, <mark>another</mark> is for eating, and <mark>the other</mark> is for going to the bathroom.","셋 중"]],
   note:"둘 중: <b>one ~ the other</b> / 셋 중: <b>one ~ another ~ the other</b><br><b>It’s because ~</b> = 그것은 ~ 때문이다",
   fix:[["Pigs don’t like be dirty.","Pigs don’t like being dirty.","like + 동명사 (또는 to be)"],["One is for sleeping, the other is for eating, and another is ~","One ~ another ~ the other ~","마지막 남은 하나 → the other"],["They roll in the mud to cooling off.","They roll in the mud to cool off.","to + 동사원형"]]}
 ],

{no:"05",
 passages:[
  {no:"13", ko:"양 뿔을 닮은 간식, 추로스", en:"The Story of Churros",
   task:"<b>Find</b> 추로스라는 이름이 붙은 이유 찾기",
   note:["질문: \"Who made churros first?\" → shepherds in Spain. \"What does ‘churro’ mean?\" → horn.","5형식 name + 목적어 + 이름 (named it “churro”), 동명사 주어 Dipping ~ was를 짚어 주세요."],
   lines:[
    {en:"Long ago / in Spain, / <s>some shepherds</s> <v>lived</v> / in the cold mountains.", ko:"오래전 스페인에서, 몇몇 목동들이 추운 산에 살았다.", tip:"shepherd = 목동, 양치기. long ago = 오래전에."},
    {en:"One day, / <s>they</s> <v>wanted</v> <o>a warm, sweet snack</o>.", ko:"어느 날, 그들은 따뜻하고 달콤한 간식을 원했다.", tip:"형용사 두 개(warm, sweet)가 snack을 꾸며요."},
    {en:"So, / <s>they</s> <v>made</v> <o>dough</o> / and <v>fried</v> <o>it</o> / in oil.", ko:"그래서, 그들은 반죽을 만들어 기름에 튀겼다.", tip:"fry → fried (y → ied). dough = 반죽."},
    {en:"Then, / <s>they</s> <v>put</v> <o>sugar</o> / on top.", ko:"그런 다음, 그들은 맨 위에 설탕을 뿌렸다.", tip:"put-put-put (과거형 같음). on top = 맨 위에."},
    {en:"Yum! / <s>The shepherds</s> <v>thought</v> / <o>the snack looked like their sheep’s curly horns</o>.", ko:"음, 맛있다! 목동들은 그 간식이 그들의 양의 곱슬곱슬한 뿔처럼 생겼다고 생각했다.", tip:"think-thought. look like + 명사. sheep은 단수·복수가 같아요."},
    {en:"<s>They</s> <v>named</v> <o>it</o> <c>“churro,”</c> / the Spanish word for “horn.”", ko:"그들은 그것을 스페인어로 ‘뿔’을 뜻하는 말인 ‘추로’라고 이름 지었다.", tip:"name + 목적어 + 이름 = ~을 …라고 이름 짓다 (5형식). the Spanish word for ~ = ~를 뜻하는 스페인어."},
    {en:"Many years later, / <s>people in Spain</s> <v>started</v> <o>selling churros</o> / on the street.", ko:"여러 해 뒤, 스페인 사람들은 거리에서 추로스를 팔기 시작했다.", tip:"start + -ing = ~하기 시작하다 (start to ~도 가능)."},
    {en:"<s>They</s> <v>have</v> <o>a crunchy outside and soft inside</o>.", ko:"그것은 겉은 바삭하고 속은 부드럽다.", tip:"crunchy = 바삭한. outside ↔ inside."},
    {en:"<s>People</s> <v>ate</v> <o>them</o> / with thick, warm chocolate.", ko:"사람들은 그것을 진하고 따뜻한 초콜릿과 함께 먹었다.", tip:"eat-ate-eaten. thick = (액체가) 진한."},
    {en:"<s>Dipping a churro in chocolate</s> <v>was</v> <c>the best part</c>!", ko:"추로스를 초콜릿에 찍어 먹는 것이 최고의 부분이었다!", tip:"동명사 주어(Dipping ~) → 단수 동사 was. dip A in B = A를 B에 찍다."},
    {en:"<s>They</s> <v>call</v> <o>it</o> <c>“chocolate con churros.”</c>", ko:"그들은 그것을 ‘초콜라테 콘 추로스’라고 부른다.", tip:"call + 목적어 + 이름 = ~을 …라고 부르다 (5형식)."},
    {en:"Even today, / <s>people in Spain</s> <v>love</v> <o>churros</o> / for breakfast.", ko:"오늘날에도, 스페인 사람들은 아침 식사로 추로스를 좋아한다.", tip:"even today = 오늘날에도. for breakfast = 아침 식사로."},
    {en:"<v>Do</v> <s>you</s> <v>want</v> <o>to try one</o>?", ko:"하나 먹어 보고 싶나요?", tip:"want to + 동사원형. one = a churro."},
    {en:"Just <v>dip</v>, <v>bite</v>, and <v>enjoy</v>!", ko:"그냥 찍고, 베어 물고, 즐기세요!", tip:"명령문 3개를 나란히. bite = 한 입 베어 먹다."}
   ]},
  {no:"14", ko:"목욕 금지! 씻으면 감옥 가요", en:"Kings Who Didn’t Bathe",
   task:"<b>Find</b> 목욕을 싫어한 왕과 여왕 3명 찾기",
   note:["질문: \"Why didn’t kings and queens like bathing?\" → They thought warm water would let germs in.","either(~도 역시, 부정문), even + 비교급(훨씬 더)을 짚어 주세요. 가정 표현 If ~ heard, they would be shocked도 맛보기로."],
   lines:[
    {en:"How many times / <v>do</v> <s>you</s> <v>take</v> <o>a shower</o> / each day?", ko:"당신은 매일 몇 번 샤워를 하나요?", tip:"How many times ~? = 몇 번 ~? take a shower = 샤워하다."},
    {en:"Maybe once or twice.", ko:"아마 한두 번일 것이다.", tip:"once = 한 번, twice = 두 번."},
    {en:"But / if kings and queens / from the 15th to 18th centuries / heard this, / <s>they</s> <v>would be</v> <c>shocked</c>.", ko:"하지만 15세기부터 18세기까지의 왕과 여왕들이 이것을 듣는다면, 그들은 충격을 받을 것이다.", tip:"If + 과거, would + 동사원형 = (실제는 아니지만) ~라면 …할 텐데. century = 세기."},
    {en:"At that time, / <s>kings and queens</s> <v>didn’t like</v> <o>to wash</o>.", ko:"그 당시, 왕과 여왕들은 씻는 것을 좋아하지 않았다.", tip:"at that time = 그 당시에. like to + 동사원형."},
    {en:"For example, / <s>Queen Isabella of Spain</s> almost never <v>took</v> <o>a bath</o>.", ko:"예를 들어, 스페인의 이사벨라 여왕은 거의 목욕을 하지 않았다.", tip:"almost never = 거의 ~하지 않다. take a bath = 목욕하다."},
    {en:"<s>She</s> <v>was</v> even <c>proud</c> of it!", ko:"그녀는 심지어 그것을 자랑스러워했다!", tip:"be proud of ~ = ~을 자랑스러워하다. even = 심지어."},
    {en:"<s>King Louis XIV of France</s> <v>did not bathe</v> much, / either.", ko:"프랑스의 루이 14세도 목욕을 많이 하지 않았다.", tip:"부정문 + either = ~도 역시 (…않다). 긍정문이면 too. bathe = 목욕하다."},
    {en:"<s>He</s> only <v>took</v> <o>a bath</o> / a few times / in his life.", ko:"그는 평생 단지 몇 번만 목욕했다.", tip:"a few times = 몇 번. in his life = 평생."},
    {en:"<s>King Philip II of Spain</s> <v>was</v> even <c>stricter</c>.", ko:"스페인의 펠리페 2세는 훨씬 더 엄격했다.", tip:"even + 비교급 = 훨씬 더 ~한. strict → stricter."},
    {en:"<s>He</s> <v>put</v> <o>people</o> in jail / for taking baths!", ko:"그는 목욕을 했다는 이유로 사람들을 감옥에 가두었다!", tip:"put A in jail = A를 감옥에 넣다. for + 동명사 = ~했다는 이유로."},
    {en:"Why <v>didn’t</v> <s>they</s> <v>like</v> <o>bathing</o>?", ko:"그들은 왜 목욕하는 것을 좋아하지 않았을까?", tip:"like + 동명사(bathing)."},
    {en:"<s>Warm water</s> <v>opens</v> <o>the skin’s pores</o>.", ko:"따뜻한 물은 피부의 모공을 연다.", tip:"pore = 모공. skin’s = 피부의."},
    {en:"<s>They</s> <v>thought</v> / <o>this would let germs in / and make them sick</o>.", ko:"그들은 이것이 세균을 들어오게 하고 그들을 아프게 만들 거라고 생각했다.", tip:"let + 목적어 + in = ~을 들어오게 하다. make + 목적어 + 형용사. would = will의 과거."},
    {en:"So, / <s>they</s> <v>believed</v> / <o>not bathing would keep them healthy</o>.", ko:"그래서, 그들은 목욕하지 않는 것이 그들을 건강하게 지켜 줄 거라고 믿었다.", tip:"not bathing = 목욕하지 않는 것 (동명사 부정은 not을 앞에). keep + 목적어 + 형용사."}
   ]},
  {no:"15", ko:"국수는 후루룩, 트림은 감사 인사?!", en:"Eating Noises Around the World",
   task:"<b>Compare</b> 미국 · 중국 · 일본의 식사 소리 예절을 표로 정리",
   note:["질문: \"Is it okay to burp in China?\" → Yes, it means you liked the food.","not only A but also B, 동명사 주어 making noise ~ is okay, make sure를 짚어 주세요."],
   lines:[
    {en:"<s>People</s> <v>eat</v> / in different ways / all over the world.", ko:"전 세계 사람들은 다양한 방식으로 먹는다.", tip:"in different ways = 다양한 방식으로. all over the world = 전 세계에서."},
    {en:"<s>Some things</s> <v>are</v> <c>good to do</c> / in one place, / but not in another!", ko:"어떤 것들은 한 곳에서는 하기 좋지만, 다른 곳에서는 그렇지 않다!", tip:"형용사 + to부정사 = ~하기에 …한. another = another place."},
    {en:"Sometimes / <s>it</s><v>’s</v> not only <c>what you eat</c>, / but also <c>the way you eat</c> / that matters.", ko:"때때로 중요한 것은 당신이 무엇을 먹느냐뿐만 아니라 당신이 먹는 방식이기도 하다.", tip:"not only A but also B = A뿐만 아니라 B도. It is ~ that matters = 중요한 것은 바로 ~이다."},
    {en:"<s>One thing / people think about</s> <v>is</v> <c>eating noise</c>.", ko:"사람들이 생각하는 한 가지는 먹는 소리이다.", tip:"One thing (that) people think about = 사람들이 생각하는 한 가지. 동사는 is."},
    {en:"In America, / <s>you</s> <v>should not make</v> <o>noise</o> / when you eat.", ko:"미국에서는, 먹을 때 소리를 내면 안 된다.", tip:"should not + 동사원형 = ~하면 안 된다. make noise = 소리를 내다."},
    {en:"<s>It</s> <v>is</v> not <c>nice</c> / <s>to chew loudly or slurp your food</s>.", ko:"큰 소리로 씹거나 음식을 후루룩거리는 것은 좋지 않다.", tip:"가주어 It, 진주어 to chew ~. slurp = 후루룩 먹다."},
    {en:"But / in some places in Asia, / <s>it</s> <v>is</v> <c>okay</c> / <s>to make noise</s>.", ko:"하지만 아시아의 어떤 곳에서는, 소리를 내도 괜찮다.", tip:"It is okay to ~ = ~해도 괜찮다 (가주어 It)."},
    {en:"In China, / if you burp after you eat, / <s>it</s> <v>means</v> / <o>you liked the food a lot</o>!", ko:"중국에서는, 먹은 후에 트림을 하면, 그것은 당신이 음식을 많이 좋아했다는 뜻이다!", tip:"burp = 트림하다. mean (that) ~ = ~라는 뜻이다."},
    {en:"<s>It</s> <v>tells</v> <o>the cook</o> / <o>that the food was yummy</o>.", ko:"그것은 요리사에게 음식이 맛있었다는 것을 알려 준다.", tip:"tell + 사람 + that절. cook = 요리사 (cooker는 요리 기구!)."},
    {en:"In Japan, / <s>people</s> <v>slurp</v> / when they eat noodles or soup.", ko:"일본에서는, 사람들이 국수나 국을 먹을 때 후루룩 소리를 낸다.", tip:"noodle = 국수."},

{no:"06",
 passages:[
  {no:"16", ko:"노래의 인기 비결은?", en:"The Secret of Popular Songs",
   task:"<b>Sing</b> “Baby Shark”를 같이 부르며 반복되는 부분 세어 보기",
   note:["질문: \"What makes a song popular?\" → repetition. \"Why do people love repetition?\" → easy to understand / help people remember.","명사절 that (found that ~), what makes a song popular, make + O + C(fun to listen to)를 짚어 주세요."],
   lines:[
    {en:"<v>Do</v> <s>you</s> <v>know</v> / <o>what makes a song popular</o>?", ko:"무엇이 노래를 인기 있게 만드는지 알고 있나요?", tip:"간접의문문 what(주어) + makes. make + O + 형용사(popular)."},
    {en:"<s>Music experts</s> <v>found</v> / <o>that repetition is one reason</o>.", ko:"음악 전문가들은 반복이 하나의 이유라는 것을 알아냈다.", tip:"find that ~ = ~라는 것을 알아내다 (that절 = 목적어). repeat → repetition."},
    {en:"<s>People</s> <v>love</v> <o>songs / with repeating melodies and lyrics</o>.", ko:"사람들은 반복되는 멜로디와 가사가 있는 노래를 좋아한다.", tip:"with ~ = ~이 있는. repeating = 반복되는 (현재분사). lyrics = 가사."},
    {en:"<s>The researchers</s> <v>studied</v> <o>popular songs</o>.", ko:"연구원들은 인기 있는 노래들을 연구했다.", tip:"study → studied (y → ied)."},
    {en:"<s>They</s> <v>found</v> / <o>that the top ten songs had more repetition / than other songs</o>.", ko:"그들은 상위 10곡이 다른 노래들보다 반복이 더 많다는 것을 알아냈다.", tip:"more + 명사 + than ~ = ~보다 더 많은 …"},
    {en:"<s>A good example</s> <v>is</v> <c>the song “Baby Shark.”</c>", ko:"좋은 예는 ‘아기 상어’라는 노래이다.", tip:"the song “Baby Shark” = ‘아기 상어’라는 노래 (동격)."},
    {en:"<s>It</s> <v>is</v> <c>one of the most famous children’s songs</c>.", ko:"그것은 가장 유명한 동요 중 하나이다.", tip:"one of the + 최상급 + 복수 명사 = 가장 ~한 것들 중 하나."},
    {en:"<s>It</s> <v>goes</v> like this: / “Baby shark, doo doo doo doo doo doo. / Baby shark, doo doo doo doo doo doo.”", ko:"그것은 이렇게 된다. “아기 상어, 뚜 루루 뚜루. 아기 상어, 뚜 루루 뚜루.”", tip:"It goes like this = (노래가) 이렇게 된다."},
    {en:"As you can see, / <s>“doo doo”</s> <v>repeats</v> / many times.", ko:"보다시피, ‘뚜 루’가 여러 번 반복된다.", tip:"As you can see = 보다시피. many times = 여러 번."},
    {en:"Why <v>do</v> <s>people</s> <v>love</v> <o>songs with repetition</o>?", ko:"사람들은 왜 반복이 있는 노래를 좋아할까?", tip:"Why do + 주어 + 동사원형?"},
    {en:"<s>These songs</s> <v>are</v> <c>easy to understand</c>.", ko:"이런 노래들은 이해하기 쉽다.", tip:"형용사 + to부정사 = ~하기에 …한. easy to understand = 이해하기 쉬운."},
    {en:"<s>The repeated parts</s> <v>help</v> <o>people</o> <c>remember them</c>.", ko:"반복된 부분들은 사람들이 그것들을 기억하도록 돕는다.", tip:"help + 목적어 + 동사원형 = ~가 …하도록 돕다. repeated = 반복된 (과거분사)."},
    {en:"<s>This</s> <v>makes</v> <o>the songs</o> <c>fun to listen to</c>!", ko:"이것은 그 노래들을 듣기에 재미있게 만든다!", tip:"make + O + 형용사(fun) + to부정사. listen to의 to를 빼먹지 마세요!"}
   ]},
  {no:"17", ko:"거울 속 너, 매력 있어!", en:"Love Yourself in the Mirror",
   task:"<b>Find</b> 기분이 나아지는 방법 3가지(First / In addition / Finally) 찾기",
   note:["자존감 이야기. 학생들이 각자 ‘나의 좋은 점 하나’를 영어로 말해 보게 하면 좋아요.","the 비교급, the 비교급 (The more you look, the more flaws you notice), have a hard time -ing를 짚어 주세요."],
   lines:[
    {en:"For teens like you, / <s>looking in a mirror</s> <v>is</v> <c>a daily routine</c>.", ko:"너와 같은 십 대들에게, 거울을 보는 것은 매일의 일과이다.", tip:"동명사 주어(looking ~) → is. daily routine = 일상, 매일의 일과."},
    {en:"<s>You</s> probably <v>think</v> / “I’m too short!” / or “I’m too fat!”", ko:"너는 아마 “나는 너무 작아!” 또는 “나는 너무 뚱뚱해!”라고 생각할 것이다.", tip:"probably = 아마도. too + 형용사 = 너무 ~한."},
    {en:"The more you look, / the more flaws you notice.", ko:"더 많이 볼수록, 더 많은 결점을 알아차리게 된다.", tip:"The + 비교급 ~, the + 비교급 … = ~할수록 더 …하다. flaw = 결점."},
    {en:"But / <s>you</s> <v>are</v> not <c>alone</c>.", ko:"하지만 너만 그런 게 아니다.", tip:"You are not alone = 너 혼자가 아니다."},
    {en:"<s>Many people</s> also <v>have</v> <o>a hard time</o> / accepting their bodies.", ko:"많은 사람들도 자신의 몸을 받아들이는 데 어려움을 겪는다.", tip:"have a hard time -ing = ~하는 데 어려움을 겪다. accept = 받아들이다."},
    {en:"If you only think about what you don’t like, / <s>you</s> <v>might start</v> <o>to hate yourself</o>.", ko:"만약 네가 마음에 들지 않는 것만 생각한다면, 너는 자신을 미워하기 시작할지도 모른다.", tip:"what you don’t like = 네가 좋아하지 않는 것. might = ~할지도 모른다. yourself = 너 자신."},
    {en:"So, / <v>don’t be</v> so hard on <o>yourself</o>.", ko:"그러니, 너 자신에게 너무 엄격하게 굴지 마라.", tip:"Don’t be ~ = ~하지 마라. be hard on ~ = ~에게 엄격하게 굴다."},
    {en:"Here <v>are</v> <s>some things / that can help you feel better</s>.", ko:"여기 네가 기분이 나아지도록 도와줄 수 있는 몇 가지가 있다.", tip:"Here are + 복수 주어. help + O + 동사원형. better = good/well의 비교급."},
    {en:"First, / <v>accept</v> <o>your body</o> / as it is.", ko:"첫째, 네 몸을 있는 그대로 받아들여라.", tip:"as it is = 있는 그대로."},
    {en:"<s>Nobody</s> <v>is</v> <c>perfect</c>, / and <s>you</s> <v>don’t have to be</v> <c>perfect</c>, / either.", ko:"완벽한 사람은 없고, 너도 완벽할 필요가 없다.", tip:"Nobody + 단수 동사. don’t have to = ~할 필요가 없다. 부정문 + either."},
    {en:"<s>You</s> just <v>need</v> <o>to be yourself</o>.", ko:"너는 그냥 너 자신이면 된다.", tip:"need to + 동사원형. be yourself = 너답게 있다."},
    {en:"In addition, / <v>find</v> <o>things / to like about yourself</o>.", ko:"게다가, 너 자신에 대해 좋아할 만한 점들을 찾아라.", tip:"things to like = 좋아할 것들 (to부정사가 명사를 뒤에서 꾸밈). in addition = 게다가."},
    {en:"<s>They</s> <v>can be</v> <c>your hair, your hands, or even your smile</c>.", ko:"그것들은 너의 머리카락, 손, 또는 미소일 수도 있다.", tip:"even = 심지어. A, B, or C."},
    {en:"Finally, / <v>remember</v> / <o>that nobody is like you</o>.", ko:"마지막으로, 아무도 너와 같지 않다는 것을 기억해라.", tip:"remember that ~. nobody is like you = 너 같은 사람은 없다."},
    {en:"<s>You</s> <v>are</v> <c>one of a kind</c>, / and <s>that</s><v>’s</v> <c>what makes you special</c>.", ko:"너는 하나뿐인 존재이고, 그것이 너를 특별하게 만드는 것이다.", tip:"one of a kind = 하나뿐인 존재. what makes you special = 너를 특별하게 만드는 것."}
   ]},
  {no:"18", ko:"돌고래 수면의 비밀", en:"How Dolphins Sleep",
   task:"<b>Calculate</b> 돌고래 뇌 한쪽은 몇 시간 자나요? 하루에 모두 몇 시간?",
   note:["질문: \"Why can’t dolphins sleep like humans?\" → They need to breathe air. They could drown.","가정법 과거 If dolphins slept like humans, they could drown / one ~ the other / take turns -ing를 짚어 주세요."],
   lines:[
    {en:"<s>Dolphins</s> <v>breathe</v> / in a different way / than fish.", ko:"돌고래는 물고기와 다른 방식으로 숨을 쉰다.", tip:"breathe(동사, 숨 쉬다) ↔ breath(명사, 숨). in a different way than ~ = ~와 다른 방식으로."},
    {en:"<s>Fish</s> <v>take</v> <o>oxygen</o> / from the water.", ko:"물고기는 물에서 산소를 얻는다.", tip:"take A from B = B에서 A를 얻다. oxygen = 산소."},

    {en:"But / <s>dolphins</s> <v>are</v> <c>mammals</c>, / just like us.", ko:"하지만 돌고래는 우리처럼 포유류이다.", tip:"mammal = 포유류. just like us = 꼭 우리처럼."},
    {en:"<s>This</s> <v>means</v> / <o>dolphins need to breathe air / from above the water</o>.", ko:"이것은 돌고래가 물 위에서 공기를 들이마셔야 한다는 뜻이다.", tip:"This means (that) ~ = 이것은 ~라는 뜻이다."},
    {en:"<s>They</s> <v>go</v> to the surface / every few minutes / to take a breath.", ko:"그들은 숨을 쉬기 위해 몇 분마다 수면으로 올라간다.", tip:"every few minutes = 몇 분마다. take a breath = 숨을 쉬다. to = 목적."},
    {en:"If dolphins slept like humans, / <s>they</s> <v>could drown</v>.", ko:"만약 돌고래가 인간처럼 잔다면, 그들은 익사할 수도 있다.", tip:"If + 과거, could + 동사원형 = (사실과 반대) ~라면 …할 수도 있다. drown = 익사하다."},
    {en:"How <v>can</v> <s>dolphins</s> <v>sleep</v> / and still <v>breathe</v>?", ko:"돌고래는 어떻게 잠을 자면서 여전히 숨을 쉴 수 있을까?", tip:"can 뒤 동사원형 두 개(sleep, breathe)."},
    {en:"<s>Nature</s> <v>helps</v> <o>them</o> / with this!", ko:"자연이 이것을 도와준다!", tip:"help A with B = A를 B에 대해 돕다."},
    {en:"<s>A dolphin’s brain</s> <v>has</v> <o>two parts</o>, / like a human’s brain.", ko:"돌고래의 뇌는 인간의 뇌처럼 두 부분으로 되어 있다.", tip:"a human’s brain = 인간의 뇌."},
    {en:"But / <s>dolphins</s> <v>can’t sleep</v> completely / like we do.", ko:"하지만 돌고래는 우리처럼 완전히 잠들 수는 없다.", tip:"completely = 완전히. like we do = 우리가 그러는 것처럼."},
    {en:"When they sleep, / <s>they</s> <v>turn off</v> <o>one part of their brain</o>.", ko:"잘 때, 그들은 뇌의 한 부분을 끈다.", tip:"turn off = 끄다 ↔ turn on."},
    {en:"<s>The other part</s> <v>stays</v> <c>awake</c>.", ko:"나머지 한 부분은 깨어 있다.", tip:"둘 중 one ~ the other. stay + 형용사 = ~한 상태로 있다."},
    {en:"After about two hours, / <s>the parts</s> <v>switch</v>.", ko:"약 두 시간 후, 두 부분이 바뀐다.", tip:"switch = 바꾸다, 전환하다. about = 약."},
    {en:"<s>They</s> <v>take</v> <o>turns</o> / staying awake, / so <s>each part</s> <v>gets</v> <o>about four hours of sleep</o>.", ko:"그들은 번갈아 가며 깨어 있어서, 각 부분이 약 4시간의 잠을 잔다.", tip:"take turns -ing = 번갈아 ~하다. each + 단수 명사 + 단수 동사."},
    {en:"This way, / <s>dolphins</s> <v>can have</v> <o>eight hours of sleep</o> / in a day!", ko:"이런 식으로, 돌고래는 하루에 8시간의 잠을 잘 수 있다!", tip:"this way = 이런 식으로."}
   ]}

 grammar:[

   fix:[["It is one of the most famous song.","It is one of the most famous songs.","one of + 복수 명사"],["They help people remembering them.","They help people remember them.","help + O + 동사원형 (to ~도 가능)"],["The songs are fun to listen.","The songs are fun to listen to.","listen to의 to 유지"]]},
  {title:"the 비교급, the 비교급", sub:"~할수록 더 …하다", formula:"<em>The + 비교급</em> + 주어 + 동사, <em>the + 비교급</em> + 주어 + 동사",
   ex:[["<mark>The more</mark> you look, <mark>the more</mark> flaws you notice.","더 볼수록 더 많은 결점을"],["Many people <mark>have a hard time accepting</mark> their bodies.","~하는 데 어려움을 겪다"],["Find things <mark>to like</mark> about yourself.","to부정사가 명사 수식"]],
   note:"예) <b>The harder</b> you study, <b>the better</b> grades you get.<br><b>don’t have to</b> = ~할 필요가 없다 (must not = ~하면 안 된다)",
   fix:[["More you look, more flaws you notice.","The more you look, the more flaws you notice.","the를 꼭 붙여요"],["They have a hard time to accept their bodies.","They have a hard time accepting their bodies.","have a hard time -ing"],["Nobody are perfect.","Nobody is perfect.","Nobody → 단수"]]},
  {title:"가정법 과거 · one ~ the other", sub:"(사실과 반대) ~라면 …할 텐데 / 둘 중 하나, 나머지 하나", formula:"If + 주어 + <em>과거</em>, 주어 + <em>could/would</em> + 동사원형",
   ex:[["If dolphins <mark>slept</mark> like humans, they <mark>could drown</mark>.","실제로는 그렇게 자지 않음"],["They turn off <mark>one</mark> part. <mark>The other</mark> part stays awake.","둘 중"],["They <mark>take turns staying</mark> awake.","번갈아 ~하다"]],
   note:"be동사는 주어와 상관없이 <b>were</b>: If I <b>were</b> a dolphin, I <b>would</b> sleep half.<br><b>each</b> + 단수 명사 + 단수 동사 → each part <b>gets</b>",
   fix:[["If dolphins sleep like humans, they could drown.","If dolphins slept like humans, they could drown.","가정법 과거 → 과거형"],["They take turns to stay awake.","They take turns staying awake.","take turns -ing"],["Each part get four hours.","Each part gets four hours.","each → 단수"]]}
 ],

{no:"07",
 passages:[
  {no:"19", ko:"지구가 46살이라면?", en:"If the Earth Were 46",
   task:"<b>Timeline</b> 지구 나이 46살 시간표 만들기 (42세 → 45세 → 8개월 전 → … → 1분 전)",
   note:["칠판에 46칸 시간표를 그리고 사건을 붙이게 하면 좋아요. 인간은 겨우 ‘4시간’ 전에 등장!","현재완료 계속 have been here for, help + O + 동사원형, turn A into B를 짚어 주세요."],
   lines:[
    {en:"How old <v>is</v> <s>the Earth</s>?", ko:"지구는 몇 살일까?", tip:"How old ~? = 몇 살?"},
    {en:"<s>Scientists</s> <v>say</v> / <o>that the Earth is about 4.6 billion years old</o>.", ko:"과학자들은 지구가 약 46억 살이라고 말한다.", tip:"billion = 10억. 4.6 billion = 46억. about = 약."},
    {en:"<v>Let’s imagine</v> / <o>the Earth is a 46-year-old person</o>.", ko:"지구가 46살인 사람이라고 상상해 보자.", tip:"Let’s + 동사원형 = ~하자. a 46-year-old person = 46살인 사람 (하이픈 연결 시 year는 단수!)."},
    {en:"What <v>happened</v> / during those 46 years?", ko:"그 46년 동안 무슨 일이 일어났을까?", tip:"What이 주어 → What happened? during = ~ 동안."},
    {en:"For the first 7 years, / <s>we</s> <v>don’t know</v> much.", ko:"처음 7년 동안에 대해서는, 우리는 많이 알지 못한다.", tip:"for the first ~ years = 처음 ~년 동안."},
    {en:"<s>Life</s> first <v>appeared</v> / when the Earth was 42 years old.", ko:"생명체는 지구가 42살일 때 처음 나타났다.", tip:"life = 생명(체). appear = 나타나다."},
    {en:"<s>Dinosaurs</s> <v>came</v> / at age 45.", ko:"공룡은 45살에 왔다.", tip:"at age 45 = 45살에."},
    {en:"<s>Mammals</s> <v>appeared</v> / only 8 months ago.", ko:"포유류는 겨우 8개월 전에 나타났다.", tip:"시간 + ago = ~ 전에 (과거시제와 함께)."},
    {en:"A week ago, / <s>some animals</s> <v>started</v> <o>to look more like humans</o>.", ko:"일주일 전에, 몇몇 동물들이 인간과 더 비슷해 보이기 시작했다.", tip:"start to + 동사원형. look more like ~ = ~와 더 닮아 보이다."},
    {en:"<s>Modern humans</s> <v>have been</v> here / for only 4 hours.", ko:"현대 인류는 겨우 4시간 동안 여기에 있어 왔다.", tip:"have been + for 기간 = ~ 동안 계속 있어 왔다 (현재완료 계속)."},
    {en:"<s>People</s> <v>began</v> <o>farming</o> / in the last hour.", ko:"사람들은 마지막 한 시간 안에 농사를 짓기 시작했다.", tip:"begin + -ing = ~하기 시작하다. in the last hour = 최근 한 시간 동안."},
    {en:"<s>The Industrial Revolution</s> <v>started</v> / just one minute ago.", ko:"산업 혁명은 겨우 1분 전에 시작되었다.", tip:"the Industrial Revolution = 산업 혁명."},
    {en:"And / in the last sixty seconds?", ko:"그리고 마지막 60초 동안에는?", tip:"질문으로 긴장감을 줘요."},
    {en:"<s>Technology</s> <v>helped</v> <o>people</o> <c>grow quickly</c>, / but <s>it</s> <v>cost</v> <o>a lot</o>.", ko:"기술은 사람들이 빠르게 성장하도록 도왔지만, 그것은 많은 대가를 치렀다.", tip:"help + O + 동사원형. cost-cost-cost = 비용이 들다."},
    {en:"<s>Humans</s> <v>have turned</v> <o>paradise</o> / into a wasteland.", ko:"인간은 낙원을 황무지로 바꾸어 놓았다.", tip:"turn A into B = A를 B로 바꾸다. have turned = 현재완료 (결과)."}
   ]},
  {no:"20", ko:"백조의 노래", en:"The Swan Song",
   task:"<b>Explain</b> “swan song”의 진짜 뜻을 우리말로 설명하기",
   note:["swan song = 예술가의 마지막 최고 작품, 은퇴 전 마지막 공연. 예: 가수의 마지막 앨범.","too + 형용사 + to부정사(너무 ~해서 …할 수 없다), according to를 짚어 주세요."],
   lines:[
    {en:"According to an old story, / <s>swans</s> <v>sing</v> / only once in their lives.", ko:"옛이야기에 따르면, 백조는 일생에 단 한 번만 노래한다.", tip:"according to ~ = ~에 따르면. once = 한 번."},
    {en:"<s>People</s> <v>say</v> / <o>that swans try really hard / to sing a beautiful song</o>.", ko:"사람들은 백조가 아름다운 노래를 부르기 위해 정말 열심히 노력한다고 말한다.", tip:"try hard to ~ = ~하려고 열심히 노력하다."},
    {en:"When they finish singing, / <s>they</s> <v>get</v> <c>too tired / to do anything else</c>.", ko:"노래를 끝내면, 그들은 너무 지쳐서 다른 어떤 것도 할 수 없다.", tip:"finish + -ing. too + 형용사 + to 동사원형 = 너무 ~해서 …할 수 없다."},
    {en:"So / <s>they</s> <v>fall down</v> / and <v>die</v>.", ko:"그래서 그들은 쓰러져서 죽는다.", tip:"fall down = 쓰러지다."},
    {en:"<s>Some people</s> <v>believed</v> / <o>it was the best and last thing / a swan could do</o>.", ko:"어떤 사람들은 그것이 백조가 할 수 있는 최고이자 마지막 일이라고 믿었다.", tip:"the best and last thing (that) a swan could do = 백조가 할 수 있는 최고이자 마지막 일."},
    {en:"Like swans, / <s>some artists</s> <v>work</v> very hard / to make their art beautiful.", ko:"백조처럼, 어떤 예술가들은 그들의 예술을 아름답게 만들기 위해 매우 열심히 일한다.", tip:"to make = 만들기 위해 (목적). make + O + 형용사."},
    {en:"<s>They</s> <v>use</v> <o>all their time and energy</o>.", ko:"그들은 그들의 모든 시간과 에너지를 쓴다.", tip:"all + their + 명사 = 그들의 모든 ~."},
    {en:"After they finish it, / <s>they</s> <v>are</v> <c>too tired</c>.", ko:"그것을 끝낸 후에, 그들은 너무 지친다.", tip:"it = their art."},
    {en:"<s>Some</s> even <v>die</v> afterward.", ko:"어떤 사람들은 심지어 그 후에 죽기도 한다.", tip:"Some = some artists. afterward = 그 후에."},
    {en:"Today, / <v>pay</v> <o>attention</o> / when someone says “swan song.”", ko:"오늘날, 누군가가 ‘백조의 노래’라고 말할 때 주의를 기울여라.", tip:"pay attention = 주의를 기울이다 (명령문)."},
    {en:"<s>It</s> <v>is</v> not <c>a real song by a swan</c>, / but <c>an artist’s final greatest work</c>.", ko:"그것은 백조가 부르는 진짜 노래가 아니라, 예술가의 마지막 최고 작품이다.", tip:"not A but B = A가 아니라 B. work = 작품."}
   ]},
