<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stella Daily Listening · Intermediate DAY 01~40</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f2a5a; --navy2:#2e3d7c; --berry:#8a2846; --sky:#e9efff; --mint:#e3f6ee;
  --green:#1f9d63; --red:#d64545; --amber:#f2a33a; --bg:#f6f7fb; --ink:#1d2233; --mute:#6b7287;
  --card:#fff; --line:#e3e6ef;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header .inner{max-width:560px;margin:0 auto}
.brand{font-family:'Jua',sans-serif;font-size:13px;opacity:.85;letter-spacing:.5px}
.title{font-family:'Jua',sans-serif;font-size:21px;margin-top:2px}
.steps{display:flex;gap:4px;margin-top:12px}
.steps div{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.25);transition:.3s}
.steps div.done{background:#ffd36b}
.steps div.now{background:#fff}
.steplabel{font-size:12px;margin-top:6px;opacity:.9}
.card{background:var(--card);border-radius:18px;padding:20px 18px;margin-top:16px;box-shadow:0 2px 10px rgba(31,42,90,.06)}
h2{font-family:'Jua',sans-serif;font-size:22px;color:var(--navy);margin-bottom:4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s;background:var(--sky);color:var(--navy)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--navy);color:#fff}
.btn.berry{background:var(--berry);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.speed{display:flex;gap:6px;margin:10px 0}
.speed button{flex:1;padding:8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;font-family:inherit;color:var(--mute);cursor:pointer}
.speed button.on{border-color:var(--navy);color:var(--navy);background:var(--sky)}
input[type=text],textarea{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;outline:none;transition:.15s;background:#fff}
input[type=text]:focus,textarea:focus{border-color:var(--navy2)}
.word{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:2px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.word.heard{border-color:var(--green);background:var(--mint)}
.word b{font-size:18px}
.word span{color:var(--mute);font-size:14px}
.player{background:var(--sky);border-radius:16px;padding:16px;text-align:center}
.wave{display:flex;justify-content:center;gap:4px;height:34px;align-items:center;margin-bottom:10px}
.wave i{width:5px;height:8px;background:var(--navy2);border-radius:3px;opacity:.35}
.playing .wave i{animation:w 1s infinite ease-in-out;opacity:1}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
@keyframes w{0%,100%{height:8px}50%{height:30px}}
.count{font-size:13px;color:var(--mute);margin-top:8px}
.q{margin-top:18px}
.q .qt{font-weight:800;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff;font-family:inherit;font-size:15px;font-weight:600;color:var(--ink);transition:.15s}
.opt .em{font-size:30px;display:block;margin-bottom:2px}
.opt.sel{border-color:var(--navy);background:var(--sky)}
.opt.ok{border-color:var(--green);background:var(--mint)}
.opt.no{border-color:var(--red);background:#fdeaea}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:14px}
.fb.ok{background:var(--mint);color:#11643f}
.fb.no{background:#fdeaea;color:#8e2323}
.script{margin-top:6px}
.line{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.line:last-child{border:none}
.who{flex:0 0 46px;font-family:'Jua',sans-serif;font-size:15px;padding:2px 0;border-radius:8px;text-align:center}
.who.J{background:#e3ecff;color:#2a4cb0}.who.M{background:#ffe6ee;color:#a1284f}
.line .txt{flex:1}
.line .ko{color:var(--mute);font-size:13px}
.line.hl{background:#fff8e2;border-radius:10px}
.mini{border:none;background:none;font-size:18px;cursor:pointer;padding:2px 4px}
.blank{display:inline-block;min-width:76px;border:none;border-bottom:3px solid var(--navy2);font-size:17px;font-family:inherit;text-align:center;padding:2px 4px;margin:0 3px;outline:none;background:transparent;color:var(--navy);font-weight:700}
.blank.ok{border-color:var(--green);color:var(--green)}
.blank.no{border-color:var(--red);color:var(--red)}
.dict{padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
.dict .s{font-size:17px;line-height:2.1}
.tip{display:none;margin-top:8px;font-size:13px;background:#fff4dc;color:#7a4e00;padding:8px 10px;border-radius:10px}
.tip.show{display:block}
.diff span{padding:1px 3px;border-radius:4px;margin-right:2px}
.diff .g{background:var(--mint);color:#11643f}
.diff .r{background:#fdeaea;color:#8e2323;text-decoration:line-through}
.diff .m{background:#fff0c9;color:#7a4e00}
.expr{border-left:5px solid var(--berry);background:#fff6f8;border-radius:12px;padding:14px;margin-bottom:12px}
.expr .e{font-weight:800;font-size:18px;color:var(--berry)}
.expr .k{font-size:14px;color:var(--mute)}
.expr .ex{margin:8px 0;font-size:15px}
.shadow{padding:14px;border:2px solid var(--line);border-radius:14px;margin-bottom:12px}
.shadow .s{font-size:18px;font-weight:700;margin-bottom:10px}
.rec{background:var(--red);color:#fff}
.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
audio{width:100%;margin-top:8px;height:38px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat div{background:var(--sky);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--navy);font-family:'Jua',sans-serif}
.stat span{font-size:13px;color:var(--mute)}
.badge{text-align:center;font-size:64px;margin:6px 0}
.note{font-size:13px;color:var(--mute);margin-top:10px;text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .inner{max-width:560px;margin:0 auto;display:flex;gap:8px}
.hide{display:none!important}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:24px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:.95}
</style>
<style>
.daygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dcard{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px 12px 10px;background:#fff;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);transition:.15s}
.dcard:active{transform:scale(.97)}
.dcard .dn{font-family:'Jua',sans-serif;color:var(--berry);font-size:14px}
.dcard .dt{font-weight:800;font-size:15px;line-height:1.3;margin-top:2px}
.dcard .ds{font-size:12px;color:var(--mute);margin-top:4px}
.dcard.done{border-color:var(--green);background:var(--mint)}
.dcard.done::after{content:'✓';position:absolute;right:10px;top:8px;color:var(--green);font-weight:900;font-size:18px}
.dcard.next{border-color:var(--navy);box-shadow:0 0 0 3px rgba(46,61,124,.15)}
.weekh{font-family:'Jua',sans-serif;color:var(--navy);margin:16px 0 8px;font-size:16px}
.prog{height:10px;background:var(--sky);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--berry))}
.who.N{background:#eef3e6;color:#3f6212;font-size:12px;flex-basis:62px;line-height:1.3}
.linkrow{display:flex;gap:8px;margin-top:10px}
.linkrow a{flex:1;text-align:center;text-decoration:none;font-size:13px;padding:9px;border-radius:10px;background:var(--sky);color:var(--navy);font-weight:700}
</style>
</head>

function lsGet(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ===================== 음성 (TTS) ===================== */
const synth = window.speechSynthesis;
let voices = [];
function loadVoices(){ voices = (synth?synth.getVoices():[]).filter(v=>/^en(-|_)/i.test(v.lang)); }
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function pickVoice(who){
  if(!voices.length) return null;
  const us = voices.filter(v=>/en-US/i.test(v.lang)); const pool = us.length?us:voices;
  const female = pool.find(v=>/female|samantha|zira|aria|jenny|google us english/i.test(v.name));
  const male = pool.find(v=>/male|david|alex|guy|daniel|fred/i.test(v.name) && !/female/i.test(v.name));
  if(who==='N'){ const g=(D()&&D().n)?D().n[1]:'m'; const alt=pool.filter(v=>v!==female&&v!==male);
    return g==='f' ? (alt.find(v=>/female|samantha|zira|aria|jenny|karen|moira|tessa|victoria/i.test(v.name))||female||pool[0]) : (alt[0]||male||pool[0]); }
  if(who==='M') return female || pool[0];
  return male || pool[1] || pool[0];
}
let playToken = 0;
function speak(text, opt={}){
  return new Promise(res=>{
    if(!synth){ toast('이 브라우저는 음성 재생을 지원하지 않아요'); return res(); }
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate = opt.rate || S.rate;
    const v = pickVoice(opt.who||'M'); if(v) u.voice = v;
    u.pitch = opt.who==='J' ? 0.9 : opt.who==='N' ? ((D()&&D().n&&D().n[1]==='f')?1.05:0.8) : 1.15;
    u.onend = res; u.onerror = res;
    synth.speak(u);
  });
}
async function playLines(idxs, el, rate){
  synth && synth.cancel();
  const token = ++playToken;
  el && el.classList.add('playing');
  for(const i of idxs){
    if(token!==playToken) break;
    document.querySelectorAll('.line').forEach(l=>l.classList.toggle('hl', +l.dataset.i===i));
    await speak(D().script[i][1], {who:D().script[i][0], rate});
    await new Promise(r=>setTimeout(r,250));
  }
  if(token===playToken){ el && el.classList.remove('playing'); document.querySelectorAll('.line').forEach(l=>l.classList.remove('hl')); }
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsq = s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function norm(s){
  return s.toLowerCase().replace(/[’']/g,"'")
   .replace(/\bwe're\b/g,'we are').replace(/\bi'm\b/g,'i am').replace(/\bshe's\b/g,'she is').replace(/\bhe's\b/g,'he is')
   .replace(/\bi'll\b/g,'i will').replace(/\bthat's\b/g,'that is').replace(/\bit's\b/g,'it is').replace(/\byou're\b/g,'you are')
   .replace(/\bthey're\b/g,'they are').replace(/\blet's\b/g,'let us').replace(/\bdon't\b/g,'do not').replace(/\bcan't\b/g,'can not')
   .replace(/\bwhat's\b/g,'what is').replace(/\bhow's\b/g,'how is').replace(/\bthere's\b/g,'there is').replace(/\bi'd\b/g,'i would')
   .replace(/\bdidn't\b/g,'did not').replace(/\bcannot\b/g,'can not')
   .replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
}
function wordDiff(target, input){
  const a = norm(target).split(' '), b = norm(input).split(' ').filter(Boolean);
  const dp = Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,html=[],hit=0;
  while(i<a.length && j<b.length){
    if(a[i]===b[j]){ html.push(`<span class="g">${esc(a[i])}</span>`); hit++; i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ html.push(`<span class="m">${esc(a[i])}</span>`); i++; }
    else { html.push(`<span class="r">${esc(b[j])}</span>`); j++; }
  }
  while(i<a.length){ html.push(`<span class="m">${esc(a[i])}</span>`); i++; }
  while(j<b.length){ html.push(`<span class="r">${esc(b[j])}</span>`); j++; }
  return {html:html.join(''), score: Math.round(hit/a.length*100)};
}
function blankParts(t){ return t.split(/(\{[^}]+\})/).filter(Boolean); }
function blankAnswers(t){ return [...t.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]); }
function blankPlain(t){ return t.replace(/[{}]/g,''); }

function hearWord(i,el){ speak(D().words[i][0],{who:'M'}); S.heard.add(i); el.classList.add('heard'); }
function listenAll(){ S.listenCount++; $('#lc').textContent=S.listenCount; playLines(D().script.map((_,i)=>i), $('#pl')); }
function pick(qi,oi){ S.picks[qi]=oi; const box=document.querySelectorAll('.q')[qi]; box.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel',i===oi)); }
function retryPick(qi,oi){ const ans=D().qs[qi][2]; if(S.retry[qi]!==undefined || S.picks[qi]===ans) return; S.retry[qi]=oi; toast(oi===ans?'🎉 다시 듣고 맞혔어요!':'정답과 해설을 확인해요'); render(); }
function checkBlanks(){
  let hit=0,total=0;
  document.querySelectorAll('.blank').forEach(inp=>{
    const b=+inp.dataset.b,k=+inp.dataset.k; const correct = blankAnswers(D().blanks[b][1])[k];
    const raw = inp.value.split('→')[0].trim();
    const ok = norm(raw)===norm(correct); total++; if(ok)hit++;
    inp.classList.toggle('ok',ok); inp.classList.toggle('no',!ok);
    if(!ok){ inp.value = raw ? raw+' → '+correct : correct; inp.style.minWidth='120px'; }
  });
  D().blanks.forEach((_,i)=>$('#bt'+i).classList.add('show'));
  S.blankRes = Math.round(hit/total*100);
  $('#blankScore').innerHTML = `<div class="fb ${S.blankRes>=75?'ok':'no'}">빈칸 ${hit}/${total} 정답 · 🔊 소리 팁을 꼭 읽어보세요!</div>`;
}
function checkFull(){
  let sum=0;
  D().full.forEach((f,fi)=>{ const r=wordDiff(f[1],$('#fd'+fi).value); sum+=r.score;
    $('#fr'+fi).innerHTML = r.html + ` <b style="font-size:13px;color:var(--navy)">${r.score}%</b>`; $('#ft'+fi).classList.add('show'); });
  S.fullRes = Math.round(sum/D().full.length);
  toast(`받아쓰기 정확도 ${S.fullRes}%`);
}
async function repeat3(si){ stopAll(); const t=playToken; for(let i=0;i<3;i++){ if(t!==playToken)break; await speak(D().expr[si][2],{who:'M'}); await new Promise(r=>setTimeout(r,1800)); } }
let rec=null, recIdx=null, chunks=[];
async function toggleRec(si){
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    rec = new MediaRecorder(stream); chunks=[]; recIdx=si;
    rec.ondataavailable = e=>chunks.push(e.data);
    rec.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); const url=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));
      S.recs[recIdx]=url; $('#ra'+recIdx).innerHTML=`<audio controls src="${url}"></audio>`; const b=$('#rb'+recIdx); b.textContent='● 다시 녹음'; b.classList.remove('on'); };
    rec.start(); const b=$('#rb'+si); b.textContent='■ 녹음 중지'; b.classList.add('on');
  }catch(e){ toast('마이크를 사용할 수 없어요. 권한을 확인해 주세요.'); }
}
async function sendResult(){
  const d=D();
  const qScore = d.qs.filter((q,i)=>S.picks[i]===q[2]).length;
  const wrong = d.qs.map((q,i)=>S.picks[i]===q[2]?null:`Q${i+1}`).filter(Boolean).join(', ');
  const payload = {
    type:'listening', name:S.name, class:S.cls, level:CONFIG.LEVEL, day:DAYLABEL(), topic:d.title,
    quizCorrect:qScore, quizScore:`${qScore}/4`, wrongQuestions:wrong||'없음',
    blankScore:S.blankRes??0, dictationScore:S.fullRes??0,
    listenCount:S.listenCount, mySentences:S.mySentences.filter(x=>x.trim()).join(' / '),
    shadowingDone:Object.keys(S.recs).length, minutes:Math.max(1,Math.round((Date.now()-S.startedAt)/60000)),
    submittedAt:new Date().toLocaleString('ko-KR'), submittedISO:new Date().toISOString()
  };
  const msg=$('#sendMsg'), btn=$('#sendBtn');
  if(!CONFIG.APPS_SCRIPT_URL){ msg.textContent='⚙️ 노션 연결 설정 전이에요 (선생님 설정 필요)'; return; }
  btn.disabled=true;
  const ok = await postWithRetry(payload, (n,max)=>{ msg.textContent = n===1 ? '보내는 중...' : `사람이 많아서 다시 보내는 중... (${n}/${max})`; });
  if(ok){ msg.textContent='✅ 선생님께 전달됐어요! 내일도 만나요 👋'; btn.textContent='✓ 전송 완료'; }
  else{
    queuePending(payload);
    btn.disabled=false;
    msg.textContent='📦 결과를 이 기기에 보관했어요. 다음에 이 페이지를 열면 자동으로 다시 보내요. (지금 다시 눌러도 돼요)';
  }
}

/* ===== 자동 재전송: 최대 5회, 대기 시간을 점점 늘리고 무작위로 흩어서 몰림을 피해요 ===== */
async function postWithRetry(payload, onTry){
  const MAX=5;
  for(let n=1;n<=MAX;n++){
    onTry && onTry(n,MAX);
    try{
      const r = await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      const j = await r.json();
      if(j.ok) return true;
      throw new Error(j.error||'저장 실패');
    }catch(e){
      if(n===MAX) return false;
      const wait = Math.min(15000, 1500*Math.pow(2,n-1)) + Math.random()*2000;
      await new Promise(res=>setTimeout(res,wait));
    }
  }
  return false;
}
const PENDING_KEY='stella_listen_pending';
function getPending(){ return lsGet(PENDING_KEY,[]); }
function setPending(a){ try{ a.length?localStorage.setItem(PENDING_KEY,JSON.stringify(a)):localStorage.removeItem(PENDING_KEY); }catch(e){} }
function queuePending(p){ const a=getPending().filter(x=>!(x.name===p.name&&x.day===p.day&&x.submittedISO===p.submittedISO)); a.push(p); setPending(a.slice(-10)); }
async function flushPending(){
  const a=getPending(); if(!a.length || !CONFIG.APPS_SCRIPT_URL) return;
  const left=[];
  for(const p of a){ if(!(await postWithRetry(p))) left.push(p); }
  setPending(left);
  if(a.length>left.length) toast(`📤 지난번 못 보낸 결과 ${a.length-left.length}개를 선생님께 보냈어요`);
}
function restart(){ resetDay(); S.step=1; render(); }
function goHome(){ S.step=0; S.dayIdx=null; render(); try{ history.replaceState(null,'',location.pathname); }catch(e){} }

/* ===================== 네비게이션 ===================== */
$('#nextBtn').onclick = ()=>{
  if(S.step===1 && S.heard.size<5){ toast(`단어 5개를 모두 들어보세요 (${S.heard.size}/5)`); return; }
  if(S.step===2){
    if(S.listenCount<1){ toast('먼저 ▶ 전체 듣기를 눌러주세요'); return; }
    if(S.picks.includes(null)){ toast('4문제를 모두 풀어주세요'); return; }
  }
  if(S.step===4 && (S.blankRes===null || S.fullRes===null)){ toast('빈칸·받아쓰기 모두 채점해 주세요'); return; }
  if(S.step===5 && !S.mySentences.some(x=>x.trim())){ toast('나만의 문장을 1개 이상 써보세요'); return; }
  S.step++;
  if(S.step===7){
    const d=D(), q=d.qs.filter((x,i)=>S.picks[i]===x[2]).length;
    const now=new Date(); markDone({q, d:Math.round(((S.blankRes??0)+(S.fullRes??0))/2), date:`${now.getMonth()+1}/${now.getDate()}`});
  }
  render();
};
$('#prevBtn').onclick = ()=>{ if(S.step===1){ goHome(); return; } if(S.step>0){ S.step--; render(); } };

/* ===================== 시작 ===================== */
loadSaved();
(function(){
  const m = location.search.match(/[?&]day=(\d+)/) || location.hash.match(/day-?(\d+)/);
  const n = m ? +m[1] : 0;
  if(n>=1 && n<=DAYS.length && S.name){ S.dayIdx=n-1; resetDay(); S.step=1; }
  render();
  if(n>=1 && n<=DAYS.length && !S.name) toast(`이름을 적고 DAY ${pad(n)}를 눌러주세요`);
})();
setTimeout(flushPending, 1500 + Math.random()*3000);
</script>
