<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자칠판 대시보드 — 리딩 스킬 탐정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,700;0,900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A44; --navy-deep:#101A2E; --parchment:#F1ECDD;
    --amber:#C9973E; --amber-soft:#E4C589; --teal:#2F6F62;
    --red-clue:#A23B2E; --ink:#26241D; --muted:#5c5847;
  }
  *{box-sizing:border-box;}
  html{font-size:16px;}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--navy-deep);color:var(--parchment);
    min-height:100vh;padding:clamp(16px,2.5vw,36px);}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;aliagn-items:center;gap:14px;margin-bottom:22px;}
  header .title{font-family:'Bitter',serif;font-weight:900;font-size:clamp(24px,3.4vw,42px);}
  header .title span{color:var(--amber);}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
  .case-filter{display:flex;flex-wrap:wrap;gap:8px;}
  .case-filter button{padding:12px 18px;border-radius:6px;border:1.5px solid rgba(201,151,62,0.4);
    background:transparent;color:var(--amber-soft);font-weight:700;font-size:clamp(14px,1.3vw,18px);cursor:pointer;min-height:48px;}
  .case-filter button.picked{background:var(--amber);color:var(--navy-deep);border-color:var(--amber);}
  .view-toggle{display:flex;flex-wrap:wrap;gap:8px;}
  .view-toggle button{padding:12px 18px;border-radius:6px;border:1.5px solid rgba(47,111,98,0.5);
    background:transparent;color:var(--parchment);font-weight:700;font-size:clamp(14px,1.3vw,18px);cursor:pointer;min-height:48px;}
  .view-toggle button.picked{background:var(--teal);border-color:var(--teal);}
  .refresh-btn{padding:12px 26px;border-radius:6px;border:none;background:var(--teal);color:var(--parchment);
    font-weight:700;font-size:clamp(15px,1.4vw,19px);cursor:pointer;min-height:48px;}
  .refresh-btn:active{transform:scale(0.97);}
  .meta-row{font-size:clamp(12px,1vw,15px);color:rgba(241,236,221,0.6);margin-bottom:16px;}

  table{width:100%;border-collapse:collapse;background:var(--parchment);color:var(--ink);border-radius:4px;overflow:hidden;}
  thead th{background:var(--navy-deep);color:var(--amber-soft);font-size:clamp(12px,1vw,16px);letter-spacing:0.4px;
    text-transform:uppercase;padding:14px 10px;text-align:center;font-weight:700;}
  thead th.name-col{text-align:left;padding-left:16px;}
  tbody td{padding:14px 8px;text-align:center;font-size:clamp(14px,1.15vw,19px);border-bottom:1px solid rgba(38,36,29,0.1);}
  tbody td.name-col{text-align:left;padding-left:16px;font-weight:700;font-family:'Bitter',serif;font-size:clamp(15px,1.25vw,20px);}
  tbody tr:nth-child(even){background:rgba(27,42,68,0.04);}
  .mark{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
    font-weight:900;font-size:clamp(14px,1.1vw,17px);}
  .mark.ok{background:#dbeee2;color:var(--teal);}
  .mark.no{background:#f5dcd7;color:var(--red-clue);}
  .conf-pill{font-size:clamp(11px,0.95vw,14px);font-weight:700;padding:4px 10px;border-radius:10px;background:#e8e4d4;color:var(--muted);}
  .empty-state{text-align:center;padding:60px 20px;color:rgba(241,236,221,0.5);font-size:clamp(15px,1.5vw,20px);}
  .summary-preview{font-size:clamp(11px,1vw,14px);color:var(--muted);max-width:180px;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .leaderboard-row{display:flex;align-items:center;gap:16px;background:var(--parchment);color:var(--ink);
    border-radius:6px;padding:16px 22px;margin-bottom:10px;}
  .leaderboard-row .rank{font-family:'Bitter',serif;font-weight:900;font-size:clamp(22px,2.4vw,34px);width:52px;text-align:center;color:var(--navy);}
  .leaderboard-row.top1 .rank{color:#C9973E;}
  .leaderboard-row.top2 .rank{color:#9AA3AD;}
  .leaderboard-row.top3 .rank{color:#B0785A;}
  .leaderboard-row .lb-name{flex:1;font-family:'Bitter',serif;font-weight:700;font-size:clamp(16px,1.8vw,24px);}
  .leaderboard-row .lb-bar-wrap{flex:2;height:16px;background:rgba(38,36,29,0.1);border-radius:8px;overflow:hidden;}
  .leaderboard-row .lb-bar{height:100%;background:var(--teal);border-radius:8px;}
  .leaderboard-row .lb-score{font-family:'Bitter',serif;font-weight:900;font-size:clamp(17px,1.9vw,26px);width:100px;text-align:right;color:var(--navy);}
  .leaderboard-row .lb-cases{font-size:11.5px;color:var(--muted);width:70px;text-align:right;}
  .delete-btn{padding:10px 16px;border-radius:6px;border:1.5px solid var(--red-clue);background:rgba(162,59,46,0.12);color:var(--red-clue);font-weight:700;font-size:clamp(13px,1.2vw,16px);cursor:pointer;min-height:48px;}
  .delete-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .delete-btn:not(:disabled):hover{background:rgba(162,59,46,0.22);}
  .row-check{width:34px;text-align:center;}
  .row-check input{width:18px;height:18px;cursor:pointer;}
</style>
</head>
<body>
<header>
  <div class="title">전자칠판 <span>대시보드</span></div>
  <div class="controls">
    <div class="view-toggle" id="view-toggle">
      <button data-view="detail" class="picked">상세 보기</button>
      <button data-view="rank">순위 보기</button>
    </div>
    <div class="case-filter" id="case-filter">
      <select id="level-select-dropdown" style="padding:12px 18px;border-radius:6px;border:1.5px solid rgba(201,151,62,0.4);background:var(--navy-deep);color:var(--amber-soft);font-weight:700;font-size:clamp(14px,1.3vw,18px);min-height:48px;">
        <option value="all">전체 레벨</option>
        <!-- Level options are populated by JS -->
      </select>
      <select id="case-select-dropdown" style="padding:12px 18px;border-radius:6px;border:1.5px solid rgba(201,151,62,0.4);background:var(--navy-deep);color:var(--amber-soft);font-weight:700;font-size:clamp(14px,1.3vw,18px);min-height:48px;">
        <option value="all">전체 CASE</option>
        <!-- CASE options are populated by JS based on selected level -->
      </select>
    </div>
    <button class="delete-btn" id="delete-selected-btn" onclick="deleteSelected()" disabled>🗑 선택 삭제 (<span id="selected-count">0</span>)</button>
    <button class="refresh-btn" onclick="loadData()">🔄 새로고침</button>
  </div>
</header>
<div class="meta-row" id="meta-row">마지막 업데이트: —</div>

<div id="table-wrap">
  <div class="empty-state">새로고침 버튼을 눌러 학생 제출 현황을 불러오세요.</div>
</div>

<script>
/* ---------------------------------------------------------
   실제 연동 시 LOAD_URL을 Apps Script GET 엔드포인트로 교체하세요.
   (answer_check.html에서 POST한 데이터를 배열로 반환해야 합니다)
--------------------------------------------------------- */
const LOAD_URL = "https://script.google.com/macros/s/AKfycbzDVe9GfKGSDqruTampK2ja4kBg9vABVDfS_bNOT88jAzpXQDqCoLLqAqQDCkmtyjJJ/exec";

/* 연동 전 미리보기용 샘플 데이터 — 실제 연동되면 사용되지 않습니다 */
const SAMPLE_DATA = [
  { _row:2, name:"김나연", level:"1", case_id:1, score:75, skim_correct:true, vocab_correct:2, vocab_total:2, evidence_correct:true, answer_correct:true, confidence:"상", structure_correct:true, signal_correct:true, summary_matched:2, summary_total:2, summary_text:"지민이는 비가 올까봐 우산을 챙겼다.", scan_correct:true, submitted_at:new Date().toISOString() },
  { _row:3, name:"남우진", level:"1", case_id:1, score:40, skim_correct:true, vocab_correct:1, vocab_total:2, evidence_correct:false, answer_correct:true, confidence:"하", structure_correct:true, signal_correct:false, summary_matched:1, summary_total:2, summary_text:"날씨가 안좋아서 준비했다.", scan_correct:false, submitted_at:new Date().toISOString() },
  { _row:4, name:"박서연", level:"1", case_id:2, score:78, skim_correct:true, vocab_correct:2, vocab_total:2, evidence_correct:true, answer_correct:true, confidence:"상", structure_correct:true, signal_correct:true, summary_matched:2, summary_total:2, summary_text:"민호는 늦게까지 공부해서 피곤했다.", scan_correct:true, submitted_at:new Date().toISOString() },
  { _row:5, name:"김나연", level:"2", case_id:201, score:68, skim_correct:true, vocab_correct:2, vocab_total:2, evidence_correct:true, answer_correct:false, confidence:"중", structure_correct:true, signal_correct:true, summary_matched:1, summary_total:2, summary_text:"민호는 피곤했다.", scan_correct:true, submitted_at:new Date().toISOString() }
];

let currentLevelFilter = 'all';
let currentFilter = 'all';
let currentView = 'detail';
let allData = [];
let selectedRows = new Set();

document.querySelectorAll('#view-toggle button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('#view-toggle button').forEach(b=>b.classList.remove('picked'));
    btn.classList.add('picked');
    currentView = btn.dataset.view;
    render();
  };
});

/* 레벨 드롭다운: 1~6 (필요에 따라 확장) */
const levelDropdown = document.getElementById('level-select-dropdown');
for (let lv=1; lv<=6; lv++){
  const opt = document.createElement('option');
  opt.value = String(lv);
  opt.textContent = 'Level ' + lv;
  levelDropdown.appendChild(opt);
}
levelDropdown.onchange = ()=>{
  currentLevelFilter = levelDropdown.value;
  populateCaseDropdown();
  currentFilter = 'all';
  render();
};

// CASE 드롭다운: 선택된 레벨에 맞는 36개 CASE 번호로 채우기
function populateCaseDropdown(){
  const caseDropdown = document.getElementById('case-select-dropdown');
  caseDropdown.innerHTML = '<option value="all">전체 CASE</option>';
  if (currentLevelFilter === 'all') return;
  const lv = parseInt(currentLevelFilter);
  const base = lv === 1 ? 0 : lv * 100; // Level 1: 1~36, Level N(2+): N*100+1 ~ N*100+36
  for (let i=1; i<=36; i++){
    const id = base + i;
    const opt = document.createElement('option');
    opt.value = String(id);
    opt.textContent = 'CASE #' + String(i).padStart(2,'0');
    caseDropdown.appendChild(opt);
  }
}
document.getElementById('case-select-dropdown').onchange = ()=>{
  currentFilter = document.getElementById('case-select-dropdown').value;
  render();
};

function loadData(){
  const metaRow = document.getElementById('meta-row');
  selectedRows.clear();
  updateDeleteButton();
  if (LOAD_URL === "REPLACE_WITH_APPS_SCRIPT_URL"){
    allData = SAMPLE_DATA;
    metaRow.textContent = "⚠ 샘플 데이터 표시 중 — 실제 연동 필요 (마지막 새로고침: " + new Date().toLocaleTimeString('ko-KR') + ")";
    render();
    return;
  }
  metaRow.textContent = "불러오는 중...";
  fetch(LOAD_URL)
    .then(res => res.json())
    .then(data => {
      allData = data;
      metaRow.textContent = "마지막 업데이트: " + new Date().toLocaleTimeString('ko-KR') + " · 제출 " + data.length + "건";
      render();
    })
    .catch(()=>{
      metaRow.textContent = "⚠ 불러오기 실패. 다시 시도해주세요.";
    });
}

function updateDeleteButton(){
  const btn = document.getElementById('delete-selected-btn');
  const countEl = document.getElementById('selected-count');
  countEl.textContent = selectedRows.size;
  btn.disabled = selectedRows.size === 0;
}

function toggleRowSelect(rowId, checked){
  if (checked) selectedRows.add(rowId);
  else selectedRows.delete(rowId);
  updateDeleteButton();
  const allCheck = document.getElementById('select-all-check');
  if (allCheck) allCheck.checked = filteredRows().every(r => selectedRows.has(r._row));
}

function toggleSelectAll(checked){
  filteredRows().forEach(r => {
    if (checked) selectedRows.add(r._row);
    else selectedRows.delete(r._row);
  });
  updateDeleteButton();
  renderTable();
}

function deleteSelected(){
  if (selectedRows.size === 0) return;
  const count = selectedRows.size;
  if (!confirm(count + "건의 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;

  const metaRow = document.getElementById('meta-row');
  if (LOAD_URL === "REPLACE_WITH_APPS_SCRIPT_URL"){
    allData = allData.filter(r => !selectedRows.has(r._row));
    selectedRows.clear();
    updateDeleteButton();
    metaRow.textContent = "⚠ 샘플 데이터 모드 — 실제로 저장되지 않습니다.";
    render();
    return;
  }

  metaRow.textContent = "삭제 중...";
  fetch(LOAD_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain"},
    body: JSON.stringify({ action: "delete", rows: Array.from(selectedRows) })
  })
    .then(res => res.json())
    .then(()=>{
      loadData();
    })
    .catch(()=>{
      metaRow.textContent = "⚠ 삭제 요청 전송 실패. 다시 시도해주세요.";
    });
}

function mark(ok){
  return `<span class="mark ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✕'}</span>`;
}

function filteredRows(){
  return allData.filter(r=>{
    if (currentLevelFilter !== 'all' && String(r.level || '1') !== currentLevelFilter) return false;
    if (currentFilter !== 'all' && String(r.case_id) !== currentFilter) return false;
    return true;
  });
}

function render(){
  if (currentView === 'rank') renderLeaderboard();
  else renderTable();
}

function renderLeaderboard(){
  const wrap = document.getElementById('table-wrap');
  const rows = filteredRows();

  if (rows.length === 0){
    wrap.innerHTML = '<div class="empty-state">표시할 제출 데이터가 없습니다.</div>';
    return;
  }

  const totals = {};
  rows.forEach(r=>{
    if (!totals[r.name]) totals[r.name] = { name: r.name, score: 0, cases: 0 };
    totals[r.name].score += (r.score || 0);
    totals[r.name].cases += 1;
  });
  const ranked = Object.values(totals).sort((a,b)=> b.score - a.score);
  const maxScore = Math.max(...ranked.map(r=>r.score), 1);
  const medalClass = ['top1','top2','top3'];
  const medalIcon = ['🥇','🥈','🥉'];

  wrap.innerHTML = ranked.map((r,i)=>`
    <div class="leaderboard-row ${medalClass[i] || ''}">
      <div class="rank">${medalIcon[i] || (i+1)}</div>
      <div class="lb-name">${r.name}</div>
      <div class="lb-bar-wrap"><div class="lb-bar" style="width:${Math.round((r.score/maxScore)*100)}%"></div></div>
      <div class="lb-score">${r.score}점</div>
      <div class="lb-cases">${r.cases}건 제출</div>
    </div>
  `).join('');
}

function renderTable(){
  const wrap = document.getElementById('table-wrap');
  const rows = filteredRows();

  if (rows.length === 0){
    wrap.innerHTML = '<div class="empty-state">표시할 제출 데이터가 없습니다.</div>';
    return;
  }

  const sorted = rows.slice().sort((a,b)=> a.name.localeCompare(b.name, 'ko'));

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th class="row-check"><input type="checkbox" id="select-all-check" onchange="toggleSelectAll(this.checked)"></th>
          <th class="name-col">이름</th>
          <th>레벨</th>
          <th>CASE</th>
          <th>점수</th>
          <th>스키밍</th>
          <th>어휘추적</th>
          <th>근거</th>
          <th>정답</th>
          <th>확신도</th>
          <th>구조유형</th>
          <th>신호어</th>
          <th>요약</th>
          <th>스캐닝</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map(r => `
          <tr>
            <td class="row-check"><input type="checkbox" ${selectedRows.has(r._row) ? 'checked' : ''} onchange="toggleRowSelect(${r._row}, this.checked)"></td>
            <td class="name-col">${r.name}</td>
            <td>Lv.${r.level || 1}</td>
            <td>#${String(r.case_id).slice(-2).padStart(2,'0')}</td>
            <td style="font-weight:900;color:var(--navy);">${r.score||0}점</td>
            <td>${mark(r.skim_correct)}</td>
            <td>${r.vocab_correct}/${r.vocab_total}</td>
            <td>${mark(r.evidence_correct)}</td>
            <td>${mark(r.answer_correct)}</td>
            <td><span class="conf-pill">${r.confidence}</span></td>
            <td>${mark(r.structure_correct)}</td>
            <td>${mark(r.signal_correct)}</td>
            <td>${r.summary_matched}/${r.summary_total}</td>
            <td>${mark(r.scan_correct)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

populateCaseDropdown();
loadData();
setInterval(loadData, 15000); // 15초마다 자동으로 새로고침 (수동 버튼도 그대로 사용 가능)
</script>
</body>
</html>
