 머리가 맑아져요."]], "expr": [["My favorite place is ~.", "내가 가장 좋아하는 장소는 ~예요.", "My favorite place is the rooftop garden of my apartment.", "제가 가장 좋아하는 장소는 우리 아파트 옥상 정원이에요.", "장소 이름 앞에 the가 붙는 경우가 많아요."], ["It's located ~.", "그곳은 ~에 있어요.", "It's located across from my school.", "그곳은 우리 학교 맞은편에 있어요.", "near / next to / across from / in front of"], ["When you walk in, you can see ~.", "들어가면 ~가 보여요.", "When you walk in, you can see shelves full of comic books.", "들어가면 만화책이 가득한 책장이 보여요.", "you = 듣는 사람을 그 장소로 초대하는 느낌!"], ["I go there to ~.", "나는 ~하러 그곳에 가요.", "I go there to read and get some fresh air.", "저는 책도 읽고 바람도 쐬러 그곳에 가요.", "to + 동사원형 = ~하기 위해"], ["It's the perfect place to ~.", "~하기에 완벽한 곳이에요.", "It's the perfect place to watch the sunset.", "노을을 보기에 완벽한 곳이에요.", "to 뒤에는 동사원형!"], ["I feel ~ when I'm there.", "그곳에 있으면 ~한 기분이 들어요.", "I feel peaceful when I'm there.", "그곳에 있으면 마음이 평화로워요.", "feel + 형용사"], ["It's where ~.", "그곳은 ~하는 곳이에요.", "It's where I spend most of my weekends.", "그곳은 제가 주말 대부분을 보내는 곳이에요.", "where + 주어 + 동사"], ["If I had to choose one place, it would be ~.", "한 곳을 골라야 한다면, ~일 거예요.", "If I had to choose one place, it would be Gwangalli Beach.", "한 곳만 고르라면 광안리 해수욕장이에요.", "통째로 외워 두면 좋은 시작 표현!"]], "kw": [["① WHERE", "장소 · 위치", "My favorite place is ~."], ["② LOOKS", "모습 · 소리 · 냄새", "It's located ~."], ["③ WHAT I DO", "하는 일 · 느낌 · 경험", "I go there to ~."], ["④ CLOSING", "특별한 이유 · 추천", "It's the perfect place to ~."]], "goals": ["장소 전치사(near·next to)를 넣어 5문장", "to(목적)·because(이유)로 말하기", "메모 없이 그곳에서의 경험 + 의미까지"], "write": [[["• Where is your favorite place?", "• Where is it located?", "• What does it look like?", "• What do you do there?"], ["My favorite place is ~.", "It is near ~.", "There is ~.", "I go there with ~ and ~."]], [["+ Why do you go there?", "+ Why is it perfect for that?", "+ How do you feel there?"], ["I go there to ~.", "It's the perfect place to ~ because ~.", "I feel ~ when I'm there."]], [["+ What does the place mean to you?", "+ What happened there?", "+ What did you learn?"], ["To most people, ~, but to me, ~.", "For example, when ~, I ~.", "That experience showed me that ~."]]], "check": ["질문(어디 + 무엇을 하는지)에 모두 답했나요?", "장소 전치사와 to(~하러)를 정확히 썼나요?", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 장소<\/b>로 바꿨나요?"], "basic": {"en": ["My favorite place is [[Dadaepo Beach]].", "It is [[near my house]].", "There is [[a long sandy beach and a big park]].", "I go there [[with my family on weekends]].", "We [[walk on the beach and watch the sunset]]."], "ko": ["제가 가장 좋아하는 장소는 다대포 해수욕장이에요.", "우리 집 근처에 있어요.", "그곳에는 긴 모래 해변과 큰 공원이 있어요.", "저는 주말에 가족과 함께 그곳에 가요.", "우리는 해변을 걷고 노을을 봐요."], "why": "어디 → 위치 → 모습 → 누구와·언제 → 하는 일. 질문의 두 부분(Where / What do you do)에 <b>기본 정보<\/b>로 정확하게 답해요.", "swap": [["장소", "Dadaepo Beach"], ["위치 (near ~)", "near my house"], ["모습 (There is ~)", "a long sandy beach and a big park"], ["누구와 · 언제", "with my family / on weekends"], ["하는 일", "walk on the beach, watch the sunset"]]}, "inter": {"en": ["My favorite place is [[Dadaepo Beach]], {{which is}} [[only ten minutes from my house by bus]].", "[[The beach is wide and sandy]], and [[there's a big park with a fountain right next to it]].", "{{I go there to}} [[take a walk with my family]] [[on Sunday evenings]].", "{{It's the perfect place to}} [[watch the sunset]] {{because}} [[the sky turns orange and pink over the sea]].", "[[Sometimes I bring my sketchbook]] and [[draw the boats on the water]].", "{{I feel}} [[calm and free]] {{when I'm there}} {{because}} [[I can forget about homework for a while]].", "{{If}} [[you ever visit Busan]], [[you should go there at sunset]]."], "ko": ["제가 가장 좋아하는 장소는 다대포 해수욕장인데, 우리 집에서 버스로 10분밖에 안 걸려요.", "해변은 넓고 모래가 고우며, 바로 옆에 분수가 있는 큰 공원이 있어요.", "저는 일요일 저녁마다 가족과 산책하러 그곳에 가요.", "그곳은 노을을 보기에 완벽한 곳이에요. 바다 위 하늘이 주황빛과 분홍빛으로 물들거든요.", "가끔은 스케치북을 가져가서 물 위의 배를 그려요.", "그곳에 있으면 잠시 숙제를 잊을 수 있어서 마음이 차분하고 자유로워져요.", "혹시 부산에 오면, 해 질 녘에 꼭 그곳에 가 보세요."], "why": "위치와 모습을 <b>더 자세히<\/b> 묘사하고, 그곳에 가는 <b>목적<\/b>, 그곳이 완벽한 <b>이유<\/b>, 그곳에서의 <b>느낌<\/b>까지 덧붙였어요.", "swap": [["장소 + 위치 (which is ~)", "Dadaepo Beach / ten minutes by bus"], ["모습", "wide, sandy / park with a fountain"], ["가는 목적 (I go there to ~)", "take a walk with my family / Sunday evenings"], ["완벽한 이유 (because ~)", "watch the sunset / sky turns orange and pink"], ["느낌 + because", "calm and free / forget about homework"]]}, "adv": {"en": ["{{If I had to choose one place}}, [[it would be Dadaepo Beach]], {{which is}} [[just a short bus ride from my home]].", "[[It's a wide, sandy beach]], and [[in the evening, a musical fountain lights up the park next to it]].", "{{To most people}}, [[it's just a nice place to take photos]], {{but to me}}, [[it's where I go to think]].", "{{For example}}, [[last winter]], {{when}} [[I was nervous about starting a new school year]], [[I went there alone and sat on the sand for an hour]].", "{{While}} [[I was listening to the waves]], [[my worries slowly started to feel smaller]].", "[[I opened my sketchbook and drew the sunset]], and {{by the time}} [[I finished]], [[I felt ready to face anything]].", "{{Since then}}, [[I've gone back there whenever I need to clear my mind]].", "{{That experience showed me that}} [[nature has a quiet power to comfort people]].", "{{I hope}} [[Dadaepo stays as beautiful as it is now]], so that [[more people can feel that power]]."], "ko": ["한 곳만 골라야 한다면, 우리 집에서 버스로 잠깐이면 가는 다대포 해수욕장이에요.", "넓은 모래 해변이고, 저녁이 되면 바로 옆 공원에서 음악 분수가 빛나요.", "대부분의 사람들에게는 사진 찍기 좋은 곳일 뿐이지만, 저에게는 생각을 정리하러 가는 곳이에요.", "예를 들어, 지난겨울 새 학년을 시작하는 게 긴장됐을 때, 저는 혼자 그곳에 가서 한 시간 동안 모래 위에 앉아 있었어요.", "파도 소리를 듣는 동안, 걱정이 천천히 작게 느껴지기 시작했어요.", "스케치북을 펴서 노을을 그렸고, 다 그렸을 때쯤에는 무엇이든 마주할 준비가 된 기분이었어요.", "그 뒤로 저는 머리를 맑게 하고 싶을 때마다 그곳에 다시 가요.", "그 경험은 자연에는 사람을 위로하는 조용한 힘이 있다는 걸 보여 줬어요.", "더 많은 사람들이 그 힘을 느낄 수 있도록, 다대포가 지금처럼 아름답게 남아 있으면 좋겠어요."], "why": "장소 묘사에서 멈추지 않고 <b>남들에게 vs 나에게(To most people ~, but to me ~)<\/b>의 의미를 대조하고, 그곳에서의 <b>경험과 감정 변화<\/b>, <b>배운 점<\/b>까지 말해요.", "swap": ["① 장소 + 위치 (If I had to choose ~, which ~)", "② 모습 · 소리 묘사", "③ 나에게 의미 (To most people ~, but to me ~)", "④ 경험 (For example, when ~)", "⑤ 그곳에서 느낀 것 (While ~)", "⑥ 변화 (by the time ~)", "⑦ 지금 (Since then, ~)", "⑧ 배운 점 · 바람 (showed me that ~ / I hope ~)"]}}, {"no": "09", "title": "My Weekend", "q": ["How do you usually spend your weekends? What did you do last weekend?", "주말은 보통 어떻게 보내나요? 지난 주말에는 무엇을 했나요?"], "think": [["What time do you get up on weekends?", "주말엔 몇 시에 일어나나요?", "10시, 늦잠!"], ["What do you usually do on Saturdays and Sundays?", "토요일·일요일에 주로 하는 것은?", "학원, 영화, 가족 외식"], ["What did you do last weekend?", "지난 주말엔 무엇을 했나요?", "사촌 집 방문, 축구 경기"], ["What would your dream weekend look like?", "꿈꾸는 주말은 어떤 모습인가요?", "하루 종일 게임, 여행"]], "vocab": [["sleep in", "(일부러) 늦잠 자다", "I like to sleep in on Saturday mornings.", "저는 토요일 아침엔 늦잠 자는 걸 좋아해요."], ["catch up on", "밀린 ~을 하다", "I catch up on my homework on Sunday afternoons.", "저는 일요일 오후에 밀린 숙제를 해요."], ["eat out", "외식하다", "My family eats out once a month.", "우리 가족은 한 달에 한 번 외식해요."], ["go on a picnic", "소풍 가다", "We went on a picnic by the river last Sunday.", "우리는 지난 일요일에 강가로 소풍을 갔어요."], ["binge-watch", "몰아 보다", "I binge-watched a whole drama series last weekend.", "지난 주말에 드라마 한 시즌을 몰아 봤어요."], ["visit (visited)", "동) 방문하다", "We visited my cousins in Ulsan.", "우리는 울산에 사는 사촌들 집에 갔어요."], ["spend (spent)", "동) (시간을) 보내다", "I spent the whole afternoon at the library.", "저는 오후 내내 도서관에서 보냈어요."], ["exhibition", "명) 전시회", "We went to a photo exhibition downtown.", "우리는 시내의 사진 전시회에 갔어요."], ["wait in line", "줄 서서 기다리다", "We waited in line for an hour to get in.", "들어가려고 한 시간 동안 줄을 섰어요."], ["recharge", "동) 재충전하다", "Weekends are a time to recharge.", "주말은 재충전하는 시간이에요."], ["productive", "형) 알차게 보낸, 생산적인", "I had a productive weekend; I finished all my homework.", "주말을 알차게 보냈어요. 숙제를 다 끝냈거든요."], ["lazy", "형) 느긋한, 게으른", "Sometimes I just have a lazy Sunday.", "가끔은 그냥 느긋한 일요일을 보내요."], ["exhausted", "형) 녹초가 된", "I was exhausted after the long hike.", "긴 등산 뒤에 저는 녹초가 됐어요."], ["turn out", "결국 ~이 되다, ~로 드러나다", "The trip turned out to be a lot of fun.", "그 여행은 결국 아주 재미있었어요."]], "expr": [["On weekends, I usually ~.", "주말에 나는 보통 ~해요.", "On weekends, I usually sleep in until ten.", "주말에 저는 보통 10시까지 늦잠을 자요.", "평소 습관 → 현재형!"], ["On Saturdays, ~. On Sundays, ~.", "토요일마다 ~. 일요일마다 ~.", "On Saturdays, I go to an art class. On Sundays, I relax at home.", "토요일엔 미술 수업에 가고, 일요일엔 집에서 쉬어요.", "두 날을 비교하면 주말이 생생해져요."], ["Last weekend, I ~ (과거형).", "지난 주말에 나는 ~했어요.", "Last weekend, I visited my grandparents.", "지난 주말에 저는 조부모님 댁에 갔어요.", "last weekend → 과거형! visit → visited"], ["I spent (시간) ~ing.", "나는 ~하며 (시간을) 보냈어요.", "I spent the whole afternoon playing board games.", "오후 내내 보드게임을 하며 보냈어요.", "spend + 시간 + ~ing"], ["It was ~ because ~.", "~했어요. 왜냐하면 ~.", "It was exciting because our team won.", "우리 팀이 이겨서 신났어요.", "지난 일의 느낌도 과거형 was!"], ["The best part was ~.", "가장 좋았던 건 ~였어요.", "The best part was eating fresh seafood by the sea.", "가장 좋았던 건 바닷가에서 싱싱한 해산물을 먹은 거예요.", "was 뒤에 명사나 ~ing"], ["Unlike usual, ~.", "평소와 달리 ~.", "Unlike usual, I got up early and went jogging.", "평소와 달리 일찍 일어나서 조깅을 했어요.", "평소(현재) ↔ 지난 주말(과거)을 연결해요."], ["Next weekend, I'm going to ~.", "다음 주말에 나는 ~할 거예요.", "Next weekend, I'm going to watch a movie with my friends.", "다음 주말에는 친구들과 영화를 볼 거예요.", "미래 계획 → be going to + 동사원형"]], "kw": [["① USUALLY", "평소 주말 (현재형)", "On weekends, I usually ~."], ["② LAST WEEKEND", "어디서 · 누구와 (과거형)", "Last weekend, I ~."], ["③ DETAILS", "한 일 · 최고의 순간 · 느낌", "The best part was ~."], ["④ CLOSING", "다음 주말 계획", "Next weekend, I'm going to ~."]], "goals": ["현재형(평소)과 과거형(지난 주말)을 구분해 5문장", "현재·과거·미래 3시제 모두 넣기", "메모 없이 지난 주말 이야기 + 깨달음까지"], "write": [[["• What do you usually do on weekends?", "• What do you do on Saturdays and Sundays?", "• What did you do last weekend?", "• How was it?"], ["On weekends, I usually ~.", "On Saturdays, I ~.", "Last weekend, I ~(과거형).", "It was ~."]], [["+ Why do you spend weekends like that?", "+ What was the best part of last weekend?", "+ What are your plans for next weekend?"], ["I usually ~ because ~.", "We spent ~ ~ing.", "The best part was ~.", "Next weekend, I'm going to ~."]], [["+ How was last weekend different?", "+ What happened, step by step?", "+ How did it change you?"], ["However, last weekend ~.", "But when ~, ~.", "That moment made me realize that ~."]]], "check": ["질문 두 가지(평소 주말 + 지난 주말)에 모두 답했나요?", "현재형과 과거형을 구분했나요? (go / went)", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 주말<\/b>로 바꿨나요?"], "basic": {"en": ["On weekends, I usually [[sleep in]].", "On Saturdays, I [[bake with my mom]].", "On Sundays, I [[relax at home with my family]].", "Last weekend, I [[went to the movies with my friend]].", "It was [[really fun]]."], "ko": ["주말에 저는 보통 늦잠을 자요.", "토요일에는 엄마와 베이킹을 해요.", "일요일에는 가족과 집에서 쉬어요.", "지난 주말에는 친구와 영화를 보러 갔어요.", "정말 재미있었어요."], "why": "평소 주말(현재형)과 지난 주말(과거형), <b>질문 두 개에 모두<\/b> 기본 정보로 답해요. 시제만 정확히 구분해도 훌륭한 BASIC 답변!", "swap": [["평소 주말", "sleep in"], ["토요일", "bake with my mom"], ["일요일", "relax at home with my family"], ["지난 주말 (과거형)", "went to the movies with my friend"], ["느낌 (It was ~)", "really fun"]]}, "inter": {"en": ["{{On weekends}}, I usually [[sleep in until nine]] {{because}} [[I'm always tired after a long week]].", "{{On Saturdays}}, I [[bake with my mom]], and {{on Sundays}}, I [[catch up on my homework]].", "{{Last weekend, however,}} [[was a little different]].", "[[My best friend Jiwon and I]] [[went to a webtoon exhibition in Haeundae]].", "{{We spent}} [[three hours]] [[looking at original drawings and taking photos]].", "{{The best part was}} [[meeting one of my favorite webtoon artists]], {{so}} [[I couldn't stop smiling all day]].", "{{Next weekend}}, {{I'm going to}} [[try drawing my own short webtoon]]."], "ko": ["주말에 저는 보통 9시까지 늦잠을 자요. 한 주를 보내고 나면 늘 피곤하거든요.", "토요일에는 엄마와 베이킹을 하고, 일요일에는 밀린 숙제를 해요.", "하지만 지난 주말은 조금 달랐어요.", "가장 친한 친구 지원이와 저는 해운대에서 열린 웹툰 전시회에 갔어요.", "우리는 세 시간 동안 원화를 구경하고 사진을 찍으며 보냈어요.", "가장 좋았던 건 제가 좋아하는 웹툰 작가님을 만난 거예요. 그래서 하루 종일 웃음이 멈추지 않았어요.", "다음 주말에는 저만의 짧은 웹툰을 그려 볼 거예요."], "why": "평소 습관에 <b>이유<\/b>를 붙이고, 지난 주말을 <b>어디서·얼마나·가장 좋았던 점<\/b>까지 자세히 말했어요. 다음 주말 <b>계획<\/b>으로 자연스럽게 마무리해요.", "swap": [["평소 + because", "sleep in until nine / tired after a long week"], ["토요일 · 일요일", "bake with my mom / catch up on homework"], ["지난 주말: 어디서 · 누구와 (과거형)", "webtoon exhibition / with Jiwon"], ["보낸 시간 · 최고의 순간", "three hours / meeting a webtoon artist"], ["다음 주말 (I'm going to ~)", "draw my own short webtoon"]]}, "adv": {"en": ["{{For me}}, [[weekends]] are [[a time to recharge]], so {{I usually}} [[keep them slow and simple]].", "{{On Saturdays}}, I [[bake with my mom]], and {{on Sundays}}, I [[catch up on homework]] {{while}} [[listening to music]].", "{{However}}, [[last weekend]] {{turned out to be}} [[one of the most exciting weekends of my life]].", "[[Jiwon and I went to a webtoon exhibition in Haeundae]], {{where}} [[one of my favorite artists was holding a fan meeting]].", "[[We waited in line for almost two hours]], and {{to be honest}}, [[I almost wanted to give up]].", "{{But when}} [[it was finally my turn]], [[the artist looked at my sketchbook and said, \"Your characters have so much feeling.\"]]", "[[I was so moved that I could hardly say \"thank you.\"]]", "{{That moment made me realize that}} [[I really want to tell stories through drawing]].", "{{Unlike}} [[most of my weekends]], [[this one didn't help me rest, but it gave me something even better: a clear goal]]."], "ko": ["저에게 주말은 재충전하는 시간이라서, 보통은 느긋하고 단순하게 보내요.", "토요일에는 엄마와 베이킹을 하고, 일요일에는 음악을 들으며 밀린 숙제를 해요.", "그런데 지난 주말은 제 인생에서 가장 신나는 주말 중 하나가 되었어요.", "지원이와 저는 해운대 웹툰 전시회에 갔는데, 그곳에서 제가 좋아하는 작가님의 팬 미팅이 열리고 있었어요.", "우리는 거의 두 시간 동안 줄을 섰는데, 솔직히 말하면 포기하고 싶을 뻔했어요.", "하지만 마침내 제 차례가 왔을 때, 작가님이 제 스케치북을 보고 \"캐릭터들에 감정이 정말 많이 담겨 있네요.\"라고 말씀하셨어요.", "저는 너무 감동해서 \"감사합니다\"라는 말도 겨우 했어요.", "그 순간, 저는 그림으로 이야기를 들려주고 싶다는 걸 깨달았어요.", "대부분의 주말과 달리 이번 주말은 쉬게 해 주지는 않았지만, 그보다 더 좋은 것, 바로 분명한 목표를 주었어요."], "why": "평소 주말(현재)과 대비되는 <b>특별했던 지난 주말(과거)<\/b>을 이야기처럼 풀어내고, <b>감정 변화(지침 → 감동)<\/b>와 <b>깨달음<\/b>까지 말해요.", "swap": ["① 주말의 의미 (For me, weekends are ~)", "② 평소 토 · 일요일 (while ~ing)", "③ 전환 (However, last weekend ~)", "④ 어디서 · 무엇을 (where ~)", "⑤ 어려움 · 감정 (to be honest, ~)", "⑥ 결정적 순간 (But when ~)", "⑦ 감정 (so ~ that ~)", "⑧ 깨달음 · 마무리 (made me realize ~ / Unlike ~)"]}}, {"no": "10", "title": "My Special Memory", "q": ["Tell me about a special memory you will never forget.", "절대 잊지 못할 특별한 기억에 대해 이야기해 주세요."], "think": [["When was one of the happiest moments of your life?", "살면서 가장 행복했던 순간은?", "처음 상 받은 날"], ["Do you remember a moment that surprised you?", "깜짝 놀랐던 순간이 있나요?", "깜짝 생일 파티"], ["When did you feel really proud?", "정말 뿌듯했던 순간은?", "줄넘기 100개 성공"], ["Who was with you, and how did you feel?", "그때 누구와 있었고 기분이 어땠나요?", "가족, 눈물이 났다"]], "vocab": [["memory", "명) 기억, 추억", "I have many happy memories of my childhood.", "저는 어린 시절의 행복한 추억이 많아요."], ["remember", "동) 기억하다", "I still remember the smell of the ocean that day.", "그날 바다 냄새가 아직도 기억나요."], ["unforgettable", "형) 잊지 못할", "It was an unforgettable trip.", "그건 잊지 못할 여행이었어요."], ["surprise", "동) 놀라게 하다", "My friends surprised me with a cake.", "친구들이 케이크로 저를 깜짝 놀라게 했어요."], ["nervous", "형) 긴장한", "I was so nervous that my hands were shaking.", "너무 긴장해서 손이 떨렸어요."], ["proud", "형) 자랑스러운, 뿌듯한", "My parents were proud of me.", "부모님은 저를 자랑스러워하셨어요."], ["moved", "형) 감동한", "I was deeply moved by her letter.", "그 친구의 편지에 깊이 감동했어요."], ["be afraid of", "~을 무서워하다", "I used to be afraid of the dark.", "저는 예전에 어둠을 무서워했어요."], ["suddenly", "부) 갑자기", "Suddenly, it started to rain heavily.", "갑자기 비가 세차게 내리기 시작했어요."], ["finally", "부) 마침내", "Finally, we reached the top of the mountain.", "마침내 우리는 산 정상에 도착했어요."], ["in the end", "결국, 마지막에", "In the end, everything turned out fine.", "결국 모든 게 잘 해결됐어요."], ["at that moment", "그 순간", "At that moment, I realized how much I loved my family.", "그 순간 제가 가족을 얼마나 사랑하는지 깨달았어요."], ["face one's fear", "두려움에 맞서다", "Climbing the tower helped me face my fear of heights.", "타워를 오르면서 높은 곳에 대한 두려움에 맞섰어요."], ["cherish", "동) 소중히 간직하다", "I will always cherish that day.", "저는 그날을 언제나 소중히 간직할 거예요."]], "expr": [["One memory I'll never forget is ~.", "절대 잊지 못할 기억 하나는 ~예요.", "One memory I'll never forget is my first school trip.", "절대 잊지 못할 기억 하나는 첫 수학여행이에요.", "질문에 첫 문장으로 바로 답해요."], ["It happened when I was ~.", "그 일은 내가 ~살 때 일어났어요.", "It happened when I was ten years old.", "그 일은 제가 열 살 때 일어났어요.", "지난 일 → 과거형 happened, was"], ["At first, I felt ~.", "처음에는 ~한 기분이었어요.", "At first, I felt nervous and a little scared.", "처음에는 긴장되고 조금 무서웠어요.", "처음 감정을 말해야 '변화'가 보여요."], ["Suddenly, ~.", "갑자기 ~.", "Suddenly, the lights went out.", "갑자기 불이 꺼졌어요.", "이야기의 반전 신호!"], ["I was so ~ that ~.", "너무 ~해서 ~했어요.", "I was so happy that I jumped up and down.", "너무 행복해서 펄쩍펄쩍 뛰었어요.", "so + 형용사 + that + 주어 + 동사"], ["At that moment, I realized ~.", "그 순간 ~을 깨달았어요.", "At that moment, I realized how lucky I was.", "그 순간 제가 얼마나 운이 좋은지 깨달았어요.", "realized 뒤에 how / that ~"], ["Looking back, ~.", "돌이켜 보면 ~.", "Looking back, it was the best day of my childhood.", "돌이켜 보면 그날은 제 어린 시절 최고의 날이었어요.", "지금의 시선으로 의미를 말할 때"], ["I'll always remember ~ because ~.", "~ 때문에 나는 ~를 언제나 기억할 거예요.", "I'll always remember that day because it changed me.", "그날이 저를 바꿨기 때문에 언제나 기억할 거예요.", "'잊지 못하는 이유'로 마무리!"]], "kw": [["① WHAT · WHEN", "기억 · 언제 · 어디서", "One memory I'll never forget is ~."], ["② BEFORE", "처음 상황 · 감정", "At first, I felt ~."], ["③ MOMENT", "결정적 순간 · 감정", "Suddenly, ~. / I was so ~ that ~."], ["④ CLOSING", "의미", "I'll always remember ~ because ~."]], "goals": ["과거형으로 5문장 (went, saw, was)", "감정 변화 (At first → so ~ that)", "메모 없이 장면 묘사 + 의미까지"], "write": [[["• What memory will you never forget?", "• When did it happen?", "• Who were you with?", "• What did you do? How was it?"], ["One memory I'll never forget is ~.", "It happened when I was ~.", "I went there with ~.", "It was ~."]], [["+ How did you feel at first? Why?", "+ What happened next?", "+ Why will you always remember it?"], ["At first, I felt ~ because ~.", "When I ~, I ~.", "I was so ~ that ~.", "I'll always remember ~ because ~."]], [["+ Describe the key moment with your senses.", "+ How did your feelings change?", "+ What does it mean to you now?"], ["Suddenly, ~.", "Looking back, ~.", "Whenever ~, I ~."]]], "check": ["질문(잊지 못할 기억)에 언제·무슨 일·느낌까지 답했나요?", "과거형을 정확히 썼나요? (went / saw / was)", "감정의 변화나 이유(because)를 추가했나요?", "모범답안이 아닌 <b>나의 기억<\/b>으로 바꿨나요?"], "basic": {"en": ["One memory I'll never forget is [[my trip to Jeju Island]].", "It happened when I was [[eleven]].", "I went there with [[my family]].", "We [[swam in the sea and saw many colorful fish]].", "It was [[the best day ever]]."], "ko": ["절대 잊지 못할 기억 하나는 제주도 여행이에요.", "그 일은 제가 열한 살 때였어요.", "저는 가족과 함께 그곳에 갔어요.", "우리는 바다에서 수영을 하고 알록달록한 물고기를 많이 봤어요.", "최고의 하루였어요."], "why": "무엇 → 언제 → 누구와 → 무엇을 했나 → 느낌. 특별한 기억의 <b>기본 정보<\/b>를 과거형으로 정확하게 전달해요.", "swap": [["기억", "my trip to Jeju Island"], ["언제 (when I was ~)", "eleven"], ["누구와", "my family"], ["한 일 (과거형)", "swam in the sea, saw colorful fish"], ["느낌 (It was ~)", "the best day ever"]]}, "inter": {"en": ["{{One memory I'll never forget is}} [[the first time I went snorkeling in Jeju]].", "{{It happened when I was}} [[eleven]], [[during a summer trip with my family]].", "{{At first}}, I [[was scared]] {{because}} [[I couldn't swim very well]].", "[[My dad held my hand]] and [[told me to breathe slowly]], {{so}} [[I tried to stay calm]].", "{{When}} [[I put my face in the water]], [[I saw hundreds of colorful fish swimming around me]].", "{{I was so}} [[amazed]] {{that}} [[I forgot all about my fear]].", "{{I'll always remember}} [[that day]] {{because}} [[it was the first time I faced my fear]]."], "ko": ["절대 잊지 못할 기억 하나는 제주도에서 처음 스노클링을 한 날이에요.", "제가 열한 살 때, 가족과 여름 여행을 갔을 때였어요.", "처음에는 수영을 잘 못해서 무서웠어요.", "아빠가 제 손을 잡고 천천히 숨 쉬라고 말씀해 주셔서, 저는 침착하려고 노력했어요.", "물속에 얼굴을 넣었을 때, 수백 마리의 알록달록한 물고기가 제 주위를 헤엄치는 게 보였어요.", "너무 놀라워서 무섭다는 생각을 완전히 잊어버렸어요.", "그날은 제가 처음으로 두려움에 맞선 날이라서 언제나 기억할 거예요."], "why": "사실만 나열하지 않고 <b>처음 감정 → 도움 → 결정적 순간 → 감정 변화<\/b>로 이야기를 만들었어요. 마지막에 <b>잊지 못하는 이유<\/b>로 질문에 분명히 답해요.", "swap": [["기억 (the first time ~)", "snorkeling in Jeju"], ["언제 · 누구와", "eleven / summer trip with my family"], ["처음 감정 + because", "scared / couldn't swim well"], ["결정적 순간 (When ~)", "put my face in the water / colorful fish"], ["감정 (so ~ that ~) + 기억하는 이유", "amazed / faced my fear"]]}, "adv": {"en": ["{{One memory I'll never forget is}} [[the first time I went snorkeling]], {{which}} [[happened during a family trip to Jeju when I was eleven]].", "{{I had always been}} [[afraid of deep water]], so {{when}} [[my dad suggested snorkeling]], [[my heart started pounding]].", "[[Standing on the rocks in my life jacket]], [[I almost told him that I wanted to stay on the beach]].", "{{However}}, [[my little brother, who was only seven at the time, jumped in without hesitation]], and [[I didn't want to be the only one left behind]].", "[[My dad held my hand and counted, \"One, two, three,\"]] and [[I slowly put my face into the water]].", "{{Suddenly}}, [[a whole new world appeared in front of me: schools of silver fish, purple coral, and sunlight dancing on the sand]].", "{{I was so}} [[amazed]] {{that}} [[I stayed in the water for over an hour]].", "{{Looking back}}, [[that day taught me that the scariest moments often lead to the most beautiful experiences]].", "{{Whenever}} [[I'm afraid to try something new]], [[I remember the fish under the sea and take a deep breath]]."], "ko": ["절대 잊지 못할 기억 하나는 처음 스노클링을 했던 날인데, 제가 열한 살 때 가족과 제주도 여행을 갔을 때였어요.", "저는 늘 깊은 물을 무서워했기 때문에, 아빠가 스노클링을 하자고 했을 때 가슴이 쿵쾅거리기 시작했어요.", "구명조끼를 입고 바위 위에 서서, 하마터면 아빠에게 해변에 있고 싶다고 말할 뻔했어요.", "하지만 그때 겨우 일곱 살이던 남동생이 망설임 없이 뛰어들었고, 저는 혼자만 남겨지고 싶지 않았어요.", "아빠가 제 손을 잡고 \"하나, 둘, 셋\"을 세 주셨고, 저는 천천히 물속에 얼굴을 넣었어요.", "갑자기 완전히 새로운 세상이 눈앞에 나타났어요. 은빛 물고기 떼, 보랏빛 산호, 그리고 모래 위에서 춤추는 햇빛이요.", "너무 놀라워서 한 시간 넘게 물속에 있었어요.", "돌이켜 보면, 그날은 가장 무서운 순간이 종종 가장 아름다운 경험으로 이어진다는 걸 가르쳐 줬어요.", "새로운 걸 시도하는 게 두려울 때마다, 저는 바닷속 물고기들을 떠올리며 깊게 숨을 쉬어요."], "why": "사건을 시간 순서로 쓰는 데서 멈추지 않고 <b>망설임 → 계기 → 결정적 순간을 오감으로 묘사<\/b>하고, <b>돌이켜 본 의미(Looking back)<\/b>와 <b>지금의 나(Whenever ~)<\/b>까지 연결해요.", "swap": ["① 기억 + 언제 · 어디서 (which ~)", "② 배경 · 처음 감정 (I had always been ~)", "③ 망설임", "④ 계기 (However, ~)", "⑤ 행동", "⑥ 결정적 순간 묘사 (Suddenly, ~)", "⑦ 감정 (so ~ that ~)", "⑧ 의미 · 지금의 나 (Looking back / Whenever ~)"]}}, {"no": "11", "title": "My Future Dream", "q": ["What do you want to be in the future, and what are you doing to get there?", "미래에 무엇이 되고 싶나요? 그리고 그 꿈을 위해 지금 무엇을 하고 있나요?"], "think": [["What do you want to be in the future?", "미래에 무엇이 되고 싶나요?", "웹툰 작가, 수의사, 관심 분야"], ["When did you first become interested in it?", "언제 처음 관심을 가졌나요?", "초등 5학년 때 웹툰을 보고"], ["What are you doing now for your dream?", "지금 꿈을 위해 하고 있는 일은?", "매일 그림 연습, 관련 책 읽기"], ["What do you want to do for others in the future?", "미래에 다른 사람을 위해 하고 싶은 일은?", "사람들을 웃게 하고 싶다"]], "vocab": [["dream job", "꿈의 직업", "My dream job is to be a game designer.", "제 꿈의 직업은 게임 디자이너예요."], ["career", "명) 직업, 진로", "I want a career that helps animals.", "저는 동물을 돕는 직업을 갖고 싶어요."], ["become", "동) ~이 되다", "I want to become a pilot someday.", "저는 언젠가 조종사가 되고 싶어요."], ["role model", "롤모델", "My role model is my science teacher.", "제 롤모델은 과학 선생님이에요."], ["inspire", "동) 영감을 주다", "Her story inspired me to study harder.", "그녀의 이야기는 제가 더 열심히 공부하도록 영감을 줬어요."], ["skill", "명) 기술, 능력", "Good communication skills are important for teachers.", "선생님에게는 좋은 의사소통 능력이 중요해요."], ["achieve", "동) 이루다", "I'll work hard to achieve my dream.", "꿈을 이루기 위해 열심히 노력할 거예요."], ["prepare for", "~을 준비하다", "I'm preparing for the art contest.", "저는 미술 대회를 준비하고 있어요."], ["creative", "형) 창의적인", "Designers need to be creative.", "디자이너는 창의적이어야 해요."], ["patient", "형) 인내심 있는", "You have to be patient to become a good doctor.", "좋은 의사가 되려면 인내심이 있어야 해요."], ["talented", "형) 재능 있는", "There are so many talented artists online.", "온라인에는 재능 있는 작가들이 정말 많아요."], ["make a difference", "변화를 만들다, 도움이 되다", "I want to make a difference in people's lives.", "저는 사람들의 삶에 도움이 되고 싶어요."], ["come true", "(꿈이) 이루어지다", "I hope my dream will come true.", "제 꿈이 이루어지면 좋겠어요."], ["step by step", "한 걸음씩", "I'm getting closer to my dream step by step.", "저는 한 걸음씩 꿈에 가까워지고 있어요."]], "expr": [["I want to be a(n) ~ in the future.", "나는 미래에 ~가 되고 싶어요.", "I want to be a vet in the future.", "저는 미래에 수의사가 되고 싶어요.", "want to + 동사원형 (be)"], ["I became interested in ~ when ~.", "~할 때 ~에 관심을 갖게 됐어요.", "I became interested in robots when I visited a science museum.", "과학관에 갔을 때 로봇에 관심을 갖게 됐어요.", "interested in 뒤에 명사나 ~ing"], ["To become a(n) ~, I need to ~.", "~가 되려면 나는 ~해야 해요.", "To become a chef, I need to learn many recipes.", "요리사가 되려면 많은 요리법을 배워야 해요.", "To + 동사원형 = ~하기 위해"], ["These days, I'm ~ing.", "요즘 나는 ~하고 있어요.", "These days, I'm practicing coding to make my own app.", "요즘 저는 제 앱을 만들려고 코딩을 연습하고 있어요.", "현재진행형 am ~ing = 지금 하고 있는 노력"], ["My role model is ~ because ~.", "내 롤모델은 ~예요. 왜냐하면 ~.", "My role model is my aunt because she never gives up.", "제 롤모델은 이모예요. 절대 포기하지 않으시거든요.", "롤모델의 행동을 구체적으로!"], ["I'm going to ~.", "나는 ~할 거예요. (정해 둔 계획)", "I'm going to join the robotics club next year.", "내년에 로봇 동아리에 들어갈 거예요.", "be going to = 이미 정한 계획"], ["I hope to ~ someday.", "언젠가 ~하기를 바라요.", "I hope to open my own animal hospital someday.", "언젠가 제 동물병원을 열고 싶어요.", "hope to + 동사원형"], ["In ten years, I'll ~.", "10년 후에 나는 ~할 거예요.", "In ten years, I'll be helping sick animals.", "10년 후에 저는 아픈 동물들을 돕고 있을 거예요.", "미래의 모습을 상상하며 말해요."]], "kw": [["① MY DREAM", "꿈 · 이유", "I want to be ~ in the future."], ["② STARTED", "계기 · 롤모델", "I became interested in ~ when ~."], ["③ EFFORTS", "지금 하는 노력", "These days, I'm ~ing."], ["④ CLOSING", "계획 · 다짐", "I'm going to ~."]], "goals": ["want to·will로 꿈과 노력 5문장", "지금의 노력(~ing) + 계획(going to)", "메모 없이 꿈의 계기 + 다짐까지"], "write": [[["• What do you want to be?", "• What do you love doing?", "• What do you do for your dream?", "• What will you do?"], ["I want to be ~ in the future.", "I love ~ing.", "I ~ every day.", "I will ~."]], [["+ When did you become interested? Why?", "+ What do you need to do?", "+ What are you doing these days?"], ["I became interested in ~ when ~.", "To become ~, I need to ~.", "These days, I'm ~ing.", "I'm going to ~."]], [["+ What experience started your dream?", "+ What is difficult about it?", "+ Where will you be in ten years?"], ["This dream started when ~.", "Of course, ~ won't be easy.", "Still, I'm going to ~.", "In ten years, I hope ~."]]], "check": ["질문 두 가지(꿈 + 지금 하는 노력)에 모두 답했나요?", "want to·will·be going to 뒤에 동사원형을 썼나요?", "이유(because)나 경험(For example)을 추가했나요?", "모범답안이 아닌 <b>나의 꿈<\/b>으로 바꿨나요?"], "basic": {"en": ["I want to be [[a webtoon artist]] in the future.", "I love [[drawing and telling stories]].", "I [[draw for one hour every day]].", "I also [[read many webtoons]].", "I will [[work hard for my dream]]."], "ko": ["저는 미래에 웹툰 작가가 되고 싶어요.", "저는 그림 그리기와 이야기하는 걸 정말 좋아해요.", "저는 매일 한 시간씩 그림을 그려요.", "웹툰도 많이 읽어요.", "꿈을 위해 열심히 노력할 거예요."], "why": "꿈 → 좋아하는 것 → 지금 하는 일 2가지 → 다짐. 질문의 두 부분(무엇이 되고 싶은지 / 무엇을 하고 있는지)에 <b>기본 정보<\/b>로 답해요.", "swap": [["꿈 (I want to be ~)", "a webtoon artist"], ["좋아하는 것", "drawing and telling stories"], ["지금 하는 일 ①", "draw for one hour every day"], ["지금 하는 일 ②", "read many webtoons"], ["다짐 (I will ~)", "work hard for my dream"]]}, "inter": {"en": ["{{I want to be}} [[a webtoon artist]] {{in the future}}.", "{{I became interested in}} [[webtoons]] {{when}} [[I was in fifth grade]] {{because}} [[one story made me laugh and cry at the same time]].", "{{To become}} [[a good webtoon artist]], {{I need to}} [[improve both my drawing and my storytelling]].", "{{These days, I'm}} [[practicing digital drawing on my tablet for an hour every evening]].", "I'm also [[writing short stories in a notebook]] {{so that}} [[I can turn them into comics later]].", "{{My role model is}} [[the artist of my favorite webtoon]] {{because}} [[her stories are warm and realistic]].", "{{I'm going to}} [[enter a school webtoon contest next spring]]."], "ko": ["저는 미래에 웹툰 작가가 되고 싶어요.", "5학년 때 한 이야기가 저를 웃게 하면서 동시에 울게 해서 웹툰에 관심을 갖게 됐어요.", "좋은 웹툰 작가가 되려면 그림 실력과 이야기 실력을 모두 키워야 해요.", "요즘 저는 매일 저녁 한 시간씩 태블릿으로 디지털 드로잉을 연습하고 있어요.", "나중에 만화로 만들 수 있도록 노트에 짧은 이야기도 쓰고 있어요.", "제 롤모델은 제가 가장 좋아하는 웹툰의 작가님이에요. 그분의 이야기는 따뜻하고 현실적이거든요.", "내년 봄에는 학교 웹툰 대회에 나갈 거예요."], "why": "꿈에 <b>계기와 이유<\/b>를 붙이고, 필요한 능력과 <b>지금 하고 있는 노력 2가지(~ing)<\/b>, 롤모델, <b>계획<\/b>까지 말했어요. 질문의 두 번째 부분에 특히 자세히 답해요.", "swap": [["꿈 + 계기 (when ~ because ~)", "webtoon artist / fifth grade / laugh and cry"], ["필요한 능력 (To become ~, I need to ~)", "drawing and storytelling"], ["지금 노력 (I'm ~ing)", "digital drawing / an hour every evening"], ["롤모델 + because", "the artist of my favorite webtoon / warm and realistic"], ["계획 (I'm going to ~)", "enter a webtoon contest next spring"]]}, "adv": {"en": ["{{My dream is to become}} [[a webtoon artist]] {{who}} [[tells stories that make people smile]].", "[[This dream started in fifth grade]], {{when}} [[a webtoon about a shy girl helped me feel less alone]].", "{{At that moment}}, {{I realized that}} [[stories have the power to comfort people]], and [[I wanted to do the same for others]].", "{{To make this dream come true}}, [[I need two skills: drawing and storytelling]].", "{{These days}}, [[I'm practicing digital drawing for an hour every evening]], and [[I'm keeping an \"idea notebook\" where I write down funny moments from school]].", "[[Last month]], [[I posted a short four-panel comic online]], and [[a stranger commented that it made her day]].", "{{Even though}} [[it was just one comment]], [[it made me feel like I was on the right path]].", "{{Of course}}, [[I know that becoming a professional artist won't be easy]], because [[there are so many talented people]].", "{{Still}}, {{I'm going to}} [[keep improving step by step]], and {{in ten years}}, {{I hope}} [[my stories will be on readers' phones every week]]."], "ko": ["제 꿈은 사람들을 미소 짓게 하는 이야기를 들려주는 웹툰 작가가 되는 거예요.", "이 꿈은 5학년 때, 수줍음 많은 소녀에 대한 웹툰 덕분에 덜 외롭다고 느꼈을 때 시작됐어요.", "그 순간 이야기에는 사람을 위로하는 힘이 있다는 걸 깨달았고, 저도 다른 사람들에게 그렇게 해 주고 싶었어요.", "이 꿈을 이루려면 그림과 이야기, 두 가지 능력이 필요해요.", "요즘 저는 매일 저녁 한 시간씩 디지털 드로잉을 연습하고, 학교에서 있었던 웃긴 순간들을 적는 '아이디어 노트'도 쓰고 있어요.", "지난달 짧은 네 컷 만화를 온라인에 올렸는데, 모르는 분이 덕분에 하루가 즐거워졌다는 댓글을 남겨 주셨어요.", "댓글 하나였지만, 제가 올바른 길을 가고 있다는 느낌이 들었어요.", "물론 재능 있는 사람이 정말 많아서 프로 작가가 되는 게 쉽지 않다는 걸 알아요.", "그래도 저는 한 걸음씩 계속 발전할 거고, 10년 후에는 매주 독자들의 휴대폰 속에 제 이야기가 있기를 바라요."], "why": "꿈을 말하는 데서 멈추지 않고 <b>꿈이 시작된 경험<\/b>과 <b>꿈의 의미<\/b>, <b>구체적 노력<\/b>, <b>작은 성공 경험<\/b>, <b>현실적인 어려움 인정<\/b>, 그리고 <b>다짐<\/b>까지 논리적으로 이어 가요.", "swap": ["① 꿈 (My dream is to become ~ who ~)", "② 계기 (when ~)", "③ 깨달음 (At that moment, I realized ~)", "④ 필요한 능력 (To make this dream come true, ~)", "⑤ 지금의 노력 (These days, I'm ~ing)", "⑥ 작은 성공 경험", "⑦ 어려움 인정 (Of course, ~ won't be easy)", "⑧ 다짐 · 미래 (Still, I'm going to ~ / In ten years ~)"]}}, {"no": "12", "title": "My Opinion", "q": ["Is it better to study alone or with friends? Why?", "혼자 공부하는 것과 친구와 함께 공부하는 것 중 어느 쪽이 더 좋을까요? 왜 그렇게 생각하나요?"], "think": [["How do you usually study?", "평소 어떻게 공부하나요?", "혼자 독서실, 친구와 스터디카페"], ["What is good about studying alone?", "혼자 공부의 좋은 점은?", "집중이 잘 된다, 내 속도로"], ["What is good about studying with friends?", "함께 공부의 좋은 점은?", "모르는 걸 바로 물어본다, 덜 지루하다"], ["When did one of these ways really help you?", "그 방법이 실제로 도움이 된 경험은?", "시험 전 친구와 문제 내기"]], "vocab": [["opinion", "명) 의견", "In my opinion, homework should be shorter.", "제 생각에 숙제는 더 짧아야 해요."], ["prefer A to B", "B보다 A를 더 좋아하다", "I prefer studying in the morning to studying at night.", "저는 밤보다 아침에 공부하는 게 더 좋아요."], ["focus on", "~에 집중하다", "It's hard to focus on math when it's noisy.", "시끄러우면 수학에 집중하기 어려워요."], ["get distracted", "산만해지다", "I get distracted easily when my phone is nearby.", "휴대폰이 가까이 있으면 쉽게 산만해져요."], ["at my own pace", "나만의 속도로", "Online classes let me learn at my own pace.", "온라인 수업은 제 속도로 배울 수 있게 해 줘요."], ["explain", "동) 설명하다", "My friend explained the science problem to me.", "친구가 과학 문제를 설명해 줬어요."], ["motivate", "동) 동기를 주다", "Studying with friends motivates me to work harder.", "친구와 공부하면 더 열심히 하고 싶어져요."], ["efficient", "형) 효율적인", "Making a plan is an efficient way to study.", "계획을 세우는 건 효율적인 공부 방법이에요."], ["advantage", "명) 장점", "One advantage of studying alone is that it's quiet.", "혼자 공부하는 것의 장점 하나는 조용하다는 거예요."], ["disadvantage", "명) 단점", "One disadvantage of group study is that we chat too much.", "그룹 공부의 단점 하나는 수다를 너무 많이 떤다는 거예요."], ["on the other hand", "반면에", "On the other hand, studying alone can be boring.", "반면에 혼자 공부하는 건 지루할 수 있어요."], ["depend on", "~에 달려 있다", "The best way to study depends on the subject.", "가장 좋은 공부 방법은 과목에 따라 달라요."], ["agree / disagree", "동) 동의하다 / 반대하다", "I agree that teamwork is important.", "저는 협동이 중요하다는 데 동의해요."], ["in conclusion", "결론적으로", "In conclusion, I think studying with friends is better.", "결론적으로, 저는 친구와 공부하는 게 더 낫다고 생각해요."]], "expr": [["I think it's better to ~.", "~하는 것이 더 좋다고 생각해요.", "I think it's better to study with friends.", "저는 친구와 공부하는 게 더 좋다고 생각해요.", "첫 문장에 나의 선택을 분명하게!"], ["There are two reasons.", "이유는 두 가지예요.", "There are two reasons why I think so.", "제가 그렇게 생각하는 이유는 두 가지예요.", "듣는 사람이 따라오기 쉬워져요."], ["First, ~. Second, ~.", "첫째, ~. 둘째, ~.", "First, it's more fun. Second, we can help each other.", "첫째, 더 재미있어요. 둘째, 서로 도울 수 있어요.", "이유마다 번호를 붙여요."], ["For example, ~.", "예를 들어, ~.", "For example, my friend explained fractions to me.", "예를 들어, 친구가 분수를 설명해 줬어요.", "이유 뒤에 나의 경험을 붙이면 설득력이 2배!"], ["That's why ~.", "그래서 ~예요.", "That's why I always study with my friends before exams.", "그래서 저는 시험 전에 늘 친구들과 공부해요.", "앞의 이유를 정리하며 결론으로!"], ["Of course, ~. However, ~.", "물론 ~이에요. 하지만 ~.", "Of course, studying alone is quieter. However, it can be boring.", "물론 혼자 공부하는 게 더 조용해요. 하지만 지루할 수 있어요.", "반대쪽 장점을 인정하면 더 믿음직해요."], ["Some people think ~, but I believe ~.", "어떤 사람들은 ~라고 생각하지만, 나는 ~라고 믿어요.", "Some people think group study wastes time, but I believe it helps.", "그룹 공부가 시간 낭비라는 사람도 있지만, 저는 도움이 된다고 믿어요.", "반대 의견으로 시작하는 고급 오프닝"], ["In conclusion, ~.", "결론적으로, ~.", "In conclusion, studying with friends is better for me.", "결론적으로, 저에게는 친구와 공부하는 게 더 좋아요.", "처음 의견을 한 번 더 정리해요."]], "kw": [["① MY OPINION", "나의 선택", "I think it's better to ~."], ["② REASON 1", "이유 · 예시", "First, ~. For example, ~."], ["③ REASON 2 · OTHER SIDE", "이유 2 · 반대쪽", "Second, ~. Of course, ~."], ["④ CONCLUSION", "결론", "In conclusion, ~."]], "goals": ["의견 + 이유 2개 (First · Second)", "예시 + 반대쪽 인정 (Of course ~ However)", "메모 없이 반대 의견 → 주장 → 경험 → 결론"], "write": [[["• Which is better for you?", "• What is your first reason?", "• What is your second reason?", "• Can you give an example?"], ["I think it's better to ~.", "First, ~.", "Second, ~.", "For example, ~."]], [["+ What happens because of each reason?", "+ What is good about the other side?", "+ Why is your choice still better?"], ["~, so ~.", "Of course, ~.", "However, ~.", "That's why ~."]], [["+ What do other people think?", "+ What experience supports your opinion?", "+ How can you solve the weak point?"], ["Some people think ~, but I believe ~.", "As a result, ~.", "To solve this problem, ~.", "In conclusion, ~."]]], "check": ["질문(어느 쪽 + 왜)에 분명하게 답했나요?", "의견 구조를 지켰나요? (I think → First → Second → In conclusion)", "이유마다 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 생각과 경험<\/b>으로 바꿨나요?"], "basic": {"en": ["I think it's better to study [[with friends]].", "First, [[it is more fun]].", "Second, [[we can help each other]].", "For example, [[my friend Jiwon helps me with math]].", "So I like [[studying with friends]]."], "ko": ["저는 친구와 함께 공부하는 게 더 좋다고 생각해요.", "첫째, 더 재미있어요.", "둘째, 서로 도울 수 있어요.", "예를 들어, 친구 지원이가 제 수학 공부를 도와줘요.", "그래서 저는 친구와 공부하는 게 좋아요."], "why": "나의 선택 + <b>이유 2개 + 예시 1개 + 결론<\/b>. 의견을 말하는 가장 기본 구조를 정확하게 지켰어요.", "swap": [["나의 선택", "with friends"], ["이유 1 (First, ~)", "it is more fun"], ["이유 2 (Second, ~)", "we can help each other"], ["예시 (For example, ~)", "Jiwon helps me with math"], ["결론 (So ~)", "studying with friends"]]}, "inter": {"en": ["{{I think it's better to}} [[study with friends]], {{and there are two reasons}}.", "{{First}}, [[we can ask each other questions right away]], {{so}} [[we don't waste time when we're stuck]].", "{{For example}}, [[last week, Jiwon explained a difficult science concept to me in just five minutes]].", "{{Second}}, [[studying together keeps me motivated]] {{because}} [[I don't want to fall behind my friends]].", "{{Of course}}, [[studying alone is quieter]].", "{{However}}, [[I easily get distracted by my phone when I'm alone]].", "{{That's why}} [[I prefer studying with friends, especially before exams]]."], "ko": ["저는 친구와 함께 공부하는 게 더 좋다고 생각하는데, 이유는 두 가지예요.", "첫째, 서로 바로바로 질문할 수 있어서 막혔을 때 시간을 낭비하지 않아요.", "예를 들어, 지난주에 지원이가 어려운 과학 개념을 단 5분 만에 설명해 줬어요.", "둘째, 함께 공부하면 친구들에게 뒤처지고 싶지 않아서 계속 의욕이 생겨요.", "물론 혼자 공부하는 게 더 조용해요.", "하지만 저는 혼자 있으면 휴대폰 때문에 쉽게 산만해져요.", "그래서 저는 특히 시험 전에는 친구와 공부하는 걸 더 좋아해요."], "why": "이유 2개에 각각 <b>결과(so)·경험(For example)<\/b>을 붙였고, <b>반대쪽의 장점을 인정(Of course ~ However)<\/b>한 뒤 내 의견으로 돌아와 설득력이 높아졌어요.", "swap": [["나의 선택", "study with friends"], ["이유 1 + so", "ask questions right away / don't waste time"], ["예시 (For example, ~)", "Jiwon explained a science concept"], ["이유 2 + because", "keeps me motivated / don't want to fall behind"], ["반대쪽 인정 (Of course ~. However, ~)", "alone is quieter / distracted by my phone"]]}, "adv": {"en": ["{{Some people think}} [[studying alone is more efficient]], {{but I believe}} [[studying with friends is better, as long as you choose the right partners]].", "{{First}}, [[explaining something to a friend is one of the best ways to really understand it]].", "{{For example}}, {{before}} [[last semester's final exam]], [[Jiwon and I took turns teaching each other history chapters]].", "{{While}} [[I was explaining the causes of a war]], {{I realized}} [[which parts I didn't fully understand]], so [[I went back and reviewed them]].", "{{As a result}}, [[both of us got our best history scores ever]].", "{{Second}}, [[studying together keeps me going when I want to give up]], {{since}} [[we encourage each other and share snacks during long study sessions]].", "{{Of course}}, [[studying with friends has a disadvantage: it's easy to start chatting instead of studying]].", "{{To solve this problem}}, [[we set a timer and only talk during our ten-minute breaks]].", "{{In conclusion}}, [[studying with friends works better for me]] {{because}} [[it helps me understand more deeply and stay motivated]]."], "ko": ["어떤 사람들은 혼자 공부하는 게 더 효율적이라고 생각하지만, 저는 함께할 친구를 잘 고르기만 한다면 친구와 공부하는 게 더 낫다고 믿어요.", "첫째, 친구에게 무언가를 설명하는 건 그것을 제대로 이해하는 가장 좋은 방법 중 하나예요.", "예를 들어, 지난 학기 기말고사 전에 지원이와 저는 역사 단원을 번갈아 가며 서로 가르쳐 줬어요.", "제가 전쟁의 원인을 설명하는 동안, 어느 부분을 완전히 이해하지 못했는지 깨닫고 다시 돌아가 복습했어요.", "그 결과, 우리 둘 다 역대 최고의 역사 점수를 받았어요.", "둘째, 함께 공부하면 포기하고 싶을 때도 계속할 수 있어요. 긴 공부 시간 동안 서로 응원하고 간식도 나눠 먹거든요.", "물론 친구와 공부하는 데에는 단점도 있어요. 공부 대신 수다를 떨기 쉽다는 거예요.", "이 문제를 해결하려고, 우리는 타이머를 맞추고 10분 쉬는 시간에만 이야기해요.", "결론적으로, 친구와 공부하는 게 저에게 더 잘 맞아요. 더 깊이 이해하고 의욕을 유지하는 데 도움이 되기 때문이에요."], "why": "<b>반대 의견으로 시작<\/b>해 조건이 있는 주장을 세우고, 이유마다 <b>구체적 경험과 결과(As a result)<\/b>를 보여 줘요. <b>단점을 인정하고 해결책<\/b>까지 제시해 논리적으로 마무리해요.", "swap": ["① 반대 의견 → 나의 주장 (Some people think ~, but I believe ~)", "② 이유 1 (First, ~)", "③ 경험 (For example, before ~)", "④ 과정 · 깨달음 (While ~, I realized ~)", "⑤ 결과 (As a result, ~)", "⑥ 이유 2 (Second, ~ since ~)", "⑦ 단점 인정 + 해결 (Of course ~ / To solve this ~)", "⑧ 결론 (In conclusion, ~ because ~)"]}}];

function D(u=S.u){ const k=key(u); if(!MEM[k]) MEM[k]=store.get(k,{think:[],voca:[],expr:[],lv:0,swap:{},kw:[],rec:[{},{}],draft:'',draftLocked:false,final:'',ck:[],star:{}}); return MEM[k] }
function save(u=S.u){ store.set(key(u), D(u)) }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600) }
function say(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(plain(text)); u.lang='en-US'; u.rate=.9; speechSynthesis.speak(u) }catch(e){ toast('이 기기에서는 음성이 지원되지 않아요') } }
const sentCount = t => (t.trim().match(/[^.!?]+[.!?]+/g)||[]).length + (/[^.!?\s]\s*$/.test(t.trim())?1:0);

/* ---- completion ---- */
function stepDone(id,u=S.u){
  const d=D(u), U=UNITS[u];
  switch(id){
    case 'think': return d.think.filter(x=>x&&x.trim()).length>=3;
    case 'voca': return d.voca.length>=3;
    case 'expr': return (d.expr||[]).filter(x=>x&&x.trim()).length>=4;
    case 'build': { const s=d.swap[LV[d.lv].k]||[]; return s.filter(x=>x&&x.trim()).length>=3 }
    case 'speak': return !!(d.rec[0]&&d.rec[0].done);
    case 'write': return d.draftLocked && sentCount(d.final)>=LV[d.lv].min;
    case 'check': return Object.keys(d.star).length>=8;
  }
}
const prog = u => STEPS.filter(s=>stepDone(s.id,u)).length;

/* ---- render ---- */
function render(){
  const a=$('#app');
  if(!S.user){ a.innerHTML = loginView(); bindLogin(); return }
  if(S.view==='home'){ a.innerHTML = homeView(); return }
  if(S.view==='result'){ a.innerHTML = resultView(); return }
  a.innerHTML = unitView();
  bindStep();
  window.scrollTo(0,0);
  const on=document.querySelector('.steps button.on'); if(on) on.parentNode.scrollLeft=on.offsetLeft-on.parentNode.clientWidth/2+on.clientWidth/2;
}

  const last = store.get('swl:last',{});

  <button class="btn mt" id="go">시작하기</button></div></div>`;
}

function homeView(){

/* ---- step bindings ---- */
function bindStep(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    el.addEventListener('input',()=>{
      const d=D(), k=el.dataset.k, i=el.dataset.i;
      if(k==='swap'){ const L=LV[d.lv].k; d.swap[L]=d.swap[L]||[]; d.swap[L][+i]=el.value }
      else if(i!==undefined){ d[k]=d[k]||[]; d[k][+i]=el.value }
      else d[k]=el.value;
      if(k==='expr') el.closest('.exp').classList.toggle('done',!!el.value.trim());
      if(k==='draft'){ const n=sentCount(el.value),L=LV[d.lv]; const b=$('#dn'); b.textContent=n; b.className=n>=L.min?'ok':'' }
      if(k==='final'){ const n=sentCount(el.value),L=LV[d.lv]; const b=$('#fn'); b.textContent=n; b.className=n>=L.min?'ok':''; $('#diff').innerHTML=diff(d.draft,el.value) }
      save(); refreshNav();
    });
  });
}
function refreshNav(){
  const p=prog(S.u); const bar=document.querySelector('.top .bar i'); if(bar) bar.style.width=p/7*100+'%';
  const w=document.querySelector('.top .who'); if(w) w.textContent=p+'/7';
  document.querySelectorAll('.steps button').forEach((b,i)=>{ const dn=stepDone(STEPS[i].id); b.classList.toggle('done',dn); b.textContent=(dn?'✓ ':'')+STEPS[i].t });
}
function tv(i){ const d=D(); d.voca=d.voca.includes(i)?d.voca.filter(x=>x!==i):[...d.voca,i]; save(); $('#body').innerHTML=VIEWS.voca(UNITS[S.u],d); refreshNav() }
function tc(i){ const d=D(); d.ck=d.ck.includes(i)?d.ck.filter(x=>x!==i):[...d.ck,i]; save(); $('#body').innerHTML=VIEWS.check(UNITS[S.u],d); bindStep() }
function star(k,v){ const d=D(); d.star[k]=d.star[k]===v?v-1:v; if(!d.star[k]) delete d.star[k]; save(); $('#body').innerHTML=VIEWS.check(UNITS[S.u],d); bindStep(); refreshNav() }
function setLv(i){ const d=D(); d.lv=i; save(); $('#body').innerHTML=VIEWS.build(UNITS[S.u],d); bindStep(); refreshNav() }
function tk(b){ const on=b.textContent==='해석 보기'; document.querySelectorAll('#ans .kt').forEach(e=>e.style.display=on?'block':'none'); b.textContent=on?'해석 숨기기':'해석 보기' }
function lockDraft(){ const d=D(), L=LV[d.lv]; if(sentCount(d.draft)<L.min) return toast(`${L.min}문장 이상 써 주세요`); d.draftLocked=true; d.draftAt=new Date().toISOString(); if(!d.final) d.final=d.draft; save(); toast('초안 제출 완료 🔒'); $('#body').innerHTML=VIEWS.write(UNITS[S.u],d); bindStep(); refreshNav(); sync(true) }

/* ---- word diff (LCS) ---- */
function diff(a,b){
  const A=a.split(/(\s+)/), B=b.split(/(\s+)/), n=A.length, m=B.length;
  if(n*m>90000) return esc(b);
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,o='';
  while(i<n&&j<m){ if(A[i]===B[j]){o+=esc(A[i]);i++;j++} else if(dp[i+1][j]>=dp[i][j+1]){ if(A[i].trim()) o+=`<del>${esc(A[i])}</del>`; else o+=esc(A[i]); i++ } else { if(B[j].trim()) o+=`<ins>${esc(B[j])}</ins>`; else o+=esc(B[j]); j++ } }
  while(i<n){ if(A[i].trim()) o+=`<del>${esc(A[i])}</del>`; i++ } while(j<m){ o+=B[j].trim()?`<ins>${esc(B[j])}</ins>`:esc(B[j]); j++ }
  return o || '<span class="ko">수정본을 쓰면 바뀐 곳이 표시돼요.</span>';
}

/* ---- recording + speech-to-text ---- */
const AUDIO={}; let REC=null;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
async function toggleRec(i){
  if(REC){ if(REC.i===i) return stopRec(); return toast('녹음 중이에요') }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}) }
  catch(e){ return toast('마이크를 쓸 수 없어요 — 학원 링크에서 열어 주세요') }
  const chunks=[], mr=new MediaRecorder(stream);
  mr.ondataavailable=e=>chunks.push(e.data);
  const uIdx=S.u;
  mr.onstop=()=>{ stream.getTracks().forEach(t=>t.stop()); const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); const url=URL.createObjectURL(blob); AUDIO[uIdx+'-'+i]=url; const el=$('#au'+i); if(el) el.innerHTML=`<audio controls src="${url}"></audio>`; uploadAudio(uIdx,i,blob) };
  let text='', sr=null; const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){ try{ sr=new SR(); sr.lang='en-US'; sr.continuous=true; sr.interimResults=true;
    sr.onresult=e=>{ let fin='',tmp=''; for(let k=0;k<e.results.length;k++){ const r=e.results[k]; if(r.isFinal) fin+=r[0].transcript+' '; else tmp+=r[0].transcript } text=fin; const el=$('#tr'+i); if(el) el.innerHTML=`<div class="trans"><span class="ttl">듣는 중…</span>${esc(fin+tmp)}</div>` };
    sr.onend=()=>{ if(REC&&REC.i===i&&REC.sr===sr){ try{sr.start()}catch(e){} } };
    sr.start() }catch(e){ sr=null } }
  mr.start(); { const d=D(); if(d.rec[i]) delete d.rec[i].url }
  const t0=Date.now();
  REC={i,mr,sr,get text(){return text},tick:setInterval(()=>{ const el=$('#tm'+i); if(el) el.textContent=fmt(Math.round((Date.now()-t0)/1000)) },500),t0};
  const b=$('#rb'+i); b.classList.add('live'); b.querySelector('span:last-child').textContent='멈추기';
}
function stopRec(){
  const r=REC; REC=null; clearInterval(r.tick); try{r.mr.stop()}catch(e){} if(r.sr){ try{r.sr.stop()}catch(e){} }
  const d=D(), sec=Math.round((Date.now()-r.t0)/1000);
  setTimeout(()=>{ const txt=r.text.trim(); d.rec[r.i]=Object.assign({},d.rec[r.i]||{},{done:true,sec,text:txt,at:new Date().toISOString()}); save(); sync(true);
    const el=$('#tr'+r.i); if(el) el.innerHTML=txt?`<div class="trans"><span class="ttl">내가 말한 문장 (원본 그대로 저장)</span>${esc(txt)}</div>`:`<div class="note">텍스트 변환은 크롬·사파리에서 지원돼요.</div>`;
    const b=$('#rb'+r.i); if(b){ b.classList.remove('live'); b.querySelector('span:last-child').textContent='다시 녹음' } const box=b&&b.closest('.rec'); if(box) box.classList.add('done'); refreshNav(); toast(sec+'초 녹음 완료') },400);
}

/* ---- result ---- */
function resultView(){
  const U=UNITS[S.u], d=D(), L=LV[d.lv];
  const tot=k=>['ANSWER','ACCURACY','EXPANSION','DELIVERY'].reduce((s,a)=>s+(d.star[a+k]||0),0);
  return `<div class="top"><div class="row"><button class="back" onclick="go(6);S.view='unit';render()">‹</button><span class="brand">MY OUTPUT</span></div><h1>UNIT ${U.no} 결과물</h1></div>
  <div class="wrap" style="padding-top:14px">
   <div class="card"><div class="lab">${esc(S.user)} · ${L.n} · ${prog(S.u)}/7 단계</div><div class="ko">Speaking ${tot('S')}★ · Writing ${tot('W')}★</div></div>
   ${[0,1].map(i=>{const r=d.rec[i]||{}; return `<div class="card"><div class="lab">🎙 ${i+1}차 말하기 ${r.sec?'· '+r.sec+'초':''}</div>${r.text?`<div class="trans">${esc(r.text)}</div>`:'<div class="ko">기록 없음</div>'}</div>`}).join('')}
   <div class="card"><div class="lab">✏️ 초안 (원본)</div><div class="ro">${esc(d.draft)||'—'}</div></div>
   <div class="card"><div class="lab">✨ 수정본</div><div class="ro">${esc(d.final)||'—'}</div></div>
   <div class="card"><div class="lab">BEFORE → AFTER</div><div class="ro diff">${diff(d.draft,d.final)}</div></div>
   <div class="card" id="fbcard">${fbHTML(U)}</div>
  </div>
  <div class="foot"><div class="in"><button class="btn ghost" onclick="home()">목록</button><button class="btn" onclick="sync()">선생님께 제출 📤</button></div></div>`;
}
/* ---- 선생님 제출 · 피드백 ---- */
function fbHTML(U){
  const f=FB['UNIT '+U.no]; const d=D();
  const sent=d.sentAt?`<div class="note">📤 마지막 제출: ${new Date(d.sentAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`:'<div class="note">아직 제출 전이에요.</div>';
  if(f&&f.feedback) return `<div class="lab">💬 선생님 피드백 <span class="count ok">${esc(f.status)}</span></div><div class="ro" style="background:#F0FAF5;border-color:#BFE6D2">${esc(f.feedback)}</div>${sent}`;
  return `<div class="lab">💬 선생님 피드백</div><div class="ko">${f?'선생님이 확인 중이에요.':'제출하면 선생님이 확인하고 첨삭해 줘요.'}</div>${sent}`;
}
function payload(u){
  const U=UNITS[u], d=D(u), L=LV[d.lv];
  const tot=k=>['ANSWER','ACCURACY','EXPANSION','DELIVERY'].reduce((s,a)=>s+(d.star[a+k]||0),0);
  const A=U[L.k], rows=L.k==='adv'?A.swap:A.swap.map(r=>r[0]);
  const day1=[
    '[THINK] '+U.think.map((q,i)=>`Q${i+1} ${d.think[i]||'-'}`).join(' / '),
    '[VOCA] '+(d.voca.map(i=>U.vocab[i][0]).join(', ')||'-'),
    '[EXPRESSION] '+((d.expr||[]).map((x,i)=>x&&x.trim()?`${i+1}) ${x.trim()}`:'').filter(Boolean).join(' / ')||'-'),
    '[BUILD '+L.n+'] '+rows.map((r,i)=>`${r}: ${(d.swap[L.k]||[])[i]||'-'}`).join(' / '),
    '[KEYWORD] '+(d.kw||[]).map(x=>(x||'').trim()).filter(Boolean).join(' / ')
  ].join('\n');
  return {action:'save',academy:ACADEMY,name:S.user,pin:S.pin,unit:U.no,level:L.n,progress:prog(u),
    speak1:(d.rec[0]||{}).text||'',speak2:(d.rec[1]||{}).text||'',audio1:(d.rec[0]||{}).url||'',audio2:(d.rec[1]||{}).url||'',
    draft:d.draftLocked?d.draft:'',final:d.final||'',starS:tot('S'),starW:tot('W'),fix:[d.fix,d.next].filter(Boolean).join(' / '),day1};
}
async function post(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}
async function sync(quiet,u=S.u){
  if(!API_URL){ if(!quiet) toast('연결 설정 전이에요 (API_URL)'); return }
  try{ const r=await post(payload(u)); if(!r.ok) throw new Error(r.error); D(u).sentAt=new Date().toISOString(); save(u); if(!quiet) toast('선생님께 제출했어요 📤'); const c=$('#fbcard'); if(c) c.innerHTML=fbHTML(UNITS[u]) }
  catch(e){ if(!quiet) toast('제출 실패 — 인터넷 연결을 확인해 주세요') }
}
async function uploadAudio(u,i,blob){
  if(!API_URL || blob.size>8e6) return;
  try{
    const b64=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(blob) });
    const r=await post({action:'audio',academy:ACADEMY,name:S.user,pin:S.pin,unit:UNITS[u].no,round:i+1,mime:blob.type,data:b64});
    if(r.ok){ const d=D(u); d.rec[i]=Object.assign(d.rec[i]||{},{url:r.url}); save(u); sync(true,u) }
  }catch(e){}
}
async function loadFeedback(){
  if(!API_URL||!S.user) return;
  try{ const r=await (await fetch(`${API_URL}?action=feedback&academy=${encodeURIComponent(ACADEMY)}&name=${encodeURIComponent(S.user)}&pin=${S.pin}`)).json();
    if(r.ok){ FB={}; r.items.forEach(x=>FB[x.unit]=x); if(S.view!=='unit') render() } }catch(e){}
}
render();
</script>
</body>
</html>
