<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>STELLA SPEAK & WRITE LAB</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F3A;--navy2:#16325C;--blue:#1E5BB8;--sky:#4C8DF0;--ice:#EEF3FB;--line:#DCE5F2;--ink:#1B2433;--mute:#6B7890;--ok:#1F9D6B;--gold:#C9962E;
--s1:#3B82C4;--s2:#1F7A8C;--s3:#4B5FC1;--s4:#0B1F3A;--s5:#1E5BB8;--s6:#2F6D9E;--s7:#55657D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:#F4F7FC;color:var(--ink);font-size:15px;line-height:1.55}
.en{font-family:'Montserrat','Noto Sans KR',sans-serif}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:'Montserrat','Noto Sans KR',sans-serif;font-size:15px;color:var(--ink);width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none;transition:border .15s}
input:focus,textarea:focus{border-color:var(--sky)}
textarea{resize:vertical;line-height:1.7}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:96px}
/* top */
.top{background:var(--navy);color:#fff;padding:16px 18px 14px;position:sticky;top:0;z-index:5}
.top .row{display:flex;align-items:center;gap:10px}
.top .brand{font:800 11px 'Montserrat';letter-spacing:.22em;opacity:.75}
.top .who{margin-left:auto;font-size:12px;opacity:.85;background:rgba(255,255,255,.12);padding:3px 10px;border-radius:20px}
.top h1{font:800 20px 'Montserrat';margin-top:4px}
.back{font-size:20px;line-height:1;padding:2px 6px 2px 0}
.bar{height:4px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sky);border-radius:4px;transition:width .3s}
/* step nav */
.steps{display:flex;gap:6px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;font:700 11px 'Montserrat';letter-spacing:.04em;padding:7px 11px;border-radius:20px;background:#fff;border:1.5px solid var(--line);color:var(--mute);white-space:nowrap}
.steps button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps button.done{border-color:var(--ok);color:var(--ok)}
.steps button.done.on{background:var(--ok);color:#fff}
.steps .sep{flex:0 0 auto;align-self:center;font:800 10px 'Montserrat';color:var(--mute);padding:0 2px}
/* card */
.wrap{padding:8px 14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(11,31,58,.06)}
.head{padding:10px 4px 12px}
.head .k{font:800 11px 'Montserrat';letter-spacing:.16em;color:var(--c,var(--blue))}
.head h2{font:800 22px 'Montserrat';color:var(--navy);margin:2px 0}
.head p{font-size:14px;color:var(--mute)}
.head p b{color:var(--ink)}
.q{background:var(--navy);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.q .en{font-weight:600;font-size:16px;line-height:1.45}
.q small{display:block;color:#AFC3E3;font-size:13px;margin-top:4px}
.lab{font:700 12px 'Montserrat';color:var(--mute);letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ko{font-size:13px;color:var(--mute)}
.mt{margin-top:10px}
.pill{font:700 11px 'Montserrat';padding:3px 9px;border-radius:20px;background:var(--ice);color:var(--blue)}
.count{margin-left:auto;font:700 12px 'Montserrat';color:var(--blue)}
.count.ok{color:var(--ok)}
.spk{width:30px;height:30px;border-radius:50%;background:var(--ice);color:var(--blue);font-size:14px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
/* vocab */
.voc{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.voc:last-child{border:0}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;margin-top:2px}
.tick.on{background:var(--ok);border-color:var(--ok)}
.voc .w{font:700 16px 'Montserrat';color:var(--navy)}
.voc .m{font-size:13px;color:var(--mute);margin-left:6px;font-weight:400;font-family:'Noto Sans KR'}
.voc .x{font:500 13.5px 'Montserrat';margin-top:3px;color:#3B4A63}
/* expr */
.exp{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff}
.exp.done{border-color:var(--ok)}
.exp .h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.exp .h .t{flex:1}
.exp .p{font:700 15px 'Montserrat';color:var(--s3)}
.exp .b{padding:0 14px 14px;display:none}
.exp.open .b{display:block}
.exp .ex{font:500 14px 'Montserrat';color:var(--navy);display:flex;gap:8px;align-items:flex-start;background:#F6F7FD;border-radius:10px;padding:10px}
.chev{color:var(--mute);transition:transform .2s}
.exp.open .chev{transform:rotate(180deg)}
/* level */
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;gap:4px;margin-bottom:12px;box-shadow:0 1px 3px rgba(11,31,58,.06)}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font:800 12px 'Montserrat';color:var(--mute)}
.seg button small{display:block;font:500 11px 'Noto Sans KR';opacity:.8}
.seg button.on{background:var(--navy);color:#fff}
.ans p{font:500 15px/1.75 'Montserrat','Noto Sans KR';color:var(--navy);margin-bottom:8px}
.ans p .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font:700 10px 'Montserrat';align-items:center;justify-content:center;margin-right:6px;vertical-align:2px}
.ans .kt{display:block;font:400 13px/1.5 'Noto Sans KR';color:var(--mute);margin:-4px 0 10px 26px}
.sw{border-bottom:2px dashed var(--sky);background:#EEF4FE}
.key{color:var(--blue);font-weight:700}
.tog{font-size:13px;font-weight:700;color:var(--blue);padding:6px 0}
.why{background:#FFF8E8;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:6px}
.swr{margin-bottom:10px}
.swr .l{font-size:13px;font-weight:700;margin-bottom:4px}
/* speak */
.kwg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kwb{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.kwb .h{background:var(--s5);color:#fff;font:800 11px 'Montserrat';padding:6px 9px}
.kwb .h small{display:block;font:500 10.5px 'Noto Sans KR';opacity:.85}
.kwb textarea{border:0;border-radius:0;min-height:86px;font-size:14px;padding:8px 9px}
.rec{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.rec.done{border-color:var(--ok)}
.rec .r1{display:flex;align-items:center;gap:10px}
.rec .t{font:800 14px 'Montserrat';color:var(--navy)}
.rbtn{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:30px;padding:10px 16px;font:700 13px 'Noto Sans KR'}
.rbtn .dot{width:10px;height:10px;border-radius:50%;background:#FF5A5A}
.rbtn.live{background:#D93A3A}
.rbtn.live .dot{background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.timer{font:700 14px 'Montserrat';color:var(--mute)}
audio{width:100%;margin-top:10px;height:38px}
.trans{margin-top:10px;background:var(--ice);border-radius:10px;padding:10px 12px;font:500 14px/1.6 'Montserrat';color:var(--navy);white-space:pre-wrap}
.trans .ttl{font:700 11px 'Noto Sans KR';color:var(--mute);display:block;margin-bottom:3px}
.note{font-size:12.5px;color:var(--mute);margin-top:8px}
.goal{display:flex;gap:8px;align-items:center;background:var(--ice);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
/* write */
.help{background:#fff;border:1.5px dashed #B9CBE6;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13.5px}
.help .en{font-size:13.5px;color:var(--navy)}
.meter{display:flex;justify-content:space-between;font:700 12px 'Montserrat';color:var(--mute);margin-top:6px}
.meter b.ok{color:var(--ok)}
.lock{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:700;margin-top:8px}
.ro{background:#F7F9FD;border-radius:10px;padding:12px;font:500 15px/1.7 'Montserrat','Noto Sans KR';white-space:pre-wrap;color:#3B4A63;border:1.5px solid var(--line)}
.diff ins{background:#D9F5E8;text-decoration:none;border-radius:3px;padding:0 1px;color:#0E6B47}
.diff del{background:#FDE2E2;color:#B03A3A;border-radius:3px;padding:0 1px}
/* check */
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.ck:last-child{border:0}
.ck .tick{margin:0}
.stars{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;font-size:14px}
.stars .hd{font:700 11px 'Montserrat';color:var(--mute);text-align:center}
.st{display:flex;gap:2px}
.st button{font-size:22px;color:#D5DEEC;line-height:1}
.st button.on{color:var(--gold)}
.total{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;margin-top:12px}
.total b{font:800 18px 'Montserrat'}
/* buttons */
.btn{display:block;width:100%;padding:15px;border-radius:14px;font:700 15px 'Noto Sans KR';background:var(--navy);color:#fff;text-align:center}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4}
.foot{position:fixed;left:0;right:0;bottom:0;background:rgba(244,247,252,.94);backdrop-filter:blur(8px);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:6}
.foot .in{max-width:532px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1}
.foot .btn.ghost{flex:0 0 30%}
/* home */
.hero{background:linear-gradient(160deg,#0B1F3A,#16325C 60%,#1E5BB8);color:#fff;padding:36px 22px 28px}
.hero .brand{font:800 11px 'Montserrat';letter-spacing:.3em;opacity:.7}
.hero h1{font:900 30px/1.05 'Montserrat';margin:10px 0 8px}
.hero p{font:700 11px 'Montserrat';letter-spacing:.24em;color:#A9C8FF}
.login{margin:-14px 14px 0;position:relative}
.unit{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;width:100%;text-align:left;box-shadow:0 1px 3px rgba(11,31,58,.06)}
.unit .no{width:42px;height:42px;border-radius:12px;background:var(--ice);color:var(--blue);font:800 14px 'Montserrat';display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.unit .tt{font:700 15px 'Montserrat';color:var(--navy)}
.unit .pr{font-size:12px;color:var(--mute)}
.unit .mini{height:4px;background:var(--line);border-radius:4px;margin-top:6px;overflow:hidden}
.unit .mini i{display:block;height:100%;background:var(--ok)}
.vol{font:800 11px 'Montserrat';letter-spacing:.18em;color:var(--mute);margin:16px 4px 8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:24px;font-size:13.5px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.daytag{display:inline-block;font:800 10px 'Montserrat';letter-spacing:.12em;padding:2px 8px;border-radius:12px;background:var(--ice);color:var(--blue);margin-right:6px}
</style>
</head>

 "We often ~ together."]], [["+ Who do you look like / take after? Why?", "+ What do you do together? Why?", "+ What makes your family special?"], ["I look like ~, but I take after ~ because ~.", "We often ~ because ~.", "What makes my family special is that ~."]], [["+ What family story shows that you are special?", "+ How did it end?", "+ What did you learn? How do you feel?"], ["For example, when ~, we ~.", "In the end, ~.", "Through ~, I've learned that ~.", "I feel lucky to ~."]]], "check": ["질문(가족 소개 + 특별한 점)에 모두 답했나요?", "3인칭 동사를 정확히 썼나요? (He loves ~ / She has ~)", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>우리 가족의 정보<\/b>로 바꿨나요?"], "basic": {"en": ["There are [[four]] people in my family: [[my parents, my little brother, and me]].", "My dad is [[an engineer]], and my mom is [[a nurse]].", "My little brother is [[ten]], and he loves [[soccer]].", "We often [[eat dinner together and talk about our day]].", "My family is [[small]], but it is [[warm and fun]]."], "ko": ["우리 가족은 부모님, 남동생, 그리고 저, 이렇게 네 명이에요.", "아빠는 엔지니어이고, 엄마는 간호사예요.", "남동생은 열 살이고, 축구를 정말 좋아해요.", "우리는 자주 함께 저녁을 먹으며 그날 있었던 일을 이야기해요.", "우리 가족은 작지만 따뜻하고 재미있어요."], "why": "구성원 → 직업 → 좋아하는 것 → 함께 하는 일 → 우리 가족 한마디. 꼭 필요한 <b>기본 정보<\/b>를 짧고 정확하게 전달해요. 3인칭 동사의 -s만 정확해도 훌륭한 BASIC 답변이에요.", "swap": [["가족 수 · 구성원", "four / my parents, my little brother, and me"], ["부모님 직업", "an engineer / a nurse"], ["형제자매 나이 · 좋아하는 것", "ten / soccer"], ["함께 하는 것 (We often ~)", "eat dinner together, talk about our day"], ["우리 가족 한마디", "small / warm and fun"]]}, "inter": {"en": ["There are [[four]] people in my family: [[my parents, my younger brother, and me]].", "My dad works as [[an engineer]], {{so}} [[he is often busy on weekdays]], {{but}} [[he always makes pancakes for us on Sunday mornings]].", "My mom is [[a nurse]], and [[she always takes care of everyone in our family]].", "My younger brother is [[ten]], and he is [[crazy about soccer]], {{so}} [[he even practices kicking a ball in our living room]]!", "People say {{I look like}} [[my mom]], {{but I take after}} [[my dad]] {{because}} [[we are both quiet and calm]].", "{{We often}} [[take a walk along the river after dinner]] {{because}} [[it gives us time to talk]].", "{{What makes my family special is that}} [[we always share our day at the dinner table]]."], "ko": ["우리 가족은 부모님, 남동생, 그리고 저, 이렇게 네 명이에요.", "아빠는 엔지니어로 일하셔서 평일에는 자주 바쁘시지만, 일요일 아침마다 꼭 팬케이크를 만들어 주세요.", "엄마는 간호사이고, 언제나 우리 가족 모두를 챙겨 주세요.", "남동생은 열 살인데 축구에 푹 빠져 있어서 거실에서도 공 차는 연습을 해요!", "사람들은 제가 엄마를 닮았다고 하지만, 성격은 아빠를 닮았어요. 둘 다 조용하고 차분하거든요.", "우리는 저녁을 먹고 강을 따라 자주 산책해요. 이야기할 시간이 생기거든요.", "우리 가족의 특별한 점은 저녁 식탁에서 늘 하루 이야기를 나눈다는 거예요."], "why": "가족마다 <b>한 가지 특징 + 그 결과나 이유<\/b>를 덧붙였어요. 그리고 질문의 두 번째 부분, <b>\"무엇이 특별한가?\"<\/b>에 마지막 문장으로 분명하게 답해요.", "swap": [["부모님 직업 + 특징 (so / but)", "engineer, busy / pancakes on Sundays · nurse, takes care of everyone"], ["형제자매 + so", "crazy about soccer / practices in the living room"], ["닮은 점 + because", "look like mom / take after dad — quiet and calm"], ["함께 하는 것 + because", "walk along the river / time to talk"], ["특별한 점", "share our day at the dinner table"]]}, "adv": {"en": ["There are [[four]] people in my family, and {{although}} [[we are very different]], [[we fit together like puzzle pieces]].", "My dad, {{who}} [[works as an engineer]], is [[quiet and logical]], {{while}} my mom, [[a nurse]], is [[warm and talkative]].", "My [[ten-year-old brother]] is [[full of energy]], and [[he can't go a single day without playing soccer]].", "People say {{I look like}} [[my mom]], but I actually {{take after}} [[my dad]], {{since}} [[we both prefer reading quietly to going out]].", "{{What makes my family special is that}} [[we hold a \"family meeting\" every Sunday night]].", "{{For example}}, [[last month]], {{when}} [[my brother wanted to get a puppy]], [[we all shared our opinions and made a list of the responsibilities]].", "{{In the end}}, [[we decided to wait until he could take care of a dog by himself]], and [[surprisingly, he accepted the decision calmly]].", "{{Through}} [[these meetings]], {{I've learned that}} [[listening to each other is just as important as speaking]].", "{{I feel lucky to}} [[have a family that respects everyone's voice, even the youngest member's]]."], "ko": ["우리 가족은 네 명이에요. 서로 많이 다르지만, 퍼즐 조각처럼 딱 맞아요.", "엔지니어로 일하시는 아빠는 조용하고 논리적이시고, 간호사인 엄마는 따뜻하고 말이 많으세요.", "열 살인 남동생은 에너지가 넘쳐서 축구를 안 하고는 하루도 못 버텨요.", "사람들은 제가 엄마를 닮았다고 하지만, 사실 성격은 아빠를 닮았어요. 둘 다 밖에 나가는 것보다 조용히 책 읽는 걸 좋아하거든요.", "우리 가족의 특별한 점은 매주 일요일 밤에 '가족회의'를 한다는 거예요.", "예를 들어, 지난달 남동생이 강아지를 키우고 싶어 했을 때, 우리는 모두 의견을 나누고 해야 할 일 목록을 만들었어요.", "결국 동생이 혼자서 강아지를 돌볼 수 있을 때까지 기다리기로 했는데, 놀랍게도 동생은 그 결정을 차분하게 받아들였어요.", "이런 회의를 통해 저는 서로의 말을 들어 주는 것이 말하는 것만큼 중요하다는 걸 배웠어요.", "막내의 목소리까지 존중해 주는 가족이 있어서 저는 운이 좋다고 느껴요."], "why": "가족을 나열하는 데서 멈추지 않고 <b>대조(although, while)<\/b>로 성격 차이를 보여 주고, <b>실제 경험(가족회의)<\/b>으로 '특별한 점'을 증명한 뒤 <b>배운 점과 감정<\/b>까지 말해요.", "swap": ["① 가족 전체 한 문장 (although ~)", "② 부모님 대조 (who ~, while ~)", "③ 형제자매 / 다른 가족 특징", "④ 닮은 점 (take after ~, since ~)", "⑤ 특별한 점 (What makes ~ is that ~)", "⑥ 경험 (For example, when ~)", "⑦ 결과 (In the end, ~)", "⑧ 배운 점 · 감정 (I've learned / I feel lucky to ~)"]}}, {"no": "03", "title": "My Favorite Hobby", "q": ["What do you enjoy doing in your free time, and why?", "여가 시간에 무엇을 즐겨 하나요? 그리고 왜 좋아하나요?"], "think": [["What do you do when you have free time?", "시간이 날 때 주로 무엇을 하나요?", "유튜브 보기, 농구, 그림 그리기"], ["When and how did you start it?", "언제, 어떻게 시작했나요?", "초등 4학년 때 친구를 따라서"], ["How do you feel when you do it?", "할 때 기분이 어떤가요?", "스트레스가 풀린다, 시간 가는 줄 모른다"], ["What hobby do you want to try someday?", "언젠가 해 보고 싶은 취미는?", "서핑, 작곡, 캠핑"]], "vocab": [["free time", "명) 여가 시간", "What do you usually do in your free time?", "여가 시간에 보통 뭐 해요?"], ["hobby", "명) 취미", "My dad's hobby is fishing.", "아빠의 취미는 낚시예요."], ["enjoy ~ing", "~하는 것을 즐기다", "I enjoy reading mystery novels before bed.", "저는 자기 전에 추리 소설 읽는 걸 즐겨요."], ["be into", "~에 빠져 있다", "My friends are into K-pop dance these days.", "제 친구들은 요즘 K-pop 댄스에 빠져 있어요."], ["relax", "동) 긴장을 풀다, 쉬다", "Listening to music helps me relax.", "음악을 들으면 마음이 편안해져요."], ["relieve stress", "스트레스를 풀다", "Playing basketball is a great way to relieve stress.", "농구는 스트레스를 푸는 좋은 방법이에요."], ["practice", "동) 연습하다", "I practice the piano for thirty minutes every day.", "저는 매일 30분씩 피아노를 연습해요."], ["improve", "동) 나아지다, 향상시키다", "My drawing skills have improved a lot this year.", "올해 제 그림 실력이 많이 늘었어요."], ["get better at", "~을 더 잘하게 되다", "I want to get better at swimming.", "저는 수영을 더 잘하고 싶어요."], ["challenging", "형) 어렵지만 해볼 만한", "Rock climbing is challenging but exciting.", "암벽 등반은 어렵지만 신나요."], ["give up", "포기하다", "I almost gave up, but I tried one more time.", "거의 포기할 뻔했지만, 한 번 더 해 봤어요."], ["lose track of time", "시간 가는 줄 모르다", "When I play the guitar, I lose track of time.", "기타를 칠 때면 시간 가는 줄 몰라요."], ["a sense of achievement", "성취감", "Finishing a big puzzle gives me a sense of achievement.", "큰 퍼즐을 완성하면 성취감이 느껴져요."], ["try", "동) 시도하다, 해 보다", "I'd like to try surfing someday.", "언젠가 서핑을 해 보고 싶어요."]], "expr": [["In my free time, I enjoy ~ing.", "여가 시간에 나는 ~하는 것을 즐겨요.", "In my free time, I enjoy playing badminton with my sister.", "여가 시간에 저는 언니와 배드민턴 치는 걸 즐겨요.", "enjoy 뒤에는 ~ing! enjoy to play (✕)"], ["My favorite hobby is ~ing.", "내가 가장 좋아하는 취미는 ~예요.", "My favorite hobby is making short videos.", "제가 가장 좋아하는 취미는 짧은 영상 만들기예요.", "is 뒤에 오는 활동도 ~ing 형태로!"], ["I started ~ing when I was ~.", "~ 때 ~하기 시작했어요.", "I started learning taekwondo when I was eight.", "저는 여덟 살 때 태권도를 배우기 시작했어요.", "지난 일은 과거형: started, was"], ["I usually ~ for about ~.", "나는 보통 약 ~ 동안 ~해요.", "I usually play the guitar for about an hour after dinner.", "저는 보통 저녁 먹고 한 시간쯤 기타를 쳐요.", "for + 시간 = ~ 동안"], ["The reason I like it is that ~.", "내가 그것을 좋아하는 이유는 ~예요.", "The reason I like it is that I can forget about my worries.", "제가 그걸 좋아하는 이유는 걱정을 잊을 수 있어서예요.", "because보다 이유를 더 또렷하게 강조해요."], ["It makes me feel ~.", "그것은 나를 ~한 기분이 들게 해요.", "Baking makes me feel calm and happy.", "베이킹을 하면 마음이 차분하고 행복해져요.", "make + 사람 + feel + 형용사"], ["It's a great way to ~.", "그것은 ~하는 좋은 방법이에요.", "Hiking is a great way to clear my mind.", "등산은 머리를 맑게 하는 좋은 방법이에요.", "to 뒤에는 동사원형!"], ["I'd like to ~ someday.", "언젠가 ~하고 싶어요.", "I'd like to perform on a real stage someday.", "언젠가 진짜 무대에서 공연해 보고 싶어요.", "I'd = I would. 미래의 꿈·계획으로 마무리!"]], "kw": [["① MY HOBBY", "무엇 · 언제 시작", "In my free time, I enjoy ~."], ["② HOW", "언제 · 어디서 · 누구와", "I usually ~ for about ~."], ["③ WHY", "이유 · 느낌 · 경험", "The reason I like it is that ~."], ["④ CLOSING", "목표 · 꿈", "I'd like to ~ someday."]], "goals": ["enjoy 뒤에 ~ing를 붙여 5문장 말하기", "이유를 2가지 이상 넣어 말하기", "메모 없이 어려웠던 경험 + 배운 점까지"], "write": [[["• What do you enjoy doing?", "• When and where do you do it?", "• Who do you do it with?", "• How does it make you feel?"], ["In my free time, I enjoy ~ing.", "I usually ~ on ~.", "I ~ with ~.", "It makes me feel ~."]], [["+ How did you start it?", "+ Why do you like it? (2 reasons)", "+ What is your goal?"], ["I started ~ing when I was ~.", "The reason I like it is that ~.", "This year, I want to get better at ~."]], [["+ What difficult moment did you have?", "+ How did you overcome it?", "+ What did you learn?"], ["For example, the first time I ~, ~.", "However, instead of giving up, I ~.", "That experience taught me that ~."]]], "check": ["질문(무엇을 + 왜)에 모두 답했나요?", "enjoy·like 뒤에 ~ing를 썼나요? (I enjoy baking.)", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 취미<\/b>로 바꿨나요?"], "basic": {"en": ["In my free time, I enjoy [[baking]].", "I usually [[make cookies or muffins]] [[on weekends]].", "I [[bake]] with [[my mom]] in [[our kitchen]].", "[[Baking]] is fun, and it makes me [[happy]].", "[[My family loves my cookies]]!"], "ko": ["여가 시간에 저는 베이킹을 즐겨요.", "저는 주말에 보통 쿠키나 머핀을 만들어요.", "저는 우리 집 부엌에서 엄마와 함께 빵을 구워요.", "베이킹은 재미있고, 저를 행복하게 해 줘요.", "우리 가족은 제 쿠키를 정말 좋아해요!"], "why": "무엇을 → 언제 → 누구와·어디서 → 느낌. 취미에 대한 <b>기본 정보<\/b>를 짧고 정확하게 말해요. '왜'는 \"it makes me happy\" 한 마디로 간단히!", "swap": [["취미 (enjoy ~ing)", "baking"], ["무엇을 · 언제", "make cookies or muffins / on weekends"], ["누구와 · 어디서", "with my mom / in our kitchen"], ["느낌 (makes me ~)", "happy"], ["마무리 한마디", "My family loves my cookies!"]]}, "inter": {"en": ["In my free time, I really enjoy [[baking]].", "{{I started}} [[baking]] {{when I was}} [[in sixth grade]] {{because}} [[I watched a fun baking video online]].", "Now I usually [[bake cookies or muffins]] [[on Saturday afternoons]] with [[my mom]].", "{{The reason I like}} [[baking]] {{is that}} [[I can make something delicious with my own hands]].", "It also [[helps me relax]], {{so}} [[I often bake when I feel stressed after exams]].", "My favorite thing to make is [[chocolate chip cookies]] {{because}} [[everyone in my family loves them]].", "This year, I want to {{get better at}} [[decorating cakes]]."], "ko": ["여가 시간에 저는 베이킹을 정말 즐겨요.", "저는 6학년 때 온라인에서 재미있는 베이킹 영상을 보고 베이킹을 시작했어요.", "지금은 보통 토요일 오후에 엄마와 함께 쿠키나 머핀을 구워요.", "제가 베이킹을 좋아하는 이유는 제 손으로 맛있는 것을 만들 수 있기 때문이에요.", "베이킹은 마음을 편안하게도 해 줘서, 시험이 끝나고 스트레스를 받을 때 자주 빵을 구워요.", "제가 가장 좋아하는 메뉴는 초코칩 쿠키예요. 가족 모두가 정말 좋아하거든요.", "올해는 케이크 꾸미기를 더 잘하고 싶어요."], "why": "BASIC의 정보에 <b>시작한 계기, 좋아하는 이유 2가지, 목표<\/b>가 더해졌어요. 질문의 <b>\"and why?\"<\/b>에 because·The reason ~ is that으로 분명하게 답해요.", "swap": [["시작 계기 (started ~ when ~ because ~)", "sixth grade / watched a baking video"], ["언제 · 누구와", "Saturday afternoons / with my mom"], ["좋아하는 이유 (The reason ~ is that ~)", "make something delicious with my own hands"], ["또 다른 장점 + so", "helps me relax / bake when stressed after exams"], ["올해 목표 (get better at ~)", "decorating cakes"]]}, "adv": {"en": ["One of my favorite ways to spend my free time is [[baking]], and [[it has become more than just a hobby for me]].", "I started [[baking in sixth grade after watching a video online]], and {{since then}}, [[I've tried more than thirty different recipes]].", "{{What I love most about}} [[baking]] {{is that}} [[it requires both patience and creativity]].", "{{For example}}, {{the first time}} [[I made macarons]], [[they cracked and looked terrible]], so [[I felt really disappointed]].", "{{However}}, {{instead of giving up}}, [[I watched more videos, changed the oven temperature, and tried three more times]].", "{{When I finally}} [[made a perfect batch]], {{I felt}} [[a huge sense of achievement]].", "{{That experience taught me that}} [[failure is just part of the learning process]].", "These days, [[baking]] is also my way of [[relieving stress]], because [[I lose track of time while I'm mixing and decorating]].", "{{Someday, I'd like to}} [[hold a small baking class]] {{where}} [[my friends can learn to make their own desserts]]."], "ko": ["여가 시간을 보내는 제가 좋아하는 방법 중 하나는 베이킹이고, 이제 베이킹은 저에게 단순한 취미 그 이상이 되었어요.", "6학년 때 온라인 영상을 보고 베이킹을 시작했는데, 그 이후로 서른 가지가 넘는 레시피를 만들어 봤어요.", "베이킹에서 제가 가장 좋아하는 점은 인내심과 창의력이 둘 다 필요하다는 거예요.", "예를 들어, 처음 마카롱을 만들었을 때 모두 갈라지고 모양이 엉망이어서 정말 실망했어요.", "하지만 포기하는 대신 영상을 더 찾아보고, 오븐 온도를 바꿔서 세 번을 더 시도했어요.", "마침내 완벽한 마카롱을 한 판 만들었을 때, 엄청난 성취감을 느꼈어요.", "그 경험을 통해 실패는 배우는 과정의 일부일 뿐이라는 걸 알게 됐어요.", "요즘 베이킹은 제가 스트레스를 푸는 방법이기도 해요. 반죽하고 꾸미다 보면 시간 가는 줄 모르거든요.", "언젠가 친구들이 직접 디저트 만드는 법을 배울 수 있는 작은 베이킹 클래스를 열어 보고 싶어요."], "why": "\"베이킹이 좋다\"에서 멈추지 않고 <b>실패한 경험(마카롱)<\/b>과 <b>극복 과정<\/b>을 구체적으로 보여 주고, <b>감정 변화(실망 → 성취감)<\/b>와 <b>배운 점<\/b>까지 이어 말해요.", "swap": ["① 취미 + 나에게 주는 의미", "② 시작 + 그 이후 (since then, I've ~)", "③ 가장 좋은 점 (What I love most ~ is that ~)", "④ 처음의 어려움 (the first time ~)", "⑤ 극복 (However, instead of ~ing, I ~)", "⑥ 결과 · 감정 (When I finally ~, I felt ~)", "⑦ 배운 점 (taught me that ~)", "⑧ 앞으로의 계획 (Someday, I'd like to ~)"]}}, {"no": "04", "title": "My Daily Routine", "q": ["What does a typical school day look like for you?", "학교 가는 날, 여러분의 평소 하루는 어떤가요?"], "think": [["What time do you get up on school days?", "학교 가는 날 몇 시에 일어나나요?", "7시, 알람 세 번 듣고"], ["What do you do after school?", "방과 후에는 무엇을 하나요?", "학원, 숙제, 친구와 편의점"], ["What is the best part of your day?", "하루 중 가장 좋은 시간은?", "점심시간, 자기 전 웹툰 보기"], ["What would you like to change about your routine?", "내 일과에서 바꾸고 싶은 점은 깔끔해요."], ["On + 요일s, I ~.", "~요일마다 나는 ~해요.", "On Wednesdays, I have club activities.", "수요일마다 동아리 활동이 있어요.", "요일에 -s를 붙이면 '~요일마다'"], ["The best part of my day is ~.", "하루 중 가장 좋은 시간은 ~예요.", "The best part of my day is lunch break.", "하루 중 가장 좋은 시간은 점심시간이에요.", "뒤에 because를 붙여 이유까지!"], ["Before I go to bed, I ~.", "자기 전에 나는 ~해요.", "Before I go to bed, I read a few pages of a novel.", "자기 전에 저는 소설을 몇 쪽 읽어요.", "before + 주어 + 동사"], ["I wish I could ~.", "~할 수 있으면 좋겠어요.", "I wish I could sleep a little longer in the morning.", "아침에 조금만 더 잘 수 있으면 좋겠어요.", "바라는 점·아쉬운 점을 말할 때 써요."]], "kw": [["① MORNING", "기상 · 아침 · 등교", "I usually get up at ~."], ["② AT SCHOOL", "수업 · 점심 · 가장 좋은 시간", "The best part of my day is ~."], ["③ AFTER SCHOOL", "방과 후 · 저녁 · 자기 전", "After school, I ~."], ["④ CLOSING", "바라는 점 · 바꾼 습관", "I wish I could ~."]], "goals": ["at·on 시간 표현을 넣어 5문장 말하기", "First·Then 순서어 + because 2번", "메모 없이 습관을 바꾼 경험 + 배운 점까지"], "write": [[["• What time do you get up?", "• How do you go to school?", "• What do you do after school?", "• When do you go to bed?"], ["On school days, I get up at ~.", "I take ~ to school.", "After school, I ~.", "I usually go to bed at ~."]], [["+ What is the best part of your day? Why?", "+ How long does it take to get to school?", "+ What do you wish you could change?"], ["The best part of my day is ~ because ~.", "It takes me ~ to ~.", "I wish I could ~, but ~."]], [["+ What habit did you use to have?", "+ What did you change?", "+ What did you learn?"], ["I used to ~.", "So I made a new rule: ~.", "Since then, I've ~.", "This change taught me that ~."]]], "check": ["질문(평소 하루)에 시간 순서대로 답했나요?", "현재형과 시간 표현을 정확히 썼나요? (at seven / on Mondays)", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 하루<\/b>로 바꿨나요?"], "basic": {"en": ["On school days, I get up at [[seven]].", "I [[have toast for breakfast]] and [[take the bus to school]].", "I have [[six]] classes, and I [[eat lunch with my friends]].", "After school, I [[go to an English academy]].", "I usually go to bed at [[eleven]]."], "ko": ["학교 가는 날, 저는 7시에 일어나요.", "아침으로 토스트를 먹고 버스를 타고 학교에 가요.", "수업은 여섯 시간이고, 점심은 친구들과 함께 먹어요.", "방과 후에는 영어 학원에 가요.", "저는 보통 11시에 자요."], "why": "아침 → 학교 → 방과 후 → 잠자기. <b>시간 순서<\/b>대로 하루의 기본 정보를 짧고 정확하게 전달해요.", "swap": [["일어나는 시간", "seven"], ["아침 · 등교 방법", "have toast / take the bus"], ["수업 수 · 점심", "six / eat lunch with my friends"], ["방과 후", "go to an English academy"], ["자는 시간", "eleven"]]}, "inter": {"en": ["On school days, I usually get up at [[seven]], {{but}} I [[always press the snooze button at least twice]].", "{{First}}, I [[wash up]], {{and then}} I [[have a quick breakfast with my brother]].", "{{It takes me}} [[about twenty minutes]] {{to}} [[get to school by bus]].", "We have [[six or seven]] classes a day, and {{the best part of my day is}} [[lunch break]] {{because}} [[I can chat with my friends]].", "{{After school}}, I [[go to an English academy]], {{so}} I [[usually get home around seven]].", "After dinner, I [[do my homework and draw for a while]] {{because}} [[it helps me relax]].", "{{I wish I could}} [[go to bed earlier]], {{but}} [[I often stay up until midnight]]."], "ko": ["학교 가는 날 저는 보통 7시에 일어나지만, 항상 알람을 적어도 두 번은 미뤄요.", "먼저 씻고, 그다음 남동생과 아침을 빨리 먹어요.", "버스로 학교에 가는 데 20분쯤 걸려요.", "하루에 수업이 6~7교시 있는데, 하루 중 가장 좋은 시간은 점심시간이에요. 친구들과 수다를 떨 수 있거든요.", "방과 후에는 영어 학원에 가서 보통 7시쯤 집에 와요.", "저녁을 먹고 나면 숙제를 하고 잠깐 그림을 그려요. 마음이 편해지거든요.", "더 일찍 자면 좋겠지만, 자주 자정까지 깨어 있어요."], "why": "시간 순서는 그대로 두고, 장면마다 <b>얼마나 걸리는지, 왜 좋은지, 그래서 어떻게 되는지<\/b>를 덧붙였어요. 마지막에 <b>아쉬운 점<\/b>까지 말해 하루가 더 생생해져요.", "swap": [["기상 + 습관 (but)", "seven / snooze button twice"], ["등교 (It takes me ~)", "about twenty minutes by bus"], ["가장 좋은 시간 + because", "lunch break / chat with friends"], ["방과 후 + so", "English academy / home around seven"], ["바라는 점 (I wish I could ~)", "go to bed earlier"]]}, "adv": {"en": ["My school days are [[pretty busy]], {{but}} [[I've found small ways to make them enjoyable]].", "I get up at [[seven]], and {{while}} [[I'm eating breakfast]], I [[listen to a short English podcast to wake up my brain]].", "{{It takes me}} [[about twenty minutes]] {{to}} [[get to school by bus]], {{so}} I [[use that time to sketch the view outside the window]].", "{{The best part of my day is}} [[lunch break]], {{when}} [[my friends and I talk about everything from webtoons to exams]].", "{{After school}}, I [[go to an English academy]], and {{by the time}} [[I get home]], [[it's usually around seven]].", "{{To be honest}}, {{I used to}} [[waste a lot of time on my phone in the evening]].", "{{For example}}, [[last semester]], [[I often watched videos until midnight and felt exhausted the next morning]].", "So [[I made a new rule — no phone after 10:30]] — and {{since then}}, [[I've been sleeping better and feeling more focused in class]].", "{{This change taught me that}} [[a small habit can make a big difference in my whole day]]."], "ko": ["제 학교생활은 꽤 바쁘지만, 하루를 즐겁게 만드는 작은 방법들을 찾았어요.", "저는 7시에 일어나는데, 아침을 먹는 동안 짧은 영어 팟캐스트를 들으며 머리를 깨워요.", "버스로 학교에 가는 데 20분쯤 걸려서, 그 시간에 창밖 풍경을 스케치해요.", "하루 중 가장 좋은 시간은 점심시간이에요. 친구들과 웹툰부터 시험까지 온갖 이야기를 하거든요.", "방과 후에는 영어 학원에 가고, 집에 도착할 때쯤이면 보통 7시예요.", "솔직히 말하면, 저는 저녁에 휴대폰으로 시간을 많이 낭비하곤 했어요.", "예를 들어, 지난 학기에는 자주 자정까지 영상을 보다가 다음 날 아침에 녹초가 됐어요.", "그래서 '10시 30분 이후엔 휴대폰 금지'라는 새 규칙을 만들었고, 그 뒤로 잠도 더 잘 자고 수업에도 더 집중하고 있어요.", "이 변화를 통해 작은 습관 하나가 하루 전체를 크게 바꿀 수 있다는 걸 배웠어요."], "why": "일과를 나열하는 데서 멈추지 않고 <b>예전 습관(I used to) → 문제 → 새 규칙 → 변화(since then)<\/b>를 보여 주고, 그 경험에서 <b>배운 점<\/b>까지 말해요.", "swap": ["① 하루 전체 한 문장 (but ~)", "② 아침 (while ~ing)", "③ 등교 + so", "④ 가장 좋은 시간 (, when ~)", "⑤ 방과 후 (by the time ~)", "⑥ 예전 습관 (I used to ~)", "⑦ 새 규칙 + 변화 (since then, I've ~)", "⑧ 배운 점 (taught me that ~)"]}}, {"no": "05", "title": "My Best Friend", "q": ["Who is your best friend, and why are you two close?", "가장 친한 친구는 누구인가요? 그리고 두 사람은 왜 친한가요?"], "think": [["Who is your best friend? How did you meet?", "가장 친한 친구는? 어떻게 처음 만났나요?", "초5 같은 반, 학원에서"], ["What is your friend like?", "친구의 외모와 성격은?", "키가 크고 엄청 웃기다"], ["What do you usually do together?", "함께 주로 무엇을 하나요?", "떡볶이 먹기, 게임, 같이 공부"], ["When did your friend help you?", "친구가 나를 도와준 적은?", "아플 때 필기를 보여 줬다"]], "vocab": [["best friend", "가장 친한 친구", "Minji has been my best friend since fourth grade.", "민지는 4학년 때부터 제 가장 친한 친구예요."], ["meet (met)", "동) 만나다", "We met at a summer camp two years ago.", "우리는 2년 전 여름 캠프에서 만났어요."], ["classmate", "명) 반 친구", "My best friend was my classmate in fifth grade.", "제 가장 친한 친구는 5학년 때 같은 반이었어요."], ["get to know", "~를 알게 되다", "I got to know her better on a school trip.", "수학여행에서 그 친구를 더 잘 알게 됐어요."], ["sense of humor", "유머 감각", "Junho has a great sense of humor.", "준호는 유머 감각이 정말 좋아요."], ["reliable", "형) 믿음직한", "She is reliable, so I tell her my secrets.", "그 친구는 믿음직해서 저는 비밀을 털어놓아요."], ["cheer up", "기운을 북돋다", "My friend cheered me up when I lost the game.", "경기에서 졌을 때 친구가 기운을 북돋아 줬어요."], ["be there for", "~의 곁에 있어 주다", "She is always there for me when I need help.", "제가 도움이 필요할 때 그 친구는 늘 곁에 있어 줘요."], ["count on", "~를 믿고 의지하다", "I can always count on my best friend.", "저는 언제나 가장 친한 친구를 믿고 의지할 수 있어요."], ["keep a secret", "비밀을 지키다", "A true friend knows how to keep a secret.", "진짜 친구는 비밀을 지킬 줄 알아요."], ["misunderstanding", "명) 오해", "We had a small misunderstanding last month.", "지난달 우리 사이에 작은 오해가 있었어요."], ["apologize", "동) 사과하다", "I apologized first, and we made up.", "제가 먼저 사과했고, 우리는 화해했어요."], ["forgive", "동) 용서하다 (과거 forgave)", "She forgave me right away.", "그 친구는 저를 바로 용서해 줬어요."], ["trust", "명) 신뢰 / 동) 믿다", "Trust is the most important thing in a friendship.", "우정에서 가장 중요한 것은 신뢰예요."]], "expr": [["My best friend is ~. We've been friends since ~.", "가장 친한 친구는 ~예요. 우리는 ~부터 친구예요.", "My best friend is Junho. We've been friends since elementary school.", "가장 친한 친구는 준호예요. 초등학교 때부터 친구예요.", "since + 시작 시점 → have been"], ["We first met ~.", "우리는 ~에서 처음 만났어요.", "We first met in the school library.", "우리는 학교 도서관에서 처음 만났어요.", "met은 meet의 과거형!"], ["He/She is the kind of friend who ~.", "그/그녀는 ~하는 친구예요.", "She is the e is in [[my class]], and we [[sit together]].", "She is [[funny and kind]].", "We often [[eat tteokbokki after school]].", "We are close because [[we both love drawing]]."], "ko": ["제 가장 친한 친구는 지원이에요.", "지원이는 우리 반이고, 우리는 짝꿍이에요.", "지원이는 재미있고 친절해요.", "우리는 방과 후에 자주 떡볶이를 먹어요.", "우리 둘 다 그림 그리기를 정말 좋아해서 친해요."], "why": "누구 → 어디서 → 성격 → 함께 하는 것 → <b>친한 이유<\/b>. 질문의 두 부분(Who / Why)에 모두 기본 정보로 답해요.", "swap": [["친구 이름", "Jiwon"], ["어디서 아는 사이", "in my class / sit together"], ["성격", "funny and kind"], ["함께 하는 것 (We often ~)", "eat tteokbokki after school"], ["친한 이유 (because ~)", "we both love drawing"]]}, "inter": {"en": ["My best friend is [[Jiwon]], and {{we've been friends since}} [[last year]].", "{{We first met}} [[in the school drawing club]], {{when}} [[she sat next to me and complimented my sketch]].", "She is {{more}} [[outgoing]] {{than}} me, {{so}} [[she often helps me talk to new people]].", "{{She is the kind of friend who}} [[always listens to me without judging]].", "{{We both}} [[love webtoons]], {{so}} we [[can talk about our favorite characters for hours]].", "{{Whenever}} [[I feel stressed about exams]], [[she sends me funny drawings to cheer me up]].", "{{We're close because}} [[we understand each other even though we're very different]]."], "ko": ["제 가장 친한 친구는 지원이고, 우리는 작년부터 친구예요.", "우리는 학교 미술 동아리에서 처음 만났는데, 그때 지원이가 제 옆에 앉아 제 스케치를 칭찬해 줬어요.", "지원이는 저보다 외향적이라서, 제가 새로운 사람에게 말을 걸 수 있게 자주 도와줘요.", "지원이는 언제나 판단하지 않고 제 이야기를 들어 주는 친구예요.", "우리 둘 다 웹툰을 정말 좋아해서, 좋아하는 캐릭터 이야기를 몇 시간이고 할 수 있어요.", "제가 시험 때문에 스트레스를 받을 때마다 지원이는 기운 내라고 웃긴 그림을 보내 줘요.", "우리는 아주 다르지만 서로를 이해하기 때문에 친해요."], "why": "처음 만난 장면, 나와의 <b>비교<\/b>, 친구의 좋은 점이 드러나는 <b>구체적 상황(Whenever)<\/b>을 덧붙여 '왜 친한지'를 설명해요.", "swap": [["친구 + 언제부터 (since ~)", "Jiwon / since last year"], ["처음 만난 곳 (when ~)", "drawing club / complimented my sketch"], ["성격 비교 + so", "more outgoing / helps me talk to new people"], ["공통점 (We both ~, so ~)", "love webtoons / talk for hours"], ["친한 이유", "understand each other / very different"]]}, "adv": {"en": ["My best friend is [[Jiwon]], and {{although}} [[we've only known each other for a year]], [[it feels like we've been friends forever]].", "{{We first met}} [[in the school drawing club]], {{where}} [[she was the first person to start a conversation with me]].", "She is {{much more}} [[outgoing]] {{than}} me, {{while}} [[I'm calmer and more careful]], so [[we balance each other well]].", "{{However}}, [[our friendship hasn't always been perfect]].", "{{For example}}, [[last spring]], [[I forgot about our plan to see a movie because I was busy with a project]], and [[she was really upset]].", "{{At first}}, [[I made excuses]], {{but after}} [[I saw how disappointed she was]], [[I sincerely apologized and wrote her a long letter]].", "[[She forgave me]], and {{since then}}, [[we've become even closer because we learned to talk honestly about our feelings]].", "{{That experience taught me that}} [[a true friendship grows stronger after a problem is solved]].", "{{I can always count on}} [[Jiwon]], and [[I hope to be that kind of friend for her, too]]."], "ko": ["제 가장 친한 친구는 지원이에요. 서로 안 지 1년밖에 안 됐지만, 마치 평생 친구였던 것 같아요.", "우리는 학교 미술 동아리에서 처음 만났는데, 그곳에서 지원이가 처음으로 저에게 말을 걸어 줬어요.", "지원이는 저보다 훨씬 외향적이고 저는 더 차분하고 신중해서, 우리는 서로 균형을 잘 맞춰요.", "하지만 우리 우정이 늘 완벽했던 건 아니에요.", "예를 들어, 지난봄에 저는 과제 때문에 바빠서 같이 영화 보기로 한 약속을 잊어버렸고, 지원이는 정말 속상해했어요.", "처음에는 핑계를 댔지만, 지원이가 얼마나 실망했는지 보고 나서 진심으로 사과하고 긴 편지를 써 줬어요.", "지원이는 저를 용서해 줬고, 그 뒤로 우리는 서로의 감정을 솔직하게 이야기하는 법을 배워서 더 가까워졌어요.", "그 경험을 통해 진짜 우정은 문제를 해결한 뒤에 더 단단해진다는 걸 배웠어요.", "저는 언제나 지원이를 믿고 의지할 수 있고, 저도 지원이에게 그런 친구가 되고 싶어요."], "why": "친구 소개에서 멈추지 않고 <b>성격 대조(while)<\/b>를 보여 주고, <b>갈등과 화해 경험<\/b>을 통해 '왜 친한지'를 증명한 뒤 <b>배운 점과 다짐<\/b>까지 말해요.", "swap": ["① 친구 + 함께한 시간 (although ~)", "② 처음 만난 곳 (where ~)", "③ 성격 대조 (more ~ than me, while ~)", "④ 전환 (However, ~)", "⑤ 갈등 경험 (For example, ~)", "⑥ 해결 (At first ~, but after ~)", "⑦ 변화 · 배운 점 (since then / taught me that)", "⑧ 마무리 (I can always count on ~)"]}}, {"no": "06", "title": "My School Life", "q": ["What do you like most about your school life?", "학교생활에서 가장 좋아하는 점은 무엇인가요?"], "think": [["What is your favorite class or subject?", "가장 좋아하는 수업·과목은?", "미술, 체육, 과학 실험"], ["What club or activity are you in?", "어떤 동아리·활동을 하나요?", "미술 동아리, 방송부"], ["What school event do you look forward to?", "기대되는 학교 행사는?", "체육대회, 축제, 수학여행"], ["What is hard about school life?", "학교생활에서 힘든 점은?", "수행평가, 아침 일찍 일어나기"]], "vocab": [["subject", "명) 과목", "Science is my favorite subject.", "과학은 제가 가장 좋아하는 과목이에요."], ["club activity", "동아리 활동", "We have club activities every Friday afternoon.", "우리는 매주 금요일 오후에 동아리 활동을 해요."], ["school festival", "학교 축제", "Our class prepared a dance for the school festival.", "우리 반은 학교 축제를 위해 춤을 준비했어요."], ["sports day", "체육대회", "Our class won the relay race on sports day.", "우리 반이 체육대회 계주에서 우승했어요."], ["field trip", "현장 체험학습", "We went on a field trip to a science museum.", "우리는 과학관으로 현장 체험학습을 갔어요."], ["performance assessment", "수행평가", "We have a speaking performance assessment next week.", "다음 주에 말하기 수행평가가 있어요."], ["homeroom teacher", "담임 선생님", "Our homeroom teacher is strict but fair.", "우리 담임 선생님은 엄격하지만 공정하세요."], ["cafeteria", "명) 급식실", "The cafeteria serves fried chicken on Fridays.", "급식실에서는 금요일마다 치킨이 나와요."], ["participate in", "~에 참여하다", "I participated in the school science fair.", "저는 학교 과학 박람회에 참여했어요."], ["be in charge of", "~를 맡다, 책임지다", "I'm in charge of the decorations for our class booth.", "저는 우리 반 부스 장식을 맡고 있어요."], ["look forward to", "~을 기대하다", "I'm looking forward to our school trip.", "저는 수학여행이 기대돼요."], ["pressure", "명) 부담, 압박", "I feel a lot of pressure before exams.", "저는 시험 전에 부담을 많이 느껴요."], ["memorable", "형) 기억에 남는", "Last year's festival was the most memorable event.", "작년 축제가 가장 기억에 남는 행사였어요."], ["confidence", "명) 자신감", "Giving presentations helped me build confidence.", "발표를 하면서 자신감이 생겼어요."]], "expr": [["What I like most about my school life is ~.", "학교생활에서 가장 좋은 점은 ~예요.", "What I like most about my school life is club activities.", "학교생활에서 가장 좋은 점은 동아리 활동이에요.", "질문에 첫 문장으로 바로 답하는 표현!"], ["There is / There are ~ at my school.", "우리 학교에는 ~가 있어요.", "There are about 600 students at my school.", "우리 학교에는 학생이 600명쯤 있어요.", "하나면 There is · 여럿이면 There are"], ["My favorite subject is ~ because ~.", "가장 좋아하는 과목은 ~예요. 왜냐하면 ~.", "My favorite subject is P.E. because I love moving around.", "체육을 가장 좋아해요. 몸을 움직이는 게 좋거든요.", "because 뒤에는 주어 + 동사"], ["~ is the most ~ (of the year).", "~이 (1년 중) 가장 ~해요.", "Sports day is the most exciting event of the year.", "체육대회가 1년 중 가장 신나는 행사예요.", "긴 형용사 the most ~ · 짧은 형용사 the -est"], ["I'm in charge of ~.", "나는 ~를 맡고 있어요.", "I'm in charge of taking photos for our club.", "저는 우리 동아리 사진 촬영을 맡고 있어요.", "of 뒤에는 명사나 ~ing"], ["I'm looking forward to ~.", "~가 기대돼요.", "I'm looking forward to the school festival next month.", "다음 달 학교 축제가 기대돼요.", "to 뒤에 명사나 ~ing (to going ○)"], ["The hardest part is ~.", "가장 힘든 점은 ~예요.", "The hardest part is getting up early every morning.", "가장 힘든 점은 매일 아침 일찍 일어나는 거예요.", "좋은 점과 함께 말하면 답변의 균형이 생겨요."], ["Thanks to ~, I ~.", "~ 덕분에 나는 ~해요.", "Thanks to my club, I made many new friends.", "동아리 덕분에 새 친구를 많이 사귀었어요.", "좋은 결과와 그 원인을 함께 말해요."]], "kw": [["① BEST THING", "가장 좋은 점", "What I like most ~ is ~."], ["② DETAILS", "과목 · 동아리 · 맡은 일", "I'm in charge of ~."], ["③ STORY · HARD PART", "경험 · 힘든 점", "The hardest part is ~."], ["④ CLOSING", "기대 · 배운 점", "I'm looking forward to ~."]], "goals": ["There is/are를 넣어 5문장 말하기", "좋은 점 + 힘든 점을 but으로 연결", "메모 없이 학교 경험 + 배운 점까지"], "write": [[["• What school do you go to?", "• What is your favorite subject?", "• What club are you in?", "• What do you like most?"], ["I go to ~.", "My favorite subject is ~.", "I am in ~.", "I like ~ the most."]], [["+ What do you do there? Why do you like it?", "+ What is hard about school life?", "+ What are you looking forward to?"], ["What I like most about my school life is ~.", "The hardest part is ~, but ~.", "I'm looking forward to ~ because ~."]], [["+ What school experience changed you?", "+ How did you feel?", "+ What did you learn?"], ["When I first ~, I ~.", "However, ~.", "Thanks to ~, I ~.", "Still, I've learned that ~."]]], "check": ["질문(가장 좋아하는 점)에 첫 문장에서 답했나요?", "There is/are와 최상급을 정확히 썼나요?", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 학교생활<\/b>로 바꿨나요?"], "basic": {"en": ["I go to [[Haneul Middle School]].", "There are [[about 500]] students at my school.", "My favorite subject is [[art]].", "I am in [[the drawing club]], and it is [[really fun]].", "I like [[club activities]] the most."], "ko": ["저는 하늘중학교에 다녀요.", "우리 학교에는 학생이 500명쯤 있어요.", "제가 가장 좋아하는 과목은 미술이에요.", "저는 미술 동아리에 있는데, 정말 재미있어요.", "저는 동아리 활동이 가장 좋아요."], "why": "학교 → 규모 → 과목 → 동아리 → <b>가장 좋은 점<\/b>. 마지막 문장으로 질문에 분명하게 답하는 BASIC 답변이에요.", "swap": [["학교 이름", "Haneul Middle School"], ["학생 수 (There are ~)", "about 500"], ["좋아하는 과목", "art"], ["동아리 · 느낌", "the drawing club / really fun"], ["가장 좋은 점", "club activities"]]}, "inter": {"en": ["{{What I like most about my school life is}} [[the drawing club]].", "[[We meet every Friday afternoon]], and [[we draw posters and comics together]].", "{{I'm in charge of}} [[designing posters for school events]], {{so}} [[my drawings are often on the school walls]].", "I feel [[proud]] {{when}} [[my classmates stop to look at my posters]].", "My favorite subject is [[art]] {{because}} [[our teacher lets us try many different styles]].", "{{The hardest part is}} [[performance assessments]], {{but}} [[my friends and I prepare together, so it's not too bad]].", "{{I'm looking forward to}} [[the school festival in December]] {{because}} [[our club will run a drawing booth]]."], "ko": ["학교생활에서 제가 가장 좋아하는 것은 미술 동아리예요.", "우리는 매주 금요일 오후에 모여서 포스터와 만화를 함께 그려요.", "저는 학교 행사 포스터 디자인을 맡고 있어서, 제 그림이 학교 벽에 자주 붙어 있어요.", "반 친구들이 멈춰서 제 포스터를 볼 때 뿌듯해요.", "제가 가장 좋아하는 과목은 미술이에요. 선생님께서 다양한 스타일을 시도해 보게 해 주시거든요.", "가장 힘든 점은 수행평가지만, 친구들과 함께 준비해서 그렇게 힘들지는 않아요.", "12월 학교 축제가 기대돼요. 우리 동아리가 그림 부스를 운영할 거거든요."], "why": "첫 문장에 '가장 좋은 점'을 답하고, <b>구체적인 활동, 느낌, 이유<\/b>를 덧붙였어요. <b>힘든 점<\/b>까지 말해 답변에 균형이 생겼어요.", "swap": [["가장 좋은 점", "the drawing club"], ["맡은 일 (I'm in charge of ~, so ~)", "designing posters / on the school walls"], ["느낌 + when", "proud / classmates look at my posters"], ["힘든 점 + but", "performance assessments / prepare together"], ["기대되는 것 + because", "school festival / drawing booth"]]}, "adv": {"en": ["{{What I like most about my school life is}} [[the drawing club]], {{because}} [[it's the place where I found my confidence]].", "{{When}} [[I first joined it last year]], [[I was too shy to show anyone my sketches]].", "{{However}}, [[everything changed during the school festival]].", "[[Our club was asked to paint a huge mural on the cafeteria wall]], and {{surprisingly}}, [[the club leader chose my design]].", "[[For two weeks]], [[we stayed after school to paint]], and {{even though}} [[my arms ached]], [[it was the most rewarding project I've ever done]].", "On the day of the festival, [[students crowded around the mural and took photos]], {{which}} [[made me incredibly proud]].", "{{Thanks to}} [[that experience]], [[I'm no longer afraid to share my ideas in class]].", "{{Of course}}, [[school life isn't always easy]], and [[performance assessments still make me nervous]].", "{{Still}}, {{I've learned that}} [[school is not just a place to study but also a place to discover who I am]]."], "ko": ["학교생활에서 제가 가장 좋아하는 것은 미술 동아리예요. 그곳에서 자신감을 찾았거든요.", "작년에 처음 들어갔을 때 저는 너무 수줍어서 누구에게도 제 스케치를 보여 주지 못했어요.", "하지만 학교 축제 때 모든 것이 바뀌었어요.", "우리 동아리가 급식실 벽에 큰 벽화를 그리게 되었는데, 놀랍게도 동아리 회장이 제 디자인을 골랐어요.", "2주 동안 우리는 방과 후에 남아 그림을 그렸고, 팔이 아팠지만 지금까지 해 본 프로젝트 중 가장 보람 있었어요.", "축제 날, 학생들이 벽화 주변에 모여 사진을 찍었는데, 그게 저를 정말 뿌듯하게 했어요.", "그 경험 덕분에 이제는 수업 시간에 제 생각을 말하는 게 두렵지 않아요.", "물론 학교생활이 늘 쉬운 건 아니고, 수행평가는 여전히 긴장돼요.", "그래도 학교는 공부만 하는 곳이 아니라 내가 어떤 사람인지 발견하는 곳이라는 걸 배웠어요."], "why": "'동아리가 좋다'에서 멈추지 않고 <b>벽화 프로젝트 경험<\/b>으로 이유를 증명하고, <b>감정 변화(수줍음 → 뿌듯함 → 자신감)<\/b>와 <b>힘든 점 인정<\/b>, <b>배운 점<\/b>까지 말해요.", "swap": ["① 가장 좋은 점 + 이유 (because ~)", "② 처음 모습 (When I first ~)", "③ 전환점 (However, ~)", "④ 사건 (surprisingly, ~)", "⑤ 과정 · 감정 (even though ~)", "⑥ 결과 (, which ~)", "⑦ 변화 (Thanks to ~)", "⑧ 힘든 점 + 배운 점 (Still, I've learned ~)"]}}, {"no": "07", "title": "My Favorite Food", "q": ["What is your favorite food, and why do you like it?", "가장 좋아하는 음식은 무엇인가요? 그리고 왜 좋아하나요?"], "think": [["What food could you eat every day?", "매일 먹어도 질리지 않는 음식은?", "떡볶이, 김치볶음밥, 피자"], ["How does it taste, smell, or look?", "맛·냄새·모양은 어떤가요?", "매콤달콤, 고소한 냄새"], ["Where and with whom do you usually eat it?", "어디서 누구와 주로 먹나요?", "학교 앞 분식집, 가족과 집에서"], ["Do you have a special memory with this food?", "이 음식과 관련된 추억이 있나요?", "할머니가 해 주신 음식"]], "vocab": [["dish", "명) 요리", "Bibimbap is a traditional Korean dish.", "비빔밥은 한국의 전통 요리예요."], ["taste", "동) 맛이 ~하다", "This soup tastes a little salty.", "이 국은 조금 짠맛이 나요."], ["smell", "동) 냄새가 ~하다", "The bread smells so good!", "빵 냄새가 정말 좋아요!"], ["spicy", "형) 매운", "I can't eat very spicy food.", "저는 아주 매운 음식은 못 먹어요."], ["savory", "형) 짭짤하고 감칠맛 나는", "I prefer savory snacks to sweet ones.", "저는 단 간식보다 짭짤한 간식이 더 좋아요."], ["crispy", "형) 바삭한", "The fried chicken was crispy on the outside.", "그 치킨은 겉이 바삭했어요."], ["chewy", "형) 쫄깃한", "Rice cakes are soft and chewy.", "떡은 부드럽고 쫄깃해요."], ["ingredient", "명) 재료", "The main ingredients are rice, kimchi, and eggs.", "주재료는 밥, 김치, 달걀이에요."], ["homemade", "형) 집에서 만든", "Nothing beats my grandma's homemade dumplings.", "할머니가 직접 만드신 만두를 이길 음식은 없어요."], ["crave", "동) ~이 몹시 먹고 싶다", "I always crave ice cream in summer.", "여름엔 늘 아이스크림이 몹시 먹고 싶어요."], ["comfort food", "마음을 달래 주는 음식", "Ramen is my comfort food on rainy days.", "비 오는 날엔 라면이 제 마음을 달래 주는 음식이에요."], ["recipe", "명) 요리법", "My mom taught me her secret recipe.", "엄마가 비법 요리법을 가르쳐 주셨어요."], ["go well with", "~와 잘 어울리다", "Kimchi goes well with almost any Korean dish.", "김치는 거의 모든 한식과 잘 어울려요."], ["recommend", "동) 추천하다", "I recommend the cheese tteokbokki at this restaurant.", "이 식당의 치즈 떡볶이를 추천해요."]], "expr": [["My favorite food is ~.", "내가 가장  feelings?", "+ What does it mean to you?"], ["When I was ~, ~.", "Since then, ~.", "It reminds me that ~."]]], "check": ["질문(음식 + 좋아하는 이유)에 모두 답했나요?", "감각동사 + 형용사를 정확히 썼나요? (It tastes sweet.)", "이유(because)나 예시(For example)를 추가했나요?", "모범답안이 아닌 <b>나의 최애 음식<\/b>으로 바꿨나요?"], "basic": {"en": ["My favorite food is [[tteokbokki]].", "It is [[spicy and sweet]].", "It's made with [[rice cakes, fish cakes, and red pepper paste]].", "I usually eat it [[with my friends after school]].", "It tastes [[really good]], and it makes me [[happy]]."], "ko": ["제가 가장 좋아하는 음식은 떡볶이예요.", "떡볶이는 맵고 달콤해요.", "떡, 어묵, 고추장으로 만들어요.", "저는 보통 방과 후에 친구들과 먹어요.", "정말 맛있고, 저를 행복하게 해 줘요."], "why": "음식 → 맛 → 재료 → 언제·누구와 → 느낌. 좋아하는 음식에 대한 <b>기본 정보<\/b>를 감각 표현으로 짧고 정확하게 말해요.", "swap": [["음식", "tteokbokki"], ["맛 (It is ~)", "spicy and sweet"], ["재료 (made with ~)", "rice cakes, fish cakes, red pepper paste"], ["언제 · 누구와", "with my friends after school"], ["느낌", "really good / happy"]]}, "inter": {"en": ["My favorite food is [[my grandmother's kimchi stew]].", "{{It's made with}} [[kimchi, pork, and tofu]], and {{it tastes}} [[spicy, sour, and a little sweet]] at the same time.", "{{I usually eat it}} [[when we visit my grandparents in Gimhae]], {{so}} [[I look forward to every visit]].", "I like it {{because}} [[it's warm and full of flavor]], and [[it goes perfectly with a bowl of rice]].", "{{Whenever I eat it}}, {{I feel}} [[relaxed and cared for]].", "[[My mom has tried to make it at home]], {{but}} [[it never tastes the same as my grandmother's]].", "{{If you like}} [[spicy Korean food]], {{you should try}} [[kimchi stew on a cold day]]."], "ko": ["제가 가장 좋아하는 음식은 할머니표 김치찌개예요.", "김치, 돼지고기, 두부로 만드는데, 맵고 새콤하면서 동시에 살짝 달콤한 맛이 나요.", "보통 김해에 계신 할머니 댁에 갈 때 먹어서, 할머니 댁에 갈 때마다 기대돼요.", "따뜻하고 맛이 풍부한 데다 밥 한 공기와 완벽하게 어울려서 좋아해요.", "김치찌개를 먹을 때마다 마음이 편안해지고 보살핌을 받는 기분이 들어요.", "엄마가 집에서 만들어 보신 적도 있지만, 할머니 맛은 절대 안 나요.", "매운 한국 음식을 좋아한다면, 추운 날 김치찌개를 꼭 먹어 보세요."], "why": "맛과 재료를 <b>구체적으로 묘사<\/b>하고, 좋아하는 <b>이유를 2가지<\/b> 들었어요. 먹을 때의 <b>느낌<\/b>과 <b>추천<\/b>까지 더해 답변이 풍성해졌어요.", "swap": [["음식 + 재료 (made with ~)", "grandma's kimchi stew / kimchi, pork, tofu"], ["맛 (It tastes ~)", "spicy, sour, and a little sweet"], ["언제 + so", "visit grandparents / look forward to every visit"], ["좋아하는 이유 2개 (because ~)", "warm, full of flavor / goes with rice"], ["추천 (If you like ~, you should try ~)", "spicy Korean food / on a cold day"]]}, "adv": {"en": ["{{Of all the foods I've ever tried}}, [[my grandmother's kimchi stew]] {{is the one I love the most}}.", "[[She makes it with kimchi that she prepares herself every winter]], {{so}} [[it has a deep, rich flavor that you can't find in restaurants]].", "{{The moment}} [[the pot starts boiling]], [[the whole house smells spicy and savory]], and [[my mouth starts watering]].", "{{What makes it special, though, is}} [[the memory connected to it]].", "{{When}} [[I was in elementary school]], [[I caught a bad cold while I was staying at my grandparents' house]].", "[[My grandmother stayed up late to make me a mild version of the stew]], and [[after eating it, I felt much better]].", "{{Since then}}, [[kimchi stew has been my comfort food]], {{especially when}} [[I feel tired or down]].", "{{It reminds me that}} [[food is not just about taste but also about love]].", "{{Someday}}, [[I'd like to learn her recipe]] {{so that}} [[I can make it for the people I love]]."], "ko": ["지금까지 먹어 본 모든 음식 중에서 제가 가장 좋아하는 건 할머니표 김치찌개예요.", "할머니는 매년 겨울 직접 담그신 김치로 찌개를 끓이셔서, 식당에서는 맛볼 수 없는 깊고 진한 맛이 나요.", "냄비가 끓기 시작하는 순간 온 집 안에 맵고 고소한 냄새가 퍼지고, 입에 침이 고이기 시작해요.", "하지만 이 음식을 특별하게 만드는 건 그와 연결된 추억이에요.", "초등학생 때 할머니 댁에 머물다가 심한 감기에 걸린 적이 있어요.", "할머니께서 늦게까지 주무시지 않고 맵지 않은 김치찌개를 끓여 주셨고, 그걸 먹고 나니 훨씬 나아졌어요.", "그 뒤로 김치찌개는 제 마음을 달래 주는 음식이 되었어요. 특히 피곤하거나 우울할 때요.", "김치찌개는 음식이 맛만이 아니라 사랑이기도 하다는 걸 떠올리게 해요.", "언젠가 할머니의 요리법을 배워서 제가 사랑하는 사람들에게 만들어 주고 싶어요."], "why": "맛을 <b>감각적으로 묘사(smells, mouth starts watering)<\/b>하는 데서 멈추지 않고, 그 음식과 연결된 <b>추억(감기 걸린 날)<\/b>과 <b>감정<\/b>, 음식이 나에게 주는 <b>의미<\/b>까지 말해요.", "swap":
