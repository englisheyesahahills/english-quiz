<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goldilocks Mini Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column (max 680px) — sticky navy header band, day grid on home, one question card at a time */
:root{
  --navy:#1d2b4f; --burgundy:#8a2240; --gold:#c98a12;
  --bg:#f4f5f9; --card:#ffffff; --ink:#1b2133; --muted:#5c6478; --line:#dfe2ea;
  --soft:#eef0f6; --ok:#1d7a4a; --ok-bg:#e5f4ec; --bad:#b3263a; --bad-bg:#fbe9ec;
  --hdr:#1d2b4f; --hdr-ink:#ffffff; --chip:#ffffff; --chip-line:#c9cedb; --sel:#1d2b4f; --sel-ink:#ffffff;
  --display:"Do Hyeon","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151f; --card:#1b2030; --ink:#e8eaf1; --muted:#a3a9ba; --line:#2d3346; --soft:#232a3d;
  --burgundy:#e0708c; --gold:#e8b04a; --ok:#5fcf8f; --ok-bg:#163527; --bad:#ff8094; --bad-bg:#3a1a22;
  --hdr:#0d1426; --hdr-ink:#ffffff; --chip:#232a3d; --chip-line:#3a4258; --sel:#8fa3d9; --sel-ink:#0d1426; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151f; --card:#1b2030; --ink:#e8eaf1; --muted:#a3a9ba; --line:#2d3346; --soft:#232a3d;
  --burgundy:#e0708c; --gold:#e8b04a; --ok:#5fcf8f; --ok-bg:#163527; --bad:#ff8094; --bad-bg:#3a1a22;
  --hdr:#0d1426; --hdr-ink:#ffffff; --chip:#232a3d; --chip-line:#3a4258; --sel:#8fa3d9; --sel-ink:#0d1426; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-size:12px;opacity:.75;margin-left:6px;letter-spacing:0}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.bar{height:4px;background:rgba(255,255,255,.15)}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
main{padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.hero{display:grid;gap:6px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--burgundy);font-weight:700}
.hero h1{font-size:32px;line-height:1.2;color:var(--ink)}
.hero p{margin:0;color:var(--muted);font-size:14px}
.namebox{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:18px}
.namebox label{font-size:14px;color:var(--muted);white-space:nowrap}
.namebox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);font-weight:700;outline:none}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.c-대화문{color:#2f6fb0}.tag.c-본문{color:#3c8a5a}.tag.c-문법{color:var(--burgundy)}.tag.c-통합{color:#8a5a12}.tag.c-서술형{color:#6a3fa0}.tag.c-실전{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{display:grid;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;color:var(--ink)}
.day:hover,.day:focus-visible{border-color:var(--sel);outline:none}
.day .n{font-family:var(--display);font-size:20px;display:flex;justify-content:space-between;align-items:center}
.day .n em{font-style:normal;font-family:var(--body);font-size:13px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums}
.day .t{font-size:13px;color:var(--muted);line-height:1.4}
.day.done{border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.qhead b{color:var(--ink);font-family:var(--display);font-size:18px;font-weight:400}
.type{font-size:12px;font-weight:700;color:var(--burgundy);border:1px solid currentColor;border-radius:6px;padding:1px 6px}
details.pass{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:15px}
details.pass summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
details.pass .ptxt{margin-top:8px;line-height:1.75;overflow-wrap:anywhere}
.qtext{font-size:17px;font-weight:500;margin-bottom:16px;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--chip);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;line-height:1.5}
.opt .num{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--chip-line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--sel)}.opt.sel .num{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.inp{width:100%;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--chip-line);border-radius:10px;background:var(--chip);color:var(--ink)}
.inp:focus{outline:2px solid var(--sel);outline-offset:1px}
.built{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1.5px dashed var(--chip-line);border-radius:10px;margin-bottom:10px;align-content:flex-start}
.built:empty::before{content:"아래 단어를 순서대로 눌러 문장을 완성하세요";color:var(--muted);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.w{font:inherit;font-size:15px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--chip-line);background:var(--chip);color:var(--ink);cursor:pointer}
.w.used{opacity:.25;pointer-events:none}
.built .w{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:16px;padding:12px 18px;border-radius:10px;border:0;background:var(--navy);color:#fff;cursor:pointer;flex:1}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto}
.btn.accent{background:var(--burgundy)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.w:focus-visible,.opt:focus-visible,.hbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.fb{margin-top:16px;border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb .ans{font-weight:700}
.score{display:grid;gap:4px;text-align:center;padding:24px 18px}
.score .big{font-family:var(--display);font-size:64px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
:root:not([data-theme="light"]) .score .big{color:var(--ink)}
.score .meta{color:var(--muted);font-size:14px}
.review{display:grid;gap:8px;margin-top:16px}
.ri{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.ri .mk{font-weight:700;font-size:16px}.ri.ok .mk{color:var(--ok)}.ri.no .mk{color:var(--bad)}
.ri div{min-width:0;overflow-wrap:anywhere}
.ri .q{color:var(--muted)}
.sec{margin-top:24px;display:grid;gap:10px}
.sec h2{font-size:22px}
.point{background:var(--soft);border-radius:10px;padding:12px 16px}
.point ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.wsi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);display:grid;gap:8px}
.wsi .lines{border-bottom:1px solid var(--line);height:28px}
.wsi button{justify-self:start;font:inherit;font-size:13px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:3px 10px;cursor:pointer}
.wsi .a{color:var(--burgundy);font-weight:500;font-size:15px}
.note{font-size:13px;color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding-block:8px 24px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>

<header class="top"><div class="wrap"><div class="brand" id="brand">L7 Daily Mini Test<small id="subb">중2 동아(윤정미)</small></div><button class="hbtn" id="homeBtn" hidden>목록</button></div><div class="bar"><i id="bar" style="width:0"></i></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap" id="foot">제작: 스텔라원장 · 잉글리시아이 스텔라</footer>

<script>
const CONF={"key":"m1l8yun_v1","unit":"중1 동아(윤정미) L8","brand":"L8 Daily Mini Test","sub":"중1 동아(윤정미)","eyebrow":"Lesson 8 · Be Smart Online","flow":"대화문 → 본문 → 문법 → 통합 → 서술형 → 실전"};
const PASS={"D1":"<b>[Watch and Check 1]</b>\nG: This movie looks really fun. What do you think?\nB: [[I don't agree.]] I think it looks a little boring.\nG: But look at these actors. They are all famous.\nB: All right. Let's watch it.","D2":"<b>[Watch and Check 2]</b>\nB: [[What do you think about this pasta?]]\nG: I think it's pretty good.\nB: I don't think so. I think it's too salty.\nG: Really? It's OK for me.","D3":"<b>[Watch and Check 3]</b>\nG: My phone is not working. I need to get a new one.\nB: Look! Here are the new models. What do you think about this one?\nG: Wow, I like it. It's very light.\nB: [[I agree.]] It's lighter than mine.","D4":"<b>[Watch and Check 4]</b>\nG: What do you think about cleaning robots? There's one over there.\nB: I think they are very helpful. I really need one at home.\nG: [[Me, too.]] I don't like to clean my room.\nB: Who does? Cleaning robots are perfect for people like us.","D5":"<b>[Watch, Answer, and Talk]</b>\nB: What do you think about this book, Yuna?\nG: <i>A History of Black Holes</i>? I think it'll be difficult.\nB: I don't agree. I think it'll be very interesting.\nG: Hmm ... I didn't know you were interested in black holes. So, are you going to buy the book, Alex?\nB: I'd love to, but it's too thick and heavy.\nG: [[Why don't you buy the e-book then?]] You can read it on your phone.\nB: That's a good idea!\nG: And it's also cheaper than the paper book.\nB: Really? Then, I'll buy the e-book.","F1":"<b>Goldilocks Learns Her Lesson ①</b>\nThere was a little girl with golden hair in a small town. Her name was Goldilocks. She liked to share photos on social media. At first, she posted everyday things, but people didn't give her many likes.\n“What should I do to get more likes?” she thought. “I know! I should post funny pictures.”\nNow, her posts were getting a lot of likes, and Goldilocks was happy. Her followers, [[however]], soon got bored. So, she decided to post more shocking pictures.","F2":"<b>Goldilocks Learns Her Lesson ②</b>\nOne day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. [[It]] was getting dark, and it started to rain. She opened the door and walked inside.\nThere were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn't care.\n“It's so fun!” shouted Goldilocks.","F3":"<b>Goldilocks Learns Her Lesson ③</b>\nShe took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and [[fell asleep]] in the smallest bed.\nAbout an hour later, three bears came home.\n“Someone ate my soup and broke my chair!” cried Baby Bear.\nThey went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.\n“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.\nGoldilocks jumped up in surprise.","F4":"<b>Goldilocks Learns Her Lesson ④</b>\n“You [[broke into]] our house and posted these pictures without our permission. Don't you know these things are wrong?” said Father Bear.\n“Please forgive me. I'm so sorry, and I'll clean your house every day until the end of the summer,” said Goldilocks.","F5":"<b>Goldilocks Learns Her Lesson ⑤</b>\nAll summer long, Goldilocks worked hard. On the last day, Goldilocks said to Father Bear, “I deleted all my posts of your cottage, so please don't worry.”\n“You still don't understand. Other people already shared them on social media. Your posts will [[live on]] forever,” said Father Bear.\n“Oh, I didn't think about that,” said Goldilocks. “From now on, I'll think twice before I press POST.”"};

roke the chair.","A: What do you think about her selfies?<br>B: I think they were shocking.","A: I think the bears were too angry.<br>B: I don't think so. Goldilocks did wrong things.","A: Goldilocks should say sorry.<br>B: You're right. She shouldn't apologize.","A: What's your opinion about social media?<br>B: I think it's useful but we should be careful."],"a":3,"e":"동의 후 반대 내용 → 모순"},{"t":"mc","q":"밑줄 친 one이 가리키는 것이 바르게 연결되지 <b>않은</b> 것은?","o":["I need to get a new <u>one</u>. – a phone","I really need <u>one</u> at home. – a book","She ate the smallest <u>one</u>. – bowl of soup","She jumped on the smallest <u>one</u>. – chair","There's <u>one</u> over there. – a cleaning robot"],"a":1,"e":"one = a cleaning robot"},{"t":"mc","q":"다음 중 비교급·최상급이 쓰인 문장을 짝지은 것으로 알맞은 것은?","o":["It's OK for me. – She didn't care.","It's very light. – She was happy.","It's too salty. – She felt tired.","It looks boring. – It broke.","It's lighter than mine. – She ate the smallest one."],"a":4,"e":"lighter than(비교급) / the smallest(최상급)"},{"t":"sa","q":"Goldilocks의 행동에 대한 나의 의견을 I think로 시작하여 쓰시오. (wrong 포함)","a":["I think it was wrong.","I think she was wrong.","I think her actions were wrong.","I think Goldilocks was wrong.","I think it is wrong.","I think that was wrong."],"e":"(예시) I think it was wrong."},{"t":"sa","q":"우리말과 같도록 영작하시오. (opinion 포함, 7단어)<br>Goldilocks의 게시물에 대한 너의 의견은 무엇이니?","a":["What's your opinion about Goldilocks's posts?","What is your opinion about Goldilocks's posts?","What's your opinion about Goldilocks' posts?","What is your opinion about Goldilocks' posts?","What's your opinion of Goldilocks's posts?","What's your opinion of Goldilocks' posts?"],"e":"What's your opinion about ~?"},{"t":"or","q":"우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>나는 동의하지 않아. 그녀는 그들에게 사과해야 해.","w":["I","don't","agree","she","should","say sorry","to","them","agrees","they"],"a":"I don't agree she should say sorry to them","e":"비동의 + should"}],"ws":[{"q":"Goldilocks의 행동에 대해 의견을 묻고 비동의하는 대화를 쓰시오.","a":"(예시) A: I think her posts were funny. What do you think? B: I don't agree. I think they were rude."},{"q":"대화문의 it 중 비인칭 주어와 대명사를 구별하시오.","a":"대명사: It looks boring / It's very light / 비인칭: (본문) It was getting dark"},{"q":"본문에서 4형식, 비인칭 it, 최상급 문장을 각각 찾아 쓰시오.","a":"People didn't give her many likes. / It was getting dark. / She ate the smallest one."},{"q":"소셜 미디어 사용에 대한 나의 의견을 3문장으로 쓰시오.","a":"(예시) I think social media is fun. But we should be careful. We shouldn't post other people's photos."}]},{"d":22,"cat":"통합","title":"본문 고난도 ① (문장 삽입·순서)","point":["연결어 단서: At first → Now → however → So → One day → Then → About an hour later","대명사 단서: one, it, them, these pictures","인물 대사의 순서: Baby Bear → Mother Bear → Father Bear","문장 삽입: 앞뒤 내용의 인과관계 확인"],"q":[{"t":"mc","q":"글의 흐름으로 보아 주어진 문장이 들어갈 곳은?<br><br><b>Her followers, however, soon got bored.</b><br><br>At first, she posted everyday things. (①) She decided to post funny pictures. (②) Now, her posts were getting a lot of likes, and Goldilocks was happy. (③) So, she decided to post more shocking pictures. (④) One day, she was taking a walk in the forest. (⑤)","o":["①","②","③","④","⑤"],"a":2,"e":"행복했다 → 그러나 지루해졌다 → 그래서 충격적인 사진"},{"t":"mc","q":"주어진 글 다음에 이어질 순서로 알맞은 것은?<br><br>One day, she was taking a walk in the forest and found a cottage.<br>(A) She opened the door and walked inside.<br>(B) It was getting dark, and it started to rain.<br>(C) She knocked on the door, but there was no answer.","o":["(A)-(B)-(C)","(B)-(A)-(C)","(C)-(B)-(A)","(C)-(A)-(B)","(B)-(C)-(A)"],"a":2,"e":"노크 → 날씨 → 들어감"},{"t":"mc","q":"글의 흐름으로 보아 주어진 문장이 들어갈 곳은?<br><br><b>It broke, but she didn't care.</b><br><br>There were three bowls of soup on a table. (①) She ate the smallest one. (②) There were also three chairs. (③) She jumped on the smallest one again and again. (④) “It's so fun!” shouted Goldilocks. (⑤)","o":["①","②","③","④","⑤"],"a":3,"e":"의자 위에서 뛰었다 → 부서졌다"},{"t":"mc","q":"주어진 글 다음에 이어질 순서로 알맞은 것은?<br><br>About an hour later, three bears came home.<br>(A) Mother Bear found a phone next to Goldilocks.<br>(B) “Someone ate my soup and broke my chair!” cried Baby Bear.<br>(C) They went upstairs and saw Goldilocks.","o":["(A)-(B)-(C)","(B)-(C)-(A)","(C)-(A)-(B)","(B)-(A)-(C)","(C)-(B)-(A)"],"a":1,"e":"아기곰 외침 → 위층 → 휴대폰 발견"},{"t":"mc","q":"글의 흐름과 관계 <b>없는</b> 문장은?<br><br>All summer long, Goldilocks worked hard. ①On the last day, she said, “I deleted all my posts.” ②Father Bear said, “Other people already shared them.” ③Goldilocks liked to eat soup for breakfast. ④“Your posts will live on forever.” ⑤“I'll think twice before I press POST.”","o":["①","②","③","④","⑤"],"a":2,"e":"아침 식사 수프 이야기는 흐름과 무관"},{"t":"mc","q":"글의 흐름으로 보아 주어진 문장이 들어갈 곳은?<br><br><b>Goldilocks jumped up in surprise.</b><br><br>They went upstairs and saw Goldilocks. (①) Mother Bear found a phone next to her. (②) “This is terrible! Look at all these posts of our home,” shouted Mother Bear. (③) “You broke into our house,” said Father Bear. (④) “Please forgive me,” said Goldilocks. (⑤)","o":["①","②","③","④","⑤"],"a":2,"e":"엄마곰의 외침에 놀라 벌떡 일어남 → 아빠곰의 꾸중"},{"t":"mc","q":"(A), (B), (C)에 들어갈 말로 알맞은 것은?<br><br>(A)______, she posted everyday things. (B)______, her posts were getting a lot of likes. Her followers, (C)______, soon got bored.","o":["At first – Then – so","Now – At first – so","At first – Now – however","Finally – Now – however","At first – Now – because"],"a":2,"e":"At first → Now → however"},{"t":"sa","q":"다음 문장의 밑줄 친 them이 가리키는 것을 영어로 쓰시오. (5단어)<br>Other people already shared <u>them</u> on social media.","a":["all my posts of your cottage","my posts of your cottage","all her posts of the cottage","her posts of the cottage"],"e":"them = all my posts of your cottage"},{"t":"sa","q":"Goldilocks가 의자가 부서졌을 때 보인 반응을 영어로 쓰시오. (She로 시작, 3단어)","a":["She didn't care.","She did not care."],"e":"She didn't care."},{"t":"or","q":"우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>그녀는 문을 열고 안으로 걸어 들어갔다.","w":["she","opened","the door","and","walked","inside","open","in"],"a":"she opened the door and walked inside","e":"과거형 병렬"}],"ws":[{"q":"이야기 속 시간·순서 연결어를 순서대로 쓰시오.","a":"At first → Now → One day → Then → About an hour later → All summer long → On the last day → From now on"},{"q":"However, So가 쓰인 문장을 찾아 쓰고 앞뒤 관계를 설명하시오.","a":"Her followers, however, soon got bored.(역접) / So, she decided to post more shocking pictures.(결과)"},{"q":"세 곰의 대사를 순서대로 영어로 쓰시오.","a":"Baby Bear: Someone ate my soup and broke my chair! / Mother Bear: This is terrible! / Father Bear: You broke into our house ..."},{"q":"이야기의 클라이맥스 장면을 우리말 2문장으로 쓰시오.","a":"곰들이 위층에서 자고 있는 Goldilocks와 휴대폰 속 게시물을 발견한다. Goldilocks는 놀라서 일어난다."}]},{"d":23,"cat":"통합","title":"본문 고난도 ② (요약·추론·주제)","point":["요약문 빈칸: posted → shocking → broke into → without permission → deleted → shared → live on","주제: online responsibility, privacy, permission","인물 성격 추론: Goldilocks(attention-seeking → reflective)","속담·교훈 연결: Look before you leap."],"q":[{"t":"mc","q":"다음 요약문의 빈칸 (A), (B)에 알맞은 것은?<br><br>Goldilocks posted pictures of the bears' house (A)______ their permission. Later, she deleted them, but her posts will live on because other people already (B)______ them.","o":["with – deleted","without – deleted","without – shared","with – shared","until – posted"],"a":2,"e":"without permission / shared"},{"t":"mc","q":"이 글의 주제로 가장 알맞은 것은?","o":["being careful and responsible on social media","the danger of walking in the forest","how to get more likes","how to cook soup","why bears are angry animals"],"a":0,"e":"온라인 게시물의 책임"},{"t":"mc","q":"이 글의 교훈과 가장 잘 어울리는 속담은?","o":["Time flies like an arrow.","The early bird catches the worm.","Practice makes perfect.","Too many cooks spoil the broth.","Look before you leap."],"a":4,"e":"뛰기 전에 살펴라 = 신중하게 행동하라"},{"t":"mc","q":"Goldilocks의 성격 변화로 가장 알맞은 것은?","o":["careful → careless","attention-seeking → thoughtful","kind → rude","shy → brave","lazy → hardworking only"],"a":1,"e":"관심을 끌려던 → 신중하게 생각하는"},{"t":"mc","q":"Father Bear에 대한 설명으로 알맞은 것은?","o":["He wanted more likes.","He ate Goldilocks's soup.","He broke the chair.","He taught Goldilocks about online posts.","He posted pictures on social media."],"a":3,"e":"게시물이 영원히 남는다는 것을 알려 줌"},{"t":"mc","q":"다음 중 이 글을 읽고 바르게 이해한 학생은?","o":["하준: Goldilocks는 여름 내내 곰의 집을 청소했어.","준호: 곰들은 Goldilocks를 집에 초대했어.","서연: 게시물을 삭제하면 완전히 사라진다는 것이 교훈이야.","민지: Goldilocks는 처음부터 충격적인 사진을 올렸어.","지우: 엄마곰은 Goldilocks의 사진을 좋아했어."],"a":0,"e":"All summer long, Goldilocks worked hard."},{"t":"mc","q":"Goldilocks가 앞으로 할 행동으로 가장 알맞은 것은?","o":["She will post more shocking pictures.","She will stop using her phone forever.","She will break into another house.","She will ask for permission before she posts photos of others.","She will give the bears many likes."],"a":3,"e":"I'll think twice before I press POST."},{"t":"sa","q":"요약문의 빈칸에 알맞은 한 단어를 본문에서 찾아 쓰시오.<br>Goldilocks learned that her posts will live on ______.","a":["forever"],"e":"live on forever"},{"t":"sa","q":"Q의 답을 영어로 쓰시오. (She learned that으로 시작)<br>Q: What lesson did Goldilocks learn?","a":["She learned that she should think twice before she posts.","She learned that she should think twice before she presses POST.","She learned that her posts will live on forever.","She learned that she should think twice before she posts something."],"e":"think twice before posting"},{"t":"or","q":"우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>우리는 다른 사람들의 사진을 허락 없이 올리면 안 된다.","w":["we","shouldn't","post","other people's","photos","without","permission","with","should"],"a":"we shouldn't post other people's photos without permission","e":"shouldn't + 동사원형"}],"ws":[{"q":"이야기를 3문장 영어로 요약하시오.","a":"(예시) Goldilocks posted pictures of the bears' house without permission. She said sorry and cleaned their house. She learned to think twice before she posts."},{"q":"Goldilocks가 처음과 끝에 어떻게 달라졌는지 쓰시오.","a":"처음: 좋아요만 신경 씀 / 끝: 게시 전에 신중히 생각하기로 함"},{"q":"이 이야기와 어울리는 속담과 그 이유를 쓰시오.","a":"Look before you leap. – 행동하기 전에 결과를 생각해야 하므로"},{"q":"온라인 예절(netiquette) 3가지를 영어로 쓰시오.","a":"(예시) Ask before you post. Don't share personal information. Be kind in comments."}]},{"d":24,"cat":"통합","title":"어법 고난도 (개수·짝·오류 찾기)","point":["4형식 어순 / 3형식 to·for / 직목 대명사 → 3형식","비인칭 주어 it vs 대명사 it","There was/were 수 일치 / 과거형 불규칙","look + 형용사 / like·decide·start + to부정사 / bored·boring"],"q":[{"t":"mc","q":"어법상 알맞은 문장의 개수는?<br><br>ⓐ This movie looks really fun.<br>ⓑ There were three beds.<br>ⓒ She made me a sandwich.<br>ⓓ It's two kilometers to the park.<br>ⓔ Mom bought a bike to me.","o":["1개","2개","3개","4개","5개"],"a":3,"e":"ⓔ for me → 4개 맞음"},{"t":"mc","q":"밑줄 친 부분 중 어법상 <b>틀린</b> 것은?<br><br>Goldilocks ①liked to share photos. Her followers soon got ②bored. She ③decided to post shocking pictures. She ④eat the smallest soup and ⑤took selfies.","o":["①","②","③","④","⑤"],"a":3,"e":"eat → ate"},{"t":"mc","q":"어법상 <b>틀린</b> 문장끼리 짝지은 것은?<br><br>ⓐ Please send it to me.<br>ⓑ The book looks interestingly.<br>ⓒ It was getting dark.<br>ⓓ Dad made pancakes for us.<br>ⓔ There was two bowls.","o":["ⓐ, ⓑ","ⓑ, ⓔ","ⓒ, ⓓ","ⓑ, ⓒ","ⓓ, ⓔ"],"a":1,"e":"ⓑ interesting / ⓔ were"},{"t":"mc","q":"빈칸에 들어갈 말이 나머지와 <b>다른</b> 것은?","o":["He told the news ______ me.","She showed her room ______ us.","I sent a gift ______ Tom.","He gave the ball ______ his dog.","Mom cooked soup ______ me."],"a":4,"e":"cook → for, 나머지 → to"},{"t":"mc","q":"다음 중 우리말을 영어로 바르게 옮긴 것을 모두 고른 것은?<br><br>ⓐ 비가 오기 시작했다. → It started to rain.<br>ⓑ 그것은 지루해 보인다. → It looks boring.<br>ⓒ 그는 나에게 그것을 주었다. → He gave me it.<br>ⓓ 그녀는 가장 작은 의자를 부쉈다. → She broke the smallest chair.","o":["ⓐ, ⓑ","ⓑ, ⓒ","ⓐ, ⓑ, ⓓ","ⓐ, ⓒ, ⓓ","ⓐ, ⓑ, ⓒ, ⓓ"],"a":2,"e":"ⓒ He gave it to me."},{"t":"mc","q":"밑줄 친 It의 쓰임이 같은 것끼리 짝지은 것은?<br><br>ⓐ <u>It</u>'s raining outside.<br>ⓑ <u>It</u> looks a little boring.<br>ⓒ <u>It</u>'s 3 o'clock now.<br>ⓓ <u>It</u>'s lighter than mine.<br>ⓔ <u>It</u>'s Sunday today.","o":["ⓐ, ⓑ, ⓒ / ⓓ, ⓔ","ⓐ, ⓓ / ⓑ, ⓒ, ⓔ","ⓐ, ⓒ, ⓔ / ⓑ, ⓓ","ⓑ, ⓒ / ⓐ, ⓓ, ⓔ","ⓐ, ⓑ / ⓒ, ⓓ, ⓔ"],"a":2,"e":"비인칭(날씨·시간·요일) / 대명사"},{"t":"mc","q":"어법상 <b>틀린</b>   const m={"isn't":"is not","don't":"do not","doesn't":"does not","it's":"it is","i'm":"i am","it'll":"it will","aren't":"are not","can't":"cannot","won't":"will not","what's":"what is","they're":"they are"};
  for(const k in m)s=s.split(k).join(m[k]);
  return s.replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();}

  <h1>30일 미니테스트</h1>
  <p>하루 10문항 · ${CONF.flow} 순서로 진행합니다. 풀고 나면 같은 DAY의 연계 워크시트를 확인하세요.</p></div>
  <div class="namebox"><label for="nm">이름</label><input id="nm" placeholder="이름을 입력하세요" value="${esc(store.name)}" maxlength="20"></div>
  <div class="stats"><span>완료 <b>${doneN}</b>/30일</span><span>평균 <b>${avg}</b>점</span></div>
  <div class="legend">${cats.map(c=>`<span class="tag c-${c}">${c}</span>`).join("")}</div>
  <div class="grid">${DAYS.map(d=>{const b=store.best[d.d];return `<button class="day ${b!=null?"done":""}" data-d="${d.d}">
    <span class="n">DAY ${String(d.d).padStart(2,"0")}${b!=null?`<em>${b}/10</em>`:""}</span>
    <span class="tag c-${d.cat}" style="justify-self:start">${d.cat}</span>
    <span class="t">${esc(d.title)}</span></button>`}).join("")}</div>`;
  $("#nm").oninput=e=>{store.name=e.target.value.trim();save()};
  app.querySelectorAll(".day").forEach(b=>b.onclick=()=>start(+b.dataset.d));
}

function start(d,only){
  if(!store.name){const nm=$("#nm"); if(nm){nm.focus();nm.placeholder="먼저 이름을 입력하세요!";nm.parentNode.style.borderColor="var(--bad)";} return;}
  const day=DAYS[d-1];
  const idxs=only||day.q.map((_,i)=>i);
  S={day,list:idxs.map(i=>prep(day.q[i],i,day.d)),i:0,res:[],retry:!!only,t0:Date.now()};
  $("#homeBtn").hidden=false; showQ();
}
function seeded(arr,seed){let s=seed;const a=arr.slice();for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function prep(q,orig,dd){
  const o={...q,orig};
  if(q.t==="mc"){o.ord=q.o.map((_,i)=>i);}
  if(q.t==="or"){o.pool=seeded(q.w.map((w,i)=>({w,i})),dd*31+orig);}
  return o;
}
function showQ(){
  window.scrollTo(0,0);
  const q=S.list[S.i], n=S.list.length;
  setBar(S.i/n);
  const pass=q.p?`<details class="pass" open><summary>지문 보기 / 접기</summary><div class="ptxt">${fmt(PASS[q.p])}</div></details>`:"";
  let body="";
  if(q.t==="mc") body=`<div class="opts">${q.ord.map((k,pos)=>`<button class="opt" data-k="${k}"><span class="num">${pos+1}</span><span>${fmt(q.o[k])}</span></button>`).join("")}</div>`;
  if(q.t==="sa") body=`<input class="inp" id="sa" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력하세요">`;
  if(q.t==="or") body=`<div class="built" id="built"></div><div class="pool" id="pool">${q.pool.map((p,k)=>`<button class="w" data-k="${k}">${esc(p.w)}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="card">
   <div class="qhead"><b>DAY ${S.day.d}${S.retry?" · 오답 재도전":""}</b><span><span class="type">${TYPE[q.t]}</span> &nbsp;${S.i+1} / ${n}</span></div>
   ${pass}<div class="qtext">${S.i+1}. ${fmt(q.q)}</div>${body}
   <div id="fbx"></div>
   <div class="actions">${q.t==="or"?`<button class="btn ghost" id="reset">다시 배열</button>`:""}<button class="btn" id="go" disabled>정답 확인</button></div></div>`;
  const go=$("#go"); let pick=null, built=[];
  if(q.t==="mc") app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{app.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");pick=+b.dataset.k;go.disabled=false});
  if(q.t==="sa"){const inp=$("#sa");inp.oninput=()=>go.disabled=!inp.value.trim();inp.onkeydown=e=>{if(e.key==="Enter"&&!go.disabled)go.click()};setTimeout(()=>inp.focus({preventScroll:true}),50)}
  if(q.t==="or"){
    const draw=()=>{$("#built").innerHTML=built.map((k,j)=>`<button class="w" data-j="${j}">${esc(q.pool[k].w)}</button>`).join("");
      app.querySelectorAll("#pool .w").forEach(b=>b.classList.toggle("used",built.includes(+b.dataset.k)));
      app.querySelectorAll("#built .w").forEach(b=>b.onclick=()=>{if(S.locked)return;built.splice(+b.dataset.j,1);draw()});
      go.disabled=!built.length;};
    app.querySelectorAll("#pool .w").forEach(b=>b.onclick=()=>{if(S.locked)return;built.push(+b.dataset.k);draw()});
    $("#reset").onclick=()=>{if(S.locked)return;built=[];draw()};
  }
  S.locked=false;
  go.onclick=()=>{
    if(S.locked){next();return}
    let ok,user,right;
    if(q.t==="mc"){ok=pick===q.a;user=CIRC[q.ord.indexOf(pick)]+" "+q.o[pick];right=CIRC[q.ord.indexOf(q.a)]+" "+q.o[q.a];
      app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const k=+b.dataset.k;if(k===q.a)b.classList.add("right");else if(k===pick)b.classList.add("wrong")});}
    if(q.t==="sa"){const v=$("#sa").value;user=v;ok=q.a.some(a=>norm(a)===norm(v));right=q.a[0];$("#sa").disabled=true;}
    if(q.t==="or"){user=built.map(k=>q.pool[k].w).join(" ");ok=norm(user)===norm(q.a);right=cap(q.a)+".";
      app.querySelectorAll(".w").forEach(b=>b.disabled=true);const r=$("#reset");if(r)r.disabled=true;}
    S.res.push({orig:q.orig,ok,user,right,q});
    S.locked=true;
    $("#fbx").innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"정답입니다!":"아쉬워요. 다시 확인해 봅시다."}</strong>${ok&&q.t==="mc"?"":`<div>정답: <span class="ans">${fmt(String(right).replace(/<br>/g," "))}</span></div>`}<div>${fmt(q.e)}</div></div>`;
    go.textContent=S.i+1<S.list.length?"다음 문제":"결과 보기";
    $("#fbx").scrollIntoView({behavior:"smooth",block:"nearest"});
  };
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function next(){S.i++; if(S.i<S.list.length)showQ(); else result();}

function result(){
  setBar(1); window.scrollTo(0,0);
  const d=S.day, sc=S.res.filter(r=>r.ok).length, n=S.res.length;
  if(!S.retry){const prev=store.best[d.d]; if(prev==null||sc>prev){store.best[d.d]=sc;save();}}
  const wrong=S.res.filter(r=>!r.ok).map(r=>r.orig);
  const now=new Date(), ts=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const msg=sc===n?"완벽해요! 내신 실전에서도 이 정확도를 유지하세요.":sc>=8?"아주 좋아요. 틀린 문제의 해설을 꼭 다시 읽어 보세요.":sc>=6?"기본은 잡혔어요. 오답 재도전으로 약점을 채워 봅시다.":"오늘 개념을 워크시트로 다시 정리한 뒤 재도전해 봅시다.";
  app.innerHTML=`<div class="card score">
     <span class="eyebrow">DAY ${d.d} · ${esc(d.title)}${S.retry?" · 오답 재도전":""}</span>
     <div class="big">${sc}<span style="font-size:28px">/${n}</span></div>
     <div class="meta">${esc(store.name||"이름 미입력")} · ${ts}</div>
     <p style="margin:6px 0 0">${msg}</p>
     <p class="note" style="margin:0" id="sv">${saveOn()?"결과를 선생님께 저장하는 중…":"이 화면을 캡처해서 선생님께 보내 주세요."}</p></div>
   <div class="actions">${wrong.length?`<button class="btn accent" id="rt">오답만 다시 풀기 (${wrong.length})</button>`:""}<button class="btn" id="ws">연계 워크시트</button></div>
   <div class="actions" style="margin-top:8px"><button class="btn ghost" id="again">처음부터 다시</button><button class="btn ghost" id="hm">DAY 목록</button></div>
   <div class="sec"><h2>문항별 확인</h2><div class="review">${S.res.map((r,i)=>`<div class="ri ${r.ok?"ok":"no"}"><span class="mk">${r.ok?"O":"X"}</span><div><div class="q">${i+1}. ${fmt(r.q.q.split("<br>")[0])}</div>${r.ok?"":`<div>내 답: ${esc(String(r.user).replace(/<br>/g," "))}</div><div style="color:var(--ok);font-weight:700">정답: ${fmt(String(r.right).replace(/<br>/g," "))}</div>`}</div></div>`).join("")}</div></div>`;
  if(wrong.length)$("#rt").onclick=()=>start(d.d,wrong);
  if(saveOn()) send(buildPayload(d,sc,n,now));
  $("#ws").onclick=()=>worksheet(d.d);
  $("#again").onclick=()=>start(d.d);
  $("#hm").onclick=home;
}

const strip=s=>String(s).replace(/<br>/g," ").replace(/<[^>]+>/g,"").replace(/\[\[|\]\]/g,"").replace(/\s+/g," ").trim();
function buildPayload(d,sc,n,now){
  const wr=S.res.map((r,i)=>({r,i})).filter(x=>!x.r.ok);
  const p=v=>String(v).padStart(2,"0");
  const ts=`${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}:00+09:00`;
  return {type:"minitest",name:store.name,unit:UNIT,day:d.d,title:d.title,cat:d.cat,
    attempt:S.retry?"오답 재도전":"첫 응시",score:sc,total:n,
    wrongNums:wr.length?wr.map(x=>(x.r.orig+1)+"번").join(", "):"없음",
    wrongDetail:wr.map(x=>`${x.r.orig+1}번(${TYPE[x.r.q.t]}) 내 답: ${strip(x.r.user)||"-"} → 정답: ${strip(x.r.right)}`).join("\n").slice(0,1900),
    minutes:Math.max(1,Math.round((Date.now()-S.t0)/60000)),timestamp:ts};
}
async function send(payload){
  const el=$("#sv");
  const show=(t,c)=>{const x=$("#sv"); if(x){x.innerHTML=t; x.style.color=c||"";}};
  try{await post(payload); show("✓ 선생님 노션에 결과가 저장되었습니다.","var(--ok)"); flushQ();}
  catch(e){const q=getQ(); q.push(payload); setQ(q);
    show(`저장에 실패했어요(인터넷 확인). <button id="resend" class="w" style="font-size:13px;padding:2px 10px">다시 저장</button><br>다음에 앱을 열면 자동으로 다시 보내요.`,"var(--bad)");
    const b=$("#resend"); if(b) b.onclick=async()=>{show("다시 저장하는 중…"); try{await flushQ(); if(getQ().length) throw 0; show("✓ 선생님 노션에 결과가 저장되었습니다.","var(--ok)");}catch(_){show("아직 저장되지 않았어요. 잠시 후 다시 시도하세요.","var(--bad)")}};}
}
function worksheet(dn){
  const d=DAYS[dn-1]; setBar(0); window.scrollTo(0,0); $("#homeBtn").hidden=false;
  app.innerHTML=`<div class="hero"><span class="eyebrow">DAY ${d.d} 연계 워크시트 · ${d.cat}</span><h1 style="font-size:26px">${esc(d.title)}</h1>
  <p>개념을 다시 정리하고, 노트에 직접 써 본 뒤 정답을 확인하세요.</p></div>
  <div class="sec" style="margin-top:0"><h2>핵심 개념</h2><div class="point"><ul>${d.point.map(p=>`<li>${p}</li>`).join("")}</ul></div></div>
  <div class="sec"><h2>연습 문제</h2>${d.ws.map((w,i)=>`<div class="wsi"><div><b>${i+1}.</b> ${fmt(w.q)}</div><div class="lines"></div><button data-i="${i}">정답 보기</button><div class="a" hidden id="wa${i}">${fmt(esc(w.a))}</div></div>`).join("")}</div>
  <div class="actions"><button class="btn" id="tq">DAY ${d.d} 테스트 풀기</button><button class="btn ghost" id="hm">DAY 목록</button></div>`;
  app.querySelectorAll(".wsi button").forEach(b=>b.onclick=()=>{const a=$("#wa"+b.dataset.i);a.hidden=!a.hidden;b.textContent=a.hidden?"정답 보기":"정답 숨기기"});
  $("#tq").onclick=()=>start(d.d); $("#hm").onclick=home;
}
home();
flushQ();
})();
</script>

</body>
</html>
