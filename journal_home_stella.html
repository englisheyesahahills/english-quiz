<title>MY ENGLISH JOURNAL Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>

/* Layout: one landscape classroom screen — Lumi stage on the left, the current step's board on the right, step rail along the bottom. */
:root{
  --bg:#F4F6FB; --panel:#FFFFFF; --ink:#1B2547; --muted:#5A6386;
  --navy:#23305C; --pink:#C93A72; --pink-soft:#FCE8F0; --sky:#E8F0FB; --line:#D4DAE8; --gold:#F2B935;
  --display:'Fredoka','Nunito','Noto Sans KR',sans-serif;
  --body:'Nunito','Noto Sans KR',sans-serif;
  --kr:'Noto Sans KR','Nunito',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121831; --panel:#1C2445; --ink:#F1F3FA; --muted:#A9B1D0; --navy:#7F95D9; --pink:#F06A9E; --pink-soft:#3A2240; --sky:#22305A; --line:#33406B; --gold:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121831; --panel:#1C2445; --ink:#F1F3FA; --muted:#A9B1D0; --navy:#7F95D9; --pink:#F06A9E; --pink-soft:#3A2240; --sky:#22305A; --line:#33406B; --gold:#F2C14E; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:14px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--navy);letter-spacing:.5px}
.brand b{color:var(--pink)}
.weekpick{display:flex;align-items:center;gap:6px;margin-left:auto}
.weekpick select{font:700 18px var(--body);padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);max-width:62vw}
.iconbtn{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;font:800 16px var(--body);padding:8px 14px;min-height:44px}
.iconbtn:hover{border-color:var(--navy)}

/* main */
.main{display:grid;grid-template-columns:minmax(220px,30%) 1fr;gap:18px;min-height:0}
.stage{background:var(--sky);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px;position:relative;overflow:hidden;min-height:0}
.bubble{background:var(--panel);border-radius:22px;padding:16px 18px;font:700 clamp(16px,1.6vw,24px)/1.35 var(--body);color:var(--ink);box-shadow:0 6px 0 var(--line);position:relative;width:100%;box-sizing:border-box;margin-bottom:18px;min-height:3.2em}
.bubble small{display:block;font:500 .72em/1.4 var(--kr);color:var(--muted);margin-top:6px}
.bubble::after{content:"";position:absolute;bottom:-14px;left:50%;border:14px solid transparent;border-top-color:var(--panel);border-bottom:0;transform:translateX(-50%)}
.lumi{width:min(100%,320px);aspect-ratio:1;max-width:100%;position:relative}
.lumi img{width:100%;height:100%;object-fit:contain;transform-origin:50% 90%;animation:idle 3.2s ease-in-out infinite;user-select:none;-webkit-user-drag:none}
.lumi.talk img{animation:talk .36s ease-in-out infinite}
.lumi.cheer img{animation:cheer .6s ease-in-out 4}
@keyframes idle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes talk{0%,100%{transform:scale(1,1) rotate(-2deg)}50%{transform:scale(1.03,.97) translateY(4px) rotate(2deg)}}
@keyframes cheer{0%,100%{transform:translateY(0)}40%{transform:translateY(-34px) rotate(-6deg)}70%{transform:translateY(-10px) rotate(4deg)}}
.shadow{width:58%;height:16px;border-radius:50%;background:rgba(35,48,92,.14);margin-top:-6px}
.speakrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center}
.speak{border:0;border-radius:999px;background:var(--pink);color:#fff;font:800 17px var(--body);padding:12px 20px;min-height:48px}
.speak.alt{background:var(--navy)}
.speak[disabled]{opacity:.45;cursor:default}
.star{position:absolute;color:var(--gold);font-size:30px;pointer-events:none;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}

.board{background:var(--panel);border-radius:28px;padding:clamp(18px,2.4vw,36px);overflow:auto;min-height:0;display:flex;flex-direction:column;gap:18px;border:2px solid var(--line)}
.eyebrow{font:800 14px var(--body);letter-spacing:2px;color:var(--pink);text-transform:uppercase}
h1{font:600 clamp(30px,4vw,60px)/1.08 var(--display);margin:0;text-wrap:balance;color:var(--ink)}
.q{font:700 clamp(18px,1.8vw,28px)/1.35 var(--body);color:var(--muted);margin:0}
.kr{font-family:var(--kr);font-weight:500;color:var(--muted)}
body.no-kr .kr{display:none}

/* guided questions */
.gq{display:grid;gap:12px}
.gqi{display:grid;grid-template-columns:64px 1fr;align-items:stretch;border-radius:18px;background:var(--bg);border:2px solid transparent;text-align:left;padding:0;color:inherit;overflow:hidden}
.gqi .num{display:flex;align-items:center;justify-content:center;background:var(--pink);color:#fff;font:700 22px var(--display)}
.gqi.star .num{background:var(--navy)}
.gqi .txt{padding:14px 18px;font:800 clamp(18px,1.9vw,30px)/1.3 var(--body);min-width:0}
.gqi .txt .kr{display:block;font-size:.62em;margin-top:2px}
.gqi.on{border-color:var(--pink);background:var(--pink-soft)}

/* goal */
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.goal{border-radius:22px;border:3px solid var(--line);background:var(--bg);padding:20px 16px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px}
.goal .s{font:800 15px var(--body);color:var(--pink);letter-spacing:1px}
.goal .t{font:600 clamp(22px,2.4vw,36px)/1.1 var(--display)}
.goal .ex{font:700 15px/1.45 var(--body);color:var(--muted);margin-top:8px}
.goal.on{border-color:var(--pink);background:var(--pink-soft)}

/* timer */
.timerwrap{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.timer{font:600 clamp(64px,10vw,150px)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--navy);letter-spacing:2px}
.timer.done{color:var(--pink)}
.tbtns{display:flex;gap:10px;flex-wrap:wrap}
.tbtn{border:0;border-radius:16px;font:800 20px var(--body);padding:14px 22px;min-height:56px;background:var(--navy);color:#fff}
.tbtn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.bar{height:14px;border-radius:999px;background:var(--bg);overflow:hidden;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:var(--pink);transform-origin:left;transition:transform .9s linear}
.rules{display:flex;flex-wrap:wrap;gap:8px}
.rule{background:var(--pink);color:#fff;border-radius:999px;font:800 16px var(--body);padding:8px 16px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border-radius:20px;background:var(--bg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{margin:0;font:700 18px var(--display);color:var(--navy);letter-spacing:.5px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;text-align:left;font:800 clamp(16px,1.5vw,22px)/1.3 var(--body);color:inherit}
.chip .kr{display:block;font-size:.7em}
.chip:hover,.chip.on{border-color:var(--pink)}
.pe{font:800 clamp(18px,1.8vw,26px)/1.4 var(--body)}
.pe u{text-decoration:none;border-bottom:3px solid var(--pink);padding:0 1.2em}
.words{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.word{border-radius:14px;background:var(--panel);border:2px solid var(--line);padding:10px;text-align:center;font:800 clamp(16px,1.5vw,22px) var(--body);color:inherit}
.word .kr{display:block;font-size:.7em}

.big{font:600 clamp(26px,3.2vw,48px)/1.2 var(--display);color:var(--navy);margin:0}
.mission{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mission .box{align-items:flex-start}
.mission .n{font:700 34px var(--display);color:var(--pink)}
.mission p{margin:0;font:800 20px/1.3 var(--body)}

/* step rail */
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.step{border:0;border-radius:16px;background:var(--panel);color:var(--muted);font:800 15px/1.2 var(--body);padding:10px 6px;border:2px solid var(--line);min-height:56px}
.step b{display:block;font:600 19px var(--display);color:var(--ink)}
.step.on{background:var(--navy);border-color:var(--navy);color:#DCE2F5}
.step.on b{color:#fff}

/* voice drawer */
.drawer{position:fixed;inset:auto 0 0 0;background:var(--panel);border-top:3px solid var(--navy);padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 30px rgba(0,0,0,.15);z-index:20;display:flex;flex-direction:column;gap:10px;max-height:70%;overflow:auto}
.drawer h2{margin:0;font:600 24px var(--display);color:var(--navy)}
.drawer p{margin:0;font:600 15px/1.55 var(--kr);color:var(--muted);max-width:70ch}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;font:700 15px var(--body);background:var(--bg);border-radius:10px;padding:8px 12px;min-width:0}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.drow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.up{background:var(--pink);color:#fff;border-radius:12px;font:800 16px var(--body);padding:12px 18px;cursor:pointer}
label.up input{display:none}

@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .stage{flex-direction:row;align-items:flex-end;gap:12px;padding:14px}
  .lumi{width:120px;flex-shrink:0}
  .bubble{margin-bottom:0}
  .bubble::after{display:none}
  .shadow,.speakrow{display:none}
  .goals,.mission{grid-template-columns:1fr 1fr}
  .cols,.timerwrap{grid-template-columns:1fr}
  .words{grid-template-columns:repeat(2,1fr)}
  .rail{grid-template-columns:repeat(3,1fr)}
  .app{height:auto;min-height:100%}
}
@media (prefers-reduced-motion:reduce){.lumi img,.star{animation:none!important}}


/* ---- home v2 ---- */
[hidden]{display:none!important}
.rail{grid-template-columns:repeat(9,1fr)}
.rail.hide{display:none}
.app.map{grid-template-rows:auto 1fr}
.brand button{all:unset;cursor:pointer}
.by{display:inline-block;margin-left:6px;font:700 13px var(--display);letter-spacing:.5px;color:#fff;background:var(--navy);border-radius:999px;padding:3px 10px;vertical-align:2px}
.letter{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--sky);border-radius:18px;padding:14px 18px}
.letter .seal{width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px var(--display)}
.letter p{margin:0;font:700 15px/1.55 var(--kr);color:var(--ink)}
.letter b{color:var(--pink)}
.login{display:grid;gap:10px;background:var(--pink-soft);border-radius:18px;padding:16px 18px}
.login h3{margin:0;font:700 18px var(--display);color:var(--navy)}
.login .row{display:flex;gap:10px;flex-wrap:wrap}
.login input{font:700 18px var(--kr);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;flex:1 1 140px}
.login button{border:0;border-radius:12px;background:var(--navy);color:#fff;font:800 17px var(--body);padding:10px 18px;min-height:46px}
.login p{margin:0;font:600 13px var(--kr);color:var(--muted)}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;color:var(--navy);letter-spacing:0;text-transform:none;font-weight:700}
.credit{text-align:center;font:700 13px var(--body);color:var(--muted);letter-spacing:.3px}
.sign{font:600 20px var(--display);color:var(--navy);text-align:right}
.sub{background:var(--panel);border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 var(--line);width:100%;box-sizing:border-box;margin-bottom:18px;min-height:4.6em;position:relative}
.sub::after{content:"";position:absolute;bottom:-14px;left:50%;border:14px solid transparent;border-top-color:var(--panel);border-bottom:0;transform:translateX(-50%)}
.sub .en{font:800 clamp(17px,1.6vw,24px)/1.35 var(--body);color:var(--ink)}
.sub .ko{font:500 clamp(14px,1.25vw,18px)/1.45 var(--kr);color:var(--pink);margin-top:6px}
body.no-kr .sub .ko{display:none}
.who{font:800 13px var(--body);letter-spacing:1.5px;color:var(--navy);text-transform:uppercase;margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:auto;padding-top:6px}
.navbtn{border:0;border-radius:16px;font:800 20px var(--body);padding:14px 26px;min-height:56px;background:var(--navy);color:#fff}
.navbtn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.navbtn.next{background:var(--pink)}
.navbtn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,58,114,.55)}50%{box-shadow:0 0 0 12px rgba(201,58,114,0)}}
.cta{border:0;border-radius:22px;background:var(--pink);color:#fff;font:700 clamp(20px,2.2vw,30px) var(--display);padding:18px 26px;align-self:flex-start;min-height:60px}

/* map */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--bg);border-radius:18px;padding:14px 16px}
.stat b{display:block;font:600 clamp(28px,3vw,42px)/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font:700 14px var(--kr);color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.month{background:var(--bg);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.month h4{margin:0;font:800 12px var(--body);letter-spacing:1.2px;color:var(--pink);text-transform:uppercase}
.month p{margin:0;font:600 16px var(--display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stones{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stone{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--panel);font:700 15px var(--display);color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;max-width:100%}
.stone.done{background:var(--pink);border-color:var(--pink);color:#fff}
.stone.now{border-color:var(--navy);color:var(--navy);animation:pulse 1.4s ease-in-out infinite}
.stone:hover{border-color:var(--navy)}
.growth{display:flex;align-items:flex-end;gap:3px;height:90px;border-bottom:2px solid var(--line);padding-top:6px}
.growth i{flex:1;background:var(--pink);border-radius:4px 4px 0 0;min-height:3px;opacity:.85}
.growth i.empty{background:var(--line);opacity:.5}
.glabel{display:flex;justify-content:space-between;font:700 12px var(--body);color:var(--muted)}

/* lesson parts */
.ideas{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 14px 82px}
.ideas span{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font:800 15px var(--body)}
.ideabtn{border:2px solid var(--line);background:var(--panel);border-radius:999px;font:800 13px var(--body);padding:6px 12px;color:var(--navy);margin-left:auto;align-self:center;margin-right:12px;min-height:36px}
.gqrow{border-radius:18px;background:var(--bg);overflow:hidden}
.gqrow .gqi{width:100%;background:transparent}
.gqrow .gqi .txt{display:flex;align-items:center;gap:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match .col{display:grid;gap:8px}
.card{border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;font:800 clamp(17px,1.7vw,24px) var(--body);color:var(--ink);text-align:center;min-height:52px}
.card.ko{font-family:var(--kr);font-weight:700}
.card.sel{border-color:var(--navy);background:var(--sky)}
.card.ok{border-color:#2E8B57;background:#E4F4EA;color:#1D5E3A}
.card.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.score{font:600 22px var(--display);color:var(--pink)}
.tool{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--bg);border-radius:18px;padding:12px 14px;border:3px solid transparent}
.tool.pick{border-color:var(--pink);background:var(--pink-soft)}
.tool .pe{font-size:clamp(17px,1.7vw,24px)}
.round{width:52px;height:52px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:800 18px var(--body)}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:34px;height:34px;border-radius:50%;border:3px solid var(--pink);background:var(--panel);padding:0}
.dots button.on{background:var(--pink)}
.pickbtn{border:2px solid var(--line);background:var(--panel);border-radius:12px;font:800 14px var(--body);padding:8px 10px;color:var(--ink);min-height:40px}
.breath{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:6px 0}
.breath .ring{width:150px;height:150px;border-radius:50%;background:var(--pink-soft);border:4px solid var(--pink);transform:scale(.55);transition:transform 2.2s ease-in-out}
.breath .ring.in{transform:scale(1)}
.breath p{margin:0;font:600 clamp(26px,3vw,42px) var(--display);color:var(--navy)}
.checks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;align-items:center;gap:14px;font:800 clamp(16px,1.6vw,22px)/1.35 var(--body);background:var(--bg);border-radius:16px;padding:12px 16px;cursor:pointer}
.chk input{width:28px;height:28px;accent-color:var(--pink);flex-shrink:0}
.chk .kr{display:block;font-size:.72em}
.wc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font:800 clamp(18px,1.8vw,26px) var(--body)}
.wc input{width:120px;font:700 28px var(--display);padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
.wc .note{font:700 16px var(--kr);color:var(--pink)}
.parent{background:var(--pink-soft);border-radius:20px;padding:18px 20px;font:700 clamp(16px,1.5vw,20px)/1.7 var(--kr);color:var(--ink);max-width:62ch}
.reward{position:fixed;inset:0;background:rgba(18,24,49,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.reward .in{background:var(--panel);border-radius:30px;padding:30px 34px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:460px;width:100%;box-sizing:border-box}
.reward .bigstar{font-size:110px;line-height:1;color:var(--gold);animation:cheer .8s ease-in-out 2}
.reward h2{margin:0;font:600 34px var(--display);color:var(--ink)}
.reward p{margin:0;font:700 17px var(--kr);color:var(--muted)}
@media (max-width:820px){
  .rail{grid-template-columns:repeat(3,1fr)}
  .months{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .match{grid-template-columns:1fr 1fr}
  .navbtn{font-size:17px;padding:12px 16px}
  .ideas{padding-left:18px}
  .sub::after{display:none}
  .sub{margin-bottom:0}
}
</style>

<div class="app map" id="app">
  <header class="top">
    <div class="brand"><button id="homeBtn">MY ENGLISH <b>JOURNAL</b> · at Home</button> <span class="by">by Stella</span></div>
    <div class="weekpick" id="weekpick" hidden>
      <button class="iconbtn" id="mapBtn">◀ 여행 지도</button>
    </div>
    <button class="iconbtn" id="parentBtn">부모님 안내</button>
    <button class="iconbtn" id="krToggle">한글 자막 끄기</button>
    <button class="iconbtn" id="fsBtn">전체화면</button>
  </header>

  <main class="main">

function stopAll(){ if(audio){audio.onended=null;audio.ontimeupdate=null;audio.pause();audio=null;} ttsQueue++; try{speechSynthesis.cancel()}catch(e){} talking(false); }
function clipOf(key){ return key==='intro' ? {path:`audio/w${pad(week)}-intro.mp3`,lines:VOICE.intro[week]} : {path:`audio/g-${key}.mp3`,lines:VOICE.g[key]}; }
function speak(key,done){
  stopAll(); lastKey=key;
  const {path,lines}=clipOf(key); sub(lines[0][0],lines[0][1]);
  const w=lines.map(l=>l[0].length+14), tot=w.reduce((a,b)=>a+b,0);
  const syncTo=a=>{a.ontimeupdate=()=>{if(!a.duration)return;const f=a.currentTime/a.duration*tot;let c=0,i=0;for(;i<w.length-1;i++){c+=w[i];if(f<c)break;}sub(lines[i][0],lines[i][1]);};};
  const start=url=>new Promise((res,rej)=>{const a=new Audio(url);audio=a;syncTo(a);a.onplay=()=>talking(true);
    a.onended=()=>{talking(false);audio=null;sub(lines[lines.length-1][0],lines[lines.length-1][1]);done&&done()};a.onerror=()=>rej();a.play().then(res).catch(rej);});
  start(path).catch(()=>fetch(path).then(r=>r.ok?r.blob():Promise.reject()).then(b=>{if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(b);return start(objUrl);}))
    .catch(()=>speakTTS(lines,done));
}
function speakTTS(lines,done){
  const my=++ttsQueue;
  if(!('speechSynthesis' in window)){done&&done();return;}
  let i=0;
  const next=()=>{ if(my!==ttsQueue)return; if(i>=lines.length){talking(false);done&&done();return;}
    const [en,ko]=lines[i++]; sub(en,ko);
    try{const u=new SpeechSynthesisUtterance(en);u.lang='en-US';u.rate=.95;u.pitch=1.3;
      const v=speechSynthesis.getVoices().find(v=>/en-(US|GB)/.test(v.lang.replace('_','-'))&&/female|samantha|zira|jenny|aria|google us/i.test(v.name))||speechSynthesis.getVoices().find(v=>/^en/.test(v.lang));if(v)u.voice=v;
      u.onstart=()=>talking(true);u.onend=u.onerror=next;speechSynthesis.speak(u);}catch(e){next();}
  };
  try{speechSynthesis.cancel()}catch(e){} next();
}
function sayWord(text){ stopAll(); try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;u.onstart=()=>talking(true);u.onend=u.onerror=()=>talking(false);speechSynthesis.speak(u);}catch(e){} }
function cheer(){
  lumiEl.classList.remove('cheer'); void lumiEl.offsetWidth; lumiEl.classList.add('cheer');
  const st=$('.stage');
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='star';s.textContent='★';
    s.style.left=(40+Math.random()*20)+'%';s.style.top='55%';
    s.style.setProperty('--dx',(Math.random()*300-150)+'px');s.style.setProperty('--dy',(-Math.random()*260-40)+'px');
    st.appendChild(s);setTimeout(()=>s.remove(),1500);}
}

/* ---------- timer ---------- */
let timer={id:null,total:0,left:0,cues:{}};
function fmt(s){return Math.floor(s/60)+':'+pad(s%60)}
function setTimer(sec,cues){clearInterval(timer.id);timer={id:null,total:sec,left:sec,cues:cues||{}};}
function drawTimer(){const t=$('#tval'),b=$('#tbar'),p=$('#tplay');if(t){t.textContent=fmt(timer.left);t.classList.toggle('done',timer.left===0)}if(b)b.style.transform=`scaleX(${timer.total?timer.left/timer.total:0})`;if(p)p.textContent=timer.id?'일시정지':(timer.left===timer.total?'시작':'계속');}
function runTimer(onEnd){
  if(timer.id){clearInterval(timer.id);timer.id=null;drawTimer();return;}
  if(timer.left===0)timer.left=timer.total;
  timer.id=setInterval(()=>{timer.left--;drawTimer();const c=timer.cues[timer.left];if(c)c();
    if(timer.left<=0){clearInterval(timer.id);timer.id=null;drawTimer();onEnd&&onEnd();}},1000);
  drawTimer();
}
function timerUI(label){return `<div class="timerwrap"><div class="timer" id="tval">${fmt(timer.left)}</div>
  <div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div class="eyebrow">${label}</div><div class="bar"><i id="tbar"></i></div>
  <div class="tbtns"><button class="tbtn" id="tplay">시작</button><button class="tbtn ghost" id="treset">처음부터</button></div></div></div>`}
function bindTimer(onEnd){const p=$('#tplay');if(!p)return;p.onclick=()=>runTimer(onEnd);$('#treset').onclick=()=>{clearInterval(timer.id);timer.id=null;timer.left=timer.total;drawTimer();};drawTimer();}

function letterText(){return CONFIG.letter;}
function loginCard(){
  if(!CONFIG.saveUrl || student) return '';
  return `<div class="login"><h3>내 이름을 적어 주세요 · Who are you?</h3>
  <div class="row"><input id="stName" placeholder="이름 (예: 김민지)" autocomplete="off"><input id="stCls" placeholder="반 (예: B반)" autocomplete="off"><button id="stGo">시작</button></div>

}
function bindLogin(){
  const g=$('#stGo'); if(g) g.onclick=()=>{const n=$('#stName').value.trim(),c=$('#stCls').value.trim();if(!n){$('#stName').focus();return;}
    student={name:n,cls:c};store.set('home.student',student);renderMap();loadRemote();};
  const ch=$('#chgName'); if(ch) ch.onclick=()=>{student=null;store.set('home.student',null);renderMap();};
}
function payload(w){return {name:student.name,cls:student.cls,week:w,topic:WEEKS[w].topic,words:counts[w]??null,goal:store.get('home.goal.'+w,-1)};}
async function post(d){const r=await fetch(CONFIG.saveUrl,{method:'POST',body:JSON.stringify(d)});const j=await r.json();if(!j.ok)throw new Error(j.error||'fail');}
async function saveWeek(w){
  const m=()=>$('#saveMsg');
  if(!CONFIG.saveUrl||!student) return;
  if(m())m().textContent='학원에 저장하는 중…';
  try{await post(payload(w));if(m())m().textContent=`${CONFIG.academy}에 저장했어요 ✓`;}
  catch(e){pending=pending.filter(x=>x!==w);pending.push(w);store.set('home.pending',pending);if(m())m().textContent='인터넷 연결이 불안정해요. 다음에 열 때 다시 저장할게요.';}
}
async function flushPending(){
  if(!CONFIG.saveUrl||!student||!pending.length) return;
  const left=[];for(const w of pending){try{await post(payload(w));}catch(e){left.push(w);}}
  pending=left;store.set('home.pending',pending);
}
async function loadRemote(){
  if(!CONFIG.saveUrl||!student) return;
  try{const r=await fetch(CONFIG.saveUrl+'?name='+encodeURIComponent(student.name)+'&cls='+encodeURIComponent(student.cls));const j=await r.json();
    if(!j.ok||!j.records) return; let changed=false;
    j.records.forEach(x=>{if(!x.week)return;if(!doneWeeks.includes(x.week)){doneWeeks.push(x.week);changed=true;}
      if(x.words!=null&&counts[x.week]==null){counts[x.week]=x.words;changed=true;}
      if(x.goal>=0&&store.get('home.goal.'+x.week,-1)<0)store.set('home.goal.'+x.week,x.goal);});
    if(changed){store.set('home.done',doneWeeks);store.set('home.counts',counts);if(view==='map')renderMap();}
  }catch(e){}
}

let sel=null, matched=0;
function bind(){
  const w=WEEKS[week], B=$('#board'), i=STEPS.findIndex(s=>s.id===step);
  const nb=$('#nextBtn'),bb=$('#backBtn');
  if(nb)nb.onclick=()=>go(STEPS[i+1].id); if(bb)bb.onclick=()=>go(STEPS[i-1].id);

  B.querySelectorAll('.ideabtn').forEach(b=>b.onclick=()=>{const d=$('#ideas'+b.dataset.i);d.hidden=!d.hidden;});
  // match
  sel=null; matched=0;
  B.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    if(c.classList.contains('ok'))return;

      if(matched===8){cheer();sub('You matched them all!','전부 맞혔어! 정말 잘했어!');pulseNext();}}
    else{[sel,c].forEach(x=>{x.classList.remove('sel');x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400)});}
    sel=null;
  });
  // tools
  B.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>sayWord(w.power[+b.dataset.l].replace(/___/g,'blank')));
  B.querySelectorAll('.dots').forEach(d=>d.querySelectorAll('button').forEach((b,k)=>b.onclick=()=>{d.querySelectorAll('button').forEach((x,j)=>x.classList.toggle('on',j<=k));if(k===2){cheer();}}));

  // goal

  B.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=w.keep[+b.dataset.k];sayWord(k[0]);sub(k[0],k[1]);});
  B.querySelectorAll('.word').forEach(b=>b.onclick=()=>sayWord(b.dataset.w));
  if(step==='write'){
    $('#tplay').onclick=()=>{ if(timer.id||timer.left!==timer.total){runTimer(onWriteEnd);return;}
      breathe(()=>{$('#tzone').innerHTML=timerUI('My Story · 저널에 써요');bindTimer(onWriteEnd);runTimer(onWriteEnd);lumiEl.classList.add('talk');}); };
    $('#treset').onclick=()=>{clearInterval(timer.id);timer.id=null;timer.left=timer.total;drawTimer();}; drawTimer();
  } else bindTimer(()=>{cheer();sub('Great talking!','정말 잘 말했어!');pulseNext();});
  // check
  const wc=$('#wcIn'); if(wc)wc.oninput=()=>{const v=wc.value===''?null:Math.max(0,parseInt(wc.value,10)||0);if(v==null)delete counts[week];else counts[week]=v;store.set('home.counts',counts);
    const p=counts[week-1];$('#wcNote').textContent=p!=null&&v!=null?(v>p?`지난주보다 ${v-p}단어 더 썼어요!`:`지난주: ${p} words`):(p!=null?`지난주: ${p} words`:'');if(p!=null&&v>p)cheer();};
  const fb=$('#finishBtn'); if(fb)fb.onclick=finish;
}
function onWriteEnd(){lumiEl.classList.remove('talk');speak('end');cheer();pulseNext();}
function breathe(then){
  const z=$('#tzone'); z.innerHTML='<div class="breath"><div class="ring" id="ring"></div><p id="bt">Breathe in…</p></div>';
  speak('go'); const r=$('#ring'); requestAnimationFrame(()=>requestAnimationFrame(()=>r.classList.add('in')));
  setTimeout(()=>{r.classList.remove('in');$('#bt').textContent='Breathe out…';},2400);
  setTimeout(()=>{$('#bt').textContent='Start!';},4800);
  setTimeout(then,5600);
}
function finish(){
  if(!doneWeeks.includes(week)){doneWeeks.push(week);store.set('home.done',doneWeeks);}
  const d=document.createElement('div');d.className='reward';
  d.innerHTML=`<div class="in"><div class="bigstar">★</div><h2>Week ${pad(week)} Complete!</h2><p>${esc(WEEKS[week].topic)} · ${counts[week]!=null?counts[week]+' words':'잘했어요!'}</p><p>지금까지 ${doneWeeks.length}개의 별을 모았어요</p><p style="color:var(--navy)">★ ${esc(CONFIG.starFrom)} ★</p><p id="saveMsg" style="font-size:14px"></p><button class="cta" id="toMap" style="align-self:center">여행 지도 보기 ▶</button></div>`;
  document.body.appendChild(d); cheer(); speak('done');
  saveWeek(week);
  $('#toMap').onclick=()=>{d.remove();renderMap();};
}

  <div class="parent">MY ENGLISH JOURNAL은 문법보다 <b>자기 생각을 멈추지 않고 영어로 쓰는 경험</b>을 키우는 프로그램입니다.<br><br>
  · 틀린 곳을 고쳐 주거나 대신 써 주지 않으셔도 됩니다.<br>· 끝까지 쓴 것, 지난주보다 더 많이 쓴 것을 칭찬해 주세요.<br>· 아이가 글을 이야기하면 끝까지 들어 주세요. 그것이 최고의 반응입니다.<br><br>
  여행 지도에서 아이가 모은 별과 단어 수 그래프로 성장 과정을 함께 확인해 보세요. 기록은 이 기기에만 저장됩니다.<div class="sign" style="margin-top:14px">${esc(CONFIG.academy)} ${esc(CONFIG.director)} 드림</div></div>
  <div class="nav"><span></span><button class="navbtn next" id="backBtn2">돌아가기 ▶</button></div>`;
  $('#backBtn2').onclick=()=>back==='map'?renderMap():go(step,true);};

$('#krToggle').onclick=()=>{showKr=!showKr;store.set('home.kr',showKr);applyKr();};
