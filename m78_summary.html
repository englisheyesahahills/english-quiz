<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7·8과 본문·문법 핵심 정리 | 잉글리시아이 스텔라</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#1f2d4f;--ink:#1d2333;--sub:#5d6475;--line:#e3e0d8;--bg:#f6f3ec;--card:#fff;--bur:#8a1f3d;--acc:#2f6f5e;--soft:#f0ede5;--ok:#1f7a4f;--no:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header.top{background:var(--navy);color:#fff;padding:22px 16px 18px}
header.top .in{max-width:860px;margin:0 auto}
.eye{font-size:11px;letter-spacing:.18em;opacity:.7;font-weight:700}
h1{margin:4px 0 2px;font-size:22px;letter-spacing:-.02em}
.brand{font-size:12px;opacity:.75}
.pick{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}
.bk{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;color:var(--sub)}
.bk.on{color:#fff;border-color:transparent;background:var(--c)}
.lt{display:flex;gap:8px;margin-bottom:12px}
.lb{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;text-align:left}
.lb b{display:block;font-size:12px;color:var(--sub)}
.lb span{font-size:14px;font-weight:700}
.lb.on{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.lb.on b{color:var(--c)}
nav.steps{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.steps::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;border:none;background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--sub);box-shadow:0 0 0 1px var(--line)}
.st i{font-style:normal;font-size:11px;opacity:.7;margin-right:4px}
.st.on{background:var(--c);color:#fff;box-shadow:none}
section.step{display:none;animation:f .25s}
section.step.on{display:block}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.sh{display:flex;align-items:baseline;gap:8px;margin:18px 0 10px}
.sh .n{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--c)}
.sh h2{margin:0;font-size:19px;letter-spacing:-.02em}
.sh p{margin:0;color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.hero{border-top:5px solid var(--c)}
.hero .tt{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.hero .ss{color:var(--sub);font-size:14px;margin:2px 0 12px}
.line{font-size:16px;font-weight:600;background:var(--soft);border-radius:12px;padding:12px 14px}
.lab{font-size:12px;font-weight:800;color:var(--c);letter-spacing:.06em;margin:14px 0 6px}
ul.cl{margin:0;padding-left:18px}
ul.cl li{margin:2px 0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;counter-reset:fl}
.flow span{background:#fff;border:1.5px solid var(--c);border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;counter-increment:fl}
.flow span::before{content:counter(fl);display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;text-align:center;line-height:18px;margin-right:6px}
.flow em{color:var(--c);font-style:normal;font-weight:800}
.msg{border-left:4px solid var(--bur);background:#fbf3f5;padding:10px 14px;border-radius:0 10px 10px 0;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--soft);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--sub)}
.tg.on{border-color:var(--c);color:var(--c)}
.para h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.para .sum{margin:0 0 10px;color:#333}
.ks{border-radius:10px;background:var(--soft);padding:10px 12px;margin-bottom:6px}
.ks .en{font-weight:700;font-size:15px;line-height:1.5}
.ks .ko{color:var(--sub);font-size:13.5px;margin-top:2px}
.hideko .ks .ko{filter:blur(5px);user-select:none}
.hideen .ks .en{filter:blur(6px);user-select:none}
.hideko .ks .ko:active,.hideen .ks .en:active{filter:none}
.pt{margin-top:8px;font-size:13px;background:#fff8e6;border:1px dashed #e0b84a;border-radius:8px;padding:6px 10px}
.pt b{color:#9a6a00}
.plist{padding:6px 18px}
.pr{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:none}
.pn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.pt2{font-size:12px;font-weight:800;color:var(--c);letter-spacing:.02em}
.ps{font-size:15.5px;font-weight:700;margin:1px 0 6px}
.pe{font-size:14.5px;font-weight:600;border-left:3px solid var(--c);padding-left:10px}
.pko{font-size:13px;color:var(--sub);padding-left:13px}
.gname{font-size:18px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.gone{background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600;margin:6px 0 4px}
ul.form{margin:0;padding-left:0;list-style:none}
ul.form li{padding:6px 0 6px 22px;position:relative;border-bottom:1px dashed var(--line);font-size:14.5px}
ul.form li:last-child{border-bottom:none}
ul.form li::before{content:"▸";position:absolute;left:4px;color:var(--c)}
.ex{border-left:3px solid var(--c);padding:4px 0 4px 12px;margin:6px 0}
.ex .en{font-weight:700}
.ex .ko{color:var(--sub);font-size:13.5px}
table.trap{width:100%;border-collapse:collapse;font-size:13.5px}
table.trap td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:top}
table.trap .x{color:var(--no);text-decoration:line-through;text-decoration-thickness:1px}
table.trap .o{color:var(--ok);font-weight:700}
table.trap .w{color:var(--sub);font-size:12.5px}
.bonus{background:#f3f6fb;border-radius:14px;padding:14px 16px}
.bonus ul{margin:4px 0 0;padding-left:18px}
.frame{background:#fff8e6;border-radius:10px;padding:10px 12px;font-size:14.5px}
.frame div{margin:2px 0}
textarea{width:100%;min-height:96px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14.5px;margin-top:8px;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--c)}
.rv{margin-top:8px;border:none;background:var(--c);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px}
.model{display:none;margin-top:8px;background:#eef6f2;border-radius:10px;padding:10px 12px;font-size:14.5px}
.model.on{display:block}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-top:10px}
.q{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;min-height:82px;font-size:14px}
.q small{display:block;font-size:11px;font-weight:800;color:var(--c);letter-spacing:.06em;margin-bottom:3px}
.q .a{display:none;color:var(--ok);font-weight:700}
.q.on .a{display:block}
.q.on .qq{color:var(--sub);font-size:12.5px}
.chk label{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed var(--line);font-size:14.5px}
.chk input{width:20px;height:20px;accent-color:var(--c);flex:0 0 auto;margin-top:2px}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .3s}
.nx{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.nx button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:700;color:var(--sub)}
.nx button.go{background:var(--c);border-color:var(--c);color:#fff}
.pbtn{position:fixed;right:14px;bottom:14px;border:none;background:var(--navy);color:#fff;border-radius:999px;padding:11px 16px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:9}
footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 0}
.ponly{display:none}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;font-size:11pt}
 header.top{background:#fff;color:var(--ink);padding:0 0 6px;border-bottom:2px solid var(--navy)}
 .pick,.lt,nav.steps,.tools,.pbtn,.rv,.nx,textarea,.noprint{display:none!important}
 .wrap{padding:0;max-width:none}
 section.step{display:block!important;animation:none}
 .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;padding:10px 12px;margin-bottom:8px;border-radius:8px}
 .model{display:block!important}
 .q .a{display:block!important}
 .hideko .ks .ko,.hideen .ks .en{filter:none}
 .ponly{display:block}
 section.step+section.step{break-before:page}
 .model::before{content:"✔ 모범 설명  ";font-weight:800;color:var(--ok)}
 .wline{border-bottom:1px solid #999;height:26px}
}
</style>
</head>
<body>
<header class="top"><div class="in">
 <div class="eye">LESSON 7 · 8 · SUMMARY</div>
 <h1 id="ttl">7·8과 본문·문법 핵심 정리</h1>
 <div class="brand">제작: 스텔라원장 · 잉글리시아이 스텔라</div>
</div></header>
<div class="wrap">
 <div class="pick" id="pick"></div>
 <div class="lt" id="lt"></div>
 <nav class="steps" id="steps"></nav>
 <main id="main"></main>
 <footer>제작: 스텔라원장 · 잉글리시아이 스텔라</footer>
</div>
<button class="pbtn" onclick="window.print()">🖨️ 이 과 전체 인쇄/PDF</button>
<script>
const DATA=[{"id": "m1yun", "label": "중1 동아 윤정미", "short": "중1 윤정미", "color": "#2f6f5e", "lessons": [{"l": "7", "title": "Find Your Dream", "sub": "Happy Days – 영화를 만드는 사람들", "line": "영화 <i>Happy Days</i>를 만드는 다양한 직업의 사람들이 각자 자기 일을 소개하는 글", "who": ["Jim – 감독", "Anna – 로케이션 매니저(촬영 장소 찾기)", "Peter – 촬영 감독(카메라 담당)", "Jennifer – 동물 조련사(Max 담당)", "Emma – 영화 편집자", "Chris – 폴리 아티스트(음향 효과)"], "flow": ["감독 Jim의 영화 소개", "촬영 전: 장소 찾기(Anna)", "촬영 중: 카메라(Peter)·동물(Jennifer)", "촬영 후: 편집(Emma)·소리(Chris)"], "msg": "영화 한 편은 여러 직업의 사람들이 함께 노력해서 만들어진다.", "paras": [["① Jim & Anna", "감독 Jim이 Tom과 개 Max의 우정에 관한 영화를 소개한다. Anna는 촬영하기 완벽한 장소를 찾는 로케이션 매니저로, 일이 쉽지 않지만 여행과 도전을 좋아해서 자기 일을 사랑한다.", [["A lot of people are working hard to create this movie.", "많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다."], ["My job is to find perfect places for shooting.", "내 일은 촬영을 위한 완벽한 장소를 찾는 것이다."]], "to create = 목적(~하기 위해) / is to find = ‘찾는 것’(명사적) → 둘을 구별!", "감독 Jim이 영화를 소개하고, Anna는 촬영 장소를 찾는다.", 1], ["② Peter (촬영 감독)", "Peter는 모든 카메라를 책임진다. 오늘 Tom과 Max가 해변에서 공놀이를 하는데, 그 행복한 순간을 담기 위해 드론을 쓸 것이다.", [["I'm in charge of all the cameras.", "나는 모든 카메라를 책임지고 있다."], ["To capture their happy moments, I'm going to use drones.", "그들의 행복한 순간을 담기 위해 나는 드론을 사용할 것이다."]], "be in charge of = ~을 책임지다 / 문장 맨 앞 To ~, = 목적", "Peter는 행복한 순간을 찍으려고 드론을 쓴다.", 1], ["③ Jennifer (동물 조련사)", "Jennifer는 오랫동안 Max를 훈련하고 돌봤다. Max는 훌륭한 배우지만 주변에 사람이 많으면 너무 흥분해서, 진정시키기 위해 수신호를 사용한다.", [["He sometimes gets too excited when a lot of people are around.", "그는 주변에 사람이 많을 때 가끔 너무 흥분한다."], ["I use hand signals to calm him.", "나는 그를 진정시키기 위해 수신호를 사용한다."]], "when + 주어 + 동사 = ~할 때 / Who am I? → animal wrangler", "Jennifer는 흥분한 Max를 수신호로 진정시킨다.", 1], ["④ Emma (영화 편집자)", "Emma의 일은 촬영이 끝난 뒤에 시작된다. 더 좋은 이야기를 만들기 위해 장면 순서를 바꾸거나 일부를 삭제한다. 이야기 구성 능력이 중요해서 책을 많이 읽는다.", [["My work begins after the shooting is over.", "내 일은 촬영이 끝난 후에 시작된다."], ["To create a better story, I can change the order of scenes or delete some of them.", "더 좋은 이야기를 만들기 위해 장면 순서를 바꾸거나 일부를 삭제할 수 있다."]], "after + 주어 + 동사 (접속사) / storytelling skills → so I read a lot", "Emma는 촬영 후 장면을 바꾸거나 지우며 편집한다.", 1], ["⑤ Chris (폴리 아티스트)", "Chris는 현장 녹음이 어려울 때 스튜디오에서 음향 효과를 만든다. 들리는 파도 소리는 쌀과 플라스틱 통으로 만든 것이다.", [["I create sound effects in my studio when recording on location is not easy.", "나는 현장 녹음이 쉽지 않을 때 스튜디오에서 음향 효과를 만든다."], ["I made that sound with rice and a plastic container. Doesn't it sound real?", "나는 그 소리를 쌀과 플라스틱 통으로 만들었다. 진짜처럼 들리지 않니?"]], "sound + 형용사(real) ← really ✕ / recording(동명사 주어) + is", "Chris는 쌀과 플라스틱 통으로 파도 소리를 만든다.", 1]], "retell": ["이 글은 ____을 만드는 사람들에 관한 글이다.", "Anna는 ____을 찾고, Peter는 ____을 책임진다.", "Jennifer는 ____을 돌보고, Emma는 촬영이 끝난 후 ____한다.", "Chris는 ____으로 파도 소리를 만들었다."], "retell_model": "이 글은 영화 Happy Days를 만드는 사람들에 관한 글이다. Anna는 촬영 장소를 찾고, Peter는 모든 카메라를 책임지며 드론으로 행복한 순간을 찍는다. Jennifer는 개 Max를 훈련하고 수신호로 진정시키고, Emma는 촬영이 끝난 후 장면 순서를 바꾸거나 삭제하며 편집한다. Chris는 쌀과 플라스틱 통으로 파도 소리를 만들었다.", "grammar": [{"name": "to부정사의 부사적 용법 (목적)", "one": "‘왜 그 행동을 했는지’ 이유(목적)를 붙여 주는 <b>to + 동사원형</b>. ‘~하기 위해(서)’로 해석한다.", "form": ["to + <b>동사원형</b> = ~하기 위해", "= in order to + 동사원형", "문장 앞에 오면 콤마: <b>To capture</b> ~, I'm going to ~.", "그 밖의 부사적 용법: 감정의 원인(glad to meet ~해서), 결과(grew up to be 자라서 ~가 되다)"], "ex": [["I use hand signals to calm him.", "그를 진정시키기 위해 수신호를 사용한다."], ["To create a better story, I can change the order of scenes.", "더 좋은 이야기를 만들기 위해 장면 순서를 바꿀 수 있다."], ["I'm glad to meet you.", "너를 만나서 기쁘다. (감정의 원인)"]], "trap": [["I'm going to use drones to captured their moments.", "~ to capture their moments.", "to 뒤에는 항상 동사원형"], ["My job is to find places. → 목적?", "‘찾는 것’ = 명사적 용법", "be동사 뒤 보어는 ‘~하는 것’"]], "model": "to부정사 목적 용법은 어떤 행동을 ‘왜’ 했는지 이유를 말할 때 써. 모양은 to + 동사원형이고 ‘~하기 위해’라고 해석해. 예를 들어 I use hand signals to calm him.은 ‘그를 진정시키기 위해 수신호를 쓴다’는 뜻이야. in order to로 바꿔도 뜻이 같아. 하지만 My job is to find ~처럼 be동사 뒤에 오면 ‘~하는 것’이라서 목적이 아니야.", "frame": "to부정사 목적 용법은 ____을 말할 때 써. 모양은 to + ____이고, ‘____’라고 해석해. 예를 들면 ____.", "qa": [["to 뒤에는 뭐가 와?", "동사원형 (to calm, to capture)"], ["목적인지 어떻게 알아?", "‘~하기 위해’를 넣어서 말이 되거나 in order to로 바꿀 수 있으면 목적"], ["I'm happy to see you.도 목적이야?", "아니. 감정 형용사 뒤 to는 ‘~해서’ (감정의 원인)"]]}, {"name": "시간 접속사 when / before / after", "one": "두 문장을 ‘언제’로 이어 주는 접속사. 뒤에 <b>주어 + 동사</b>가 온다.", "form": ["<b>when</b> + 주어 + 동사: ~할 때", "<b>before</b> + 주어 + 동사: ~하기 전에", "<b>after</b> + 주어 + 동사: ~한 후에", "순서 바꾸기 가능 → 접속사절이 앞에 오면 콤마(,)", "⚠ 시간 접속사절에서는 미래라도 <b>현재시제</b>"], "ex": [["My work begins after the shooting is over.", "내 일은 촬영이 끝난 후에 시작된다."], ["He gets too excited when a lot of people are around.", "그는 주변에 사람이 많을 때 너무 흥분한다."], ["When I get home, I will call you.", "집에 도착하면 너에게 전화할게."]], "trap": [["When he will come, we will start.", "When he comes, we will start.", "시간절은 미래 대신 현재시제"], ["When I was ten I lived in Busan.", "When I was ten, I lived in Busan.", "접속사절이 앞이면 콤마"]], "model": "when, before, after는 두 문장을 ‘언제’로 연결하는 접속사야. when은 ~할 때, before는 ~하기 전에, after는 ~한 후에라는 뜻이고 뒤에 주어와 동사가 와. 접속사가 있는 부분을 앞으로 보내면 콤마를 찍어. 그리고 시간을 나타내는 절에서는 미래 일이라도 will을 쓰지 않고 현재시제를 써.", "frame": "when은 ____, before는 ____, after는 ____라는 뜻이야. 뒤에는 ____ + ____가 와. 앞에 오면 ____를 찍고, 미래라도 ____시제를 써.", "qa": [["after 뒤에 뭐가 와?", "주어 + 동사 (after the shooting is over)"], ["When he will come ~ 맞아?", "틀려. When he comes ~ (시간절은 현재시제)"], ["순서를 바꾸면?", "When I was ten, I lived in Busan. = I lived in Busan when I was ten."]]}], "bonus": ["감각동사 + 형용사: Doesn't it <b>sound real</b>? (really ✕)", "be in charge of: ~을 책임지다", "after the shooting <b>is over</b>: 촬영이 끝나다"]}, {"l": "8", "title": "Be Smart Online", "sub": "Goldilocks – ‘좋아요’가 남긴 것", "line": "‘좋아요’를 원한 Goldilocks가 곰 가족의 집을 허락 없이 찍어 올렸다가, 온라인 게시물은 영원히 남는다는 것을 깨닫는 이야기", "who": ["Goldilocks – 금발 소녀, ‘좋아요’를 받고 싶어 함", "Baby Bear / Mother Bear / Father Bear – 오두막의 곰 가족"], "flow": ["좋아요를 위해 점점 자극적인 사진", "곰 가족 오두막에서 셀카·게시", "곰 가족에게 들킴 → 사과", "게시물은 영원히 남는다 → 깨달음"], "msg": "온라인에 올린 것은 지워도 영원히 남는다. 게시하기 전에 두 번 생각하자. (Think twice before you post.)", "paras": [["① 더 많은 ‘좋아요’", "Goldilocks는 소셜 미디어에 사진 공유를 좋아했다. 일상 사진에는 ‘좋아요’가 적어서 웃긴 사진을 올렸고, 팔로워들이 곧 지루해하자 더 충격적인 사진을 올리기로 했다.", [["At first, she posted everyday things, but people didn't give her many likes.", "처음에 그녀는 일상적인 것들을 올렸지만 사람들은 그녀에게 ‘좋아요’를 많이 주지 않았다."], ["So, she decided to post more shocking pictures.", "그래서 그녀는 더 충격적인 사진을 올리기로 결심했다."]], "give her many likes (4형식) / decide to + 동사원형", "‘좋아요’를 받으려고 점점 충격적인 사진을 올린다.", 1], ["② 숲속 오두막", "숲을 산책하다 오두막을 발견했다. 대답이 없었지만 어두워지고 비가 오자 안으로 들어갔다. 가장 작은 수프를 먹으며 셀카를 찍고, 가장 작은 의자 위에서 계속 뛰다가 부쉈지만 신경 쓰지 않았다.", [["It was getting dark, and it started to rain.", "날이 어두워지고 있었고, 비가 내리기 시작했다."], ["She ate the smallest one and took selfies with a smile.", "그녀는 가장 작은 것을 먹고 웃으며 셀카를 찍었다."]], "비인칭 주어 it (명암·날씨) / the smallest one (최상급, one = bowl)", "오두막에 몰래 들어가 수프를 먹고 의자를 부순다.", 1], ["③ 곰 가족의 귀가", "셀카를 모두 올린 뒤 가장 작은 침대에서 잠들었다. 한 시간 뒤 곰 가족이 돌아왔고, Mother Bear가 휴대폰 속 자기 집 게시물을 보고 화를 냈다. Goldilocks는 놀라서 벌떡 일어났다.", [["\"Someone ate my soup and broke my chair!\" cried Baby Bear.", "“누군가 내 수프를 먹고 내 의자를 부쉈어!” 아기 곰이 외쳤다."], ["\"Look at all these posts of our home,\" shouted Mother Bear angrily.", "“우리 집 게시물들 좀 봐요.” 엄마 곰이 화를 내며 소리쳤다."]], "angrily (부사) / jumped up in surprise = 놀라서 벌떡 일어났다", "돌아온 곰 가족이 게시물을 보고 화를 낸다.", 1], ["④ 사과와 약속", "Father Bear는 허락 없이 집에 침입하고 사진을 올린 것이 잘못이라고 말했다. Goldilocks는 사과하고 여름이 끝날 때까지 매일 집을 청소하겠다고 약속했다.", [["You broke into our house and posted these pictures without our permission.", "너는 우리 집에 침입해서 허락 없이 이 사진들을 올렸어."], ["I'll clean your house every day until the end of the summer.", "여름이 끝날 때까지 매일 집을 청소할게요."]], "break into = 침입하다 / without permission = 허락 없이", "사과하고 여름 내내 청소하겠다고 약속한다.", 0], ["⑤ 영원히 남는 게시물", "여름 내내 열심히 일한 Goldilocks는 게시물을 다 지웠다고 말했지만, Father Bear는 다른 사람들이 이미 공유해서 영원히 남는다고 했다. Goldilocks는 앞으로 게시하기 전에 두 번 생각하겠다고 다짐했다.", [["Your posts will live on forever.", "네 게시물은 영원히 남을 거야."], ["From now on, I'll think twice before I press POST.", "지금부터 나는 POST를 누르기 전에 두 번 생각할 거야."]], "⭐ 주제 문장 / before I press (시간절 현재시제)", "게시물은 영원히 남는다는 것을 깨닫는다.", 1]], "retell": ["Goldilocks는 ____을 받고 싶어서 점점 ____ 사진을 올렸다.", "곰 가족의 오두막에서 ____하고 사진을 올렸다.", "곰 가족에게 들켜서 ____하고 ____을 약속했다.", "게시물은 지워도 ____는 것을 깨달았다."], "retell_model": "Goldilocks는 ‘좋아요’를 더 받고 싶어서 점점 충격적인 사진을 올렸다. 곰 가족의 오두막에 허락 없이 들어가 수프를 먹고 의자를 부수며 셀카를 찍어 올렸다. 돌아온 곰 가족에게 들켜서 사과하고 여름 내내 청소하겠다고 약속했다. 게시물을 지웠지만 이미 다른 사람들이 공유해서 영원히 남는다는 것을 알고, 앞으로 게시 전에 두 번 생각하기로 했다.", "grammar": [{"name": "수여동사 (4형식 ↔ 3형식)", "one": "‘~에게 …을 (해) 주다’처럼 목적어가 두 개 필요한 동사. 순서를 바꾸면 전치사 to / for 가 들어간다.", "form": ["4형식: 주어 + 수여동사 + <b>사람(~에게)</b> + <b>물건(…을)</b>", "3형식: 주어 + 수여동사 + <b>물건</b> + <b>to / for</b> + <b>사람</b>", "<b>to</b>: give, send, tell, show, teach, write, bring", "<b>for</b>: buy, make, cook, get"], "ex": [["People didn't give her many likes.", "= People didn't give many likes to her."], ["Goldilocks showed them her photos.", "= Goldilocks showed her photos to them."], ["Mother Bear made Baby Bear soup.", "= Mother Bear made soup for Baby Bear."]], "trap": [["He gave me it.", "He gave it to me.", "물건이 대명사(it, them)면 3형식만 가능"], ["She made a cake to me.", "She made a cake for me.", "make·buy·cook은 for"], ["He showed his album for me.", "He showed his album to me.", "show는 to"]], "model": "수여동사는 ‘누구에게 무엇을 주다’라는 뜻이라 목적어가 두 개 필요해. 4형식은 ‘사람 → 물건’ 순서로 쓰고, 순서를 바꿔서 물건을 먼저 쓰면 사람 앞에 to나 for를 넣어야 해. give·send·tell은 to, make·buy는 for야. 그리고 물건이 it이면 꼭 give it to me처럼 3형식으로 써야 해.", "frame": "수여동사는 ‘____에게 ____을 주다’라는 뜻이야. 4형식은 ____ → ____ 순서이고, 순서를 바꾸면 ____나 ____를 넣어. 예를 들면 ____.", "qa": [["4형식 어순은?", "주어 + 동사 + 사람(~에게) + 물건(…을)"], ["to와 for는 어떻게 구별해?", "give·send·tell·show·teach는 to / make·buy·cook은 for"], ["He gave me it. 맞아?", "틀려. 물건이 대명사면 He gave it to me. (3형식만)"]]}, {"name": "비인칭 주어 it", "one": "시간·날짜·요일·날씨·거리·명암을 말할 때 자리만 채우는 주어. <b>‘그것’이라고 해석하지 않는다.</b>", "form": ["시간: It's 10 o'clock.", "날짜·요일: It's May 5th. / It's Monday.", "날씨: It's raining. / It started to rain.", "거리: It's 2 km to the school.", "명암: It was getting dark."], "ex": [["It was getting dark, and it started to rain.", "날이 어두워지고 있었고 비가 오기 시작했다."], ["What time is it? – It's seven.", "몇 시야? – 7시야."]], "trap": [["It broke. (의자) → 비인칭?", "대명사 it (그것 = 의자)", "앞에 나온 물건을 가리키면 ‘그것’"], ["Is getting dark.", "It is getting dark.", "영어 문장은 주어가 꼭 필요 → it"]], "model": "비인칭 주어 it은 시간, 날짜, 요일, 날씨, 거리, 명암을 말할 때 주어 자리를 채우는 it이야. 뜻이 없어서 ‘그것’이라고 해석하지 않아. 예를 들어 It was getting dark.는 ‘날이 어두워지고 있었다’야. 하지만 It broke.처럼 앞에 나온 의자를 가리키는 it은 ‘그것’이라는 뜻의 대명사야.", "frame": "비인칭 주어 it은 ____, ____, ____ 등을 말할 때 쓰고, ‘____’이라고 해석하지 않아. 예를 들면 ____.", "qa": [["비인칭 it은 언제 써?", "시간·날짜·요일·날씨·거리·명암"], ["It broke.의 it은?", "대명사 – ‘그것(의자)’"], ["‘비가 오기 시작했다’를 영어로?", "It started to rain."]]}], "bonus": ["최상급: the smallest (the + 형용사-est)", "one = 앞에 나온 명사 반복 피하기 (the smallest one = bowl)", "decide to / start to / like to + 동사원형"]}]}, {"id": "m1lee", "label": "중1 동아 이병민", "short": "중1 이병민", "color": "#9a5b13", "lessons": [{"l": "7", "title": "Think Big, Be Creative!", "sub": "Faces of Great Artists – 화가들의 자화상", "line": "고흐와 칼로가 서로 다른 이유로 자화상을 그렸지만, 두 사람의 그림 모두 많은 사람의 마음을 감동시킨다는 글", "who": ["Vincent van Gogh – 네덜란드 화가, 자화상 36점", "Frida Kahlo – 멕시코 화가, 자화상 55점"], "flow": ["도입: 화가들은 왜 자신을 그렸을까?", "Van Gogh: 모델 살 돈이 없어서", "Kahlo: 병과 사고, 자신의 강함을 표현", "결론: 이유는 달라도 감동은 같다"], "msg": "두 화가는 서로 다른 이유로 자화상을 그렸지만, 그들의 그림은 모두 많은 사람의 마음을 움직인다.", "paras": [["① 들어가며", "좋아하는 화가는 누구이고 어떻게 생겼는지 묻는다. 어떤 화가들은 자화상을 그렸는데, 왜 자신을 그렸는지 알아보자고 한다.", [["What does she or he look like?", "그녀 또는 그는 어떻게 생겼나요?"], ["Some artists painted self-portraits. Why did they paint themselves?", "어떤 화가들은 자화상을 그렸다. 그들은 왜 자신을 그렸을까?"]], "What ~ look like? = 외모 질문 / paint themselves (재귀대명사)", "화가들은 왜 자신을 그렸을까?", 1], ["② Vincent van Gogh", "네덜란드 화가로 살아 있을 때는 유명하지 않았다. 33살에 파리로 이사해 사람을 그리고 싶었지만 모델이 너무 비쌌다. 그래서 자기 자신을 그리기 시작해 36점의 자화상을 그렸고, 모두 다르다.", [["He wanted to paint people, but models were too expensive.", "그는 사람을 그리고 싶었지만 모델은 너무 비쌌다."], ["So, Van Gogh started to paint himself.", "그래서 고흐는 자기 자신을 그리기 시작했다."], ["One is brighter than the other.", "하나가 다른 하나보다 더 밝다."]], "⭐ 이유: 모델 살 돈이 없어서 / one ~ the other (둘 중 하나, 나머지 하나)", "고흐는 모델 살 돈이 없어서 자신을 그렸다.", 1], ["③ Frida Kahlo", "멕시코 화가로 6살 때 많이 아파서 오른쪽 다리가 왼쪽보다 약해졌다. 18살에 끔찍한 버스 사고로 오래 입원했지만 ‘나는 누구보다 강하다’고 스스로에게 말하며 자신을 그리기 시작해 55점의 자화상을 그렸다.", [["Her right leg became weaker than her left leg.", "그녀의 오른쪽 다리는 왼쪽 다리보다 더 약해졌다."], ["Kahlo said to herself, \"I look weak. But I am stronger than anyone.\"", "칼로는 스스로에게 말했다. “나는 약해 보여. 하지만 나는 누구보다 강해.”"]], "⭐ 이유: 자신의 강함 표현 / 비교급 than anyone = 누구보다 (최상급 의미)", "칼로는 병과 사고 속에서 강해지려고 자신을 그렸다.", 1], ["④ 마무리", "고흐와 칼로는 서로 다른 이유로 자신을 그렸지만, 그들의 그림에는 공통점이 하나 있다. 많은 사람들의 마음을 감동시킨다는 것이다.", [["Van Gogh and Kahlo painted themselves for different reasons.", "고흐와 칼로는 서로 다른 이유로 자신을 그렸다."], ["But their paintings have one thing in common. They touch the hearts of many people.", "하지만 그들의 그림에는 공통점이 하나 있다. 많은 사람들의 마음을 감동시킨다."]], "in common = 공통으로 / touch = 감동시키다", "이유는 달라도 둘 다 사람들을 감동시킨다.", 1]], "retell": ["이 글은 화가들이 ____을 그린 이유에 관한 글이다.", "Van Gogh는 ____ 때문에 자신을 그렸다.", "Kahlo는 ____ 후 자신이 ____는 것을 보여 주려고 자신을 그렸다.", "두 사람의 그림은 공통적으로 ____."], "retell_model": "이 글은 화가들이 자화상을 그린 이유에 관한 글이다. Van Gogh는 사람을 그리고 싶었지만 모델이 너무 비싸서 자신을 그렸고, 36점의 자화상을 남겼다. Kahlo는 어릴 때 병과 18살의 버스 사고를 겪었지만 누구보다 강하다고 생각하며 자신을 그려 55점을 남겼다. 두 사람은 이유는 달랐지만 그림 모두 많은 사람들의 마음을 감동시킨다.", "grammar": [{"name": "비교급", "one": "두 대상을 비교해서 ‘더 ~한/더 ~하게’를 나타낸다. <b>비교급 + than</b> + 비교 대상.", "form": ["대부분 + <b>-er</b>: bright → brighter, weak → weaker", "-e로 끝나면 + r: large → larger / 자음+y → y를 i로: easy → easier", "단모음+단자음 → 자음 한 번 더: hot → hotter, big → bigger", "긴 단어: <b>more</b> + 원급: more expensive, more beautiful", "불규칙: good/well → better, bad → worse, many/much → more", "비교급 강조(훨씬): <b>much, far, even, still, a lot</b> (very ✕)"], "ex": [["One is brighter than the other.", "하나가 다른 것보다 더 밝다."], ["Her right leg became weaker than her left leg.", "오른쪽 다리가 왼쪽 다리보다 더 약해졌다."], ["I am stronger than anyone.", "나는 누구보다 더 강하다. (= 가장 강하다)"]], "trap": [["My dog is more cute than yours.", "My dog is cuter than yours.", "짧은 단어는 -er"], ["The sun is very bigger than the earth.", "much / far / even bigger", "very는 비교급 강조 ✕"]], "model": "비교급은 두 개를 비교해서 ‘더 ~하다’라고 말할 때 써. 짧은 단어는 뒤에 -er을 붙이고, expensive처럼 긴 단어는 앞에 more를 붙여. 비교하는 대상 앞에는 than을 써. 예를 들어 One is brighter than the other.는 ‘하나가 다른 것보다 더 밝다’야. 비교급을 ‘훨씬’이라고 강조할 때는 very가 아니라 much, far, even을 써.", "frame": "비교급은 ____을 비교해서 ‘더 ~하다’라고 할 때 써. 짧은 단어는 ____, 긴 단어는 ____를 붙이고 비교 대상 앞에 ____을 써. 예를 들면 ____.", "qa": [["expensive의 비교급은?", "more expensive"], ["‘훨씬 더 큰’은?", "much / far / even bigger (very bigger ✕)"], ["stronger than anyone은 무슨 뜻?", "누구보다 더 강한 = 가장 강한 (최상급 의미)"]]}, {"name": "재귀대명사", "one": "‘자기 자신’을 가리키는 대명사. <b>-self(단수) / -selves(복수)</b>.", "form": ["myself, yourself, himself, herself, itself", "ourselves, yourselves, themselves", "<b>재귀 용법</b>: 주어 = 목적어 → 생략 ✕ (Van Gogh painted himself.)", "<b>강조 용법</b>: ‘직접, 스스로’ → 생략 가능 (I made this cake myself.)", "관용: enjoy oneself(즐겁게 보내다), by oneself(혼자서), say to oneself(혼잣말하다)"], "ex": [["So, Van Gogh started to paint himself.", "그래서 고흐는 자기 자신을 그리기 시작했다."], ["Kahlo said to herself, \"I look weak.\"", "칼로는 스스로에게 말했다."], ["Why did they paint themselves?", "그들은 왜 자기 자신을 그렸을까?"]], "trap": [["Van Gogh painted him. (= 자기 자신)", "Van Gogh painted himself.", "him은 다른 남자"], ["They painted themself.", "They painted themselves.", "복수 주어 → -selves"]], "model": "재귀대명사는 ‘자기 자신’이라는 뜻으로, 단수는 -self, 복수는 -selves를 붙여. 주어와 목적어가 같은 사람일 때 써서 Van Gogh painted himself.라고 하면 고흐가 자기 자신을 그렸다는 뜻이야. 이때는 빼면 안 돼. 하지만 I made this cake myself.처럼 ‘직접’이라는 강조의 뜻일 때는 빼도 문장이 돼.", "frame": "재귀대명사는 ‘____’이라는 뜻이야. 단수는 ____, 복수는 ____를 붙여. 주어와 목적어가 ____일 때 쓰고, 예를 들면 ____.", "qa": [["painted him과 painted himself의 차이는?", "him = 다른 남자 / himself = 자기 자신"], ["생략할 수 있는 재귀대명사는?", "‘직접’이라는 강조 용법 (I made it myself.)"], ["they의 재귀대명사는?", "themselves"]]}], "bonus": ["look + 형용사: I look weak. / look like + 명사", "too + 형용사: models were too expensive (너무 ~한)", "start to + 동사원형: started to paint", "when 접속사: When he was 33, he moved to Paris."]}, {"l": "8", "title": "Winter Is Coming!", "sub": "Frindle – 펜의 새 이름", "line": "Nick이 펜에 ‘frindle’이라는 새 이름을 붙이자 그 말이 전국으로 퍼져 결국 사전에 실리고, 반대하던 선생님이 사실 처음부터 그의 편이었다는 이야기", "who": ["Nick Allen – 호기심 많은 5학년", "Mrs. Granger – 영어 선생님 (일부러 ‘악역’을 맡음)"], "flow": ["단어의 의미는 누가 정할까?", "펜 = frindle → 반 → 학교 → 전국", "선생님의 반대와 편지", "21살, 사전에 실린 frindle + 선생님의 진심"], "msg": "단어의 의미는 사람들이 함께 정한다. 선생님은 ‘악역’을 맡아 Nick의 이야기를 완성시켰다.", "paras": [["① 단어는 어떻게 의미를 가질까?", "5학년 Nick은 영어 시간에 단어가 어떻게 의미를 갖는지 물었다. Granger 선생님은 사람들이 단어에 의미를 주고, 모두가 그 의미에 동의했다고 답했다. Nick은 ‘나는 동의 안 했는데’라고 생각했다.", [["How do words get their meanings?", "단어는 어떻게 의미를 갖게 될까?"], ["People give meanings to words.", "사람들이 단어에 의미를 준다."]], "give A to B (3형식) / agree on = ~에 동의하다", "단어의 의미는 사람들이 정한다.", 1], ["② 펜의 새 이름 frindle", "집에 가는 길에 Nick은 길에서 펜을 주워 ‘frindle’이라고 이름 붙였다. 다음 날 친구들에게 알렸고, 그 주말쯤에는 반 친구 모두가 그 말을 쓰고 있었다.", [["The next day, he told his friends about his new word.", "다음 날 그는 친구들에게 새 단어에 대해 말했다."], ["I think that your red frindle is pretty.", "나는 네 빨간 frindle이 예쁘다고 생각해."]], "think that + 주어 + 동사 (접속사 that) / were using (과거진행)", "Nick이 펜을 frindle이라고 부르고 반 전체가 쓴다.", 0], ["③ 선생님의 편지", "선생님은 Nick에게 frindle은 진짜 단어가 아니니 그만 쓰라고 했다. Nick은 이미 너무 늦었다고 했다. 선생님은 편지를 꺼내며 오늘이 아니라 언젠가 보내 주겠다고 말했다.", [["I know that you're not happy.", "선생님이 기쁘지 않으신 걸 알아요."], ["I'm not going to give it to you today. I will send you this letter some day.", "오늘 주지는 않을 거야. 언젠가 이 편지를 보내 줄게."]], "give it to you (대명사 → 3형식만) / send you this letter = send this letter to you", "선생님이 반대하며 편지를 언젠가 보내겠다고 한다.", 1], ["④ 전국으로 퍼진 frindle", "다음 날 선생님은 반 전체에 frindle 사용을 금지했지만, 점점 더 많은 학생이 쓰기 시작했고 다른 학교를 거쳐 곧 전국의 학생들이 쓰게 되었다.", [["Stop using frindle!", "frindle 쓰는 것을 멈춰!"], ["Soon, students in the whole country were using it.", "곧 전국의 학생들이 그것을 쓰고 있었다."]], "stop -ing = ~하는 것을 멈추다 / more and more = 점점 더 많은", "금지했지만 frindle은 전국으로 퍼진다.", 1], ["⑤ 21살에 받은 소포", "시간이 흘러 Nick은 졸업하고 frindle을 잊었다. 21살이 되었을 때 선생님에게서 펜·편지·사전이 든 소포를 받았다. 사전 541쪽에서 frindle이라는 단어를 발견했다.", [["When he turned 21, he received a package from Mrs. Granger.", "21살이 되었을 때 그는 Granger 선생님에게서 소포를 받았다."], ["Nick couldn't believe his eyes. On that page, he found the word frindle!", "Nick은 자기 눈을 믿을 수 없었다. 그 쪽에서 frindle이라는 단어를 발견했다!"]], "turn 21 = 21살이 되다 / couldn't believe his eyes = 깜짝 놀랐다", "21살에 받은 사전에 frindle이 실려 있다.", 1], ["⑥ 선생님의 진심 (편지)", "선생님은 frindle이 이제 진짜 단어가 된 것을 축하하며, 처음부터 Nick의 편이었다고 고백했다. 모든 좋은 이야기에는 ‘악당’이 필요해서 자신이 그 역할을 했다고 말했다.", [["I was on your side from the beginning.", "나는 처음부터 네 편이었단다."], ["But every good story needs a \"bad guy.\" I played that role.", "하지만 모든 좋은 이야기에는 ‘악당’이 필요하지. 내가 그 역할을 했단다."]], "⭐ 반전 / on one's side = ~의 편 / play a role = 역할을 하다", "선생님은 처음부터 Nick의 편이었다.", 1]], "retell": ["Nick은 ____에 ‘frindle’이라는 새 이름을 붙였다.", "선생님이 ____했지만 그 말은 ____까지 퍼졌다.", "21살에 받은 소포 속 ____에 frindle이 실려 있었다.", "편지에서 선생님은 사실 ____이었다고 말했다."], "retell_model": "Nick은 단어의 의미를 사람들이 정한다는 말을 듣고, 길에서 주운 펜에 ‘frindle’이라는 새 이름을 붙였다. 선생님이 쓰지 말라고 했지만 그 말은 반, 다른 학교를 거쳐 전국까지 퍼졌다. 21살이 된 Nick은 선생님에게서 소포를 받았고, 사전에 frindle이 실려 있었다. 편지에서 선생님은 처음부터 Nick의 편이었고 이야기를 위해 악역을 맡았다고 고백했다.", "grammar": [{"name": "수여동사 (4형식 ↔ 3형식)", "one": "‘~에게 …을 (해) 주다’처럼 목적어가 두 개 필요한 동사. 순서를 바꾸면 전치사 to / for 가 들어간다.", "form": ["4형식: 주어 + 수여동사 + <b>사람(~에게)</b> + <b>물건(…을)</b>", "3형식: 주어 + 수여동사 + <b>물건</b> + <b>to / for</b> + <b>사람</b>", "<b>to</b>: give, send, tell, show, teach, write, bring", "<b>for</b>: buy, make, cook, get"], "ex": [["I will send you this letter.", "= I will send this letter to you."], ["People give meanings to words.", "= People give words meanings."], ["I'm not going to give it to you.", "give you it ✕ (it은 3형식만)"]], "trap": [["He gave me it.", "He gave it to me.", "물건이 대명사(it, them)면 3형식만 가능"], ["She made a cake to me.", "She made a cake for me.", "make·buy·cook은 for"], ["He showed his album for me.", "He showed his album to me.", "show는 to"]], "model": "수여동사는 ‘누구에게 무엇을 주다’라는 뜻이라 목적어가 두 개 필요해. 4형식은 ‘사람 → 물건’ 순서로 쓰고, 순서를 바꿔서 물건을 먼저 쓰면 사람 앞에 to나 for를 넣어야 해. give·send·tell은 to, make·buy는 for야. 그리고 물건이 it이면 꼭 give it to me처럼 3형식으로 써야 해.", "frame": "수여동사는 ‘____에게 ____을 주다’라는 뜻이야. 4형식은 ____ → ____ 순서이고, 순서를 바꾸면 ____나 ____를 넣어. 예를 들면 ____.", "qa": [["4형식 어순은?", "주어 + 동사 + 사람(~에게) + 물건(…을)"], ["to와 for는 어떻게 구별해?", "give·send·tell·show·teach는 to / make·buy·cook은 for"], ["He gave me it. 맞아?", "틀려. 물건이 대명사면 He gave it to me. (3형식만)"]]}, {"name": "접속사 that (명사절)", "one": "‘~라는 것, ~라고’라는 뜻으로 <b>문장 전체를 목적어</b>로 만들어 주는 that. think / know / hope / believe 뒤에 자주 온다.", "form": ["주어 + think / know / believe / hope + <b>that + 주어 + 동사</b>", "해석: ~라고 생각하다 / ~라는 것을 알다", "목적어 자리 that은 <b>생략 가능</b>: I think (that) ~", "⚠ 지시대명사 that(저것)·지시형용사 that(저 ~)과 구별 → 생략 ✕"], "ex": [["I think that your red frindle is pretty.", "나는 네 빨간 frindle이 예쁘다고 생각해."], ["I know that you're not happy.", "나는 선생님이 기쁘지 않다는 걸 알아요."], ["I hope that you understand.", "네가 이해해 주길 바란다."]], "trap": [["I believe he that is honest.", "I believe that he is honest.", "that은 절 맨 앞"], ["I know that is my pen. → that 생략 가능?", "That is my pen.의 that은 ‘저것’", "지시대명사는 생략 ✕"]], "model": "접속사 that은 ‘~라는 것’, ‘~라고’라는 뜻으로 문장 하나를 think나 know 같은 동사의 목적어로 만들어 줘. 모양은 that 뒤에 주어와 동사가 와. 예를 들어 I know that you're not happy.는 ‘선생님이 기쁘지 않다는 걸 알아요’야. 목적어 자리의 that은 생략할 수 있지만, ‘저것’이라는 뜻의 that은 생략할 수 없어.", "frame": "접속사 that은 ‘____’라는 뜻이야. think나 know 뒤에 that + ____ + ____를 쓰고, 목적어 자리의 that은 ____할 수 있어. 예를 들면 ____.", "qa": [["that 뒤에는 뭐가 와?", "주어 + 동사 (완전한 문장)"], ["I think he is kind.에서 빠진 것은?", "접속사 that (생략 가능)"], ["That is my pen.의 that도 생략돼?", "아니. ‘저것’이라는 지시대명사는 생략 ✕"]]}], "bonus": ["stop + -ing: ~하는 것을 멈추다", "과거진행형: were using (~하고 있었다)", "불규칙 과거형: saw, had, told, took, wrote, forgot, found"]}]}, {"id": "m2yun", "label": "중2 동아 윤정미", "short": "중2 윤정미", "color": "#3b4f8f", "lessons": [{"l": "7", "title": "Let's Enjoy Festivals", "sub": "세계의 독특한 축제 4가지", "line": "스페인·스웨덴·멕시코·알래스카의 독특한 축제 네 가지를 소개하는 글", "who": ["Fallas – 스페인 발렌시아 (봄맞이)", "Midsummer – 스웨덴 (가장 긴 날)", "Day of the Dead – 멕시코 (죽은 사람 기억)", "Fur Rondy – 미국 알래스카 (겨울 축제)"], "flow": ["봄: Fallas (3월)", "여름: Midsummer (6월)", "가을: Day of the Dead (11월)", "겨울: Fur Rondy (2월)"], "msg": "나라마다 계절과 문화에 따라 의미 있는 축제가 있다. (축제 이름 · 날짜 · 하는 일 · 의미를 짝지어 기억!)", "paras": [["① Fallas Festival (스페인 발렌시아)", "발렌시아 사람들은 3월 15~19일 Fallas 축제로 봄이 오는 것을 축하한다. 퍼레이드와 불꽃놀이를 즐기고, 축제의 주인공인 거대한 나무 조각상 fallas를 마지막 날 태운다. 태우는 것은 옛것과 작별하고 새 출발을 맞이한다는 뜻이다.", [["The stars of the festival are fallas, giant wooden statues.", "축제의 주인공은 거대한 나무 조각상인 fallas이다."], ["Burning them symbolizes saying goodbye to old things and hello to a new start.", "그것들을 태우는 것은 옛것에 작별하고 새 출발을 맞이하는 것을 상징한다."]], "동격 콤마 (fallas, giant wooden statues) / 동명사 주어 Burning → 단수동사 symbolizes", "스페인 Fallas: 봄맞이, 나무 조각상을 태운다.", 1], ["② Midsummer Festival (스웨덴)", "스웨덴은 겨울이 길고 어두워서 여름을 특히 반긴다. 1년 중 가장 긴 날을 축하하며 6월 19~25일 사이 금요일 저녁부터 일요일까지 축제를 연다. 키 큰 기둥을 꽃과 잎으로 장식하고 전통춤을 추며, 해가 거의 지지 않아 밤새 즐긴다.", [["They call it the Midsummer festival.", "그들은 그것을 Midsummer 축제라고 부른다."], ["Because the sun hardly sets at this time of year in Sweden, people can enjoy the festival all night long.", "스웨덴에서는 이맘때 해가 거의 지지 않아서 사람들은 밤새 축제를 즐길 수 있다."]], "call A B (A를 B라고 부르다) / hardly = 거의 ~않다 (부정의 뜻)", "스웨덴 Midsummer: 가장 긴 날, 밤새 즐긴다.", 0], ["③ Day of the Dead (멕시코)", "많은 멕시코 사람들은 1년에 한 번 죽은 사람들이 가족과 친구를 만나러 집에 돌아온다고 믿는다. 11월 1~2일에 축제를 열어 집에 제단을 차리고 묘지에서 큰 파티를 한다. 어떤 지역에서는 해골 분장을 하고 퍼레이드를 한다.", [["They call this day the Day of the Dead.", "그들은 이날을 죽은 자의 날이라고 부른다."], ["They believe it is important to remember dead people.", "그들은 죽은 사람들을 기억하는 것이 중요하다고 믿는다."]], "가주어 it ~ to부정사(진주어) / dress up like skeletons = 해골처럼 분장하다", "멕시코 Day of the Dead: 죽은 사람을 기억한다.", 1], ["④ Fur Rondy Festival (알래스카)", "2월 말 알래스카에서는 세계 최대 겨울 축제 중 하나인 Fur Rondy를 연다. 겨울 스포츠와 전통 게임을 즐기고, 순록 달리기(Running of the Reindeer)에서는 재미있는 의상을 입고 순록보다 빨리 달리려고 한다. 불가능하지만 상관없이 모두 즐긴다.", [["People who participate in this race wear fun costumes and try to run faster than reindeer.", "이 경주에 참가하는 사람들은 재미있는 의상을 입고 순록보다 빨리 달리려고 한다."], ["Is it possible to do so? Not really, but it doesn't matter.", "그렇게 하는 것이 가능할까? 아니지만 상관없다."]], "가주어 it / one of the biggest winter festivals (one of the + 최상급 + 복수명사)", "알래스카 Fur Rondy: 순록보다 빨리 달리기.", 0]], "retell": ["이 글은 ____ 나라의 축제를 소개한다.", "Fallas에서는 ____을 태우고, Midsummer에는 ____을 장식한다.", "Day of the Dead에는 ____을 기억하고, Fur Rondy에서는 ____보다 빨리 달리려고 한다."], "retell_model": "이 글은 네 나라의 축제를 소개한다. 스페인 Fallas에서는 봄을 맞아 거대한 나무 조각상을 마지막 날 태우며 새 출발을 축하하고, 스웨덴 Midsummer에는 가장 긴 날에 기둥을 꽃과 잎으로 장식하고 춤을 춘다. 멕시코 Day of the Dead에는 죽은 사람들을 기억하며 제단을 차리고, 알래스카 Fur Rondy에서는 재미있는 의상을 입고 순록보다 빨리 달리려고 한다.", "grammar": [{"name": "가주어 it ~ 진주어 to부정사", "one": "to부정사 주어가 길면 문장 뒤로 보내고, 빈 주어 자리에 <b>it</b>을 넣는다. 이 it은 ‘그것’이라고 해석하지 않는다.", "form": ["To remember dead people is important.", "→ <b>It</b> is important <b>to remember</b> dead people.", "It(가주어) + be동사 + 형용사 + to부정사(진주어)", "의미상 주어: It is ~ <b>for + 사람</b> + to부정사 (It is not easy for me to run fast.)"], "ex": [["They believe it is important to remember dead people.", "그들은 죽은 사람들을 기억하는 것이 중요하다고 믿는다."], ["Is it possible to do so?", "그렇게 하는 것이 가능할까?"], ["It is dangerous to swim in the river.", "강에서 수영하는 것은 위험하다."]], "trap": [["This is important to remember dead people.", "It is important to ~", "가주어 자리는 반드시 It"], ["It is dangerous swim in the river.", "It is dangerous to swim ~", "진주어는 to + 동사원형"], ["It is easy me to run fast.", "It is easy for me to run fast.", "의미상 주어는 for + 목적격"]], "model": "가주어 it은 to부정사 주어가 너무 길 때 그걸 문장 뒤로 보내고 그 빈자리에 넣는 가짜 주어야. 그래서 ‘그것’이라고 해석하지 않고, 뒤의 to부정사를 주어로 해석해. 예를 들어 It is important to remember dead people.은 ‘죽은 사람들을 기억하는 것은 중요하다’야. 누가 하는지 말하고 싶으면 to 앞에 for + 사람을 넣어.", "frame": "가주어 it은 ____이 길 때 뒤로 보내고 빈자리에 넣는 주어야. ‘____’이라고 해석하지 않고 뒤의 ____를 주어로 해석해. 예를 들면 ____.", "qa": [["가주어 it은 해석해?", "아니. 뒤의 to부정사를 주어로 해석"], ["‘내가 비밀을 지키는 것은 어렵다’를 영어로?", "It is hard for me to keep secrets."], ["This is important to ~ 맞아?", "틀려. 가주어 자리는 It만"]]}, {"name": "call + 목적어 + 목적격 보어(명사)", "one": "‘A를 B라고 부르다’. 목적어 뒤에 그 목적어가 무엇인지 설명하는 <b>명사(보어)</b>가 온다.", "form": ["call + <b>A(목적어)</b> + <b>B(목적격 보어)</b> = A를 B라고 부르다", "A = B 관계 (it = the Midsummer festival)", "as / to 를 넣지 않는다", "수동태: A is called B. (A는 B라고 불린다)", "같은 구조: name A B (A를 B라고 이름 짓다), make A B (A를 B로 만들다)"], "ex": [["They call it the Midsummer festival.", "그들은 그것을 Midsummer 축제라고 부른다."], ["They call this day the Day of the Dead.", "그들은 이날을 죽은 자의 날이라고 부른다."], ["People call the robot Smarty.", "사람들은 그 로봇을 Smarty라고 부른다."]], "trap": [["They call it as the Midsummer festival.", "They call it the Midsummer festival.", "as ✕"], ["They call Smarty the robot. (로봇을 Smarty라고)", "They call the robot Smarty.", "순서: 부르는 대상 → 이름"]], "model": "call A B는 ‘A를 B라고 부르다’라는 뜻이야. call 바로 뒤에 부르는 대상을 쓰고, 그 뒤에 이름을 써. 둘은 같은 것이라서 A = B 관계야. 예를 들어 They call it the Midsummer festival.은 ‘그것을 Midsummer 축제라고 부른다’야. 중간에 as나 to를 넣으면 안 돼.", "frame": "call A B는 ‘____를 ____라고 부르다’라는 뜻이야. call 뒤에 ____을 먼저 쓰고 그 뒤에 ____을 써. 중간에 ____를 넣지 않아. 예를 들면 ____.", "qa": [["They call it as ~ 맞아?", "틀려. as 없이 call it the ~"], ["‘그 로봇을 Smarty라고 부른다’는?", "They call the robot Smarty."], ["수동태로 바꾸면?", "It is called the Midsummer festival."]]}], "bonus": ["동명사 주어 + 단수동사: Burning them symbolizes ~", "주격 관계대명사 who: People who participate in this race ~", "one of the + 최상급 + 복수명사", "hardly = 거의 ~않다"]}, {"l": "8", "title": "A Butterfly That Changed the Future", "sub": "시간 여행과 나비 한 마리", "line": "공룡을 보러 6천만 년 전으로 시간 여행을 간 Eckels가 실수로 길을 벗어나 나비 한 마리를 죽이고, 그 작은 변화로 현재가 바뀌어 버린 이야기", "who": ["Eckels – 공룡을 보고 싶은 여행자", "Travis – 시간 여행 가이드", "Mr. Parker – Time Travel 설립자", "Mr. Keith – (출발 전) 새 대통령"], "flow": ["Time Travel 사무실 (간판·대통령 = 복선)", "정글 도착: 길에서 벗어나지 말 것!", "T. rex → 겁에 질려 길을 벗어남", "현재로 귀환 → 간판·대통령이 바뀜 → 죽은 나비"], "msg": "과거의 아주 작은 변화가 미래를 크게 바꿀 수 있다. (나비 효과 · A little change can cause something unthinkable.)", "paras": [["① Time Travel 사무실", "Eckels가 Time Travel 사무실에 들어간다. 벽에는 ‘과거 어느 해든 말하세요’라는 간판, TV에는 새 대통령 Keith가 나온다. 공룡을 보고 싶다고 하자 6천만 년 전 정글로 데려갈 수 있고, 10분 뒤 출발하는 타임머신이 있다고 한다.", [["I've always wanted to see a dinosaur. Is it possible?", "나는 항상 공룡을 보고 싶었어요. 가능한가요?"], ["We can take you back to the jungle of 60 million years ago.", "우리는 당신을 6천만 년 전 정글로 데려갈 수 있어요."]], "⭐ 복선: 간판 철자 · 대통령 Keith / 현재완료 계속 (I've always wanted)", "Eckels가 공룡을 보러 시간 여행을 신청한다.", 0], ["② 정글에 도착하다", "가이드 Travis를 소개받고, 안전하려면 그의 지시를 따라야 한다. 몇 분 만에 정글에 도착했다. Travis는 길을 절대 벗어나지 말고 아무것도 만지지 말라고, 작은 변화가 미래에 상상할 수 없는 일을 일으킬 수 있다고 경고한다.", [["We've just arrived in the jungle of 60 million years ago.", "우리는 6천만 년 전 정글에 막 도착했습니다."], ["A little change here can cause something unthinkable in the future.", "여기서의 작은 변화가 미래에 상상할 수 없는 일을 일으킬 수 있어요."]], "⭐ 주제 문장 / 현재완료 완료 (have just arrived) / something + 형용사", "길을 벗어나지 말라는 경고를 듣는다.", 1], ["③ T. rex의 등장", "안개 낀 조용한 정글. 신난 Eckels에게 Travis는 어리석은 짓을 하지 말라고 한다. 100미터 앞에 T. rex가 나타나자 Eckels는 그렇게 거대한 것은 처음 본다며 겁에 질린다.", [["I don't want you to do anything foolish.", "나는 당신이 어리석은 일을 하지 않기를 바라요."], ["I've never seen such a huge thing. I'm so scared.", "나는 그렇게 거대한 것을 본 적이 없어요. 너무 무서워요."]], "anything + 형용사 / 현재완료 경험 (have never seen) / want A to B", "거대한 T. rex가 나타난다.", 1], ["④ 길을 벗어나다", "숨을 쉴 수 없다며 공포에 빠진 Eckels는 돌아서 뛰다가 너무 무서워서 실수로 길을 벗어났다. Travis의 외침을 들은 T. rex가 큰 포효와 함께 그들에게 달려왔다.", [["He was so terrified that he left the path by accident.", "그는 너무 겁에 질려서 실수로 길을 벗어났다."], ["Then, it suddenly started to run toward them with a loud roar.", "그때 그것이 큰 포효와 함께 갑자기 그들을 향해 달려오기 시작했다."]], "so ~ that (너무 ~해서 …하다) / by accident = 실수로", "겁에 질려 실수로 길을 벗어난다.", 0], ["⑤ 현재로 돌아오다", "모두 무사히 타임머신으로 돌아왔다. Travis는 모두를 위험에 빠뜨렸다고 화를 냈고, Eckels는 아무것도 죽이지 않았고 신발에 진흙만 조금 묻었다고 했다. 그들은 무사히 현재로 돌아왔다.", [["You put all of us in danger.", "당신은 우리 모두를 위험에 빠뜨렸어요."], ["I'm sorry, but I didn't kill anything. There's only a little mud on my shoes.", "죄송해요, 하지만 아무것도 죽이지 않았어요. 신발에 진흙이 조금 묻었을 뿐이에요."]], "⭐ 복선: 신발의 진흙 / put A in danger = A를 위험에 빠뜨리다", "무사히 돌아오지만 신발에 진흙이 묻어 있다.", 1], ["⑥ 작은 나비 한 마리", "모든 게 그대로인데 간판의 철자가 엉망으로 바뀌어 있었고, TV 속 새 대통령도 Keith가 아니었다. 혼란스러운 Eckels가 신발의 진흙을 자세히 보니, 오른쪽 신발 진흙 속에 죽은 작은 나비가 있었다.", [["Everything looked the same, except the big sign on the wall.", "벽의 큰 간판을 제외하고는 모든 것이 똑같아 보였다."], ["In the mud on his right shoe, he found a small dead butterfly.", "오른쪽 신발의 진흙 속에서 그는 작은 죽은 나비를 발견했다."]], "심경 변화: confused → more confused → shocked / except = ~을 제외하고", "현재가 바뀌었고, 진흙 속에 죽은 나비가 있다.", 1]], "retell": ["Eckels는 ____을 보려고 6천만 년 전으로 시간 여행을 갔다.", "Travis는 ____을 벗어나지 말라고 경고했다.", "T. rex를 보고 ____해서 길을 벗어났다.", "현재로 돌아오니 ____과 ____이 바뀌어 있었고, 신발에서 ____를 발견했다."], "retell_model": "Eckels는 공룡을 보려고 6천만 년 전 정글로 시간 여행을 갔다. 가이드 Travis는 작은 변화도 미래를 바꿀 수 있으니 길을 벗어나지 말라고 경고했다. 하지만 Eckels는 T. rex를 보고 너무 겁에 질려 실수로 길을 벗어났다. 현재로 돌아오니 간판의 철자와 대통령이 바뀌어 있었고, 신발의 진흙 속에서 죽은 나비를 발견했다.", "grammar": [{"name": "현재완료 (have/has + p.p.)", "one": "<b>과거에 시작된 일이 지금까지 이어지거나 영향을 줄 때</b> 쓰는 시제. 과거와 현재를 연결한다.", "form": ["형태: have / has + <b>과거분사(p.p.)</b>", "<b>경험</b> ~한 적이 있다: ever, never, before, ~ times", "<b>계속</b> 계속 ~해 왔다: for, since, always, how long", "<b>완료</b> 막 ~했다: just, already, yet", "<b>결과</b> ~해 버렸다(그래서 지금 …): have lost, have gone", "⚠ yesterday, last ~, ~ ago, when 같은 <b>명확한 과거</b>와 함께 쓰지 않는다"], "ex": [["I've always wanted to see a dinosaur.", "나는 항상 공룡을 보고 싶었다. (계속)"], ["We've just arrived in the jungle.", "우리는 막 정글에 도착했다. (완료)"], ["I've never seen such a huge thing.", "나는 그렇게 거대한 것을 본 적이 없다. (경험)"]], "trap": [["I have seen him yesterday.", "I saw him yesterday.", "명확한 과거 → 과거시제"], ["She has gone to Paris. (경험)", "She has been to Paris.", "has gone = 가 버렸다(결과) / has been = 가 본 적 있다(경험)"], ["I've always want to ~", "I've always wanted to ~", "have + p.p."]], "model": "현재완료는 과거에 일어난 일이 지금까지 이어지거나 지금과 관련 있을 때 써. 모양은 have나 has 뒤에 과거분사야. 경험, 계속, 완료, 결과 네 가지 뜻이 있어. 예를 들어 I've never seen such a huge thing.은 ‘그렇게 큰 걸 본 적이 없다’는 경험이고, We've just arrived.는 ‘막 도착했다’는 완료야. yesterday나 ago처럼 정확한 과거 시점이 있으면 현재완료를 쓰지 않아.", "frame": "현재완료는 ____와 ____를 연결하는 시제야. 모양은 ____ + ____이고, 뜻은 경험·____·____·결과가 있어. 예를 들면 ____.", "qa": [["I've just arrived.는 어떤 용법?", "완료 (just)"], ["I've never seen ~은?", "경험 (never)"], ["have been to와 have gone to 차이?", "been to = 가 본 적 있다 / gone to = 가 버려서 지금 없다"]]}, {"name": "-thing + 형용사", "one": "something, anything, nothing, everything처럼 <b>-thing</b>으로 끝나는 말은 형용사가 <b>뒤에서</b> 꾸민다.", "form": ["-thing / -one / -body + <b>형용사</b>", "something unthinkable (상상할 수 없는 무언가)", "anything foolish (어리석은 어떤 것)", "형용사 + to부정사 순서: something <b>cold to drink</b>", "긍정문 something / 부정문·의문문 anything"], "ex": [["A little change here can cause something unthinkable in the future.", "여기서의 작은 변화가 미래에 상상할 수 없는 일을 일으킬 수 있다."], ["I don't want you to do anything foolish.", "나는 네가 어리석은 일을 하지 않기를 바란다."]], "trap": [["unthinkable something", "something unthinkable", "형용사는 -thing 뒤"], ["something to drink cold", "something cold to drink", "형용사 → to부정사 순서"]], "model": "something, anything처럼 -thing으로 끝나는 단어는 형용사가 앞이 아니라 뒤에서 꾸며 줘. 그래서 ‘상상할 수 없는 무언가’는 something unthinkable, ‘어리석은 것’은 anything foolish라고 써. 형용사와 to부정사가 같이 오면 something cold to drink처럼 형용사를 먼저 써.", "frame": "-thing으로 끝나는 말은 형용사가 ____에서 꾸며. 예를 들면 ____. 형용사와 to부정사가 같이 오면 ____ → ____ 순서야.", "qa": [["‘어리석은 일’을 영어로?", "anything / something foolish"], ["‘마실 차가운 것’은?", "something cold to drink"], ["부정문에서는 something? anything?", "anything (I didn't do anything foolish.)"]]}], "bonus": ["so ~ that: He was so terrified that he left the path.", "want + 목적어 + to부정사: I don't want you to do ~", "감각동사: looked the same / got more confused (get + 비교급)"]}]}, {"id": "m2lee", "label": "중2 동아 이병민", "short": "중2 이병민", "color": "#8a1f3d", "lessons": [{"l": "7", "title": "Wonders in Words", "sub": "재미있는 영어 관용 표현 3가지", "line": "‘Break a leg’, ‘Spill the beans’, ‘Take a rain check’ 세 가지 관용 표현이 쓰이는 상황과 유래를 소개하는 글", "who": ["Lily – 학교 연극 (Break a leg)", "Tommy & Lisa – 깜짝 파티 (Spill the beans)", "Sarah & Emily – 영화 약속 (Take a rain check)"], "flow": ["표현마다 [상황 이야기] → [뜻과 유래]", "Break a leg = 행운을 빌어 (독일 배우들)", "Spill the beans = 비밀을 누설하다 (고대 그리스 투표)", "Take a rain check = 다음으로 미루다 (1880년대 야구)"], "msg": "관용 표현은 글자 그대로의 뜻과 실제 뜻이 다르고, 각각 재미있는 유래가 있다.", "paras": [["① Break a Leg – 상황", "학교 연극 날, Lily는 몇 주 동안 연습했지만 막이 오르기 직전 매우 긴장했다. 친구가 웃으며 “Break a leg!”라고 했고, Lily는 무대에 올라 성공적으로 공연했다.", [["The curtains were about to go up, and she felt very nervous.", "막이 막 오르려 하고 있었고, 그녀는 매우 긴장했다."], ["Her friend smiled and said, \"Break a leg!\"", "그녀의 친구는 웃으며 “행운을 빌어!”라고 말했다."]], "be about to + 동사원형 = 막 ~하려 하다", "Lily가 연극 전 ‘Break a leg!’를 듣는다.", 1], ["② Break a Leg – 유래", "‘다리를 부러뜨려라’는 나쁜 말처럼 들리지만 실제로는 ‘행운을 빌어’라는 뜻이다. 20세기 초 미국에 온 독일 배우들이 처음 썼는데, 서로 불운을 빌어 주면 불운이 사라진다고 믿었다. 지금도 공연 전에 쓴다.", [["Although \"Break a leg!\" may sound like a bad thing, it actually means \"Good luck!\"", "“Break a leg!”는 나쁜 말처럼 들릴 수 있지만, 실제로는 “행운을 빌어!”라는 뜻이다."], ["German actors who came to the United States in the early 20th century first used this phrase.", "20세기 초 미국에 온 독일 배우들이 이 표현을 처음 사용했다."]], "although (비록 ~이지만) / 주격 관계대명사 who / is still used (수동태)", "Break a leg = 행운을 빌어 (독일 배우들)", 0], ["③ Spill the Beans – 상황", "Tommy와 Lisa는 Hana의 깜짝 파티를 준비했다. 비밀을 잘 못 지키는 Tommy에게 Lisa가 “Don't spill the beans.”라고 했고, Tommy는 약속을 지켜 파티는 대성공이었다.", [["But Tommy was not good at keeping secrets.", "하지만 Tommy는 비밀을 잘 지키지 못했다."], ["Don't worry. I promise not to tell Hana.", "걱정 마. Hana에게 말하지 않겠다고 약속할게."]], "be good at -ing / promise not to + 동사원형 (to부정사 부정)", "Lisa가 Tommy에게 ‘비밀 지켜’라고 한다.", 1], ["④ Spill the Beans – 유래", "‘비밀을 누설하다’라는 뜻이다. 고대 그리스의 투표 방식에서 왔는데, 흰 콩이나 검은 콩을 큰 항아리에 넣고 투표가 끝나면 콩을 쏟아 결과를 공개했다. 그때부터 새로운 의미로 쓰이기 시작했다.", [["It means to reveal a secret.", "그것은 비밀을 누설한다는 뜻이다."], ["When the voting was completed, the beans were spilled to reveal the results.", "투표가 끝나면 결과를 공개하기 위해 콩이 쏟아졌다."]], "수동태 was completed / were spilled / to reveal (목적)", "Spill the beans = 비밀을 누설하다 (그리스 콩 투표)", 1], ["⑤ Take a Rain Check – 상황", "Sarah가 단짝 Emily에게 오늘 같이 영화를 보자고 했지만, Emily는 할머니 댁에 가야 해서 “take a rain check”라고 했다. Sarah는 조금 실망했지만 Emily의 상황을 이해했다.", [["I'm sorry, but I have to take a rain check.", "미안하지만 다음으로 미뤄야겠어."], ["Although Sarah was a little disappointed, she understood Emily's situation.", "Sarah는 조금 실망했지만 Emily의 상황을 이해했다."]], "although / Let's do it another time. = 다음에 하자", "Emily가 영화 약속을 다음으로 미룬다.", 0], ["⑥ Take a Rain Check – 유래", "‘제안을 정중히 거절하지만 나중에 하고 싶다’는 뜻이다. 1880년대 야구 경기에서 처음 쓰였는데, 비로 경기가 취소되면 다음 경기 표(rain check)를 주었다. 이후 다른 스포츠로 퍼졌고 널리 쓰이게 되었다.", [["It means to refuse an offer politely but wish to do it later.", "그것은 제안을 정중히 거절하지만 나중에 하기를 바란다는 뜻이다."], ["A rain check was a ticket that people got for a future game when a baseball game was canceled because of rain.", "rain check는 비 때문에 야구 경기가 취소되었을 때 사람들이 다음 경기를 위해 받은 표였다."]], "목적격 관계대명사 that (생략 가능) / has been widely used (현재완료 수동태)", "Take a rain check = 다음으로 미루다 (야구 우천 티켓)", 0]], "retell": ["이 글은 세 가지 ____의 상황과 ____를 소개한다.", "Break a leg는 ‘____’라는 뜻으로 ____ 배우들에게서 왔다.", "Spill the beans는 ‘____’라는 뜻으로 고대 그리스의 ____에서 왔다.", "Take a rain check는 ‘____’라는 뜻으로 ____ 경기에서 왔다."], "retell_model": "이 글은 세 가지 영어 관용 표현의 상황과 유래를 소개한다. Break a leg는 ‘행운을 빌어’라는 뜻으로, 서로 불운을 빌면 불운이 사라진다고 믿은 독일 배우들에게서 왔다. Spill the beans는 ‘비밀을 누설하다’라는 뜻으로, 콩을 쏟아 투표 결과를 공개한 고대 그리스의 투표 방식에서 왔다. Take a rain check는 ‘정중히 거절하고 다음으로 미루다’라는 뜻으로, 비로 취소된 야구 경기의 다음 경기 표에서 왔다.", "grammar": [{"name": "목적격 관계대명사 who(m) / which / that", "one": "앞의 명사(선행사)를 뒤에서 꾸미는 문장을 연결하는 말. 관계대명사가 뒤 문장에서 <b>목적어 역할</b>을 하므로 뒤 문장에 <b>목적어가 빠져 있다.</b>", "form": ["선행사(사람) + <b>who(m) / that</b> + 주어 + 동사", "선행사(사물·동물) + <b>which / that</b> + 주어 + 동사", "목적격 관계대명사는 <b>생략 가능</b>", "구별: 주격 관계대명사 뒤에는 바로 <b>동사</b> (who came ~) → 생략 ✕"], "ex": [["A rain check was a ticket (that) people got for a future game.", "rain check는 사람들이 다음 경기를 위해 받은 표였다."], ["The movie (which) I saw yesterday was fun.", "내가 어제 본 영화는 재미있었다."], ["German actors who came to the U.S. first used this phrase. (주격)", "미국에 온 독일 배우들이 이 표현을 처음 썼다."]], "trap": [["a ticket that people got it", "a ticket that people got", "목적어(it) 중복 ✕"], ["the boy which I met", "the boy who(m) / that I met", "사람 → who(m)/that"], ["German actors came to the U.S. first used ~ (who 생략)", "German actors who came ~", "주격은 생략 ✕"]], "model": "목적격 관계대명사는 앞에 있는 명사를 뒤에서 설명하는 문장을 연결해 줘. 사람이면 who나 whom, 사물이면 which를 쓰고 that은 둘 다 돼. 관계대명사가 뒤 문장의 목적어 역할을 하니까 뒤에는 ‘주어 + 동사’만 있고 목적어가 빠져 있어. 예를 들어 a ticket that people got은 ‘사람들이 받은 표’야. 목적격 관계대명사는 생략할 수 있어.", "frame": "목적격 관계대명사는 앞의 ____를 꾸미는 문장을 연결해. 사람은 ____, 사물은 ____, 둘 다 ____을 쓰고 뒤에는 ____가 빠져 있어. ____ 가능해. 예를 들면 ____.", "qa": [["목적격 관계대명사 뒤에 뭐가 와?", "주어 + 동사 (목적어 없음)"], ["생략할 수 있는 건?", "목적격 관계대명사 (주격은 ✕)"], ["a ticket that people got it 맞아?", "틀려. it이 중복 → a ticket that people got"]]}, {"name": "접속사 although", "one": "‘비록 ~이지만, ~에도 불구하고’. 앞 내용과 <b>반대되는 결과</b>를 이어 준다.", "form": ["<b>Although</b> + 주어 + 동사, 주어 + 동사.", "= 주어 + 동사 + although + 주어 + 동사.", "= though / even though", "⚠ although와 but을 한 문장에 같이 쓰지 않는다", "because(~ 때문에)와 구별: 반대 결과면 although, 원인이면 because"], "ex": [["Although \"Break a leg!\" may sound like a bad thing, it actually means \"Good luck!\"", "나쁜 말처럼 들릴 수 있지만 실제로는 ‘행운을 빌어’라는 뜻이다."], ["Although Sarah was a little disappointed, she understood Emily's situation.", "Sarah는 조금 실망했지만 Emily의 상황을 이해했다."]], "trap": [["Although it rained, but we played soccer.", "Although it rained, we played soccer.", "although + but ✕"], ["Although I was tired, so I went to bed.", "Because I was tired, I went to bed.", "원인-결과면 because"]], "model": "although는 ‘비록 ~이지만’이라는 뜻으로, 예상과 반대되는 결과를 말할 때 써. 뒤에 주어와 동사가 오고, 앞에 오면 콤마를 찍어. 예를 들어 Although Sarah was a little disappointed, she understood Emily's situation.은 ‘Sarah는 조금 실망했지만 이해했다’야. although가 이미 ‘~지만’이라는 뜻이라서 but을 같이 쓰면 안 돼.", "frame": "although는 ‘____’라는 뜻으로 ____되는 결과를 이어 줘. 뒤에 ____ + ____가 오고, ____과 같이 쓰지 않아. 예를 들면 ____.", "qa": [["although의 뜻은?", "비록 ~이지만"], ["Although ~, but ~ 맞아?", "틀려. but을 빼야 해"], ["because와 차이는?", "because = 원인(~ 때문에) / although = 반대 결과(~이지만)"]]}], "bonus": ["be about to + 동사원형: 막 ~하려 하다", "to부정사 부정: promise not to tell", "수동태: is still used / were spilled / was canceled", "현재완료 수동태: has been widely used"]}, {"l": "8", "title": "Festival Fun", "sub": "Quebec Winter Carnival – Bonhomme의 안내", "line": "퀘벡 겨울 카니발의 마스코트 Bonhomme이 얼 uld로 바꾸면?", "what I should do"], ["쓸 수 없는 의문사는?", "why (why to ✕)"]]}, {"name": "so ~ that 구문", "one": "‘너무 ~해서 …하다’. 원인(so + 형용사/부사)과 결과(that + 주어 + 동사)를 한 문장으로 연결한다.", "form": ["<b>so</b> + 형용사/부사 + <b>that</b> + 주어 + 동사", "부정 결과: so ~ that + 주어 + <b>can't</b> + 동사원형 = <b>too ~ to</b> 동사원형", "‘매우’라는 뜻이라도 <b>very ~ that ✕</b>", "such + (a) + 형용사 + 명사 + that도 같은 뜻"], "ex": [["It is so fast that you will feel like you are on a roller coaster.", "그것은 너무 빨라서 롤러코스터를 탄 것처럼 느낄 것이다."], ["The race is so exciting that you will forget about the cold.", "경주가 너무 신나서 추위를 잊게 될 것이다."], ["I was so tired that I couldn't walk. = I was too tired to walk.", "너무 피곤해서 걸을 수 없었다."]], "trap": [["It is very fast that ~", "It is so fast that ~", "very ✕ → so"], ["He was too tired that he couldn't walk.", "He was so tired that he couldn't walk. / too tired to walk", "too는 to와 짝"], ["I was so tired that I can't walk.", "~ that I couldn't walk.", "시제 일치 (과거)"]], "model": "so ~ that은 ‘너무 ~해서 …하다’라는 뜻으로, so 뒤에 형용사나 부사로 원인을 쓰고 that 뒤에 주어와 동사로 결과를 써. 예를 들어 The race is so exciting that you will forget about the cold.는 ‘경주가 너무 신나서 추위를 잊게 된다’야. 결과가 ‘~할 수 없다’이면 too ~ to로 바꿀 수 있고, so 대신 very를 쓰면 안 돼.", "frame": "so ~ that은 ‘너무 ____해서 ____하다’라는 뜻이야. so 뒤에 ____, that 뒤에 ____ + ____를 써. 결과가 ‘~할 수 없다’면 ____ ~ ____로 바꿀 수 있어. 예를 들면 ____.", "qa": [["so ~ that의 뜻은?", "너무 ~해서 …하다"], ["so ~ that + can't를 바꾸면?", "too ~ to + 동사원형"], ["very fast that ~ 맞아?", "틀려. so fast that ~"]]}], "bonus": ["수동태: is held / is built / is made of / was built in 1884", "be made up of: ~로 구성되다", "명령문, and ~: ~해라, 그러면 …", "both A and B: A와 B 둘 다"]}]}];

function book(){return DATA.find(x=>x.id===S.b)}
function les(){return book().lessons.find(x=>x.l===S.l)||book().lessons[0]}
function key(){return "m78s_"+S.b+"_"+S.l}

function render(){
 const B=book(),L=les();
 document.documentElement.style.setProperty("--c",B.color);
 $("#ttl").textContent=B.label+" "+L.l+"과 · 본문·문법 핵심 정리";
 document.title=B.short+" "+L.l+"과 본문·문법 정리 | 잉글리시아이 스텔라";
 $("#pick").innerHTML=DATA.map(b=>`<button class="bk ${b.id===S.b?"on":""}" style="--c:${b.color}" data-b="${b.id}">${b.label}</button>`).join("");
 $("#lt").innerHTML=B.lessons.map(l=>`<button class="lb ${l.l===L.l?"on":""}" data-l="${l.l}"><b>LESSON ${l.l}</b><span>${raw(l.title)}</span></button>`).join("");
 $("#steps").innerHTML=STEPS.map((s,i)=>`<button class="st ${i===S.s?"on":""}" data-s="${i}"><i>${i+1}</i>${s[1]}</button>`).join("");
 const W=LS.get(key(),{});
 let h="";
 // STEP 1
 h+=sec(0,"이 과가 무슨 내용인지 1분 만에 파악해요",`
  <div class="card hero"><p class="tt">${raw(L.title)}</p><p class="ss">${raw(L.sub)}</p>
   <div class="line">${raw(L.line)}</div>
   <div class="lab">등장인물 · 소재</div><ul class="cl">${L.who.map(x=>`<li>${raw(x)}</li>`).join("")}</ul>
   <div class="lab">글의 흐름</div><div class="flow">${L.flow.map(x=>`<span>${raw(x)}</span>`).join("<em>→</em>")}</div>
   <div class="lab">주제 · 교훈</div><div class="msg">${raw(L.msg)}</div>
   <div class="lab">이번 과 문법</div><div class="chips">${L.grammar.map(g=>`<span class="chip">${raw(g.name)}</span>`).join("")}</div>
  </div>`);
 // STEP 2
 h+=sec(1,"문단마다 한 줄 요약 + 꼭 외울 문장 하나",`<div class="card plist">${L.paras.map(p=>{const m=p[0].match(/^(\S)\s*(.*)$/);const k=p[2][p[5]];
  return `<div class="pr"><div class="pn">${m?("①②③④⑤⑥⑦⑧".indexOf(m[1])+1||m[1]):""}</div><div class="pb"><div class="pt2">${raw(m?m[2]:p[0])}</div><div class="ps">${raw(p[4])}</div><div class="pe">${raw(k[0])}</div><div class="pko">${raw(k[1])}</div></div></div>`}).join("")}</div>`);
 // STEP 3
 h+=sec(2,"개념 → 형태 → 교과서 예문 → 틀리기 쉬운 것 순서로 정리해요",
  L.grammar.map((g,gi)=>`<div class="card"><div class="lab" style="margin-top:0">문법 ${gi+1}</div><p class="gname">${raw(g.name)}</p>
   <div class="gone">💡 ${raw(g.one)}</div>
   <div class="lab">형태 · 규칙</div><ul class="form">${g.form.map(x=>`<li>${raw(x)}</li>`).join("")}</ul>
   <div class="lab">교과서 예문</div>${g.ex.map(e=>`<div class="ex"><div class="en">${raw(e[0])}</div><div class="ko">${raw(e[1])}</div></div>`).join("")}
   <div class="lab">틀리기 쉬운 포인트</div><table class="trap">${g.trap.map(t=>`<tr><td class="x">${raw(t[0])}</td><td class="o">${raw(t[1])}</td><td class="w">${raw(t[2])}</td></tr>`).join("")}</table>
  </div>`).join("")+`<div class="card bonus"><div class="lab" style="margin-top:0">➕ 본문 속 문법 보너스</div><ul>${L.bonus.map(x=>`<li>${raw(x)}</li>`).join("")}</ul></div>`);
 // STEP 4
 const rt=`<div class="card"><div class="lab" style="margin-top:0">① 본문 내용 말로 설명하기</div>
   <div class="frame">${L.retell.map(x=>`<div>${raw(x)}</div>`).join("")}</div>
   <textarea class="noprint" data-w="retell" placeholder="틀을 보고 내 말로 본문 내용을 설명해 보세요. (소리 내어 말한 뒤 써 보기)">${esc(W.retell||"")}</textarea>
   <div class="ponly"><div class="wline"></div><div class="wline"></div><div class="wline"></div></div>
   <button class="rv" data-m="m_rt">모범 설명 보기</button><div class="model" id="m_rt">${raw(L.retell_model)}</div></div>`;
 const gx=L.grammar.map((g,gi)=>`<div class="card"><div class="lab" style="margin-top:0">${["②","③","④"][gi]} 문법 설명하기 · ${raw(g.name)}</div>
   <div class="frame">${raw(g.frame)}</div>
   <textarea class="noprint" data-w="g${gi}" placeholder="친구에게 설명한다고 생각하고 내 말로 써 보세요.">${esc(W["g"+gi]||"")}</textarea>
   <div class="ponly"><div class="wline"></div><div class="wline"></div><div class="wline"></div></div>
   <button class="rv" data-m="m_g${gi}">모범 설명 보기</button><div class="model" id="m_g${gi}">${raw(g.model)}</div>
   <div class="lab">친구가 이렇게 물어보면? (눌러서 답 확인)</div>
   <div class="qa">${g.qa.map(q=>`<button class="q"><small>Q</small><div class="qq">${raw(q[0])}</div><div class="a">→ ${raw(q[1])}</div></button>`).join("")}</div></div>`).join("");
 h+=sec(3,"틀을 보고 소리 내어 설명한 뒤, 모범 설명과 비교해요",rt+gx);
 // STEP 5
 const items=["본문 흐름을 순서대로 말할 수 있다 ("+L.flow.length+"단계)","글의 주제(교훈)를 한 문장으로 말할 수 있다"]
  .concat(L.paras.map(p=>p[0].replace(/<[^>]+>/g,"")+" – 핵심 문장을 보지 않고 영어로 쓸 수 있다"))
  .concat(L.grammar.flatMap(g=>[g.name.replace(/<[^>]+>/g,"")+"의 형태와 뜻을 친구에게 설명할 수 있다",g.name.replace(/<[^>]+>/g,"")+"의 틀리기 쉬운 포인트를 안다"]))
  .concat(["본문 속 문법 보너스를 확인했다"]);
 const C=W.chk||{};
 const done=items.filter((_,i)=>C[i]).length;
 h+=sec(4,"모두 체크되면 이 과는 완벽! (기기에 저장돼요)",`<div class="card"><div style="font-weight:800">완료 <span id="cn">${done}</span> / ${items.length}</div>
  <div class="bar"><i id="cb" style="width:${Math.round(done/items.length*100)}%"></i></div>
  <div class="chk">${items.map((t,i)=>`<label><input type="checkbox" data-c="${i}" ${C[i]?"checked":""}><span>${esc(t)}</span></label>`).join("")}</div></div>`);
 $("#main").innerHTML=h;
 bind();
}
function sec(i,desc,body){
 const nav=`<div class="nx">${i>0?`<button data-go="${i-1}">← ${STEPS[i-1][1]}</button>`:"<span></span>"}${i<4?`<button class="go" data-go="${i+1}">${STEPS[i+1][1]} →</button>`:""}</div>`;
 return `<section class="step ${i===S.s?"on":""}"><div class="sh"><span class="n">${STEPS[i][0]}</span><h2>${STEPS[i][1]}</h2></div><p style="margin:-4px 0 12px;color:var(--sub);font-size:13px">${desc}</p>${body}${nav}</section>`;
}
function go(i){S.s=i;document.querySelectorAll("section.step").forEach((e,j)=>e.classList.toggle("on",j===i));document.querySelectorAll(".st").forEach((e,j)=>e.classList.toggle("on",j===i));window.scrollTo({top:$("#steps").offsetTop-4,behavior:"smooth"})}
function url(){const u=new URL(location.href);u.searchParams.set("b",S.b);u.searchParams.set("l",S.l);history.replaceState(null,"",u)}
function bind(){
 document.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>{S.b=e.dataset.b;S.l="7";S.s=0;LS.set("m78s_b",S.b);url();render()});
 document.querySelectorAll("[data-l]").forEach(e=>e.onclick=()=>{S.l=e.dataset.l;S.s=0;url();render()});
 document.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>go(+e.dataset.s));
 document.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>go(+e.dataset.go));
 document.querySelectorAll("[data-h]").forEach(e=>e.onclick=()=>{S.hide=S.hide===e.dataset.h?"":e.dataset.h;const s=S.s;render();go(s)});
 document.querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>{const m=document.getElementById(e.dataset.m);m.classList.toggle("on");e.textContent=m.classList.contains("on")?"모범 설명 닫기":"모범 설명 보기"});
 document.querySelectorAll(".q").forEach(e=>e.onclick=()=>e.classList.toggle("on"));
 document.querySelectorAll("textarea[data-w]").forEach(e=>e.oninput=()=>{const W=LS.get(key(),{});W[e.dataset.w]=e.value;LS.set(key(),W)});
 document.querySelectorAll("[data-c]").forEach(e=>e.onchange=()=>{const W=LS.get(key(),{});W.chk=W.chk||{};W.chk[e.dataset.c]=e.checked;LS.set(key(),W);
  const all=document.querySelectorAll("[data-c]"),d=[...all].filter(x=>x.checked).length;$("#cn").textContent=d;$("#cb").style.width=Math.round(d/all.length*100)+"%"});
}
render();
</script>
</body>
</html>
