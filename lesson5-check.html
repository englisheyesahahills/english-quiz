/* ---------------------------------------------------------

--------------------------------------------------------- */
let state = null;
let view = "home";
let sessionData = {}; // 현재 화면의 임시 답안 저장용

function stateKey(name, cls){ return STORAGE_PREFIX + name + "__" + cls; }

function loadCurrentUser(){
  const raw = localStorage.getItem(CURRENT_KEY);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

function loadState(name, cls){
  const raw = localStorage.getItem(stateKey(name, cls));
  if(raw){
    try{ return JSON.parse(raw); }catch(e){ /* fallthrough */ }
  }
  return {name, classroom:cls, stages:{}};
}

function saveState(){
  localStorage.setItem(stateKey(state.name, state.classroom), JSON.stringify(state));
  localStorage.setItem(CURRENT_KEY, JSON.stringify({name:state.name, classroom:state.classroom}));
}

function switchUser(){
  localStorage.removeItem(CURRENT_KEY);
  state = null;
  view = "home";
  render();
}

function submitCheckpoint(stepNumber, scorePercent){
  const payload = {
    학생이름: state.name,
    반: state.classroom,
    현재단계: stepNumber,
    정답률: scorePercent,
    마지막제출시각: new Date().toISOString()
  };
  fetch(APPS_SCRIPT_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  }).catch(function(e){ console.error("checkpoint 전송 실패", e); });
}

function completeStage(key, scorePercent){
  const stageInfo = STAGES.find(function(s){ return s.key===key; });
  state.stages[key] = {
    done:true,
    score:scorePercent,
    date: new Date().toISOString().slice(0,10)
  };
  saveState();
  submitCheckpoint(stageInfo.step, scorePercent);
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }
function normalize(s){ return (s||"").toLowerCase().trim().replace(/[.!?'"]/g,"").replace(/\s+/g," "); }
function isCorrectShort(input, accepted){
  const n = normalize(input);
  if(!n) return false;
  return accepted.some(function(a){
    const na = normalize(a);
    return n===na || n.includes(na) || na.includes(n);
  });
}
function speak(text){
  if(!("speechSynthesis" in window)){
    alert("이 브라우저는 음성 재생을 지원하지 않아요.");
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

        <label>이름</label>
        <input id="inputName" type="text" placeholder="이름을 입력하세요" autocomplete="off">
      </div>
      <div class="field">
        <label>반</label>
        <select id="inputClass">
          <option value="" disabled selected>반을 선택하세요</option>
          <option value="중등부1">중등부1</option>
          <option value="중등부2">중등부2</option>
          <option value="중등부3">중등부3</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="handleLogin()">시작하기</button>
    </div>
  `;
}

function handleLogin(){
  const name = document.getElementById("inputName").value.trim();
  const cls = document.getElementById("inputClass").value.trim();
  if(!name || !cls){
    alert("이름과 반을 모두 입력해 주세요.");
    return;
  }
  state = loadState(name, cls);
  saveState();
  view = "home";
  render();
}

function renderHome(){
  let cards = STAGES.map(function(s){
    const st = state.stages[s.key];
    const badge = st && st.done
      ? `<span class="stage-badge badge-done">완료 ${st.score}%</span>`
      : `<span class="stage-badge badge-todo">진행전</span>`;
    return `
      <div class="stage-card" onclick="goStage('${s.key}')">
        ${badge}
        <span class="stage-icon">${s.icon}</span>
        <div class="stage-title">${s.title}</div>
        <div class="stage-desc">${s.desc}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="topbar">
      <div class="brand">잉글리시아이 <b>스텔라</b>영어학원</div>
      <div class="user-pill">${esc(state.name)} · ${esc(state.classroom)} <a href="#" onclick="switchUser();return false;">변경</a></div>
    </div>
    <h1>Lesson 5 확인학습</h1>
    <div class="subtitle">Have a Special Day! · 원하는 단계를 자유롭게 선택해 진행하세요.</div>
    <div class="stage-grid">${cards}</div>
  `;
}

function goStage(key){
  view = key;
  sessionData = {};
  render();
}
function goHome(){
  view = "home";
  render();
}

/* ---------------------------------------------------------
   ① 단어 확인
--------------------------------------------------------- */
function buildWordQuiz(){
  const pool = shuffle(VOCAB);
  const mcWords = pool.slice(0, 12);
  const saWords = pool.slice(12, 22);
  const mcQuestions = mcWords.map(function(w){
    const wrongPool = VOCAB.filter(function(v){ return v[0]!==w[0]; });
    const wrongs = sample(wrongPool, 3).map(function(v){ return v[1]; });
    const opts = shuffle([w[1]].concat(wrongs));
    return {en:w[0], correct:w[1], opts:opts};
  });
  return {mc:mcQuestions, sa:saWords.map(function(w){ return {en:w[0], kr:w[1]}; })};
}

function renderWordStage(){
  if(!sessionData.quiz) sessionData.quiz = buildWordQuiz();
  if(!sessionData.answers) sessionData.answers = {mc:{}, sa:{}};
  const quiz = sessionData.quiz;

  let mcHtml = quiz.mc.map(function(q, i){
    const optsHtml = q.opts.map(function(opt){
      const sel = sessionData.answers.mc[i]===opt ? "selected":"";
      return `<button type="button" class="opt ${sel}" onclick="selectMC(${i}, '${esc(opt).replace(/'/g,"\\'")}')">${esc(opt)}</button>`;
    }).join("");
    return `
      <div class="q">
        <div class="q-index">객관식 ${i+1} / ${quiz.mc.length}</div>
        <div class="q-text">"<b>${esc(q.en)}</b>"의 알맞은 뜻은?</div>
        ${optsHtml}
      </div>
    `;
  }).join("");

  let saHtml = quiz.sa.map(function(q, i){
    return `
      <div class="q">
        <div class="q-index">주관식 ${i+1} / ${quiz.sa.length}</div>
        <div class="q-text">뜻을 보고 영어 단어를 쓰세요: <b>${esc(q.kr)}</b></div>
        <input class="text-input" id="sa_${i}" type="text" placeholder="영어로 입력" value="${esc(sessionData.answers.sa[i]||'')}" oninput="sessionData.answers.sa[${i}]=this.value">
      </div>
    `;
  }).join("");

  return `
    ${backRow("① 단어 확인")}
    <div class="hint">워크북 전체 단어 중 무작위로 문제를 출제해요. 다시 들어오면 새로운 문제가 나와요.</div>
    <div class="section-label">객관식</div>
    ${mcHtml}
    <div class="section-label">주관식</div>
    ${saHtml}
    <button class="btn btn-primary btn-block" onclick="submitWordStage()">채점하기</button>
    <div id="wordResult"></div>
  `;
}
function selectMC(i, val){
  sessionData.answers.mc[i] = val;
  render();
}
function submitWordStage(){
  const quiz = sessionData.quiz;
  let correct = 0, total = quiz.mc.length + quiz.sa.length;
  quiz.mc.forEach(function(q, i){
    if(sessionData.answers.mc[i]===q.correct) correct++;
  });
  quiz.sa.forEach(function(q, i){
    if(isCorrectShort(sessionData.answers.sa[i], [q.en])) correct++;
  });
  const score = Math.round(correct/total*100);
  completeStage("word", score);
  document.getElementById("wordResult").innerHTML = resultBox(score, correct, total);
}

/* ---------------------------------------------------------
   ② 대화문 확인
--------------------------------------------------------- */
function renderDialogueStage(){
  if(!sessionData.answers) sessionData.answers = {tfKr:{}, tfEn:{}, blanks:{}};

  let dialogueHtml = DIALOGUES.map(function(d){
    return `<div class="card"><b>${esc(d.title)}</b><br><br>${d.lines.map(esc).join("<br>")}</div>`;
  }).join("");

  let tfKrHtml = DIALOGUE_TF_KR.map(function(item, i){
    return tfRow("tfKr", i, item[0]);
  }).join("");
  let tfEnHtml = DIALOGUE_TF_EN.map(function(item, i){
    return tfRow("tfEn", i, item[0]);
  }).join("");
  let blankHtml = DIALOGUE_BLANKS.map(function(item, i){
    return `
      <div class="q">
        <div class="q-index">빈칸 ${i+1}</div>
        <div class="q-text">${esc(item.q)}</div>
        <input class="text-input" id="blank_${i}" type="text" placeholder="영어 단어 입력" value="${esc(sessionData.answers.blanks[i]||'')}" oninput="sessionData.answers.blanks[${i}]=this.value">
      </div>
    `;
  }).join("");

  return `
    ${backRow("② 대화문 확인")}
    <div class="section-label">대화문</div>
    ${dialogueHtml}
    <div class="section-label">일치·불일치 (한글판)</div>
    ${tfKrHtml}
    <div class="section-label">일치·불일치 (영어판)</div>
    ${tfEnHtml}
    <div class="section-label">빈칸 채우기</div>
    ${blankHtml}
    <button class="btn btn-primary btn-block" onclick="submitDialogueStage()">채점하기</button>
    <div id="dialogueResult"></div>
  `;
}
function tfRow(group, i, text){
  const sel = sessionData.answers[group][i];
  return `
    <div class="q">
      <div class="q-text">${esc(text)}</div>
      <div class="tf-row">
        <button type="button" class="tf-btn ${sel===true?'selected':''}" onclick="setTF('${group}',${i},true)">O (맞음)</button>
        <button type="button" class="tf-btn ${sel===false?'selected':''}" onclick="setTF('${group}',${i},false)">X (틀림)</button>
      </div>
    </div>
  `;
}
function setTF(group, i, val){
  sessionData.answers[group][i] = val;
  render();
}
function submitDialogueStage(){
  let correct=0, total=0;
  DIALOGUE_TF_KR.forEach(function(item, i){
    total++;
    if(sessionData.answers.tfKr[i]===item[1]) correct++;
  });
  DIALOGUE_TF_EN.forEach(function(item, i){
    total++;
    if(sessionData.answers.tfEn[i]===item[1]) correct++;
  });
  DIALOGUE_BLANKS.forEach(function(item, i){
    total++;
    if(isCorrectShort(sessionData.answers.blanks[i], item.a)) correct++;
  });
  const score = Math.round(correct/total*100);
  completeStage("dialogue", score);
  document.getElementById("dialogueResult").innerHTML = resultBox(score, correct, total);
}

/* ---------------------------------------------------------
   ③ 본문 쉐도잉
--------------------------------------------------------- */
function renderShadowingStage(){
  if(!sessionData.checked) sessionData.checked = {};
  const total = READING.length;
  const checkedCount = Object.keys(sessionData.checked).filter(function(k){ return sessionData.checked[k]; }).length;
  const pct = Math.round(checkedCount/total*100);

  let rows = READING.map(function(sent, i){
    const checked = sessionData.checked[i] ? "checked" : "";
    return `
      <div class="sent-row">
        <div class="sent-num">${i+1}</div>
        <div class="sent-text">${esc(sent)}</div>
        <button class="speak-btn" onclick="speak('${esc(sent).replace(/'/g,"\\'")}')">🔊</button>
        <label class="check-wrap">
          <input type="checkbox" ${checked} onchange="toggleShadow(${i}, this.checked)"> 완료
        </label>
      </div>
    `;
  }).join("");

  return `
    ${backRow("③ 본문 쉐도잉 읽기")}
    <div class="hint">문장을 듣고 따라 읽은 뒤 완료 체크를 해주세요.</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="subtitle">${checkedCount} / ${total} 문장 완료 (${pct}%)</div>
    ${rows}
    <button class="btn btn-primary btn-block" onclick="submitShadowingStage()">완료하기</button>
    <div id="shadowResult"></div>
  `;
}
function toggleShadow(i, val){
  sessionData.checked[i] = val;
  render();
}
function submitShadowingStage(){
  const total = READING.length;
  const checkedCount = Object.keys(sessionData.checked).filter(function(k){ return sessionData.checked[k]; }).length;
  const score = Math.round(checkedCount/total*100);
  completeStage("shadowing", score);
  document.getElementById("shadowResult").innerHTML = resultBox(score, checkedCount, total, "문장 완료");
}

/* ---------------------------------------------------------
   ④ 본문 일치·불일치
--------------------------------------------------------- */
function renderTrueFalseStage(){
  if(!sessionData.answers) sessionData.answers = {kr:{}, en:{}};

  let readingHtml = `<div class="card">${READING.map(esc).join("<br>")}</div>`;
  let krHtml = TF_READING_KR.map(function(item, i){
    return tfRow2("kr", i, item[0]);
  }).join("");
  let enHtml = TF_READING_EN.map(function(item, i){
    return tfRow2("en", i, item[0]);
  }).join("");

  return `
    ${backRow("④ 본문 일치·불일치")}
    <div class="section-label">본문</div>
    ${readingHtml}
    <div class="section-label">일치·불일치 (한글판)</div>
    ${krHtml}
    <div class="section-label">일치·불일치 (영어판)</div>
    ${enHtml}
    <button class="btn btn-primary btn-block" onclick="submitTrueFalseStage()">채점하기</button>
    <div id="tfResult"></div>
  `;
}
function tfRow2(group, i, text){
  const sel = sessionData.answers[group][i];
  return `
    <div class="q">
      <div class="q-text">${esc(text)}</div>
      <div class="tf-row">
        <button type="button" class="tf-btn ${sel===true?'selected':''}" onclick="setTF2('${group}',${i},true)">O (맞음)</button>
        <button type="button" class="tf-btn ${sel===false?'selected':''}" onclick="setTF2('${group}',${i},false)">X (틀림)</button>
      </div>
    </div>
  `;
}
function setTF2(group, i, val){
  sessionData.answers[group][i] = val;
  render();
}
function submitTrueFalseStage(){
  let correct=0, total=0;
  TF_READING_KR.forEach(function(item, i){
    total++;
    if(sessionData.answers.kr[i]===item[1]) correct++;
  });
  TF_READING_EN.forEach(function(item, i){
    total++;
    if(sessionData.answers.en[i]===item[1]) correct++;
  });
  const score = Math.round(correct/total*100);
  completeStage("truefalse", score);
  document.getElementById("tfResult").innerHTML = resultBox(score, correct, total);
}

/* ---------------------------------------------------------
   ⑤ 본문 서술형
--------------------------------------------------------- */
function renderShortAnswerStage(){
  if(!sessionData.answers) sessionData.answers = {};
  let readingHtml = `<div class="card">${READING.map(esc).join("<br>")}</div>`;
  let qHtml = SHORT_ANSWER.map(function(item, i){
    return `
      <div class="q">
        <div class="q-index">${i+1}</div>
        <div class="q-text">${esc(item.q)}</div>
        <input class="text-input" id="short_${i}" type="text" placeholder="짧게 답해보세요" value="${esc(sessionData.answers[i]||'')}" oninput="sessionData.answers[${i}]=this.value">
      </div>
    `;
  }).join("");

  return `
    ${backRow("⑤ 본문 서술형")}
    <div class="section-label">본문</div>
    ${readingHtml}
    <div class="section-label">질문</div>
    ${qHtml}
    <button class="btn btn-primary btn-block" onclick="submitShortAnswerStage()">채점하기</button>
    <div id="shortResult"></div>
  `;
}
function submitShortAnswerStage(){
  let correct=0, total=SHORT_ANSWER.length;
  SHORT_ANSWER.forEach(function(item, i){
    if(isCorrectShort(sessionData.answers[i], item.a)) correct++;
  });
  const score = Math.round(correct/total*100);
  completeStage("shortanswer", score);
  document.getElementById("shortResult").innerHTML = resultBox(score, correct, total);
}

/* ---------------------------------------------------------
   ⑥ 본문 속 어법
--------------------------------------------------------- */
function renderGrammarStage(){
  if(!sessionData.answers) sessionData.answers = {};
  let qHtml = GRAMMAR.map(function(item, i){
    const optsHtml = item.opts.map(function(opt, oi){
      const sel = sessionData.answers[i]===oi ? "selected":"";
      return `<button type="button" class="opt ${sel}" onclick="selectGrammar(${i}, ${oi})">${esc(opt)}</button>`;
    }).join("");
    return `
      <div class="q">
        <div class="q-index">${i+1} / ${GRAMMAR.length}</div>
        <div class="q-text">${esc(item.q)}</div>
        ${optsHtml}
      </div>
    `;
  }).join("");

  return `
    ${backRow("⑥ 본문 속 어법")}
    <div class="hint">목적어로 쓰이는 to부정사 · 비인칭 주어 it 문제입니다.</div>
    ${qHtml}
    <button class="btn btn-primary btn-block" onclick="submitGrammarStage()">채점하기</button>
    <div id="grammarResult"></div>
  `;
}
function selectGrammar(i, oi){
  sessionData.answers[i] = oi;
  render();
}
function submitGrammarStage(){
  let correct=0, total=GRAMMAR.length;
  GRAMMAR.forEach(function(item, i){
    if(sessionData.answers[i]===item.a) correct++;
  });
  const score = Math.round(correct/total*100);
  completeStage("grammar", score);
  document.getElementById("grammarResult").innerHTML = resultBox(score, correct, total);
}

/* ---------------------------------------------------------
   공통 컴포넌트
--------------------------------------------------------- */
function backRow(title){
  return `
    <div class="backrow">
      <button class="backbtn" onclick="goHome()">← 홈으로</button>
      <h2 style="margin:0;">${esc(title)}</h2>
    </div>
  `;
}
function resultBox(score, correct, total, unit){
  unit = unit || "문항 정답";
  return `
    <div class="result-box">
      <div class="result-score">${score}점</div>
      <div class="result-sub">${correct} / ${total} ${unit}</div>
      <div class="sync-note">노션 체크포인트에 저장되었어요 ✅</div>
      <button class="btn btn-ghost btn-block" onclick="goHome()">홈으로 돌아가기</button>
    </div>
  `;
}

/* ---------------------------------------------------------
   렌더 디스패처
--------------------------------------------------------- */
function render(){
  const app = document.getElementById("app");
  if(!state){
    app.innerHTML = renderLogin();
    return;
  }
  let html = "";
  switch(view){
    case "home": html = renderHome(); break;
    case "word": html = renderWordStage(); break;
    case "dialogue": html = renderDialogueStage(); break;
    case "shadowing": html = renderShadowingStage(); break;
    case "truefalse": html = renderTrueFalseStage(); break;
    case "shortanswer": html = renderShortAnswerStage(); break;
    case "grammar": html = renderGrammarStage(); break;
    default: html = renderHome();
  }
  app.innerHTML = html;
}

/* ---------------------------------------------------------
   초기화
--------------------------------------------------------- */
(function init(){
  const cur = loadCurrentUser();
  if(cur && cur.name && cur.classroom){
    state = loadState(cur.name, cur.classroom);
  }
  render();
})();
</script>
