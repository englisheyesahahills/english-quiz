<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lumi's Story Show – The Crab Family</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#0E1230;font-family:'Jua',sans-serif;overflow:hidden}
.en{font-family:'Baloo 2',cursive}
#player{position:relative;width:100%;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}
#stage{position:relative;flex:1;overflow:hidden}
/* 배경 */
#bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:background .8s,filter .8s}
#bg.beach{background-image:linear-gradient(#8FD3FF 0%,#CFEFFF 55%,#F6D79A 55%,#E9BE6E 100%)}
#bg.rocks{background-image:linear-gradient(#8FD3FF 0%,#CFEFFF 50%,#6FC3E8 50%,#9AA6B8 100%)}
#bg.race{background-image:linear-gradient(#A7DBFF 0%,#E3F5FF 50%,#F6D79A 50%,#E0B260 100%)}
#bg.party{background-image:linear-gradient(#FFB3D1 0%,#FFE3F0 50%,#F6D79A 50%,#E9BE6E 100%)}
#bg.meadow{background-image:linear-gradient(#8FD3FF 0%,#CFEFFF 55%,#9EDB7A 55%,#6CBF55 100%)}
#bg.bushes{background-image:linear-gradient(#9FD8FF 0%,#D6F1FF 45%,#5DBB63 45%,#3E9A48 100%)}
#bg.start{background-image:linear-gradient(#A7DBFF 0%,#E3F5FF 58%,#B5873F 58%,#8E6A31 100%)}
#bg.carrot{background-image:linear-gradient(#FFD9A8 0%,#FFF0D6 55%,#8BC34A 55%,#5E9E2E 100%)}
#bg.sunset{background-image:linear-gradient(#FF9A5A 0%,#FFC28A 45%,#7CB342 62%,#4E8A2A 100%)}
#bg.finish{background-image:linear-gradient(#3B2A6E 0%,#8E4FB0 50%,#7CB342 62%,#4E8A2A 100%)}
#bg.night{background-image:linear-gradient(#0F1A4A 0%,#2A2F7A 62%,#E8F1FF 62%,#C9DCF5 100%)}
#bg.workshop{background-image:linear-gradient(#7A2E2E 0%,#B8573A 62%,#F3D9B1 62%,#E2C090 100%)}
#bg.snow{background-image:linear-gradient(#9FC9F2 0%,#D9ECFF 60%,#FFFFFF 60%,#E3EEFA 100%)}
#bg.house{background-image:linear-gradient(#3A2366 0%,#6B3FA0 62%,#E8F1FF 62%,#C9DCF5 100%)}
#bg.fog{background-image:linear-gradient(#5E6680 0%,#9AA2B8 62%,#D7DCE6 62%,#C0C7D4 100%)}
#bg.sky{background-image:linear-gradient(#05082A 0%,#1A2266 70%,#2E3A8A 100%)}
#bg.town{background-image:linear-gradient(#0B1240 0%,#26337A 66%,#F0F5FF 66%,#D3E0F5 100%)}
.snowfall{position:absolute;inset:-10% 0 0 0;pointer-events:none;z-index:1;background-image:radial-gradient(3px 3px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 80px 120px,#fff,transparent),radial-gradient(3px 3px at 150px 60px,#fff,transparent),radial-gradient(2px 2px at 220px 160px,#fff,transparent),radial-gradient(3px 3px at 300px 90px,#fff,transparent);background-size:340px 200px;animation:snow 9s linear infinite;opacity:.8}
@keyframes snow{to{background-position:40px 200px}}
#fogLayer{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 1s;background:radial-gradient(ellipse at 30% 40%,rgba(230,234,242,.95),rgba(200,206,220,.75) 60%),radial-gradient(ellipse at 70% 60%,rgba(240,240,248,.9),transparent 60%)}
#fogLayer.on{opacity:.88}
#topInfo{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;z-index:9;pointer-events:none}
#topInfo>div{background:rgba(255,255,255,.93);border-radius:30px;padding:4px 10px;font-size:14px;white-space:nowrap}
#nose{display:flex;align-items:center;gap:6px}
#noseBar{width:min(22vw,110px);height:10px;border-radius:6px;background:#F3D3D3;overflow:hidden}
#noseBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8A8A,#FF2D2D);transition:width .4s}
#noseDot{width:16px;height:16px;border-radius:50%;background:#C33;transition:.3s}
#noseDot.full{background:#FF2D2D;box-shadow:0 0 14px 6px rgba(255,45,45,.8)}
#combo{position:absolute;top:44px;left:50%;transform:translateX(-50%) scale(0);z-index:10;font-family:'Baloo 2';font-weight:800;font-size:26px;color:#FFD43B;text-shadow:0 3px 0 #C2410C;transition:transform .25s cubic-bezier(.5,1.8,.5,1);pointer-events:none}
#combo.on{transform:translateX(-50%) scale(1)}
/* 배우 */
#actors{position:absolute;inset:0;z-index:3;pointer-events:none}
.actor{position:absolute;width:var(--s);transition:left .9s cubic-bezier(.5,1.3,.5,1),bottom .9s,transform .5s,opacity .5s;pointer-events:auto}
.actor .pic{width:100%;display:block;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.actor .emo{display:block;font-size:calc(var(--s)*.78);line-height:1.1;text-align:center;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.actor .tag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:10px;padding:1px 7px;font-family:'Baloo 2';font-weight:800;font-size:12px;color:#5B4BD6;white-space:nowrap}
.actor .inner{animation:idle 2.6s ease-in-out infinite;transform-origin:50% 100%}
.actor.talk .inner{animation:talk .28s ease-in-out infinite alternate}
.actor.hop .inner{animation:hopA .55s ease-in-out infinite}
.actor.shake .inner{animation:wig .35s infinite}
.actor.sad .inner{animation:none;transform:rotate(-4deg) translateY(4px);filter:saturate(.6)}
.actor.glow .pic,.actor.glow .emo{filter:drop-shadow(0 0 18px rgba(255,40,40,.95)) drop-shadow(0 0 30px rgba(255,90,90,.7))}
.actor.fly .inner{animation:flyA 1.6s ease-in-out infinite}
.actor.flip .inner{scale:-1 1}
.actor.hidden{opacity:0}
@keyframes idle{50%{transform:translateY(-5px)}}
@keyframes talk{from{transform:scale(1,1)}to{transform:scale(1.04,.95) translateY(-3px)}}
@keyframes hopA{50%{transform:translateY(-28%)}}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes flyA{50%{transform:translateY(-14px) rotate(-3deg)}}
.bubble{position:absolute;z-index:8;background:#fff;border-radius:18px;padding:7px 13px;font-family:'Baloo 2';font-weight:800;font-size:min(5vw,22px);color:#2C2C54;box-shadow:0 5px 0 rgba(0,0,0,.15);max-width:58%;transform:translateX(-50%);animation:popIn .3s;pointer-events:none}
.bubble::after{content:'';position:absolute;left:50%;bottom:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
.bubble.kid{background:#FFF3B0;outline:3px dashed #FF9A3C}
.bubble.kid::after{border-top-color:#FFF3B0}
/* 메인 그림 */
#objWrap{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(0);transition:transform .6s cubic-bezier(.5,1.7,.5,1);z-index:4;text-align:center;pointer-events:none}
#objWrap.show{transform:translate(-50%,-50%) scale(1)}
#splash{position:absolute;left:50%;top:44%;width:min(46vw,250px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 0 8px rgba(255,255,255,.35),inset 0 -14px 0 rgba(0,0,0,.08)}
#obj{position:relative;width:min(36vw,190px);height:min(36vw,190px);display:flex;align-items:center;justify-content:center;font-size:min(25vw,140px);line-height:1}
#obj img{max-width:100%;max-height:100%}
#word{position:relative;font-size:min(10vw,58px);font-weight:800;margin-top:-4px;opacity:0;transform:translateY(20px);transition:.5s;color:#C8102E;text-shadow:0 4px 0 #fff}
#word.show{opacity:1;transform:none}
#layer{position:absolute;inset:0;z-index:6;pointer-events:none}
#layer>*{pointer-events:auto}
.big{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:min(30vw,160px);cursor:pointer;line-height:1}
.shakeBox{animation:shk .5s infinite}
@keyframes shk{25%{transform:translate(-50%,-50%) rotate(-8deg)}75%{transform:translate(-50%,-50%) rotate(8deg)}}
.boom{animation:boom .4s forwards}
@keyframes boom{to{transform:translate(-50%,-50%) scale(2);opacity:0}}
.cards{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);display:flex;gap:min(2vw,14px);width:98%;justify-content:center;flex-wrap:wrap}
.cards.mid{bottom:auto;top:30%}
@media (max-aspect-ratio:3/4){.cards{bottom:27%}}
.card{width:min(22vw,165px);aspect-ratio:1;border-radius:26px;background:#fff;border:none;box-shadow:0 7px 0 rgba(0,0,0,.18);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(13vw,78px);line-height:1;animation:popIn .4s backwards;position:relative;padding:6px;overflow:hidden}
.card img{width:84%;height:68%;object-fit:contain}
.card small{font-family:'Baloo 2';font-weight:800;font-size:min(4.6vw,28px);color:#5B4BD6;margin-top:4px;line-height:1.05}
.card.txt{width:auto;min-width:min(44vw,220px);aspect-ratio:auto;padding:14px 18px;font-size:min(5.6vw,28px);font-family:'Baloo 2';font-weight:800;color:#2C2C54}
.card.right{background:#D7FBEA;transform:scale(1.08)}
.card.gone{visibility:hidden}
.card .num{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:#FF6B6B;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2'}
.wrong{animation:shk2 .4s}
@keyframes shk2{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes popIn{from{transform:scale(0)}}
.yns{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);display:flex;gap:min(8vw,46px)}
.yn{width:min(25vw,120px);aspect-ratio:1;border-radius:28px;border:none;color:#fff;font-family:'Baloo 2';font-weight:800;font-size:min(7vw,30px);box-shadow:0 7px 0 rgba(0,0,0,.25);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:popIn .4s backwards}
.yn span{font-size:1.5em;line-height:1}
.cover{position:absolute;inset:0;background:#2C2C80;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:min(8vw,40px);gap:10px}
.cover b{font-family:'Baloo 2';font-size:min(22vw,120px);line-height:1}
.action{position:absolute;right:5%;top:22%;text-align:center;font-size:min(20vw,110px);animation:actPop .6s infinite alternate}
.action div{font-family:'Baloo 2';font-weight:800;font-size:min(7vw,34px);color:#FFD43B;text-shadow:0 3px 0 #7A2E2E}
@keyframes actPop{to{transform:scale(1.12) rotate(5deg)}}
/* 사다리 */
.ladder{position:absolute;left:50%;top:18%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:8px;align-items:center;width:92%}
.ladder div{background:rgba(255,255,255,.35);color:#fff;border-radius:16px;padding:7px 14px;font-family:'Baloo 2';font-weight:800;font-size:min(5.6vw,26px);transition:.4s;border:3px solid transparent}
.ladder div.on{background:#fff;color:#C8102E;border-color:#FFD43B;transform:scale(1.06)}
.ladder div.done{background:#FFD43B;color:#7A2E2E}
.ladder .top{font-size:min(10vw,50px);background:none!important;border:none!important}
/* 게임 요소 */
.door{position:absolute;left:50%;top:40%;width:min(46vw,220px);height:min(60vw,290px);transform:translate(-50%,-50%);perspective:600px}
.door .behind{position:absolute;inset:0;background:#FFF6E0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:min(26vw,130px);overflow:hidden}
.door .behind img{width:90%;height:90%;object-fit:contain}
.door .panel{position:absolute;inset:0;background:linear-gradient(#B0462E,#7A2E1E);border-radius:14px;border:6px solid #5A1E10;transform-origin:left center;transition:transform .7s;display:flex;align-items:center;justify-content:center;font-size:40px;color:#FFD43B;cursor:pointer}
.door .panel::after{content:'';position:absolute;right:16px;top:50%;width:16px;height:16px;border-radius:50%;background:#FFD43B}
.door.peek .panel{transform:rotateY(-40deg)}
.door.open .panel{transform:rotateY(-105deg)}
.tree{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(56vw,270px);height:min(64vw,310px)}
.tree .t{position:absolute;inset:0;font-size:min(60vw,290px);line-height:1;text-align:center}
.tree .orn{position:absolute;font-size:min(9vw,42px);animation:popIn .4s}
.tray{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;gap:min(3vw,14px);background:rgba(255,255,255,.85);border-radius:24px;padding:8px 12px}
.tray span{font-size:min(11vw,52px);cursor:pointer;transition:transform .3s,opacity .3s}
.tray span.used{opacity:.2;transform:scale(.6)}
.spot{position:absolute;cursor:pointer;font-size:min(16vw,80px);line-height:1;transition:transform .5s}
.spot.open{transform:translateX(50%) rotate(15deg);opacity:.6}
.found{position:absolute;width:min(20vw,100px);transform:scale(0);transition:transform .5s cubic-bezier(.5,1.8,.5,1);z-index:2}
.found.show{transform:scale(1)}
.found img{width:100%}.found span{font-size:min(16vw,80px)}
.cloudBtn{position:absolute;width:min(34vw,170px);height:min(20vw,100px);border-radius:60px;background:rgba(236,240,248,.97);box-shadow:0 0 30px 20px rgba(236,240,248,.8);cursor:pointer;transition:transform .5s,opacity .5s;z-index:3}
.cloudBtn.gone{transform:translateX(120vw);opacity:0}
.dark{position:absolute;inset:0;z-index:5;background:radial-gradient(circle min(22vw,110px) at var(--x,50%) var(--y,50%),rgba(255,60,60,.08),rgba(5,8,30,.97) 70%);touch-action:none}
.hiddenItem{position:absolute;font-size:min(14vw,70px);cursor:pointer;z-index:4;line-height:1}
.hiddenItem img{width:min(18vw,90px)}
.sleigh{position:absolute;left:4%;top:16%;width:min(40vw,200px);z-index:4;animation:flyA 1.6s ease-in-out infinite}
.sleigh img{width:100%}.sleigh span{font-size:min(18vw,90px)}
.houses{position:absolute;left:0;bottom:6%;display:flex;gap:min(16vw,90px);animation:scroll 14s linear forwards;padding-left:55vw}
@keyframes scroll{to{transform:translateX(calc(-100% + 0px))}}
.houses span{font-size:min(18vw,90px);cursor:pointer;position:relative}
.houses span.got::after{content:'🎁';position:absolute;left:30%;top:-30%;font-size:.5em}
.timer{position:absolute;right:4%;top:14%;width:min(18vw,80px);aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:min(9vw,40px);box-shadow:0 5px 0 rgba(0,0,0,.2);z-index:7}
.giftDrop{position:absolute;font-size:min(13vw,62px);cursor:pointer;animation:popIn .3s;z-index:6}
.sfxPad{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);display:flex;gap:10px}
.sfxPad button{width:min(17vw,76px);aspect-ratio:1;border-radius:20px;border:none;background:#fff;font-size:min(9vw,40px);box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.shadow{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:min(92vw,620px);background:rgba(255,255,255,.96);border-radius:26px;padding:14px 16px 16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.2);animation:popIn .4s}
.shadow .steps{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.shadow .steps span{background:#EEF0FA;color:#8A8FB8;border-radius:14px;padding:3px 9px;font-size:min(3.4vw,15px);transition:.3s}
.shadow .steps span.on{background:#C8102E;color:#fff;transform:scale(1.08)}
.shadow .steps span.done{background:#2FB67C;color:#fff}
.shadow .line{font-family:'Baloo 2';font-weight:800;font-size:min(7vw,40px);color:#2C2C54;line-height:1.15}
.shadow .ko{font-size:min(4vw,18px);color:#8A7563;margin-top:4px}
.shadow .cnt{font-size:13px;color:#9A9AB8;margin-top:6px}
.qtitle{position:absolute;left:50%;top:13%;transform:translateX(-50%);background:#FFD43B;color:#7A2E2E;border-radius:20px;padding:6px 16px;font-size:min(4.6vw,22px);white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.2);animation:popIn .3s}
.replay{position:absolute;right:4%;top:22%;width:min(16vw,72px);aspect-ratio:1;border-radius:50%;border:none;background:#fff;font-size:min(8vw,34px);box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.arr{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(94vw,720px);text-align:center}
.arr .slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;min-height:min(14vw,66px);background:rgba(255,255,255,.88);border-radius:22px;padding:10px;margin-bottom:16px}
.arr .slot{min-width:min(16vw,80px);border-bottom:4px dashed #C9CCF2;font-family:'Baloo 2';font-weight:800;font-size:min(7vw,38px);color:#2C2C54;padding:0 6px}
.arr .slot.fill{border-bottom-color:#2FB67C;animation:popIn .3s}
.arr .chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.arr .chip{border:none;border-radius:18px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);padding:10px 16px;font-family:'Baloo 2';font-weight:800;font-size:min(7vw,38px);color:#5B4BD6;cursor:pointer;animation:popIn .4s backwards}
.arr .chip.used{visibility:hidden}
#me{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:8px auto 0;font-size:15px}
#me .chipMe{background:rgba(255,255,255,.16);border-radius:18px;padding:5px 12px}
#me button{background:#FFD43B;color:#7A2E2E;border:none;border-radius:16px;padding:6px 12px;font-family:'Jua';font-size:14px;cursor:pointer}
#me button.ghost{background:none;color:#B8BCE0;text-decoration:underline;padding:4px}
#login{position:absolute;inset:0;z-index:45;background:linear-gradient(#0F1A4A,#3B2A6E);display:none;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:10px;color:#fff;padding:16px;text-align:center}
#login h2{font-size:min(6vw,26px);color:#FFE28A}
#login .dots{display:flex;gap:12px;margin:4px 0}
#login .dots i{width:min(11vw,48px);height:min(13vw,58px);border-radius:14px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:'Baloo 2';font-weight:800;font-size:min(8vw,34px)}
#login .pad{display:grid;grid-template-columns:repeat(3,min(21vw,92px));gap:10px}
#login .pad button{height:min(15vw,66px);border:none;border-radius:18px;background:#fff;color:#2C2C54;font-family:'Baloo 2';font-weight:800;font-size:min(8vw,32px);box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
#login .pad button.ok{background:#2FB67C;color:#fff;font-size:min(6vw,24px)}
#login .msg{min-height:22px;color:#FFB4B4;font-size:15px}
#login .names{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#login .names button{border:none;border-radius:18px;background:#FFD43B;color:#7A2E2E;font-family:'Jua';font-size:min(6vw,24px);padding:12px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#login .guest{background:none;border:none;color:#B8BCE0;text-decoration:underline;font-family:'Jua';font-size:14px;cursor:pointer;margin-top:4px}
.ptToast{position:absolute;left:50%;top:70%;transform:translateX(-50%);background:#2FB67C;color:#fff;border-radius:18px;padding:8px 16px;font-size:16px;z-index:15;animation:popIn .4s}
.rv{position:absolute;left:50%;top:13%;transform:translateX(-50%);width:min(94vw,760px);text-align:center}
.rv .row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rv .mini{width:min(14vw,74px);aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:min(6vw,30px);position:relative;transition:.3s}
.rv .mini img{width:76%;height:62%;object-fit:contain}.rv .mini small{font-family:'Baloo 2';font-weight:800;font-size:min(2.6vw,12px);color:#5B4BD6}
.rv .mini.on{background:#FFD43B;transform:scale(1.12)}.rv .mini.ok::after{content:'✓';position:absolute;top:-6px;right:-4px;background:#2FB67C;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;line-height:20px}
.rv .big{position:relative;left:auto;top:auto;transform:none;margin:0 auto;width:min(70vw,420px);background:#fff;border-radius:28px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.2);animation:popIn .4s;cursor:default;font-size:min(22vw,120px)}
.rv .big .pic{height:min(30vw,170px);display:flex;align-items:center;justify-content:center}.rv .big .pic img{max-height:100%;max-width:90%}
.rv .big .w{font-family:'Baloo 2';font-weight:800;font-size:min(11vw,60px);color:#C8102E;line-height:1.1}
.rv .big .s{font-family:'Baloo 2';font-weight:800;font-size:min(7.6vw,44px);color:#2C2C54;line-height:1.2;padding:10px 4px}

<script>
/* =====================================================================

const IMG_DIR='img/';
const imgSrc=f=>IMG_DIR+f+(f.includes('bg_')?'.jpg':'.png');

  baby1:['crab/baby_crab1','🦀','Baby Crab 1'], baby2:['crab/baby_crab2','🦀','Baby Crab 2'], babies:['crab/babies_run','🦀','Baby Crabs'], family:['crab/crab_family_hug','🦀','Crab Family'],
  hermit:['crab/hermit_crab','🐚','Hermit Crab'], hermit_small:['crab/hermit_small','🐚','Hermit Crab'], hermit_new:['crab/hermit_new','🐚','Hermit Crab'], hermit_fast:['crab/hermit_fast','🐚','Hermit Crab'],
  starfish:['crab/starfish','⭐','Starfish'], narrator:['narrator','🦝','Narrator'],
  shell_small:['crab/shell_small','🐚','small shell'], shell_pretty:['crab/shell_pretty','🐚','pretty shell'], shell:['crab/golden_shell','🐚','golden shell'],
};
const BG={beach:'crab/bg_beach',rocks:'crab/bg_rocks',race:'crab/bg_race',sunset:'crab/bg_sunset',party:'crab/bg_party'};
const OK=new Set();
function preload(){ const files=[...Object.values(A).map(a=>a[0]),...Object.values(BG)];
  files.forEach(f=>{ const im=new Image(); im.onload=()=>{OK.add(f); if(f==='lumi_wave') renderHome(); if(f.startsWith('bg_')&&$('bg').className&&BG[$('bg').className]===f) setBG($('bg').className);}; im.src=imgSrc(f); }); }

/* =====================================================================

const SOUNDS={ ho:['ho','hoe','how','hope','oh','who'], ha:['ha','hah','haha','ah'], hee:['hee','he','hi','he he'],

  crab:['crab','crabs','grab','crap','cab'], hermit:['hermit','permit','her mit','hermet'], starfish:['starfish','star fish','star'], sea:['sea','see','she'], beach:['beach','bitch','peach','each'],
  house:['house','hours','how'], small:['small','smile','mall'], big:['big','pig','bake'], pretty:['pretty','pity','petty'], nice:['nice','nights','rice'], left:['left','lift','laughed'], right:['right','write','bright','light'],
  sideways:['sideways','side','size'], forward:['forward','for word','four'], sorry:['sorry','sorry','story'], sing:['sing','sink','thing'], sad:['sad','said','set'], my:['my','mine','oh my'],
  come:['come','calm','common'], mommy:['mommy','mom','mami','mummy'], okay:['okay','ok','kay'], together:['together','gather'], show:['show','shoe','so'], family:['family','families'], faster:['faster','fast'], new:['new','knew','now'],

function heardMatch(t,key){ const l=SOUNDS[key]||[key]; return l.some(w=>t.includes(w))||(key.length>4&&t.includes(key.slice(0,4))); }

/* =====================================================================
   효과음 & 음악 (자동 생성)

let AC=null,DRY=false;
function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t0,d,type='sine',v=.25,f2){ if(DRY) return; const a=ac(),o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,a.currentTime+t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+d); g.gain.setValueAtTime(v,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+d);

const NOTE=(()=>{ const m={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11}; return s=>{ const k=s.match(/^([A-G]#?)(\d)$/); return 440*Math.pow(2,(m[k[1]]+12*(+k[2]+1)-69)/12); }; })();

const AUDIO_DIR='audio/crab/', AUDIO_SHARED=['audio/rabbit/','audio/rudolph/']; // 칭찬·안내 등 공통 음성은 토끼·루돌프 폴더 것을 같이 씀
const VOICE={lumi:{p:1.35,r:.88,n:'루미'},narr:{p:1.0,r:.86,n:'해설'},mommy:{p:1.0,r:.85,n:'엄마 게'},baby1:{p:1.7,r:.95,n:'아기 게 1'},baby2:{p:1.9,r:.97,n:'아기 게 2'},hermit:{p:1.4,r:.92,n:'소라게'},starfish:{p:1.6,r:.95,n:'불가사리'}};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,46);
const missing=new Set(); let voice=null,curAudio=null,usingTTS=false;
function pickVoice(){ const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  for(const p of [/Natural|Neural/i,/Samantha/i,/Google US English/i,/Aria|Jenny|Ava|Allison/i,/Karen|Moira/i]){ const v=vs.find(v=>p.test(v.name)); if(v) return v; } return vs[0]||null; }
if('speechSynthesis' in window){ voice=pickVoice(); speechSynthesis.onvoiceschanged=()=>voice=pickVoice(); }
function tts(text,v='lumi',mod={}){ if(!('speechSynthesis' in window)) return new Promise(r=>setTimeout(r,1500));
  return new Promise(res=>{ speechSynthesis.cancel(); usingTTS=true; const V=VOICE[v]||VOICE.lumi;
    const u=new SpeechSynthesisUtterance(text.replace(/\.\.\./g,', ')); if(voice) u.voice=voice; u.lang='en-US'; u.rate=mod.r||V.r; u.pitch=mod.p||V.p; u.volume=mod.vol||1;
    let done=false; const t0=Date.now(),minMs=500+text.length*55; const fin=()=>{ if(done)return; done=true; usingTTS=false; const l=minMs-(Date.now()-t0); l>0?setTimeout(res,l):res(); };
    u.onend=u.onerror=fin; setTimeout(fin,2200+text.length*140); speechSynthesis.speak(u); }); }
// mp3 한 개 재생 (rate·volume 조절 가능). 실패하면 false
async function tryFile(file,rate=1,vol=1){ for(const d of [AUDIO_DIR,...AUDIO_SHARED]){ if(await tryOne(d,file,rate,vol)) return true; } return false; }
function tryOne(dir,file,rate=1,vol=1){ const key=dir+file; if(missing.has(key)) return Promise.resolve(false);
  return new Promise(res=>{ const a=new Audio(dir+file+'.mp3'); a.playbackRate=rate; a.volume=vol; a.preservesPitch=false; a.mozPreservesPitch=false; a.webkitPreservesPitch=false;
    curAudio=a; let ok=false; a.onplaying=()=>ok=true; a.onended=()=>{curAudio=null;res(true)};
    const fb=()=>{ if(ok){curAudio=null;res(true);return;} missing.add(key);curAudio=null;res(false)}; a.onerror=fb; a.play().catch(fb); }); }
async function playFile(file,text,v,mod){
  if(mod){ // 여러 목소리 놀이: 같은 문장 mp3를 높낮이·빠르기만 바꿔서 재생
    const s=slug(text), rate=Math.min(1.35,Math.max(.75,1+((mod.p||1)-1)*.3))*Math.min(1.1,Math.max(.9,mod.r?mod.r/0.9:1));
    for(const f of [s,'mommy_'+s,'baby1_'+s,'baby2_'+s,'hermit_'+s,'starfish_'+s,'narr_'+s]){ if(await tryFile(f,rate,mod.vol||1)) return; }
    return tts(text,v,mod); }

  const say=async (en,ko,o={})=>{ const v=o.v||(o.who&&cast[o.who]?voiceOf(cast[o.who].dataset.key):'lumi'); const file=(v==='lumi'?'':v+'_')+slug(en);

    const spk=o.who?cast[o.who]:cast.lumi; let bub=null; if(o.who&&o.bubble!==false) bub=bubbleOn(o.who,en);
    spk&&spk.classList.add('talk'); await playFile(file,en,v,o.mod); spk&&spk.classList.remove('talk'); bub&&bub.remove(); alive(); await sleep(180); };
  const ring=(label,face,cls)=>{ $('ring').className='ring '+(cls||''); $('turnFace').textContent=face; $('turnLabel').innerHTML=label; $('yourTurn').classList.add('on'); };
  const ringOff=()=>{ $('yourTurn').classList.remove('on'); $('ringArc').style.strokeDashoffset=0; };

  const respond=async (key,ms=5500,label,alsoDone)=>{ if(DRY) return false; alive();
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    ring((label||'말해 볼까요?')+'<small>🎤 누르면 녹음 → 내 목소리 듣기</small>','🎤'); let heard=false,wantRec=false,rec=null; $('turnFace').onclick=()=>wantRec=true;
    if(SR&&key){ try{ rec=new SR(); rec.lang='en-US'; rec.maxAlternatives=5; rec.interimResults=true; rec.continuous=true;
      rec.onresult=e=>{ for(const r of e.results) for(const alt of r) if(heardMatch(alt.transcript.toLowerCase(),key)) heard=true; }; rec.onerror=()=>{}; rec.start(); }catch(e){rec=null} }
    try{ await until(()=>heard||wantRec||(alsoDone&&alsoDone()),ms,t=>$('ringArc').style.strokeDashoffset=289*(t/ms)); } finally{ try{rec&&rec.stop()}catch(e){} }
    if(wantRec&&!heard){ // 마이크 버튼: 녹음 → 내 목소리 다시 듣기
      ringOff(); const url=await record(3500);
      if(url){ SFX.ding(); addStar(); hit(); await say("Listen! This is you!","들어 봐! 네 목소리야!"); await playClip(url,1); burst('84%','66%'); }
      return !!url; }
    if(heard||!SR){ spoke(); }
    if(heard){ $('ring').className='ring heard'; $('turnFace').textContent='👂'; SFX.ding(); burst('84%','66%'); addStar(); hit(); await sleep(550); }
    ringOff(); return heard; };
  // 아이가 캐릭터 대사를 말하는 차례
  const kidLine=async (line,ko,key,as,mv)=>{ alive(); let b=null; if(as&&cast[as]){ b=bubbleOn(as,line,true); }
    const v=mv||(as&&cast[as]?voiceOf(cast[as].dataset.key):'lumi');
    await say("Your turn!","네 차례!"); await say(line,ko,{v,bubble:false});
    const ok=await respond(key,6500,`${line}<small>${ko}</small>`); b&&b.remove();

    try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); r=new MediaRecorder(stream); const ch=[]; r.ondataavailable=e=>ch.push(e.data);

    catch(e){ if(e===STOP) throw e; ringOff(); return null; } finally{ if(r&&r.state==='recording') r.stop(); if(stream) stream.getTracks().forEach(t=>t.stop()); } };

  const els=items.map((it,i)=>{ const h=el(`<div class="hiddenItem" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${it.e}</div>`); h.onclick=()=>{ if(h.dataset.f) return; h.dataset.f=1; h.style.filter='drop-shadow(0 0 16px #FFD43B)'; found++; SFX.sparkle(); hit(); }; return h; });
  const mv=e=>{ const r=$('stage').getBoundingClientRect(),p=e.touches?e.touches[0]:e; d.style.setProperty('--x',(p.clientX-r.left)+'px'); d.style.setProperty('--y',(p.clientY-r.top)+'px'); };
  d.addEventListener('pointermove',mv); d.addEventListener('pointerdown',e=>{ mv(e); d.style.pointerEvents='none'; const t=document.elementFromPoint(e.clientX,e.clientY); d.style.pointerEvents=''; if(t&&t.classList.contains('hiddenItem')) t.click(); });

    await c.kidLine(`I see a ${items[i].w}!`,`${items[i].ko}이(가) 보여!`,items[i].key); }
  d.remove(); els.forEach(e=>e.remove()); burst(); addStar(2); }

// 🧩 퀴즈 & 문장 배열 (모든 소리는 피시오디오 mp3)
function optCard(o){ const [k,w]=o; return A[k]?{k,w:w||A[k][2]}:{k:k,face:k,w:w||''}; }
async function chooseQ(c,{title,cards,ans,play,after}){ const t=el(`<div class="qtitle">${title}</div>`);
  const box=el(`<div class="cards mid">${cards.map((o,i)=>`<button class="card" style="animation-delay:${i*.07}s" data-k="${o.k}">${o.face||cardFace(o.k)}${o.w?`<small>${o.w}</small>`:''}</button>`).join('')}</div>`);
  const rp=el(`<button class="replay" title="다시 듣기">🔊</button>`); let busy=false; rp.onclick=async()=>{ if(busy) return; busy=true; try{ await play(); }catch(e){} busy=false; };
  let ok=false,tries=0; [...box.children].forEach(b=>b.onclick=()=>{ if(ok) return; if(b.dataset.k===ans){ ok=true; b.classList.add('right'); SFX.ding(); burst(); addStar(); hit(); } else { tries++; SFX.boop(); shakeEl(b); miss(); } });
  await play(); await c.until(()=>ok,25000); if(!ok){ ok=true; box.querySelector(`[data-k="${ans}"]`).classList.add('right'); }
  await c.sleep(500); rp.remove(); if(after) await after(); await c.sleep(300); box.remove(); t.remove(); }
async function arrange(c,[text,v]){ const words=text.split(' '); let order=shuffle(words.map((w,i)=>i)); if(words.length>1&&order.every((x,i)=>x===i)) order=order.reverse();
  const t=el(`<div class="qtitle">🧩 듣고 순서대로 눌러요</div>`);
  const a=el(`<div class="arr"><div class="slots">${words.map(()=>`<span class="slot">&nbsp;</span>`).join('')}</div><div class="chips">${order.map((i,n)=>`<button class="chip" style="animation-delay:${n*.08}s" data-i="${i}">${words[i]}</button>`).join('')}</div></div>`);
  const slots=[...a.querySelectorAll('.slot')]; let next=0;
  const rp=el(`<button class="replay" title="다시 듣기">🔊</button>`); let busy=false; const play=()=>c.say(text,'',{v,nosub:true}); rp.onclick=async()=>{ if(busy) return; busy=true; try{ await play(); }catch(e){} busy=false; };
  a.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ if(b.classList.contains('used')) return; const i=+b.dataset.i;
    if(words[i]===words[next]){ b.classList.add('used'); slots[next].textContent=words[i]; slots[next].classList.add('fill'); next++; SFX.pop(); hit(); if(next===words.length){ SFX.tada(); burst('50%','28%'); addStar(2); } } else { SFX.boop(); shakeEl(b); miss(); } });
  await play(); await c.until(()=>next>=words.length,40000);
  if(next<words.length){ words.forEach((w,i)=>{ slots[i].textContent=w; slots[i].classList.add('fill'); }); }
  rp.remove(); await c.sleep(400); await c.say(text,'',{v}); await c.sleep(400); a.remove(); t.remove(); }

async function quizTime(c,Q){ if(DRY||!Q) return; clearCast(); lumiIn(4); SFX.chime();
  const t0=el(`<div class="qtitle" style="top:40%;font-size:min(7vw,36px)">🧩 Quiz Time!</div>`); await c.sleep(1500); t0.remove();
  for(const [text,v,opts] of Q.L){ const cards=shuffle(opts.map(optCard)); const ans=optCard(opts[0]).k;
    await chooseQ(c,{title:'🎧 잘 듣고 맞는 그림을 눌러요',cards,ans,play:()=>c.say(text,'',{v:v||'lumi',nosub:true}),after:()=>c.say(text,'',{v:v||'lumi'})}); }
  for(const [text,v,who] of Q.W){ const ans=who||WHO_KEY[v]; const pool=FRIENDS.filter(k=>k!==ans);
    const cards=shuffle([ans,...shuffle(pool).slice(0,2)]).map(k=>({k,w:A[k][2]}));
    await chooseQ(c,{title:'💬 누가 말했을까요?',cards,ans,play:async()=>{ await c.say(text,'',{v,nosub:true}); await c.say("Who said it?","누가 말했을까?"); },after:()=>c.say(text,'',{v})}); }
  for(const it of Q.A) await arrange(c,it);
  await c.praise(); }

// 📖 오늘 배운 단어·문장 읽기: 카드를 보고 먼저 읽어요 → 맞는 소리 듣기
function readKey(t){ const w=t.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(x=>x.length>2&&!['the','and','you','are','she','his','her','can','will'].includes(x));
  return (w.find(x=>SOUNDS[x])||w.sort((a,b)=>b.length-a.length)[0]||'crab'); }
async function readReview(c,u){ if(DRY) return; clearCast(); lumiIn(2); const W=WORDS[u.n]||[], S=SHADOW[u.n]||[];

  const box=el(`<div class="rv"><div class="lab">📖 오늘 배운 단어</div><div class="row">${W.map(([w,k])=>`<div class="mini">${pic(k)}<small>${w}</small></div>`).join('')}</div><div class="stage"></div></div>`);
  const minis=[...box.querySelectorAll('.mini')], st=box.querySelector('.stage');
  SFX.chime(); await c.sleep(1200);
  for(let i=0;i<W.length;i++){ const [w,k,a,v]=W[i]; minis.forEach(m=>m.classList.remove('on')); minis[i].classList.add('on');
    st.innerHTML=`<div class="big"><div class="pic">${pic(k)}</div><div class="w">${w}</div></div>`;

    if(a) await c.say(a,'',{v:v||'lumi'}); minis[i].classList.add('ok'); SFX.ding(); await c.sleep(300); }
  minis.forEach(m=>m.classList.remove('on'));
  box.querySelector('.lab').textContent='📖 오늘 배운 문장';
  for(let i=0;i<S.length;i++){ const [en,ko,v]=S[i];
    st.innerHTML=`<div class="big" style="width:min(88vw,640px)"><div class="s">${en}</div><div class="ko">${ko}</div><div class="ko" style="margin-top:4px;font-size:13px">${i+1} / ${S.length}</div></div>`;

    await c.say(en,ko,{v:v||'lumi'}); SFX.ding(); addStar(); await c.sleep(400); }

  const st=[...box.querySelectorAll('.steps span')], step=i=>st.forEach((x,k)=>x.className=k<i?'done':(k===i?'on':''));
  SFX.chime(); await c.sleep(1800);
  for(let i=0;i<list.length;i++){ const [en,ko,v]=list[i];
    box.querySelector('.line').textContent=en; box.querySelector('.ko').textContent=ko; box.querySelector('.cnt').textContent=`${i+1} / ${list.length}`;
    step(0); await c.sleep(400); await c.say(en,ko,{v:v||'lumi'});
    step(1); $('ring').className='ring'; $('turnFace').textContent='👄'; $('turnLabel').innerHTML='같이 말해요!<small>루미랑 동시에</small>'; $('yourTurn').classList.add('on');
    await c.sleep(300); await c.say(en,ko,{v:v||'lumi'}); $('yourTurn').classList.remove('on');
    step(2); SFX.ding(); const url=await c.record(Math.max(2500,1200+en.length*90));
    step(3); if(url){ await c.say("Listen! This is you!","들어 봐! 네 목소리야!"); await c.playClip(url,1); await c.sleep(300); await c.say(en,ko,{v:v||'lumi'}); addStar(); hit(); }
    st.forEach(x=>x.className='done'); burst('50%','24%'); await c.sleep(600); }
  box.remove(); await c.praise(); }

// 바위 뒤 숨바꼭질
async function rockHide(c,keys){ setBG('rocks'); const spots=[[6,22],[30,14],[56,22],[78,14]]; let found=0; const ord=shuffle(keys.slice());
  const items=spots.slice(0,ord.length).map(([x,y],i)=>{ const k=ord[i];
    const f=el(`<div class="found" style="left:${x+3}%;bottom:${y+6}%">${OK.has(A[k][0])?`<img src="${IMG_DIR}${A[k][0]}.png">`:`<span>${A[k][1]}</span>`}</div>`);
    const s=el(`<div class="spot" style="left:${x}%;bottom:${y}%">🪨</div>`); s.dataset.k=k;
    s.onclick=()=>{ if(s.classList.contains('open')) return; s.classList.add('open'); f.classList.add('show'); SFX.pop(); found++; s.dataset.hit=1; hit(); }; return s; });
  await c.say("Touch to find!","눌러서 찾아 봐!");
  const said=new Set();
  for(let k=0;k<ord.length;k++){ const before=found; await c.waitTap(()=>found>before,"Touch to find!","눌러서 찾아 봐!");
    const s=items.find(s=>s.dataset.hit&&!said.has(s.dataset.k))||items.find(s=>!said.has(s.dataset.k)); const who=s.dataset.k; said.add(who);
    await c.say(HI[who],'',{v:voiceOf(who)}); }
  if(DRY) for(const w of Object.keys(HI)) await c.say(HI[w],'',{v:voiceOf(w)});
  await c.praise(); layer.innerHTML=''; }

function resetScene(){ layer.innerHTML=''; clearCast(); music(false); stopAudio(); hideObj(); $('fogLayer').classList.remove('on');
  $('yourTurn').classList.remove('on'); $('praise').classList.remove('on'); $('sub').classList.remove('on','up'); $('sub').innerHTML=''; }
function setProg(){ [...$('prog').children].forEach((d,i)=>d.firstChild.style.width=i<chapterIdx?'100%':(i===chapterIdx?'50%':'0')); $('chap').textContent=curU.parts[chapterIdx][0]; }
let pendU=0;
function hearT(n,i){ const [en,,v]=SHADOW[n][i]; ac(); tryFile((v&&v!=='lumi'?v+'_':'')+slug(en)); }
async function todaySentences(c,u){ const L=SHADOW[u.n]||[]; await c.say("Today's sentences!","오늘의 문장!"); if(DRY){ for(const [en,ko,v] of L) await c.say(en,ko,{v:v||'lumi'}); return; } clearCast(); lumiIn(2);
  const box=el(`<div class="today"><b>🎯 오늘의 문장</b>${L.map(([en,ko])=>`<div>${en}<small>${ko}</small></div>`).join('')}</div>`); const rows=[...box.querySelectorAll('div')];
  SFX.chime(); await c.sleep(1200);
  for(let i=0;i<L.length;i++){ const [en,ko,v]=L[i]; rows.forEach((r,k)=>r.className=k<i?'done':(k===i?'on':''));
    await c.say(en,ko,{v:v||'lumi',nosub:true}); await c.kidLine(en,ko,en.toLowerCase().replace(/[^a-z ]/g,'').split(' ').filter(w=>w.length>2)[0]||'',null,v||'lumi'); }
  rows.forEach(r=>r.className=''); await c.sleep(800); box.remove(); await c.praise(); }
function openUnit(n){ if(RUDOLPH_API&&!user&&!guest){ pendU=n; showLogin(); return; } const u=UNITS[n-1]; curU=u; runId++; resetScene(); paused=false; $('pauseCover').style.display='none'; setBG(u.bg);
  $('home').style.display='none'; const it=$('intro'); it.style.display='flex'; it.style.background=`linear-gradient(135deg,${u.color},#1A2266)`;
  $('introIc').textContent=u.icon; $('introNo').textContent=`UNIT ${u.n} · ${u.pg}`; $('introT').textContent=u.title; $('introK').innerHTML=`${u.ko}<br><span style="font-size:13px;opacity:.85">${u.words}</span>`;
  $('introS').innerHTML='<b>🎯 오늘의 문장</b>'+(SHADOW[u.n]||[]).map(([en,ko,v],i)=>`<div onclick="hearT(${u.n},${i})"><i>🔊</i><span>${en}<small>${ko}</small></span></div>`).join('');
  $('introBtn').onclick=()=>{ it.style.display='none'; sessionSpoken=0; sessionStars=0; combo=0; play(0); };
  $('unitTag').textContent=`${u.icon} U${u.n}`; $('stars').textContent=store.stars;
  $('prog').innerHTML=u.parts.map((_,i)=>`<div onclick="play(${i})"><i></i></div>`).join(''); $('chap').textContent='';
  try{ history.replaceState(null,'','#u'+n) }catch(e){} }
async function play(i){ ac(); bgmStart(); $('intro').style.display='none'; const id=++runId; paused=false; waiters.splice(0).forEach(r=>r());
  $('pauseCover').style.display='none'; $('ppBtn').textContent='⏸'; resetScene();
  for(chapterIdx=i;chapterIdx<curU.parts.length;chapterIdx++){ if(id!==runId) return; setProg(); layer.innerHTML=''; $('fogLayer').classList.remove('on');
    try{ await curU.parts[chapterIdx][1](mkCtx(id),curU); }catch(e){ if(e===STOP) return; console.error(e); } }
  if(id===runId){ chapterIdx=curU.parts.length-1; [...$('prog').children].forEach(d=>d.firstChild.style.width='100%'); } }
function togglePause(){ if(!curU||$('home').style.display!=='none'||$('intro').style.display==='flex') return;
  paused=!paused; $('ppBtn').textContent=paused?'▶':'⏸'; $('pauseCover').style.display=paused?'flex':'none';
  if(paused){ if(curAudio) curAudio.pause(); if(usingTTS) speechSynthesis.pause(); } else { if(curAudio) curAudio.play().catch(()=>{}); if(usingTTS) speechSynthesis.resume(); waiters.splice(0).forEach(r=>r()); } }
$('pauseCover').onclick=togglePause;
function skip(){ if(curU&&chapterIdx<curU.parts.length-1) play(chapterIdx+1); }
function goHome(){ runId++; resetScene(); paused=false; $('pauseCover').style.display='none'; $('intro').style.display='none'; renderHome(); $('home').style.display='block'; try{ history.replaceState(null,'',location.pathname) }catch(e){} }
function renderHome(){ const pos=[[18,47],[30,36],[30,60],[42,28],[44,50],[44,70],[56,22],[58,42],[58,62],[60,80],[72,34],[72,58]];

  $('stats').innerHTML=`<div>🐚 금빛 조개 ${all}/8</div><div>⭐ ${store.stars}</div><div>🗣️ 말한 문장 ${store.spoken}</div>`;
  $('units').innerHTML=UNITS.map(u=>`<button class="unit" style="--c:${u.color}" onclick="openUnit(${u.n})"><span class="no">U${u.n}</span>${store.done[u.n]?'<span class="done">✅</span>':''}

  ['😄','If You\'re Happy and You Know It','행복하면 손뼉 쳐','If You\'re Happy and You Know It Super Simple Songs'],
  ['🌊','Sea Animals Song','바다 동물 노래','sea animals song for kids'],
  ['⬅️','Left and Right Song','왼쪽 오른쪽 노래','left and right song for kids']];
function renderSongs(){ $('songs').innerHTML=SONG_LINKS.map(([i,t,k,q])=>`<a class="song" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}"><span class="si">${i}</span><span><b>${t}</b><small>${k} · YouTube ▶</small></span></a>`).join(''); }

/* 선생님 안내: 대본을 미리 훑어서 녹음 문장 목록 자동 생성 */
async function openTeacher(){ DRY=true; const keep=curU;
  for(const u of UNITS){ curU=u; for(const [,fn] of u.parts){ try{ await fn(mkCtx(-1),u); }catch(e){} } layer.innerHTML=''; clearCast(); }
  DRY=false; curU=keep; resetScene(); const base=location.href.split('#')[0];
  let h=`<button onclick="this.parentElement.style.display='none'" style="float:right;border:none;background:#eee;border-radius:8px;padding:4px 10px">닫기</button>
  <b>🔗 Unit별 바로가기 링크</b> (수업한 날 해당 링크만 보내 주세요)<br>`+UNITS.map(u=>`U${u.n} ${u.pg} → <code>${base}#u${u.n}</code>`).join('<br>')+
  `<h4>🖼️ 이미지 파일 (img/crab 폴더: 캐릭터 PNG, 배경 JPG)</h4>`+[...new Set(Object.values(A).map(a=>a[0]))].map(f=>`<code>${f}.png</code>${OK.has(f)?' ✅':''}`).join(' ')+'<br>배경: '+Object.values(BG).map(f=>`<code>${f}.jpg</code>${OK.has(f)?' ✅':''}`).join(' ')+
  `<h4>🎙️ 음성 파일 (audio/crab 폴더, 공통 음성은 audio/rabbit · audio/rudolph)</h4>파일 이름 앞이 역할이에요: mommy_ 엄마 게, baby1_ 아기 게 1, baby2_ 아기 게 2, hermit_ 소라게, starfish_ 불가사리, narr_ 해설, 앞에 없으면 루미. 총 ${LINES.size}문장`;
  let last=-1; for(const [f,[en,ko,n,v]] of LINES){ if(n!==last){ h+=`<h4>UNIT ${n}</h4>`; last=n; } h+=`<code>${f}.mp3</code> [${VOICE[v].n}] ${en}${ko?` <span style="color:#999">(${ko})</span>`:''}<br>`; }
  $('tpanel').innerHTML=h; $('tpanel').style.display='block'; }

preload(); renderHome(); renderSongs(); $('stars').textContent=store.stars; $('bgmBtn').textContent=bgmOn?'🎵':'🔇';
setTimeout(()=>{ const m=location.hash.match(/^#u(\d{1,2})$/); if(m&&+m[1]>=1&&+m[1]<=UNITS.length) openUnit(+m[1]); else if(RUDOLPH_API&&!user) showLogin(); },300);
</script>
