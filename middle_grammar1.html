<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중등문법1 | STELLA GRAMMAR LAB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#1f2a5a; --navy2:#2e3d7a; --peri:#5b6bb5; --peri-l:#e8ebf8;
  --burg:#8a1c3b; --burg-l:#fbe9ee; --cream:#fffbea; --paper:#ffffff;
  --ink:#1d2033; --sub:#5d6380; --line:#e3e1d3;
  --ok:#1f8a5b; --ok-l:#e5f6ee; --ng:#c0392b; --ng-l:#fdecea; --gold:#e0a526;
  --r:16px; --shadow:0 2px 10px rgba(31,42,90,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.6;word-break:keep-all}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{font-weight:900;letter-spacing:.5px;font-size:17px;line-height:1.1}
.logo small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:0}
.top .sp{flex:1}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.15)}
.pill.t{background:var(--burg)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);font-size:18px;display:grid;place-items:center}
main{padding:18px 0 110px}
/* cards */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid #efeadb}
.h1{font-size:24px;font-weight:900;margin:0 0 4px;color:var(--navy)}
.h2{font-size:19px;font-weight:800;margin:0 0 10px;color:var(--navy)}
.h3{font-size:16px;font-weight:800;margin:14px 0 8px;color:var(--navy2)}
.muted{color:var(--sub);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--peri-l);color:var(--peri);margin-right:4px}
.tag.b{background:var(--burg-l);color:var(--burg)}
.tag.g{background:var(--ok-l);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:800;background:var(--navy);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.burg{background:var(--burg)}
.btn.ghost{background:var(--peri-l);color:var(--navy)}
.btn.line{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
/* hero */
.hero{background:linear-gradient(135deg,var(--navy),var(--peri));color:#fff;border-radius:22px;padding:24px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h1{margin:0;font-size:26px;font-weight:900;line-height:1.25}
.hero p{margin:8px 0 0;opacity:.9;font-size:14px}
.hero .star{position:absolute;right:-10px;top:-20px;font-size:120px;opacity:.12}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mode{background:#fff;border-radius:18px;padding:18px 14px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent}
.mode b{display:block;font-size:18px;color:var(--navy)}
.mode span{font-size:13px;color:var(--sub)}
.mode .em{font-size:30px;display:block;margin-bottom:6px}
.mode.t{border-color:var(--burg-l)}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.unit{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px 12px;border:1px solid var(--line);font-size:14px}
.unit .n{font-weight:900;color:var(--peri);font-size:18px;min-width:26px}
.unit.on{border:2px solid var(--navy);background:var(--peri-l)}
.unit{text-align:left;width:100%}
.unit.off{opacity:.55}
.irr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.iv{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:15px}
.iv small{width:100%;color:var(--sub);font-size:12px}
.unitbar .chip.on{background:var(--burg);border-color:var(--burg)}
.unit .s{margin-left:auto;font-size:11px;color:var(--sub)}
/* chips & tabs */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:var(--sub)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px}
.bnav button{padding:8px 0 10px;font-size:12px;font-weight:700;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.bnav button i{font-style:normal;font-size:22px;line-height:1.2}
.bnav button.on{color:var(--navy)}
.bnav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--burg)}
.badge{position:absolute;top:4px;right:calc(50% - 22px);background:var(--burg);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 6px;min-width:18px;line-height:18px}
.ttabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:none;padding:10px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:14px;color:var(--sub)}
.ttabs button.on{background:var(--burg);color:#fff;border-color:var(--burg)}
/* concept */
.core{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px}
.core small{display:block;opacity:.7;font-size:12px;font-weight:600;margin-bottom:2px}
table.t{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}
table.t th,table.t td{border:1px solid var(--line);padding:8px 8px;text-align:center}
table.t th{background:var(--peri-l);color:var(--navy);font-weight:800}
table.t td.l{text-align:left}
.be{color:var(--burg);font-weight:900}
.pt{border-left:4px solid var(--peri);background:#f8f9fe;border-radius:0 12px 12px 0;padding:10px 12px;margin:8px 0}
.pt b{color:var(--navy)}
.ex{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:none}
.ex .en{font-weight:700;font-size:16px}
.ex .ko{font-size:14px;color:var(--sub)}
.ex .tx{flex:1}
.say{flex:none;width:38px;height:38px;border-radius:50%;background:var(--peri-l);font-size:17px;display:grid;place-items:center}
.warn{background:var(--burg-l);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px}
.warn b{color:var(--burg)}
.ox{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.ox .q{font-weight:700;margin-bottom:8px}
.ox .row button{flex:1;min-height:44px;border-radius:10px;background:var(--peri-l);font-weight:900;font-size:18px}
.ox .fb{margin-top:8px;font-size:14px}
/* quiz */
.prog{height:8px;background:#ece8d8;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--peri),var(--burg));border-radius:99px;transition:width .3s}
.qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qno{font-weight:900;color:var(--burg);font-size:18px;margin-right:4px}
.qtext{font-size:17px;font-weight:800;margin:4px 0 10px}
.box{border:1.5px solid var(--navy2);border-radius:12px;padding:12px 14px;margin:8px 0 12px;background:#fdfdff;font-size:16px;line-height:1.75}
.box table{width:100%;border-collapse:collapse}
.box td,.box th{border:1px solid var(--line);padding:6px;text-align:center;font-size:14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin-bottom:8px;font-size:16px;line-height:1.45}
.opt .c{font-weight:900;color:var(--peri);flex:none}
.opt.sel{border-color:var(--navy);background:var(--peri-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--ng);background:var(--ng-l)}
.slot{min-height:64px;border:2px dashed var(--peri);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#f8f9fe;margin-bottom:10px}
.slot:empty::before{content:"아래 단어를 순서대로 눌러 문장을 만드세요";color:#9aa0bd;font-size:14px;padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.w{padding:10px 14px;border-radius:10px;background:#fff;border:1.5px solid var(--navy2);font-weight:700;font-size:16px}
.slot .w{background:var(--navy);color:#fff}
.w.used{opacity:.25;pointer-events:none}
.end{font-weight:900;font-size:20px;color:var(--navy)}
.tok{display:inline-block;padding:7px 10px;margin:3px 2px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:16px}
.tok.sel{border-color:var(--ng);background:var(--ng-l);color:var(--ng);text-decoration:line-through}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none}
.inp:focus{border-color:var(--peri)}
textarea.inp{min-height:92px;resize:vertical;line-height:1.5}
.bl{display:inline-block;width:110px;padding:6px 8px;margin:0 4px;border-radius:8px;border:1.5px solid var(--peri);text-align:center;font-weight:700}
.fb-box{border-radius:14px;padding:14px;margin-top:12px}
.fb-box.ok{background:var(--ok-l);border:1.5px solid var(--ok)}
.fb-box.ng{background:var(--ng-l);border:1.5px solid var(--ng)}
.fb-box .t{font-weight:900;font-size:18px;margin-bottom:6px}
.fb-box.ok .t{color:var(--ok)}
.fb-box.ng .t{color:var(--ng)}
.ansl{background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0;font-weight:700}
.exp{font-size:15px;line-height:1.7}
.exp b{color:var(--burg)}
.stick{position:sticky;bottom:72px;padding-top:8px;background:linear-gradient(transparent,var(--cream) 30%)}
.score{text-align:center;padding:10px 0}
.score .big{font-size:52px;font-weight:900;color:var(--navy);line-height:1}
.bar{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.bar .lb{width:92px;flex:none;font-weight:700}
.bar .tr{flex:1;height:12px;background:#eee8d6;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--peri)}
.bar .v{width:48px;text-align:right;font-weight:800}
.wl{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0;font-size:14px;background:#fff}
/* mission */
.mcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid #efeadb}
.mcard .ic{font-size:30px}
.mcard b{display:block;color:var(--navy);font-size:16px}
.step{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff}
.step.done{border-color:var(--ok);background:#fbfffd}
.step.lock{opacity:.45}
.step .sh{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--navy);margin-bottom:6px}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.step.done .num{background:var(--ok)}
.given{display:inline-block;background:var(--peri-l);border-radius:8px;padding:3px 9px;font-weight:700;margin:2px;font-size:14px}
.myans{background:var(--ok-l);border-radius:10px;padding:9px 12px;font-weight:700;margin:6px 0}
.rules{margin:8px 0 0;padding:0;list-style:none;font-size:14px}
.rules li{padding:4px 0}
/* teacher */
.board{background:#23463a;color:#f4f1e4;border-radius:16px;padding:20px;border:10px solid #7a5a3a;font-family:"Pretendard",monospace;white-space:pre-wrap;font-size:17px;line-height:1.75;font-weight:600;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.board .hl{color:#ffe27a}
.board{white-space:pre;overflow-x:auto}
.bigboard{font-size:clamp(16px,2.3vw,28px)}
.bigex .row>.btn{flex:1 1 45%}
.bigex{background:#fff;border-radius:16px;padding:24px;text-align:center;margin-top:14px}
.bigex .en{font-size:clamp(24px,4.4vw,46px);font-weight:900;color:var(--navy);line-height:1.3}
.bigex .ko{font-size:clamp(16px,2.4vw,24px);color:var(--sub);margin-top:8px}
ul.tl{padding-left:20px;margin:6px 0}
ul.tl li{margin:5px 0}
.mis{display:grid;grid-template-columns:1fr;gap:6px;font-size:15px}
.mis div{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.mis s{color:var(--ng)}
.mis .r{color:var(--ok);font-weight:800}
.flow{border-left:3px solid var(--peri);padding-left:14px;margin:8px 0}
.flow .it{position:relative;margin-bottom:12px}
.flow .it::before{content:"";position:absolute;left:-21px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--burg)}
.flow .tm{font-weight:900;color:var(--burg);font-size:13px}
.keyq{border-bottom:1px solid var(--line);padding:12px 0}
.keyq:last-child{border-bottom:none}
.pinbox{display:flex;gap:8px;margin-top:10px}
.pinbox .inp{flex:1}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:24px 0 8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.ratio{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;font-size:13px}
.ratio .r{text-align:right}
.ratio .rbar{grid-column:1/3;height:10px;border-radius:99px;background:var(--burg);overflow:hidden}
.ratio .rbar i{display:block;height:100%;background:var(--ok)}
.stepbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stepbar::-webkit-scrollbar{display:none}
.stepbar button{flex:none;display:flex;align-items:center;gap:4px;padding:8px 11px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:17px}
.stepbar button span{font-size:12px;font-weight:900;color:var(--sub)}
.stepbar button.s{border-bottom:4px solid var(--ok)}
.stepbar button.t{border-bottom:4px solid var(--burg)}
.stepbar button.on{background:var(--navy);border-color:var(--navy)}
.stepbar button.on span,.stepbar button.on em{color:#fff}
.stepbar em{font-style:normal;font-size:12px;font-weight:800;color:var(--navy)}
@media (max-width:600px){.stepbar em{display:none}.stepbar{display:grid;grid-template-columns:repeat(4,1fr)}.stepbar button{justify-content:center}}
@media (min-width:601px){.chips,.ttabs{flex-wrap:wrap;overflow:visible}}
.stage{background:#fff;border-radius:20px;padding:18px;box-shadow:var(--shadow);border:1px solid #efeadb}
.sthead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who{font-weight:900;font-size:13px;padding:4px 10px;border-radius:99px}
.who.s{background:var(--ok-l);color:var(--ok)}
.who.t{background:var(--burg-l);color:var(--burg)}
.tguide{background:#fff8e1;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tguide summary{font-weight:800;cursor:pointer;color:#8a6200}
.tguide div{margin-top:6px}
.stagebox{background:#f8f9fe;border-radius:16px;padding:14px}
.stagebox.model{background:var(--ok-l);margin-top:10px}
.stagebox.center{text-align:center;padding:26px 14px}
.frame{font-size:clamp(18px,2.6vw,28px);font-weight:700;padding:10px 4px;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frame:last-child{border-bottom:none}
.frame b{color:var(--burg)}
.frame.sm{font-size:clamp(16px,2.1vw,22px)}
.en2{font-size:.85em;color:var(--navy2)}
.bigq{font-size:clamp(26px,4.6vw,52px);font-weight:900;color:var(--navy);line-height:1.3;margin:10px 0}
.biga{font-size:clamp(22px,3.6vw,40px);font-weight:900;color:var(--ok);line-height:1.3}
.biga.sm{font-size:18px;margin-top:4px}
.hintbar{background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;text-align:center;margin-bottom:10px;font-size:clamp(15px,2vw,22px)}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bingo>div{border:2px solid var(--navy2);border-radius:12px;padding:10px 8px;font-weight:800;font-size:clamp(13px,1.9vw,19px);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;background:#fff}
.bingo .nm{font-weight:500;color:var(--sub);font-size:12px;margin-top:6px}
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);padding-bottom:env(safe-area-inset-bottom)}
.tbar .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tbar button{color:#fff;padding:9px 0 11px;font-weight:800;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tbar button i{font-style:normal;font-size:20px}
.tbar button.on{background:rgba(255,255,255,.14)}
.tpanel{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:31;width:min(94vw,520px);background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.pickno{text-align:center;font-size:72px;font-weight:900;color:var(--burg);line-height:1.1;margin:10px 0}
.pickno small{font-size:20px;color:var(--navy)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.team{border-radius:14px;padding:12px;text-align:center;font-weight:900}
.team.A{background:var(--peri-l);color:var(--navy)}
.team.B{background:var(--burg-l);color:var(--burg)}
.team.C{background:var(--ok-l);color:var(--ok)}
.team.D{background:#fff3d6;color:#9a6a00}
.sc4{font-size:12px;letter-spacing:-.2px}
.sc4 b{font-size:14px;color:#ffd27a}
.setsw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.setsw button{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left}
.setsw b{display:block;color:var(--navy);font-size:15px}
.setsw span{font-size:12px;color:var(--sub)}
.setsw .on{border-color:var(--navy);background:var(--peri-l)}
.setsw .on.adv{border-color:var(--burg);background:var(--burg-l)}
.setsw .on.adv b{color:var(--burg)}
.anslines{border-bottom:1px solid #999;height:30px;margin:4px 0}
.team .pt2{font-size:40px;line-height:1.1}
.team .btn{min-height:40px;padding:0 8px}
@media (max-width:420px){.bingo{grid-template-columns:1fr 1fr}}
@media print{.tbar,.tpanel{display:none!important}}
@media (max-width:420px){
  .modes{grid-template-columns:1fr}
  .units{grid-template-columns:1fr}
  .hero h1{font-size:23px}
  .card{padding:15px}
}
@media print{
  .top,.bnav,.noprint,.ttabs,.chips{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  main{padding:0}
}
</style>
</head>

<header class="top"><div class="wrap">

      ['Jiho and Mina like K-pop.','지호와 미나는 K-pop을 좋아한다.']
    ],
    ox:[['My brother watchs TV every night.',false,'-ch로 끝나는 동사 → <b>watches</b>'],
        ['They play soccer after school.',true,'They(복수) → 동사원형 play']]
  },
  teacher:{
    board:`일반동사 현재형 = 습관 · 반복 · 사실

 I · You · We · They · 복수  →  동사원형
 He · She · It · 단수        →  동사 + s / es

 +s       play → plays   read → reads
 +es      watch → watches   go → goes
 y → ies  study → studies   cry → cries
 ★ have → has

★ be동사 + 일반동사 ✗  (She is likes ✗)`,
    intro:['"나는 축구를 한다 / 그는 축구를 한다" — 우리말은 똑같은데 영어는 왜 play / plays로 다를까?',
           '학생 2명에게 매일 하는 일을 묻고 → 다른 학생이 "He / She ___s ~"로 전달하게 하며 -s 필요성을 느끼게 하기'],
    script:['① 일반동사 = be동사·조동사를 뺀 동사. 동작(run, eat)과 상태(like, have, know) 모두 포함.',
            '② 현재형은 습관·반복·일반적 사실 → every day, always, usually, on Sundays와 함께.',
            '③ 3인칭 단수 주어(he, she, it, 단수명사, 이름 한 명)일 때만 -s/-es. I와 you는 3인칭이 아니다!',
            '④ 철자 규칙: +s / -s·-x·-ch·-sh·-o → +es / 자음+y → ies / 모음+y → +s.',
            '⑤ have → has (불규칙). do → does, go → goes 발음 주의 [dʌz], [goʊz].',
            '⑥ be동사와 일반동사 동시 사용 금지: She is likes ✗ → 문장에 동사는 하나!'],
    examples:[
      ['I walk to school every day.','나는 매일 걸어서 학교에 간다.'],
      ['My sister plays the piano well.','내 여동생은 피아노를 잘 친다.'],
      ['He watches movies on weekends.','그는 주말마다 영화를 본다.'],
      ['The bus leaves at 8:10.','그 버스는 8시 10분에 출발한다.'],
      ['My grandma lives in Daegu.','우리 할머니는 대구에 사신다.'],
      ['She tries her best every time.','그녀는 매번 최선을 다한다.'],
      ['Our teacher teaches us science.','우리 선생님은 우리에게 과학을 가르쳐 주신다.'],
      ['My dog has brown eyes.','우리 개는 갈색 눈을 가지고 있다.'],
      ['It snows a lot in Gangwon-do.','강원도에는 눈이 많이 온다.'],
      ['Mr. Park fixes computers.','박 선생님은 컴퓨터를 고치신다.'],
      ['The children enjoy the game.','아이들은 그 게임을 즐긴다.'],
      ['He does his homework after dinner.','그는 저녁 식사 후에 숙제를 한다.']
    ],
    mistakes:[['She is likes music.','She likes music.','be동사와 일반동사 함께 ✗'],
              ['My brother watchs TV.','My brother watches TV.','-ch → +es'],
              ['He studys hard.','He studies hard.','자음+y → ies'],
              ['My dad haves a car.','My dad has a car.','have → has'],
              ['Tom and Mina plays tennis.','Tom and Mina play tennis.','A and B는 복수 → 원형']],
    exam:['3인칭 단수 -s/-es/-ies 철자 (watches, studies, has)','A and B 주어 / The children 주어 → 동사원형','be동사 + 일반동사 중복 오류','빈칸에 들어갈 말이 나머지와 다른 것 (does / do)'],
    activity:'【-s 릴레이 · 5분】 교사가 동사 카드(study, watch, play, have…)를 보여주면 1번 학생이 "I ___", 2번 학생이 "My friend ___s"로 이어 말하기. 철자 규칙별(s / es / ies / has)로 분단을 나눠 맞힐 때마다 팀 점수.',
    check:[['My mom ___ (wash) the dishes.','washes — -sh로 끝나면 +es'],
           ['The children ___ (play) outside.','play — children은 복수'],
           ['He ___ (have) two sisters.','has — have의 3인칭 단수']]
  }
},
{ no:'06', title:'일반동사 현재형 부정문·의문문', short:'현재 부정·의문',
  student:{
    core:'일반동사 문장의 부정문은 <b>don\'t / doesn\'t + 동사원형</b>, 의문문은 <b>Do / Does + 주어 + 동사원형 ~?</b>으로 만들어요.',
    table:`<table class="t"><tr><th>주어</th><th>부정문</th><th>의문문</th></tr>
      <tr><td>I / You / We / They<br><small>복수</small></td><td class="be">don't + 원형</td><td class="be">Do + 주어 + 원형?</td></tr>
      <tr><td>He / She / It<br><small>단수</small></td><td class="be">doesn't + 원형</td><td class="be">Does + 주어 + 원형?</td></tr></table>
      <table class="t"><tr><th>대답</th><th>모양</th></tr>
      <tr><td>Do you ~?</td><td class="l">Yes, I do. / No, I don't.</td></tr>
      <tr><td>Does he ~?</td><td class="l">Yes, he does. / No, he doesn't.</td></tr></table>`,
    points:[
      ['부정문: <b>doesn\'t</b>가 -s를 가져가요 → 동사는 <b>원형</b>!', ["She doesn't like carrots.",'그녀는 당근을 좋아하지 않는다.']],
      ['의문문: <b>Does</b>가 -s를 가져가요 → 동사는 <b>원형</b>!', ['Does your brother play the guitar?','너희 형은 기타를 치니?']],
    ],
    tips:[
      '<b>doesn\'t 뒤에 -s ✗</b> → She doesn\'t <s>likes</s> <b>like</b> milk.',
      '<b>Does 뒤에도 원형!</b> → Does he <s>plays</s> <b>play</b> soccer?',
      '<b>has도 원형 have로!</b> → Does she <b>have</b> a phone? / He doesn\'t <b>have</b> time.',
      '<b>be동사 문장과 구별!</b> → <b>Are</b> you hungry? (be동사) / <b>Do</b> you like pizza? (일반동사)'
    ],
    examples:[
      ["I don't eat breakfast.",'나는 아침을 먹지 않는다.'],
      ["We don't live in Seoul.",'우리는 서울에 살지 않는다.'],
      ["He doesn't have a bike.",'그는 자전거가 없다.'],
      ["My sister doesn't wear glasses.",'내 여동생은 안경을 쓰지 않는다.'],
      ['Do you like spicy food?','너는 매운 음식을 좋아하니?'],
      ['Yes, I do. / No, I don\'t.','응, 좋아해. / 아니, 안 좋아해.'],
      ['Does your mom drive?','너희 엄마는 운전하시니?'],
      ['Yes, she does.','응, 하셔.'],
      ['Do your friends play games?','너의 친구들은 게임을 하니?'],
      ["No, they don't.",'아니, 안 해.']
    ],
    ox:[["She doesn't likes milk.",false,"doesn't 뒤에는 원형 → <b>She doesn't like milk.</b>"],
        ['Does your brother have a car?',true,'Does + 주어 + 원형(have)']]
  },
  teacher:{
    board:`일반동사 부정문 · 의문문 = do / does의 도움!

 부정  I · You · We · They  →  don't   + 원형
       He · She · It        →  doesn't + 원형

 의문  Do   + I / you / we / they + 원형 ~?
       Does + he / she / it       + 원형 ~?

 대답  Yes, 대명사 + do / does.
       No,  대명사 + don't / doesn't.

★ doesn't / Does가 -s를 가져간다 → 동사는 원형!`,
    intro:['"He likes cats."를 부정문으로 → 학생 답 수집 (He not likes? He doesn\'t likes?) → 오답을 남겨 두고 시작',
           '"Are you hungry?"와 "Do you hungry?" 중 맞는 것은? → be동사 vs 일반동사 구별부터 확인'],
    script:['① 일반동사는 혼자 부정·의문을 못 만든다 → 조동사 do/does가 도와준다 (be동사와의 차이).',
            '② 주어가 3인칭 단수면 does / doesn\'t. "-s는 한 문장에 한 번만" → does가 -s를 가져가므로 동사는 원형.',
            '③ has → 부정·의문에서는 have로 (He doesn\'t have / Does he have).',
            '④ 대답: Do로 물으면 do로, Does로 물으면 does로. 주어는 대명사로 바꾸기.',
            '⑤ do가 본동사일 때: Do you do your homework? / He doesn\'t do the dishes. — do가 두 번 나와도 정상!',
            '⑥ be동사 문장과 섞인 문제가 내신 단골: 문장의 동사가 be인지 일반동사인지 먼저 표시.'],
    examples:[
      ["I don't like horror movies.",'나는 공포 영화를 좋아하지 않는다.'],
      ["They don't know the answer.",'그들은 답을 모른다.'],
      ["Minho doesn't play computer games.",'민호는 컴퓨터 게임을 하지 않는다.'],
      ["It doesn't rain much here.",'여기는 비가 많이 오지 않는다.'],
      ["My dad doesn't have much time.",'우리 아빠는 시간이 많지 않으시다.'],
      ['Do you walk to school?','너는 걸어서 학교에 가니?'],
      ['Do they live near here?','그들은 이 근처에 사니?'],
      ['Does Jisu speak Chinese?','지수는 중국어를 하니?'],
      ['Does the store open on Sundays?','그 가게는 일요일에 여니?'],
      ['Does your cat sleep a lot? — Yes, it does.','너희 고양이는 많이 자니? — 응, 그래.'],
      ["Do you do your homework every day? — No, I don't.",'너는 매일 숙제를 하니? — 아니.'],
      ["Does he have a brother? — No, he doesn't.",'그는 형이 있니? — 아니, 없어.']
    ],
    mistakes:[["She doesn't likes milk.","She doesn't like milk.",'doesn\'t 뒤 원형'],
              ['Does he plays soccer?','Does he play soccer?','Does 뒤 원형'],
              ["He don't have a car.","He doesn't have a car.",'3인칭 단수 → doesn\'t'],
              ['Do you hungry?','Are you hungry?','hungry는 형용사 → be동사 문장'],
              ['Does Mina like music? — Yes, she likes.','Yes, she does.','대답은 does로']],
    exam:['doesn\'t / Does 뒤 동사원형 (has → have)','be동사 vs do동사 의문문 구별 (빈칸에 들어갈 말이 다른 것)','부정문·의문문 전환 서술형','표·대화 보고 대답 고르기 (Yes, she does.)'],
    activity:'【Do / Does / Be? 손 신호 게임 · 5분】 교사가 빈칸 문장(___ your sister like cats? / ___ you tired?)을 띄우면 Do=주먹, Does=보, Be동사=가위를 동시에 내기. 틀린 학생은 그 문장을 완성해 크게 읽기.',
    check:[['He has a dog. → 부정문',"He doesn't have a dog."],
           ['Your sister likes cats. → 의문문','Does your sister like cats?'],
           ['Do your parents cook? (No)',"No, they don't."]]
  }
},
{ no:'07', title:'일반동사 과거형 ★불규칙 동사표', short:'과거형',
  student:{
    core:'과거의 일을 말할 때는 동사를 <b>과거형</b>으로 바꿔요. 대부분 <b>-ed</b>를 붙이고, 모양이 바뀌는 <b>불규칙 동사</b>는 외워야 해요. 과거형은 <b>주어에 상관없이 모양이 같아요!</b>',
    table:`<table class="t"><tr><th>규칙</th><th>예</th></tr>
      <tr><td class="l">대부분 <b>+ed</b></td><td class="l">play → played, watch → watched</td></tr>
      <tr><td class="l">-e로 끝나면 <b>+d</b></td><td class="l">like → liked, live → lived</td></tr>
      <tr><td class="l">자음 + y → <b>y를 i로 바꾸고 +ed</b></td><td class="l">study → studied, cry → cried</td></tr>
      <tr><td class="l">모음 + y → <b>+ed</b></td><td class="l">play → played, stay → stayed</td></tr>
      <tr><td class="l">단모음 + 단자음 → <b>자음 하나 더 +ed</b></td><td class="l">stop → stopped, plan → planned</td></tr></table>
      <div class="h3">★ 불규칙 동사표 (꼭 외우기!)</div>${IRREG_TABLE}`,
    points:[
      ['규칙 동사: <b>-ed</b> 붙이기', ['I played soccer yesterday.','나는 어제 축구를 했다.']],
      ['불규칙 동사: <b>모양이 바뀌어요</b>', ['She went to the library last weekend.','그녀는 지난 주말에 도서관에 갔다.']],
    ],
    tips:[

      '<b>read의 과거형은 read</b> — 철자는 같고 발음만 [레드]로 달라요.',
      '<b>put, cut, hit</b>은 현재형과 과거형이 같아요.'
    ],
    examples:[
      ['I watched a movie last night.','나는 어젯밤에 영화를 봤다.'],
      ['She studied for three hours.','그녀는 3시간 동안 공부했다.'],
      ['The bus stopped suddenly.','버스가 갑자기 멈췄다.'],

      ['He went to bed early yesterday.','그는 어제 일찍 잠자리에 들었다.'],

      ['My mom bought a new bag.','우리 엄마는 새 가방을 사셨다.'],
      ['They met their friends at the park.','그들은 공원에서 친구들을 만났다.'],
      ['Minsu wrote a letter to his grandma.','민수는 할머니께 편지를 썼다.'],
      ['I read the book two days ago.','나는 이틀 전에 그 책을 읽었다.']

    ox:[['He goed to the park yesterday.',false,'go의 과거형은 <b>went</b>'],

           'UNIT 01 was/were를 떠올리게 한 뒤 "일반동사는 과거형을 어떻게 만들까?" 질문'],

    examples:[

      ['I saw a rainbow this morning.','나는 오늘 아침 무지개를 봤다.'],
      ['My dad made pancakes for us.','아빠가 우리에게 팬케이크를 만들어 주셨다.'],

      ['I lost my umbrella on the bus.','나는 버스에서 우산을 잃어버렸다.'],

{id:'bm04',c:'05',type:'mc',q:'빈칸에 들어갈 말이 나머지 넷과 <u>다른</u> 것은?',opts:['Mina ______ her homework after dinner.','He ______ the dishes every day.','My friends ______ yoga on Fridays.','She always ______ her best.','My mom ______ the laundry on Sundays.'],ans:2,

{id:'bm10',c:'07',type:'mc',q:'동사와 과거형이 <u>잘못</u> 짝지어진 것은?',opts:['play – played','stop – stoped','study – studied','like – liked','cry – cried'],ans:1,

function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:"]/g,' ').replace(/\s+/g,' ').trim()}
function lite(s){return String(s).replace(/[’‘`]/g,"'").replace(/\s+/g,' ').trim()}
function plain(h){return h.replace(/<br\s*\/?>/g,' / ').replace(/<[^>]+>/g,'')}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/—/g,','));u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}catch(e){toast('이 기기에서는 음성 재생이 지원되지 않아요')}}

function shuffle(a,seed){a=a.slice();let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))%9973;for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(a.every((v,i)=>v===i)&&a.length>1)a.push(a.shift());return a}

function startQuiz(ids,label){

function resetAns(){

  if(q.type==='order')state.ans={pool:shuffle(q.words.map((_,i)=>i),q.id),picked:[]};
  else if(q.type==='fix')state.ans={idx:null,text:''};
  else if(q.type==='blank')state.ans={vals:q.accept.map(()=> '')};

function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function answerHTML(q){
  if(q.type==='cwrite')return q.model.map(esc).join(' ')+(q.id==='s11'?'<div class="muted" style="font-weight:500;margin-top:4px">(예시 답안 — 조건을 지키면 다른 문장도 정답)</div>':'');
  if(q.type==='mc')return `${CIRC[q.ans]} ${q.opts[q.ans]}`;
  if(q.type==='order')return esc(cap(q.ans)+q.end);
  if(q.type==='fix')return `<span style="color:var(--ng);text-decoration:line-through">${esc(q.s.split(' ')[q.w])}</span> → <span style="color:var(--ok)">${esc(q.fix[0])}</span><div style="font-weight:600;margin-top:4px">${esc(q.full)}</div>`;
  if(q.type==='write')return esc(q.accept[0]+(/\?$|\.$/.test(q.accept[0])?'':(q.ko&&/니\?|까\?|니$/.test(q.ko)?'?':'.')))+(q.accept.length>1?`<div class="muted" style="font-weight:500;margin-top:4px">다른 정답: ${q.accept.slice(1).map(esc).join(' / ')}</div>`:'');
  if(q.type==='blank')return q.accept.map((a,i)=>`(${i+1}) ${esc(a[0])}`).join('&nbsp;&nbsp; ');
}
function cwCheck(q,text){
  const t=lite(text),tl=t.toLowerCase(),words=t.replace(/[.,!?]/g,' ').split(/\s+/).filter(Boolean).length;
  const sents=(t.match(/[^.!?]+[.!?]*/g)||[]).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>=2);
  const joined=sents.join('\n').toLowerCase();
  const conds=q.conds.map(c=>{let ok=true;
    if(c.w)ok=ok&&words===c.w;
    if(c.sent)ok=ok&&sents.length>=c.sent&&(!c.re||sents.filter(x=>new RegExp(c.re,'i').test(x)).length>=c.sent);
    else if(c.re)ok=ok&&(c.not?!new RegExp(c.re,'i').test(tl):new RegExp(c.re,'i').test(tl));
    return ok});
  const core=q.core.filter(r=>r[2]==='not'?new RegExp(r[0],'im').test(joined):!new RegExp(r[0],'im').test(joined)).map(r=>r[1]);
  return {conds,core,pass:conds.every(Boolean)&&!core.length};
}
function grade(q,A){
  if(q.type==='cwrite'){const r=cwCheck(q,A.text);state.cwRes=r;return r.pass}
  if(q.type==='mc')return A.sel===q.ans;
  if(q.type==='order')return norm(A.picked.map(i=>q.words[i]).join(' '))===norm(q.ans);
  if(q.type==='fix')return A.idx===q.w&&q.fix.some(f=>norm(f)===norm(A.text));
  if(q.type==='write')return q.accept.some(a=>norm(a)===norm(A.text));
  if(q.type==='blank')return q.accept.every((acc,i)=>acc.some(a=>norm(a)===norm(A.vals[i]||'')));
}
function canSubmit(q,A){
  if(q.type==='mc')return A.sel!==null;
  if(q.type==='order')return A.picked.length===q.words.length;
  if(q.type==='fix')return A.idx!==null&&A.text.trim()!=='';
  if(q.type==='write'||q.type==='cwrite')return A.text.trim()!=='';
  if(q.type==='blank')return A.vals.every(v=>v.trim()!=='');
}
function submit(){
  const z=state.quiz,q=qById(z.ids[z.i]),A=state.ans;
  if(!canSubmit(q,A)){toast(q.type==='order'?'모든 단어를 배열해 주세요':q.type==='fix'&&A.idx===null?'틀린 단어를 먼저 눌러 주세요':'답을 입력해 주세요');return}
  const ok=grade(q,A);z.res[q.id]=ok;z.answered=true;
  const st=S.get('stats',{});st[q.id]=st[q.id]||{t:0,c:0};st[q.id].t++;if(ok)st[q.id].c++;S.set('stats',st);
  let w=wrongSet();
  if(!ok&&!w.includes(q.id))w.push(q.id);
  if(ok&&w.includes(q.id)){w=w.filter(x=>x!==q.id);S.set('mastered',S.get('mastered',0)+1);toast('오답 극복! 오답노트에서 빠졌어요 🎉')}
  setWrong(w);render();
}

function checkStep(i){
  const m=MISSIONS.find(x=>x.id===state.mission),s=m.steps[i],el=document.getElementById('mIn'),raw=el?el.value:'',t=lite(raw);
  if(!t){state.mFb=`<div class="fb-box ng"><div class="t">문장을 먼저 써 주세요</div></div>`;return render()}
  const tl=t.toLowerCase(),fails=[];
  if(s.free){const sents=t.split(/[.!?]+/).filter(x=>x.trim().split(' ').length>=2);if(sents.length<s.minSent)fails.push(`문장이 ${sents.length}개예요. ${s.minSent}개 이상 써 주세요. (문장 끝에 . 또는 ? 찍기)`)}
  s.must.forEach(r=>{if(!new RegExp(r[0],'i').test(tl))fails.push(r[1])});
  s.not.forEach(r=>{if(new RegExp(r[0],'i').test(tl))fails.push(r[1])});
  const warns=[];if(!/^[A-Z]/.test(t))warns.push('문장 첫 글자는 대문자로 써요.');if(!/[.?!]$/.test(t))warns.push('문장 끝에 마침표(.)나 물음표(?)를 찍어요.');

    render();const ne=document.getElementById('mIn');if(ne)ne.value=raw;return}
  const d=mData();d[m.id]=d[m.id]||{};d[m.id][i]=t;S.set('wm',d);
  state.mEdit=null;state.mFb=null;
  toast(warns.length?'통과! 팁: '+warns[0]:'훌륭해요! 다음 단계로 ✨');
  render();
}

  const chip=(v,l)=>`<button class="chip ${f===v?'on':''}" data-act="keyF" data-v="${v}">${l}</button>`;
  return `<div class="chips noprint">${chip('all','기본 전체 '+Q.filter(q=>!q.set).length)}${CONCEPTS.map(c=>chip(c.no,'개념 '+c.no)).join('')}${chip('adv','🔥 내신 실전 심화 '+ADV.length)}</div>
  <div class="card"><div class="row" style="align-items:center"><div style="flex:3"><div class="h2" style="margin:0">${na?'중등문법1 · UNIT '+UNIT_ID+' '+UNIT.title+' '+(f==='adv'?'내신 실전 심화':'문제지'):'정답 및 해설지'}</div><div class="muted">${list.length}문항${na?' &nbsp; 이름: ____________ &nbsp; 점수: ______':''}</div></div></div>
  <div class="row noprint" style="margin:8px 0"><button class="btn ghost" data-act="keyNoAns">${na?'✅ 정답·해설 보기':'📄 학생용 시험지 (정답 숨김)'}</button><button class="btn" data-act="print">🖨 인쇄</button></div>
  ${list.map((q,n)=>`<div class="keyq"><div><b style="color:var(--burg)">${n+1}.</b> ${na?'':`<span class="tag">${TYPE_NAME[q.type]}</span><span class="tag b">개념 ${q.c}</span>`}</div>
    <div style="font-weight:700;margin:4px 0">${q.q}</div>
    ${q.ko?`<div>우리말: ${esc(q.ko)}</div>`:''}${q.box?`<div class="box" style="margin:4px 0">${q.box}</div>`:''}${q.s?`<div class="box" style="margin:4px 0">${esc(q.s)}</div>`:''}${q.text?`<div class="box" style="margin:4px 0">${q.text.replace(/\[(\d)\]/g,'( ____ )')}</div>`:''}
    ${q.type==='mc'?`<div>${q.opts.map((o,i)=>CIRC[i]+' '+plain(o)).join('<br>')}</div>`:''}
    ${q.type==='order'?`<div class="muted">( ${q.words.map(esc).join(' / ')} )</div>`:''}
    ${q.cond?`<div class="muted">&lt;조건&gt; ${esc(q.cond)}</div>`:''}
    ${q.conds?`<div class="muted">&lt;조건&gt;<br>${q.conds.map(c=>'· '+esc(c.t)).join('<br>')}</div>`:''}
    ${na?(q.type==='mc'?'':'<div class="anslines"></div><div class="anslines"></div>'):`<div class="ansl" style="background:var(--ok-l)">${q.type==='cwrite'?'모범 답안':'정답'}: ${answerHTML(q)}</div><div class="exp">${q.exp}</div>`}</div>`).join('')}</div>`;
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click',e=>{
  const sayEl=e.target.closest('[data-say]');if(sayEl){speak(sayEl.dataset.say);return}
  const tb=e.target.closest('#bnav [data-tab]');if(tb){state.tab=tb.dataset.tab;state.mission=null;state.mFb=null;state.mEdit=null;state.clearArm=false;render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,d=el.dataset;
  const z=state.quiz;
  switch(a){
    case 'home':if(STUDENT_ONLY)return;state.mode='home';state.pinOpen=false;render();window.scrollTo(0,0);break;
    case 'goStudent':state.mode='student';state.tab='learn';render();window.scrollTo(0,0);break;
    case 'goTeacher':if(SS.get('t')==='1'){state.mode='teacher';render()}else{state.pinOpen=true;render();setTimeout(()=>{const p=document.getElementById('pin');if(p)p.focus()},50)}break;
    case 'pinOk':{const v=(document.getElementById('pin')||{}).value;if(v===TEACHER_PIN){SS.set('t','1');state.mode='teacher';state.pinOpen=false;render();window.scrollTo(0,0)}else toast('비밀번호가 맞지 않아요')}break;
    case 'saveName':{const v=(document.getElementById('nm')||{}).value||'';if(v.trim()){S.set('name',v.trim());toast(v.trim()+' 학생, 반가워요!');render()}else toast('이름을 입력해 주세요')}break;
    case 'pickC':state.concept=+d.i;render();window.scrollTo(0,0);break;
    case 'ox':state.oxDone[d.k]=d.v==='1';render();break;
    case 'quizConcept':startQuiz(Q.filter(q=>q.c===d.c&&!q.set).map(q=>q.id),'개념 '+d.c+' '+cTitle(d.c));break;
    case 'qType':state.qType=d.v;render();break;
    case 'qCon':state.qCon=d.v;render();break;
    case 'startSel':startQuiz(filteredQ().map(q=>q.id),(state.qSet==='adv'?'🔥 내신 실전 심화 · ':'')+(state.qCon==='all'?'UNIT '+UNIT_ID+' 전체':'개념 '+state.qCon)+' · '+(state.qType==='all'?'전 유형':state.qType==='write'?'서술형':TYPE_NAME[state.qType]));break;
    case 'startMock':startQuiz(shuffle(Q.filter(q=>!q.set).map(q=>q.id),'mock'+Date.now()).slice(0,20),'실전 모의고사 20문항');break;
    case 'mcSel':if(z&&!z.answered){state.ans.sel=+d.i;render()}break;
    case 'pick':if(z&&!z.answered){const w=+d.w;if(!state.ans.picked.includes(w))state.ans.picked.push(w);render()}break;
    case 'unpick':if(z&&!z.answered){state.ans.picked.splice(+d.k,1);render()}break;
    case 'orderReset':state.ans.picked=[];render();break;
    case 'tok':if(z&&!z.answered){state.ans.idx=+d.i;render();const f=document.getElementById('fixIn');if(f)f.focus()}break;
    case 'submit':submit();break;
    case 'next':nextQ();break;
    case 'quitQuiz':state.quiz=null;state.result=null;render();break;
    case 'retryRun':{const r=state.result;startQuiz(r.ids.filter(id=>!r.res[id]),'틀린 문제 다시 풀기')}break;
    case 'toSetup':state.result=null;state.quiz=null;render();break;
    case 'tab':state.tab=d.tab;state.result=null;render();window.scrollTo(0,0);break;
    case 'retryAll':startQuiz(wrongSet().slice(),'오답 다시 풀기');break;
    case 'retryCon':startQuiz(wrongSet().filter(id=>qById(id).c===d.c),'개념 '+d.c+' 오답 다시 풀기');break;
    case 'clearRec':if(!state.clearArm){state.clearArm=true;render()}else{['wrong','stats','mastered','wm'].forEach(k=>{try{localStorage.removeItem(KEY+k)}catch(e){}});state.clearArm=false;toast('기록을 초기화했어요');render()}break;
    case 'openM':state.mission=d.m;state.mEdit=null;state.mFb=null;render();window.scrollTo(0,0);break;
    case 'closeM':state.mission=null;state.mFb=null;state.mEdit=null;render();break;
    case 'checkStep':checkStep(+d.i);break;
    case 'hintStep':{const m=MISSIONS.find(x=>x.id===state.mission),s=m.steps[+d.i];const cur=(document.getElementById('mIn')||{}).value||'';
      state.mFb=`<div class="fb-box ok"><div class="t">💡 모범 문장</div><div class="ansl">${esc(s.model)}</div><div class="muted">그대로 베끼기보다, 내 문장으로 바꿔 써 보세요!</div></div>`;render();const ne=document.getElementById('mIn');if(ne)ne.value=cur}break;
    case 'editStep':state.mEdit=+d.i;state.mFb=null;render();break;
    case 'sayAll':{const m=MISSIONS.find(x=>x.id===state.mission),a2=mData()[m.id]||{};speak(Object.keys(a2).sort().map(k=>a2[k]).join(' '))}break;
    case 'copyW':{const dd=mData(),nm=S.get('name','이름 미입력');let out=`[중등문법1 · UNIT ${UNIT_ID} ${UNIT.title} Writing Mission]\n학생: ${nm}\n`;let cnt=0;
      MISSIONS.forEach(m=>{const a2=dd[m.id];if(!a2)return;out+=`\n■ ${m.title}\n`;Object.keys(a2).sort().forEach(k=>{out+=`${+k+1}. ${a2[k]}\n`;cnt++})});
      if(!cnt){toast('아직 완성한 문장이 없어요');break}copyText(out)}break;
    case 'tview':state.tview=d.v;state.tpanel=null;render();window.scrollTo(0,0);break;
    case 'tPick':state.tconcept=+d.i;state.boardEx=0;state.tstep=0;state.titem=0;state.treveal=false;render();break;
    case 'toBoard':state.tview='board';state.tstep=0;state.titem=0;state.treveal=false;state.boardEx=0;render();window.scrollTo(0,0);break;
    case 'tStep':{const n=runSteps().length,i=+d.i;if(i<0||i>=n)break;state.tstep=i;state.titem=0;state.treveal=false;state.boardEx=0;render();window.scrollTo(0,0)}break;
    case 'itNext':state.titem++;state.treveal=false;render();break;
    case 'itPrev':state.titem--;state.treveal=false;render();break;
    case 'reveal':state.treveal=!state.treveal;render();break;
    case 'tpanel':state.tpanel=state.tpanel===d.v?null:d.v;render();break;
    case 'timerSet':timerStart(+d.m*60);state.tpanel=null;render();toast('⏱ '+d.m+'분 타이머 시작');break;
    case 'timerAdd':if(tool.end&&tool.end>Date.now())tool.end+=30000;else timerStart(30);render();break;
    case 'timerStop':clearInterval(tool.tick);tool.end=0;render();break;
    case 'setN':{const v=+(document.getElementById('classN')||{}).value;if(v>=2&&v<=40){S.set('classN',v);tool.used=[];tool.last=null;toast(v+'명으로 설정했어요');render()}else toast('2~40명 사이로 입력해 주세요')}break;
    case 'pickOne':{const N=S.get('classN',12);if(tool.used.length>=N)tool.used=[];const left=[];for(let k=1;k<=N;k++)if(!tool.used.includes(k))left.push(k);tool.last=left[Math.floor(Math.random()*left.length)];tool.used.push(tool.last);render()}break;
    case 'pickReset':tool.used=[];tool.last=null;render();break;
    case 'sc':tool.score[d.t]=Math.max(0,tool.score[d.t]+(+d.v));render();break;
    case 'scReset':tool.score={A:0,B:0,C:0,D:0};render();break;
    case 'pickUnit':{loadUnit(d.u);Object.assign(state,{concept:0,tconcept:0,tstep:0,titem:0,treveal:false,boardEx:0,quiz:null,result:null,mission:null,mEdit:null,mFb:null,qCon:'all',qType:'all',keyFilter:'all',oxDone:{},clearArm:false});
      if(state.mode==='home')toast('UNIT '+d.u+' '+UNIT.title+' 선택! 학생용 / 교사용을 눌러 주세요');render();window.scrollTo(0,0)}break;
    case 'qSet':state.qSet=d.v;state.qType='all';render();break;
    case 'keyNoAns':state.keyNoAns=!state.keyNoAns;render();break;
    case 'exPrev':{const n=CONCEPTS[state.tconcept].teacher.examples.length;state.boardEx=(state.boardEx-1+n)%n;render()}break;
    case 'exNext':state.boardEx++;render();break;
    case 'toggleKo':state.hideKo=!state.hideKo;render();break;
    case 'fullscreen':{const w=document.documentElement;try{if(document.fullscreenElement)document.exitFullscreen();else if(w.requestFullscreen)w.requestFullscreen();else if(w.webkitRequestFullscreen)w.webkitRequestFullscreen();else toast('이 기기는 전체화면을 지원하지 않아요')}catch(err){toast('전체화면을 열 수 없어요')}}break;
    case 'keyF':state.keyFilter=d.v;render();break;
    case 'print':window.print();break;
  }
});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('tguide'))state.guideOpen=e.target.open},true);
document.addEventListener('fullscreenchange',()=>{if(state.mode==='teacher'&&state.tview==='board')render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='pin'){document.querySelector('[data-act="pinOk"]').click()}
  if(e.key==='Enter'&&e.target.id==='nm'){document.querySelector('[data-act="saveName"]').click()}
  if(e.key==='Enter'&&(e.target.id==='fixIn'||e.target.classList.contains('bl'))){e.preventDefault();const b=document.getElementById('submitBtn');if(b)b.click()}
});

(()=>{const m=location.search.match(/[?&]unit=(\d+)/);let u=m?String(m[1]).padStart(2,'0'):null;if(!u){try{u=localStorage.getItem('sgl_unit')}catch(e){}}loadUnit(u||'01')})();
if(STUDENT_ONLY){state.mode='student'}
render();
</script>
