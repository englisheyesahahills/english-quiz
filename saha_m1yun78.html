<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중1 당리중학습지 뿌시기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--gold:#c98a12;--bg:#f4f5f9;--card:#fff;--ink:#1b2133;--muted:#5c6478;--line:#dfe2ea;--soft:#eef0f6;--ok:#1f8a4c;--okbg:#e3f6ea;--no:#c0392b;--nobg:#fbe7e5;
--display:"Do Hyeon","Noto Sans KR",sans-serif;--body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#12151f;--card:#1b2030;--ink:#e8eaf1;--muted:#a3a9ba;--line:#2d3346;--soft:#232a3d;--bur:#e0708c;--okbg:#14301f;--nobg:#3a1714;--ok:#5fd18f;--no:#ff8a7a;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button,input{font:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff}
header .wrap{display:flex;align-items:center;gap:10px;padding-block:11px}
.brand{font-family:var(--display);font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:14px}
main{padding:16px 0 70px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 4px;line-height:1.2}
h2{font-size:17px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .pt{background:var(--bur);color:#fff;font-size:12px;padding:2px 9px;border-radius:9px}
.eye{color:var(--bur);font-weight:700;font-size:13px}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
input[type=text]{color:var(--ink);background:var(--card);border:1.5px solid #c9cedb;border-radius:10px;padding:9px 11px;width:100%}
.tiles{display:grid;gap:8px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;width:100%}
.tile .ic{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px}
.tile b{display:block;font-size:16px}.tile span{font-size:13px;color:var(--muted)}
.tile .sc{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
.tile .sc.done{color:var(--ok)}
.guide{background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:500}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cc div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--bur);border-radius:10px;padding:8px 10px;font-size:14px}
.cc b{color:var(--bur)}.cc i{display:block;font-style:normal;color:var(--muted);font-size:13px}
details.pass{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
details.pass summary{cursor:pointer;font-weight:700;color:var(--navy)}
@media (prefers-color-scheme: dark){details.pass summary{color:#9fb4ff}}
details.pass p{margin:8px 0;font-size:15px}
.q{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.q.ok{border-color:var(--ok)}.q.no{border-color:var(--no)}
.qn{font-weight:700;color:var(--navy);margin-right:4px}
@media (prefers-color-scheme: dark){.qn{color:#9fb4ff}}
.qt{font-weight:500}
.st{font-size:13px;color:var(--muted);margin-top:2px}
.ops{display:grid;gap:6px;margin-top:8px}
.ops.g2{grid-template-columns:1fr 1fr}
.op{text-align:left;background:var(--soft);border:2px solid transparent;border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--ink);font-size:15px}
.op.sel{border-color:var(--navy);background:var(--card);font-weight:700}
.op.right{border-color:var(--ok);background:var(--okbg)}
.op.wrong{border-color:var(--no);background:var(--nobg)}
.q input[type=text]{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--card);border:1.5px solid #c9cedb;border-radius:20px;padding:4px 12px;cursor:pointer;color:var(--ink);font-size:15px}
.chip.used{opacity:.25;pointer-events:none}
.built{min-height:44px;border:1.5px dashed #c9cedb;border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.built .chip{background:var(--soft);border-color:var(--navy)}
.fb{margin-top:8px;font-size:14px;border-radius:8px;padding:6px 10px;display:none}
.q.ok .fb{display:block;background:var(--okbg);color:var(--ok)}
.q.no .fb{display:block;background:var(--nobg);color:var(--no)}
.fb b{color:var(--ink)}
.bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 14px;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;font-size:16px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.bur{background:var(--bur)}
.res{text-align:center;font-family:var(--display);font-size:26px;color:var(--bur)}
.pdf{display:block;text-align:center;margin:18px 0 0;padding:12px;border:1.5px dashed var(--bur);border-radius:12px;color:var(--bur);font-weight:700;text-decoration:none}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}
.sv{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:520px){.cc,.ops.g2{grid-template-columns:1fr}}
</style>
</head>

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const C="①②③④⑤";const PC={A:"#8a2240",B:"#2f6db0",C:"#1f7a5a",D:"#c98a12"};
const norm=s=>" "+String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/\bi'm\b/g,"i am").replace(/\bit's\b/g,"it is").replace(/\bhe's\b/g,"he is").replace(/\bshe's\b/g,"she is").replace(/\bdon't\b/g,"do not").replace(/\bdoesn't\b/g,"does not").replace(/\bwasn't\b/g,"was not").replace(/\bisn't\b/g,"is not").replace(/\bdidn't\b/g,"did not").replace(/\bi'll\b/g,"i will").replace(/\bwon't\b/g,"will not").replace(/\bshe'll\b/g,"she will").replace(/\bhe'll\b/g,"he will").replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()+" ";
const PASS=[];
function home(note){$("#home").style.display="none";$("#lo").style.display="";S.cur="";sv();
 const tile=s=>{const r=S.res[s.id];const ic=PC[s.part];
  return `<button class="tile" data-s="${s.id}"><span class="ic" style="background:${ic}">${s.id}</span><div><b>${esc(s.title)}</b><span>${s.q.length}문항 · ${s.guide.replace(/<[^>]+>/g,"").slice(0,34)}…</span></div><span class="sc ${r&&r.best===r.total?"done":""}">${r?`${r.best===r.total?"✓ ":""}${r.best}/${r.total}`:""}</span></button>`};
 app.innerHTML=`<span class="eye">${CONF.eye}</span><h1>${esc(CONF.title)}</h1><p class="muted">${esc(CONF.sub)}<br>${CONF.intro}</p>
 <div class="card" style="display:flex;gap:10px;align-items:center;justify-content:space-between"><span>👋 <b>${esc(U.name)}</b> 학생</span><span class="muted" id="sync" style="font-size:12px">${note?esc(note):(lastSent?"✓ 기록 불러옴":"")}</span></div>
 ${resumeHTML()}
 ${Object.keys(CONF.parts).map(p=>`<h2><span class="pt" style="background:${PC[p]}">PART ${p}</span>${CONF.parts[p].name}</h2><div class="tiles">${STEPS.filter(s=>s.part===p).map(tile).join("")}</div>`).join("")}
 <a class="pdf" href="${CONF.pdf}" target="_blank" rel="noopener">🖨️ 워크시트 PDF 인쇄 (정답 포함)</a>
 <div class="ft">${esc(CONF.brand)}</div>`;
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>step(b.dataset.s));
 window.scrollTo(0,0)}
let cur=null;
function step(id){const s=STEPS.find(x=>x.id===id);S.cur=id;sv();cur={s,graded:{},t0:Date.now(),tries:(S.res[id]?S.res[id].tries||0:0)};
 const A=S.ans[id]=S.ans[id]||{};$("#home").style.display="";
 const ty=s.t;
 app.innerHTML=`<span class="eye">PART ${s.part} · ${CONF.parts[s.part].eye}</span><h1 style="font-size:24px">${esc(s.title)}</h1>
 <div class="guide">${s.guide}</div>
 ${s.concept?`<div class="cc">${s.concept.map(c=>`<div><b>${c[0]}</b> ${esc(c[1])}<i>${c[2]}</i></div>`).join("")}</div>`:""}
 ${s.part==="B"&&PASS.length?`<details class="pass" ${ty==="en"?"":"open"}><summary>📖 본문 보기 (${CONF.passTitle})</summary>${PASS.map(p=>`<p>${p}</p>`).join("")}</details>`:""}
 <div id="qs">${s.q.map((q,i)=>qHTML(s,q,i,A[i])).join("")}</div>
 <div class="bar"><button class="btn" id="grade">채점하기</button></div><div class="sv" id="svmsg"></div>`;
 s.q.forEach((q,i)=>bindQ(s,q,i));window.scrollTo(0,0);
 $("#grade").onclick=grade}
function qHTML(s,q,i,v){const n=`<span class="qn">${i+1}.</span>`;let body="";
 if(s.t==="mc")body=`<div class="qt">${n}${q.q}</div><div class="ops g2">${USES.map((u,k)=>`<button class="op ${v===k?"sel":""}" data-k="${k}">${C[k]} ${u}</button>`).join("")}</div>`;
 else if(s.t==="tf")body=`<div class="qt">${n}${q.q}</div><div class="ops g2">${["T (True)","F (False)"].map((u,k)=>`<button class="op ${v===k?"sel":""}" data-k="${k}">${u}</button>`).join("")}</div>`;
 else if(s.t==="mc5")body=`<div class="qt">${n}${q.q}</div><div class="ops">${q.o.map((u,k)=>`<button class="op ${v===k?"sel":""}" data-k="${k}">${s.bare?C[k]:C[k]+" "+u}</button>`).join("")}</div>`;
 else if(s.t==="sa")body=`<div class="qt">${n}${q.q}</div>${q.st?`<div class="st">→ ${esc(q.st)} ______ 로 시작</div>`:""}<input type="text" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="문장 전체를 영어로 쓰세요 (주어부터)" value="${esc(v||"")}">`;
 else if(s.t==="fill")body=`<div class="qt">${n}${esc(q.q)}</div><div style="margin-top:6px;font-size:17px">${esc(q.pre)} <b style="color:var(--bur)">______</b> ${esc(q.post!=null?q.post:".")}</div><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${esc(s.ph||"빈칸에 들어갈 말을 쓰세요")}" value="${esc(v||"")}">`;
 else if(s.t==="en")body=`<div class="qt">${n}${q.q}</div><div class="st">💡 ${esc(q.hint)}</div><input type="text" autocomplete="off" spellcheck="false" placeholder="완전한 영어 문장으로 답하세요" value="${esc(v||"")}">`;
 else if(s.t==="or"){const used=v||[];body=`<div class="qt">${n}${esc(q.q)}</div><div class="built">${used.map(k=>`<button class="chip" data-u="${k}">${esc(q.c[k])}</button>`).join("")}</div><div class="chips">${q.c.map((c,k)=>`<button class="chip ${used.includes(k)?"used":""}" data-k="${k}">${esc(c)}</button>`).join("")}</div>`}
 return `<div class="q" id="q${i}">${body}<div class="fb"></div></div>`}
function bindQ(s,q,i){const el=$("#q"+i);const A=S.ans[s.id];
 if(["mc","tf","mc5"].includes(s.t))el.querySelectorAll(".op").forEach(b=>b.onclick=()=>{if(cur.graded[i])return;A[i]=+b.dataset.k;sv();el.querySelectorAll(".op").forEach(x=>x.classList.toggle("sel",x===b))});
 else if(s.t==="or"){el.onclick=e=>{if(cur.graded[i])return;const c=e.target.closest(".chip");if(!c)return;A[i]=A[i]||[];
  if(c.dataset.k!=null)A[i].push(+c.dataset.k);else A[i].splice(A[i].indexOf(+c.dataset.u),1);sv();el.outerHTML=qHTML(s,q,i,A[i]);bindQ(s,q,i)}}
 else el.querySelector("input").oninput=e=>{A[i]=e.target.value;sv()}}
function check(s,q,v){
 if(s.t==="mc"||s.t==="tf"||s.t==="mc5")return v===q.a;
 if(s.t==="or")return Array.isArray(v)&&v.length===q.c.length&&[q.a].concat(q.alt||[]).some(x=>norm(v.map(k=>q.c[k]).join(" "))===norm(x));
 if(s.t==="sa"||s.t==="fill")return !!v&&q.a.some(a=>norm(a)===norm(v));
 if(s.t==="en"){if(!v)return false;const n=norm(v);if(n.trim().split(" ").length<3)return false;return q.kw.every(g=>g.some(k=>n.includes(" "+k)||n.includes(k)))}}
function ansText(s,q){if(s.t==="mc")return `${C[q.a]} ${USES[q.a]}`;if(s.t==="tf")return (q.a?"F":"T")+(q.e?` (→ ${q.e})`:"");if(s.t==="mc5")return `${C[q.a]} ${q.o[q.a]}`+(q.e?`<br>💡 ${q.e}`:"");if(s.t==="or")return q.a;if(s.t==="sa")return q.a[0];if(s.t==="fill")return `${esc(q.pre)} <u>${q.a[0]}</u> ${esc(q.post!=null?q.post:".")}`;return q.a}
function grade(){const s=cur.s,A=S.ans[s.id];let sc=0;const wrong=[];
 s.q.forEach((q,i)=>{const ok=check(s,q,A[i]);cur.graded[i]=1;const el=$("#q"+i);el.classList.remove("ok","no");el.classList.add(ok?"ok":"no");
  if(ok)sc++;else wrong.push(i+1);
  if(["mc","tf","mc5"].includes(s.t)){const ops=el.querySelectorAll(".op");ops[q.a].classList.add("right");if(!ok&&A[i]!=null)ops[A[i]].classList.add("wrong")}
  el.querySelector(".fb").innerHTML=ok?(s.t==="en"?`⭕ 정답! 모범답안: <b>${esc(q.a)}</b>`:"⭕ 정답!"):`❌ 정답: <b>${ansText(s,q)}</b>`;
  el.querySelectorAll("input").forEach(x=>x.disabled=true)});
 cur.tries++;const r=S.res[s.id]||{best:0,total:s.q.length};r.best=Math.max(r.best,sc);r.total=s.q.length;r.tries=cur.tries;S.res[s.id]=r;sv();
 $(".bar").innerHTML=`<button class="btn alt" id="redo">틀린 것만 다시</button><button class="btn bur" id="next">${STEPS.indexOf(s)<STEPS.length-1?"다음 단계 ▶":"메뉴로"}</button>`;
 $("#svmsg").innerHTML=`<div class="res">${sc} / ${s.q.length}</div>`;
 if(!wrong.length)$("#redo").textContent="처음부터 다시";
 $("#redo").onclick=()=>{if(wrong.length)wrong.forEach(n=>{delete S.ans[s.id][n-1]});else S.ans[s.id]={};sv();const t=cur.tries;step(s.id);cur.tries=t};
 $("#next").onclick=()=>{const k=STEPS.indexOf(s);k<STEPS.length-1?step(STEPS[k+1].id):home()};
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
 save(s,sc,wrong)}
function save(s,sc,wrong){const A=S.ans[s.id];
 const body={name:U?U.name:S.name,unit:CONF.unit,day:STEPS.indexOf(s)+1,title:`${CONF.short} ${s.title}`,cat:CONF.parts[s.part].cat,attempt:cur.tries>1?`재도전 ${cur.tries}회`:"첫 응시",score:sc,total:s.q.length,
  wrongNums:wrong.length?wrong.map(n=>n+"번").join(", "):"없음",
  wrongDetail:wrong.map(n=>{const v=A[n-1],q=s.q[n-1];return `${n}번: ${typeof v==="string"?v:Array.isArray(v)?v.map(k=>q.c[k]).join(" "):v!=null?(s.t==="tf"?(v?"F":"T"):C[v]):"무응답"}`}).join(" / ").slice(0,1900),
  minutes:Math.max(1,Math.round((Date.now()-cur.t0)/60000)),timestamp:new Date().toISOString()};
 try{fetch(SAVE_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),mode:"no-cors"}).then(()=>{const m=$("#svmsg");if(m)m.insertAdjacentHTML("beforeend","✅ 선생님께 결과가 전송됐어요")}).catch(()=>{})}catch(e){}}
function resumeHTML(){const n=STEPS.find(s=>{const a=S.ans[s.id]||{};const r=S.res[s.id];return Object.keys(a).length&&!(r&&r.best===r.total)});
 const last=S.last&&STEPS.find(s=>s.id===S.last);const t=n||null;if(!t)return "";const a=Object.keys(S.ans[t.id]||{}).length;
 return `<button class="btn bur" style="width:100%;margin:6px 0" data-s="${t.id}">▶ 이어서 하기 · ${t.id} ${esc(t.title.replace(/^STEP \d · /,""))} (${a}/${t.q.length} 작성)</button>`}
$("#home").onclick=home;if(U){download().then(ok=>{S.name=U.name;home(ok?"":"서버 기록을 불러오지 못해 이 기기 기록으로 시작합니다.")});app.innerHTML='<p class="muted" style="text-align:center;margin-top:40px">학습 기록 불러오는 중…</p>'}else loginView();
</script>
</body>
</html>
