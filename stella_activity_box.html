<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stella Activity Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* VOICE: 교실에서 바로 꺼내 쓰는 놀이 상자 — 밝고 단단하게, 전자칠판에서도 멀리서 읽히게
   IDEA: 선생님 책상 위 '활동 카드 상자' — 색 탭이 붙은 인덱스 카드, 뽑기 기계
   PICTURE: 상단의 큰 뽑기 슬롯과 카드 벽, 실행 도구는 칠판 전체를 쓰는 무대
   COLOUR and TYPE: 코발트 바탕 + 햇살 노랑 + 코랄 / Jua 제목 + Noto Sans KR 본문
   LAYOUT: 띠 헤더(뽑기) → 레벨·필터 → 카드 그리드 → 상세 시트·무대·떠있는 타이머/점수판 */
:root{color-scheme:light dark;
--bg:light-dark(#f6f7fb,#0f1430);--card:light-dark(#ffffff,#1a2150);--ink:light-dark(#151a33,#eef0ff);--mute:light-dark(#5a6080,#a9b0d6);
--line:light-dark(#e2e5f0,#2c356e);--cob:#2346d6;--cobd:light-dark(#1a36ab,#3a5cf0);--sun:#ffcf3a;--cor:#ff5b4a;--ok:#18a058}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.jua{font-family:Jua,"Noto Sans KR",sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.band{padding:clamp(22px,3.5vw,48px) max(4vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
header{background:var(--cob);color:#fff;position:relative;overflow:hidden}
header:after{content:"";position:absolute;right:-80px;top:-120px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3c5ff0,transparent 70%);pointer-events:none}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.top h1{margin:0;font-size:clamp(32px,4.4vw,50px);line-height:1.05}
.top p{margin:4px 0 0;opacity:.85;font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tb{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:14px;padding:10px 16px;min-height:48px;font-weight:700;font-size:16px}
.tb:hover{background:rgba(255,255,255,.24)}
.draw{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:stretch;position:relative;z-index:1}
.slot{background:#fff;color:#151a33;border-radius:22px;padding:18px 24px;box-shadow:0 8px 0 #172f99;display:flex;align-items:center;gap:18px;min-height:110px}
.slot .sv{flex:1}
.slot .sn{font-family:Jua;font-size:clamp(28px,4vw,46px);line-height:1.1}
.slot .sk{color:#5a6080;font-size:16px}
.slot .sgo{background:var(--cob);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-weight:700;min-height:48px;white-space:nowrap}
.drawbtn{background:var(--sun);color:#1b1b1b;border:0;border-radius:22px;padding:0 30px;font-family:Jua;font-size:clamp(24px,2.6vw,32px);box-shadow:0 8px 0 #c99a10;min-height:110px}
.drawbtn:active,.slot .sgo:active{transform:translateY(4px);box-shadow:0 4px 0 #c99a10}
.spin .sn{animation:flick .09s linear infinite}
@keyframes flick{50%{opacity:.4}}
.filters{background:var(--card);border-bottom:1px solid var(--line);padding:18px max(4vw,16px)}
.lvrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lv{border:2px solid var(--line);background:transparent;border-radius:16px;padding:10px 12px;text-align:left;min-height:64px}
.lv b{display:block;font-family:Jua;font-weight:400;font-size:21px;line-height:1.1}
.lv span{font-size:13px;color:var(--mute)}
.lv.on{border-color:var(--cob);background:var(--cob);color:#fff}.lv.on span{color:#dfe5ff}
.frow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 15px;min-height:44px;font-size:15px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.r.on{background:var(--cor);border-color:var(--cor);color:#fff}.chip.g.on{background:var(--cob);border-color:var(--cob);color:#fff}
.sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.search{flex:1 1 180px;min-height:44px;border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:16px;background:var(--bg);color:var(--ink)}
.count{color:var(--mute);font-size:15px;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.tab{position:absolute;top:-1px;left:20px;width:58px;height:9px;border-radius:0 0 8px 8px}
.tab.R{background:var(--cor)}.tab.G{background:var(--cob)}.tab.RG{background:linear-gradient(90deg,var(--cor) 50%,var(--cob) 50%)}
.cn{font-family:Jua;font-size:24px;line-height:1.1}
.ck{font-size:15px;color:var(--mute);font-weight:700}
.cd{margin:4px 0;font-size:15px;line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.meta span{font-size:13px;background:var(--bg);border-radius:8px;padding:3px 8px;white-space:nowrap}
.meta .run{background:var(--sun);color:#1b1b1b;font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mute);background:var(--card);border-radius:18px;border:1px dashed var(--line)}
/* overlay sheets */
.ov{position:fixed;inset:0;background:rgba(10,14,40,.55);display:none;z-index:50;padding:clamp(8px,3vw,36px);overflow:auto}
.ov.show{display:block}
.sheet{max-width:980px;margin:0 auto;background:var(--card);border-radius:24px;overflow:hidden}
.sh{padding:26px clamp(18px,3vw,36px) 20px;color:#fff;position:relative}
.sh.R{background:var(--cor)}.sh.G{background:var(--cob)}.sh.RG{background:linear-gradient(110deg,var(--cor) 0 45%,var(--cob) 45%)}
.sh h2{margin:0;font-size:clamp(32px,4vw,46px);line-height:1.05}
.sh .k{font-size:18px;font-weight:700;opacity:.92}
.x{position:absolute;right:14px;top:14px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;font-size:26px;line-height:1}
.sb{padding:22px clamp(18px,3vw,36px) 30px;display:grid;gap:22px}
.sb h3{margin:0 0 8px;font-size:22px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{background:var(--bg);border-radius:10px;padding:6px 12px;font-size:15px}
.steps{margin:0;padding-left:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;font-size:19px;line-height:1.5}
.steps li:before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--sun);color:#1b1b1b;display:grid;place-items:center;font-family:Jua;font-size:20px}
.say{display:grid;gap:8px}
.say div{font-size:21px;font-weight:500;background:var(--bg);border-left:5px solid var(--cob);border-radius:6px 12px 12px 6px;padding:10px 14px}
.tips{display:grid;gap:8px}
.tip{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px}
.tip b{font-family:Jua;font-weight:400;font-size:19px}
.tip.cur{border-color:var(--cob);background:light-dark(#eef1ff,#202a66)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:14px;padding:12px 20px;min-height:52px;font-weight:700;font-size:17px;background:var(--bg);border:1.5px solid var(--line)}
.btn.p{background:var(--sun);border-color:var(--sun);color:#1b1b1b}
.btn.b{background:var(--cob);border-color:var(--cob);color:#fff}
/* stage */
#stage{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#stage.show{display:flex}
.stbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--cob);color:#fff}
.stbar h2{margin:0;font-size:26px;flex:1}
.stbar .x{position:static}
.stbody{flex:1;overflow:auto;padding:clamp(16px,3vw,40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.big{font-family:Jua;font-size:clamp(44px,8vw,110px);line-height:1.1;word-break:break-word}
.mid{font-size:clamp(22px,3vw,34px);font-weight:700}
.hint{color:var(--mute);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1100px}
.wc{font-size:clamp(22px,3vw,36px);font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 20px;min-height:64px}
.wc.picked{background:var(--cob);color:#fff;border-color:var(--cob)}
.ans{min-height:96px;width:100%;max-width:1100px;border:3px dashed var(--line);border-radius:20px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.ans.good{border-color:var(--ok);border-style:solid;background:light-dark(#e7f7ee,#123a28)}
.ans.bad{border-color:var(--cor);border-style:solid}
.seqc{display:grid;gap:10px;width:100%;max-width:1000px}
.seqc .wc{text-align:left;font-size:clamp(18px,2.2vw,26px)}
.sent{font-size:clamp(28px,4.4vw,58px);font-weight:700;line-height:1.5;display:flex;flex-wrap:wrap;gap:.35em;justify-content:center;max-width:1150px}
.sent .gone{color:transparent;border-bottom:5px solid var(--cob);border-radius:2px}
.cover{background:var(--cob);color:#fff;border-radius:28px;padding:40px 60px;min-width:min(90vw,520px);border:0}
.dice{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:1100px}
.die{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 10px}
.die small{display:block;color:var(--mute);font-size:15px;font-weight:700}
.die div{font-family:Jua;font-size:clamp(24px,3.4vw,44px);line-height:1.15;margin-top:6px}
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(92vw,760px)}
.cell{aspect-ratio:1.5;background:var(--card);border:2px solid var(--line);border-radius:18px;font-size:clamp(18px,2.6vw,30px);font-weight:700;position:relative;padding:8px}
.cell[data-m]:after{content:attr(data-m);position:absolute;inset:0;display:grid;place-items:center;font-family:Jua;font-size:clamp(60px,9vw,120px);opacity:.85}
.cell[data-m=O]:after{color:var(--cor)}.cell[data-m=X]:after{color:var(--cob)}
.bomb{width:clamp(180px,26vw,300px);aspect-ratio:1}
.ticking .bomb{animation:pulse .6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.boom{background:var(--cor);color:#fff;border-radius:30px;padding:30px 50px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
/* floating widgets */
.fw{position:fixed;z-index:70;background:var(--card);border:2px solid var(--cob);border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.25);display:none;width:min(94vw,360px)}
.fw.show{display:block}
.fwh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 16px;background:var(--cob);color:#fff;border-radius:17px 17px 0 0;font-weight:700}
.fwh button{background:transparent;border:0;color:#fff;font-size:22px;width:44px;height:44px}
#timerW{right:16px;bottom:16px}
#scoreW{left:16px;bottom:16px;width:min(94vw,520px)}
.tnum{font-family:Jua;font-size:76px;text-align:center;line-height:1.1;padding:8px 0}
.tnum.end{color:var(--cor);animation:flick .3s linear 6}
.tpre{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 12px}
.tpre button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;min-height:44px;padding:0 12px;font-weight:700}
.tctl{display:flex;gap:8px;padding:12px}
.tctl button{flex:1}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:12px}
.team{border-radius:14px;padding:8px;text-align:center;color:#fff}
.team input{width:100%;background:transparent;border:0;color:#fff;font:700 16px "Noto Sans KR";text-align:center}
.team .sc{font-family:Jua;font-size:54px;line-height:1}
.team .pm{display:flex;gap:6px;margin-top:6px}
.team .pm button{flex:1;min-height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.25);color:#fff;font-size:22px;font-weight:700}
.sctl{display:flex;gap:8px;padding:0 12px 12px}
textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:16px/1.5 "Noto Sans KR";background:var(--bg);color:var(--ink)}
label.l{font-weight:700;display:block;margin-bottom:6px}
.note{font-size:14px;color:var(--mute)}
@media(max-width:820px){.lvrow{grid-template-columns:repeat(3,minmax(0,1fr))}.dice{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.draw{grid-template-columns:1fr}.drawbtn{min-height:64px}.slot{flex-wrap:wrap}.lvrow{grid-template-columns:repeat(2,minmax(0,1fr))}.tip{grid-template-columns:1fr;gap:2px}.sep{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="band">
 <div class="wrap">
  <div class="top">
   <div><h1>Stella Activity Box</h1><p>리딩·그래머 수업이 지루해질 때 꺼내 쓰는 활동 상자 · 어떤 단원이든, 오늘 배운 내용으로</p></div>
   <div class="tools">
    <button class="tb" id="bContent">오늘 배운 내용</button>
    <button class="tb" id="bTimer">타이머</button>
    <button class="tb" id="bScore">점수판</button>
   </div>
  </div>
  <div class="draw">
   <div class="slot" id="slot"><div class="sv"><div class="sn" id="slotN">오늘은 어떤 활동?</div><div class="sk" id="slotK">레벨과 조건을 고르고 뽑기 버튼을 눌러 보세요</div></div><button class="sgo" id="slotGo" hidden>활동 열기</button></div>
   <button class="drawbtn" id="bDraw">활동 뽑기!</button>
  </div>
 </div>
</header>

<section class="filters">
 <div class="wrap">
  <div class="lvrow" id="lvrow"></div>
  <div class="frow" id="frow"></div>
 </div>
</section>

<main class="band" style="padding-top:8px">
 <div class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
 </div>
</main>

<div class="ov" id="detail"><div class="sheet" id="sheet"></div></div>

<div class="ov" id="contentOv"><div class="sheet">
 <div class="sh G"><h2>오늘 배운 내용</h2><div class="k">여기 넣은 단어·문장으로 '바로 실행' 도구가 움직여요</div><button class="x" data-close="contentOv" aria-label="닫기">×</button></div>
 <div class="sb">
  <div><label class="l" for="tWords">단어 (한 줄에 하나, 또는 쉼표로)</label><textarea id="tWords"></textarea></div>
  <div><label class="l" for="tSents">문장 (한 줄에 한 문장 · 이야기 순서대로 넣으면 '순서 맞추기'에 그대로 쓰여요)</label><textarea id="tSents"></textarea></div>
  <p class="note" id="sampleNote">지금 들어있는 내용은 샘플입니다. 오늘 수업 단원으로 바꿔 넣어 주세요. 이 기기 브라우저에 저장됩니다.</p>
  <div class="acts"><button class="btn p" id="saveContent">저장하기</button><button class="btn" id="resetContent">샘플로 되돌리기</button></div>
 </div>
</div></div>

<div id="stage"><div class="stbar"><h2 id="stTitle">도구</h2><button class="tb" id="stTimer">타이머</button><button class="tb" id="stScore">점수판</button><button class="x" id="stClose" aria-label="닫기">×</button></div><div class="stbody" id="stBody"></div></div>

<div class="fw" id="timerW">
 <div class="fwh"><span>타이머</span><button data-hide="timerW" aria-label="닫기">×</button></div>
 <div class="tnum" id="tnum">01:00</div>
 <div class="tpre" id="tpre"></div>
 <div class="tctl"><button class="btn b" id="tStart">시작</button><button class="btn" id="tReset">리셋</button><button class="btn" id="tWatch">스톱워치</button></div>
</div>

<div class="fw" id="scoreW">
 <div class="fwh"><span>점수판</span><button data-hide="scoreW" aria-label="닫기">×</button></div>
 <div class="teams" id="teams"></div>
 <div class="sctl"><button class="btn" id="tm2">2팀</button><button class="btn" id="tm3">3팀</button><button class="btn" id="tm4">4팀</button><button class="btn" id="tmReset">0점으로</button></div>
</div>

<script>
{
const LV={1:["Starter","파닉스·패턴스토리북 · 초1~2"],2:["Junior","브릭스 30~50 · 초2~4"],3:["Inter","브릭스 60~80 · 초4~6"],4:["Middle","리더스뱅크·중등 문법"]};
const TY={warm:"워밍업·환기",team:"팀 대항",pair:"짝 활동",solo:"개인",move:"움직이기"};
const AR={R:"Reading",G:"Grammar",RG:"Reading+Grammar"};
const SK={R:"읽기",L:"듣기",S:"말하기",W:"쓰기",G:"문법"};
const TOOLS={picker:"단어 뽑기 카드",scramble:"문장 배열",flash:"번개 단어",vanish:"사라지는 문장",sequence:"순서 맞추기",bomb:"폭탄 타이머",dice:"문장 주사위",ttt:"틱택토 보드",voices:"목소리 룰렛"};

const pick=a=>a[Math.floor(Math.random()*a.length)];
let AC=null;
function beep(f=660,d=.15,v=.2){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type="square";g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

/* filters */
function renderFilters(){
 $("lvrow").innerHTML=[0,1,2,3,4].map(l=>`<button class="lv${S.lv===l?" on":""}" data-lv="${l}"><b>${l?"L"+l+" "+LV[l][0]:"전체 레벨"}</b><span>${l?LV[l][1]:"모든 활동 보기"}</span></button>`).join("");
 const ch=(g,v,t,cls="")=>`<button class="chip ${cls}${S[g]===v?" on":""}" data-g="${g}" data-v="${v}">${t}</button>`;
 $("frow").innerHTML=ch("area","all","전체 영역")+ch("area","R","Reading","r")+ch("area","G","Grammar","g")+'<span class="sep"></span>'+
  ch("type","all","모든 유형")+Object.entries(TY).map(([k,v])=>ch("type",k,v)).join("")+'<span class="sep"></span>'+
  ch("time",0,"시간 무관")+ch("time",5,"5분 이내")+ch("time",8,"8분 이내")+
  `<button class="chip${S.noprep?" on":""}" id="np">준비물 없음</button><button class="chip${S.tool?" on":""}" id="tl">바로 실행 가능</button>`+
  `<input class="search" id="q" placeholder="활동 이름·키워드 검색" value="${esc(S.q)}">`;
}
function filtered(){
 const q=S.q.trim().toLowerCase();
 return A.filter(a=>(!S.lv||a.lv.includes(S.lv))&&(S.area==="all"||a.a.includes(S.area))&&(S.type==="all"||a.t===S.type)&&(!S.time||a.m<=S.time)&&(!S.noprep||a.p.startsWith("없음"))&&(!S.tool||a.tool)&&(!q||(a.n+a.k+a.d).toLowerCase().includes(q)));
}
function renderGrid(){
 const L=filtered();
 $("count").textContent=`활동 ${L.length}개${S.lv?" · L"+S.lv+" "+LV[S.lv][0]+" 기준":""}`;
 $("grid").innerHTML=L.length?L.map(a=>`<button class="card" data-id="${a.id}"><span class="tab ${a.a}"></span><div class="cn">${a.n}</div><div class="ck">${a.k}</div><p class="cd">${a.d}</p><div class="meta"><span>${a.m}분</span><span>${TY[a.t]}</span><span>${a.p.startsWith("없음")?"준비물 없음":a.p}</span><span>L${a.lv.join("·")}</span>${a.tool?'<span class="run">바로 실행</span>':""}</div></button>`).join(""):'<div class="empty">조건에 맞는 활동이 없어요. 조건을 하나 풀어 보세요.</div>';
}
document.addEventListener("click",e=>{
 const lv=e.target.closest("[data-lv]");if(lv){S.lv=+lv.dataset.lv;renderFilters();renderGrid();return}
 const c=e.target.closest("[data-g]");if(c){const g=c.dataset.g;S[g]=g==="time"?+c.dataset.v:c.dataset.v;renderFilters();renderGrid();return}
 if(e.target.id==="np"){S.noprep=!S.noprep;renderFilters();renderGrid();return}
 if(e.target.id==="tl"){S.tool=!S.tool;renderFilters();renderGrid();return}
 const cd=e.target.closest(".card");if(cd){openDetail(cd.dataset.id);return}
 const cl=e.target.closest("[data-close]");if(cl){$(cl.dataset.close).classList.remove("show");return}
 const hd=e.target.closest("[data-hide]");if(hd){$(hd.dataset.hide).classList.remove("show");return}
 if(e.target.classList.contains("ov"))e.target.classList.remove("show");
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;renderGrid()}});

/* detail */
let cur=null;
function openDetail(id){
 const a=A.find(x=>x.id===id);cur=a;
 const tips=a.lv.map(l=>`<div class="tip${S.lv===l?" cur":""}"><b>L${l} ${LV[l][0]}</b><span>${a.tip[l]||""}</span></div>`).join("");
 $("sheet").innerHTML=`<div class="sh ${a.a}"><h2>${a.n}</h2><div class="k">${a.k} · ${AR[a.a]}</div><button class="x" data-close="detail" aria-label="닫기">×</button></div>
 <div class="sb"><p style="margin:0;font-size:20px">${a.d}</p>
 <div class="facts"><span>${a.m}분</span><span>${TY[a.t]}</span><span>준비물: ${a.p}</span><span>${[...a.sk].map(s=>SK[s]).join(" · ")}</span></div>
 <div class="acts">${a.tool?`<button class="btn p" id="dRun">바로 실행 — ${TOOLS[a.tool]}</button>`:""}<button class="btn b" id="dTimer">${a.m}분 타이머</button><button class="btn" id="dScore">점수판 열기</button></div>
 <div><h3>진행 방법</h3><ol class="steps">${a.st.map(s=>`<li><span>${s}</span></li>`).join("")}</ol></div>
 <div><h3>Teacher's English</h3><div class="say">${a.say.map(s=>`<div>${s}</div>`).join("")}</div></div>
 <div><h3>레벨별로 이렇게</h3><div class="tips">${tips}</div></div></div>`;
 $("detail").classList.add("show");$("detail").scrollTop=0;
 if(a.tool)$("dRun").onclick=()=>runTool(a.tool,a.n);
 $("dTimer").onclick=()=>{setTimer(a.m*60);$("timerW").classList.add("show")};
 $("dScore").onclick=()=>$("scoreW").classList.add("show");
}

/* draw */
$("bDraw").onclick=()=>{
 const L=filtered();if(!L.length){$("slotN").textContent="조건에 맞는 활동이 없어요";return}
 const slot=$("slot");slot.classList.add("spin");$("slotGo").hidden=true;let n=0;
 const iv=setInterval(()=>{const a=pick(L);$("slotN").textContent=a.n;$("slotK").textContent=a.k;beep(400+n*20,.04,.05);n++;
  if(n>16){clearInterval(iv);slot.classList.remove("spin");const f=pick(L);$("slotN").textContent=f.n;$("slotK").textContent=`${f.k} · ${f.m}분 · ${TY[f.t]}`;$("slotGo").hidden=false;$("slotGo").onclick=()=>openDetail(f.id);beep(880,.25,.15)}},70);
};

/* content */
$("bContent").onclick=()=>{$("tWords").value=C.w.join("\n");$("tSents").value=C.s.join("\n");$("sampleNote").style.display=C.sample?"block":"none";$("contentOv").classList.add("show")};
$("saveContent").onclick=()=>{C={w:$("tWords").value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean),s:$("tSents").value.split(/\n+/).map(x=>x.trim()).filter(Boolean),sample:false};store.set("sab_content",C);$("contentOv").classList.remove("show")};
$("resetContent").onclick=()=>{$("tWords").value=SAMPLE.w.join("\n");$("tSents").value=SAMPLE.s.join("\n")};

/* stage tools */
const body=()=>$("stBody");
function need(arr,min,what){if(arr.length>=min)return true;body().innerHTML=`<div class="mid">${what}이(가) ${min}개 이상 필요해요</div><button class="btn p" id="goC">오늘 배운 내용 입력하기</button>`;$("goC").onclick=()=>{$("bContent").click()};return false}
function runTool(t,title){$("stTitle").textContent=title+" · "+TOOLS[t];$("stage").classList.add("show");stopBomb();({picker,scramble,flash,vanish,sequence,bomb,dice,ttt,voices})[t]()}
$("stClose").onclick=()=>{$("stage").classList.remove("show");stopBomb()};
$("stTimer").onclick=()=>$("timerW").classList.toggle("show");
$("stScore").onclick=()=>$("scoreW").classList.toggle("show");

function picker(){
 if(!need(C.w,1,"단어"))return;let deck=shuffle(C.w),w=deck.pop(),open=false;
 const r=()=>{body().innerHTML=`<button class="cover big" id="pc">${open?esc(w):"탭해서 보기"}</button><div class="row"><button class="btn p" id="pn">새 단어</button><button class="btn" id="pt">${open?"숨기기":"보이기"}</button></div><div class="hint">남은 단어 ${deck.length}개 · 학생이 칠판을 등지고 있을 때 보여 주세요</div>`;
  $("pc").onclick=$("pt").onclick=()=>{open=!open;r()};$("pn").onclick=()=>{if(!deck.length)deck=shuffle(C.w);w=deck.pop();open=false;r()}};r();
}
function builder(units,joiner,answer,next,label){
 let pool=shuffle(units.map((u,i)=>({u,i})));if(units.length>1)while(pool.every((p,k)=>p.u===answer[k]))pool=shuffle(pool);
 let picked=[],state="";
 const r=()=>{const isSeq=joiner==="\n";
  body().innerHTML=`<div class="hint">${label}</div><div class="ans ${state}${isSeq?" seqc":""}" id="ans">${picked.length?picked.map((p,k)=>`<button class="wc picked" data-k="${k}">${isSeq?(k+1)+". ":""}${esc(p.u)}</button>`).join(""):'<span class="hint">아래 카드를 순서대로 터치하세요</span>'}</div>
  <div class="${isSeq?"seqc":"chips"}">${pool.map((p,k)=>`<button class="wc" data-p="${k}">${esc(p.u)}</button>`).join("")}</div>
  <div class="row"><button class="btn p" id="bc">정답 확인</button><button class="btn" id="bs">정답 보기</button><button class="btn" id="br">다시</button>${next?'<button class="btn b" id="bn">다음 문장</button>':""}</div>`;
  body().querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{picked.push(pool.splice(+b.dataset.p,1)[0]);state="";r()});
  body().querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pool.push(picked.splice(+b.dataset.k,1)[0]);state="";r()});
  $("bc").onclick=()=>{const ok=picked.length===answer.length&&picked.every((p,k)=>p.u===answer[k]);state=ok?"good":"bad";beep(ok?880:200,.3,.15);r()};
  $("bs").onclick=()=>{picked=answer.map((u,i)=>({u,i}));pool=[];state="good";r()};
  $("br").onclick=()=>{pool=shuffle(units.map((u,i)=>({u,i})));picked=[];state="";r()};
  if(next)$("bn").onclick=next;};r();
}
let si=0;
function scramble(){
 if(!need(C.s,1,"문장"))return;const s=C.s[si%C.s.length];const t=s.split(/\s+/);
 builder(t," ",t,()=>{si++;scramble()},`문장 ${si%C.s.length+1} / ${C.s.length}`);
}
function sequence(){
 if(!need(C.s,2,"문장"))return;const u=C.s.slice(0,8);builder(u,"\n",u,null,"이야기 순서대로 터치하세요 (최대 8문장)");
}
function flash(){
 if(!need(C.w,1,"단어"))return;let ms=+(store.get("sab_flash")||600),w=pick(C.w),show=false,rev=false;
 const r=()=>{body().innerHTML=`<div class="big" style="min-height:1.3em">${show||rev?esc(w):"?"}</div><div class="row">${[300,600,1000].map(v=>`<button class="btn${v===ms?" b":""}" data-ms="${v}">${v/1000}초</button>`).join("")}</div><div class="row"><button class="btn p" id="ff">Flash!</button><button class="btn" id="fr">정답 보기</button><button class="btn" id="fn">새 단어</button></div>`;
  body().querySelectorAll("[data-ms]").forEach(b=>b.onclick=()=>{ms=+b.dataset.ms;store.set("sab_flash",ms);r()});
  $("ff").onclick=()=>{rev=false;show=true;r();setTimeout(()=>{show=false;r()},ms)};
  $("fr").onclick=()=>{rev=true;r()};$("fn").onclick=()=>{w=pick(C.w);rev=false;show=false;r()}};r();
}
let vi=0;
function vanish(){
 if(!need(C.s,1,"문장"))return;const t=C.s[vi%C.s.length].split(/\s+/);let hid=new Set(),peek=false;
 const r=()=>{body().innerHTML=`<div class="sent">${t.map((w,i)=>`<span class="${hid.has(i)&&!peek?"gone":""}">${esc(w)}</span>`).join("")}</div><div class="hint">숨긴 단어 ${hid.size} / ${t.length}</div><div class="row"><button class="btn p" id="vh">단어 하나 숨기기</button><button class="btn" id="vp">${peek?"다시 가리기":"살짝 보기"}</button><button class="btn" id="vr">처음부터</button><button class="btn b" id="vn">다음 문장</button></div>`;
  $("vh").onclick=()=>{const left=t.map((_,i)=>i).filter(i=>!hid.has(i));if(left.length){hid.add(pick(left));peek=false;r()}};
  $("vp").onclick=()=>{peek=!peek;r()};$("vr").onclick=()=>{hid=new Set();r()};$("vn").onclick=()=>{vi++;vanish()}};r();
}
let bombT=null,bombI=null;
function stopBomb(){clearTimeout(bombT);clearInterval(bombI);bombT=bombI=null}
const MISSIONS=["오늘 단어 3개로 문장 하나 만들기","본문 한 문장을 로봇 목소리로 읽기","오늘 단어 하나를 영어로 설명하기","친구에게 영어 질문 하나 하기","오늘 배운 문장을 거꾸로 말하기 도전!","팀원 한 명과 함께 문장 읽기"];
function bomb(){
 const svg=`<svg class="bomb" viewBox="0 0 200 200" aria-hidden="true"><circle cx="95" cy="115" r="70" fill="#1d2140"/><circle cx="70" cy="90" r="18" fill="#fff" opacity=".25"/><rect x="118" y="38" width="26" height="22" rx="4" transform="rotate(30 131 49)" fill="#5a6080"/><path d="M140 40 Q160 15 178 22" stroke="#c99a10" stroke-width="6" fill="none"/><circle cx="180" cy="22" r="10" fill="#ff5b4a"/></svg>`;
 body().innerHTML=`<div id="bw">${svg}</div><div class="mid" id="bm">시작을 누르고 폭탄을 돌리세요!</div><div class="row"><button class="btn p" id="bs">시작</button><button class="btn" id="bx">멈춤</button></div>`;
 $("bs").onclick=()=>{stopBomb();$("bw").className="ticking";$("bm").textContent="말하고 넘겨요! 언제 터질까…";
  const dur=15000+Math.random()*30000,start=Date.now();bombI=setInterval(()=>beep(Date.now()-start>dur*.7?1000:700,.05,.08),450);
  bombT=setTimeout(()=>{stopBomb();beep(120,.8,.3);body().innerHTML=`<div class="boom"><div class="big">BOOM!</div><div class="mid">미션: ${pick(MISSIONS)}</div></div><div class="row"><button class="btn p" id="ba">다시 하기</button></div>`;$("ba").onclick=bomb},dur)};
 $("bx").onclick=()=>{stopBomb();$("bw").className="";$("bm").textContent="멈췄어요"};
}
const WHO=["I","You","He","She","We","They","My mom","The fox"],WHEN=["yesterday","every day","tomorrow","right now","last weekend","next week","always","two days ago"],KIND=["긍정문","부정문","의문문"];
function dice(){
 const words=C.w.length?C.w:["play","eat","read"];let v=[pick(WHO),pick(words),pick(WHEN),pick(KIND)];
 const r=()=>{body().innerHTML=`<div class="dice">${[["누가 Who",v[0]],["단어 Word",v[1]],["언제 When",v[2]],["문장 종류",v[3]]].map(d=>`<div class="die"><small>${d[0]}</small><div>${esc(d[1])}</div></div>`).join("")}</div><div class="hint">나온 조합으로 시제와 형태가 맞는 문장을 만들어요</div><div class="row"><button class="btn p" id="dr">주사위 굴리기</button></div>`;
  $("dr").onclick=()=>{let n=0;const iv=setInterval(()=>{v=[pick(WHO),pick(words),pick(WHEN),pick(KIND)];r();beep(500,.03,.05);if(++n>10)clearInterval(iv)},60)}};r();
}
function ttt(){
 let base=shuffle(C.w).concat(shuffle(SAMPLE.w)).filter((x,i,a)=>a.indexOf(x)===i).slice(0,9),m=Array(9).fill("");
 const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 const r=()=>{const win=lines.find(l=>m[l[0]]&&l.every(i=>m[i]===m[l[0]]));
  body().innerHTML=`<div class="ttt">${base.map((w,i)=>`<button class="cell" data-c="${i}"${m[i]?` data-m="${m[i]}"`:""}>${esc(w)}</button>`).join("")}</div><div class="mid">${win?`${m[win[0]]} 팀 승리!`:'<span class="hint">칸을 터치할 때마다 O → X → 빈칸</span>'}</div><div class="row"><button class="btn p" id="tn">새 보드</button><button class="btn" id="tc">표시 지우기</button></div>`;
  body().querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const i=+b.dataset.c;m[i]=m[i]===""?"O":m[i]==="O"?"X":"";r()});
  $("tn").onclick=ttt;$("tc").onclick=()=>{m=Array(9).fill("");r()};if(win)beep(880,.3,.15)};r();
}
const VOICES=["Whisper 속삭이기","Robot 로봇","Baby 아기","Giant 거인","Opera 오페라 가수","Super fast 초고속","Super slow 슬로모션","Angry 화난 목소리","Sad 슬픈 목소리","News reporter 뉴스 앵커","Monster 괴물","Grandpa 할아버지"];
function voices(){
 let v="?";const r=()=>{body().innerHTML=`<div class="big">${esc(v)}</div><div class="row"><button class="btn p" id="vs">룰렛 돌리기</button></div>`;
  $("vs").onclick=()=>{let n=0;const iv=setInterval(()=>{v=pick(VOICES);r();beep(450+n*15,.03,.05);if(++n>18){clearInterval(iv);beep(900,.25,.15)}},70)}};r();
}

/* timer */
let tLeft=60,tBase=60,tRun=null,watch=false;
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tShow(){$("tnum").textContent=fmt(tLeft);$("tStart").textContent=tRun?"일시정지":"시작";$("tWatch").classList.toggle("b",watch)}
function setTimer(s){clearInterval(tRun);tRun=null;watch=false;tLeft=tBase=s;$("tnum").classList.remove("end");tShow()}
$("tpre").innerHTML=[[30,"30초"],[60,"1분"],[120,"2분"],[180,"3분"],[300,"5분"],[600,"10분"]].map(p=>`<button data-t="${p[0]}">${p[1]}</button>`).join("");
$("tpre").onclick=e=>{const b=e.target.closest("[data-t]");if(b)setTimer(+b.dataset.t)};
$("tStart").onclick=()=>{if(tRun){clearInterval(tRun);tRun=null;tShow();return}
 beep(700,.05,.05);tRun=setInterval(()=>{if(watch){tLeft++}else{tLeft--;if(tLeft<=5&&tLeft>0)beep(800,.08,.1);if(tLeft<=0){tLeft=0;clearInterval(tRun);tRun=null;$("tnum").classList.add("end");beep(520,.6,.25);setTimeout(()=>beep(780,.6,.25),300)}}tShow()},1000);tShow()};
$("tReset").onclick=()=>{watch?(clearInterval(tRun),tRun=null,tLeft=0,tShow()):setTimer(tBase)};
$("tWatch").onclick=()=>{clearInterval(tRun);tRun=null;watch=true;tLeft=0;$("tnum").classList.remove("end");tShow()};
$("bTimer").onclick=()=>$("timerW").classList.toggle("show");

/* score */
const TC=["#ff5b4a","#2346d6","#18a058","#e09a00"];
let SC=store.get("sab_score")||{n:2,t:[{name:"Team A",s:0},{name:"Team B",s:0},{name:"Team C",s:0},{name:"Team D",s:0}]};
function rScore(){store.set("sab_score",SC);$("teams").innerHTML=SC.t.slice(0,SC.n).map((t,i)=>`<div class="team" style="background:${TC[i]}"><input data-tn="${i}" value="${esc(t.name)}" aria-label="팀 이름"><div class="sc">${t.s}</div><div class="pm"><button data-d="${i}" data-v="-1" aria-label="1점 빼기">−</button><button data-d="${i}" data-v="1" aria-label="1점 더하기">+</button></div></div>`).join("")}
$("teams").onclick=e=>{const b=e.target.closest("[data-d]");if(b){SC.t[+b.dataset.d].s+= +b.dataset.v;beep(+b.dataset.v>0?880:300,.1,.1);rScore()}};
$("teams").oninput=e=>{if(e.target.dataset.tn){SC.t[+e.target.dataset.tn].name=e.target.value;store.set("sab_score",SC)}};
[2,3,4].forEach(n=>$("tm"+n).onclick=()=>{SC.n=n;rScore()});
$("tmReset").onclick=()=>{SC.t.forEach(t=>t.s=0);rScore()};
$("bScore").onclick=()=>$("scoreW").classList.toggle("show");

document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("stage").classList.contains("show")){$("stClose").click()}else{document.querySelectorAll(".ov.show").forEach(o=>o.classList.remove("show"))}}});
renderFilters();renderGrid();rScore();tShow();
}
</script>
</body>
</html>
