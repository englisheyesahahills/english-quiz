<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의고사 채점 결과</title>

<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--red:#e0312b;--blue:#2457c5;--ink:#1b2133;--muted:#5c6478;--line:#c9cedb;--paper:#fffdf8}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e9ebf1;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;color-scheme:light}
button{font:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
header .w{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:"Do Hyeon",sans-serif;font-size:19px;flex:1;white-space:nowrap}
@media (max-width:480px){.head{flex-direction:column}.sc{margin:0 auto}}
.hb{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.hb.on{background:#fff;color:var(--navy)}
main{max-width:860px;margin:0 auto;padding:12px 10px 50px}
.paper{background:var(--paper);border-radius:6px;box-shadow:0 2px 10px rgba(20,30,60,.12);padding:18px 18px 24px;margin-bottom:14px}
.head{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--navy);border-radius:8px;padding:10px 14px;position:relative}
.head .s{color:var(--bur);font-weight:700;font-size:13px}
.head h1{font-size:20px;margin:2px 0 6px;color:var(--navy)}
.head .who{font-size:14px}.head .who b{font-size:17px}
.sc{margin-left:auto;text-align:center;font-family:"Nanum Pen Script",cursive;color:var(--red);transform:rotate(-6deg);min-width:120px}
.sc .big{font-size:64px;line-height:.9}.sc .big small{font-size:30px}
.sc .u{height:3px;background:var(--red);border-radius:2px;margin:2px 6px 0}.sc .u+.u{margin-top:3px}
.sc .det{font-size:18px;line-height:1.1;margin-top:4px;white-space:nowrap}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;font-size:13px}
.sum span{border-radius:999px;padding:2px 10px;font-weight:700}
.sum .w{background:#fde8e7;color:var(--red)}.sum .g{background:#e6f4ec;color:#1f8a4c}.sum .p{background:#eef0f6;color:var(--muted)}
.guide{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sec{background:var(--navy);color:#fff;font-weight:700;padding:3px 10px;border-radius:4px;margin:16px 0 10px;font-size:14px}
.pass{border:1.2px solid #9aa3b8;background:#f3f5f9;border-radius:6px;padding:8px 10px;margin:0 0 10px;font-size:14px;line-height:1.6}
.q{position:relative;margin:0 0 16px;padding:6px 6px 6px 8px;border-radius:6px}
.q b.n{color:var(--navy);font-size:16px}
.ar{font-size:11px;color:var(--bur);border:1px solid var(--bur);border-radius:3px;padding:0 4px;margin:0 2px}
.o{margin:4px 0 0 8px}.o>div{padding:1px 6px;border-radius:5px;margin:1px 0}
.o .my{outline:2px solid var(--blue);outline-offset:-1px;background:#edf2fd}
.o .my::after{content:" ← 내 답";color:var(--blue);font-weight:700;font-size:12px}
.show .o .ans{background:#e6f4ec;font-weight:700}
.show .o .ans::after{content:" ✔ 정답";color:#1f8a4c;font-weight:700;font-size:12px}
.show .o .my.ans::after{content:" ← 내 답 ✔ 정답"}
.ln{border-bottom:1px dashed #b9bfcc;height:22px}
.mine{font-family:"Nanum Pen Script",cursive;font-size:25px;color:var(--blue);line-height:1.15;margin:6px 0 0 6px;word-break:break-word}
.mine.none{color:#9aa3b8;font-size:20px}
.pt{font-family:"Nanum Pen Script",cursive;color:var(--red);font-size:28px;position:absolute;right:6px;top:-4px;transform:rotate(-6deg)}
.exp{display:none;margin:8px 0 0;background:#f1f7f3;border-left:4px solid #1f8a4c;border-radius:4px;padding:6px 10px;font-size:13.5px}
.show .exp{display:block}
.q b.n{position:relative;display:inline-block}.mk{position:absolute;left:-17px;top:-17px;width:58px;height:58px;pointer-events:none}
.wrong{background:rgba(224,49,43,.045)}
.only .q.ok{display:none}.only .pass{display:none}.only .q.wrong .pctx{display:block}
.pctx{display:none;font-size:13px;border:1px solid #c9cedb;background:#f3f5f9;border-radius:6px;padding:6px 8px;margin:6px 0}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
.err{background:#fff;border-radius:10px;padding:30px;text-align:center;color:var(--muted)}
@media (min-width:760px){.cols{column-count:2;column-gap:28px;column-rule:1px solid #dde0e8}.q,.pass{break-inside:avoid}.sec{break-after:avoid}}
@media print{header{display:none}body{background:#fff}.paper{box-shadow:none;padding:0}main{padding:0}}
</style>
</head>

=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>나는 앞으로 세계적으로 유명한 요리사가 되고 싶어!<div class=\"ch\">( being / a world-famous chef / to be / I / want / in the future / on )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>나는 여행하는 것을 좋아하고 도전을 즐긴다.<div class=\"ch\">( enjoy / and / like / I / challenges / enjoying / challenge / to travel )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> to부정사를 사용하여 영작하시오. (A lot of people로 시작)<br>많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 다음 문장을 to를 사용한 3형식 문장으로 바꾸시오.<br>People didn't give her many likes.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> to부정사 사용, 9단어<br>Chris는 바다 소리를 만들기 위해 쌀을 사용했다. (the sound of waves)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <변형> 아래 본문 문장을 '<b>나</b>'를 주어로, '<b>영어 실력을 늘리기 위해</b>'라는 목적으로 바꿔 쓰시오. (improve my English)<br>A lot of people are working hard to create this movie.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> It으로 시작, 3단어<br>오늘은 수요일이다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">사하중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>Sam은 고양이에게 먹이를 주기 위해 우유를 샀다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">사하중 학습지</span> to부정사를 사용하여 한 문장으로 쓰세요.<br>Mina went to the market. + She wanted to buy some fruit.<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1yun_dangri":"<div c all the cameras. Today, Tom and Max are going to play together with a ball on the beach. <u>To capture</u> their happy moments, I'm going to use drones.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Peter is the director of photography.</div><div>② Peter will play with Max.</div><div>③ They will play with a ball.</div><div>④ Peter is going to use drones.</div><div>⑤ Tom and Max will play on the beach.</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 오늘 촬영할 장면으로 알맞은 것은?<div class=\"o\"><div>① Tom이 Max를 목욕시키는 장면</div><div>② Tom이 드론을 날리는 장면</div><div>③ Max가 혼자 자는 장면</div><div>④ Tom과 Max가 해변에서 공놀이하는 장면</div><div>⑤ Max가 수영하는 장면</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ③ Jennifer</b><br>I'm Jennifer. I trained and took care of Max for a long time. Max is a great actor, but he sometimes gets too excited when a lot of people are around. So, I use hand signals <u>to calm</u> him. Who am I? I'm an animal wrangler.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> Max에 대한 설명으로 알맞은 것은?<div class=\"o\"><div>① Max는 사람이 많으면 가끔 너무 흥분한다.</div><div>② Max는 연기를 못한다.</div><div>③ Max는 Jennifer를 싫어한다.</div><div>④ Max는 항상 조용하다.</div><div>⑤ Max는 고양이다.</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ②</b><br>One day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. <u>It</u> was getting dark, and it started to rain. She opened the door and walked inside.<br>There were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn't care.<br>“It's so fun!” shouted Goldilocks.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> Goldilocks가 오두막 안으로 들어간 상황으로 알맞은 것은?<div class=\"o\"><div>① 곰들이 그녀를 초대했다.</div><div>② 날이 어두워지고 비가 내리기 시작했다.</div><div>③ 문을 두드렸더니 대답이 있었다.</div><div>④ 배가 고파서 음식 냄새를 따라갔다.</div><div>⑤ 친구가 안에서 기다리고 있었다.</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하는 것은?<div class=\"o\"><div>① Someone answered the door.</div><div>② There were two bowls of soup.</div><div>③ She ate the biggest soup.</div><div>④ She was sorry when the chair broke.</div><div>⑤ She jumped on the smallest chair again and again.</div></div></div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">통합</span> 밑줄 친 It과 같은 쓰임의 It이 있는 대화문 문장은?<div class=\"o\"><div>① It looks a little boring.</div><div>② It's pretty good.</div><div>③ It's very light.</div><div>④ It snowed all day yesterday.</div><div>⑤ It's too thick and heavy.</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ⑤</b><br>All summer long, Goldilocks worked hard. On the last day, Goldilocks said to Father Bear, “I deleted all my posts of your cottage, so please don't worry.”<br>“You still don't understand. Other people already shared them on social media. Your posts will <u>live on</u> forever,” said Father Bear.<br>“Oh, I didn't think about that,” said Goldilocks. “From now on, I'll think twice before I press POST.”</div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">본문</span> 밑줄 친 live on의 의미로 가장 알맞은 것은?<div class=\"o\"><div>① ~을 먹고 살다</div><div>② 사라지다</div><div>③ 생방송하다</div><div>④ ~ 위에 살다</div><div>⑤ 계속 남아 있다</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 밑줄 친 to부정사의 의미가 '~해서(감정의 원인)'인 것은?<div class=\"o\"><div>① I was happy <u>to meet</u> my favorite actor.</div><div>② I need a pen <u>to write</u> with.</div><div>③ My dream is <u>to be</u> a chef.</div><div>④ He got up early <u>to catch</u> the bus.</div><div>⑤ She decided <u>to travel</u> alone.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 두 문장을 한 문장으로 바르게 바꾼 것은?<br><br>Peter uses drones. He wants to capture happy moments.<div class=\"o\"><div>① Peter uses drones capture happy moments.</div><div>② Peter uses drones capturing happy moments.</div><div>③ Peter uses drones for capture happy moments.</div><div>④ Peter uses drones to capture happy moments.</div><div>⑤ Peter uses to drones capture happy moments.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 다음 문장을 3형식으로 바르게 바꾼 것은?<br><br>People didn't give Goldilocks many likes.<div class=\"o\"><div>① People didn't give many likes for Goldilocks.</div><div>② Goldilocks didn't give people many likes.</div><div>③ People didn't give to Goldilocks many likes.</div><div>④ People didn't give Goldilocks to many likes.</div><div>⑤ People didn't give many likes to Goldilocks.</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">문법</span> 질문에 대한 대답으로 알맞은 것은?<br><br>Q: What's the weather like in Busan today?<div class=\"o\"><div>① It's Monday.</div><div>② It's windy and cold.</div><div>③ It's 10 o'clock.</div><div>④ It's December 1st.</div><div>⑤ It's my phone.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">당리중 학습지</span> Why does Emma read a lot?<div class=\"o\"><div>① Because she wants to be a director.</div><div>② Because she wants to train Max.</div><div>③ Because storytelling skills are important for her job.</div><div>④ Because she has to find new actors.</div><div>⑤ Because she likes the beach.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">당리중 학습지</span> What is the main idea of the passage?<div class=\"o\"><div>① How to train a dog</div><div>② Different people who work hard to make a movie</div><div>③ The most beautiful beach in the world</div><div>④ How to make sound effects at home</div><div>⑤ Why people love dogs</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">당리중 학습지</span> Which is <b>TRUE</b> according to the passage?<div class=\"o\"><div>① Anna takes care of Max.</div><div>② Peter edits the movie scenes.</div><div>③ Jennifer trained Max for a long time.</div><div>④ Chris finds places for shooting.</div><div>⑤ Emma uses drones to film the actors.</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">당리중 학습지</span> When does Chris create sound effects in his studio?<div class=\"o\"><div>① When Max is too excited.</div><div>② When recording on location is not easy.</div><div>③ When the shooting begins.</div><div>④ When Emma changes the scenes.</div><div>⑤ When it rains on the beach.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">당리중 학습지</span> Why does Anna love her job?<div class=\"o\"><div>① She likes dogs.</div><div>② She likes to travel and enjoy challenges.</div><div>③ She likes making sound effects.</div><div>④ She likes using drones.</div><div>⑤ She likes reading books.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> Lucy의 'I'm interested in making airplanes, not flying.'에서 생략된 내용을 완전한 문장으로 쓰시오. (I'm not으로 시작)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>그리고 그것은 종이책보다 더 저렴하기도 해.<div class=\"ch\">( than / cheaper / it's / and / the paper book / more / also / cheap )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>물론, 그것은 쉽지 않지만, 나는 내 일을 사랑해요.<div class=\"ch\">( but / love / so / my job / it / is not / easy / of course / I )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> so를 사용하여 한 문장으로 쓰시오.<br>Storytelling skills are important for my job. I read a lot.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>너는 이런 것들이 잘못이라는 것을 모르니?<div class=\"ch\">( you / doesn't / wrong / don't / these things / are / know / is )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <변형> 아래 본문 문장을 '<b>나</b>'를 주어로, '<b>영어 실력을 늘리기 위해</b>'라는 목적으로 바꿔 쓰시오. (improve my English)<br>A lot of people are working hard to create this movie.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> not to 사용, 11단어<br>Jake는 감기에 걸리지 않기 위해 따뜻한 재킷을 입었다. (put on, catch a cold)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> It으로 시작, 3단어<br>오늘은 수요일이다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">당리중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>나는 너를 만나서 기쁘다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">당리중 학습지</span> Peter는 행복한 순간을 담기 위해 드론을 사용할 것이다. (be going to, capture)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1lee_dongju":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Topic 1 · Listen and Number 3]</b><br>G: What do you think about the magic show?<br>B: I think it's amazing.<br>G: I feel the same. I think magic is so cool.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① The boy thinks the magic show is boring.</div><div>② Both of them like the magic show.</div><div>③ The girl doesn't agree with the boy.</div><div>④ The girl doesn't like magic.</div><div>⑤ They are watching a dance show.</div></div></div><div class=\"pass\"><b>[Topic 2 · Different Looks]</b><br>Jiho: Look at this picture. What do you think about it, Yena?<br>Yena: I like it. I think the duck is cute.<br>Jiho: What about you, Andy?<br>Andy: I feel the same. The duck's eye is big.<br>Jiho: Kate, what do you think?<br>Kate: I like it, too, but I don't see a duck. I only see a rabbit.<br>Andy: Oh, now I can see the rabbit, too!<br>Yena: That's interesting! We can see different things in the same picture.</div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 주제로 가장 알맞은 것은?<div class=\"o\"><div>① 좋아하는 동물</div><div>② 미술관 관람 예절</div><div>③ 그림 그리는 방법</div><div>④ 오리와 토끼의 차이</div><div>⑤ 같은 그림에서도 서로 다른 것을 볼 수 있다</div></div></div><div class=\"pass\"><b>[Topic 1 · Listen and Write 3]</b><br>G: Inho, did you have a good weekend?<br>B: Yes. I went ice skating with my friends. <u>How about you?</u><br>G: I took a snowboarding lesson. It was really fun.</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> Inho가 주말에 한 일은?<div class=\"o\"><div>① 스노보드 강습을 받았다</div><div>② 영화를 봤다</div><div>③ 친구들과 스케이트를 타러 갔다</div><div>④ 책을 읽었다</div><div>⑤ 배구 경기에 갔다</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 밑줄 친 'How about you?'와 바꿔 쓸 수 있는 것은?<div class=\"o\"><div>① How are you?</div><div>② What about you?</div><div>③ Who are you?</div><div>④ How old are you?</div><div>⑤ Where are you?</div></div></div><div class=\"pass\"><b>Faces of Great Artists ① Introduction</b><br>Who is your favorite artist? What does she or he look like? Some artists painted self-portraits. Why did they paint <u>themselves</u>? Let's find out.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글(도입부)의 목적으로 가장 알맞은 것은?<div class=\"o\"><div>① 화가들이 자화상을 그린 이유를 알아보려고</div><div>② 그림 그리는 법을 가르치려고</div><div>③ 미술관을 소개하려고</div><div>④ 가장 비싼 그림을 알려 주려고</div><div>⑤ 모델이 되는 법을 알려 주려고</div></div></div><div class=\"pass\"><b>Faces of Great Artists ③ Frida Kahlo</b><br>Frida Kahlo was a Mexican artist. When she was six years old, she was very sick. Her right leg became <u>weaker than</u> her left leg. But she thought, “I will get well. I will help sick people like me.” When she was 18, she was in a terrible bus accident. She stayed in the hospital for a long time. Kahlo said to herself, “I look weak. But I am stronger than anyone.” So, Kahlo started to paint herself. She painted 55 self-portraits in her lifetime. Look at her paintings. Does she look strong?</div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Kahlo was a Mexican artist.</div><div>② Her left leg became weaker than her right leg.</div><div>③ She was very sick when she was six.</div><div>④ She was in a bus accident at 18.</div><div>⑤ She painted 55 self-portraits.</div></div></div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> Kahlo에 관한 사건을 시간 순서대로 바르게 나열한 것은?<br><br>(a) She was in a bus accident.<br>(b) She was very sick.<br>(c) She started to paint herself.<div class=\"o\"><div>① (a)-(b)-(c)</div><div>② (b)-(a)-(c)</div><div>③ (b)-(c)-(a)</div><div>④ (c)-(b)-(a)</div><div>⑤ (a)-(c)-(b)</div></div></div><div class=\"pass\"><b>Frindle ②</b><br>On the way home, Nick saw a pen on the street. He <u>picked up</u> the pen. He had an idea.<br>“From today, your new name is <i>frindle</i>.”<br>The next day, he told his friends about his new word. By the end of the week, all his classmates were using it.<br>“Can I borrow your frindle?”<br>“I think <u>that</u> your red frindle is pretty.”</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하는 것은?<div class=\"o\"><div>① Nick bought a pen at a store.</div><div>② Nick found the pen at school.</div><div>③ Nick told his friends about his new word the next day.</div><div>④ Only Nick used the word frindle.</div><div>⑤ His classmates didn't like the word.</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 'By the end of the week'에 일어난 일은?<div class=\"o\"><div>① Nick이 펜을 잃어버렸다.</div><div>② 선생님이 화를 냈다.</div><div>③ 모든 반 친구들이 그 단어를 사용하고 있었다.</div><div>④ Nick이 졸업했다.</div><div>⑤ 사전에 단어가 실렸다.</div></div></div><div class=\"pass\"><b>Frindle ③</b><br>One day after class, Mrs. Granger called Nick. She said, “<i>Frindle</i> is not a real word. You and your classmates should stop using it.” Nick said, “I know that you're not happy. I'm really sorry, but it's too late. Everyone is using it now.” Mrs. Granger <u>took out</u> a letter. She said, “I wrote this letter for you. But I'm not going to give it to you today. <u>I will send you this letter</u> some day.”</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 밑줄 친 문장을 3형식으로 바꾼 것은?<div class=\"o\"><div>① I will send this letter for you.</div><div>② I will send you to this letter.</div><div>③ I will send to you this letter.</div><div>④ I will send this letter to you.</div><div>⑤ I will send this letter you.</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 빈칸에 알맞은 말끼리 짝지은 것은?<br><br>• Van Gogh painted (A)______.<br>• Kahlo said to (B)______, \"I am strong.\"<div class=\"o\"><div>① him – her</div><div>② he – she</div><div>③ his – hers</div><div>④ himself – her</div><div>⑤ himself – herself</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 밑줄 친 재귀대명사를 생략할 수 있는 것은?<div class=\"o\"><div>① Van Gogh painted <u>himself</u>.</div><div>② I made this cake <u>myself</u>.</div><div>③ They painted <u>themselves</u>.</div><div>④ Kahlo said to <u>herself</u>.</div><div>⑤ Enjoy <u>yourself</u>!</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 접속사 that ② know 사용 ③ 과거시제<div class=\"o\"><div>① I knew what he was a good teacher.</div><div>② I know that he is a good teacher.</div><div>③ I knew he good teacher.</div><div>④ I knew that a good teacher.</div><div>⑤ I knew that he was a good teacher.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같은 것은?<div class=\"o\"><div>① He gave me it. = He gave it to me.</div><div>② I sent him a card. = I sent a card to him.</div><div>③ She made me a cake. = She made a cake to me.</div><div>④ He bought her a pen. = He bought a pen to her.</div><div>⑤ Tell me it. = Tell it for me.</div></div></div><div class=\"pass\"><b>Frindle ④</b><br>The next morning, Mrs. Granger told the class, “Stop using <i>frindle</i>! <i>Frindle</i> is not a real word.” But <u>more and more</u> students used it. Students in other schools started using it. Soon, students in the whole country were using it.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 밑줄 친 표현과 같은 구조(비교급 and 비교급)가 쓰인 것은?<div class=\"o\"><div>① She is the tallest.</div><div>② It was very cold.</div><div>③ It's lighter than mine.</div><div>④ It's getting colder and colder.</div><div>⑤ He is as tall as me.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① She is taller than her sister.</div><div>② This game is more exciting than that one.</div><div>③ My dog is more cute than your dog.</div><div>④ Health is more important than money.</div><div>⑤ Today is hotter than yesterday.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① He gave me a pen.</div><div>② She bought a cake for me.</div><div>③ I sent a letter to him.</div><div>④ He showed his album for me.</div><div>⑤ Mom made me a sandwich.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">동주여중 학습지</span> 표를 보고 내용과 일치하는 것을 고르세요.<br>Jin 15세·155cm / Lua 13세·165cm / Ken 14세·150cm<div class=\"o\"><div>① Ken is older than Jin.</div><div>② Lua is older than Ken.</div><div>③ Jin is taller than Lua.</div><div>④ Ken is shorter than Lua.</div><div>⑤ Lua is shorter than Jin.</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻의 문장은?<br>나는 그가 정직하다고 믿는다.<div class=\"o\"><div>① I believe he that is honest.</div><div>② I believe that is he honest.</div><div>③ That I believe he is honest.</div><div>④ I that believe he is honest.</div><div>⑤ I believe that he is honest.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① When I was ten, I lived in Busan.</div><div>② I will call you when I get home.</div><div>③ She was happy when she got the gift.</div><div>④ When it rains, I stay home.</div><div>⑤ When he will come, we will start the party.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 동의하는 표현을 feel을 사용하여 쓰시오. (4단어)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>눈이 모든 것을 덮었다.<div class=\"ch\">( everything / cover / it / the snow / covered )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 비교급을 사용하여 영작하시오. (Kahlo로 시작, more 사용)<br>Kahlo는 Van Gogh보다 더 많은 자화상을 그렸다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 빈칸에 알맞은 두 단어를 쓰시오.<br>Their paintings have one thing in ______. (공통으로)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>내가 그 역할을 했단다.<div class=\"ch\">( played / role / play / rolled / I / that )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> 재귀대명사 사용, 5단어<br>나는 이 카드를 직접 만들었다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> than anyone 사용, 5단어<br>Kahlo는 누구보다 더 강했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> 두 문장을 that을 사용하여 한 문장으로 쓰시오.<br>I know. + You are not happy.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>나는 일어났을 때 해를 보았다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">동주여중 학습지</span> 우리말을 영어로 쓰세요. 나는 그녀가 내일 올 것이라고 생각한다. (think, that, will)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2lee_dongju":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Topic 1 · Listen and Match 3]</b><br>B: When I feel stressed, I usually watch mukbang.<br>G: What did you say? Watch what?<br>B: I said \"mukbang.\" It's a type of eating show.<br>G: Oh, that sounds interesting. <u>Can you tell me more about it?</u><br>B: The host eats a lot of food and communicates with the viewers on the show.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 'Watch what?'에서 소녀가 알아듣지 못한 부분은?<div class=\"o\"><div>① When I feel stressed</div><div>② mukbang</div><div>③ watch</div><div>④ I usually</div><div>⑤ stressed</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The boy watches mukbang when he feels stressed.</div><div>② The host cooks food for the viewers.</div><div>③ Mukbang is a type of eating show.</div><div>④ The girl didn't hear the word mukbang clearly.</div><div>⑤ The host communicates with the viewers.</div></div></div><div class=\"pass\"><b>[Topic 1 · Listen and Match 2]</b><br>B: Reena, do you have any plans this weekend?<br>G: Yes, I'm going camping with my family.<br>B: That sounds fun! Have you ever roasted marshmallows while camping?<br>G: No, I haven't, but I want to try.<br>B: When you roast marshmallows, they become so soft and sweet.<br>G: Oh, that sounds delicious. <u>I'm really looking forward to tasting them.</u></div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Reena is going camping this weekend.</div><div>② Reena has never roasted marshmallows.</div><div>③ Roasted marshmallows become soft and sweet.</div><div>④ The boy has roasted marshmallows before.</div><div>⑤ Reena doesn't want to try roasting marshmallows.</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> Reena에 대한 설명으로 알맞은 것은?<div class=\"o\"><div>① She has roasted marshmallows many times.</div><div>② She is going camping with her friends.</div><div>③ She has no plans this weekend.</div><div>④ She doesn't like sweet food.</div><div>⑤ She is excited to taste roasted marshmallows.</div></div></div><div class=\"pass\"><b>Take a Rain Check</b><br>Sarah wanted to see a movie with her best friend, Emily. So, she asked Emily, \"Do you want to see a movie with me today?\" Emily replied, \"I'm sorry, but I have to take a rain check. I have to go to my grandmother's house today.\" \"That's okay. Let's do it another time,\" said Sarah. Although Sarah was a little disappointed, she understood Emily's situation. What does \"take a rain check\" mean? It means to refuse an offer politely but wish to do it later. The phrase \"rain check\" was first used at a baseball game in the 1880s. A rain check was a ticket that people got for a future game when a baseball game was canceled because of rain. Later, rain checks were given at other sporting events. Over time, \"take a rain check\" has been widely used to say that you can't do something now and want to do it later.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> rain check에 대한 설명으로 알맞은 것은?<div class=\"o\"><div>① 비 오는 날 받는 우산</div><div>② 비로 경기가 취소되었을 때 미래 경기를 위해 받는 표</div><div>③ 날씨를 확인하는 표</div><div>④ 야구 선수의 계약서</div><div>⑤ 경기 결과를 적은 종이</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 'Let's do it another time'의 it이 가리키는 것은?<div class=\"o\"><div>① going to the grandmother's house</div><div>② taking a rain check</div><div>③ seeing a movie together</div><div>④ playing baseball</div><div>⑤ buying a ticket</div></div></div><div class=\"pass\"><b>Break a Leg</b><br>It was the day of the school play. Lily practiced for the play for weeks. The curtains were about to go up, and she felt very nervous. Her friend smiled and said, \"Break a leg!\" Lily said, \"Thanks. I will!\" She got on the stage and performed successfully. Although \"Break a leg!\" may sound like a bad thing, it actually means \"Good luck!\" German actors who came to the United States in the early 20th century first used this phrase. By wishing each other bad luck, they believed that it would go away. This expression is still used today. \"Break a leg\" is a phrase that people say to wish performers good luck before a show.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 독일 배우들이 서로에게 불운을 빈 이유는?<div class=\"o\"><div>① 불운을 빌면 불운이 사라진다고 믿었기 때문에</div><div>② 서로 경쟁했기 때문에</div><div>③ 관객을 웃기기 위해</div><div>④ 다리를 다치지 않으려고</div><div>⑤ 미국 문화를 따라 하려고</div></div></div><div class=\"pass\"><b>Toboggan Slide</b><br>There are also so many interesting activities you can do at the carnival. The toboggan slide was built in 1884 and is 200 meters long. A toboggan is a long narrow sled. If you like speed, get on the toboggan. It is <u>so fast that</u> you will feel like you are on a roller coaster. While you're sliding down, you can enjoy amazing views of Quebec. You can see a huge famous castle on your left. On your right, you can see a beautiful icy river.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① When was the toboggan slide built?</div><div>② How long is the toboggan slide?</div><div>③ What is a toboggan?</div><div>④ How much does it cost to ride the toboggan?</div><div>⑤ What can you see on your left?</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① You can see the ice palace on your right.</div><div>② The toboggan is so fast that it feels like a roller coaster.</div><div>③ You can enjoy views of Quebec while sliding.</div><div>④ You can see a castle on your left.</div><div>⑤ There are many interesting activities at the carnival.</div></div></div><div class=\"pass\"><b>Ice Canoe Race</b><br>If you see a large crowd along the river, it's time to watch the Ice Canoe Race. This race is one of the best parts of the carnival, and you shouldn't miss it. Canoe teams have to race through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team. Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to get to the water. Phew! They are in the water again. I hope they can make it to the finish line. The race is <u>so exciting that</u> you will forget about the cold.</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 'I hope they can make it to the finish line.'의 make it의 의미는?<div class=\"o\"><div>① 해내다, 도착하다</div><div>② 만들다</div><div>③ 포기하다</div><div>④ 시작하다</div><div>⑤ 기다리다</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 밑줄 친 관계대명사를 생략할 수 있는 것은?<div class=\"o\"><div>① This is the phrase <u>that</u> people say before a show.</div><div>② German actors <u>who</u> came to the US used it.</div><div>③ It's a song <u>that</u> keeps repeating.</div><div>④ People <u>who</u> participate in the race wear costumes.</div><div>⑤ I have a friend <u>who</u> likes idioms.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 다음 중 의미가 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① Although he was sick, he went to school.</div><div>② Though he was sick, he went to school.</div><div>③ He was sick, but he went to school.</div><div>④ Because he was sick, he went to school.</div><div>⑤ He went to school although he was sick.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br><br>I'll show you what to do here.<br>= I'll show you what ______ do here.<div class=\"o\"><div>① you to</div><div>② you will</div><div>③ should you</div><div>④ to you</div><div>⑤ you should</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① Let's learn how to make it.</div><div>② I don't know where to go.</div><div>③ He asked me why to leave.</div><div>④ Tell me when to start.</div><div>⑤ She knows what to buy.</div></div></div><div class=\"pass\"><b>[Topic 1 · Watch and Write]</b><br>G: Did you know that the first zipper was used on a shoe?<br>B: What did you say?<br>G: I said, \"The first zipper was used on a shoe.\"<br>B: That's interesting. Can you tell me more about it?<br>G: Sure. A man wanted to put on his shoes quickly, so he made zippers for <u>them</u>.<br>B: Wow! What a great idea!<br>G: Yeah. Now, we use zippers on many things like jackets and bags.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The man made zippers for his jacket first.</div><div>② A man wanted to put on his shoes quickly.</div><div>③ The boy thinks it was a great idea.</div><div>④ Zippers are used on jackets and bags now.</div><div>⑤ The first zipper was used on a shoe.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① The book which I read was interesting.</div><div>② She is the teacher whom we respect.</div><div>③ I like the song that you sang.</div><div>④ This is the dog which I found it.</div><div>⑤ The people whom I met were kind.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">동주여중 학습지</span> <b>She did volunteer work every week</b> 뒤에 이어질 말로 알맞은 것은?<div class=\"o\"><div>① although he tried his best.</div><div>② he does everything by himself.</div><div>③ I didn't like the restaurant.</div><div>④ I really want to be a chef.</div><div>⑤ although she was busy.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">동주여중 학습지</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br>He is old, but he is very strong. = ______ he is old, he is very strong.<div class=\"o\"><div>① Because</div><div>② Although</div><div>③ When</div><div>④ After</div><div>⑤ So</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">동주여중 학습지</span> 다음 대화가 자연스럽게 이어지도록 순서대로 배열한 것은?<br>(A) What did you say?<br>(B) Look! There's a smart farm here.<br>(C) I said, \"There's a smart farm here.\"<div class=\"o\"><div>① (A)-(B)-(C)</div><div>② (B)-(A)-(C)</div><div>③ (B)-(C)-(A)</div><div>④ (C)-(A)-(B)</div><div>⑤ (C)-(B)-(A)</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">동주여중 학습지</span> 밑줄 친 부분 중 생략할 수 <b>없는</b> 것은?<div class=\"o\"><div>① This is the bag <u>which</u> I bought.</div><div>② He is the boy <u>whom</u> I like.</div><div>③ The movie <u>that</u> we saw was fun.</div><div>④ The man <u>who</u> lives next door is kind.</div><div>⑤ The cake <u>which</u> she made was sweet.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 영작하시오. (in front of 포함)<br>그 조각 앞에서 사진을 찍자.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>한 남자가 신발을 빨리 신고 싶어서 그것들에 지퍼를 만들었다.<div class=\"ch\">( wanted / putting on / he / so / made / for them / zippers / a man / his shoes / quickly / to put on )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>투표가 완료되었을 때, 그 콩들은 결과를 드러내기 위해 쏟아졌다.<div class=\"ch\">( the voting / to reveal / the beans / completed / the results / was completed / were spilled / when )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 수동태 문장으로 쓰시오.<br>People still use this expression today.<br>→ This expression ________ today.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> so ~ that을 사용하여 한 문장으로 쓰시오.<br>The toboggan is very fast. You will feel like you are on a roller coaster.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> 목적격 관계대명사 who 사용, 9단어<br>그녀는 내가 가장 좋아하는 배우이다. (actor, the most)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> 관계대명사 생략, 7단어<br>이것은 내가 어제 배운 관용구이다. (idiom, learn)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> how to 사용, show 사용, 9단어<br>제가 메이플 태피를 만드는 방법을 보여 드릴게요. (will, maple taffy)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>그 질문은 어려웠지만 그는 질문에 잘 대답했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">동주여중 학습지</span> 관계대명사를 사용하여 영어로 쓰세요.<br>그는 모두가 좋아하는 가수이다. (singer, everyone)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2yun_saha":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Listen Up]</b><br>M: Welcome to the ABC World Food Festival! Every year, we invite great chefs from around the world. This year, we invited Mr. Kumar, a world-famous Indian chef. Do you like Indian food? Then, don't miss his cooking class. You can also get his recipe book for free.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 방송의 목적으로 가장 알맞은 것은?<div class=\"o\"><div>① 요리 대회 참가 신청 안내</div><div>② 음식점 개업 홍보</div><div>③ 요리책 판매 안내</div><div>④ 축제의 주요 행사 홍보</div><div>⑤ 요리사 채용 공고</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 방송을 듣고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① Who was invited this year?</div><div>② What can visitors get for free?</div><div>③ When does the cooking class start?</div><div>④ What kind of food does Mr. Kumar cook?</div><div>⑤ What is the name of the festival?</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ③</b><br>Slowly, everyone got out of the time machine. The jungle was covered in fog. It was very quiet.<br>“I'm so excited,” said Eckels.<br>“Be careful. Some of the dinosaurs are hungry,” said Travis. “Just stay calm. I don't want you to do anything foolish.”<br>“Don't worry. I'm not a fool,” said Eckels.<br>They all began to walk on the path.<br>After some time, Travis whispered, “Look over there. There is a T. rex.”<br>One hundred meters away, a T. rex slowly appeared.<br>“It,” whispered Eckels. “It ...”<br>“Sh!”<br>“It ... is huge. <u>I've never seen</u> such a huge thing. I'm so scared,” said Eckels.<br>“Sh ... quiet!” Travis said angrily. “You don't want it to see you.”</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">본문</span> Travis가 'You don't want it to see you.'라고 말한 의도는?<div class=\"o\"><div>① 공룡에게 인사하라</div><div>② 타임머신을 출발시켜라</div><div>③ 공룡 사진을 찍어라</div><div>④ 공룡에게 다가가라</div><div>⑤ 조용히 해서 공룡에게 들키지 않게 하라</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">본문</span> 정글의 분위기로 가장 알맞은 것은?<div class=\"o\"><div>① 밝고 시끄러운</div><div>② 덥고 건조한</div><div>③ 안개가 끼고 고요한</div><div>④ 춥고 눈이 오는</div><div>⑤ 화려하고 즐거운</div></div></div><div class=\"pass\"><b>Day of the Dead Festival in Mexico</b><br>Many Mexicans believe that once a year dead people come back home to meet their family and friends. They call this day the Day of the Dead. To welcome dead people, Mexicans hold a festival on November 1 and 2. They believe it is important to remember dead people. So, people set up altars in their homes and have big parties in cemeteries. In some areas, people dress up like skeletons and hold big parades.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The festival is held on November 1 and 2.</div><div>② All Mexicans dress up like skeletons.</div><div>③ People have big parties in cemeteries.</div><div>④ Mexicans set up altars in their homes.</div><div>⑤ Mexicans think remembering dead people is important.</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① When do Mexicans hold the festival?</div><div>② What do they call this day?</div><div>③ Where do people set up altars?</div><div>④ What do people put on the altars?</div><div>⑤ What do people do in some areas?</div></div></div><div class=\"pass\"><b>Fallas Festival in Valencia, Spain</b><br>People in Valencia celebrate the coming of spring with the Fallas festival. This festival takes place from March 15 to 19. During the festival, people enjoy parades and fireworks. The stars of the festival are fallas, giant wooden statues. You can find hundreds of them all over the city. Surprisingly, the fallas are burned on the last day of the festival. Burning them symbolizes saying goodbye to old things and hello to a new start.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 글쓴이가 'Surprisingly'라고 쓴 이유로 가장 알맞은 것은?<div class=\"o\"><div>① 파야들이 아주 작아서</div><div>② 축제가 겨울에 열려서</div><div>③ 공들여 만든 거대한 조각상을 마지막 날 태우기 때문에</div><div>④ 불꽃놀이가 없어서</div><div>⑤ 사람들이 퍼레이드를 하지 않아서</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ②</b><br>“This is Travis, your travel guide,” he continued. “To stay safe, you must follow his instructions.”<br>Inside the time machine, there were two other travelers. Eckels sat down and closed his eyes. He felt the machine moving under his feet. After only a few minutes, the machine stopped.<br>“<u>We've just arrived</u> in the jungle of 60 million years ago,” Travis explained. “Do you see the path over there? You must not leave it at any time. Do not touch anything. You might kill something by accident. A little change here can cause something unthinkable in the future.”</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> Travis가 '길을 벗어나지 말라'고 한 근본적인 이유는?<div class=\"o\"><div>① 길 밖에 공룡이 많아서</div><div>② 작은 변화가 미래에 상상할 수 없는 일을 일으킬 수 있어서</div><div>③ 길 밖은 진흙투성이라서</div><div>④ 길을 잃을 수 있어서</div><div>⑤ 타임머신이 멀리 있어서</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① Who is Travis?</div><div>② How many other travelers were in the machine?</div><div>③ How long did the trip take?</div><div>④ What must they not leave?</div><div>⑤ What were the other travelers' names?</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ⑥</b><br>Eckels looked around the room carefully. Everything looked the same, except the big sign on the wall. The sign now said, “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.” Eckels was confused.<br>Then, he saw the TV. The new president was on the news, but it was not Mr. Keith. “What's going on?” He got more confused.<br>He sat down and looked closely at the mud on his shoes.<br>“No, it can't be,” said Eckels. “It's all because of this little thing?” He was shocked. In the mud on his right shoe, he found a small dead butterfly.</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> Eckels의 심경 변화로 가장 알맞은 것은?<div class=\"o\"><div>① happy → confused → excited</div><div>② confused → more confused → shocked</div><div>③ shocked → calm → happy</div><div>④ excited → bored → angry</div><div>⑤ calm → happy → proud</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 가주어 it ② for + 의미상 주어 ③ 부정문<div class=\"o\"><div>① It is not easy for me to run fast.</div><div>② It is not easy me to run fast.</div><div>③ It is easy for me to run fast.</div><div>④ This is not easy for me to run fast.</div><div>⑤ It is not easy for me running fast.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 말로 알맞은 것은?<br><br>They call ______ the Midsummer festival.<div class=\"o\"><div>① it as</div><div>② it to</div><div>③ to it</div><div>④ its</div><div>⑤ it</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 말로 알맞은 것은?<br><br>I've always ______ to see a dinosaur.<div class=\"o\"><div>① want</div><div>② wants</div><div>③ wanting</div><div>④ to want</div><div>⑤ wanted</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br><br>He was very terrified, so he left the path.<br>= He was ______ terrified ______ he left the path.<div class=\"o\"><div>① too – to</div><div>② very – that</div><div>③ so – that</div><div>④ so – to</div><div>⑤ such – that</div></div></div><div class=\"pass\"><b>[Watch, Answer, and Role-play]</b><br>Emma: Hi, Jihan. What a surprise!<br>Jihan: Hey, Emma. Are you here to see the fireworks, too?<br>Emma: Yes. I hear China, Italy, and the USA are participating this year.<br>Jihan: Don't forget Korea.<br>Emma: Of course, Korea, too. So, the fireworks start at 7 p.m. Right?<br>Jihan: Yeah. Let's do something together until then.<br>Emma: I guess we can ride bikes or go for a boat ride. Which do you like more?<br>Jihan: Going for a boat ride. I think it'll be more fun.<br>Emma: Then, let's go for a boat ride.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① Emma came to the park to ride bikes.</div><div>② Emma prefers riding bikes.</div><div>③ The fireworks start at 8 p.m.</div><div>④ Jihan reminds Emma that Korea is also participating.</div><div>⑤ They will watch the fireworks first.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">사하중 학습지</span> 빈칸에 들어갈 말로 알맞은 것은?<br>It is dangerous ______ in the river.<div class=\"o\"><div>① swim</div><div>② swims</div><div>③ to swim</div><div>④ swam</div><div>⑤ swimming</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">사하중 학습지</span> 어순이 바른 문장은?<div class=\"o\"><div>① They call Smarty the robot. (그 로봇을 Smarty라고)</div><div>② They call the robot Smarty.</div><div>③ They the robot call Smarty.</div><div>④ They call to the robot Smarty.</div><div>⑤ They call the robot as Smarty.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">사하중 학습지</span> <b>hardly</b><div class=\"o\"><div>① (동물의) 털</div><div>② 퍼레이드, 행진</div><div>③ 거의 ~ 않다</div><div>④ 기둥, 막대기</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">사하중 학습지</span> 짝지어진 단어의 관계가 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① cheap – expensive</div><div>② light – heavy</div><div>③ remember – forget</div><div>④ participate – take part in</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">사하중 학습지</span> I've just arrived at school.<div class=\"o\"><div>① 경험</div><div>② 완료</div><div>③ 계속</div><div>④ 결과</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오.<br>우리 같이 VR 게임 하러 가자.<div class=\"ch\">( to / play / let's / go / together / VR games )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 동격의 콤마를 사용하여 영작하시오.<br>올해 우리는 세계적으로 유명한 인도 요리사인 Kumar 씨를 초대했습니다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오.<br>일부 지역에서는 사람들이 해골처럼 분장하고 큰 퍼레이드를 한다.<div class=\"ch\">( people / like / dress up / and / big parades / hold / as / in some areas / skeletons )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 가주어 it을 사용하여 바꾸어 쓰시오.<br>To run faster than reindeer is not possible.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>잠시 정적이 흘렀다.<div class=\"ch\">( was / a moment / silent / there / of / were / silence )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 부분을 고쳐 문장 전체를 다시 쓰시오.<br>This is important to remember dead people.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> 가주어 it, for 사용, 8단어<br>내가 비밀을 지키는 것은 어렵다. (keep secrets)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> so ~ that 사용, 9단어<br>그 공룡은 너무 거대해서 Eckels는 숨을 쉴 수 없었다. (huge, breathe)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">사하중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>우리는 6천만 년 전의 정글에 막 도착했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">사하중 학습지</span> 우리말을 영어로 쓰세요. 그는 어리석은 일을 하지 않았다. (anything, foolish)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1yun_saha_r":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Watch and Check 2]</b><br>G: David, what are you making?<br>B: I'm making pizza and pasta.<br>G: They look delicious. <u>Are you interested in Italian food?</u><br>B: Yes, I am. I want to be a world-famous chef in the future!</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 대화를 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① What does David want to be?</div><div>② How does the food look?</div><div>③ Where did David learn to cook?</div><div>④ What is David making?</div><div>⑤ Is David interested in Italian food?</div></div></div><div class=\"pass\"><b>[Watch and Check 3]</b><br>G: What's this music, Hojin? It's <u>awesome</u>.<br>B: I'm writing a song with this computer program.<br>G: You're very good. Do you want to be a songwriter?<br>B: Yes, I'm really interested in writing songs.</div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① Hojin is interested in making computer programs.</div><div>② Hojin wants to be a singer.</div><div>③ The girl doesn't like the music.</div><div>④ Hojin is writing a song with a computer program.</div><div>⑤ Hojin is listening to a song on the radio.</div></div></div><div class=\"pass\"><b>[Watch and Check 3]</b><br>G: My phone is not working. I need to get a new one.<br>B: Look! Here are the new models. What do you think about this one?<br>G: Wow, I like it. It's very light.<br>B: <u>I agree.</u> It's lighter than mine.</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① The new model is heavier than the boy's phone.</div><div>② The boy's phone is not working.</div><div>③ The boy doesn't agree with the girl.</div><div>④ The girl thinks the new phone is very light.</div><div>⑤ The girl doesn't like the new model.</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 'It's lighter than <u>mine</u>.'의 mine이 의미하는 것은?<div class=\"o\"><div>① my robot</div><div>② my phone</div><div>③ my bag</div><div>④ my model</div><div>⑤ my book</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ③ Jennifer</b><br>I'm Jennifer. I trained and took care of Max for a long time. Max is a great actor, but he sometimes gets too excited when a lot of people are around. So, I use hand signals <u>to calm</u> him. Who am I? I'm an animal wrangler.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> Jennifer가 수신호를 사용하는 이유는?<div class=\"o\"><div>① 카메라를 켜려고</div><div>② Max를 진정시키려고</div><div>③ 배우들에게 신호를 주려고</div><div>④ 관객에게 인사하려고</div><div>⑤ Max를 흥분시키려고</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Max always gets excited.</div><div>② Jennifer took care of Max for a long time.</div><div>③ Max is a great actor.</div><div>④ Jennifer uses hand signals.</div><div>⑤ Jennifer trained Max.</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ④ Emma</b><br>My name is Emma, and I'm a film editor. My work begins after the shooting is over. <u>To create</u> a better story, I can change the order of scenes or delete some of them. Storytelling skills are important for my job, so I read a lot.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> Emma가 하는 일로 알맞은 것은?<div class=\"o\"><div>① 촬영 장소를 찾는다</div><div>② 동물을 훈련시킨다</div><div>③ 음향 효과를 만든다</div><div>④ 장면의 순서를 바꾸거나 일부를 삭제한다</div><div>⑤ 카메라를 담당한다</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ②</b><br>One day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. <u>It</u> was getting dark, and it started to rain. She opened the door and walked inside.<br>There were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn't care.<br>“It's so fun!” shouted Goldilocks.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하는 것은?<div class=\"o\"><div>① There were two bowls of soup.</div><div>② She ate the biggest soup.</div><div>③ She was sorry when the chair broke.</div><div>④ She jumped on the smallest chair again and again.</div><div>⑤ Someone answered the door.</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 밑줄 친 It과 쓰임이 같은 것은?<div class=\"o\"><div>① <u>It</u> is on the table.</div><div>② <u>It</u> is Monday today.</div><div>③ I lost my pen. I can't find <u>it</u>.</div><div>④ <u>It</u> is my new bag.</div><div>⑤ I like this song. <u>It</u> is great.</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ⑤</b><br>All summer long, Goldilocks worked hard. On the last day, Goldilocks said to Father Bear, “I deleted all my posts of your cottage, so please don't worry.”<br>“You still don't understand. Other people already shared them on social media. Your posts will <u>live on</u> forever,” said Father Bear.<br>“Oh, I didn't think about that,” said Goldilocks. “From now on, I'll think twice before I press POST.”</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 밑줄 친 live on의 의미로 가장 알맞은 것은?<div class=\"o\"><div>① 사라지다</div><div>② ~ 위에 살다</div><div>③ 생방송하다</div><div>④ ~을 먹고 살다</div><div>⑤ 계속 남아 있다</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 밑줄 친 to부정사의 의미가 '~해서(감정의 원인)'인 것은?<div class=\"o\"><div>① I need a pen <u>to write</u> with.</div><div>② He got up early <u>to catch</u> the bus.</div><div>③ My dream is <u>to be</u> a chef.</div><div>④ I was happy <u>to meet</u> my favorite actor.</div><div>⑤ She decided <u>to travel</u> alone.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 목적의 to부정사 ② 과거시제 ③ 8단어<div class=\"o\"><div>① She went to the store to buy some milk.</div><div>② She goes to the store to buy milk.</div><div>③ She went to the store for buy some milk.</div><div>④ She went to the store buying some milk.</div><div>⑤ She wanted to go to the store.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 질문과 대답이 <b>어색한</b> 것은?<div class=\"o\"><div>① A: What time is it?<br>B: It's 8:15.</div><div>② A: How far is it?<br>B: It's two kilometers.</div><div>③ A: What day is it today?<br>B: It's Tuesday.</div><div>④ A: What's the date today?<br>B: It's sunny.</div><div>⑤ A: How's the weather?<br>B: It's raining.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 어법상 알맞은 문장의 개수는?<br><br>ⓐ Sumi sent Jiho text messages.<br>ⓑ Dad cooked spaghetti to us.<br>ⓒ It is cold and windy today.<br>ⓓ Can you lend it me?<br>ⓔ She made her son a cake.<div class=\"o\"><div>① 3개</div><div>② 5개</div><div>③ 2개</div><div>④ 1개</div><div>⑤ 4개</div></div></div><div class=\"pass\"><b>[Watch, Answer, and Talk]</b><br>G: Jiho, <u>why don't we try this</u>? We can fly an airplane!<br>B: Sure. It looks like fun!<br>G: Do you want to be a pilot in the future?<br>B: Yes, I'm interested in flying airplanes. How about you, Lucy?<br>G: I'm interested in making airplanes, not flying. I want to be an airplane engineer.<br>B: That sounds cool!<br>G: Thank you. I want to make an airplane someday!<br>B: Let's fly this airplane, and then we can try making an airplane, too.<br>G: Good idea.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① Lucy wants to be a pilot.</div><div>② They will make an airplane first.</div><div>③ Jiho is interested in flying airplanes.</div><div>④ Jiho suggests flying an airplane.</div><div>⑤ Lucy doesn't want to make airplanes.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">사하중 학습지</span> 빈칸에 들어갈 말로 알맞은 것은?<br>She went to the library ______ some books.<div class=\"o\"><div>① borrows</div><div>② borrowing</div><div>③ to borrow</div><div>④ borrow</div><div>⑤ borrowed</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">사하중 학습지</span> <b>create</b><div class=\"o\"><div>① 시작하다</div><div>② 비행사, 조종사</div><div>③ 창조하다, 만들다</div><div>④ 꿈</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">사하중 학습지</span> 짝지어진 단어의 관계가 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① delete – remove</div><div>② begin – start</div><div>③ calm – excited</div><div>④ create – make</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">사하중 학습지</span> <b>noisy</b><div class=\"o\"><div>① 도움이 되는</div><div>② 유용한</div><div>③ 용서하다</div><div>④ 시끄러운</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">사하중 학습지</span> 짝지어진 단어의 관계가 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① upstairs – downstairs</div><div>② noisy – quiet</div><div>③ boring – interesting</div><div>④ useful – helpful</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 대화를 완성하시오. (관심 묻기, What으로 시작)<br>A: ________________<br>B: I'm interested in all kinds of sports.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> Are you로 시작하여 관심을 묻는 질문을 쓰시오.<br>너는 이탈리아 음식에 관심이 있니?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 영어로 답하시오. (He made로 시작)<br>Q: How did Chris make the sound of waves?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>그것은 진짜처럼 들리지 않나요?<div class=\"ch\">( really / isn't / it / doesn't / sound / real )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>더 많은 '좋아요'를 받으려면 나는 무엇을 해야 할까?<div class=\"ch\">( to get / do / getting / much / should / I / more likes / what )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> in order to를 사용, 11단어<br>나는 일찍 일어났다 / 첫 기차를 타기 위해서. (the first train)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 부분을 고쳐 문장 전체를 다시 쓰시오.<br>I'm really interested in write songs.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 부분을 고쳐 문장 전체를 다시 쓰시오.<br>She cooked delicious soup to the bears.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">사하중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>너의 새 신발을 사기 위해 쇼핑몰에 가자.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">사하중 학습지</span> after를 사용하여 한 문장으로 쓰세요.<br>I took a shower. + Then I went to bed.<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1yun_dangri_r":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Watch and Check 2]</b><br>G: David, what are you making?<br>B: I'm making pizza and pasta.<br>G: They look delicious. <u>Are you interested in Italian food?</u><br>B: Yes, I am. I want to be a world-famous chef in the future!</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 밑줄 친 문장에 대한 대답으로 알맞은 것은?<div class=\"o\"><div>① Yes, I am.</div><div>② Yes, I can.</div><div>③ No, I don't.</div><div>④ Yes, I do.</div><div>⑤ No, it isn't.</div></div></div><div class=\"pass\"><b>[Watch and Check 4]</b><br>G: Are you interested in fashion, Jacob?<br>B: Yes, I love to make clothes.<br>G: Really? <u>That's so cool!</u><br>B: Thanks. I want to be a fashion designer. I'll make clothes for you someday.</div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> Jacob이 나중에 하겠다고 말한 것은?<div class=\"o\"><div>① 디자인을 가르쳐 주겠다</div><div>② 패션쇼에 데려가겠다</div><div>③ 소녀에게 옷을 만들어 주겠다</div><div>④ 옷을 사 주겠다</div><div>⑤ 옷 가게를 열겠다</div></div></div><div class=\"pass\"><b>[Watch and Check 2]</b><br>B: <u>What do you think about this pasta?</u><br>G: I think it's pretty good.<br>B: I don't think so. I think it's too salty.<br>G: Really? It's OK for me.</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 밑줄 친 문장과 의미가 같은 것은?<div class=\"o\"><div>① Do you like to cook pasta?</div><div>② How do you feel about this pasta?</div><div>③ How much is this pasta?</div><div>④ Where did you buy this pasta?</div><div>⑤ Can you make this pasta?</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 밑줄 친 문장의 의도로 알맞은 것은?<div class=\"o\"><div>① 의견 묻기</div><div>② 음식 주문하기</div><div>③ 제안하기</div><div>④ 경험 묻기</div><div>⑤ 허락 구하기</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ② Peter</b><br>I'm Peter, the director of photography for this movie. I'm in charge of all the cameras. Today, Tom and Max are going to play together with a ball on the beach. <u>To capture</u> their happy moments, I'm going to use drones.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> Peter가 드론을 사용하려는 이유는?<div class=\"o\"><div>① Max를 훈련시키려고</div><div>② Tom과 Max의 행복한 순간을 포착하려고</div><div>③ 장소를 찾으려고</div><div>④ 해변을 청소하려고</div><div>⑤ 소리를 녹음하려고</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① What is Peter in charge of?</div><div>② What will Peter use?</div><div>③ Where will Tom and Max play?</div><div>④ What is Peter's job?</div><div>⑤ How many drones does Peter have?</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ④ Emma</b><br>My name is Emma, and I'm a film editor. My work begins after the shooting is over. <u>To create</u> a better story, I can change the order of scenes or delete some of them. Storytelling skills are important for my job, so I read a lot.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> Emma가 하는 일로 알맞은 것은?<div class=\"o\"><div>① 촬영 장소를 찾는다</div><div>② 동물을 훈련시킨다</div><div>③ 장면의 순서를 바꾸거나 일부를 삭제한다</div><div>④ 카메라를 담당한다</div><div>⑤ 음향 효과를 만든다</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ②</b><br>One day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. <u>It</u> was getting dark, and it started to rain. She opened the door and walked inside.<br>There were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn't care.<br>“It's so fun!” shouted Goldilocks.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 'She ate the smallest <u>one</u>'의 one이 가리키는 것은?<div class=\"o\"><div>① chair</div><div>② selfie</div><div>③ cottage</div><div>④ table</div><div>⑤ bowl (of soup)</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 이 글에서 드러나는 Goldilocks의 행동 특성으로 가장 알맞은 것은?<div class=\"o\"><div>① 곰을 도와주려 한다</div><div>② 겁이 많아 아무것도 만지지 않는다</div><div>③ 남의 물건을 소중히 다룬다</div><div>④ 예의 바르고 조심스럽다</div><div>⑤ 남의 집에서 무례하고 무책임하게 행동한다</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ③</b><br>She took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and <u>fell asleep</u> in the smallest bed.<br>About an hour later, three bears came home.<br>“Someone ate my soup and broke my chair!” cried Baby Bear.<br>They went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.<br>“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.<br>Goldilocks jumped up in surprise.</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 곰 세 마리가 집에 돌아왔을 때 아기곰이 발견한 것은?<div class=\"o\"><div>① 누군가 문을 잠갔다.</div><div>② 누군가 수프를 먹고 의자를 부쉈다.</div><div>③ 누군가 사진을 찍고 있었다.</div><div>④ 누군가 침대를 부쉈다.</div><div>⑤ 누군가 휴대폰을 두고 갔다.</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 말로 알맞은 것은?<br><br>I'm interested in ______ songs.<div class=\"o\"><div>① to write</div><div>② wrote</div><div>③ writing</div><div>④ write</div><div>⑤ writes</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 목적의 to부정사 ② 과거시제 ③ 8단어<div class=\"o\"><div>① She went to the store to buy some milk.</div><div>② She goes to the store to buy milk.</div><div>③ She went to the store for buy some milk.</div><div>④ She went to the store buying some milk.</div><div>⑤ She wanted to go to the store.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① Ted made Ms. Brown cookies.</div><div>② He showed me it.</div><div>③ She bought a bike for her son.</div><div>④ Mike sent me a text message.</div><div>⑤ Please give it to me.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 질문과 대답이 <b>어색한</b> 것은?<div class=\"o\"><div>① A: What time is it?<br>B: It's 8:15.</div><div>② A: How's the weather?<br>B: It's raining.</div><div>③ A: How far is it?<br>B: It's two kilometers.</div><div>④ A: What's the date today?<br>B: It's sunny.</div><div>⑤ A: What day is it today?<br>B: It's Tuesday.</div></div></div><div class=\"pass\"><b>[Watch, Answer, and Talk]</b><br>G: Jiho, <u>why don't we try this</u>? We can fly an airplane!<br>B: Sure. It looks like fun!<br>G: Do you want to be a pilot in the future?<br>B: Yes, I'm interested in flying airplanes. How about you, Lucy?<br>G: I'm interested in making airplanes, not flying. I want to be an airplane engineer.<br>B: That sounds cool!<br>G: Thank you. I want to make an airplane someday!<br>B: Let's fly this airplane, and then we can try making an airplane, too.<br>G: Good idea.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① Lucy wants to be a pilot.</div><div>② They will make an airplane first.</div><div>③ Lucy doesn't want to make airplanes.</div><div>④ Jiho is interested in flying airplanes.</div><div>⑤ Jiho suggests flying an airplane.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">당리중 학습지</span> Which question <b>CANNOT</b> be answered from the passage?<div class=\"o\"><div>① What is Peter in charge of?</div><div>② Why does Jennifer use hand signals?</div><div>③ How many scenes did Emma delete?</div><div>④ What did Chris use to make the sound of waves?</div><div>⑤ What is <i>Happy Days</i> about?</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">당리중 학습지</span> Which question <b>CANNOT</b> be answered from the passage?<div class=\"o\"><div>① What does Anna like to do?</div><div>② Where does Chris create sound effects?</div><div>③ When does Emma's work begin?</div><div>④ What is the name of the beach?</div><div>⑤ Who found the beautiful beach?</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">당리중 학습지</span> Who would say this? <br>\"My work starts after the shooting is over.\"<div class=\"o\"><div>① Peter</div><div>② Jennifer</div><div>③ Anna</div><div>④ Emma</div><div>⑤ Jim</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">당리중 학습지</span> Which is <b>NOT</b> true according to the passage?<div class=\"o\"><div>① Peter is the director of photography.</div><div>② Emma can change the order of scenes.</div><div>③ Chris recorded real waves on the beach.</div><div>④ Max is a great actor.</div><div>⑤ Anna found the beautiful beach.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">당리중 학습지</span> What is Jim Brown's job?<div class=\"o\"><div>① He is a location manager.</div><div>② He is the director of <i>Happy Days</i>.</div><div>③ He is an animal wrangler.</div><div>④ He is a film editor.</div><div>⑤ He is a Foley artist.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 영작하시오. (light 활용, 4단어)<br>그것은 내 것보다 더 가볍다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>나는 그것이 너무 짜다고 생각해.<div class=\"ch\">( salty / too / think / I / to / it's / salt )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> in order to를 사용하여 바꾸시오.<br>I'm going to use drones to capture their happy moments.<br>→ I'm going to use drones ________________ their happy moments.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> to부정사를 사용하여 영작하시오. (A lot of people로 시작)<br>많은 사람들이 이 영화를 만들기 위해 열심히 일하고 있다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> Q의 답을 영어로 쓰시오. (She deleted로 시작)<br>Q: What did Goldilocks do on the last day?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> to부정사 사용, 9단어<br>Chris는 바다 소리를 만들기 위해 쌀을 사용했다. (the sound of waves)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> 감정의 원인 to부정사 사용, 8단어<br>나는 나의 가장 좋아하는 감독을 만나서 기뻤다. (glad)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> 4형식, send 사용, 6단어<br>Goldilocks는 아빠곰에게 사과 편지를 보냈다. (a letter)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">당리중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>그녀는 영어를 배우기 위해 해외로 갔다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">당리중 학습지</span> 더 좋은 이야기를 만들기 위해, Emma는 책을 많이 읽는다. (To create로 시작)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1lee_dongju_r":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Topic 2 · Different Looks]</b><br>Jiho: Look at this picture. What do you think about it, Yena?<br>Yena: I like it. I think the duck is cute.<br>Jiho: What about you, Andy?<br>Andy: I feel the same. The duck's eye is big.<br>Jiho: Kate, what do you think?<br>Kate: I like it, too, but I don't see a duck. I only see a rabbit.<br>Andy: Oh, now I can see the rabbit, too!<br>Yena: That's interesting! We can see different things in the same picture.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 대화 속 인물과 본 것을 바르게 연결한 것은?<div class=\"o\"><div>① Kate – duck</div><div>② Yena – duck</div><div>③ Andy – rabbit only</div><div>④ Kate – duck and rabbit</div><div>⑤ Yena – rabbit</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Andy can't see the rabbit at all.</div><div>② Kate only sees a rabbit.</div><div>③ Andy agrees with Yena.</div><div>④ Yena thinks the duck is cute.</div><div>⑤ Yena thinks it's interesting.</div></div></div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Yena thinks it's interesting.</div><div>② Andy agrees with Yena at first.</div><div>③ Kate sees both a duck and a rabbit.</div><div>④ Jiho asks Yena about the picture.</div><div>⑤ Yena thinks the duck is cute.</div></div></div><div class=\"pass\"><b>[Topic 1 · Watch and Correct]</b><br>B: Suji, what did you do last weekend?<br>G: I went to a volleyball game.<br>B: Which teams played?<br>G: The Spikers played the Flyers.<br>B: Which team did you <u>cheer for</u>?<br>G: The Spikers. They're my favorite team.<br>B: I see. How was the game?<br>G: It was really exciting. The Spikers won. How was your weekend, Eddie?<br>B: Great. I rode my bike in the park.<br>G: <u>Sounds good.</u></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The Spikers played the Flyers.</div><div>② The Spikers won the game.</div><div>③ Suji went to a volleyball game.</div><div>④ Suji cheered for the Flyers.</div><div>⑤ Eddie rode his bike in the park.</div></div></div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">대화문</span> Suji의 일기에서 틀린 부분을 바르게 고친 것끼리 짝지은 것은?<br><br>I went to a <u>basketball</u> game. The Spikers <u>lost</u> the game. The game was really <u>boring</u>.<div class=\"o\"><div>① volleyball – lost – exciting</div><div>② volleyball – won – exciting</div><div>③ baseball – won – boring</div><div>④ soccer – won – fun</div><div>⑤ volleyball – won – sad</div></div></div><div class=\"pass\"><b>Faces of Great Artists ③ Frida Kahlo</b><br>Frida Kahlo was a Mexican artist. When she was six years old, she was very sick. Her right leg became <u>weaker than</u> her left leg. But she thought, “I will get well. I will help sick people like me.” When she was 18, she was in a terrible bus accident. She stayed in the hospital for a long time. Kahlo said to herself, “I look weak. But I am stronger than anyone.” So, Kahlo started to paint herself. She painted 55 self-portraits in her lifetime. Look at her paintings. Does she look strong?</div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> Kahlo의 성격으로 가장 알맞은 것은?<div class=\"o\"><div>① selfish</div><div>② shy</div><div>③ strong-willed</div><div>④ lazy</div><div>⑤ careless</div></div></div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① What happened when she was six?</div><div>② How many self-portraits did she paint?</div><div>③ What happened when she was 18?</div><div>④ Where was Kahlo from?</div><div>⑤ How long did she stay in the hospital exactly?</div></div></div><div class=\"pass\"><b>Faces of Great Artists ④ Conclusion</b><br>Van Gogh and Kahlo painted themselves for different reasons. But their paintings have <u>one thing in common</u>. They t
