<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모의고사 채점 결과</title>

<style>
:root{--navy:#1d2b4f;--bur:#8a2240;--red:#e0312b;--blue:#2457c5;--ink:#1b2133;--muted:#5c6478;--line:#c9cedb;--paper:#fffdf8}
*{box-sizing:border-box}html,body{margin:0}
body{background:#e9ebf1;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55;color-scheme:light}
button{font:inherit}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
header .w{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:"Do Hyeon",sans-serif;font-size:19px;flex:1;white-space:nowrap}
@media (max-width:480px){.head{flex-direction:column}.sc{margin:0 auto}}
.hb{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.hb.on{background:#fff;color:var(--navy)}
main{max-width:860px;margin:0 auto;padding:12px 10px 50px}
.paper{background:var(--paper);border-radius:6px;box-shadow:0 2px 10px rgba(20,30,60,.12);padding:18px 18px 24px;margin-bottom:14px}
.head{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--navy);border-radius:8px;padding:10px 14px;position:relative}
.head .s{color:var(--bur);font-weight:700;font-size:13px}
.head h1{font-size:20px;margin:2px 0 6px;color:var(--navy)}
.head .who{font-size:14px}.head .who b{font-size:17px}
.sc{margin-left:auto;text-align:center;font-family:"Nanum Pen Script",cursive;color:var(--red);transform:rotate(-6deg);min-width:120px}
.sc .big{font-size:64px;line-height:.9}.sc .big small{font-size:30px}
.sc .u{height:3px;background:var(--red);border-radius:2px;margin:2px 6px 0}.sc .u+.u{margin-top:3px}
.sc .det{font-size:18px;line-height:1.1;margin-top:4px;white-space:nowrap}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;font-size:13px}
.sum span{border-radius:999px;padding:2px 10px;font-weight:700}
.sum .w{background:#fde8e7;color:var(--red)}.sum .g{background:#e6f4ec;color:#1f8a4c}.sum .p{background:#eef0f6;color:var(--muted)}
.guide{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sec{background:var(--navy);color:#fff;font-weight:700;padding:3px 10px;border-radius:4px;margin:16px 0 10px;font-size:14px}
.pass{border:1.2px solid #9aa3b8;background:#f3f5f9;border-radius:6px;padding:8px 10px;margin:0 0 10px;font-size:14px;line-height:1.6}
.q{position:relative;margin:0 0 16px;padding:6px 6px 6px 8px;border-radius:6px}
.q b.n{color:var(--navy);font-size:16px}
.ar{font-size:11px;color:var(--bur);border:1px solid var(--bur);border-radius:3px;padding:0 4px;margin:0 2px}
.o{margin:4px 0 0 8px}.o>div{padding:1px 6px;border-radius:5px;margin:1px 0}
.o .my{outline:2px solid var(--blue);outline-offset:-1px;background:#edf2fd}
.o .my::after{content:" ← 내 답";color:var(--blue);font-weight:700;font-size:12px}
.show .o .ans{background:#e6f4ec;font-weight:700}
.show .o .ans::after{content:" ✔ 정답";color:#1f8a4c;font-weight:700;font-size:12px}
.show .o .my.ans::after{content:" ← 내 답 ✔ 정답"}
.ln{border-bottom:1px dashed #b9bfcc;height:22px}
.mine{font-family:"Nanum Pen Script",cursive;font-size:25px;color:var(--blue);line-height:1.15;margin:6px 0 0 6px;word-break:break-word}
.mine.none{color:#9aa3b8;font-size:20px}
.pt{font-family:"Nanum Pen Script",cursive;color:var(--red);font-size:28px;position:absolute;right:6px;top:-4px;transform:rotate(-6deg)}
.exp{display:none;margin:8px 0 0;background:#f1f7f3;border-left:4px solid #1f8a4c;border-radius:4px;padding:6px 10px;font-size:13.5px}
.show .exp{display:block}
.q b.n{position:relative;display:inline-block}.mk{position:absolute;left:-17px;top:-17px;width:58px;height:58px;pointer-events:none}
.wrong{background:rgba(224,49,43,.045)}
.only .q.ok{display:none}.only .pass{display:none}.only .q.wrong .pctx{display:block}
.pctx{display:none;font-size:13px;border:1px solid #c9cedb;background:#f3f5f9;border-radius:6px;padding:6px 8px;margin:6px 0}
.ft{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
.err{background:#fff;border-radius:10px;padding:30px;text-align:center;color:var(--muted)}
@media (min-width:760px){.cols{column-count:2;column-gap:28px;column-rule:1px solid #dde0e8}.q,.pass{break-inside:avoid}.sec{break-after:avoid}}
@media print{header{display:none}body{background:#fff}.paper{box-shadow:none;padding:0}main{padding:0}}
</style>
</head>

const EX={"m1yun_saha":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Watch and Check 2]</b><br>G: David, what are you making?<br>B: I'm making pizza and pasta.<br>G: They look delicious. <u>Are you interested in Italian food?</u><br>B: Yes, I am. I want to be a world-famous chef in the future!</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① David is making pizza and pasta.</div><div>② The girl thinks the food looks delicious.</div><div>③ David is interested in Italian food.</div><div>④ David wants to be a world-famous chef.</div><div>⑤ David is eating hamburgers.</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 밑줄 친 문장에 대한 대답으로 알맞은 것은?<div class=\"o\"><div>① Yes, I do.</div><div>② Yes, I am.</div><div>③ No, I don't.</div><div>④ Yes, I can.</div><div>⑤ No, it isn't.</div></div></div><div class=\"pass\"><b>[Watch and Check 2]</b><br>B: <u>What do you think about this pasta?</u><br>G: I think it's pretty good.<br>B: I don't think so. I think it's too salty.<br>G: Really? It's OK for me.</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① They are talking about pasta.</div><div>② The girl thinks the pasta is pretty good.</div><div>③ The boy thinks the pasta is too salty.</div><div>④ The pasta is OK for the girl.</div><div>⑤ The boy agrees with the girl.</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 'pretty good'의 pretty와 같은 의미로 쓰인 것은?<div class=\"o\"><div>① She is a pretty girl.</div><div>② What a pretty dress!</div><div>③ The test was pretty hard.</div><div>④ The flowers are pretty.</div><div>⑤ She has a pretty smile.</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ② Peter</b><br>I'm Peter, the director of photography for this movie. I'm in charge of all the cameras. Today, Tom and Max are going to play together with a ball on the beach. <u>To capture</u> their happy moments, I'm going to use drones.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Peter is the director of photography.</div><div>② Peter will play with Max.</div><div>③ They will play with a ball.</div><div>④ Peter is going to use drones.</div><div>⑤ Tom and Max will play on the beach.</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 오늘 촬영할 장면으로 알맞은 것은?<div class=\"o\"><div>① Tom이 Max를 목욕시키는 장면</div><div>② Tom이 드론을 날리는 장면</div><div>③ Max가 혼자 자는 장면</div><div>④ Tom과 Max가 해변에서 공놀이하는 장면</div><div>⑤ Max가 수영하는 장면</div></div></div><div class=\"pass\"><b>Let's Make a Movie! ④ Emma</b><br>My name is Emma, and I'm a film editor. My work begins after the shooting is over. <u>To create</u> a better story, I can change the order of scenes or delete some of them. Storytelling skills are important for my job, so I read a lot.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① What is Emma's job?</div><div>② When does Emma's work begin?</div><div>③ What can Emma change?</div><div>④ Why does Emma read a lot?</div><div>⑤ What is Emma's favorite book?</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ②</b><br>One day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. <u>It</u> was getting dark, and it started to rain. She opened the door and walked inside.<br>There were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn't care.<br>“It's so fun!” shouted Goldilocks.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> Goldilocks가 오두막 안으로 들어간 상황으로 알맞은 것은?<div class=\"o\"><div>① 곰들이 그녀를 초대했다.</div><div>② 날이 어두워지고 비  class=\"o\"><div>① Peter uses drones capture happy moments.</div><div>② Peter uses drones capturing happy moments.</div><div>③ Peter uses drones for capture happy moments.</div><div>④ Peter uses drones to capture happy moments.</div><div>⑤ Peter uses to drones capture happy moments.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 다음 문장을 3형식으로 바르게 바꾼 것은?<br><br>People didn't give Goldilocks many likes.<div class=\"o\"><div>① People didn't give many likes for Goldilocks.</div><div>② Goldilocks didn't give people many likes.</div><div>③ People didn't give to Goldilocks many likes.</div><div>④ People didn't give Goldilocks to many likes.</div><div>⑤ People didn't give many likes to Goldilocks.</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">문법</span> 질문에 대한 대답으로 알맞은 것은?<br><br>Q: What's the weather like in Busan today?<div class=\"o\"><div>① It's Monday.</div><div>② It's windy and cold.</div><div>③ It's 10 o'clock.</div><div>④ It's December 1st.</div><div>⑤ It's my phone.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">당리중 학습지</span> Why does Emma read a lot?<div class=\"o\"><div>① Because she wants to be a director.</div><div>② Because she wants to train Max.</div><div>③ Because storytelling skills are important for her job.</div><div>④ Because she has to find new actors.</div><div>⑤ Because she likes the beach.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">당리중 학습지</span> What is the main idea of the passage?<div class=\"o\"><div>① How to train a dog</div><div>② Different people who work hard to make a movie</div><div>③ The most beautiful beach in the world</div><div>④ How to make sound effects at home</div><div>⑤ Why people love dogs</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">당리중 학습지</span> Which is <b>TRUE</b> according to the passage?<div class=\"o\"><div>① Anna takes care of Max.</div><div>② Peter edits the movie scenes.</div><div>③ Jennifer trained Max for a long time.</div><div>④ Chris finds places for shooting.</div><div>⑤ Emma uses drones to film the actors.</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">당리중 학습지</span> When does Chris create sound effects in his studio?<div class=\"o\"><div>① When Max is too excited.</div><div>② When recording on location is not easy.</div><div>③ When the shooting begins.</div><div>④ When Emma changes the scenes.</div><div>⑤ When it rains on the beach.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">당리중 학습지</span> Why does Anna love her job?<div class=\"o\"><div>① She likes dogs.</div><div>② She likes to travel and enjoy challenges.</div><div>③ She likes making sound effects.</div><div>④ She likes using drones.</div><div>⑤ She likes reading books.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> Lucy의 'I'm interested in making airplanes, not flying.'에서 생략된 내용을 완전한 문장으로 쓰시오. (I'm not으로 시작)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>그리고 그것은 종이책보다 더 저렴하기도 해.<div class=\"ch\">( than / cheaper / it's / and / the paper book / more / also / cheap )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>물론, 그것은 쉽지 않지만, 나는 내 일을 사랑해요.<div class=\"ch\">( but / love / so / my job / it / is not / easy / of course / I )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> so를 사용하여 한 문장으로 쓰시오.<br>Storytelling skills are important for my job. I read a lot.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>너는 이런 것들이 잘못이라는 것을 모르니?<div class=\"ch\">( you / doesn't / wrong / don't / these things / are / know / is )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <변형> 아래 본문 문장을 '<b>나</b>'를 주어로, '<b>영어 실력을 늘리기 위해</b>'라는 목적으로 바꿔 쓰시오. (improve my English)<br>A lot of people are working hard to create this movie.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> not to 사용, 11단어<br>Jake는 감기에 걸리지 않기 위해 따뜻한 재킷을 입었다. (put on, catch a cold)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> It으로 시작, 3단어<br>오늘은 수요일이다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">당리중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>나는 너를 만나서 기쁘다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">당리중 학습지</span> Peter는 행복한 순간을 담기 위해 드론을 사용할 것이다. (be going to, capture)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1lee_dongju":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Topic 1 · Listen and Number 3]</b><br>G: What do you think about the magic show?<br>B: I think it's amazing.<br>G: I feel the same. I think magic is so cool.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① The boy thinks the magic show is boring.</div><div>② Both of them like the magic show.</div><div>③ The girl doesn't agree with the boy.</div><div>④ The girl doesn't like magic.</div><div>⑤ They are watching a dance show.</div></div></div><div class=\"pass\"><b>[Topic 2 · Different Looks]</b><br>Jiho: Look at this picture. What do you think about it, Yena?<br>Yena: I like it. I think the duck is cute.<br>Jiho: What about you, Andy?<br>Andy: I feel the same. The duck's eye is big.<br>Jiho: Kate, what do you think?<br>Kate: I like it, too, but I don't see a duck. I only see a rabbit.<br>Andy: Oh, now I can see the rabbit, too!<br>Yena: That's interesting! We can see different things in the same picture.</div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 주제로 가장 알맞은 것은?<div class=\"o\"><div>① 좋아하는 동물</div><div>② 미술관 관람 예절</div><div>③ 그림 그리는 방법</div><div>④ 오리와 토끼의 차이</div><div>⑤ 같은 그림에서도 서로 다른 것을 볼 수 있다</div></div></div><div class=\"pass\"><b>[Topic 1 · Listen and Write 3]</b><br>G: Inho, did you have a good weekend?<br>B: Yes. I went ice skating with my friends. <u>How about you?</u><br>G: I took a snowboarding lesson. It was really fun.</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> Inho가 주말에 한 일은?<div class=\"o\"><div>① 스노보드 강습을 받았다</div><div>② 영화를 봤다</div><div>③ 친구들과 스케이트를 타러 갔다</div><div>④ 책을 읽었다</div><div>⑤ 배구 경기에 갔다</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 밑줄 친 'How about you?'와 바꿔 쓸 수 있는 것은?<div class=\"o\"><div>① How are you?</div><div>② What about you?</div><div>③ Who are you?</div><div>④ How old are you?</div><div>⑤ Where are you?</div></div></div><div class=\"pass\"><b>Faces of Great Artists ① Introduction</b><br>Who is your favorite artist? What does she or he look like? Some artists painted self-portraits. Why did they paint <u>themselves</u>? Let's find out.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글(도입부)의 목적으로 가장 알맞은 것은?<div class=\"o\"><div>① 화가들이 자화상을 그린 이유를 알아보려고</div><div>② 그림 그리는 법을 가르치려고</div><div>③ 미술관을 소개하려고</div><div>④ 가장 비싼 그림을 알려 주려고</div><div>⑤ 모델이 되는 법을 알려 주려고</div></div></div><div class=\"pass\"><b>Faces of Great Artists ③ Frida Kahlo</b><br>Frida Kahlo was a Mexican artist. When she was six years old, she was very sick. Her right leg became <u>weaker than</u> her left leg. But she thought, “I will get well. I will help sick people like me.” When she was 18, she was in a terrible bus accident. She stayed in the hospital for a long time. Kahlo said to herself, “I look weak. But I am stronger than anyone.” So, Kahlo started to paint herself. She painted 55 self-portraits in her lifetime. Look at her paintings. Does she look strong?</div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Kahlo was a Mexican artist.</div><div>② Her left leg became weaker than her right leg.</div><div>③ She was very sick when she was six.</div><div>④ She was in a bus accident at 18.</div><div>⑤ She painted 55 self-portraits.</div></div></div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> Kahlo에 관한 사건을 시간 순서대로 바르게 나열한 것은?<br><br>(a) She was in a bus accident.<br>(b) She was very sick.<br>(c) She started to paint herself.<div class=\"o\"><div>① (a)-(b)-(c)</div><div>② (b)-(a)-(c)</div><div>③ (b)-(c)-(a)</div><div>④ (c)-(b)-(a)</div><div>⑤ (a)-(c)-(b)</div></div></div><div class=\"pass\"><b>Frindle ②</b><br>On the way home, Nick saw a pen on the street. He <u>picked up</u> the pen. He had an idea.<br>“From today, your new name is <i>frindle</i>.”<br>The next day, he told his friends about his new word. By the end of the week, all his classmates were using it.<br>“Can I borrow your frindle?”<br>“I think <u>that</u> your red frindle is pretty.”</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하는 것은?<div class=\"o\"><div>① Nick bought a pen at a store.</div><div>② Nick found the pen at school.</div><div>③ Nick told his friends about his new word the next day.</div><div>④ Only Nick used the word frindle.</div><div>⑤ His classmates didn't like the word.</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 'By the end of the week'에 일어난 일은?<div class=\"o\"><div>① Nick이 펜을 잃어버렸다.</div><div>② 선생님이 화를 냈다.</div><div>③ 모든 반 친구들이 그 단어를 사용하고 있었다.</div><div>④ Nick이 졸업했다.</div><div>⑤ 사전에 단어가 실렸다.</div></div></div><div class=\"pass\"><b>Frindle ③</b><br>One day after class, Mrs. Granger called Nick. She said, “<i>Frindle</i> is not a real word. You and your classmates should stop using it.” Nick said, “I know that you're not happy. I'm really sorry, but it's too late. Everyone is using it now.” Mrs. Granger <u>took out</u> a letter. She said, “I wrote this letter for you. But I'm not going to give it to you today. <u>I will send you this letter</u> some day.”</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 밑줄 친 문장을 3형식으로 바꾼 것은?<div class=\"o\"><div>① I will send this letter for you.</div><div>② I will send you to this letter.</div><div>③ I will send to you this letter.</div><div>④ I will send this letter to you.</div><div>⑤ I will send this letter you.</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 빈칸에 알맞은 말끼리 짝지은 것은?<br><br>• Van Gogh painted (A)______.<br>• Kahlo said to (B)______, \"I am strong.\"<div class=\"o\"><div>① him – her</div><div>② he – she</div><div>③ his – hers</div><div>④ himself – her</div><div>⑤ himself – herself</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 밑줄 친 재귀대명사를 생략할 수 있는 것은?<div class=\"o\"><div>① Van Gogh painted <u>himself</u>.</div><div>② I made this cake <u>myself</u>.</div><div>③ They painted <u>themselves</u>.</div><div>④ Kahlo said to <u>herself</u>.</div><div>⑤ Enjoy <u>yourself</u>!</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 접속사 that ② know 사용 ③ 과거시제<div class=\"o\"><div>① I knew what he was a good teacher.</div><div>② I know that he is a good teacher.</div><div>③ I knew he good teacher.</div><div>④ I knew that a good teacher.</div><div>⑤ I knew that he was a good teacher.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같은 것은?<div class=\"o\"><div>① He gave me it. = He gave it to me.</div><div>② I sent him a card. = I sent a card to him.</div><div>③ She made me a cake. = She made a cake to me.</div><div>④ He bought her a pen. = He bought a pen to her.</div><div>⑤ Tell me it. = Tell it for me.</div></div></div><div class=\"pass\"><b>Frindle ④</b><br>The next morning, Mrs. Granger told the class, “Stop using <i>frindle</i>! <i>Frindle</i> is not a real word.” But <u>more and more</u> students used it. Students in other schools started using it. Soon, students in the whole country were using it.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 밑줄 친 표현과 같은 구조(비교급 and 비교급)가 쓰인 것은?<div class=\"o\"><div>① She is the tallest.</div><div>② It was very cold.</div><div>③ It's lighter than mine.</div><div>④ It's getting colder and colder.</div><div>⑤ He is as tall as me.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① She is taller than her sister.</div><div>② This game is more exciting than that one.</div><div>③ My dog is more cute than your dog.</div><div>④ Health is more important than money.</div><div>⑤ Today is hotter than yesterday.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① He gave me a pen.</div><div>② She bought a cake for me.</div><div>③ I sent a letter to him.</div><div>④ He showed his album for me.</div><div>⑤ Mom made me a sandwich.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">동주여중 학습지</span> 표를 보고 내용과 일치하는 것을 고르세요.<br>Jin 15세·155cm / Lua 13세·165cm / Ken 14세·150cm<div class=\"o\"><div>① Ken is older than Jin.</div><div>② Lua is older than Ken.</div><div>③ Jin is taller than Lua.</div><div>④ Ken is shorter than Lua.</div><div>⑤ Lua is shorter than Jin.</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻의 문장은?<br>나는 그가 정직하다고 믿는다.<div class=\"o\"><div>① I believe he that is honest.</div><div>② I believe that is he honest.</div><div>③ That I believe he is honest.</div><div>④ I that believe he is honest.</div><div>⑤ I believe that he is honest.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① When I was ten, I lived in Busan.</div><div>② I will call you when I get home.</div><div>③ She was happy when she got the gift.</div><div>④ When it rains, I stay home.</div><div>⑤ When he will come, we will start the party.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 동의하는 표현을 feel을 사용하여 쓰시오. (4단어)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>눈이 모든 것을 덮었다.<div class=\"ch\">( everything / cover / it / the snow / covered )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 비교급을 사용하여 영작하시오. (Kahlo로 시작, more 사용)<br>Kahlo는 Van Gogh보다 더 많은 자화상을 그렸다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 빈칸에 알맞은 두 단어를 쓰시오.<br>Their paintings have one thing in ______. (공통으로)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>내가 그 역할을 했단다.<div class=\"ch\">( played / role / play / rolled / I / that )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> 재귀대명사 사용, 5단어<br>나는 이 카드를 직접 만들었다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> than anyone 사용, 5단어<br>Kahlo는 누구보다 더 강했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> 두 문장을 that을 사용하여 한 문장으로 쓰시오.<br>I know. + You are not happy.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>나는 일어났을 때 해를 보았다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">동주여중 학습지</span> 우리말을 영어로 쓰세요. 나는 그녀가 내일 올 것이라고 생각한다. (think, that, will)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2lee_dongju":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Topic 1 · Listen and Match 3]</b><br>B: When I feel stressed, I usually watch mukbang.<br>G: What did you say? Watch what?<br>B: I said \"mukbang.\" It's a type of eating show.<br>G: Oh, that sounds interesting. <u>Can you tell me more about it?</u><br>B: The host eats a lot of food and communicates with the viewers on the show.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 'Watch what?'에서 소녀가 알아듣지 못한 부분은?<div class=\"o\"><div>① When I feel stressed</div><div>② mukbang</div><div>③ watch</div><div>④ I usually</div><div>⑤ stressed</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The boy watches mukbang when he feels stressed.</div><div>② The host cooks food for the viewers.</div><div>③ Mukbang is a type of eating show.</div><div>④ The girl didn't hear the word mukbang clearly.</div><div>⑤ The host communicates with the viewers.</div></div></div><div class=\"pass\"><b>[Topic 1 · Listen and Match 2]</b><br>B: Reena, do you have any plans this weekend?<br>G: Yes, I'm going camping with my family.<br>B: That sounds fun! Have you ever roasted marshmallows while camping?<br>G: No, I haven't, but I want to try.<br>B: When you roast marshmallows, they become so soft and sweet.<br>G: Oh, that sounds delicious. <u>I'm really looking forward to tasting them.</u></div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Reena is going camping this weekend.</div><div>② Reena has never roasted marshmallows.</div><div>③ Roasted marshmallows become soft and sweet.</div><div>④ The boy has roasted marshmallows before.</div><div>⑤ Reena doesn't want to try roasting marshmallows.</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> Reena에 대한 설명으로 알맞은 것은?<div class=\"o\"><div>① She has roasted marshmallows many times.</div><div>② She is going camping with her friends.</div><div>③ She has no plans this weekend.</div><div>④ She doesn't like sweet food.</div><div>⑤ She is excited to taste roasted marshmallows.</div></div></div><div class=\"pass\"><b>Take a Rain Check</b><br>Sarah wanted to see a movie with her best friend, Emily. So, she asked Emily, \"Do you want to see a movie with me today?\" Emily replied, \"I'm sorry, but I have to take a rain check. I have to go to my grandmother's house today.\" \"That's okay. Let's do it another time,\" said Sarah. Although Sarah was a little disappointed, she understood Emily's situation. What does \"take a rain check\" mean? It means to refuse an offer politely but wish to do it later. The phrase \"rain check\" was first used at a baseball game in the 1880s. A rain check was a ticket that people got for a future game when a baseball game was canceled because of rain. Later, rain checks were given at other sporting events. Over time, \"take a rain check\" has been widely used to say that you can't do something now and want to do it later.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> rain check에 대한 설명으로 알맞은 것은?<div class=\"o\"><div>① 비 오는 날 받는 우산</div><div>② 비로 경기가 취소되었을 때 미래 경기를 위해 받는 표</div><div>③ 날씨를 확인하는 표</div><div>④ 야구 선수의 계약서</div><div>⑤ 경기 결과를 적은 종이</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 'Let's do it another time'의 it이 가리키는 것은?<div class=\"o\"><div>① going to the grandmother's house</div><div>② taking a rain check</div><div>③ seeing a movie together</div><div>④ playing baseball</div><div>⑤ buying a ticket</div></div></div><div class=\"pass\"><b>Break a Leg</b><br>It was the day of the school play. Lily practiced for the play for weeks. The curtains were about to go up, and she felt very nervous. Her friend smiled and said, \"Break a leg!\" Lily said, \"Thanks. I will!\" She got on the stage and performed successfully. Although \"Break a leg!\" may sound like a bad thing, it actually means \"Good luck!\" German actors who came to the United States in the early 20th century first used this phrase. By wishing each other bad luck, they believed that it would go away. This expression is still used today. \"Break a leg\" is a phrase that people say to wish performers good luck before a show.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 독일 배우들이 서로에게 불운을 빈 이유는?<div class=\"o\"><div>① 불운을 빌면 불운이 사라진다고 믿었기 때문에</div><div>② 서로 경쟁했기 때문에</div><div>③ 관객을 웃기기 위해</div><div>④ 다리를 다치지 않으려고</div><div>⑤ 미국 문화를 따라 하려고</div></div></div><div class=\"pass\"><b>Toboggan Slide</b><br>There are also so many interesting activities you can do at the carnival. The toboggan slide was built in 1884 and is 200 meters long. A toboggan is a long narrow sled. If you like speed, get on the toboggan. It is <u>so fast that</u> you will feel like you are on a roller coaster. While you're sliding down, you can enjoy amazing views of Quebec. You can see a huge famous castle on your left. On your right, you can see a beautiful icy river.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① When was the toboggan slide built?</div><div>② How long is the toboggan slide?</div><div>③ What is a toboggan?</div><div>④ How much does it cost to ride the toboggan?</div><div>⑤ What can you see on your left?</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① You can see the ice palace on your right.</div><div>② The toboggan is so fast that it feels like a roller coaster.</div><div>③ You can enjoy views of Quebec while sliding.</div><div>④ You can see a castle on your left.</div><div>⑤ There are many interesting activities at the carnival.</div></div></div><div class=\"pass\"><b>Ice Canoe Race</b><br>If you see a large crowd along the river, it's time to watch the Ice Canoe Race. This race is one of the best parts of the carnival, and you shouldn't miss it. Canoe teams have to race through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team. Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to get to the water. Phew! They are in the water again. I hope they can make it to the finish line. The race is <u>so exciting that</u> you will forget about the cold.</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 'I hope they can make it to the finish line.'의 make it의 의미는?<div class=\"o\"><div>① 해내다, 도착하다</div><div>② 만들다</div><div>③ 포기하다</div><div>④ 시작하다</div><div>⑤ 기다리다</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 밑줄 친 관계대명사를 생략할 수 있는 것은?<div class=\"o\"><div>① This is the phrase <u>that</u> people say before a show.</div><div>② German actors <u>who</u> came to the US used it.</div><div>③ It's a song <u>that</u> keeps repeating.</div><div>④ People <u>who</u> participate in the race wear costumes.</div><div>⑤ I have a friend <u>who</u> likes idioms.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 다음 중 의미가 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① Although he was sick, he went to school.</div><div>② Though he was sick, he went to school.</div><div>③ He was sick, but he went to school.</div><div>④ Because he was sick, he went to school.</div><div>⑤ He went to school although he was sick.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br><br>I'll show you what to do here.<br>= I'll show you what ______ do here.<div class=\"o\"><div>① you to</div><div>② you will</div><div>③ should you</div><div>④ to you</div><div>⑤ you should</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① Let's learn how to make it.</div><div>② I don't know where to go.</div><div>③ He asked me why to leave.</div><div>④ Tell me when to start.</div><div>⑤ She knows what to buy.</div></div></div><div class=\"pass\"><b>[Topic 1 · Watch and Write]</b><br>G: Did you know that the first zipper was used on a shoe?<br>B: What did you say?<br>G: I said, \"The first zipper was used on a shoe.\"<br>B: That's interesting. Can you tell me more about it?<br>G: Sure. A man wanted to put on his shoes quickly, so he made zippers for <u>them</u>.<br>B: Wow! What a great idea!<br>G: Yeah. Now, we use zippers on many things like jackets and bags.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The man made zippers for his jacket first.</div><div>② A man wanted to put on his shoes quickly.</div><div>③ The boy thinks it was a great idea.</div><div>④ Zippers are used on jackets and bags now.</div><div>⑤ The first zipper was used on a shoe.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① The book which I read was interesting.</div><div>② She is the teacher whom we respect.</div><div>③ I like the song that you sang.</div><div>④ This is the dog which I found it.</div><div>⑤ The people whom I met were kind.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">동주여중 학습지</span> <b>She did volunteer work every week</b> 뒤에 이어질 말로 알맞은 것은?<div class=\"o\"><div>① although he tried his best.</div><div>② he does everything by himself.</div><div>③ I didn't like the restaurant.</div><div>④ I really want to be a chef.</div><div>⑤ although she was busy.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">동주여중 학습지</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br>He is old, but he is very strong. = ______ he is old, he is very strong.<div class=\"o\"><div>① Because</div><div>② Although</div><div>③ When</div><div>④ After</div><div>⑤ So</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">동주여중 학습지</span> 다음 대화가 자연스럽게 이어지도록 순서대로 배열한 것은?<br>(A) What did you say?<br>(B) Look! There's a smart farm here.<br>(C) I said, \"There's a smart farm here.\"<div class=\"o\"><div>① (A)-(B)-(C)</div><div>② (B)-(A)-(C)</div><div>③ (B)-(C)-(A)</div><div>④ (C)-(A)-(B)</div><div>⑤ (C)-(B)-(A)</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">동주여중 학습지</span> 밑줄 친 부분 중 생략할 수 <b>없는</b> 것은?<div class=\"o\"><div>① This is the bag <u>which</u> I bought.</div><div>② He is the boy <u>whom</u> I like.</div><div>③ The movie <u>that</u> we saw was fun.</div><div>④ The man <u>who</u> lives next door is kind.</div><div>⑤ The cake <u>which</u> she made was sweet.</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 영작하시오. (in front of 포함)<br>그 조각 앞에서 사진을 찍자.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>한 남자가 신발을 빨리 신고 싶어서 그것들에 지퍼를 만들었다.<div class=\"ch\">( wanted / putting on / he / so / made / for them / zippers / a man / his shoes / quickly / to put on )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>투표가 완료되었을 때, 그 콩들은 결과를 드러내기 위해 쏟아졌다.<div class=\"ch\">( the voting / to reveal / the beans / completed / the results / was completed / were spilled / when )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 수동태 문장으로 쓰시오.<br>People still use this expression today.<br>→ This expression ________ today.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> so ~ that을 사용하여 한 문장으로 쓰시오.<br>The toboggan is very fast. You will feel like you are on a roller coaster.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> 목적격 관계대명사 who 사용, 9단어<br>그녀는 내가 가장 좋아하는 배우이다. (actor, the most)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> 관계대명사 생략, 7단어<br>이것은 내가 어제 배운 관용구이다. (idiom, learn)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> how to 사용, show 사용, 9단어<br>제가 메이플 태피를 만드는 방법을 보여 드릴게요. (will, maple taffy)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>그 질문은 어려웠지만 그는 질문에 잘 대답했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">동주여중 학습지</span> 관계대명사를 사용하여 영어로 쓰세요.<br>그는 모두가 좋아하는 가수이다. (singer, everyone)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2yun_saha":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Listen Up]</b><br>M: Welcome to the ABC World Food Festival! Every year, we invite great chefs from around the world. This year, we invited Mr. Kumar, a world-famous Indian chef. Do you like Indian food? Then, don't miss his cooking class. You can also get his recipe book for free.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 방송의 목적으로 가장 알맞은 것은?<div class=\"o\"><div>① 요리 대회 참가 신청 안내</div><div>② 음식점 개업 홍보</div><div>③ 요리책 판매 안내</div><div>④ 축제의 주요 행사 홍보</div><div>⑤ 요리사 채용 공고</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 방송을 듣고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① Who was invited this year?</div><div>② What can visitors get for free?</div><div>③ When does the cooking class start?</div><div>④ What kind of food does Mr. Kumar cook?</div><div>⑤ What is the name of the festival?</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ③</b><br>Slowly, everyone got out of the time machine. The jungle was covered in fog. It was very quiet.<br>“I'm so excited,” said Eckels.<br>“Be careful. Some of the dinosaurs are hungry,” said Travis. “Just stay calm. I don't want you to do anything foolish.”<br>“Don't worry. I'm not a fool,” said Eckels.<br>They all began to walk on the path.<br>After some time, Travis whispered, “Look over there. There is a T. rex.”<br>One hundred meters away, a T. rex slowly appeared.<br>“It,” whispered Eckels. “It ...”<br>“Sh!”<br>“It ... is huge. <u>I've never seen</u> such a huge thing. I'm so scared,” said Eckels.<br>“Sh ... quiet!” Travis said angrily. “You don't want it to see you.”</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">본문</span> Travis가 'You don't want it to see you.'라고 말한 의도는?<div class=\"o\"><div>① 공룡에게 인사하라</div><div>② 타임머신을 출발시켜라</div><div>③ 공룡 사진을 찍어라</div><div>④ 공룡에게 다가가라</div><div>⑤ 조용히 해서 공룡에게 들키지 않게 하라</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">본문</span> 정글의 분위기로 가장 알맞은 것은?<div class=\"o\"><div>① 밝고 시끄러운</div><div>② 덥고 건조한</div><div>③ 안개가 끼고 고요한</div><div>④ 춥고 눈이 오는</div><div>⑤ 화려하고 즐거운</div></div></div><div class=\"pass\"><b>Day of the Dead Festival in Mexico</b><br>Many Mexicans believe that once a year dead people come back home to meet their family and friends. They call this day the Day of the Dead. To welcome dead people, Mexicans hold a festival on November 1 and 2. They believe it is important to remember dead people. So, people set up altars in their homes and have big parties in cemeteries. In some areas, people dress up like skeletons and hold big parades.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The festival is held on November 1 and 2.</div><div>② All Mexicans dress up like skeletons.</div><div>③ People have big parties in cemeteries.</div><div>④ Mexicans set up altars in their homes.</div><div>⑤ Mexicans think remembering dead people is important.</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① When do Mexicans hold the festival?</div><div>② What do they call this day?</div><div>③ Where do people set up altars?</div><div>④ What do people put on the altars?</div><div>⑤ What do people do in some areas?</div></div></div><div class=\"pass\"><b>Fallas Festival in Valencia, Spain</b><br>People in Valencia celebrate the coming of spring with the Fallas festival. This festival takes place from March 15 to 19. During the festival, people enjoy parades and fireworks. The stars of the festival are fallas, giant wooden statues. You can find hundreds of them all over the city. Surprisingly, the fallas are burned on the last day of the festival. Burning them symbolizes saying goodbye to old things and hello to a new start.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 글쓴이가 'Surprisingly'라고 쓴 이유로 가장 알맞은 것은?<div class=\"o\"><div>① 파야들이 아주 작아서</div><div>② 축제가 겨울에 열려서</div><div>③ 공들여 만든 거대한 조각상을 마지막 날 태우기 때문에</div><div>④ 불꽃놀이가 없어서</div><div>⑤ 사람들이 퍼레이드를 하지 않아서</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ②</b><br>“This is Travis, your travel guide,” he continued. “To stay safe, you must follow his instructions.”<br>Inside the time machine, there were two other travelers. Eckels sat down and closed his eyes. He felt the machine moving under his feet. After only a few minutes, the machine stopped.<br>“<u>We've just arrived</u> in the jungle of 60 million years ago,” Travis explained. “Do you see the path over there? You must not leave it at any time. Do not touch anything. You might kill something by accident. A little change here can cause something unthinkable in the future.”</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> Travis가 '길을 벗어나지 말라'고 한 근본적인 이유는?<div class=\"o\"><div>① 길 밖에 공룡이 많아서</div><div>② 작은 변화가 미래에 상상할 수 없는 일을 일으킬 수 있어서</div><div>③ 길 밖은 진흙투성이라서</div><div>④ 길을 잃을 수 있어서</div><div>⑤ 타임머신이 멀리 있어서</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① Who is Travis?</div><div>② How many other travelers were in the machine?</div><div>③ How long did the trip take?</div><div>④ What must they not leave?</div><div>⑤ What were the other travelers' names?</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ⑥</b><br>Eckels looked around the room carefully. Everything looked the same, except the big sign on the wall. The sign now said, “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.” Eckels was confused.<br>Then, he saw the TV. The new president was on the news, but it was not Mr. Keith. “What's going on?” He got more confused.<br>He sat down and looked closely at the mud on his shoes.<br>“No, it can't be,” said Eckels. “It's all because of this little thing?” He was shocked. In the mud on his right shoe, he found a small dead butterfly.</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> Eckels의 심경 변화로 가장 알맞은 것은?<div class=\"o\"><div>① happy → confused → excited</div><div>② confused → more confused → shocked</div><div>③ shocked → calm → happy</div><div>④ excited → bored → angry</div><div>⑤ calm → happy → proud</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 가주어 it ② for + 의미상 주어 ③ 부정문<div class=\"o\"><div>① It is not easy for me to run fast.</div><div>② It is not easy me to run fast.</div><div>③ It is easy for me to run fast.</div><div>④ This is not easy for me to run fast.</div><div>⑤ It is not easy for me running fast.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 말로 알맞은 것은?<br><br>They call ______ the Midsummer festival.<div class=\"o\"><div>① it as</div><div>② it to</div><div>③ to it</div><div>④ its</div><div>⑤ it</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 말로 알맞은 것은?<br><br>I've always ______ to see a dinosaur.<div class=\"o\"><div>① want</div><div>② wants</div><div>③ wanting</div><div>④ to want</div><div>⑤ wanted</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br><br>He was very terrified, so he left the path.<br>= He was ______ terrified ______ he left the path.<div class=\"o\"><div>① too – to</div><div>② very – that</div><div>③ so – that</div><div>④ so – to</div><div>⑤ such – that</div></div></div><div class=\"pass\"><b>[Watch, Answer, and Role-play]</b><br>Emma: Hi, Jihan. What a surprise!<br>Jihan: Hey, Emma. Are you here to see the fireworks, too?<br>Emma: Yes. I hear China, Italy, and the USA are participating this year.<br>Jihan: Don't forget Korea.<br>Emma: Of course, Korea, too. So, the fireworks start at 7 p.m. Right?<br>Jihan: Yeah. Let's do something together until then.<br>Emma: I guess we can ride bikes or go for a boat ride. Which do you like more?<br>Jihan: Going for a boat ride. I think it'll be more fun.<br>Emma: Then, let's go for a boat ride.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① Emma came to the park to ride bikes.</div><div>② Emma prefers riding bikes.</div><div>③ The fireworks start at 8 p.m.</div><div>④ Jihan reminds Emma that Korea is also participating.</div><div>⑤ They will watch the fireworks first.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">사하중 학습지</span> 빈칸에 들어갈 말로 알맞은 것은?<br>It is dangerous ______ in the river.<div class=\"o\"><div>① swim</div><div>② swims</div><div>③ to swim</div><div>④ swam</div><div>⑤ swimming</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">사하중 학습지</span> 어순이 바른 문장은?<div class=\"o\"><div>① They call Smarty the robot. (그 로봇을 Smarty라고)</div><div>② They call the robot Smarty.</div><div>③ They the robot call Smarty.</div><div>④ They call to the robot Smarty.</div><div>⑤ They call the robot as Smarty.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">사하중 학습지</span> <b>hardly</b><div class=\"o\"><div>① (동물의) 털</div><div>② 퍼레이드, 행진</div><div>③ 거의 ~ 않다</div><div>④ 기둥, 막대기</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">사하중 학습지</span> 짝지어진 단어의 관계가 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① cheap – expensive</div><div>② light – heavy</div><div>③ remember – forget</div><div>④ participate – take part in</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">사하중 학습지</span> I've just arrived at school.<div class=\"o\"><div>① 경험</div><div>② 완료</div><div>③ 계속</div><div>④ 결과</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오.<br>우리 같이 VR 게임 하러 가자.<div class=\"ch\">( to / play / let's / go / together / VR games )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 동격의 콤마를 사용하여 영작하시오.<br>올해 우리는 세계적으로 유명한 인도 요리사인 Kumar 씨를 초대했습니다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오.<br>일부 지역에서는 사람들이 해골처럼 분장하고 큰 퍼레이드를 한다.<div class=\"ch\">( people / like / dress up / and / big parades / hold / as / in some areas / skeletons )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 가주어 it을 사용하여 바꾸어 쓰시오.<br>To run faster than reindeer is not possible.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>잠시 정적이 흘렀다.<div class=\"ch\">( was / a moment / silent / there / of / were / silence )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 부분을 고쳐 문장 전체를 다시 쓰시오.<br>This is important to remember dead people.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> 가주어 it, for 사용, 8단어<br>내가 비밀을 지키는 것은 어렵다. (keep secrets)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> so ~ that 사용, 9단어<br>그 공룡은 너무 거대해서 Eckels는 숨을 쉴 수 없었다. (huge, breathe)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">사하중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>우리는 6천만 년 전의 정글에 막 도착했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">사하중 학습지</span> 우리말을 영어로 쓰세요. 그는 어리석은 일을 하지 않았다. (anything, foolish)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>"};
const C="①②③④⑤";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function dec(h){try{const b=atob(h.replace(/-/g,"+").replace(/_/g,"/"));return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))}catch(e){return null}}
/* 손으로 그린 듯한 채점 표시 */
const R=(a,b)=>a+Math.random()*(b-a);
function circle(){const cx=29,cy=29,r=22;let d="";for(let i=0;i<=26;i++){const t=-0.6+i/26*(Math.PI*2+0.9);const rr=r+R(-1.5,1.5);d+=(i?"L":"M")+(cx+Math.cos(t)*rr*1.08).toFixed(1)+" "+(cy+Math.sin(t)*rr*.94).toFixed(1)}
 return `<svg class="mk" viewBox="0 0 58 58"><path d="${d}" fill="none" stroke="#e0312b" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity=".88"/></svg>`}
function slash(){return `<svg class="mk" viewBox="0 0 58 58"><path d="M${R(40,46)} ${R(4,8)} Q ${R(28,32)} ${R(26,32)} ${R(10,14)} ${R(50,54)}" fill="none" stroke="#e0312b" stroke-width="4" stroke-linecap="round" opacity=".88"/></svg>`}
function tri(){return `<svg class="mk" viewBox="0 0 58 58"><path d="M29 ${R(6,9)} L${R(50,53)} ${R(48,51)} L${R(6,9)} ${R(48,51)} Z" fill="none" stroke="#e0312b" stroke-width="3.2" stroke-linejoin="round" opacity=".88"/></svg>`}
function main(){const D=dec(location.hash.slice(1));const app=$("#app");
 if(!D||!KEYS[D.e]||!EX[D.e]){app.innerHTML=`<div class="err">결과 링크가 올바르지 않아요.<br>선생님께 받은 링크 전체를 다시 열어 주세요.</div>`;return}
 const K=KEYS[D.e];const graded=Array.isArray(D.s)&&D.s.length===10;
 const mcOk=K.mc.map((q,i)=>D.m[i]===q.a);const mc=mcOk.filter(Boolean).length;
 const sa=graded?D.s.reduce((a,b)=>a+b,0):0;const tot=Math.round((mc*2.5+sa)*10)/10;
 const mw=mcOk.map((o,i)=>o?0:i+1).filter(Boolean),sw=graded?D.s.map((p,i)=>p<5?i+1:0).filter(Boolean):[];
 document.title=`${D.n} · ${K.title} 채점 결과`;
 app.innerHTML=`<div class="paper" id="pp"><div class="head"><div><div class="s">${esc(K.sub)} · 30문항</div><h1>${esc(K.title)}</h1><div class="who">이름 <b>${esc(D.n)}</b>${D.t?` <span style="color:var(--muted);font-size:12.5px">· ${new Date(D.t).toLocaleDateString("ko-KR")} 응시</span>`:""}</div></div>
 <div class="sc">${graded?`<div class="big">${tot}<small>점</small></div><div class="u"></div><div class="u"></div><div class="det">객관식 ${mc*2.5} + 서술형 ${sa}</div>`:`<div class="big" style="font-size:46px">${mc*2.5}<small>/50</small></div><div class="u"></div><div class="det">객관식 점수<br>서술형은 채점 중</div>`}</div></div>
 <div class="sum">${mw.length?`<span class="w">객관식 틀림 ${mw.length}개: ${mw.join(", ")}번</span>`:`<span class="g">객관식 모두 맞음 🎉</span>`}${graded?(sw.length?`<span class="w">서술형 감점 ${sw.length}개: ${sw.join(", ")}번</span>`:`<span class="g">서술형 모두 맞음 🎉</span>`):`<span class="p">서술형 선생님 채점 전</span>`}</div>
 <p class="guide">⭕ 맞음 · ╱ 틀림 · △ 부분 점수 · <span style="color:var(--blue);font-weight:700">파란색</span>은 내가 고른·쓴 답이에요. 틀린 문제를 다시 풀어 본 뒤 <b>💡 정답</b> 버튼으로 확인하세요.</p>
 ${EX[D.e]}<div class="ft">제작: 스텔라원장 · 잉글리시아이 스텔라</div></div>`;
 const qs=[...app.querySelectorAll(".q")];let lastPass=null;
 app.querySelectorAll(".cols > *").forEach(el=>{if(el.classList.contains("pass"))lastPass=el;else if(el.classList.contains("q"))el._p=lastPass});
 qs.forEach((el,i)=>{const it=i<20?K.mc[i]:K.sa[i-20];const p=el._p&&it&&it.p?`<div class="pctx">${el._p.innerHTML}</div>`:"";if(p)el.querySelector(".n").insertAdjacentHTML("beforebegin",p)});
 qs.slice(0,20).forEach((el,i)=>{const q=K.mc[i],my=D.m[i];const o=[...el.querySelectorAll(".o>div")];
  o.forEach((d,k)=>{if(k===q.a)d.classList.add("ans");if(k===my)d.classList.add("my")});
  el.classList.add(mcOk[i]?"ok":"wrong");el.querySelector(".n").insertAdjacentHTML("beforeend",mcOk[i]?circle():slash());
  if(!mcOk[i]&&my===-1)el.querySelector(".o").insertAdjacentHTML("beforebegin",`<div class="mine none">(무응답)</div>`);
  el.insertAdjacentHTML("beforeend",`<div class="exp">정답 <b>${C[q.a]}</b>${q.e?` · ${esc(q.e)}`:""}</div>`)});
 qs.slice(20,30).forEach((el,i)=>{const q=K.sa[i],a=(D.a||[])[i];el.querySelectorAll(".ln").forEach(x=>x.remove());
  el.insertAdjacentHTML("beforeend",a?`<div class="mine">${esc(a)}</div>`:`<div class="mine none">(답 기록 없음 — 시험지를 확인하세요)</div>`);
  if(graded){const p=D.s[i];el.classList.add(p>=5?"ok":"wrong");el.querySelector(".n").insertAdjacentHTML("beforeend",p>=5?circle():p>0?tri():slash());el.style.paddingRight="44px";el.insertAdjacentHTML("afterbegin",`<span class="pt">${p}/5</span>`)}
  else el.classList.add("wrong");
  el.insertAdjacentHTML("beforeend",`<div class="exp">모범 답안: <b>${esc(q.a[0])}</b>${q.e?`<br>${esc(q.e)}`:""}</div>`)});
 const pp=$("#pp");
 $("#b1").onclick=()=>{pp.classList.toggle("only");$("#b1").classList.toggle("on")};
 $("#b2").onclick=()=>{pp.classList.toggle("show");$("#b2").classList.toggle("on")};
 $("#b3").onclick=()=>window.print()}
main();window.addEventListener("hashchange",main);
</script>
