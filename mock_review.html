ouch the hearts of many people.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 'They touch the hearts of many people.'의 touch 의미로 알맞은 것은?<div class=\"o\"><div>① 다치게 하다</div><div>② 연락하다</div><div>③ 감동시키다</div><div>④ 만지다</div><div>⑤ 닿다</div></div></div><div class=\"pass\"><b>Frindle ②</b><br>On the way home, Nick saw a pen on the street. He <u>picked up</u> the pen. He had an idea.<br>“From today, your new name is <i>frindle</i>.”<br>The next day, he told his friends about his new word. By the end of the week, all his classmates were using it.<br>“Can I borrow your frindle?”<br>“I think <u>that</u> your red frindle is pretty.”</div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 밑줄 친 that과 쓰임이 같은 것은?<div class=\"o\"><div>① I like <u>that</u> book.</div><div>② <u>That</u> was fun.</div><div>③ I know <u>that</u> he is kind.</div><div>④ <u>That</u> is my pen.</div><div>⑤ Who is <u>that</u> girl?</div></div></div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> Nick이 'frindle'이라는 이름을 붙인 물건은?<div class=\"o\"><div>① 펜</div><div>② 개</div><div>③ 사전</div><div>④ 책</div><div>⑤ 편지</div></div></div><div class=\"pass\"><b>Frindle ③</b><br>One day after class, Mrs. Granger called Nick. She said, “<i>Frindle</i> is not a real word. You and your classmates should stop using it.” Nick said, “I know that you're not happy. I'm really sorry, but it's too late. Everyone is using it now.” Mrs. Granger <u>took out</u> a letter. She said, “I wrote this letter for you. But I'm not going to give it to you today. <u>I will send you this letter</u> some day.”</div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Mrs. Granger gave the letter to Nick that day.</div><div>② Mrs. Granger will send Nick the letter some day.</div><div>③ Nick said sorry to Mrs. Granger.</div><div>④ Mrs. Granger said frindle was not a real word.</div><div>⑤ Mrs. Granger wrote a letter for Nick.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 수 <b>없는</b> 것은?<br><br>Her right leg became ______ weaker than her left leg.<div class=\"o\"><div>① a lot</div><div>② much</div><div>③ far</div><div>④ very</div><div>⑤ even</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br>그녀는 누구보다 훨씬 더 강하다.<div class=\"o\"><div>① She is strongest than anyone.</div><div>② She is more stronger than anyone.</div><div>③ She is very stronger than anyone.</div><div>④ She is much stronger than anyone.</div><div>⑤ She is much strong than anyone.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 밑줄 친 that을 생략할 수 있는 것은?<div class=\"o\"><div>① Look at <u>that</u> snowman.</div><div>② On <u>that</u> page, he found it.</div><div>③ I played <u>that</u> role.</div><div>④ <u>That</u> is my pen.</div><div>⑤ I know <u>that</u> you're not happy.</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① She bought a sweater for me.</div><div>② My mom made us a chocolate cake.</div><div>③ He told his friends the new word.</div><div>④ I'm not going to give you it today.</div><div>⑤ I wrote my grandma a Christmas card.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">동주여중 학습지</span> 다음 중 비교급 형태가 <b>잘못된</b> 것은?<div class=\"o\"><div>① hot – hotter</div><div>② happy – happier</div><div>③ famous – more famous</div><div>④ good – gooder</div><div>⑤ big – bigger</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">동주여중 학습지</span> 빈칸에 들어갈 말로 알맞은 것은?<br>Can I ask a favor ______ you?<div class=\"o\"><div>① of</div><div>② on</div><div>③ in</div><div>④ to</div><div>⑤ for</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">동주여중 학습지</span> 빈칸에 들어갈 말로 알맞은 것은?<br>This bag is ______ than that one. (heavy)<div class=\"o\"><div>① heavier</div><div>② more heavy</div><div>③ heaviest</div><div>④ heavy</div><div>⑤ heavyer</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">동주여중 학습지</span> 밑줄 친 that을 <b>생략할 수 없는</b> 것은?<div class=\"o\"><div>① I think <u>that</u> he is kind.</div><div>② I hope <u>that</u> you like it.</div><div>③ We know <u>that</u> she is right.</div><div>④ She said <u>that</u> she was tired.</div><div>⑤ It is true <u>that</u> he likes animals.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">동주여중 학습지</span> 빈칸에 들어갈 말로 알맞은 것은?<br>My mom cooked dinner ______ us.<div class=\"o\"><div>① for</div><div>② of</div><div>③ at</div><div>④ with</div><div>⑤ to</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>나는 그의 목소리가 아름답다고 생각해.<div class=\"ch\">( think / beautiful / are / beautifully / is / I / his voice )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 영작하시오. (like 활용, 6단어)<br>너는 그 영화가 어땠니?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 영어로 답하시오. (He painted로 시작)<br>Q: How many self-portraits did Van Gogh paint?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>그들은 왜 자기 자신을 그렸을까? 알아보자.<div class=\"ch\">( themselves / painted / find out / let's / did / them / they / why / paint )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 영작하시오. (that 포함, 8단어)<br>나는 너의 빨간 frindle이 예쁘다고 생각해.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <변형> 본문 문장을 '<b>my brother</b>와 <b>me</b>, <b>tall</b>'로 바꿔 같은 구조로 쓰시오.<br>Her right leg became weaker than her left leg.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> say to + 재귀대명사 사용<br>그녀는 스스로에게 \"나는 할 수 있어.\"라고 말했다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> <조건> 4형식, write 사용, 과거시제, 7단어<br>나는 할머니께 크리스마스 카드를 써 드렸다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>이 선생님은 우리에게 역사를 가르치신다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">동주여중 학습지</span> 3형식 문장으로 바꿔 쓰세요.<br>Jane showed me her new bike.<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2lee_dongju_r":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Topic 2 · Watch a Video]</b><br>Jake: Wow! Look at the big sculpture over there.<br>Hana: It's beautiful. The word \"love\" is in big red letters.<br>Jake: It's a great example of public art.<br>Hana: What did you say?<br>Jake: I said \"public art.\" It's art for everyone.<br>Hana: I like that idea. Can you tell me more about it?<br>Jake: Sure. It's art in public spaces like parks and streets.<br>Hana: Oh, I saw a piece of public art when I visited Jeju-do.<br>Jake: Yeah, they're everywhere. Let's take a photo in front of the sculpture.<br>Hana: Sounds good.</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> Hana가 'What did you say?'라고 말한 이유는?<div class=\"o\"><div>① Jake를 칭찬하려고</div><div>② 사진을 찍자고 하려고</div><div>③ 조각의 가격을 물으려고</div><div>④ Jake의 제안을 거절하려고</div><div>⑤ Jake가 한 말을 다시 듣고 싶어서</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화 직후 두 사람이 할 일은?<div class=\"o\"><div>① take a photo</div><div>② visit Jeju-do</div><div>③ buy a sculpture</div><div>④ draw a picture</div><div>⑤ interview an artist</div></div></div><div class=\"pass\"><b>[Topic 1 · Listen and Match 3]</b><br>B: Have you ever been to Boryeong?<br>G: Yes, I have, James. I went there last summer for the mud festival.<br>B: Oh, really? I'm going to the next mud festival. What activities did you enjoy?<br>G: I rode the mud slide and played in the mud pool.<br>B: Sounds exciting! I'm looking forward to trying out all the muddy activities.<br>G: Yeah, I hope you have a fantastic time!</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 소녀가 머드 축제에서 한 활동이 <b>아닌</b> 것은?<div class=\"o\"><div>① played in the mud pool</div><div>② enjoyed muddy activities</div><div>③ tried the mud massage</div><div>④ rode the mud slide</div><div>⑤ went to the festival last summer</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 'Sounds exciting!'이 가리키는 내용은?<div class=\"o\"><div>① 축제 입장료</div><div>② 머드 슬라이드와 머드 풀장에서 논 것</div><div>③ 소년의 계획</div><div>④ 보령에 사는 것</div><div>⑤ 여름 방학 숙제</div></div></div><div class=\"pass\"><b>Spill the Beans</b><br>Tommy and Lisa were preparing a surprise party for Hana. But Tommy was not good at keeping secrets. So, Lisa told him, \"Don't spill the beans.\" Tommy said, \"Don't worry. I promise not to tell Hana.\" Tommy kept his promise and the surprise party was a big success. Hana was completely surprised. What does the phrase \"spill the beans\" mean? It means to reveal a secret. Where does this phrase come from? It comes from an ancient Greek way of voting. When Greeks voted, they put a white or black bean in a big jar. When the voting was completed, the beans were spilled to reveal the results. From then, people began to use this phrase with a new meaning.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> Lisa가 Tommy에게 'Don't spill the beans.'라고 말한 이유는?<div class=\"o\"><div>① Hana가 콩을 싫어해서</div><div>② Tommy가 비밀을 잘 지키지 못해서</div><div>③ Tommy가 파티에 늦어서</div><div>④ Tommy가 콩을 자주 쏟아서</div><div>⑤ 파티 음식을 준비하려고</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① What did Tommy promise?</div><div>② What color were the beans in the jar?</div><div>③ Where does the phrase come from?</div><div>④ Who was the surprise party for?</div><div>⑤ How many people came to the party?</div></div></div><div class=\"pass\"><b>Break a Leg</b><br>It was the day of the school play. Lily practiced for the play for weeks. The curtains were about to go up, and she felt very nervous. Her friend smiled and said, \"Break a leg!\" Lily said, \"Thanks. I will!\" She got on the stage and performed successfully. Although \"Break a leg!\" may sound like a bad thing, it actually means \"Good luck!\" German actors who came to the United States in the early 20th century first used this phrase. By wishing each other bad luck, they believed that it would go away. This expression is still used today. \"Break a leg\" is a phrase that people say to wish performers good luck before a show.</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 'The curtains were about to go up'이 나타내는 상황은?<div class=\"o\"><div>① 공연이 막 시작하려고 했다.</div><div>② 공연이 취소되었다.</div><div>③ 커튼이 찢어졌다.</div><div>④ 공연이 끝났다.</div><div>⑤ 연습이 시작되었다.</div></div></div><div class=\"pass\"><b>Toboggan Slide</b><br>There are also so many interesting activities you can do at the carnival. The toboggan slide was built in 1884 and is 200 meters long. A toboggan is a long narrow sled. If you like speed, get on the toboggan. It is <u>so fast that</u> you will feel like you are on a roller coaster. While you're sliding down, you can enjoy amazing views of Quebec. You can see a huge famous castle on your left. On your right, you can see a beautiful icy river.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> toboggan의 뜻으로 알맞은 것은?<div class=\"o\"><div>① a long narrow sled</div><div>② a roller coaster</div><div>③ an ice skate</div><div>④ a short wide boat</div><div>⑤ a big castle</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 터보건을 추천하는 사람은?<div class=\"o\"><div>① 춤을 좋아하는 사람</div><div>② 음식을 좋아하는 사람</div><div>③ 속도를 좋아하는 사람</div><div>④ 수영을 좋아하는 사람</div><div>⑤ 조용한 것을 좋아하는 사람</div></div></div><div class=\"pass\"><b>Ice Canoe Race</b><br>If you see a large crowd along the river, it's time to watch the Ice Canoe Race. This race is one of the best parts of the carnival, and you shouldn't miss it. Canoe teams have to race through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team. Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to get to the water. Phew! They are in the water again. I hope they can make it to the finish line. The race is <u>so exciting that</u> you will forget about the cold.</div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 강을 따라 많은 군중이 보이면 무엇을 의미하는가?<div class=\"o\"><div>① 터보건이 시작된다</div><div>② 아이스 카누 경주를 볼 시간이다</div><div>③ 간식을 파는 시간이다</div><div>④ 카니발이 끝났다</div><div>⑤ 얼음 궁전이 열렸다</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 빈칸에 들어갈 말로 알맞은 것은?<br><br>______ Sarah was a little disappointed, she understood Emily's situation.<div class=\"o\"><div>① Although</div><div>② But</div><div>③ So</div><div>④ If</div><div>⑤ Because</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 목적격 관계대명사 which ② 과거시제 ③ 목적어 중복 없음<div class=\"o\"><div>① The ticket which people got was free.</div><div>② The ticket which people got it was free.</div><div>③ The ticket who people got was free.</div><div>④ The ticket which people get is free.</div><div>⑤ The ticket people got it was free.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 다음 중 두 문장의 의미가 <b>다른</b> 것은?<div class=\"o\"><div>① I know how to swim. = I know how I should swim.</div><div>② He is so strong that he can lift it. = He is too strong to lift it.</div><div>③ She is so young that she can't drive. = She is too young to drive.</div><div>④ It was so hot that I couldn't sleep. = It was too hot for me to sleep.</div><div>⑤ Tell me where to go. = Tell me where I should go.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> <조건>에 맞게 쓴 문장은?<br><조건> ① 의문사 + to부정사 ② 4형식 ③ teach 사용<div class=\"o\"><div>① Can you teach how to me ski?</div><div>② Can you teach to me how ski?</div><div>③ Can you teach me how skiing?</div><div>④ Can you teach me why to ski?</div><div>⑤ Can you teach me how to ski?</div></div></div><div class=\"pass\"><b>[Topic 1 · Watch and Write]</b><br>G: These strawberries are really delicious. Have you ever picked fresh strawberries, Giho?<br>B: Yes, I have. I picked these strawberries <u>myself</u>.<br>G: Really? Where did you pick them?<br>B: I participated in a strawberry picking event at a farm last week.<br>G: That sounds really interesting. Can you tell me more about the event?<br>B: Of course. You can eat all the strawberries you pick at the farm.<br>G: How many strawberries did you eat?<br>B: I don't know exactly, but I was so full.<br>G: Sounds like you had a great time. Are you going to go there again?<br>B: Yes. Next month. I'm looking forward to picking those fresh strawberries again.</div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 대화의 내용과 일치하는 것은?<div class=\"o\"><div>① Giho ate exactly 30 strawberries.</div><div>② You can eat all the strawberries you pick.</div><div>③ Giho joined the event last month.</div><div>④ The girl picked the strawberries.</div><div>⑤ Giho won't go there again.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">동주여중 학습지</span> 두 문장을 한 문장으로 바르게 연결한 것은?<br>The pizza was delicious. + We ordered it.<div class=\"o\"><div>① The pizza whom we ordered was delicious.</div><div>② The pizza was delicious which we ordered it.</div><div>③ The pizza which we ordered was delicious.</div><div>④ The pizza we ordered it was delicious.</div><div>⑤ The pizza who we ordered was delicious.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">동주여중 학습지</span> <b>Although he is young,</b> 뒤에 이어질 말로 알맞은 것은?<div class=\"o\"><div>① he does everything by himself.</div><div>② although she was busy.</div><div>③ I didn't like the restaurant.</div><div>④ although he tried his best.</div><div>⑤ I really want to be a chef.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">동주여중 학습지</span> although와 바꿔 쓸 수 있는 것은?<div class=\"o\"><div>① though</div><div>② but</div><div>③ so</div><div>④ because</div><div>⑤ if</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">동주여중 학습지</span> 밑줄 친 that과 쓰임이 같은 것은?<br>It's a song <u>that</u> keeps repeating in your mind.<div class=\"o\"><div>① <u>That</u> is my bag.</div><div>② This is the bike <u>that</u> runs fast.</div><div>③ Look at <u>that</u> girl.</div><div>④ I know <u>that</u> he is kind.</div><div>⑤ I think <u>that</u> it's true.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">동주여중 학습지</span> 빈칸에 공통으로 들어갈 말은?<br>• I saw a man and his dog ______ were running.<br>• This is the best movie ______ I've ever seen.<div class=\"o\"><div>① which</div><div>② what</div><div>③ whom</div><div>④ who</div><div>⑤ that</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> look을 사용하여 영작하시오. (I'm으로 시작)<br>나는 얼음 강에서 낚시하는 것을 기대하고 있다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> know를 사용하여 '그것에 관해 좀 더 알고 싶어.'를 영작하시오. (I'd로 시작)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 영어로 답하시오. (관용 표현만 쓰시오)<br>Q: Which idiom can you use to tell someone not to tell a secret? → Don't ________.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 우리말과 같도록 배열하시오. (필요 없는 단어 포함)<br>비록 Sarah는 조금 실망했지만, 그녀는 Emily의 상황을 이해했다.<div class=\"ch\">( understood / a little / disappointed / Emily's situation / she / was / Sarah / although / disappointing )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 의문사 + to부정사를 사용하여 영작하시오. (I'll show you로 시작)<br>제가 이곳에서 무엇을 해야 할지 보여 줄게요.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 부분을 고쳐 문장 전체를 다시 쓰시오.<br>Although it was raining, but they played baseball.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 부분을 고쳐 문장 전체를 다시 쓰시오.<br>The beans which they put them in the jar were white.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> 다음 문장을 '의문사 + to부정사'로 바꾸시오.<br>Bonhomme told us where we should go next.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">동주여중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>[대화 5 · 공공 미술] Hana: 좋아.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">동주여중 학습지</span> 틀린 부분을 고쳐 문장 전체를 다시 쓰세요.<br>The bag who I bought yesterday is blue.<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2yun_saha_r":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"pass\"><b>[Watch and Check 2]</b><br>B: They have tteokbokki and gimbap here. Which of the two do you like better?<br>G: I like tteokbokki <u>much</u> better. I like spicy food.<br>B: Then, let's order tteokbokki. It looks delicious.<br>G: OK. I'm so hungry!</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① They will order tteokbokki.</div><div>② The girl prefers gimbap because it is not spicy.</div><div>③ The boy thinks tteokbokki looks delicious.</div><div>④ They can choose between two kinds of food.</div><div>⑤ The girl likes spicy food.</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 밑줄 친 much와 쓰임이 같은 것은?<div class=\"o\"><div>① She ate too much food.</div><div>② Thank you very much.</div><div>③ How much is this cap?</div><div>④ I don't have much time.</div><div>⑤ This T-shirt is much cheaper than the cap.</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ②</b><br>“This is Travis, your travel guide,” he continued. “To stay safe, you must follow his instructions.”<br>Inside the time machine, there were two other travelers. Eckels sat down and closed his eyes. He felt the machine moving under his feet. After only a few minutes, the machine stopped.<br>“<u>We've just arrived</u> in the jungle of 60 million years ago,” Travis explained. “Do you see the path over there? You must not leave it at any time. Do not touch anything. You might kill something by accident. A little change here can cause something unthinkable in the future.”</div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">본문</span> 이 부분에서 이후의 사건을 예고하는 문장은?<div class=\"o\"><div>① You might kill something by accident.</div><div>② After only a few minutes, the machine stopped.</div><div>③ Inside the time machine, there were two other travelers.</div><div>④ This is Travis, your travel guide.</div><div>⑤ Eckels sat down and closed his eyes.</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">본문</span> 타임머신 안에 있던 여행자는 Eckels를 포함해 모두 몇 명인가? (안내원 제외)<div class=\"o\"><div>① 2명</div><div>② 1명</div><div>③ 4명</div><div>④ 5명</div><div>⑤ 3명</div></div></div><div class=\"pass\"><b>Fur Rondy Festival in Alaska, USA</b><br>At the end of February, people in Alaska hold the Fur Rondy festival, one of the biggest winter festivals in the world. During this festival, visitors can enjoy various winter sports and Alaskan traditional games. They can also enjoy many special events such as the Running of the Reindeer. People who participate in this race wear fun costumes and try to run faster than reindeer. Is it possible to do so? Not really, but it doesn't matter. Everyone is just having fun!</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The Running of the Reindeer is a special event.</div><div>② Most runners can run faster than reindeer.</div><div>③ Visitors can enjoy Alaskan traditional games.</div><div>④ Runners in the race wear fun costumes.</div><div>⑤ It is one of the biggest winter festivals in the world.</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 'Is it possible to <u>do so</u>?'에서 do so가 가리키는 것은?<div class=\"o\"><div>① run faster than reindeer</div><div>② participate in this race</div><div>③ enjoy winter sports</div><div>④ hold the festival</div><div>⑤ wear fun costumes</div></div></div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">통합</span> Fur Rondy 글의 분위기로 가장 알맞은 것은?<div class=\"o\"><div>① 슬프고 우울한</div><div>② 긴장되고 두려운</div><div>③ 비판적인</div><div>④ 진지하고 엄숙한</div><div>⑤ 유쾌하고 즐거운</div></div></div><div class=\"pass\"><b>Day of the Dead Festival in Mexico</b><br>Many Mexicans believe that once a year dead people come back home to meet their family and friends. They call this day the Day of the Dead. To welcome dead people, Mexicans hold a festival on November 1 and 2. They believe it is important to remember dead people. So, people set up altars in their homes and have big parties in cemeteries. In some areas, people dress up like skeletons and hold big parades.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 'So, people set up altars ~'에서 So 앞에 제시된 이유로 알맞은 것은?<div class=\"o\"><div>① 파티를 좋아해서</div><div>② 11월에 날씨가 좋아서</div><div>③ 고인을 기억하는 것이 중요하다고 믿어서</div><div>④ 퍼레이드가 유명해서</div><div>⑤ 해골 의상이 저렴해서</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ③</b><br>Slowly, everyone got out of the time machine. The jungle was covered in fog. It was very quiet.<br>“I'm so excited,” said Eckels.<br>“Be careful. Some of the dinosaurs are hungry,” said Travis. “Just stay calm. I don't want you to do anything foolish.”<br>“Don't worry. I'm not a fool,” said Eckels.<br>They all began to walk on the path.<br>After some time, Travis whispered, “Look over there. There is a T. rex.”<br>One hundred meters away, a T. rex slowly appeared.<br>“It,” whispered Eckels. “It ...”<br>“Sh!”<br>“It ... is huge. <u>I've never seen</u> such a huge thing. I'm so scared,” said Eckels.<br>“Sh ... quiet!” Travis said angrily. “You don't want it to see you.”</div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① How far away was the T. rex?</div><div>② How did Eckels feel when he saw the T. rex?</div><div>③ What did Travis tell Eckels to do?</div><div>④ What was the jungle like?</div><div>⑤ How tall was the T. rex?</div></div></div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> Eckels가 'It ... It ...'이라고 말을 잇지 못한 이유는?<div class=\"o\"><div>① Travis가 말을 막아서</div><div>② 배가 고파서</div><div>③ 너무 놀라고 무서워서</div><div>④ 공룡 이름을 몰라서</div><div>⑤ 춥고 피곤해서</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ⑥</b><br>Eckels looked around the room carefully. Everything looked the same, except the big sign on the wall. The sign now said, “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.” Eckels was confused.<br>Then, he saw the TV. The new president was on the news, but it was not Mr. Keith. “What's going on?” He got more confused.<br>He sat down and looked closely at the mud on his shoes.<br>“No, it can't be,” said Eckels. “It's all because of this little thing?” He was shocked. In the mud on his right shoe, he found a small dead butterfly.</div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">본문</span> 'It's all because of this little thing?'에서 this little thing이 가리키는 것은?<div class=\"o\"><div>① a small dead butterfly</div><div>② the TV</div><div>③ the sign</div><div>④ the mud</div><div>⑤ the time machine</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 두 문장의 의미가 같도록 할 때 빈칸에 알맞은 것은?<br><br>To participate in the race is exciting.<br>= ______ is exciting to participate in the race.<div class=\"o\"><div>① There</div><div>② What</div><div>③ That</div><div>④ This</div><div>⑤ It</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 어법상 알맞은 문장의 개수는?<br><br>ⓐ It is dangerous to swim here.<br>ⓑ People call the statues fallas.<br>ⓒ That is fun to dance together.<br>ⓓ It is easy to making kimchi.<br>ⓔ We call him as Bonhomme.<div class=\"o\"><div>① 2개</div><div>② 5개</div><div>③ 3개</div><div>④ 1개</div><div>⑤ 4개</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① She has already finished her homework.</div><div>② He has visited the museum yesterday.</div><div>③ They haven't arrived yet.</div><div>④ I have lived here for ten years.</div><div>⑤ Have you ever tried ice fishing?</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">문법</span> 질문에 대한 대답으로 알맞은 것은?<br><br>A: Have you ever seen a T. rex?<br>B: ______<div class=\"o\"><div>① No, I didn't.</div><div>② Yes, I did.</div><div>③ No, I don't.</div><div>④ No, I haven't.</div><div>⑤ Yes, I was.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">사하중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① It is scary to watch horror movies.</div><div>② It is relaxing listen to soft music.</div><div>③ It is not easy to break bad habits.</div><div>④ It is exciting to travel abroad.</div><div>⑤ Is it helpful to take notes in class?</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">사하중 학습지</span> 다음 중 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① I want you to apologize to me.</div><div>② My friends call Bob me.</div><div>③ People call Bach the father of music.</div><div>④ The ceremony made us emotional.</div><div>⑤ They heard people shouting.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">사하중 학습지</span> <b>Mexican</b><div class=\"o\"><div>① (동물의) 털</div><div>② 멕시코 사람; 멕시코의</div><div>③ 거의 ~ 않다</div><div>④ 거대한</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">사하중 학습지</span> 밑줄 친 hold의 뜻이 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① Mexicans <u>hold</u> a festival in November.</div><div>② They <u>hold</u> the Fur Rondy festival.</div><div>③ <u>Hold</u> my hand, please.</div><div>④ Our school will <u>hold</u> a sports day.</div><div>⑤ The city <u>holds</u> a big parade.</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">사하중 학습지</span> She has lived here for five years.<div class=\"o\"><div>① 완료</div><div>② 계속</div><div>③ 경험</div><div>④ 결과</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 배열하시오.<br>또한 여러분은 그의 요리책을 무료로 받을 수 있습니다.<div class=\"ch\">( for / get / can / with / his / free / also / you / recipe book )</div><div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> Which를 사용하여 같은 의미의 문장으로 바꾸어 쓰시오.<br>Do you prefer the T-shirt or the cap?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> 우리말과 같도록 영작하시오. (hundreds, all over 포함)<br>여러분은 도시 곳곳에서 수백 개의 파야를 볼 수 있다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 빈칸에 알맞은 두 단어를 쓰시오.<br>In some areas, people ______ ______ like skeletons.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 동격의 콤마를 사용하여 영작하시오. (said로 시작하지 말 것)<br>Time Travel의 설립자인 Parker 씨가 “무엇을 도와드릴까요?”라고 말했다.<br>→ “How can we help you?” said ________________.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> call 사용, 6단어<br>사람들은 이 축제를 'Fur Rondy'라고 부른다. (this festival)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> 다음 문장을 To부정사 주어로 시작하는 문장으로 바꾸시오.<br>It is fun to watch the parade.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">문법</span> 두 문장을 so ~ that을 사용하여 한 문장으로 쓰시오.<br>The jungle was very quiet. Eckels could hear his heart.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">사하중 학습지</span> 우리말과 같은 뜻이 되도록 영어 문장 전체를 쓰시오.<br>친구들과 노는 것은 재미있다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">사하중 학습지</span> 우리말을 영어로 쓰세요. 그들은 그 다리를 '골든 게이트'라고 부른다. (the bridge, the Golden Gate)<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m1yun_saha_l8":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">대화문</span> 우리말을 영어로 바르게 옮긴 것은?<br>청소 로봇은 우리 같은 사람들에게 딱이다.<div class=\"o\"><div>① Cleaning robot are perfect for people like our.</div><div>② Cleaning robots are perfectly for people like we.</div><div>③ Cleaning robots is perfect for people like us.</div><div>④ Cleaning robots are perfect for people like us.</div><div>⑤ Cleaning robots are perfect to people likes us.</div></div></div><div class=\"pass\"><b>[Watch and Check 4]</b><br>G: What do you think about cleaning robots? There's one over there.<br>B: I think they are very helpful. I really need one at home.<br>G: <u>Me, too.</u> I don't like to clean my room.<br>B: Who does? Cleaning robots are perfect for people like us.</div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The girl likes to clean her room.</div><div>② The boy really needs a cleaning robot at home.</div><div>③ The boy thinks cleaning robots are perfect for them.</div><div>④ There is a cleaning robot over there.</div><div>⑤ The boy thinks cleaning robots are helpful.</div></div></div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">대화문</span> 밑줄 친 one의 쓰임이 나머지와 <b>다른</b> 것은?<div class=\"o\"><div>① There's <u>one</u> over there.</div><div>② I have <u>one</u> brother and two sisters.</div><div>③ I lost my pen. I need a new <u>one</u>.</div><div>④ I need <u>one</u> at home.</div><div>⑤ This cap is small. Do you have a bigger <u>one</u>?</div></div></div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 빈칸에 들어갈 말로 알맞지 <b>않은</b> 것은?<br><br>A: This movie looks really fun. ______<br>B: I think it looks a little boring.<div class=\"o\"><div>① What did you do yesterday?</div><div>② What's your opinion?</div><div>③ What do you think about it?</div><div>④ How do you feel about it?</div><div>⑤ What do you think?</div></div></div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 우리말을 영어로 바르게 옮긴 것은?<br>엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.<div class=\"o\"><div>① Mother Bear found a phone next to Goldilocks.</div><div>② Mother Bear found a phone next of Goldilocks.</div><div>③ Mother Bear finds a phone to Goldilocks.</div><div>④ Mother Bear founded a phone next to Goldilocks.</div><div>⑤ Mother Bear found a phone next Goldilocks.</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ⑤</b><br>All summer long, Goldilocks worked hard. On the last day, Goldilocks said to Father Bear, “I deleted all my posts of your cottage, so please don't worry.”<br>“You still don't understand. Other people already shared them on social media. Your posts will <u>live on</u> forever,” said Father Bear.<br>“Oh, I didn't think about that,” said Goldilocks. “From now on, I'll think twice before I press POST.”</div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① She deleted all her posts of the cottage.</div><div>② Other people already shared her posts.</div><div>③ Father Bear said her posts will disappear soon.</div><div>④ Goldilocks worked hard all summer long.</div><div>⑤ Goldilocks will think twice before she presses POST.</div></div></div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 밑줄 친 부분의 의미가 <b>틀린</b> 것은?<div class=\"o\"><div>① She <u>took a walk</u> in the forest. – 산책했다</div><div>② She <u>knocked on</u> the door. – 노크했다</div><div>③ <u>From now on</u>, I'll think twice. – 이제부터</div><div>④ <u>At first</u>, she posted everyday things. – 처음에</div><div>⑤ She jumped <u>again and again</u>. – 한 번만</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ③</b><br>She took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and <u>fell asleep</u> in the smallest bed.<br>About an hour later, three bears came home.<br>“Someone ate my soup and broke my chair!” cried Baby Bear.<br>They went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.<br>“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.<br>Goldilocks jumped up in surprise.</div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The bears came home about an hour later.</div><div>② She fell asleep in the biggest bed.</div><div>③ She found three beds upstairs.</div><div>④ Goldilocks posted all the selfies on social media.</div><div>⑤ Mother Bear found a phone next to Goldilocks.</div></div></div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 다음 질문 중 이야기를 읽고 답할 수 <b>없는</b> 것은?<div class=\"o\"><div>① Who found a phone next to Goldilocks?</div><div>② How many bowls of soup were there?</div><div>③ How many followers did Goldilocks have?</div><div>④ What did Goldilocks post at first?</div><div>⑤ What will Goldilocks do from now on?</div></div></div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 밑줄 친 부분의 쓰임이 <b>틀린</b> 것은?<div class=\"o\"><div>① Mother Bear shouted <u>angrily</u>.</div><div>② She <u>felt asleep</u> in the bed.</div><div>③ She jumped up in <u>surprise</u>.</div><div>④ She felt <u>tired</u>.</div><div>⑤ They went <u>upstairs</u>.</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 다음 문장을 3형식으로 바르게 바꾼 것은?<br><br>People didn't give Goldilocks many likes.<div class=\"o\"><div>① Goldilocks didn't give people many likes.</div><div>② People didn't give many likes to Goldilocks.</div><div>③ People didn't give to Goldilocks many likes.</div><div>④ People didn't give many likes for Goldilocks.</div><div>⑤ People didn't give Goldilocks to many likes.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br>그녀는 가장 작은 침대에서 잠들었다.<div class=\"o\"><div>① She fell asleep in smallest bed.</div><div>② She fell asleep in the most small bed.</div><div>③ She falls asleep in a smallest bed.</div><div>④ She fell asleep in the smallest bed.</div><div>⑤ She fell asleep in the smaller bed.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br>그녀는 나에게 멋진 저녁 식사를 만들어 주었다.<div class=\"o\"><div>① She me made a nice dinner.</div><div>② She made to me a nice dinner.</div><div>③ She made me a nice dinner.</div><div>④ She made a nice dinner me.</div><div>⑤ She made my a nice dinner.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br>지금은 12시다.<div class=\"o\"><div>① It's 12 o'clock now.</div><div>② Now is 12 o'clock it.</div><div>③ They are 12 o'clock now.</div><div>④ This is 12 o'clock now.</div><div>⑤ There is 12 o'clock now.</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 밑줄 친 one이 가리키는 것이 바르게 연결되지 <b>않은</b> 것은?<div class=\"o\"><div>① There's <u>one</u> over there. – a cleaning robot</div><div>② She jumped on the smallest <u>one</u>. – chair</div><div>③ I really need <u>one</u> at home. – a book</div><div>④ I need to get a new <u>one</u>. – a phone</div><div>⑤ She ate the smallest <u>one</u>. – bowl of soup</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">통합</span> 짝지어진 대화가 <b>어색한</b> 것은?<div class=\"o\"><div>① A: What do you think about her selfies?<br>B: I think they were shocking.</div><div>② A: Goldilocks should say sorry.<br>B: You're right. She shouldn't apologize.</div><div>③ A: What's your opinion about social media?<br>B: I think it's useful but we should be careful.</div><div>④ A: I think Goldilocks was rude.<br>B: I agree. She broke the chair.</div><div>⑤ A: I think the bears were too angry.<br>B: I don't think so. Goldilocks did wrong things.</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">통합</span> 우리말을 영어로 바르게 옮긴 것은?<br>엄마곰은 화가 나서 외쳤다.<div class=\"o\"><div>① Mother Bear shouted angry.</div><div>② Mother Bear angry shouted.</div><div>③ Mother Bear was shouted angrily.</div><div>④ Mother Bear shouted angrily.</div><div>⑤ Mother Bear shouts angrily.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">사하중 학습지</span> 다음 영영풀이가 뜻하는 단어는?<br><i>a photograph that you take of yourself</i><div class=\"o\"><div>① post</div><div>② selfie</div><div>③ comment</div><div>④ follower</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">사하중 학습지</span> 빈칸에 알맞은 말은?<br>She jumped up in ______.<div class=\"o\"><div>① charge</div><div>② weather</div><div>③ surprise</div><div>④ permission</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">사하중 학습지</span> 빈칸에 알맞은 말은?<br>Goldilocks fell ______ in the smallest bed.<div class=\"o\"><div>① until</div><div>② without</div><div>③ asleep</div><div>④ upstairs</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 영작하시오. (Why don't you로 시작, 7단어)<br>그러면 전자책을 사는 게 어때?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> 우리말과 같도록 영작하시오. (like, to 포함, 7단어)<br>나는 내 방을 청소하는 것을 좋아하지 않아.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> Q의 답을 영어로 쓰시오. (She decided로 시작)<br>Q: What did Goldilocks decide to do?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> 우리말과 같도록 영작하시오. (without 포함, 6단어)<br>너는 우리의 허락 없이 이 사진들을 올렸다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 우리말과 같도록 영작하시오. (live, forever 포함, 5단어)<br>너의 게시물은 영원히 남아 있을 것이다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> <조건> 4형식, send 사용, 6단어<br>Goldilocks는 아빠곰에게 사과 편지를 보냈다. (a letter)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> <조건> It으로 시작, 거리 표현, 8단어<br>여기서 그 오두막까지는 3킬로미터이다. (the cottage)<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">서술형</span> 어법상 <b>틀린</b> 부분을 찾아 고친 문장 전체를 쓰시오.<br>There was three chairs in the cottage.<div class=\"ln\"></div><div class=\"ln\"></di 't like to clean my room.<br>B: Who does? Cleaning robots are perfect for people like us.</div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">대화문</span> 대화의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① The boy thinks cleaning robots are helpful.</div><div>② The boy really needs a cleaning robot at home.</div><div>③ The boy thinks cleaning robots are perfect for them.</div><div>④ There is a cleaning robot over there.</div><div>⑤ The girl likes to clean her room.</div></div></div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 우리말을 영어로 바르게 옮긴 것은?<br>엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.<div class=\"o\"><div>① Mother Bear finds a phone to Goldilocks.</div><div>② Mother Bear found a phone next to Goldilocks.</div><div>③ Mother Bear found a phone next of Goldilocks.</div><div>④ Mother Bear found a phone next Goldilocks.</div><div>⑤ Mother Bear founded a phone next to Goldilocks.</div></div></div><div class=\"pass\"><b>Goldilocks Learns Her Lesson ③</b><br>She took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and <u>fell asleep</u> in the smallest bed.<br>About an hour later, three bears came home.<br>“Someone ate my soup and broke my chair!” cried Baby Bear.<br>They went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.<br>“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.<br>Goldilocks jumped up in surprise.</div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① She found three beds upstairs.</div><div>② She fell asleep in the biggest bed.</div><div>③ The bears came home about an hour later.</div><div>④ Goldilocks posted all the selfies on social media.</div><div>⑤ Mother Bear found a phone next to Goldilocks.</div></div></div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 다음 질문 중 이야기를 읽고 답할 수 <b>없는</b> 것은?<div class=\"o\"><div iv>① She fell asleep in smallest bed.</div><div>② She falls asleep in a smallest bed.</div><div>③ She fell asleep in the smaller bed.</div><div>④ She fell asleep in the smallest bed.</div><div>⑤ She fell asleep in the most small bed.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 짝지어진 대화가 <b>어색한</b> 것은?<div class=\"o\"><div>① A: What's the date?<br>B: It's March 2nd.</div><div>② A: What's the date today?<br>B: It's May 5th.</div><div>③ A: What day is it today?<br>B: It's Friday.</div><div>④ A: What time is it?<br>B: It's 5 o'clock.</div><div>⑤ A: What time is it now?<br>B: It's Wednesday.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br>공원까지는 6킬로미터이다.<div class=\"o\"><div>① The park is it six kilometers.</div><div>② It's six kilometers to the park.</div><div>③ It has six kilometers to the park.</div><div>④ This is six kilometers to the park.</div><div>⑤ There is six kilometers to the park.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 다음 4형식 문장을 3형식으로 바르게 바꾼 것은?<br><br>Mom bought me a bike.<div class=\"o\"><div>① Mom bought a bike of me.</div><div>② Mom bought a bike for me.</div><div>③ Mom bought for me a bike.</div><div>④ Mom bought a bike to me.</div><div>⑤ Mom bought me for a bike.</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 밑줄 친 one이 가리키는 것이 바르게 연결되지 <b>않은</b> 것은?<div class=\"o\"><div>① There's <u>one</u> over there. – a cleaning robot</div><div>② She jumped on the smallest <u>one</u>. – chair</div><div>③ She ate the smallest <u>one</u>. – bowl of soup</div><div>④ I need to get a new <u>one</u>. – a phone</div><div>⑤ I really need <u>one</u> at home. – a book</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">통합</span> 어법상 <b>틀린</b> 문장은?<div class=\"o\"><div>① It's also cheaper than the paper book.</div><div>② Are you going to buy the book?</div><div>③ Why do v><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 두 문장을 so ~ that으로 바르게 연결한 것은?<br><br>The river is very beautiful. Many people take pictures of it.<div class=\"o\"><div>① So the river is beautiful that many people take pictures of it.</div><div>② The river is beautiful so that many people take pictures of it.</div><div>③ The river is too beautiful that many people take pictures of it.</div><div>④ The river is so beautiful that many people take pictures of it.</div><div>⑤ The river is such beautiful that many people take pictures of it.</div></div></div><div class=\"q\"><b class=\"n\">6.</b> <span class=\"ar\">본문</span> 다음 중 어법상 <b>어색한</b> 것은?<div class=\"o\"><div>① The toboggan slide was built in 1884.</div><div>② You can see a huge famous castle on your left.</div><div>③ It is so fast that you will feel like you are on a roller coaster.</div><div>④ A toboggan is a long narrow sled.</div><div>⑤ During you're sliding down, you can enjoy amazing views.</div></div></div><div class=\"pass\"><b>Delicious Treats</b><br>After all these exciting activities, I'm really hungry. There are many delicious treats to eat at the carnival. How about a cup of hot chocolate? It's always the perfect drink in cold weather. You also have to try maple taffy. It's made in a special way here. Let's learn <u>how to make</u> it. Pour hot maple syrup on the snow. Then place a stick on the syrup and quickly roll it around. Now, you have delicious maple taffy!<br>I hope you come and see me at the carnival. Oh, don't forget to check our website for more information. Bye!</div><div class=\"q\"><b class=\"n\">7.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Maple taffy is made in a special way here.</div><div>② Bonhomme hopes you come to the carnival.</div><div>③ Hot chocolate is a perfect drink in cold weather.</div><div>④ There are many delicious treats at the carnival.</div><div>⑤ You pour cold maple syrup on the snow.</div></div></div><div class=\"q\"><b class=\"n\">8.</b> <span class=\"ar\">본문</span> 글을 읽고 답할 수 <b>없는</b> 질문은?<div class=\"o\"><div>① What do you pour on the snow?</div><div>② What do you place on the syrup?</div><div>③ What should you check for more information?</div><div>④ What is the perfect drink in cold weather?</div><div>⑤ How much does maple taffy cost?</div></div></div><div class=\"pass\"><b>Ice Canoe Race</b><br>If you see a large crowd along the river, it's time to watch the Ice Canoe Race. This race is one of the best parts of the carnival, and you shouldn't miss it. Canoe teams have to race through the icy river for about three kilometers. Teams are usually made up of five members, and both men and women can join the team. Look! One team is stuck in the ice and can't move! The members have to push their canoe on the ice to get to the water. Phew! They are in the water again. I hope they can make it to the finish line. The race is <u>so exciting that</u> you will forget about the cold.</div><div class=\"q\"><b class=\"n\">9.</b> <span class=\"ar\">본문</span> 아이스 카누 경주에 대한 설명으로 알맞지 <b>않은</b> 것은?<div class=\"o\"><div>① The race is about three kilometers long.</div><div>② Teams race through the icy river.</div><div>③ Teams are usually made up of five members.</div><div>④ Only men can join the team.</div><div>⑤ It is one of the best parts of the carnival.</div></div></div><div class=\"q\"><b class=\"n\">10.</b> <span class=\"ar\">본문</span> 문맥상 낱말의 쓰임이 <b>어색한</b> 것은?<br><br>A toboggan is a long (a)<u>narrow</u> sled. If you like (b)<u>speed</u>, get on the toboggan. It is so (c)<u>slow</u> that you will feel like you are on a roller coaster. While you're (d)<u>sliding</u> down, you can enjoy (e)<u>amazing</u> views of Quebec.<div class=\"o\"><div>① (b)</div><div>② (c)</div><div>③ (d)</div><div>④ (a)</div><div>⑤ (e)</div></div></div><div class=\"q\"><b class=\"n\">11.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br><br>메이플 태피가 너무 맛있어서 나는 세 개를 먹었다.<div class=\"o\"><div>① Maple taffy was too delicious that I ate three.</div><div>② Maple taffy was so delicious that I ate three.</div><div>③ So maple taffy was delicious that I ate three.</div><div>④ Maple taffy was such delicious that I ate three.</div><div>⑤ Maple taffy was so delicious to eat three.</div></div></div><div class=\"q\"><b class=\"n\">12.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br><br>Bonhomme이 그 카니발에서 무엇을 해야 할지 알려 줄 것이다.<div class=\"o\"><div>① Bonhomme will tell you to what do at the carnival.</div><div>② Bonhomme will tell what you to do at the carnival.</div><div>③ Bonhomme will tell you what to do at the carnival.</div><div>④ Bonhomme will tell you what do at the carnival.</div><div>⑤ Bonhomme will tell you what doing at the carnival.</div></div></div><div class=\"q\"><b class=\"n\">13.</b> <span class=\"ar\">문법</span> 두 문장을 so ~ that으로 바르게 연결한 것은?<br><br>The snowman was very big. We couldn't see the palace behind it.<div class=\"o\"><div>① The snowman was so big that we couldn't see the palace behind it.</div><div>② So the snowman was big that we couldn't see the palace.</div><div>③ The snowman was such big that we couldn't see the palace.</div><div>④ The snowman was big so that we couldn't see the palace.</div><div>⑤ The snowman was too big that we couldn't see the palace.</div></div></div><div class=\"q\"><b class=\"n\">14.</b> <span class=\"ar\">문법</span> 우리말을 영어로 바르게 옮긴 것은?<br><br>체육 선생님께서 경기 전에 무엇을 할지 말씀해 주셨다.<div class=\"o\"><div>① The P.E. teacher told us what do before the game.</div><div>② The P.E. teacher told us why to do before the game.</div><div>③ The P.E. teacher told us what to do before the game.</div><div>④ The P.E. teacher told us how to do before the game.</div><div>⑤ The P.E. teacher told us to what do before the game.</div></div></div><div class=\"q\"><b class=\"n\">15.</b> <span class=\"ar\">통합</span> 본문의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Maple taffy is made with cold milk.</div><div>② The ice palace is made of ice and snow.</div><div>③ The toboggan slide is 200 meters long.</div><div>④ Bonhomme means “good man” in French.</div><div>⑤ Canoe teams race for about three kilometers.</div></div></div><div class=\"q\"><b class=\"n\">16.</b> <span class=\"ar\">통합</span> 밑줄 친 부분을 바르게 고친 것이 <b>아닌</b> 것은?<div class=\"o\"><div>① I don't know <u>why to</u> go. → why I should</div><div>② one of the best <u>part</u> → parted</div><div>③ It shines <u>beautiful</u>. → beautifully</div><div>④ I'm looking forward to <u>see</u> you. → seeing</div><div>⑤ The slide <u>built</u> in 1884. → was built</div></div></div><div class=\"q\"><b class=\"n\">17.</b> <span class=\"ar\">통합</span> 우리말을 영어로 바르게 옮기지 <b>않은</b> 것은?<div class=\"o\"><div>① 너는 보령에 가 본 적 있니? → Have you ever been to Boryeong?</div><div>② 그것은 너무 빨라서 무섭다. → It is so fast that it's scary.</div><div>③ 나는 그것을 맛보기를 기대한다. → I'm looking forward to tasting it.</div><div>④ 새 궁전이 매년 지어진다. → A new palace builds every year.</div><div>⑤ 무엇을 할지 보여 줄게. → I'll show you what to do.</div></div></div><div class=\"q\"><b class=\"n\">18.</b> <span class=\"ar\">통합</span> 어법상 올바른 것은?<div class=\"o\"><div>① Let's learn how make it.</div><div>② This is one of the best part.</div><div>③ I'm looking forward to see you.</div><div>④ The carnival holds for 10 days.</div><div>⑤ It is so fast that you will feel like you are on a roller coaster.</div></div></div><div class=\"q\"><b class=\"n\">19.</b> <span class=\"ar\">통합</span> 짝지어진 대화가 <b>어색한</b> 것은?<div class=\"o\"><div>① A: Have you ever tried ice fishing?<br>B: Yes, I have.</div><div>② A: Where did you pick them?<br>B: At a farm.</div><div>③ A: Have you ever been to Boryeong?<br>B: No, I haven't.</div><div>④ A: Do you have any plans this weekend?<br>B: Yes, I have.</div><div>⑤ A: I'm going camping this weekend.<br>B: That sounds fun!</div></div></div><div class=\"q\"><b class=\"n\">20.</b> <span class=\"ar\">통합</span> 빈칸에 들어갈 수 <b>없는</b> 것은?<br><br>I don't know ______ to do.<div class=\"o\"><div>① when</div><div>② where</div><div>③ why</div><div>④ what</div><div>⑤ how</div></div></div><div class=\"sec\" style=\"break-before:column\">서술형 (1~10)</div><div class=\"q\"><b class=\"n\">서술형 1.</b> <span class=\"ar\">대화문</span> participate를 사용하여 영작하시오. (last week 포함)<br>나는 지난주에 한 농장에서 딸기 따기 행사에 참여했어.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 2.</b> <span class=\"ar\">대화문</span> look을 사용하여 영작하시오. (really 포함, I'm으로 시작)<br>나는 Emily와 도시를 걸어 다니는 것이 정말 기대돼.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 3.</b> <span class=\"ar\">본문</span> so ~ that을 사용하여 영작하시오. (The race로 시작)<br>그 경주는 너무 흥미진진해서 당신은 추위를 잊을 거예요.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 4.</b> <span class=\"ar\">본문</span> to부정사를 사용하여 영작하시오. (There are로 시작)<br>카니발에는 먹을 맛있는 간식들이 많이 있다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 5.</b> <span class=\"ar\">본문</span> 부정명령문으로 영작하시오.<br>더 많은 정보를 위해 우리 웹사이트를 확인하는 것을 잊지 마세요.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 6.</b> <span class=\"ar\">문법</span> 의문사 + to부정사와 so ~ that을 모두 사용하여 영작하시오. (두 문장)<br>나는 터보건 타는 법을 배웠다. 그것은 너무 빨라서 나는 소리를 질렀다.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 7.</b> <span class=\"ar\">문법</span> 틀린 부분 2개를 고쳐 문장 전체를 다시 쓰시오.<br>The palace is make of ice, and it is such beautiful that people love it.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 8.</b> <span class=\"ar\">서술형</span> so ~ that을 사용하여 한 문장으로 쓰시오.<br>The ice palace is very beautiful. Many people take pictures of it.<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 9.</b> <span class=\"ar\">서술형</span> 영어로 답하시오. (They have to로 시작)<br>Q: What do the members of the stuck team have to do?<div class=\"ln\"></div><div class=\"ln\"></div></div><div class=\"q\"><b class=\"n\">서술형 10.</b> <span class=\"ar\">서술형</span> so ~ that을 사용하여 영작하시오.<br>메이플 태피는 너무 맛있어서 나는 하나 더 먹었다.<div class=\"ln\"></div><div class=\"ln\"></div></div></div>","m2yun_saha_l8":"<div class=\"cols\"><div class=\"sec\">객관식 (1~20)</div><div class=\"q\"><b class=\"n\">1.</b> <span class=\"ar\">본문</span> 두 문장을 so ~ that으로 바르게 연결한 것은?<br><br>The jungle was very quiet. We could hear our breathing.<div class=\"o\"><div>① So the jungle was quiet that we could hear our breathing.</div><div>② The jungle was such quiet that we could hear our breathing.</div><div>③ The jungle was quiet so that we could hear our breathing.</div><div>④ The jungle was so that quiet we could hear our breathing.</div><div>⑤ The jungle was so quiet that we could hear our breathing.</div></div></div><div class=\"q\"><b class=\"n\">2.</b> <span class=\"ar\">본문</span> 다음 중 어법상 <b>어색한</b> 것은?<div class=\"o\"><div>① He answered without thinking.</div><div>② They walked without making a sound.</div><div>③ She went out without eating breakfast.</div><div>④ Travis stared at Eckels without saying anything.</div><div>⑤ He left without say goodbye.</div></div></div><div class=\"q\"><b class=\"n\">3.</b> <span class=\"ar\">본문</span> 다음 중 어법상 <b>어색한</b> 것은?<div class=\"o\"><div>① It was so quiet that we heard a bird.</div><div>② The roar was so loud that everyone ran.</div><div>③ He was such terrified that he left the path.</div><div>④ He was so scared that he ran away.</div><div>⑤ She was so tired that she fell asleep.</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ⑤</b><br>Travis and the other travelers returned safely to the machine and found Eckels inside.<br>“You put all of us in danger,” said Travis to Eckels in an angry voice. “You left the path.”<br>“I'm sorry, but I didn't kill anything,” said Eckels. “There's only a little mud on my shoes.”<br>Travis stared at Eckels for a long time without saying anything.<br>“Let's go home,” said Travis finally.<br>The machine stopped. They all returned to the present safely.<br>“Is everything okay here?” asked Travis.<br>“Fine. Welcome home!” said Mr. Parker.</div><div class=\"q\"><b class=\"n\">4.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Eckels had some mud on his shoes.</div><div>② Travis said many things to Eckels for a long time.</div><div>③ Eckels said he didn't kill anything.</div><div>④ Eckels was already inside the machine.</div><div>⑤ Travis spoke in an angry voice.</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ④</b><br>“I can't breathe,” said Eckels. “Get me out of here!”<br>“Don't panic, Eckels,” said Travis. “Turn around, and walk quietly back to the machine.”<br>Eckels turned around and started to run. He was <u>so terrified that</u> he left the path by accident.<br>“Eckels!” shouted Travis. “Don't leave the path!”<br>The T. rex heard Travis and turned its head toward him and the other travelers. There was a moment of silence. Then, it suddenly started to run toward them with a loud roar.<br>“Run, everybody! Run!” shouted Travis.</div><div class=\"q\"><b class=\"n\">5.</b> <span class=\"ar\">본문</span> 글의 내용과 일치하지 <b>않는</b> 것은?<div class=\"o\"><div>① Eckels left the path on purpose.</div><div>② The T. rex turned its head toward Travis.</div><div>③ The T. rex ran toward them with a loud roar.</div><div>④ Eckels said he couldn't breathe.</div><div>⑤ Eckels started to run instead of walking.</div></div></div><div class=\"pass\"><b>A Butterfly That Changed the Future ⑥</b><br>Eckels looked around the room carefully. Everything looked the same, except the big sign on the wall. The sign now said, “NAIM ANY YEER EN THE PAST. WEE TAEK YU THAIR.” Eckels was confused.<br>Then, he saw the TV. The new president was on the news, but it was not Mr. Keith. “What's going on?” He got more confused.<br>He sat down and looked closely at the mud on his shoes.<br>“No, it can't be,” said Eckels. “It's all because of this little thing?”
